# Documentation Drift Detection
#
# Ensures CLI and MCP reference documentation stays in sync with implementation.
# Fails if committed docs differ from auto-generated output.
#
# Run manually: gh workflow run docs-drift.yml
# Or triggered on: push to main, PRs touching CLI/MCP code

name: Documentation Drift Detection

on:
  push:
    branches: [main]
    paths:
      - 'vibey/cli/**'
      - 'vibey/mcp/**'
      - 'vibey/operations/docs/**'
      - 'docs/reference/CLI_REFERENCE.md'
      - 'docs/reference/MCP_REFERENCE.md'
  pull_request:
    branches: [main]
    paths:
      - 'vibey/cli/**'
      - 'vibey/mcp/**'
      - 'vibey/operations/docs/**'
      - 'docs/reference/CLI_REFERENCE.md'
      - 'docs/reference/MCP_REFERENCE.md'
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-cli-drift:
    name: Check CLI Documentation Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check for CLI documentation drift
        run: |
          echo "Checking CLI documentation for drift..."
          vibey docs check-drift -q

      - name: Report CLI drift (on failure)
        if: failure()
        run: |
          echo "::error::CLI documentation has drifted from implementation!"
          echo ""
          echo "The committed docs/reference/CLI_REFERENCE.md differs from"
          echo "what would be generated from the current CLI code."
          echo ""
          echo "To fix this locally, run:"
          echo "  vibey docs generate-cli"
          echo ""
          echo "Then commit and push the updated documentation."

      - name: Generate artifact on drift
        if: failure()
        run: |
          vibey docs generate-cli -o /tmp/CLI_REFERENCE_FRESH.md
          echo "Fresh documentation saved to artifact"

      - name: Upload fresh CLI docs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-reference-fresh
          path: /tmp/CLI_REFERENCE_FRESH.md
          retention-days: 7

  check-mcp-drift:
    name: Check MCP Documentation Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check for MCP documentation drift
        run: |
          echo "Checking MCP documentation for drift..."
          vibey docs check-mcp-drift -q

      - name: Report MCP drift (on failure)
        if: failure()
        run: |
          echo "::error::MCP documentation has drifted from implementation!"
          echo ""
          echo "The committed docs/reference/MCP_REFERENCE.md differs from"
          echo "what would be generated from the current MCP server code."
          echo ""
          echo "To fix this locally, run:"
          echo "  vibey docs generate-mcp"
          echo ""
          echo "Then commit and push the updated documentation."

      - name: Generate artifact on drift
        if: failure()
        run: |
          vibey docs generate-mcp -o /tmp/MCP_REFERENCE_FRESH.md
          echo "Fresh documentation saved to artifact"

      - name: Upload fresh MCP docs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-reference-fresh
          path: /tmp/MCP_REFERENCE_FRESH.md
          retention-days: 7
