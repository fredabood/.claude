name: CLI/MCP Parity Check

on:
  push:
    branches: [main]
    paths:
      - 'vibey/unified/**'
      - 'vibey/cli/**'
      - 'vibey/mcp/**'
  pull_request:
    branches: [main]
    paths:
      - 'vibey/unified/**'
      - 'vibey/cli/**'
      - 'vibey/mcp/**'

jobs:
  parity-check:
    name: Verify CLI/MCP Parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run parity check
        run: |
          echo "Running CLI/MCP parity check..."
          vibey parity check --verbose

      - name: Generate parity report
        if: always()
        run: |
          echo "Generating detailed parity report..."
          vibey parity report --format json > parity-report.json
          cat parity-report.json

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.json
          retention-days: 30

      - name: Check for undocumented exclusions
        run: |
          echo "Checking for undocumented interface exclusions..."
          # Run in strict mode - warnings become errors
          vibey parity check --strict || {
            echo "::warning::Some commands have undocumented interface exclusions"
            echo "Please add exclusion_reason to @unified_command for single-interface commands"
          }

      - name: Comment PR with parity status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('parity-report.json', 'utf8'));
            } catch (e) {
              console.log('Could not read parity report');
              return;
            }

            const status = report.is_passing ? '✅ PASS' : '❌ FAIL';
            const body = `## CLI/MCP Parity Check ${status}

            | Metric | Count |
            |--------|-------|
            | Total unified commands | ${report.total_commands} |
            | Both interfaces | ${report.both_interfaces_commands.length} |
            | CLI only | ${report.cli_only_commands.length} |
            | MCP only | ${report.mcp_only_commands.length} |
            | Violations | ${report.violations.length} |

            ${report.violations.length > 0 ? '### Violations\n' + report.violations.map(v => `- **${v.command_name}**: ${v.description}`).join('\n') : ''}

            <details>
            <summary>Commands intentionally excluded</summary>

            ${Object.entries(report.excluded_commands).map(([cmd, reason]) => `- **${cmd}**: ${reason}`).join('\n') || 'None'}
            </details>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
