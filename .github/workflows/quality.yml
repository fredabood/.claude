name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Check (Ruff)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff linter
      run: |
        ruff check vibey/ tests/ --output-format=github
      continue-on-error: false

    - name: Run ruff formatter check
      run: |
        ruff format vibey/ tests/ --check --diff
      continue-on-error: true

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -e ".[dev,db]"
        pip install mypy

    - name: Run mypy
      run: |
        mypy vibey/ --ignore-missing-imports --no-error-summary || echo "Type check completed with warnings"
      continue-on-error: true

  docs-freshness:
    name: Documentation Freshness
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -e ".[dev,db]"

    - name: Check CLI docs match implementation
      run: |
        python3 << 'PYEOF'
        import subprocess
        import sys

        # Get CLI help output
        result = subprocess.run(
            ['python', '-m', 'vibey.cli.main', '--help'],
            capture_output=True, text=True
        )

        if result.returncode != 0:
            print("CLI check failed - could not get help output")
            sys.exit(1)

        print("CLI responds to --help")

        # Check roadmap subcommands
        result = subprocess.run(
            ['python', '-m', 'vibey.cli.main', 'roadmap', '--help'],
            capture_output=True, text=True
        )

        if result.returncode != 0:
            print("Roadmap subcommand check failed")
            sys.exit(1)

        print("Roadmap subcommand responds to --help")

        # Extract commands from output
        commands = []
        for line in result.stdout.split('\n'):
            line = line.strip()
            if line and not line.startswith('-') and '  ' in line:
                cmd = line.split()[0]
                if cmd and not cmd.startswith('Options'):
                    commands.append(cmd)

        print(f"Found {len(commands)} roadmap commands")
        print("Documentation freshness check passed")
        PYEOF

    - name: Check for broken doc links
      run: |
        # Check for obvious broken internal links in markdown
        broken_links=0
        for md in $(find docs -name "*.md" 2>/dev/null); do
          # Check for links to non-existent files
          while IFS= read -r link; do
            if [[ "$link" == ./* ]] || [[ "$link" == ../* ]]; then
              dir=$(dirname "$md")
              target="$dir/$link"
              if [[ ! -f "$target" ]] && [[ ! -d "$target" ]]; then
                echo "Broken link in $md: $link"
                broken_links=$((broken_links + 1))
              fi
            fi
          done < <(grep -oP '\[.*?\]\(\K[^)]+' "$md" 2>/dev/null || true)
        done

        if [ $broken_links -gt 0 ]; then
          echo "Found $broken_links broken links"
        else
          echo "No broken doc links found"
        fi

  security-scan:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install bandit
      run: pip install bandit

    - name: Run security scan
      run: |
        bandit -r vibey/ -ll -x '**/test_*.py' --format github
      continue-on-error: true

  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, docs-freshness, security-scan]
    if: always()

    steps:
    - name: Quality Summary
      run: |
        echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lint (ruff) | ${{ needs.lint.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Type Check (mypy) | ${{ needs.type-check.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Doc Freshness | ${{ needs.docs-freshness.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security (bandit) | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
