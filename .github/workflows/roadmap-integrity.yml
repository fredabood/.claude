name: Roadmap Integrity

# Task: git-integration-5-task-009
# Verifies that roadmap changes have corresponding activity log entries
# This is the server-side enforcement layer for CLI-only modifications

on:
  push:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**/*.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**/*.yaml'

jobs:
  verify-activity-log:
    name: Verify Activity Log Entries
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for commit range

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Vibey framework
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Determine commit range
        id: commit-range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare against base branch
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            echo "range=${BASE_SHA}..${HEAD_SHA}" >> $GITHUB_OUTPUT
            echo "Verifying PR commits: ${BASE_SHA}..${HEAD_SHA}"
          else
            # For pushes, compare against before commit
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              # New branch - verify last commit only
              echo "range=HEAD~1..HEAD" >> $GITHUB_OUTPUT
              echo "New branch: verifying HEAD only"
            else
              echo "range=${{ github.event.before }}..${{ github.sha }}" >> $GITHUB_OUTPUT
              echo "Verifying push: ${{ github.event.before }}..${{ github.sha }}"
            fi
          fi

      - name: Verify roadmap integrity
        id: verify
        run: |
          echo "Running: vibey roadmap verify-commits ${{ steps.commit-range.outputs.range }}"
          vibey roadmap verify-commits "${{ steps.commit-range.outputs.range }}" --json > verification-result.json 2>&1
          exit_code=$?

          cat verification-result.json

          # Extract summary
          if [ $exit_code -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

          exit $exit_code
        continue-on-error: true

      - name: Create verification summary
        if: always()
        run: |
          cat > verification-summary.md << 'EOF'
          ## 🔐 Roadmap Integrity Verification

          **Status:** ${{ steps.verify.outputs.status == 'success' && '✅ All changes verified' || '❌ Unverified changes detected' }}

          EOF

          if [ -f verification-result.json ]; then
            echo '### Verification Details' >> verification-summary.md
            echo '' >> verification-summary.md
            echo '```json' >> verification-summary.md
            cat verification-result.json >> verification-summary.md
            echo '```' >> verification-summary.md
          fi

          echo '' >> verification-summary.md
          echo '### What This Means' >> verification-summary.md
          echo '' >> verification-summary.md

          if [ "${{ steps.verify.outputs.status }}" = "success" ]; then
            echo 'All roadmap file changes in this commit range have corresponding activity log entries.' >> verification-summary.md
            echo 'This confirms changes were made through the Vibey CLI.' >> verification-summary.md
          else
            echo '**Some roadmap files were modified without using the Vibey CLI.**' >> verification-summary.md
            echo '' >> verification-summary.md
            echo 'To fix this:' >> verification-summary.md
            echo '1. Revert the manual changes' >> verification-summary.md
            echo '2. Use `vibey roadmap` commands to make the changes' >> verification-summary.md
            echo '3. Commit and push again' >> verification-summary.md
            echo '' >> verification-summary.md
            echo 'Example commands:' >> verification-summary.md
            echo '```bash' >> verification-summary.md
            echo 'vibey roadmap start <task-id>        # Start a task' >> verification-summary.md
            echo 'vibey roadmap complete <task-id>     # Complete a task' >> verification-summary.md
            echo 'vibey roadmap update task <id> ...   # Update task fields' >> verification-summary.md
            echo '```' >> verification-summary.md
          fi

          cat verification-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if issues found)
        if: github.event_name == 'pull_request' && steps.verify.outputs.status != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('verification-summary.md', 'utf8');

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Roadmap Integrity Verification')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-verification-report
          path: |
            verification-result.json
            verification-summary.md
          retention-days: 30

      - name: Fail if verification failed
        if: steps.verify.outputs.status != 'success'
        run: |
          echo "❌ Roadmap integrity verification failed"
          echo ""
          echo "Some roadmap files were modified without using the Vibey CLI."
          echo "Please use 'vibey roadmap' commands to make changes."
          echo ""
          echo "For help: vibey roadmap --help"
          exit 1
