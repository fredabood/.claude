name: Roadmap Data Validation

on:
  push:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**/*.yaml'
      - 'tests/validation/**'
      - 'vibey/roadmap/**'
      - 'vibey/cli/roadmap_lib/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**/*.yaml'
      - 'tests/validation/**'
      - 'vibey/roadmap/**'
      - 'vibey/cli/roadmap_lib/**'

jobs:
  validate-yaml:
    name: Validate Roadmap YAML Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyyaml

      - name: Schema validation (BLOCKING)
        run: |
          echo "Running comprehensive schema validation..."
          python scripts/validate-roadmap-schema.py
          if [ $? -ne 0 ]; then
            echo "❌ Schema validation failed"
            echo "Run locally: python scripts/validate-roadmap-schema.py --verbose"
            exit 1
          fi
          echo "✅ All roadmap files passed schema validation"

      - name: Health score check
        continue-on-error: true  # Warning only - don't block on health score yet
        run: |
          echo "Checking roadmap health score..."
          python scripts/roadmap-health-dashboard.py --json > metrics.json || true
          if [ -f metrics.json ]; then
            score=$(python -c "import json; print(json.load(open('metrics.json')).get('overall_health_score', 0))" 2>/dev/null || echo "0")
            echo "📊 Current health score: $score"
            if (( $(echo "$score < 90" | bc -l 2>/dev/null || echo "0") )); then
              echo "⚠️  Health score below recommended threshold (90): $score"
              echo "This is a warning - not blocking the build yet"
            else
              echo "✅ Health score meets threshold"
            fi
          else
            echo "⚠️  Could not generate health metrics"
          fi

      - name: Run YAML syntax validation
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestYAMLSyntax -v --tb=short

      - name: Run Python serialization check
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestPythonSerialization -v --tb=short

      - name: Run schema validation (pytest)
        continue-on-error: true  # Supplementary - main validation is above
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestSchemaValidation -v --tb=short

      - name: Run dependency integrity check
        continue-on-error: true  # Don't fail CI on dependency issues (warn only)
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestDependencyIntegrity -v --tb=short

      - name: Run structural integrity check
        continue-on-error: true  # Don't fail CI on structural issues (warn only)
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestStructuralIntegrity -v --tb=short

      - name: Generate validation report
        if: always()
        run: |
          echo "## Roadmap Validation Report" > validation-report.md
          echo "" >> validation-report.md
          echo "### Summary" >> validation-report.md
          pytest tests/validation/test_yaml_integrity.py -v --tb=no | tee -a validation-report.md || true

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Roadmap Validation Failed\n\n${report}\n\nPlease fix the YAML integrity issues before merging.`
            });

  pre-commit-check:
    name: Verify Pre-commit Hook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Python serialization in YAML files
        run: |
          if grep -r "!!python" .vibey/roadmap/ 2>/dev/null; then
            echo "❌ ERROR: Python object serialization found in roadmap YAML files"
            echo "Fix: Replace enum objects with .value before serialization"
            exit 1
          else
            echo "✅ PASS: No Python serialization in roadmap YAML files"
          fi
