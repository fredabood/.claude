name: Roadmap Validation

on:
  push:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**'
      - 'vibey/operations/roadmap/**'
      - 'vibey/cli/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**'
      - 'vibey/operations/roadmap/**'
      - 'vibey/cli/**'

jobs:
  fast-validation:
    name: Fast Validation (Syntax & Schema)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Vibey framework
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run fast validation (standard profile)
        run: |
          echo "Running fast validation on all roadmap files..."
          python -m vibey.cli.main roadmap validate-fast --profile standard --verbose
        continue-on-error: false

      - name: Upload validation cache
        if: success()
        uses: actions/cache/save@v3
        with:
          path: ~/.vibey-validation-cache
          key: validation-cache-${{ github.sha }}

  advanced-validation:
    name: Advanced Validation (Integrity Checks)
    runs-on: ubuntu-latest
    needs: fast-validation
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Vibey framework
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run advanced validation
        id: advanced
        run: |
          echo "Running advanced integrity checks..."
          python -m vibey.cli.main roadmap validate-advanced --verbose > validation-output.txt 2>&1
          exit_code=$?
          cat validation-output.txt

          # Extract issue counts
          circular=$(grep -c "Circular dependency" validation-output.txt || echo "0")
          orphans=$(grep -c "Orphaned task" validation-output.txt || echo "0")
          broken=$(grep -c "Broken reference" validation-output.txt || echo "0")
          progress=$(grep -c "Progress counter mismatch" validation-output.txt || echo "0")

          echo "circular_deps=$circular" >> $GITHUB_OUTPUT
          echo "orphaned_tasks=$orphans" >> $GITHUB_OUTPUT
          echo "broken_refs=$broken" >> $GITHUB_OUTPUT
          echo "progress_mismatches=$progress" >> $GITHUB_OUTPUT

          exit $exit_code
        continue-on-error: true

      - name: Create validation summary
        if: always()
        run: |
          cat > validation-summary.md << 'EOF'
          ## 🔍 Advanced Validation Results

          **Status:** ${{ steps.advanced.outcome == 'success' && '✅ All checks passed' || '❌ Issues detected' }}

          ### Issue Summary

          - 🔄 Circular dependencies: ${{ steps.advanced.outputs.circular_deps }}
          - 👻 Orphaned tasks: ${{ steps.advanced.outputs.orphaned_tasks }}
          - 🔗 Broken references: ${{ steps.advanced.outputs.broken_refs }}
          - 📊 Progress mismatches: ${{ steps.advanced.outputs.progress_mismatches }}

          ### Details

          See full validation output below:

          EOF

          echo '```' >> validation-summary.md
          cat validation-output.txt >> validation-summary.md
          echo '```' >> validation-summary.md

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-validation-report
          path: |
            validation-output.txt
            validation-summary.md
          retention-days: 30

      - name: Comment on PR (if issues found)
        if: github.event_name == 'pull_request' && steps.advanced.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('validation-summary.md', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

      - name: Fail job if issues found
        if: steps.advanced.outcome != 'success'
        run: |
          echo "❌ Advanced validation found integrity issues"
          echo "Run locally: vibey roadmap validate-advanced --verbose"
          echo "Auto-repair: vibey roadmap repair --all --dry-run"
          exit 1

  auto-repair-check:
    name: Auto-Repair Feasibility Check
    runs-on: ubuntu-latest
    needs: advanced-validation
    if: failure()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Vibey framework
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check what can be auto-repaired
        run: |
          echo "Checking which issues can be automatically repaired..."
          python -m vibey.cli.main roadmap repair --all --dry-run > repair-preview.txt 2>&1 || true

          cat > repair-summary.md << 'EOF'
          ## 🔧 Auto-Repair Preview

          The following issues can be automatically repaired:

          EOF

          echo '```' >> repair-summary.md
          cat repair-preview.txt >> repair-summary.md
          echo '```' >> repair-summary.md

          echo "" >> repair-summary.md
          echo "**To apply repairs:**" >> repair-summary.md
          echo '```bash' >> repair-summary.md
          echo "vibey roadmap repair --progress  # Fix progress counters only" >> repair-summary.md
          echo "vibey roadmap repair --all       # Fix all issues (with confirmation)" >> repair-summary.md
          echo '```' >> repair-summary.md

      - name: Upload repair preview
        uses: actions/upload-artifact@v4
        with:
          name: auto-repair-preview
          path: repair-summary.md
          retention-days: 30

      - name: Comment repair preview on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('repair-summary.md', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });

  schema-compliance:
    name: Schema Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Check schema compliance
        run: |
          python3 << 'PYEOF'
          import yaml
          from pathlib import Path
          from collections import defaultdict

          issues = []
          roadmap_dir = Path('.vibey/roadmap')

          for yaml_file in roadmap_dir.rglob('*.yaml'):
              try:
                  with open(yaml_file) as f:
                      data = yaml.safe_load(f)

                  if data is None:
                      continue

                  rel_path = str(yaml_file.relative_to(roadmap_dir))

                  # Check sprint.yaml task arrays
                  if yaml_file.name == 'sprint.yaml':
                      sprint = data.get('sprint', {})
                      for task in sprint.get('tasks', []):
                          task_id = task.get('id', 'unknown')
                          if 'name' in task and 'title' not in task:
                              issues.append(f"{rel_path}: Task '{task_id}' uses 'name' instead of 'title'")
                          if 'type' in task and 'task_type' not in task:
                              issues.append(f"{rel_path}: Task '{task_id}' uses 'type' instead of 'task_type'")

                  # Check task.yaml files
                  elif yaml_file.name == 'task.yaml':
                      task = data.get('task', {})
                      if 'name' in task and 'title' not in task:
                          issues.append(f"{rel_path}: Uses 'name' instead of 'title'")
                      if 'type' in task and 'task_type' not in task:
                          issues.append(f"{rel_path}: Uses 'type' instead of 'task_type'")

              except Exception as e:
                  issues.append(f"{yaml_file}: Error - {e}")

          if issues:
              print("❌ Schema compliance issues found:")
              for issue in issues[:20]:
                  print(f"  - {issue}")
              if len(issues) > 20:
                  print(f"  ... and {len(issues) - 20} more issues")
              print(f"\nTotal: {len(issues)} issues")
              print("\nRun 'vibey roadmap repair --all' to fix these issues")
              exit(1)
          else:
              print("✅ All roadmap files are schema-compliant")
          PYEOF

  legacy-validation:
    name: Legacy Validation (Pytest)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyyaml

      - name: Run legacy pytest validation
        run: |
          pytest tests/validation/test_yaml_integrity.py -v --tb=short || true

      - name: Check for Python serialization
        run: |
          if grep -r "!!python" .vibey/roadmap/ 2>/dev/null; then
            echo "⚠️  WARNING: Python object serialization found in roadmap YAML files"
            echo "This is not a blocker but should be cleaned up"
          else
            echo "✅ No Python serialization in roadmap YAML files"
          fi
