name: Roadmap Data Validation

on:
  push:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**/*.yaml'
      - 'tests/validation/**'
      - 'vibey/roadmap/**'
      - 'vibey/cli/roadmap_lib/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.vibey/roadmap/**/*.yaml'
      - 'tests/validation/**'
      - 'vibey/roadmap/**'
      - 'vibey/cli/roadmap_lib/**'

jobs:
  validate-yaml:
    name: Validate Roadmap YAML Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pyyaml

      - name: Run YAML syntax validation
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestYAMLSyntax -v --tb=short

      - name: Run Python serialization check
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestPythonSerialization -v --tb=short

      - name: Run schema validation
        continue-on-error: true  # Don't fail CI on schema violations (warn only)
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestSchemaValidation -v --tb=short

      - name: Run dependency integrity check
        continue-on-error: true  # Don't fail CI on dependency issues (warn only)
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestDependencyIntegrity -v --tb=short

      - name: Run structural integrity check
        continue-on-error: true  # Don't fail CI on structural issues (warn only)
        run: |
          pytest tests/validation/test_yaml_integrity.py::TestStructuralIntegrity -v --tb=short

      - name: Generate validation report
        if: always()
        run: |
          echo "## Roadmap Validation Report" > validation-report.md
          echo "" >> validation-report.md
          echo "### Summary" >> validation-report.md
          pytest tests/validation/test_yaml_integrity.py -v --tb=no | tee -a validation-report.md || true

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ Roadmap Validation Failed\n\n${report}\n\nPlease fix the YAML integrity issues before merging.`
            });

  pre-commit-check:
    name: Verify Pre-commit Hook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Python serialization in YAML files
        run: |
          if grep -r "!!python" .vibey/roadmap/ 2>/dev/null; then
            echo "❌ ERROR: Python object serialization found in roadmap YAML files"
            echo "Fix: Replace enum objects with .value before serialization"
            exit 1
          else
            echo "✅ PASS: No Python serialization in roadmap YAML files"
          fi
