# Pre-commit hooks for Vibey Framework
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3
        args: ['--line-length=120']

  # Python import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: Sort Python imports with isort
        args: ['--profile=black']

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        name: Lint Python code with Flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503']

  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax
        args: ['--safe']
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']

  # Run fast unit tests on commit
  - repo: local
    hooks:
      - id: pytest-unit
        name: Run unit tests
        entry: pytest
        args: ['tests/unit/', '-x', '--tb=short', '-q']
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-coverage-check
        name: Check test coverage
        entry: pytest
        args: ['tests/unit/', '--cov=tests/utils', '--cov-fail-under=80', '-q']
        language: system
        pass_filenames: false
        stages: [push]
