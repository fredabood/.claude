# Implementation Mode Configuration
# Vibey Framework - Autonomous Task Execution
# Version: 1.0
#
# This configuration controls the behavior of the autonomous implementation loop,
# which processes roadmap tasks with minimal human intervention.
#
# Location: .vibey/config/implement.yaml
# Documentation: https://docs.vibey.dev/implementation-mode

implement:
  # ==========================================================================
  # EXECUTION LIMITS
  # ==========================================================================
  # These settings control resource consumption during autonomous execution.
  # Set to null for unlimited (use with caution).

  defaults:
    # Maximum number of tasks to execute in a single session
    # Set to null for unlimited
    max_tasks_per_session: 10

    # Maximum total tokens (input + output) to consume per session
    # Set to null for unlimited
    max_tokens_per_session: 100000

    # Maximum tokens for a single task execution
    # This prevents runaway tasks from consuming too many resources
    max_tokens_per_task: 25000

    # Timeout in seconds for each task
    # Task will be cancelled if it exceeds this duration
    timeout_per_task: 600  # 10 minutes

  # ==========================================================================
  # RETRY BEHAVIOR
  # ==========================================================================
  # Configuration for handling transient failures.

  retry:
    # Maximum retry attempts per task
    max_retries: 2

    # Conditions that trigger a retry
    # Supported: timeout, rate_limit, network_error, api_error
    retry_on:
      - timeout
      - rate_limit

    # Conditions that skip retry and block the task
    # These typically indicate fundamental issues that won't be fixed by retrying
    # Supported: syntax_error, import_error, validation_error, permission_error
    skip_on:
      - syntax_error
      - import_error

  # ==========================================================================
  # TASK SELECTION
  # ==========================================================================
  # Controls how tasks are selected from the roadmap.

  selection:
    # Order in which to process task priorities
    # Tasks with earlier priorities in this list are selected first
    priority_order:
      - critical
      - high
      - medium
      - low

    # When true, prefer simpler/smaller tasks over complex ones
    # This improves success rate and provides faster feedback
    prefer_smaller_tasks: true

    # Complexity levels to exclude from autonomous execution
    # Very complex tasks may require human oversight
    exclude_complexity:
      - very_complex

  # ==========================================================================
  # AGENT CONFIGURATION
  # ==========================================================================
  # Settings for the AI agent that executes tasks.

  agent:
    # Model to use for task execution
    # Recommended: claude-sonnet-4-20250514 for balance of speed and quality
    # Alternative: claude-opus-4-20250514 for complex tasks
    model: claude-sonnet-4-20250514

    # Skip permission prompts for file operations
    # WARNING: Only enable in trusted environments
    dangerously_skip_permissions: true

    # Print agent output to console during execution
    print_output: true

    # Maximum conversation turns per task
    # Prevents infinite loops in agent execution
    max_turns: 50
