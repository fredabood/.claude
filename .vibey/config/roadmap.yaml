backend: auto
database:
  path: .vibey/roadmap.db
  validate_on_load: true
  fallback_to_yaml: true
auto_progression:
  enabled: false
  mode: check
  transitions:
  - from: not_started
    to: in_progress
    when: all_start_criteria_met
  - from: in_progress
    to: completed
    when: all_completion_criteria_met
  propagate_up: true
  log_to_audit: true
