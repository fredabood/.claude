  key_findings:
    - CLI dashboard is most practical for MVP (no hosting needed)
    - Health score can be computed from 6 weighted metrics
    - Alert thresholds should have 3 tiers (critical, warning, info)
    - GitHub Pages is good intermediate solution before Grafana

  dashboard_sections:
    - Repository Health Summary (overall score, trends)
