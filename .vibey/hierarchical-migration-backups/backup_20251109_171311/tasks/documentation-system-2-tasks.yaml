- id: documentation-system-2-task-004
  sprint_id: documentation-system-2
  track_id: documentation-system
  roadmap_id: vibey-framework-v2
  task_type: development
  title: Add documentation synchronization CLI commands
  description: 'Implement CLI commands for manual and automatic documentation

    synchronization.


    Implementation:

    - Add vibey roadmap sync-docs command

    - Support --all flag (sync everything)

    - Support --track flag (sync specific track)

    - Support --sprint flag (sync specific sprint)

    - Support --summaries-only flag

    - Support --dry-run flag (preview changes)

    - Show sync summary (files copied, skipped, errors)


    Acceptance Criteria:

    - All sync commands work correctly

    - Dry-run shows accurate preview

    - Sync summary helpful and accurate

    - Error messages clear

    - Performance acceptable (<5 seconds for full sync)

    '
