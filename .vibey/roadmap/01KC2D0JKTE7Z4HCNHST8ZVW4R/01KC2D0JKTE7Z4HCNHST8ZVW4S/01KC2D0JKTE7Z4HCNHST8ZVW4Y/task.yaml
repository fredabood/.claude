  title: Execute migration with validation
  description: 'Execute the directory migration on the actual .vibey/roadmap/ directory.


    EXECUTION STEPS:

    1. Run dry-run first: vibey roadmap migrate-structure --dry-run

    2. Review planned changes

    3. Create backup

    4. Execute migration: vibey roadmap migrate-structure --execute

    5. Run round-trip validation

    6. Verify all YAML files load correctly

    7. Verify database sync still works

    8. Commit the migration


    VALIDATION CHECKS:

    - All tracks load correctly

    - All sprints load correctly

    - All tasks load correctly

    - roadmap.yaml summary is accurate

    - vibey roadmap status shows correct data

    - SQLite database can be rebuilt from YAML

    - Round-trip: YAML → SQLite → YAML produces identical files


    ROLLBACK PLAN:

    If validation fails:

    1. vibey roadmap migrate-structure --rollback

    2. Restore from backup

    3. Document failure reason

    '
