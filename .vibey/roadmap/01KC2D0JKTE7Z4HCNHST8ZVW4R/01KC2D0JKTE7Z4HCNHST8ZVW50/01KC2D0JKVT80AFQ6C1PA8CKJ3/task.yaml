  title: Create schema migration script
  description: "Create a script to migrate from legacy schema to unified schema.\n\
    \nMIGRATION STEPS:\n1. Create new tables (completables, criteria, artifacts)\n\
    2. Copy data from legacy tables to completables\n3. Convert blocked_by/depends_on\
    \ to criteria rows\n4. Convert deliverables to criteria rows\n5. Convert quality_gates\
    \ to criteria rows\n6. Create views for backward compatibility\n7. Drop legacy\
    \ tables (optional, can keep for rollback)\n\nIMPLEMENTATION:\n```python\ndef\
    \ migrate_to_v2_schema(db_path: Path, dry_run: bool = True) -> MigrationResult:\n\
    \    conn = sqlite3.connect(db_path)\n\n    # 1. Create backup\n    backup_path\
    \ = create_backup(db_path)\n\n    # 2. Create new tables\n    conn.executescript(SCHEMA_V2_SQL)\n\
    \n    # 3. Migrate roadmaps → completables\n    for row in conn.execute(\"SELECT\
    \ * FROM roadmaps\"):\n        insert_completable(conn, 'roadmap', row)\n\n  \
    \  # 4. Migrate tracks → completables\n    # 5. Migrate sprints → completables\n\
    \    # 6. Migrate tasks → completables\n\n    # 7. Convert blocked_by → criteria\n\
    \    migrate_blocked_by_to_criteria(conn)\n\n    # 8. Convert depends_on → criteria\n\
    \    migrate_depends_on_to_criteria(conn)\n\n    # 9. Convert deliverables → criteria\n\
    \    migrate_deliverables_to_criteria(conn)\n\n    return MigrationResult(...)\n\
    ```\n"
