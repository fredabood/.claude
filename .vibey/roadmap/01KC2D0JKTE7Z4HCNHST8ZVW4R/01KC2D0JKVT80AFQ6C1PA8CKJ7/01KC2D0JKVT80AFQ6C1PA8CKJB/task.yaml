  title: Create ULID migration script
  description: "Create a migration script to assign ULIDs to all existing entities.\n\
    \nMIGRATION STEPS:\n1. Scan all existing entities\n2. Generate ULID for each entity\n\
    3. Create .id files with slug → ULID mappings\n4. Update all YAML files with new\
    \ id, slug, sequence fields\n5. Update database with ULIDs\n6. Update cross-references\
    \ to use ULIDs\n\nIMPLEMENTATION:\n```python\ndef migrate_to_ulid(root_dir: Path,\
    \ dry_run: bool = True) -> MigrationResult:\n    # 1. Scan existing entities\n\
    \    tracks = scan_tracks(root_dir)\n    sprints = scan_sprints(root_dir)\n  \
    \  tasks = scan_tasks(root_dir)\n\n    # 2. Generate ULIDs (preserve creation\
    \ order for sortability)\n    ulid_map = {}\n    for entity in sorted_by_created_at(tracks\
    \ + sprints + tasks):\n        ulid_map[entity.id] = generate_ulid()\n\n    #\
    \ 3. Create .id files\n    create_id_files(root_dir, ulid_map)\n\n    # 4. Update\
    \ YAML files\n    for track in tracks:\n        update_yaml_with_ulid(track.path,\
    \ ulid_map)\n    # ... sprints, tasks\n\n    # 5. Update database\n    update_db_with_ulids(ulid_map)\n\
    \n    # 6. Update cross-references\n    update_references(root_dir, ulid_map)\n\
    \n    return MigrationResult(...)\n```\n"
