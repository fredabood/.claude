      CRITICAL UPDATE: Amazon Q has FULL MCP SUPPORT.
      - CLI: GA April 29, 2025
      - IDE plugins (VS Code, JetBrains): GA June 2025
      - Admin controls: August 2025

      MCP SUPPORT (CONFIRMED):
      - Local MCP servers (stdio)
      - Remote MCP servers (HTTP with OAuth)
      - Project config: .amazonq/mcp.json
      - Global config: ~/.aws/amazonq/mcp.json
      - Enterprise admin controls for MCP governance

      CONFIG FORMAT (.amazonq/mcp.json):
      {
        "mcpServers": {
          "vibey": {
            "command": "python",
            "args": ["-m", "framework.mcp.server"],
            "env": {}
          }
        }
      }

