sprint:
  id: atlassian-integration-2
  name: Jira Bidirectional Sync & Conflict Resolution
  track_id: atlassian-integration
  status: planned
  blocked: false
  created: '2025-11-23T00:00:00+00:00'
  started: null
  completed: null
  estimated_duration: 3 weeks
  progress:
    tasks_total: 7
    tasks_completed: 0
    completion_percent: 0
  tasks:
  - id: atlassian-integration-2-task-001
    name: Implement Vibey to Jira export (write operations)
    status: planned
    priority: critical
    estimated_hours: 10
    assigned_agent: backend-engineer
    description: |
      Push Vibey changes to Jira:
      - Create Jira issues from tasks
      - Update issue status on task completion
      - Update issue fields from task metadata
      - Create sprints from Vibey sprints
      - Handle issue transitions
      - vibey atlassian export <track>
  - id: atlassian-integration-2-task-002
    name: Design sync state tracking system
    status: planned
    priority: critical
    estimated_hours: 8
    assigned_agent: architecture-agent
    description: |
      Track sync state for conflict detection:
      - Last sync timestamp per entity
      - Entity version/hash tracking
      - Sync manifest format
      - Dirty tracking (local changes)
      - Remote change detection
      - .vibey/atlassian/sync-state.yaml
  - id: atlassian-integration-2-task-003
    name: Implement bidirectional sync engine
    status: planned
    priority: critical
    estimated_hours: 12
    assigned_agent: backend-engineer
    description: |
      Core sync engine:
      - Pull changes from Jira
      - Push changes to Jira
      - Detect changes since last sync
      - Handle creates, updates, deletes
      - Batch operations for efficiency
      - vibey atlassian sync --direction=both
  - id: atlassian-integration-2-task-004
    name: Implement conflict detection and resolution
    status: planned
    priority: critical
    estimated_hours: 10
    assigned_agent: backend-engineer
    description: |
      Handle sync conflicts:
      - Detect concurrent modifications
      - Conflict resolution strategies:
        * Jira wins (default for Jira-as-source)
        * Vibey wins (for Vibey-as-source)
        * Manual resolution (interactive)
        * Last-write-wins (timestamp-based)
      - Conflict report generation
      - vibey atlassian conflicts
  - id: atlassian-integration-2-task-005
    name: Implement Jira webhooks for real-time sync
    status: planned
    priority: high
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: |
      Real-time sync via webhooks:
      - Webhook endpoint handler
      - Issue created/updated/deleted events
      - Sprint created/updated/closed events
      - Project updated events
      - Event validation and security
      - Webhook registration management
  - id: atlassian-integration-2-task-006
    name: Add sync configuration options
    status: planned
    priority: medium
    estimated_hours: 6
    assigned_agent: backend-engineer
    description: |
      Configurable sync behavior:
      - Sync direction (jira→vibey, vibey→jira, both)
      - Field mapping overrides
      - Status mapping configuration
      - Include/exclude filters (JQL)
      - Auto-sync interval
      - .vibey/config/atlassian.yaml
  - id: atlassian-integration-2-task-007
    name: Create bidirectional sync tests
    status: planned
    priority: high
    estimated_hours: 8
    assigned_agent: test-engineer
    description: |
      Test sync functionality:
      - Push scenarios
      - Pull scenarios
      - Conflict scenarios
      - Webhook handling
      - Configuration variations
      - Error recovery
  dependencies:
  - atlassian-integration-1
  blocked_by:
  - atlassian-integration-1
  quality_gates:
  - name: Sync Reliability
    threshold: 99
    blocking: true
    status: not_run
  - name: No Data Loss
    threshold: 100
    blocking: true
    status: not_run
  deliverables:
  - Vibey to Jira export functionality
  - Sync state tracking system
  - Bidirectional sync engine
  - Conflict detection and resolution
  - Webhook handlers for real-time sync
  - Sync configuration system
  - Comprehensive sync tests
  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-23T00:00:00+00:00'
    notes: |
      Sprint 2 adds write operations and bidirectional sync.

      Key challenge: Conflict resolution when both sides change.

      Sync modes:
      1. PULL-ONLY: Jira is source of truth, Vibey is read-only
      2. PUSH-ONLY: Vibey is source of truth, Jira reflects
      3. BIDIRECTIONAL: Both sides can change, conflicts resolved

      For teams using Jira, PULL-ONLY is recommended.
      For solo devs wanting Jira visibility, PUSH-ONLY works.
      BIDIRECTIONAL is complex but powerful.
