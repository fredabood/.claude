sprint:
  id: atlassian-integration-3
  name: Confluence Documentation Integration
  track_id: atlassian-integration
  status: not_started
  blocked: false
  created: '2025-11-23T00:00:00+00:00'
  started: null
  completed: null
  estimated_duration: 2 weeks
