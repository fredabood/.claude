    notes: "Atlassian integration to use Jira and Confluence as sources of truth.\n\
      \nJIRA INTEGRATION:\n- Jira Project → Roadmap Track\n- Jira Sprint → Roadmap\
      \ Sprint\n- Jira Epic → Roadmap Sprint (alternative mapping)\n- Jira Issue/Story/Task\
      \ → Roadmap Task\n- Jira Status → Task Status (configurable mapping)\n- Jira\
      \ Labels/Components → Task metadata\n\nCONFLUENCE INTEGRATION:\n- Confluence\
      \ Space → docs/ folder\n- Confluence Page → Markdown file\n- Confluence Page\
      \ Tree → Folder hierarchy\n- Confluence Attachments → Referenced assets\n- Confluence\
      \ Comments → (future: inline comments)\n\nSYNC MODES:\n1. Jira as Source of\
      \ Truth (recommended for teams)\n   - Changes in Jira push to Vibey\n   - Vibey\
      \ is read-only reflection\n2. Vibey as Source of Truth (solo developers)\n \
      \  - Changes in Vibey push to Jira\n   - Jira reflects Vibey state\n3. Bidirectional\
      \ (advanced)\n   - Changes sync both ways\n   - Conflict resolution required\n\
      \nAUTHENTICATION:\n- Atlassian Cloud: OAuth 2.0 (3LO)\n- Atlassian Server/DC:\
      \ Personal Access Tokens\n- Service account support for automation\n\nCLI COMMANDS:\n\
      - vibey atlassian connect\n- vibey atlassian sync jira\n- vibey atlassian sync\
      \ confluence\n- vibey atlassian status\n- vibey atlassian import <project>\n\
      - vibey atlassian export <track>\n"
