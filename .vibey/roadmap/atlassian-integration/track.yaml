    notes: |
      Atlassian integration using PLUGGABLE SEMANTIC LAYER architecture.

      DESIGN REFERENCE: sqlite-backend-6/context/architecture/02-CLASS-MODEL.md
      CODE REFERENCE: sqlite-backend-6/context/sample_code/models/semantic_layer.py

      ARCHITECTURE INTEGRATION:
      This track implements the JiraSemanticLayer from the unified ticket architecture.
      The semantic layer allows Jira's hierarchy to override the default Vibey hierarchy
      while sharing Layers 0-2 (Completable, Ticket, HierarchicalTicket).

      JIRA SEMANTIC LAYER:
      - JiraProject (extends HierarchicalTicket) → maps to roadmap.yaml
      - JiraEpic (extends HierarchicalTicket) → maps to tracks/
      - JiraSprint (extends HierarchicalTicket) → maps to sprints/
      - JiraIssue (extends HierarchicalTicket) → maps to tasks/
      - JiraSubtask (extends HierarchicalTicket) → maps to tasks/ with parent_id

      STATUS MAPPING:
      Uses SemanticLayer.map_status_to_canonical() and map_status_from_canonical()
      - "To Do" → TicketStatus.NOT_STARTED
      - "In Progress" → TicketStatus.IN_PROGRESS
      - "Done" → TicketStatus.COMPLETED
      - (configurable per Jira workflow)

      EXTERNAL ID TRACKING:
      - external_id field stores Jira issue key (e.g., "PROJ-123")
      - Internal ULID remains primary key
      - Enables bidirectional sync

      TYPE-SPECIFIC FIELDS:
      Jira fields stored in type_fields JSON:
      - issue_key, story_points, components[], labels[]
      - fix_versions[], affected_versions[]
      - custom fields from Jira project config

      CONFLUENCE INTEGRATION:
      - Confluence pages can become Artifact entities
      - artifact_type: DOCUMENTATION
      - documents_artifact_id links to source artifacts
      - Staleness detection via documented_source_hash

      SYNC MODES:
      1. Jira as Source of Truth (recommended for teams)
         - Changes in Jira push to Vibey
         - Vibey is read-only reflection
      2. Vibey as Source of Truth (solo developers)
         - Changes in Vibey push to Jira
         - Jira reflects Vibey state
      3. Bidirectional (advanced)
         - Changes sync both ways
         - Conflict resolution required

      AUTHENTICATION:
      - Atlassian Cloud: OAuth 2.0 (3LO)
      - Atlassian Server/DC: Personal Access Tokens
      - Service account support for automation

      CLI COMMANDS:
      - vibey atlassian connect
      - vibey atlassian sync jira
      - vibey atlassian sync confluence
      - vibey atlassian status
      - vibey atlassian import <project>
      - vibey atlassian export <track>
