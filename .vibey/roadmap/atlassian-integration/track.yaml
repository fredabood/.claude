    notes: |
      Atlassian integration to use Jira and Confluence as sources of truth.

      JIRA INTEGRATION:
      - Jira Project → Roadmap Track
      - Jira Sprint → Roadmap Sprint
      - Jira Epic → Roadmap Sprint (alternative mapping)
      - Jira Issue/Story/Task → Roadmap Task
      - Jira Status → Task Status (configurable mapping)
      - Jira Labels/Components → Task metadata

      CONFLUENCE INTEGRATION:
      - Confluence Space → docs/ folder
      - Confluence Page → Markdown file
      - Confluence Page Tree → Folder hierarchy
      - Confluence Attachments → Referenced assets
      - Confluence Comments → (future: inline comments)

      SYNC MODES:
      1. Jira as Source of Truth (recommended for teams)
         - Changes in Jira push to Vibey
         - Vibey is read-only reflection
      2. Vibey as Source of Truth (solo developers)
         - Changes in Vibey push to Jira
         - Jira reflects Vibey state
      3. Bidirectional (advanced)
         - Changes sync both ways
         - Conflict resolution required

      AUTHENTICATION:
      - Atlassian Cloud: OAuth 2.0 (3LO)
      - Atlassian Server/DC: Personal Access Tokens
      - Service account support for automation

      CLI COMMANDS:
      - vibey atlassian connect
      - vibey atlassian sync jira
      - vibey atlassian sync confluence
      - vibey atlassian status
      - vibey atlassian import <project>
      - vibey atlassian export <track>
