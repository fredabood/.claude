  - name: Local Install Works
    threshold: 100
    blocking: true
    status: not_run
    description: Formula installs and vibey CLI works
  deliverables:
  - Homebrew tap repository (homebrew-vibey)
  - Vibey formula (Formula/vibey.rb)
  - Dependency resources generated
  - Local testing complete
  - Installation documentation
  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-24T00:00:00+00:00'
    notes: 'Sprint 1 creates the initial Homebrew formula and tap repository.


      KEY DECISION: Using PyPI-based formula with virtualenv

      - Simpler than source-based build

      - Leverages existing PyPI release infrastructure

      - Homebrew handles Python version management

      - virtualenv isolates dependencies


      BLOCKED BY: python-package track must publish to PyPI first.

      The formula URL references the PyPI package.


      TESTING MATRIX:

      - macOS 13+ (Ventura) on Intel

      - macOS 13+ (Ventura) on Apple Silicon

      - Linuxbrew on Ubuntu 22.04 (stretch goal)

      '
