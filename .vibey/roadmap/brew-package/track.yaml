    notes: |
      HOMEBREW DISTRIBUTION

      Provides `brew install vibey` for macOS and Linux users.

      TWO OPTIONS FOR FORMULA:
      1. PyPI-based: Downloads from PyPI, installs with pip
         - Pro: Simple, leverages existing PyPI release
         - Con: Requires Python dependency management
      2. Source-based: Builds from GitHub release tarball
         - Pro: More control, can pin dependencies
         - Con: More complex formula

      RECOMMENDED: PyPI-based formula using virtualenv resource.

      TAP REPOSITORY:
      - Create github.com/vibey-framework/homebrew-vibey
      - Users install with: brew tap vibey-framework/vibey && brew install vibey
      - Or shorthand: brew install vibey-framework/vibey/vibey

      FUTURE: Submit to homebrew-core for `brew install vibey` without tap.

      DEPENDENCIES:
      - python@3.11 or python@3.12
      - No native dependencies (pure Python)

      BLOCKED BY: python-package track must complete first (need PyPI release)
