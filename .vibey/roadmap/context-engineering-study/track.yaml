    notes: |
      Comprehensive study of context engineering for vibe coding sessions
      with focus on using git to version context for transparency,
      auditability, and reproducibility.

      KEY QUESTIONS TO ANSWER:

      1. Context Engineering Fundamentals
         - What constitutes "context" in a vibe coding session?
         - How does context flow between user, AI, and codebase?
         - What are the context boundaries and lifecycles?
         - How do other tools handle context engineering?

      2. Git Versioning for Context
         - What context artifacts should be versioned?
         - How to capture context state at each interaction?
         - What git workflows support context versioning?
         - How to handle context diffs and merges?

      3. Transparency
         - How can users see exactly what context AI received?
         - What format makes context human-readable?
         - How to visualize context changes over time?
         - What metadata aids transparency?

      4. Auditability
         - How to create audit trails for context decisions?
         - What logging captures context state changes?
         - How to trace AI responses back to context inputs?
         - What compliance requirements apply?

      5. Reproducibility
         - How to replay a session with identical context?
         - What factors affect context determinism?
         - How to handle external dependencies in context?
         - What testing validates reproducibility?

      DELIVERABLES:
      - Research reports with findings
      - Gap analysis with severity ratings
      - Design specifications for solutions
      - Implementation roadmap recommendations
