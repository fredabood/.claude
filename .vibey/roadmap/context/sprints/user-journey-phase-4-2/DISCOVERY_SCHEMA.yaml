# Discovery Output Schema v1.0.0
#
# This schema defines the structure for project discovery outputs.
# Discovery outputs capture project metadata, structure, dependencies,
# patterns, and recommendations for AI-assisted development.

$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://vibey.dev/schemas/discovery/v1.0.0"
title: DiscoveryOutput
description: Structured output from project discovery analysis
version: "1.0.0"

type: object
required:
  - metadata
  - project
  - structure
  - dependencies

properties:
  metadata:
    type: object
    description: Discovery execution metadata
    required:
      - schema_version
      - discovered_at
      - project_root
    properties:
      schema_version:
        type: string
        description: Schema version (semver)
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        example: "1.0.0"
      discovered_at:
        type: string
        format: date-time
        description: ISO 8601 timestamp of discovery execution
        example: "2025-12-14T10:30:00Z"
      project_root:
        type: string
        description: Absolute path to project root
        example: "/Users/dev/my-project"
      git_commit:
        type: string
        description: Git commit SHA at discovery time (if git repo)
        pattern: "^[a-f0-9]{40}$"
        example: "abc123def456..."
      git_branch:
        type: string
        description: Git branch at discovery time
        example: "main"
      discovery_duration_ms:
        type: integer
        description: Time taken to run discovery in milliseconds
        example: 5432
      previous_discovery_id:
        type: string
        description: ID of previous discovery (for diff tracking)
        format: ulid

  project:
    type: object
    description: High-level project information
    required:
      - name
      - type
      - languages
    properties:
      name:
        type: string
        description: Project name (from package.json, pyproject.toml, or directory)
        example: "my-api"
      type:
        type: string
        description: Project type classification
        enum:
          - web-app
          - api
          - cli
          - library
          - ml-model
          - data-pipeline
          - infrastructure
          - monorepo
          - unknown
        example: "api"
      type_confidence:
        type: number
        minimum: 0
        maximum: 100
        description: Confidence score for type detection (0-100)
        example: 95
      description:
        type: string
        description: Project description (from README or package file)
        example: "FastAPI-based REST API for user management"
      languages:
        type: array
        description: Programming languages detected
        items:
          type: object
          required:
            - name
            - percentage
          properties:
            name:
              type: string
              example: "python"
            percentage:
              type: number
              minimum: 0
              maximum: 100
              description: Percentage of codebase
            version:
              type: string
              description: Language version if detected
              example: "3.11"
      frameworks:
        type: array
        description: Frameworks detected
        items:
          type: object
          required:
            - name
            - category
          properties:
            name:
              type: string
              example: "fastapi"
            category:
              type: string
              enum: [backend, frontend, testing, build, orm, other]
            version:
              type: string
              example: "0.109.0"
            confidence:
              type: number
              minimum: 0
              maximum: 100

  structure:
    type: object
    description: Project directory and file structure analysis
    properties:
      total_files:
        type: integer
        description: Total number of source files
        example: 127
      total_lines:
        type: integer
        description: Total lines of code
        example: 15420
      directories:
        type: array
        description: Key directories with their purposes
        items:
          type: object
          required:
            - path
            - purpose
          properties:
            path:
              type: string
              example: "src/api"
            purpose:
              type: string
              enum:
                - source
                - tests
                - docs
                - config
                - scripts
                - assets
                - generated
                - vendor
                - unknown
            file_count:
              type: integer
            line_count:
              type: integer
            primary_language:
              type: string
      key_files:
        type: array
        description: Important files and their roles
        items:
          type: object
          required:
            - path
            - role
          properties:
            path:
              type: string
              example: "src/main.py"
            role:
              type: string
              enum:
                - entry_point
                - config
                - readme
                - changelog
                - license
                - manifest
                - schema
                - migration
                - test_config
                - ci_config
                - docker
                - other
            lines:
              type: integer
            description:
              type: string
      entry_points:
        type: array
        description: Application entry points
        items:
          type: string
        example: ["src/main.py", "src/cli.py"]
      architecture_pattern:
        type: string
        description: Detected architectural pattern
        enum:
          - layered
          - mvc
          - clean
          - hexagonal
          - microservices
          - monolith
          - serverless
          - unknown
      architecture_confidence:
        type: number
        minimum: 0
        maximum: 100

  dependencies:
    type: object
    description: Project dependencies analysis
    properties:
      runtime:
        type: array
        description: Runtime dependencies
        items:
          $ref: "#/definitions/Dependency"
      development:
        type: array
        description: Development dependencies
        items:
          $ref: "#/definitions/Dependency"
      system:
        type: array
        description: System-level dependencies (databases, services)
        items:
          type: object
          properties:
            name:
              type: string
              example: "postgresql"
            category:
              type: string
              enum: [database, cache, queue, storage, search, other]
            version:
              type: string
            detected_from:
              type: string
              description: How this was detected
              example: "requirements.txt:psycopg2"
      outdated_count:
        type: integer
        description: Number of outdated dependencies
      vulnerable_count:
        type: integer
        description: Number of dependencies with known vulnerabilities

  patterns:
    type: object
    description: Code patterns and conventions detected
    properties:
      architectural:
        type: array
        description: Architectural patterns
        items:
          $ref: "#/definitions/Pattern"
      coding:
        type: array
        description: Coding patterns and idioms
        items:
          $ref: "#/definitions/Pattern"
      testing:
        type: array
        description: Testing patterns
        items:
          $ref: "#/definitions/Pattern"

  conventions:
    type: object
    description: Project conventions
    properties:
      naming:
        type: object
        properties:
          files:
            type: string
            enum: [snake_case, kebab-case, PascalCase, camelCase, mixed]
          functions:
            type: string
            enum: [snake_case, camelCase, PascalCase, mixed]
          classes:
            type: string
            enum: [PascalCase, snake_case, mixed]
          variables:
            type: string
            enum: [snake_case, camelCase, mixed]
      organization:
        type: object
        properties:
          module_structure:
            type: string
            description: How modules are organized
            example: "domain-driven"
          test_location:
            type: string
            enum: [alongside, separate, both]
            description: Where tests are located relative to source
          import_style:
            type: string
            description: Import organization pattern
            example: "absolute with grouping"
      commit_convention:
        type: string
        description: Commit message convention if detected
        enum:
          - conventional_commits
          - angular
          - semantic
          - none_detected
      code_style:
        type: object
        properties:
          formatter:
            type: string
            example: "black"
          linter:
            type: string
            example: "ruff"
          type_checker:
            type: string
            example: "mypy"

  quality:
    type: object
    description: Code quality metrics
    properties:
      test_coverage:
        type: number
        minimum: 0
        maximum: 100
        description: Test coverage percentage if measurable
      test_count:
        type: integer
        description: Number of test cases
      documentation_score:
        type: number
        minimum: 0
        maximum: 100
        description: Documentation coverage score
      security_score:
        type: number
        minimum: 0
        maximum: 100
        description: Security assessment score
      overall_health:
        type: number
        minimum: 0
        maximum: 100
        description: Overall project health score

  recommendations:
    type: object
    description: Improvement recommendations
    properties:
      immediate:
        type: array
        description: High-priority recommendations
        items:
          $ref: "#/definitions/Recommendation"
      suggested:
        type: array
        description: Nice-to-have recommendations
        items:
          $ref: "#/definitions/Recommendation"

  git_history:
    type: object
    description: Git history analysis (if available)
    properties:
      total_commits:
        type: integer
        description: Total commits in last 6 months
      contributors:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            commits:
              type: integer
      recent_sprints:
        type: array
        description: Detected recent sprints/releases
        items:
          type: object
          properties:
            name:
              type: string
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            commits:
              type: integer
            summary:
              type: string
      velocity:
        type: object
        properties:
          commits_per_week:
            type: number
          lines_per_month:
            type: integer
      sprint_cadence:
        type: string
        description: Detected sprint length
        example: "bi-weekly"

definitions:
  Dependency:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        example: "fastapi"
      version:
        type: string
        example: "0.109.0"
      version_constraint:
        type: string
        example: ">=0.100.0"
      latest_version:
        type: string
      is_outdated:
        type: boolean
      has_vulnerability:
        type: boolean
      vulnerability_severity:
        type: string
        enum: [critical, high, medium, low]

  Pattern:
    type: object
    required:
      - name
      - description
    properties:
      name:
        type: string
        example: "dependency_injection"
      description:
        type: string
        example: "Uses FastAPI Depends() for dependency injection"
      locations:
        type: array
        items:
          type: string
        description: File paths where pattern is found
      confidence:
        type: number
        minimum: 0
        maximum: 100

  Recommendation:
    type: object
    required:
      - category
      - title
      - description
    properties:
      category:
        type: string
        enum:
          - security
          - testing
          - documentation
          - performance
          - maintainability
          - dependencies
          - architecture
      title:
        type: string
        example: "Add rate limiting"
      description:
        type: string
        example: "API endpoints lack rate limiting, risking abuse"
      priority:
        type: string
        enum: [critical, high, medium, low]
      effort:
        type: string
        enum: [trivial, small, medium, large, epic]
      files:
        type: array
        items:
          type: string
        description: Affected files
