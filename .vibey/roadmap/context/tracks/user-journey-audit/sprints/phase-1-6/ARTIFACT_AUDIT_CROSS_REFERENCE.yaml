# Gap Summary by Priority
gap_priority_summary:
  critical:
    description: "Must fix to enable basic artifact tracking"
    gaps:
      - name: "entity_artifacts table missing"
        affects: "All 856 files"
        blocks: "Cannot link artifacts to tasks"

      - name: "artifact_tests_code table missing"
        affects: "155 test files, 367 code files"
        blocks: "Cannot track test coverage"

      - name: "quality_score column missing"
        affects: "All 856 files"
        blocks: "Cannot store audit quality scores"

  high:
    description: "Needed for comprehensive tracking"
    gaps:
      - name: "artifact_dependencies table missing"
        affects: "522 Python files"
        blocks: "Cannot track import dependencies"

      - name: "deprecated_content flag missing"
        affects: "56 documentation files"
        blocks: "Cannot track deprecated references"

  medium:
    description: "Would improve tracking quality"
    gaps:
      - name: "artifact_subtype values undefined"
        affects: "All 856 files"
        impact: "Cannot filter by specific type"

      - name: "test metadata fields missing"
        affects: "155 test files"
        impact: "Cannot store test counts, pass rates"

  low:
    description: "Nice to have"
    gaps:
      - name: "deprecation_status field missing"
        affects: "4 script files"
        impact: "Cannot mark deprecated scripts"

