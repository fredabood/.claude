# Artifact Tables Inventory
# Generated: 2025-12-12
# Sprint: Phase 1.6 - Database Artifact Audit
# Task: Inventory existing artifact tables

inventory:
  summary:
    total_artifact_tables: 3
    total_relationship_tables: 2
    total_artifact_views: 4
    total_related_tables: 2
    current_data_population:
      artifacts: 0
      deliverables: 0
      commits: 0
      entity_commits: 0
      entity_deliverables: 0
      activity_log: 1796
      audit_trail: 0

  artifact_tables:
    - name: artifacts
      purpose: "Primary artifact tracking table for code, tests, config, documentation, etc."
      row_count: 0
      population_status: empty
      schema:
        identity:
          - { column: id, type: TEXT, constraints: PRIMARY KEY }
          - { column: name, type: TEXT, constraints: NOT NULL }
          - { column: description, type: TEXT, constraints: nullable }
        file_location:
          - { column: paths, type: TEXT, constraints: "NOT NULL, JSON array of file paths" }
          - { column: content_hash, type: TEXT, constraints: nullable }
          - { column: last_verified, type: TEXT, constraints: "nullable, ISO timestamp" }
        classification:
          - column: artifact_type
            type: TEXT
            constraints: "NOT NULL, CHECK IN (code, test, config, documentation, context, agent, workflow, template, data, asset, schema, other)"
          - { column: artifact_subtype, type: TEXT, constraints: nullable }
        provenance:
          - { column: provenance, type: TEXT, constraints: "NOT NULL, JSON object with provenance_type" }
        relationships:
          - { column: documents_artifact_id, type: TEXT, constraints: "FK to artifacts(id)" }
          - { column: depends_on_artifact_ids, type: TEXT, constraints: "JSON array of artifact IDs" }
        state:
          - { column: file_exists, type: INTEGER, constraints: "NOT NULL DEFAULT 1" }
          - { column: is_stale, type: INTEGER, constraints: "NOT NULL DEFAULT 0" }
        staleness_tracking:
          - { column: documented_source_hash, type: TEXT, constraints: "nullable, for documentation artifacts" }
        timestamps:
          - { column: created_at, type: TEXT, constraints: NOT NULL }
          - { column: updated_at, type: TEXT, constraints: NOT NULL }
      indexes:
        - { name: idx_artifacts_type, columns: [artifact_type] }
        - { name: idx_artifacts_documents, columns: [documents_artifact_id] }
        - { name: idx_artifacts_stale, columns: [is_stale], condition: "WHERE is_stale = 1" }
        - { name: idx_artifacts_exists, columns: [file_exists], condition: "WHERE file_exists = 1" }
      relationships_to_entities: "Not directly linked to tracks/sprints/tasks - standalone table"
      usage_assessment: |
        The artifacts table is designed but not currently populated. It provides:
        - Rich artifact type classification (12 types)
        - Provenance tracking via JSON
        - Staleness detection for documentation
        - Self-referential documentation relationships
        - Multi-path support (JSON array)
        Gap: No foreign key relationships to tracks, sprints, or tasks.

    - name: deliverables
      purpose: "Track expected outputs from sprints and tasks"
      row_count: 0
      population_status: empty
      schema:
        - { column: id, type: INTEGER, constraints: PRIMARY KEY AUTOINCREMENT }
        - { column: description, type: TEXT, constraints: NOT NULL }
        - { column: status, type: TEXT, constraints: "DEFAULT 'pending', CHECK IN (pending, in_progress, completed)" }
        - { column: completed_at, type: TEXT, constraints: nullable }
        - { column: artifact_path, type: TEXT, constraints: "nullable, file path to artifact" }
        - { column: artifact_url, type: TEXT, constraints: "nullable, URL to artifact" }
      indexes: []
      relationships_to_entities: "Via entity_deliverables polymorphic table"
      usage_assessment: |
        Deliverables are tracked via JSON in tasks (deliverables_json) and sprints (deliverables_json).
        The normalized deliverables table exists but is not populated.
        The entity_deliverables relationship table provides polymorphic linking.
        Gap: Dual storage pattern (JSON + normalized) creates data sync complexity.

    - name: commits
      purpose: "Track git commits associated with roadmap work"
      row_count: 0
      population_status: empty
      schema:
        - { column: id, type: INTEGER, constraints: PRIMARY KEY AUTOINCREMENT }
        - { column: commit_hash, type: TEXT, constraints: NOT NULL UNIQUE }
        - { column: commit_message, type: TEXT, constraints: nullable }
        - { column: author, type: TEXT, constraints: nullable }
        - { column: committed_at, type: TEXT, constraints: nullable }
        - { column: branch, type: TEXT, constraints: nullable }
        - { column: pr_number, type: INTEGER, constraints: nullable }
        - { column: pr_url, type: TEXT, constraints: nullable }
      indexes:
        - { name: idx_commits_hash, columns: [commit_hash] }
      relationships_to_entities: "Via entity_commits polymorphic table"
      usage_assessment: |
        Commits are tracked via JSON in tasks (commits_json).
        The normalized commits table exists but is not populated.
        The entity_commits relationship table provides polymorphic linking.
        Gap: Dual storage pattern (JSON + normalized) creates data sync complexity.

  relationship_tables:
    - name: entity_commits
      purpose: "Polymorphic many-to-many between entities and commits"
      row_count: 0
      population_status: empty
      schema:
        - { column: id, type: INTEGER, constraints: PRIMARY KEY AUTOINCREMENT }
        - { column: owner_type, type: TEXT, constraints: "NOT NULL, CHECK IN (track, sprint, task)" }
        - { column: owner_id, type: TEXT, constraints: NOT NULL }
        - { column: commit_id, type: INTEGER, constraints: "NOT NULL, FK to commits(id) ON DELETE CASCADE" }
      constraints:
        - "UNIQUE(owner_type, owner_id, commit_id)"
      indexes:
        - { name: idx_entity_commits_owner, columns: [owner_type, owner_id] }
        - { name: idx_entity_commits_commit, columns: [commit_id] }

    - name: entity_deliverables
      purpose: "Polymorphic many-to-many between entities and deliverables"
      row_count: 0
      population_status: empty
      schema:
        - { column: id, type: INTEGER, constraints: PRIMARY KEY AUTOINCREMENT }
        - { column: owner_type, type: TEXT, constraints: "NOT NULL, CHECK IN (track, sprint, task)" }
        - { column: owner_id, type: TEXT, constraints: NOT NULL }
        - { column: deliverable_id, type: INTEGER, constraints: "NOT NULL, FK to deliverables(id) ON DELETE CASCADE" }
      constraints:
        - "UNIQUE(owner_type, owner_id, deliverable_id)"
      indexes:
        - { name: idx_entity_deliverables_owner, columns: [owner_type, owner_id] }
        - { name: idx_entity_deliverables_deliverable, columns: [deliverable_id] }

  artifact_views:
    - name: v_sprint_commits
      purpose: "Aggregate task commits at sprint level"
      source_column: tasks.commits_json
      output: "JSON array of commits from all tasks in sprint"

    - name: v_sprint_deliverables
      purpose: "Aggregate task deliverables at sprint level"
      source_column: tasks.deliverables_json
      output: "JSON array of deliverables from all tasks in sprint"

    - name: v_track_commits
      purpose: "Aggregate sprint commits at track level"
      source_column: v_sprint_commits.commits_json
      output: "JSON array of commits from all sprints in track"

    - name: v_track_deliverables
      purpose: "Aggregate sprint deliverables at track level"
      source_column: v_sprint_deliverables.deliverables_json
      output: "JSON array of deliverables from all sprints in track"

  embedded_json_columns:
    tasks:
      - column: commits_json
        type: TEXT
        description: "JSON array of commit objects"
        current_usage: "0 of 1549 tasks have non-empty commits_json"
      - column: deliverables_json
        type: TEXT
        description: "JSON array of deliverable objects"
        current_usage: "0 of 1549 tasks have non-empty deliverables_json"
    sprints:
      - column: plan_file
        type: TEXT
        description: "Path to sprint plan file"
        current_usage: "0 of 206 sprints have non-empty plan_file"
      - column: deliverables_json
        type: TEXT
        description: "JSON array of sprint-level deliverable objects"
        current_usage: "0 of 206 sprints have non-empty deliverables_json"

  operational_tables:
    - name: activity_log
      purpose: "Event-based activity logging with state snapshots"
      row_count: 1796
      population_status: active
      artifact_relevance: |
        Captures event_type, entity changes, old_state/new_state JSON snapshots.
        Not an artifact table per se, but captures artifact-related events.

    - name: audit_trail
      purpose: "Field-level change tracking for compliance"
      row_count: 0
      population_status: empty
      artifact_relevance: |
        Tracks individual field changes with old/new values.
        Could track artifact field changes if populated.

  analysis:
    dual_storage_pattern:
      description: |
        The schema has a dual storage pattern for commits and deliverables:
        1. JSON columns in entity tables (tasks.commits_json, tasks.deliverables_json)
        2. Normalized tables with polymorphic relationships (commits, deliverables, entity_*)

        Currently ONLY the JSON columns are used (via views v_sprint_*, v_track_*).
        The normalized tables are empty and appear to be designed but not integrated.

      recommendations:
        - "Either migrate to fully normalized pattern OR remove normalized tables"
        - "If keeping both, implement sync triggers or application-level consistency"
        - "Document the intended pattern for artifact storage"

    artifacts_table_isolation:
      description: |
        The artifacts table has no direct foreign key to tracks, sprints, or tasks.
        It's designed as a standalone registry with self-referential documentation links.

        This suggests artifacts were intended to be tracked separately from the
        roadmap hierarchy, possibly to support cross-entity artifact sharing.

      recommendations:
        - "Add entity_artifacts polymorphic table for task/sprint/track linking"
        - "Or add artifact_ids JSON column to entity tables (matching current pattern)"

    population_status:
      fully_populated:
        - activity_log (1796 rows)
      partially_populated: []
      empty:
        - artifacts (0 rows)
        - deliverables (0 rows)
        - commits (0 rows)
        - entity_commits (0 rows)
        - entity_deliverables (0 rows)
        - audit_trail (0 rows)

    file_tracking_gap:
      description: |
        The file audits from Phase 1.1-1.5 identified hundreds of files:
        - Python source files (vibey/ package)
        - Documentation files (docs/, CLAUDE.md, README.md)
        - Configuration files (pyproject.toml, .vibey/config/)
        - Test files (tests/)
        - Scripts (scripts/)
        - Context files (.vibey/roadmap/context/)

        None of these are currently tracked in the artifacts table.
        The artifacts table schema is well-designed for this purpose but unused.

      recommendations:
        - "Populate artifacts table with file inventory from Phase 1.1"
        - "Establish provenance (manual, generated, AI-created)"
        - "Track documentation-to-code relationships"
        - "Enable staleness detection for docs"

  next_steps:
    task_3: "Analyze artifact relationship model (entity_*, self-refs)"
    task_4: "Map file audit outputs to artifact types"
    task_5: "Identify missing artifact types not covered by current schema"
