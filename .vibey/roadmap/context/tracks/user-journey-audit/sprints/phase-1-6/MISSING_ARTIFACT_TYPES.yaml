# Missing relationship types between artifacts and entities
missing_relationship_types:

  artifact_to_entity:
    description: "Link artifacts to tracks/sprints/tasks"
    current_state: "No entity_artifacts table exists"
    needed:
      - table: entity_artifacts
        columns:
          - owner_type: "track, sprint, task"
          - owner_id: "ULID of entity"
          - artifact_id: "FK to artifacts"
          - relationship_type: "produces, consumes, modifies, references"
        indexes:
          - idx_entity_artifacts_owner
          - idx_entity_artifacts_artifact
    impact: "Cannot track which tasks produce which artifacts"

  artifact_to_commit:
    description: "Link artifacts to git commits"
    current_state: "commits table exists but not linked to artifacts"
    needed:
      - table: artifact_commits
        columns:
          - artifact_id: "FK to artifacts"
          - commit_id: "FK to commits"
          - change_type: "created, modified, deleted"
        alternative: "Add commit_id to provenance JSON"
    impact: "Cannot track artifact version history"

  test_to_code:
    description: "Link test files to code they test"
    current_state: "No relationship table"
    needed:
      - approach_a: "Use artifact dependencies (depends_on_artifact_ids)"
      - approach_b: "Add tests_artifact_id column to test artifacts"
      - approach_c: "Metadata field in test artifact"
    recommended: approach_a
    impact: "Cannot correlate tests to tested code"

  doc_to_code:
    description: "Link documentation to code it documents"
    current_state: "documents_artifact_id exists but only for artifact-to-artifact"
    enhancement:
      - "Already supported via documents_artifact_id FK"
      - "Need consistent population"
    impact: "Staleness detection broken without population"

