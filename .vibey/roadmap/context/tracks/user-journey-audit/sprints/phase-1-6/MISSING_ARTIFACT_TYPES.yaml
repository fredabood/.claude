      - test_config: "pytest, coverage config"
      - ci_config: "CI/CD configuration"
      - git_config: "Git-related config"
      - vibey_config: "Framework configuration"
    impact: "Cannot distinguish config types"

  context:
    existing_subtypes: []
    needed_subtypes:
      - sprint_plan: "Sprint planning documents"
      - audit_result: "Audit output documents"
      - design_doc: "Design specifications"
      - gap_analysis: "Analysis documents"
