# Missing tables
missing_tables:

  entity_artifacts:
    purpose: "Polymorphic link between entities and artifacts"
    priority: critical
    schema: |
      CREATE TABLE entity_artifacts (
          id INTEGER PRIMARY KEY AUTOINCREMENT,

          -- Polymorphic owner
          owner_type TEXT NOT NULL CHECK (owner_type IN ('track', 'sprint', 'task')),
          owner_id TEXT NOT NULL,

          -- Artifact reference
          artifact_id TEXT NOT NULL REFERENCES artifacts(id) ON DELETE CASCADE,

          -- Relationship semantics
          relationship_type TEXT DEFAULT 'produces'
              CHECK (relationship_type IN ('produces', 'consumes', 'modifies', 'references')),

          -- Context
          added_at TEXT NOT NULL,
          added_by TEXT,  -- user, agent, or system

          UNIQUE(owner_type, owner_id, artifact_id)
      );
      CREATE INDEX idx_entity_artifacts_owner ON entity_artifacts(owner_type, owner_id);
      CREATE INDEX idx_entity_artifacts_artifact ON entity_artifacts(artifact_id);

  artifact_versions:
    purpose: "Track artifact version history over time"
    priority: medium
    schema: |
      CREATE TABLE artifact_versions (
          id INTEGER PRIMARY KEY AUTOINCREMENT,
          artifact_id TEXT NOT NULL REFERENCES artifacts(id) ON DELETE CASCADE,

          -- Version info
          version_number INTEGER NOT NULL,
          content_hash TEXT NOT NULL,
          created_at TEXT NOT NULL,

          -- What changed
          change_type TEXT CHECK (change_type IN ('created', 'modified', 'metadata_only')),
          change_summary TEXT,

          -- Provenance
          commit_sha TEXT,
          task_id TEXT,

          UNIQUE(artifact_id, version_number)
      );
      CREATE INDEX idx_artifact_versions_artifact ON artifact_versions(artifact_id);

