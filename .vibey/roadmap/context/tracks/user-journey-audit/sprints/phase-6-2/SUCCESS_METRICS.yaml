success_metrics:
  generated: "2025-12-16"
  purpose: "Measurable success criteria for improvement roadmap"

  coverage_targets:
    documentation:
      metric: "Percentage of CLI commands with accurate documentation"
      current: 70
      target: 100
      measurement: "Audit of CLI_REFERENCE.md vs actual commands"
      frequency: "Per release"

    test_coverage:
      metric: "Test coverage percentage"
      current: 90
      target: 95
      measurement: "pytest --cov output"
      frequency: "Per commit (CI)"

    mcp_tool_tests:
      metric: "Percentage of MCP tools with tests"
      current: 50
      target: 95
      measurement: "Count of test files vs tool files"
      frequency: "Per sprint"

    journey_coverage:
      metric: "Personas with complete journey documentation"
      current: 3
      target: 5
      measurement: "Count of JOURNEY_*.md files"
      frequency: "Per audit"

  quality_metrics:
    friction_points:
      metric: "Number of documented friction points"
      current: 38
      target: 10
      measurement: "Friction analysis audit"
      frequency: "Quarterly"

    broken_links:
      metric: "Number of broken internal documentation links"
      current: "Unknown"
      target: 0
      measurement: "Link checker tool"
      frequency: "Per release"

    documentation_drift:
      metric: "CLI/MCP commands not matching reference"
      current: "Unknown"
      target: 0
      measurement: "vibey docs check-drift"
      frequency: "Per commit (CI)"

    code_quality:
      metric: "Files over 1000 lines"
      current: 3
      target: 0
      measurement: "wc -l analysis"
      frequency: "Per sprint"

  satisfaction_indicators:
    onboarding_time:
      metric: "Time for new developer to complete setup"
      current: "60+ minutes"
      target: "30 minutes"
      measurement: "Walkthrough timing"
      frequency: "Per major release"

    installation_success:
      metric: "Percentage of users who successfully install"
      current: 0
      target: 95
      measurement: "Installation instructions work"
      frequency: "Per release"

    documentation_search:
      metric: "Can users find answers in docs"
      current: "Unknown"
      target: 90
      measurement: "User feedback, support requests"
      frequency: "Quarterly"

  technical_debt:
    debt_items:
      metric: "Number of identified technical debt items"
      current: 25
      target: 10
      measurement: "TECHNICAL_DEBT_INVENTORY.yaml count"
      frequency: "Quarterly"

    debt_hours:
      metric: "Estimated hours to address all debt"
      current: 70
      target: 20
      measurement: "TECHNICAL_DEBT_INVENTORY.yaml effort sum"
      frequency: "Quarterly"

  tracking_dashboard:
    primary_kpis:
      - name: "Documentation Accuracy"
        current: "70%"
        target: "100%"
        status: "needs_improvement"

      - name: "Test Coverage"
        current: "90%"
        target: "95%"
        status: "on_track"

      - name: "Friction Points"
        current: "38"
        target: "10"
        status: "needs_improvement"

      - name: "Installation Success"
        current: "0%"
        target: "95%"
        status: "critical"

    status_definitions:
      on_track: "Within 10% of target"
      needs_improvement: "10-50% from target"
      critical: "More than 50% from target"

  milestone_targets:
    phase_a_complete:
      date: "Week 1"
      metrics:
        - installation_success >= 95%
        - broken_links = 0
        - documentation_drift = 0

    phase_b_complete:
      date: "Week 4"
      metrics:
        - documentation >= 95%
        - code_quality <= 1

    phase_c_complete:
      date: "Week 8"
      metrics:
        - test_coverage >= 95%
        - journey_coverage = 5
        - mcp_tool_tests >= 95%

    phase_d_complete:
      date: "Week 12"
      metrics:
        - friction_points <= 10
        - debt_items <= 10
        - code_quality = 0

  reporting:
    format: "markdown"
    frequency: "weekly"
    distribution:
      - "Project roadmap status"
      - "Sprint retrospectives"
    template: |
      ## Metrics Report - Week {week}

      ### Coverage
      - Documentation: {doc_pct}% (target: 100%)
      - Tests: {test_pct}% (target: 95%)
      - Journeys: {journey_count}/5

      ### Quality
      - Friction points: {friction_count} (target: <10)
      - Broken links: {broken_links} (target: 0)

      ### Technical Debt
      - Items: {debt_items} (target: <10)
      - Hours: {debt_hours} (target: <20)
