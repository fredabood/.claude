    implementation_plan: docs/development/CONTINUE_PORT_IMPLEMENTATION.md
    notes: "Continue.dev is high-priority for multi-IDE reach:\n\n1. Compatibility\
      \ (80%)\n   - Custom slash commands (perfect for agents!)\n   - Context provider\
      \ API (workflow context)\n   - Configuration-driven (config.json)\n   - Model-agnostic\n\
      \n2. Moderate Effort (2 sprints = 3.5 weeks)\n   - IDE extension complexity\n\
      \   - Context provider implementation\n   - Multi-IDE testing (VS Code + JetBrains)\n\
      \n3. Strategic Value\n   - VS Code: 75% of developers\n   - JetBrains: Professional\
      \ developers\n   - Open source community\n   - Active development\n\nAdapter\
      \ Strategy:\n- Map Vibey agents → Continue slash commands\n- Map Vibey workflows\
      \ → Command sequences\n- Map Vibey context → Context providers\n- Generate .continue/\
      \ directory\n- Templates: config.json.j2, commands/*.j2\n\nKey Mappings:\n-\
      \ Agent: web-developer → /web-developer slash command\n- Workflow steps → Prompt\
      \ templates\n- Handoffs → Context provider data\n- Quality gates → Validation\
      \ commands\n\nContinue Slash Command Example:\n{\n  \"name\": \"web-developer\"\
      ,\n  \"description\": \"Full-stack web development agent\",\n  \"prompt\": \"\
      {{ agent.instructions | from_template }}\"\n}\n\nContext Provider Example:\n\
      {\n  \"name\": \"vibey-workflow\",\n  \"type\": \"custom\",\n  \"config\": {\n\
      \    \"workflow\": \"{{ workflow.id }}\",\n    \"context\": \"{{ workflow.context\
      \ }}\"\n  }\n}\n\nValidation:\n- Test in VS Code\n- Test in IntelliJ IDEA\n\
      - Test in PyCharm\n- Verify context providers load\n- Ensure commands execute\
      \ correctly\n\nTimeline: Q3 2025 (after Aider port)\n"
