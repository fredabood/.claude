    notes: "GITHUB COPILOT PORT - READY TO IMPLEMENT (Nov 2025)\n\nRESEARCH UPDATE\
      \ (2025-11-23):\nGitHub Copilot MCP support went GA on July 14, 2025 - much\
      \ earlier\nthan the originally expected Q1-Q2 2026 timeline. The track blocker\n\
      is resolved and implementation can begin immediately.\n\nKEY FINDINGS:\n- MCP\
      \ Support: GA in VS Code (July 2025), JetBrains/Eclipse/Xcode (Aug 2025)\n-\
      \ Custom Agents: Released October 28, 2025 via .github/agents/*.md\n- Extensions\
      \ Deprecated: GitHub App-based extensions sunset Nov 10, 2025\n- Workspace Sunset:\
      \ Technical preview ended May 30, 2025 (use Agent Mode)\n\nARCHITECTURE:\n-\
      \ Reuse existing Vibey MCP server (framework/mcp/server.py)\n- Create CopilotAdapter\
      \ following established adapter pattern\n- Generate .github/agents/*.md from\
      \ agent frontmatter (zero drift)\n- Focus on Agent Mode integration (not Workspace)\n\
      \nCOPILOT CUSTOM AGENT FORMAT:\n---\nname: vibey-web-developer\ndescription:\
      \ Build modern, responsive user interfaces...\ntools: [read, edit, search, vibey/vibey_web_developer]\n\
      mcp-servers:\n  vibey:\n    type: local\n    command: python\n    args: [-m,\
      \ framework.mcp.server]\n    tools: [\"*\"]\n---\n\nMCP LIMITATIONS TO HANDLE:\n\
      - Only tools supported (no resources/prompts)\n- 128-tool limit per request\
      \ (use allowlists)\n- No OAuth for remote servers (use local stdio)\n\nSOURCES:\n\
      - https://github.blog/changelog/2025-07-14-model-context-protocol-mcp-support-in-vs-code-is-generally-available/\n\
      - https://github.blog/changelog/2025-10-28-custom-agents-for-github-copilot/\n\
      - https://docs.github.com/en/copilot/reference/custom-agents-configuration\n\
      \nTimeline: Q4 2025 (6 weeks)\n"
