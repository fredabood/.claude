    notes: |
      DIRECTORY CONSOLIDATION TRACK

      CURRENT STATE:
      - vibey/ = Python package (CLI, operations, adapters, config)
      - framework/ = Mixed content + legacy code

      PROBLEM:
      - Duplicate directories: adapters/, roadmap/
      - Confusing imports: vibey imports from framework
      - Legacy code in framework/scripts/ (42 files)
      - Unclear separation of concerns

      TARGET STATE:
      - vibey/ = ALL Python code (package)
      - framework/ = ONLY content files:
        - agents/*.md
        - workflows/*.md
        - templates/*.md
        - (maybe) config examples

      MIGRATION RISKS:
      - Breaking imports across 31+ files
      - Test failures
      - Platform adapter breakage
      - MCP server disruption

      APPROACH:
      1. Map all dependencies first
      2. Create compatibility shims if needed
      3. Migrate in phases with tests
      4. Update imports incrementally
      5. Remove legacy code last
