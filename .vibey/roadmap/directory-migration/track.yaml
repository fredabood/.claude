    track_merge_history: |
      2025-11-15: Absorbed core-framework track for unified tracking

      This track now includes work from both tracks:

      DESIGN PHASE (Nov 7-9, 2025 - originally core-framework):
      - RoadmapCache implementation and optimization
      - CLI formatting and output improvements
      - Vibey Manager enhancements for roadmap commands
      - Config architecture design and documentation
      - Framework layer foundation

      IMPLEMENTATION PHASE (Nov 10-11, 2025 - directory-migration):
      - Python package structure (vibey/)
      - Config loader and models implementation
      - CLI tool (vibey command)
      - Platform adapters (base, Claude Code, Goose)
      - Operations library
      - Migration tools and auto-migration
      - Comprehensive testing

      Merge rationale:
      - Eliminates design vs implementation confusion
      - Single source of truth for platform-agnostic architecture
      - Simplified dependency tracking
      - Clearer historical narrative

      Both tracks' work was completed successfully. All deliverables exist and function.
      Merge is purely for organizational clarity and data integrity.
    notes: "CRITICAL INFRASTRUCTURE TRACK - BLOCKS ALL PLATFORM PORTS\n\nThis track\
      \ migrates Vibey from a .claude/-centric deployment to a\nplatform-agnostic\
      \ .vibey/ source-of-truth architecture. This is the\nHIGHEST PRIORITY foundation\
      \ work for multi-platform support.\n\nCURRENT STATE (v1.2.0):\n- Framework deployed\
      \ to .claude/ (platform-specific)\n- Only roadmap system in .vibey/\n- Scripts\
      \ at .claude/scripts/ (50+ references)\n- Impossible to deploy to other platforms\n\
      \nTARGET STATE (v2.5.0):\n- Single source of truth: .vibey/\n- Platform deployments:\
      \ .claude/, .goose/, .cursor/ (generated)\n- Unified CLI: vibey command (no\
      \ path dependencies)\n- Adapter pattern: platform-specific transformations\n\
      \nIMPLEMENTATION STRATEGY:\n\nSprint 1: Unified CLI Tool (2 weeks)\n-------------------------------------\n\
      Goal: Build standalone vibey CLI that works independently of .claude/\n\nTasks:\n\
      1. Create Python package structure (pyproject.toml, setup.py)\n2. Move framework/scripts/\
      \ → vibey/cli/\n3. Create entry point: vibey/__main__.py\n4. Register CLI commands\
      \ (Click/Typer)\n5. Update imports: from framework.roadmap → from vibey.roadmap\n\
      6. Test: pip install -e . && vibey --version\n7. Verify all roadmap commands\
      \ work without .claude/ prefix\n8. Create tests for CLI commands\n9. Document\
      \ CLI usage\n10. Package for PyPI distribution\n11. Verify installation on clean\
      \ system\n12. Update PATH dependencies\n\nDeliverables:\n- vibey command installed\
      \ globally\n- All roadmap commands work via vibey roadmap ...\n- No dependencies\
      \ on .claude/scripts/\n- Python package structure complete\n\nSprint 2: Config\
      \ Migration System (3 weeks)\n--------------------------------------------\n\
      Goal: Move configuration from .claude/ to .vibey/config/\n\nTasks:\n1. Design\
      \ modular config schema\n   - .vibey/config/project.yaml\n   - .vibey/config/framework.yaml\n\
      \   - .vibey/config/agents.yaml\n   - .vibey/config/quality-gates.yaml\n2. Create\
      \ config models (Pydantic/dataclasses)\n3. Implement config loader with fallback\n\
      4. Create migration tool: vibey migrate config\n5. Parse old .claude/project-config.yaml\n\
      6. Split into modular configs\n7. Validate migrated configs\n8. Create backup\
      \ before migration\n9. Update all config references in codebase\n10. Add deprecation\
      \ warnings for old location\n11. Test auto-migration on first command\n12. Document\
      \ config structure\n13. Create config validation command\n14. Handle edge cases\
      \ (custom configs, missing fields)\n15. Add rollback mechanism\n\nDeliverables:\n\
      - Modular config system in .vibey/config/\n- Migration tool for existing projects\n\
      - Backward compatibility during transition\n- Auto-migration on first vibey\
      \ command\n\nSprint 3: Platform Adapter Implementation (3 weeks)\n----------------------------------------------------\n\
      Goal: Generate .claude/, .goose/ deployments from .vibey/ source\n\nTasks:\n\
      1. Design adapter interface (PlatformAdapter base class)\n2. Define adapter\
      \ methods:\n   - get_platform_name()\n   - get_deployment_dir()\n   - deploy(source,\
      \ config)\n   - generate_context_file(config)\n   - validate_deployment()\n\
      3. Implement Claude Code adapter\n4. Test Claude adapter deployment\n5. Implement\
      \ Goose adapter (basic)\n6. Test Goose adapter deployment\n7. Create vibey deploy\
      \ command\n8. Add --platform flag (claude, goose, all)\n9. Add --clean flag\
      \ (remove and redeploy)\n10. Add validation after deployment\n11. Update .gitignore\
      \ rules\n12. Create platform detection logic\n13. Test multi-platform deployment\n\
      14. Document adapter development guide\n15. Create adapter test suite\n16. Validate\
      \ backward compatibility\n17. Test migration on real projects\n18. Create migration\
      \ rollback tool\n\nDeliverables:\n- Adapter interface and base class\n- Claude\
      \ Code adapter (full)\n- Goose adapter (basic)\n- vibey deploy command\n- Updated\
      \ .gitignore rules\n\nMIGRATION PATH FOR USERS:\n\nStep 1: Install new CLI\n\
      $ pip install --upgrade vibey-framework\n$ vibey --version  # v2.5.0\n\nStep\
      \ 2: Run migration\n$ cd my-project\n$ vibey migrate\n\nMigration Process:\n\
      1. Detect .claude/ installation\n2. Create .vibey/ directory structure\n3. Migrate\
      \ config: .claude/project-config.yaml → .vibey/config/\n4. Migrate roadmap (already\
      \ in .vibey/, no changes)\n5. Copy custom templates if any\n6. Regenerate .claude/\
      \ as deployment\n7. Update .gitignore\n\nStep 3: Verify\n$ vibey validate\n\n\
      BACKWARD COMPATIBILITY:\n\n- Auto-migration on first vibey command\n- Legacy\
      \ .claude/project-config.yaml supported (with warning)\n- 2-release deprecation\
      \ period (v2.5, v2.6)\n- Full removal in v3.0.0\n\nRISKS AND MITIGATION:\n\n\
      Risk 1: Breaking existing installations\n→ Auto-migration, backward compatibility,\
      \ rollback mechanism\n\nRisk 2: Script path dependencies (50+ references to\
      \ .claude/scripts/)\n→ Unified CLI eliminates path dependencies\n\nRisk 3: User\
      \ confusion during transition\n→ Clear migration guide, automated process, visual\
      \ indicators\n\nRisk 4: Platform adapter bugs\n→ Extensive testing, validation\
      \ after deployment, easy rollback\n\nSUCCESS METRICS:\n\nTechnical:\n- 100%\
      \ backward compatibility\n- 0 breaking changes for existing users\n- <5 minutes\
      \ for auto-migration\n- All 200+ tests passing after migration\n\nUser Experience:\n\
      - Clear migration path documented\n- Auto-migration succeeds >95%\n- Users understand\
      \ new structure\n- No increase in support requests\n\nPlatform Expansion:\n\
      - Unblocks goose-port track\n- Enables multi-platform track\n- New platform\
      \ adapter in <1 week\n- 90% code reuse across platforms\n\nDEPENDENCIES:\n\n\
      Requires:\n- testing-system (need test coverage to validate migration)\n- roadmap-system\
      \ (foundation already in .vibey/)\n\nBlocks:\n- goose-port (cannot proceed without\
      \ adapter pattern)\n- aider-port (cannot proceed without adapter pattern)\n\
      - continue-port (cannot proceed without adapter pattern)\n- windsurf-port (cannot\
      \ proceed without adapter pattern)\n- jetbrains-port (cannot proceed without\
      \ adapter pattern)\n- multi-platform (depends on this architecture)\n\nTIMELINE:\n\
      \nWeek 1-2: Sprint 1 (Unified CLI)\nWeek 3-5: Sprint 2 (Config Migration)\n\
      Week 6-8: Sprint 3 (Platform Adapters)\nWeek 9+: Post-migration (docs, monitoring,\
      \ bug fixes)\n\nThis track is CRITICAL for the future of Vibey. Without it,\
      \ we cannot\nexpand to other platforms and remain locked to Claude Code's .claude/\n\
      directory structure.\n\nRecommend: START IMMEDIATELY AFTER testing-system COMPLETION\n"
