    notes: |
      Sprint 2 completes the integration with CLI and AI context loading.

      CLI Usage:
        vibey discover --output-context
        vibey discover codebase --track mytrack
        vibey discover git-history --track mytrack
        vibey discover dependencies --track mytrack
        vibey discover all --track mytrack

      Context Loading Flow:
      1. Discovery runs and writes to context/
      2. AI agent loads track context
      3. Discovery results included in prompt
      4. Agent has full project understanding

      Directory structure after discovery:
        .vibey/roadmap/[track]/context/
        ├── discovery/
        │   ├── codebase-audit.md
        │   ├── git-analysis.md
        │   ├── dependencies.yaml
        │   ├── architecture.md
        │   └── discovery-manifest.yaml
        └── ...other context files
