      - .vibey/roadmap/[track]/context/codebase-audit.md
      - .vibey/roadmap/[track]/context/git-analysis.md
      - .vibey/roadmap/[track]/context/dependencies.yaml
      - .vibey/roadmap/[track]/context/architecture.md

      Benefits:
      - Discovery results persist across sessions
      - AI agents can load discovery context
      - Track-specific context accumulates
      - Enables diff-based discovery updates
