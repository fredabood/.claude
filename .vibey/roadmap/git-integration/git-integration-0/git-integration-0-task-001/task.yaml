task:
  id: git-integration-0-task-001
  name: Define Vibey-Git primitive mapping
  status: completed
  priority: critical
  estimated_hours: 8
  assigned_agent: architecture-agent
  created: '2025-11-24T00:00:00+00:00'
  started: '2025-11-24T00:00:00+00:00'
  completed: '2025-11-24T00:00:00+00:00'
  description: |
    Establish the foundational mapping between Vibey and Git primitives:

    MAPPING QUESTIONS:
    - Roadmap → Repository? Branch? Tag namespace?
    - Track → Branch? Directory? Tag prefix?
    - Sprint → Branch? Tag? Commit range?
    - Task → Commit(s)? Branch? Issue?
    - Quality Gate → CI check? Tag? Commit status?
    - Blocker → Branch protection? Label?
    - Dependency → Branch dependency? Merge order?

    CONSIDERATIONS:
    - Does the mapping preserve hierarchy?
    - Can mappings be bidirectional (Git → Vibey)?
    - How do parallel tracks/sprints work?
    - Compatibility with existing Git workflows

    DELIVERABLES:
    - Mapping specification document
    - Decision rationale for each mapping
    - Examples showing mappings in practice
    - Edge cases and limitations
