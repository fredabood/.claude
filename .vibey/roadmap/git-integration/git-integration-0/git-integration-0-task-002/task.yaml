  description: 'Define which system is authoritative for roadmap state:


    OPTIONS TO EVALUATE:

    1. YAML-primary: YAML files are authoritative, Git tracks changes

    2. Git-primary: Git history is authoritative, YAML derived

    3. Hybrid: YAML for current state, Git for audit trail


    QUESTIONS TO ANSWER:

    - Can roadmap state at commit X be reconstructed from Git alone?

    - What happens when YAML and Git history disagree?

    - How do merges affect roadmap state?

    - Is the roadmap a "document" (YAML) or a "log" (Git)?

    - How to handle rebases that rewrite history?


    DELIVERABLES:

    - Source of truth policy document

    - Conflict resolution procedures

    - State reconciliation algorithm

    '
