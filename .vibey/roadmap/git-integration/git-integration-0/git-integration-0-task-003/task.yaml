  description: |
    Define standard commit message format for Vibey integration:

    FORMATS TO SUPPORT:
    - Conventional commits: feat(task-id): description
    - Footer references: Task: task-id, Status: completed
    - Bracket notation: [task-id] description
    - Multiple tasks in single commit

    QUESTIONS TO ANSWER:
    - Required vs optional task references?
    - How to reference sprint/track completion?
    - How to indicate status changes in commits?
    - Multi-task commits - how to attribute?
    - Merge commits - special handling?

    DELIVERABLES:
    - Commit message specification
    - Parsing rules and regex patterns
    - Examples for common scenarios
    - Linting rules for validation
