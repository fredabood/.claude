  description: |
    Define how Vibey roadmap structure relates to Git branches:

    OPTIONS TO EVALUATE:
    A. Track-per-branch
    B. Sprint-per-branch
    C. Task-per-branch (feature branches)
    D. Hybrid (tracks on branches, tasks on commits)
    E. No enforcement (any branching strategy)

    QUESTIONS TO ANSWER:
    - Does branch structure mirror roadmap hierarchy?
    - How do track dependencies affect merge order?
    - Long-lived branches vs short-lived?
    - How does this work with trunk-based development?
    - GitFlow compatibility?

    DELIVERABLES:
    - Branching strategy specification
    - Branch naming conventions
    - Merge workflow documentation
    - Examples for different team sizes
