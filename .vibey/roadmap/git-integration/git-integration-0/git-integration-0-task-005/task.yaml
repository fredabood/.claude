  description: 'Establish the philosophy for how strictly Vibey enforces Git integration:


    ENFORCEMENT MODES:

    - Off: No enforcement (legacy/gradual adoption)

    - Advisory: Warn but allow (soft guidance)

    - Blocking: Prevent invalid operations (strict)

    - Audit: Log everything, don''t block (compliance)


    ENFORCEMENT POINTS:

    - Pre-commit: Validate roadmap YAML integrity

    - Commit-msg: Validate task references

    - Pre-push: Validate before remote push

    - PR/MR: Check for status conflicts

    - CI: Quality gate validation


    DELIVERABLES:

    - Enforcement policy specification

    - Configuration schema for modes

    - Override/bypass procedures

    - Error message guidelines

    '
