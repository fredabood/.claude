  description: "Implement commands for reconstructing roadmap state from Git history:\n\
    \nCOMMANDS (from Sprint 0 design):\n1. vibey git state-at <ref>\n   Show roadmap\
    \ state at specific commit/tag/date\n\n2. vibey git diff <ref1> <ref2>\n   Compare\
    \ roadmap states between two refs\n\n3. vibey git history <task-id>\n   Show complete\
    \ change history for a task\n\n4. vibey git progress <sprint-id>\n   Show sprint\
    \ progress over time (for burndown charts)\n\n5. vibey git rollback <ref>\n  \
    \ Restore roadmap YAML files to state at ref\n\nIMPLEMENTATION (from 006-state-reconstruction.md):\n\
    - Use git show/checkout to read YAML at specific commits\n- Parse YAML changes\
    \ to derive history\n- Support date-based queries (convert date to commit)\n-\
    \ Cache frequently accessed states for performance\n- Provide both summary and\
    \ detailed output formats\n\nFEATURES:\n- Point-in-time state queries\n- Attribution\
    \ (who changed what, when)\n- Progress history for sprint burndown\n- Safe rollback\
    \ with dry-run mode\n"
