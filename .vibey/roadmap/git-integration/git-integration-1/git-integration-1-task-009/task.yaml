  description: "Add support for parsing Git tags as explicit state markers:\n\nTAG\
    \ FORMATS (from Sprint 0 addendum):\n- Sprint tags: sprint/<sprint-id>/start,\
    \ sprint/<sprint-id>/end\n- Task tags: <track>/<sprint>/<task>/<marker>\n\nFEATURES:\n\
    - Detect sprint boundaries from tags\n- Use tags for commit range queries\n- Parse\
    \ task tags for explicit milestones\n- Query commits between tags efficiently\n\
    \nINTEGRATION:\n- Enhance commit correlation engine to use tags\n- Speed up analysis\
    \ by using tag refs instead of full log scan\n- Support both message-based and\
    \ tag-based task linking\n\nCLI ADDITIONS:\n- vibey git tags --task <task-id>\n\
    \  List all tags for a task\n\n- vibey git tag-range <task-id>\n  Get commit range\
    \ between task start/end tags\n"
