    notes: |
      Sprint 1 focuses on git history analysis and commit correlation.

      Key commit message formats to support:
      - feat(task-id): description
      - fix(task-id): description
      - Conventional commits with task references
      - [TASK-123] style references

      The correlation engine will:
      1. Parse commit messages for task IDs
      2. Link commits to roadmap tasks
      3. Calculate contribution metrics
      4. Provide sprint velocity from actual work
