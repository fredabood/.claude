  description: |
    Build the pre-commit hook infrastructure based on Sprint 0 design:

    HOOK RESPONSIBILITIES:
    - Validate roadmap YAML syntax and schema
    - Check task status consistency
    - Verify referenced tasks exist
    - Validate commit message format (per Sprint 0 conventions)
    - Enforce configured enforcement mode

    IMPLEMENTATION:
    - Hook script in vibey/operations/git/hooks/
    - Configuration loading from .vibey/config/
    - Exit codes following Git conventions
    - Clear error messages with remediation hints

    ENFORCEMENT MODES (from Sprint 0):
    - Off: Skip all checks
    - Advisory: Warn but exit 0
    - Blocking: Exit non-zero on violations
    - Audit: Log violations, exit 0
