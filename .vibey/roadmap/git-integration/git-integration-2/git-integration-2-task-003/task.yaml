  description: "Add CLI commands for managing git hooks:\n\nCOMMANDS:\n- vibey git\
    \ hooks install\n  Install all Vibey git hooks to .git/hooks/\n  Options: --force\
    \ (overwrite existing), --backup\n\n- vibey git hooks uninstall\n  Remove Vibey\
    \ git hooks\n  Options: --restore (restore backups)\n\n- vibey git hooks status\n\
