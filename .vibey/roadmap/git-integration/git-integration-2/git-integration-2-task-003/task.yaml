  description: |
    Add CLI commands for managing git hooks:

    COMMANDS:
    - vibey git hooks install
      Install all Vibey git hooks to .git/hooks/
      Options: --force (overwrite existing), --backup

    - vibey git hooks uninstall
      Remove Vibey git hooks
      Options: --restore (restore backups)

    - vibey git hooks status
      Show which hooks are installed and their versions

    - vibey git hooks update
      Update hooks to latest version

    FEATURES:
    - Detect existing hooks and offer to chain
    - Support for hook directories (Git 2.9+)
    - Cross-platform compatibility (bash/python)
