  description: |
    Create commands for managing sprint boundary tags:

    TAG FORMAT (from Sprint 0 architecture):
    - sprint/<sprint-id>/start - Marks sprint beginning
    - sprint/<sprint-id>/end - Marks sprint completion

    CLI COMMANDS:
    - vibey git tag sprint-start <sprint-id>
      Create start tag at current commit

    - vibey git tag sprint-end <sprint-id>
      Create end tag at current commit

    - vibey sprint start <sprint-id>
      Combined: Update sprint status + create start tag

    - vibey sprint complete <sprint-id>
      Combined: Update sprint status + create end tag

    FEATURES:
    - Annotated tags with sprint metadata
    - Prevent duplicate tags (error if tag exists)
    - Push tags to remote (optional)
    - List all sprint tags

    INTEGRATION:
    - Used by Sprint 1's velocity calculator
    - Used by state reconstruction queries
    - Enables commit range queries per sprint
