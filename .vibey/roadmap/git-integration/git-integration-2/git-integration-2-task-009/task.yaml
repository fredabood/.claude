  description: "Create commands for managing sprint boundary tags:\n\nTAG FORMAT (from\
    \ Sprint 0 architecture):\n- sprint/<sprint-id>/start - Marks sprint beginning\n\
    - sprint/<sprint-id>/end - Marks sprint completion\n\nCLI COMMANDS:\n- vibey git\
    \ tag sprint-start <sprint-id>\n  Create start tag at current commit\n\n- vibey\
    \ git tag sprint-end <sprint-id>\n  Create end tag at current commit\n\n- vibey\
    \ sprint start <sprint-id>\n  Combined: Update sprint status + create start tag\n\
    \n- vibey sprint complete <sprint-id>\n  Combined: Update sprint status + create\
    \ end tag\n\nFEATURES:\n- Annotated tags with sprint metadata\n- Prevent duplicate\
    \ tags (error if tag exists)\n- Push tags to remote (optional)\n- List all sprint\
    \ tags\n\nINTEGRATION:\n- Used by Sprint 1's velocity calculator\n- Used by state\
    \ reconstruction queries\n- Enables commit range queries per sprint\n"
