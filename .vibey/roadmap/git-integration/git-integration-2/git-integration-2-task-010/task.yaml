    \ merge states\n\nFEATURES:\n- Dry-run mode (show what would change)\n- Selective\
    \ sync (only specific track/sprint)\n- Conflict warnings if YAML disagrees with\
    \ Git\n- Add _git_sync metadata to YAML files\n\nREQUIREMENTS:\n- Only runs in\
    \ Git-primary mode\n- Validates required tags/branches exist\n- Fails gracefully\
    \ with clear error messages\n"
