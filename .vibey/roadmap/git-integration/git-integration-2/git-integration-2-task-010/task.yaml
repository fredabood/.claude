  description: |
    Build command to derive YAML from Git state (Git-primary mode):

    COMMAND:
    - vibey git sync
      Derive and update YAML files from Git branches/tags/commits

    DERIVATION RULES (from Sprint 0 addendum):
    Task status:
      not_started: no branch AND no commits
      in_progress: branch exists OR commits exist BUT not merged
      completed: branch merged AND end tag present

    Sprint status:
      not_started: no start tag
      in_progress: start tag exists, no end tag
      completed: end tag exists

    Progress metrics:
      Calculate from tag counts and branch merge states

    FEATURES:
    - Dry-run mode (show what would change)
    - Selective sync (only specific track/sprint)
    - Conflict warnings if YAML disagrees with Git
    - Add _git_sync metadata to YAML files

    REQUIREMENTS:
    - Only runs in Git-primary mode
    - Validates required tags/branches exist
    - Fails gracefully with clear error messages
