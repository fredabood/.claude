  task_type: development
  title: Implement tag repair automation
  description: "Automate repair of dangling tags after rebase/squash:\n\nPROBLEM (from\
    \ Sprint 0 addendum):\n- After rebase/squash, tags point to old (non-existent)\
    \ SHAs\n- Sprint and task tags become invalid\n- Need to re-create tags on new\
    \ commits\n\nCLI COMMANDS:\n- vibey git validate-tags\n  Detect dangling tags\
    \ (tags pointing to missing commits)\n\n- vibey git repair-tags\n  Automatically\
    \ repair tags by finding new commits\n\n- vibey git tag-move <tag> <new-sha>\n\
    \  Manually move a tag to different commit\n\nREPAIR ALGORITHM:\n1. Find all dangling\
    \ tags\n2. For each tag:\n   - Parse tag name to get task/sprint ID\n   - Get\
    \ original commit message\n   - Search new commits for matching message + task\
    \ ref\n   - Delete old tag, recreate on new commit\n3. Report repaired/unfixable\
    \ tags\n\nAUTOMATIC HOOKS:\n- post-rebase hook: detect and repair tags\n- post-merge\
    \ hook: repair after squash merge\n\nCONFIGURATION:\n- git.tags.repair.auto: true/false\n\
    - git.tags.repair.strategy: message_match|manual|skip\n"
