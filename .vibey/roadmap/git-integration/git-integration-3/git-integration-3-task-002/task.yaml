  description: |
    Automate repair of dangling tags after rebase/squash:

    PROBLEM (from Sprint 0 addendum):
    - After rebase/squash, tags point to old (non-existent) SHAs
    - Sprint and task tags become invalid
    - Need to re-create tags on new commits

    CLI COMMANDS:
    - vibey git validate-tags
      Detect dangling tags (tags pointing to missing commits)

    - vibey git repair-tags
      Automatically repair tags by finding new commits

    - vibey git tag-move <tag> <new-sha>
      Manually move a tag to different commit

    REPAIR ALGORITHM:
    1. Find all dangling tags
    2. For each tag:
       - Parse tag name to get task/sprint ID
       - Get original commit message
       - Search new commits for matching message + task ref
       - Delete old tag, recreate on new commit
    3. Report repaired/unfixable tags

    AUTOMATIC HOOKS:
    - post-rebase hook: detect and repair tags
    - post-merge hook: repair after squash merge

    CONFIGURATION:
    - git.tags.repair.auto: true/false
    - git.tags.repair.strategy: message_match|manual|skip
