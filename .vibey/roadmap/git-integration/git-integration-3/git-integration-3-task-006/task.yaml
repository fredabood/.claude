  title: Implement dependency-aware merge ordering
  description: "Suggest/enforce merge order based on roadmap dependencies:\n\nSCENARIOS:\n\
    - Sprint B depends on Sprint A\n  → Warn if merging B's branch before A's\n\n\
    - Task 2 depends on Task 1\n  → Suggest merging Task 1's PR first\n\n- Track X\
    \ blocks Track Y\n  → Prevent Y's branch merge until X complete\n\nIMPLEMENTATION:\n\
    - Analyze dependency graph\n- Compare with branch/PR state\n- Generate merge order\
    \ recommendation\n\nCLI COMMANDS:\n- vibey git merge-order\n  Show recommended\
    \ merge sequence\n\n- vibey git dependency-check <branch>\n  Check if branch dependencies\
    \ are satisfied\n\nFEATURES:\n- Configurable enforcement (suggest vs block)\n\
    - Dependency visualization\n- Override capability for exceptions\n"
