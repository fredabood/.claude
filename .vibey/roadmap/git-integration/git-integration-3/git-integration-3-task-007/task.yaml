  title: Implement strategy preset adoption
  description: "Add commands for adopting Git strategy presets:\n\nPRESETS (from Sprint\
    \ 0 addendum):\n1. trunk-based: No branches, commits on main\n2. feature-branch:\
    \ Branch per task, PR-based\n3. gitflow: Track branches, sprint branches optional\n\
    4. hierarchical: Full track/sprint/task hierarchy\n\nCLI COMMANDS:\n- vibey git\
    \ strategy list\n  Show available presets with descriptions\n\n- vibey git strategy\
    \ adopt <preset>\n  Adopt a preset strategy\n  Updates .vibey/config/git.yaml\
    \ with requirements\n\n- vibey git strategy show\n  Show current strategy configuration\n\
    \n- vibey git strategy validate\n  Check if current Git state meets strategy requirements\n\
    \nADOPTION WORKFLOW:\n1. User runs: vibey git strategy adopt gitflow\n2. Shows\
    \ what will be configured\n3. Asks for confirmation\n4. Updates config file\n\
    5. Validates current state\n6. Suggests fixes for violations\n\nCUSTOMIZATION:\n\
    - vibey git strategy adopt gitflow --customize\n  Interactive prompts to modify\
    \ preset\n\nPRESET DEFINITIONS:\n- Load from vibey/config/strategy_presets.yaml\n\
    - Include requirements, enforcement mode, examples\n"
