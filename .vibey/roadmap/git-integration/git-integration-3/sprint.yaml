    notes: |
      Sprint 3 builds advanced features on top of Sprint 2's core hooks.

      TASK ORDER:
      Tasks are ordered by implementation priority:
      1. Error handling (foundation)
      2. Tag repair (critical for git ops)
      3. PR conflict detection (high-value)
      4. Blocker enforcement (prevent invalid work)
      5. Quality gate CI (automation)
      6. Dependency ordering (smart merging)
      7. Strategy presets (UX improvement)
      8. Integration tests (validation)
      9. Documentation (final polish)

      KEY FEATURES:
      - Conflict detection prevents duplicate task completion claims
      - Quality gates integrate with CI/CD for automated checks
      - Blocker enforcement prevents work on blocked items
      - Dependency ordering suggests optimal merge sequence

      All features respect the enforcement philosophy from Sprint 0:
      - Off/Advisory/Blocking/Audit modes
      - Configurable per-project and per-branch
      - Clear error messages with remediation steps
