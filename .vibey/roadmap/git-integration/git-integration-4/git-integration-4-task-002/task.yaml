  title: Configure commit tracking and evidence requirements
  description: 'Implement and configure the require_commits setting and commit tracking

    for the Vibey repository.


    CONFIGURATION DECISIONS:

    - record_commits: true/false - Store commit SHAs in YAML

    - require_commits: true/false - Require commits for task completion

    - Override policies for non-code tasks


    FEATURES:

    - Bidirectional traceability (commits → tasks, tasks → commits)

    - Reconciliation algorithm implementation

    - CLI commands: validate, repair, link-commits, sync-commits


    DELIVERABLES:

    - Commit tracking configuration

    - Validation and repair tools

    - Documentation for commit evidence requirements

    '
