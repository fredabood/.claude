    notes: |
      Sprint 5: Roadmap Integrity Protection (SQLite-Based)

      DESIGN REFERENCE: sqlite-backend-6/context/architecture/02-CLASS-MODEL.md
      CODE REFERENCE: sqlite-backend-6/context/sample_code/models/

      GOAL: Integrate git hooks with the unified ticket architecture to provide
      commit-level integrity protection for the roadmap system.

      DEPENDS ON: sqlite-backend-9 (Operations Migration) which implements
      process_commit() and verify_completion_claims()

      ARCHITECTURE INTEGRATION:

      1. PRE-COMMIT HOOK (verify_completion_claims):
         ```
         ┌────────────────────────────────────────────────────────────┐
         │ git commit -m "feat: Add auth module                       │
         │                                                            │
         │ Completes: sqlite-backend-6-task-009"                      │
         └────────────────────────────────────────────────────────────┘
                              │
                              ▼
         ┌────────────────────────────────────────────────────────────┐
         │ verify_completion_claims(message)                          │
         │   1. Parse "Completes:" lines → ticket IDs                 │
         │   2. For each ticket: can_transition_to(COMPLETED)?        │
         │   3. If any criteria not met → BLOCK commit                │
         │   4. If all criteria met → ALLOW commit                    │
         └────────────────────────────────────────────────────────────┘
         ```

      2. POST-COMMIT HOOK (process_commit):
         ```
         ┌────────────────────────────────────────────────────────────┐
         │ process_commit(sha)                                        │
         │   1. GitCommit.from_git(sha) → parse file changes          │
         │   2. commit.link_to_artifacts(registry) → match files      │
         │   3. Update artifact states:                               │
         │      - created_by_commit                                   │
         │      - last_modified_by_commit                             │
         │      - content_hash                                        │
         │   4. Detect stale documentation                            │
         │   5. Link commit to tickets (commits_local)                │
         │   6. Run CommitArtifactValidator → generate warnings       │
         └────────────────────────────────────────────────────────────┘
         ```

      3. VALIDATION PHILOSOPHY (from architecture):
         - Criterion is source of truth for what task REQUIRES
         - Commit is record of what HAPPENED
         - Allow divergence, make it visible via warnings
         - Only BLOCK on completion claim with unmet criteria

      4. COMMIT MESSAGE CONVENTION:
         ```
         feat(component): Description of changes

         - Bullet point 1
         - Bullet point 2

         Completes: sqlite-backend-6-task-009
         Completes: sqlite-backend-6-task-010

         🤖 Generated with [Claude Code](https://claude.com/claude-code)

         Co-Authored-By: Claude <noreply@anthropic.com>
         ```

      KEY FILES FROM ARCHITECTURE:
      - sample_code/models/git_commit.py
      - sample_code/models/func_process_commit.py
      - sample_code/models/func_verify_completion_claims.py
      - sample_code/models/commit_artifact_validator.py

      TASK BREAKDOWN (suggested):
      1. Pre-commit hook implementation
      2. Post-commit hook implementation
      3. CommitArtifactValidator integration
      4. CLI commands (validate-commit, show-provenance, check-staleness)
      5. Hook installation/uninstallation updates
      6. Documentation and testing
