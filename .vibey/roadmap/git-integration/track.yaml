    notes: |
      Enhanced git integration to improve traceability, automation, and
      developer workflow. Key features:

      1. Commit Analysis: Parse commit messages to correlate with tasks
      2. History Mining: Extract sprint velocity and patterns from git log
      3. Auto-Updates: Mark tasks complete based on commit conventions
      4. Pre-commit Hooks: Validate roadmap state before commits
      5. Branch Integration: Track feature branches per task/sprint
      6. PR Automation: Generate PR descriptions from task context

      This track builds on existing infrastructure-fixes work that added
      basic commit-to-task mapping. Goal is production-ready git integration.
