  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-24T00:00:00+00:00'
    design_doc: null
    implementation_plan: null
    notes: |
      Enhanced git integration with architecture-first approach.

      SPRINT STRUCTURE:
      0. Integration Architecture & Design (2 weeks, 7 tasks) ✅ COMPLETE
         Establishes "true north" for Vibey-Git integration:
         - How primitives map (roadmap→repo, task→commit, etc.)
         - Three-scenario source of truth (YAML-only, Hybrid, Git-primary)
         - Commit conventions and branching strategy
         - Enforcement philosophy (advisory/blocking/audit)
         - 10 architecture documents, 157KB of design specs

      1. Git History & Commit Analysis (2.5 weeks, 9 tasks)
         Reading/analyzing git history:
         - Parse commits for task references (conventional, footer, bracket)
         - Calculate sprint velocity from git log
         - State reconstruction (state-at, diff, history, progress, rollback)
         - Sprint/task tag parsing
         - vibey git analyze command

      2. Git Hooks Core (3 weeks, 11 tasks)
         Core hook infrastructure:
         - Pre-commit validation
         - Commit-msg parsing
         - Auto status updates
         - Branch linking
         - Sprint tagging system
         - Git-primary sync command
         - Mode detection and strategy enforcement

      3. Advanced Integration (3.5 weeks, 9 tasks)
         Advanced features:
         - PR merge conflict detection
         - Quality gate CI integration
         - Blocker enforcement
         - Dependency-aware merging
         - Tag repair automation
         - Strategy preset adoption

      4. Vibey Repository Dogfooding (1.5 weeks, 5 tasks)
         Apply git integration to Vibey itself:
         - Review enforcement mode options (off/advisory/blocking/audit)
         - Configure commit tracking (require_commits setting)
         - Implement CLI usage suggestions vs manual YAML edits
         - Set up advisory mode with YAML integrity blocking
         - Evaluate dogfooding experience and iterate

      DEPENDENCY CHAIN:
      Sprint 0 → Sprint 1 ─┐
                          ├→ Sprint 3 → Sprint 4
      Sprint 0 → Sprint 2 ─┘

      Sprint 0 (design) must complete before any implementation starts.
      Sprint 1 and 2 can run in parallel after Sprint 0.
      Sprint 3 requires both Sprint 1 and 2.
      Sprint 4 (dogfooding) requires Sprint 3 completion.
