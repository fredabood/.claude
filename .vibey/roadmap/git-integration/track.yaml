    notes: "Enhanced git integration with architecture-first approach.\n\nSPRINT STRUCTURE:\n\
      0. Integration Architecture & Design (2 weeks, 7 tasks) ✅ COMPLETE\n   Establishes\
      \ \"true north\" for Vibey-Git integration:\n   - How primitives map (roadmap→repo,\
      \ task→commit, etc.)\n   - Three-scenario source of truth (YAML-only, Hybrid,\
      \ Git-primary)\n   - Commit conventions and branching strategy\n   - Enforcement\
      \ philosophy (advisory/blocking/audit)\n   - 10 architecture documents, 157KB\
      \ of design specs\n\n1. Git History & Commit Analysis (2.5 weeks, 9 tasks)\n\
      \   Reading/analyzing git history:\n   - Parse commits for task references (conventional,\
      \ footer, bracket)\n   - Calculate sprint velocity from git log\n   - State\
      \ reconstruction (state-at, diff, history, progress, rollback)\n   - Sprint/task\
      \ tag parsing\n   - vibey git analyze command\n\n2. Git Hooks Core (3 weeks,\
      \ 11 tasks)\n   Core hook infrastructure:\n   - Pre-commit validation\n   -\
      \ Commit-msg parsing\n   - Auto status updates\n   - Branch linking\n   - Sprint\
      \ tagging system\n   - Git-primary sync command\n   - Mode detection and strategy\
      \ enforcement\n\n3. Advanced Integration (3.5 weeks, 9 tasks)\n   Advanced features:\n\
      \   - PR merge conflict detection\n   - Quality gate CI integration\n   - Blocker\
      \ enforcement\n   - Dependency-aware merging\n   - Tag repair automation\n \
      \  - Strategy preset adoption\n\n4. Vibey Repository Dogfooding (1.5 weeks,\
      \ 5 tasks)\n   Apply git integration to Vibey itself:\n   - Review enforcement\
      \ mode options (off/advisory/blocking/audit)\n   - Configure commit tracking\
      \ (require_commits setting)\n   - Implement CLI usage suggestions vs manual\
      \ YAML edits\n   - Set up advisory mode with YAML integrity blocking\n   - Evaluate\
      \ dogfooding experience and iterate\n\nDEPENDENCY CHAIN:\nSprint 0 → Sprint\
      \ 1 ─┐\n                    ├→ Sprint 3 → Sprint 4\nSprint 0 → Sprint 2 ─┘\n\
      \nSprint 0 (design) must complete before any implementation starts.\nSprint\
      \ 1 and 2 can run in parallel after Sprint 0.\nSprint 3 requires both Sprint\
      \ 1 and 2.\nSprint 4 (dogfooding) requires Sprint 3 completion.\n"
