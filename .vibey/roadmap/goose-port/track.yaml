    name: Frontmatter Schema & Asset Migration
    status: completed
    estimated_duration: 2 weeks
    tasks_count: 8
    started: null
    description: 'Design YAML frontmatter schema for agents/workflows/handoffs.

      Migrate all 19 agents, 16 workflows, and 22 handoffs to include

      structured frontmatter that MCP server can parse dynamically.

      Tasks:

      1. Design frontmatter schema for agents (id, name, type, triggers, inputs, outputs)

      2. Design frontmatter schema for workflows (id, name, steps, agents, quality_gates)

      3. Design frontmatter schema for handoffs (id, name, from_agent, to_agent, fields)

      4. Create migration script to add frontmatter to existing files

      5. Migrate 19 agent markdown files

      6. Migrate 16 workflow markdown files

      7. Migrate 22 handoff template files

      8. Validate all migrations with schema validator

      '
  - id: goose-port-2
    name: Dynamic Discovery in MCP Server
    status: completed
    estimated_duration: 2 weeks
    tasks_count: 6
    started: '2025-11-22T00:00:00+00:00'
    completed: '2025-11-22T00:00:00+00:00'
    description: 'Extend existing MCP server with dynamic tool discovery.

      MCP server scans frontmatter and generates tools automatically.

      Tasks:

      1. Create frontmatter parser (YAML extraction from markdown)

      2. Create agent discovery module (scan framework/agents/)

      3. Create workflow discovery module (scan framework/workflows/)

      4. Create dynamic tool generator (frontmatter → MCP tool schema)

      5. Integrate discovery into VibeyMCPServer.get_tools()

      6. Add caching for discovered tools (rebuild on file change)

      '
  - id: goose-port-3
    name: Platform Adapter Architecture
    status: completed
    estimated_duration: 2 weeks
    tasks_count: 8
    started: '2025-11-22T00:00:00+00:00'
    completed: '2025-11-22T00:00:00+00:00'
    description: 'Built extensible platform adapter architecture for zero-drift translation.

      Successfully tested with Goose - 46 tools available via MCP protocol.


      KEY ACHIEVEMENTS:

      - BaseAdapter and CompositeAdapter pattern implemented

      - GooseAdapter composes MCPAdapter (no duplication)

      - Real MCP protocol with FastMCP SDK

      - vibey export CLI command


      See: .vibey/roadmap/goose-port/goose-port-3/context/PLATFORM_ADAPTER_ARCHITECTURE.md

      '
