    implementation_plan: .vibey/roadmap/jetbrains-port/context/IMPLEMENTATION_PLAN.md
    notes: 'JETBRAINS PORT - REVISED ARCHITECTURE (Nov 2025)


      Key Decision: Use shared Vibey MCP server from goose-port

      instead of building separate MCP implementation.


      SIMPLIFIED APPROACH:

      1. goose-port provides dynamic MCP tool discovery

      2. JetBrains port only needs IDE configuration

      3. Reduced from 5.5 weeks to 3 weeks


      WHAT WE BUILD:

      - .idea/ai/ directory structure template

      - mcp-servers.json pointing to Vibey MCP server

      - ai-settings.xml for IDE configuration

      - Multi-IDE testing and documentation


      WHAT WE DON''T BUILD:

      - MCP server (provided by goose-port)

      - Agent tool definitions (dynamic discovery)

      - Workflow tool definitions (dynamic discovery)


      IDE COVERAGE (All JetBrains):

      - IntelliJ IDEA (Java, Kotlin, Scala)

      - PyCharm (Python)

      - WebStorm (JavaScript, TypeScript)

      - GoLand (Go)

      - PhpStorm (PHP)

      - RustRover (Rust)

      - RubyMine (Ruby)

      - CLion (C, C++)


      TIMELINE: 3 weeks (reduced from 5.5 weeks)

      - Sprint 1: MCP configuration & IDE setup (1.5 weeks)

      - Sprint 2: Multi-IDE testing & documentation (1.5 weeks)


      DEPENDENCY: goose-port must be completed first

      (provides shared MCP server with dynamic tool discovery)

      '
