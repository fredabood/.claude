sprint:
  id: mcp-server-3
  name: MCP Resources, Prompts & Handoff Discovery
  track_id: mcp-server
  status: planned
  blocked: false
  created: '2025-11-23T00:00:00+00:00'
  started: null
  completed: null
  estimated_duration: 2 weeks
  progress:
    tasks_total: 7
    tasks_completed: 0
    completion_percent: 0
  tasks:
  - id: mcp-server-3-task-001
    name: Design MCP Resources architecture
    status: planned
    priority: high
    estimated_hours: 4
    assigned_agent: architecture-agent
    description: |
      Design MCP Resources implementation:
      - Define resource types for workflows
      - Define resource types for handoffs
      - Resource URI scheme design
      - Resource metadata structure
      - Caching strategy for resources
      - Integration with existing discovery system
  - id: mcp-server-3-task-002
    name: Implement MCP Resources for workflows
    status: planned
    priority: high
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: |
      Add MCP Resources for workflow content:
      - Expose workflow markdown as resources
      - Resource discovery via frontmatter
      - Resource content serving
      - Resource metadata (title, description, type)
      - Integration with workflow discovery
  - id: mcp-server-3-task-003
    name: Implement MCP Resources for handoffs
    status: planned
    priority: high
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: |
      Add MCP Resources for handoff templates:
      - Expose handoff templates as resources
      - Handoff discovery from templates/handoffs/
      - Resource content with Jinja2 variables noted
      - Resource metadata for handoff type
      - Integration with agent tools
  - id: mcp-server-3-task-004
    name: Design MCP Prompts architecture
    status: planned
    priority: medium
    estimated_hours: 4
    assigned_agent: architecture-agent
    description: |
      Design MCP Prompts implementation:
      - Prompt types for quality gates
      - Prompt argument schemas
      - Prompt-to-gate mapping
      - Integration with roadmap system
      - User-facing prompt descriptions
  - id: mcp-server-3-task-005
    name: Implement MCP Prompts for quality gates
    status: planned
    priority: medium
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: |
      Add MCP Prompts for quality gate checks:
      - Security audit prompt
      - Test coverage prompt
      - Documentation check prompt
      - Code review prompt
      - Prompts accept context (file paths, etc.)
      - Return structured gate results
  - id: mcp-server-3-task-006
    name: Implement handoff discovery and tool generation
    status: planned
    priority: high
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: |
      Add handoff discovery to MCP server:
      - Scan templates/handoffs/ for handoff templates
      - Parse handoff frontmatter (if present)
      - Generate MCP tools for handoff rendering
      - Tools accept context variables
      - Return rendered handoff content
  - id: mcp-server-3-task-007
    name: Test and document MCP enhancements
    status: planned
    priority: high
    estimated_hours: 6
    assigned_agent: test-engineer
    description: |
      Validate and document new MCP features:
      - Test Resources with Claude Code
      - Test Resources with Goose
      - Test Prompts with supported clients
      - Test handoff tools
      - Update MCP documentation
      - Update platform integration guides
  dependencies:
  - mcp-server-2
  blocked_by:
  - mcp-server-2
  quality_gates:
  - name: Resources Implementation
    threshold: 100
    blocking: true
    status: not_run
    description: MCP Resources working for workflows and handoffs
  - name: Prompts Implementation
    threshold: 100
    blocking: true
    status: not_run
    description: MCP Prompts working for quality gates
  - name: Handoff Tools
    threshold: 100
    blocking: true
    status: not_run
    description: Handoff discovery and tool generation working
  deliverables:
  - MCP Resources for workflow content
  - MCP Resources for handoff templates
  - MCP Prompts for quality gates
  - Handoff discovery and tool generation
  - Updated MCP documentation
  - Platform integration guide updates
  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-23T00:00:00+00:00'
    notes: |
      Sprint 3 adds MCP Resources, Prompts, and handoff discovery.
      These are future enhancements noted in the original MCP implementation.

      MCP Resources: Expose workflow and handoff content as browsable resources
      MCP Prompts: Quality gate checks as interactive prompts
      Handoff Discovery: Auto-generate tools for handoff template rendering
