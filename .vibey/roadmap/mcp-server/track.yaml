    notes: "MCP SERVER - COMPLETED IMPLEMENTATION (Nov 2025)\n\nACTUAL ARCHITECTURE\
      \ (as built):\n\nframework/mcp/\n├── server.py              # FastMCP-based\
      \ server (VibeyMCPServer)\n├── discovery/             # Dynamic tool discovery\n\
      │   ├── parser.py          # YAML frontmatter extraction\n│   ├── agents.py\
      \          # Agent discovery (19 agents)\n│   ├── workflows.py       # Workflow\
      \ discovery (16 workflows)\n│   ├── generator.py       # Frontmatter → MCP tool\
      \ schema\n│   └── discovery.py       # Main orchestrator with caching\n├── adapters/\n\
      │   └── roadmap_adapter.py # Roadmap operations (11 tools)\n└── tools/\n   \
      \ └── query_tools.py     # Query tool implementations\n\nframework/adapters/\
      \        # Platform adapter architecture\n├── base.py               # BaseAdapter\
      \ + CompositeAdapter\n├── registry.py           # AdapterRegistry\n├── mcp/adapter.py\
      \        # MCPAdapter (BaseAdapter)\n└── goose/adapter.py      # GooseAdapter\
      \ (CompositeAdapter)\n\nKEY DECISIONS:\n\n1. Dynamic Discovery (not manual mapping)\n\
      \   - All agents/workflows have YAML frontmatter\n   - MCP server scans frontmatter\
      \ and generates tools\n   - Zero drift: tools always match source definitions\n\
      \n2. Tools Only (Resources/Prompts deferred)\n   - Implemented: 46 MCP tools\n\
      \   - Deferred: Resources and Prompts (future enhancement)\n   - Rationale:\
      \ Tools cover 95% of use cases\n\n3. Adapter Pattern\n   - BaseAdapter: Direct\
      \ translation (MCP, Cursor, Aider)\n   - CompositeAdapter: Builds on others\
      \ (Goose uses MCP)\n   - Prevents code duplication across platforms\n\n4. Caching\
      \ with File-Change Detection\n   - MD5 hash of source file modification times\n\
      \   - 60-second TTL\n   - Automatic invalidation on file changes\n\nTOOL BREAKDOWN:\n\
      - 19 agent tools (vibey_web_developer, vibey_test_engineer, etc.)\n- 16 workflow\
      \ tools (vibey_workflow_feature_development, etc.)\n- 11 roadmap tools (vibey_roadmap_status,\
      \ vibey_roadmap_show, etc.)\n\nPLATFORM SUPPORT:\n✅ Claude Code (via .mcp.json)\n\
      ✅ Goose (via ~/.config/goose/config.yaml)\n\U0001F52C JetBrains AI (untested\
      \ but MCP-compatible)\n\U0001F52C VS Code (untested but MCP-compatible)\n\n\
      FUTURE ENHANCEMENTS:\n- MCP Resources for workflow/handoff content\n- MCP Prompts\
      \ for quality gates\n- Handoff discovery and tool generation\n"
