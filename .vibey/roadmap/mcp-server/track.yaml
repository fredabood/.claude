    notes: |
      MCP SERVER - COMPLETED IMPLEMENTATION (Nov 2025)

      ACTUAL ARCHITECTURE (as built):

      framework/mcp/
      ├── server.py              # FastMCP-based server (VibeyMCPServer)
      ├── discovery/             # Dynamic tool discovery
      │   ├── parser.py          # YAML frontmatter extraction
      │   ├── agents.py          # Agent discovery (19 agents)
      │   ├── workflows.py       # Workflow discovery (16 workflows)
      │   ├── generator.py       # Frontmatter → MCP tool schema
      │   └── discovery.py       # Main orchestrator with caching
      ├── adapters/
      │   └── roadmap_adapter.py # Roadmap operations (11 tools)
      └── tools/
          └── query_tools.py     # Query tool implementations

      framework/adapters/        # Platform adapter architecture
      ├── base.py               # BaseAdapter + CompositeAdapter
      ├── registry.py           # AdapterRegistry
      ├── mcp/adapter.py        # MCPAdapter (BaseAdapter)
      └── goose/adapter.py      # GooseAdapter (CompositeAdapter)

      KEY DECISIONS:

      1. Dynamic Discovery (not manual mapping)
         - All agents/workflows have YAML frontmatter
         - MCP server scans frontmatter and generates tools
         - Zero drift: tools always match source definitions

      2. Tools Only (Resources/Prompts deferred)
         - Implemented: 46 MCP tools
         - Deferred: Resources and Prompts (future enhancement)
         - Rationale: Tools cover 95% of use cases

      3. Adapter Pattern
         - BaseAdapter: Direct translation (MCP, Cursor, Aider)
         - CompositeAdapter: Builds on others (Goose uses MCP)
         - Prevents code duplication across platforms

      4. Caching with File-Change Detection
         - MD5 hash of source file modification times
         - 60-second TTL
         - Automatic invalidation on file changes

      TOOL BREAKDOWN:
      - 19 agent tools (vibey_web_developer, vibey_test_engineer, etc.)
      - 16 workflow tools (vibey_workflow_feature_development, etc.)
      - 11 roadmap tools (vibey_roadmap_status, vibey_roadmap_show, etc.)

      PLATFORM SUPPORT:
      ✅ Claude Code (via .mcp.json)
      ✅ Goose (via ~/.config/goose/config.yaml)
      🔬 JetBrains AI (untested but MCP-compatible)
      🔬 VS Code (untested but MCP-compatible)

      FUTURE ENHANCEMENTS:
      - MCP Resources for workflow/handoff content
      - MCP Prompts for quality gates
      - Handoff discovery and tool generation
    estimated_tokens: 61000
