    notes: |
      MULTI-PLATFORM ARCHITECTURE - COMPLETED (Nov 2025)

      ACTUAL IMPLEMENTATION:

      framework/adapters/
      ├── base.py           # BaseAdapter + CompositeAdapter ABCs
      ├── registry.py       # AdapterRegistry for platform management
      ├── types.py          # ExportResult, PlatformCapabilities, AdapterInfo
      ├── mcp/
      │   └── adapter.py    # MCPAdapter (BaseAdapter)
      └── goose/
          ├── adapter.py    # GooseAdapter (CompositeAdapter)
          ├── recipes.py    # Workflow → Recipe translation
          └── manifest.py   # Goose extension manifest

      KEY ARCHITECTURE DECISIONS:

      1. Two Adapter Types
         - BaseAdapter: Translates directly from assets (MCP, Cursor, Aider)
         - CompositeAdapter: Builds on other adapters (Goose uses MCP)

      2. Composition Over Duplication
         - GooseAdapter composes MCPAdapter
         - get_tools() delegates to base adapter
         - Only adds Goose-specific features (recipes)

      3. Registry Pattern
         - AdapterRegistry manages all adapters
         - export_all() for multi-platform export
         - validate_all() for configuration checks

      4. Export Command
         - `vibey export --platform goose --output ./exports`
         - Generates platform-specific configuration files

      COMPLETED SPRINTS (1-3):
      ✅ Sprint 1: Extract Platform-Agnostic Core
      ✅ Sprint 2: Design Adapter Pattern & Interface
      ✅ Sprint 3: Build Unified vibey CLI

      DEFERRED SPRINTS (4-5):
      ⏸️ Sprint 4: Cursor POC & Evaluation (research phase)
      ⏸️ Sprint 5: Multi-Platform Documentation & Launch

      PLATFORM STATUS:
      ✅ Claude Code - Production (via MCP server)
      ✅ Goose - Production (via MCP + recipes)
      🔬 Cursor - Research phase (paradigm mismatch noted)
      🔬 Aider - Not started
      🔬 Continue.dev - Not started

      Track marked complete for foundational architecture.
      Future platform ports will use this adapter framework.
