    notes: |
      PLATFORM CONTEXT MANAGEMENT SYSTEM

      ARCHITECTURAL PRINCIPLE:
      - Sprint = Unit of work relevant to the project (shippable to production)
      - Task Plan = Unit of work relevant to the current AI coding platform

      The sprint is the contract with the project. The task breakdown is the
      execution plan for a specific platform's capabilities. When platforms
      change, we recalculate tasks to fit the new context, but the sprint's
      goals and deliverables remain constant.

      PROBLEM:
      Alice uses Claude Code (200K context) and creates a sprint with tasks
      sized at 180K, 150K, and 100K tokens. Bob uses Goose (128K context)
      and wants to work on the same sprint. Currently:
      - No platform detection exists
      - No compatibility checking
      - Bob discovers incompatibility only after starting work
      - No way to recalculate tasks for Goose's constraints
      - Team must manually re-plan sprints for each platform

      SOLUTION:
      Implement platform-aware sprint management where:
      1. Platform is auto-detected (Claude Code, Goose, Cursor, etc.)
      2. Context window is known for each platform
      3. Sprint start checks compatibility with current platform
      4. User is prompted to recalculate if tasks too large
      5. Recalculation intelligently splits tasks while preserving:
         - Dependencies (analyzed for relevance, re-mapped)
         - Agent assignments (preserved where appropriate)
         - Success criteria (validated, ensured coverage)
         - Sprint-level goals and deliverables
      6. Only incomplete tasks are recalculated (completed work preserved)

      ARCHITECTURE:

      Sprint 1: Platform & Context Detection (1 week)
      ------------------------------------------------
      Build foundational platform detection system:
      - Environment variable inspection
      - Process name detection
      - User agent analysis
      - Platform capability database (context windows)
      - Platform configuration storage (.vibey/config/platform.yaml)
      - CLI: vibey config platform set <name> --context-window <size>
      - Platform validation and warnings

      Deliverables:
      - vibey/platform/detector.py (auto-detect current platform)
      - vibey/platform/context.py (context window detection)
      - vibey/platform/capabilities.py (platform capability database)
      - .vibey/config/platform.yaml (user platform config)
      - CLI command: vibey config platform

      Sprint 2: Compatibility Analysis (1 week)
      ------------------------------------------
      Build sprint/task compatibility checking:
      - Task size vs context window comparison
      - Incomplete task filtering (ignore completed)
      - Sprint-level compatibility analysis
      - Warning message generation
      - CLI: vibey roadmap check-compatibility <sprint-id>

      Algorithm:
      1. Load sprint and all tasks
      2. Filter to incomplete tasks only
      3. Compare each task.estimated_tokens vs platform.context_window
      4. Report oversized tasks with details
      5. Suggest recalculation if needed

      Deliverables:
      - vibey/roadmap/compatibility.py (checker module)
      - CLI command: vibey roadmap check-compatibility
      - Warning message templates

      Sprint 3: Smart Prompting & User Flow (1 week)
      -----------------------------------------------
      Integrate compatibility checking into natural workflows:
      - Hook into: vibey roadmap start <sprint-id>
      - Hook into: vibey roadmap show <sprint-id>
      - Hook into: vibey roadmap status (show compatibility warnings)
      - User prompt system (always ask, never auto-recalculate)
      - Options: Yes (recalculate now), No (continue anyway), Info (explain)

      User Experience:
      ```
      $ vibey roadmap start auth-sprint-1

      ⚠️  Sprint Compatibility Warning

      This sprint has tasks that may not fit in your platform's context window.

      Your platform: goose (128K context window)
      Sprint sized for: claude-code (200K context window)

      Oversized incomplete tasks: 2/3 tasks
        - auth-task-001: 180K tokens (exceeds limit by 52K)
        - auth-task-003: 150K tokens (exceeds limit by 22K)

      Would you like to recalculate this sprint for goose?
      This will split oversized tasks while preserving dependencies and success criteria.

      [Y] Recalculate now  [N] Continue anyway  [I] More info  [C] Cancel
      ```

      Deliverables:
      - Prompt system integration
      - User flow testing
      - UX refinement

      Sprint 4: Intelligent Recalculation Algorithm (2 weeks)
      -------------------------------------------------------
      The core recalculation engine with intelligent task planning:

      Recalculation Process:
      1. Load sprint and incomplete tasks
      2. Identify oversized tasks
      3. For each oversized task:
         a. Calculate split ratio (how many sub-tasks needed)
         b. Analyze dependencies (internal and external)
         c. Determine dependency relevance to new structure
         d. Re-map external dependencies to new task milestones
         e. Preserve/reassign agents based on new scope
         f. Validate all success criteria still covered
         g. Create new task definitions
      4. Update sprint metadata:
         - sized_for_platform: goose
         - sized_context_window: 128000
         - sized_at: <timestamp>
         - sized_by: <user>
         - originally_sized_for: claude-code (if first recalc)
         - originally_sized_context: 200000
      5. Write updated sprint.yaml and task.yaml files
      6. Generate recalculation summary

      Task Splitting Algorithm:
      ```python
      def split_task(task, max_context):
          """Split task into sub-tasks that fit context."""
          num_splits = ceil(task.estimated_tokens / (max_context * 0.9))

          # Analyze dependencies
          internal_deps = [d for d in task.dependencies if in_same_sprint(d)]
          external_deps = [d for d in task.dependencies if not in_same_sprint(d)]

          subtasks = []
          for i in range(num_splits):
              subtask = create_subtask(task, i, num_splits)

              # First subtask inherits external dependencies
              if i == 0:
                  subtask.dependencies = external_deps
              else:
                  # Later subtasks depend on previous subtask
                  subtask.dependencies = [subtasks[-1].id]

              # Analyze and preserve agent assignments
              subtask.assigned_agent = determine_agent(task, subtask)

              # Distribute success criteria across subtasks
              subtask.success_criteria = map_success_criteria(
                  task.success_criteria, i, num_splits
              )

              subtasks.append(subtask)

          # Last subtask fulfills original task's dependents
          # (other tasks depending on this one now depend on last subtask)

          return subtasks
      ```

      Dependency Re-mapping:
      - Internal dependencies: Adjust to new task IDs
      - External dependencies: Preserve but update references
      - Dependent tasks: Update to depend on last subtask

      Success Criteria Validation:
      - Ensure all original criteria covered by new tasks
      - Distribute criteria logically across subtasks
      - Add criteria for subtask integration/continuity

      Agent Assignment:
      - Preserve agent if subtask scope matches original
      - Reassign if subtask requires different expertise
      - Use agent capability matrix for decisions

      Deliverables:
      - vibey/roadmap/recalculator.py (core engine)
      - vibey/roadmap/task_splitter.py (splitting algorithm)
      - vibey/roadmap/dependency_mapper.py (dependency analysis)
      - vibey/roadmap/criteria_validator.py (success criteria)
      - CLI command: vibey roadmap recalculate
      - Comprehensive unit tests
      - Integration tests for complex scenarios

      Sprint 5: Testing, Documentation & Polish (1 week)
      ---------------------------------------------------
      - Multi-platform scenario testing
      - Complex dependency re-mapping tests
      - Success criteria validation tests
      - Edge case handling (circular deps, etc.)
      - User documentation (guides/PLATFORM_CONTEXT_MANAGEMENT.md)
      - Developer documentation (development/RECALCULATION_ALGORITHM.md)
      - API documentation
      - Example workflows and best practices
      - Video/tutorial content (optional)

      VALIDATION CRITERIA:

      1. Test Coverage (90%)
         - >90% coverage for all platform context code
         - All critical paths tested
         - Integration tests for full workflows

      2. Integration Tests (100%)
         - Platform detection works on all supported platforms
         - Compatibility checking accurate
         - Recalculation preserves sprint integrity
         - Dependencies correctly re-mapped
         - Success criteria validated

      3. Multi-Platform Validation (100%)
         - Tested on Claude Code (200K context)
         - Tested on Goose (128K context)
         - Tested on at least one other platform
         - Cross-platform sprint handoffs verified

      4. Documentation Complete (100%)
         - User guide complete with examples
         - Developer guide complete with architecture
         - API documentation complete
         - Troubleshooting guide included

      DESIGN DECISIONS:

      1. No Full Recalculation History
         Rationale: Git already tracks changes via YAML diffs.
         Solution: Store minimal metadata (sized_for_platform, etc.)
         Benefit: Clean data model, no bloat, git handles versioning

      2. Always Prompt, Never Auto-Recalculate
         Rationale: User should control when tasks change
         Solution: Smart prompts at natural decision points
         Benefit: Transparency, user control, prevents surprises

      3. Only Recalculate Incomplete Tasks
         Rationale: Completed work should never change
         Solution: Filter completed tasks before recalculation
         Benefit: Preserves history, prevents data loss

      4. Sprint as Contract, Tasks as Execution Plan
         Rationale: Sprint goals are platform-agnostic
         Solution: Preserve sprint deliverables, adapt task breakdown
         Benefit: Sprint remains shippable unit regardless of platform

      RISKS & MITIGATION:

      Risk: Platform detection inaccurate
      → Support manual override via config
      → Provide clear detection status in CLI
      → Document detection methods

      Risk: Recalculation breaks dependencies
      → Extensive dependency testing
      → Validation before writing changes
      → Rollback mechanism if validation fails

      Risk: Task splitting loses context
      → Preserve original task in metadata
      → Link subtasks to parent task
      → Include "continuation" instructions in subtask descriptions

      Risk: Over-splitting creates tiny tasks
      → Set minimum task size (e.g., 20K tokens)
      → Prefer fewer larger tasks over many tiny ones
      → Allow user to adjust split granularity

      SUCCESS METRICS:

      - Platform detection working on 3+ platforms
      - >90% code coverage achieved
      - Zero data loss in recalculation
      - Sprint integrity preserved (100% of test cases)
      - User satisfaction (qualitative feedback)
      - Multi-platform sprint handoffs successful
      - Documentation complete and clear
      - Ready for platform ports (goose-port unblocked)

      TIMELINE & DEPENDENCIES:

      Timeline: 5 weeks (Q1 2025)
      Priority: CRITICAL (unblocks all platform ports)
      Dependencies: None (can start immediately)
      Blocks: goose-port, aider-port, continue-port, windsurf-port,
              jetbrains-port, multi-platform
      Sequencing: BEFORE standards-system (platform infrastructure first)

      This track is foundational for multi-platform Vibey. Without it,
      every platform requires separate sprint planning, preventing true
      cross-platform collaboration. With it, sprints become portable
      contracts that adapt to each platform's capabilities.

      IMPLEMENTATION PRIORITY: START IMMEDIATELY
