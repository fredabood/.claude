sprint:
  id: python-package-1
  name: Package Structure & Configuration
  track_id: python-package
  status: completed
  blocked: false
  created: '2025-11-24T00:00:00+00:00'
  started: '2025-11-24T00:00:00+00:00'
  completed: '2025-11-24T00:00:00+00:00'
  estimated_duration: 1 week
  progress:
    tasks_total: 8
    tasks_completed: 8
    completion_percent: 100
  tasks:
  - id: python-package-1-task-001
    name: Move framework/ into vibey/content/
    status: completed
    priority: critical
    estimated_hours: 2
    assigned_agent: backend-engineer
    description: |
      Relocate framework directory inside the vibey package with rename:
      - Move framework/ to vibey/content/
      - Rename reflects that this is content (agents, workflows, templates)
      - Preserve directory structure (agents/, workflows/, templates/, etc.)
      - Update any hardcoded paths in codebase
      - Add vibey/content/__init__.py for package recognition
  - id: python-package-1-task-002
    name: Fix pyproject.toml package discovery
    status: completed
    priority: critical
    estimated_hours: 2
    assigned_agent: backend-engineer
    description: |
      Update pyproject.toml to include all subpackages:
      - Replace manual package list with find_packages()
      - Ensure all vibey.* subpackages discovered:
        - vibey.cli
        - vibey.operations
        - vibey.mcp
        - vibey.adapters
        - vibey.common
        - vibey.config
        - vibey.platform
        - vibey.roadmap
        - vibey.content
      - Verify nested packages included (e.g., vibey.roadmap.models)
  - id: python-package-1-task-003
    name: Configure package_data for content files
    status: completed
    priority: critical
    estimated_hours: 2
    assigned_agent: backend-engineer
    description: |
      Add package_data to include non-Python files:
      - content/**/*.md (agents, workflows, templates)
      - content/**/*.yaml (config, schemas, examples)
      - content/**/*.yml
      - content/**/*.j2 (Jinja2 templates if any)
      - Verify MANIFEST.in not needed with modern setuptools
  - id: python-package-1-task-004
    name: Create content accessor module
    status: completed
    priority: high
    estimated_hours: 3
    assigned_agent: backend-engineer
    description: |
      Create vibey/content/__init__.py with helper functions:
      - get_content_root() -> Path to content directory
      - get_agents_dir() -> Path to agents/
      - get_workflows_dir() -> Path to workflows/
      - get_templates_dir() -> Path to templates/
      - Use importlib.resources for proper package resource access
      - Handle both editable installs and pip installs
  - id: python-package-1-task-005
    name: Update MCP discovery to use content accessor
    status: completed
    priority: high
    estimated_hours: 2
    assigned_agent: backend-engineer
    description: |
      Update MCP server to find content via accessor:
      - vibey/mcp/discovery/agents.py - use get_agents_dir()
      - vibey/mcp/discovery/workflows.py - use get_workflows_dir()
      - Remove hardcoded ../framework/ paths
      - Test discovery works after pip install
  - id: python-package-1-task-006
    name: Update adapters to use content accessor
    status: completed
    priority: high
    estimated_hours: 2
    assigned_agent: backend-engineer
    description: |
      Update platform adapters to find content:
      - vibey/adapters/claude_code.py
      - vibey/adapters/goose.py
      - Any other adapters referencing framework/
      - Use get_templates_dir() for handoff templates
  - id: python-package-1-task-007
    name: Update CLI deploy command to use content accessor
    status: completed
    priority: high
    estimated_hours: 2
    assigned_agent: backend-engineer
    description: |
      Update vibey init/deploy to copy content:
      - Use content accessor instead of relative paths
      - Ensure agents/workflows/templates copied to target project
      - Test deployment from pip-installed package
  - id: python-package-1-task-008
    name: Add missing __init__.py files
    status: completed
    priority: medium
    estimated_hours: 1
    assigned_agent: backend-engineer
    description: |
      Ensure all packages have __init__.py:
      - vibey/framework/__init__.py (with accessors)
      - vibey/operations/__init__.py (if missing)
      - vibey/mcp/__init__.py (if missing)
      - vibey/adapters/__init__.py (if missing)
      - All nested packages
      - Verify package tree is complete
  dependencies: []
  blocked_by: []
  depended_on_by:
  - python-package-2
  quality_gates:
  - name: All Packages Discoverable
    threshold: 100
    blocking: true
    status: not_run
    description: find_packages() discovers all vibey.* packages
  - name: Content Files Accessible
    threshold: 100
    blocking: true
    status: not_run
    description: Content accessor returns valid paths to content
  deliverables:
  - framework/ moved and renamed to vibey/content/
  - Updated pyproject.toml with find_packages()
  - package_data configuration for non-Python files
  - Content accessor module (vibey/content/__init__.py)
  - Updated MCP discovery, adapters, and CLI
  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-24T00:00:00+00:00'
    notes: |
      Sprint 1 focuses on restructuring the package so that
      pip install vibey includes all necessary code AND content.

      KEY CHANGE: Renaming framework/ → content/
      The name "content" better reflects what the directory contains:
      agents, workflows, templates, schemas, and examples.

      Key principle: Use importlib.resources (or importlib_resources
      backport) for accessing package data, not __file__ relative paths.
      This ensures it works for:
      - Regular pip install
      - Editable install (pip install -e .)
      - Zipimport (rare but possible)
