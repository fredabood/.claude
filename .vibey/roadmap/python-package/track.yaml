    notes: |
      CRITICAL PACKAGING FIX + CONTENT MANAGEMENT

      Current Issues:
      1. framework/ directory not included in pip package
      2. Several vibey/ subpackages missing from pyproject.toml:
         - vibey.operations
         - vibey.mcp
         - vibey.adapters
         - vibey.common
      3. pip install vibey results in non-functional installation
      4. No CRUD interface for managing content (agents, workflows, templates)

      Solution:
      1. Move framework/ into vibey/content/ (rename for clarity)
      2. Update pyproject.toml to use find_packages()
      3. Add package_data for markdown/yaml content
      4. Test installation from clean environment
      5. Publish to PyPI
      6. Add content management CLI commands
      7. Add content management MCP tools

      This is a BLOCKER for:
      - User adoption (can't pip install)
      - User journey audit (can't test installation flow)
      - All platform ports (need working base package)

      CONTENT MANAGEMENT enables:
      - Users to create/edit/delete agents without manual YAML editing
      - AI assistants to manage content via MCP tools
      - Safer modifications with validation and backups
