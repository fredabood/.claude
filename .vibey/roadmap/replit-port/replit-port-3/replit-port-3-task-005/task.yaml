    \ .vibey/config/mcp.yaml:\n      checksum: \"ghi789...\"\n      generated_from:\
    \ \".vibey/config/project.yaml\"\n```\n\nVALIDATION PROCESS:\n1. Read .vibey/checksums.yaml\n\
