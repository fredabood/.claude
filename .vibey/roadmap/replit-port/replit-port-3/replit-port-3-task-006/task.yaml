  description: |
    Create validation logic for generated Replit configurations.

    VALIDATION CHECKS:
    1. .replit TOML Validation
       - Valid TOML syntax
       - Required fields present
       - Valid run command
       - Language specified

    2. replit.nix Validation
       - Valid Nix syntax
       - All dependencies resolvable
       - No conflicting packages
       - Nix channel available

    3. MCP Config Validation
       - Valid YAML syntax
       - Server settings valid
       - Tool paths exist
       - Port not in use

    4. Cross-Configuration Validation
       - Dependencies consistent
       - Environment variables aligned
       - Paths resolve correctly
       - No circular dependencies

    VALIDATION LEVELS:
    - Error: Must fix before deployment
    - Warning: Should fix, non-blocking
    - Info: Informational only

    VALIDATION REPORTING:
    - Clear error messages
    - Fix suggestions
    - Documentation links
    - Example corrections

    DELIVERABLES:
    - Validation framework
    - Validation rules
    - Error reporting
    - Fix suggestions
