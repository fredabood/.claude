  description: "Implement CLUI (Command-Line User Interface) commands for common Vibey\n\
    operations in Replit.\n\nCLUI COMMANDS:\n1. vibey:roadmap\n   - Show roadmap overview\n\
    \   - Display in Extension panel\n\n2. vibey:sprint\n   - Show current sprint\
    \ details\n   - List tasks\n\n3. vibey:task <task-id>\n   - Show task details\n\
    \   - Update task status\n\n4. vibey:sync\n   - Sync roadmap with Git\n   - Refresh\
    \ MCP data\n\n5. vibey:context\n   - Generate context file\n   - Show in editor\n\
    \nCOMMAND REGISTRATION:\n```typescript\nimport { registerCommand } from '@replit/extensions';\n\
    \nregisterCommand({\n  id: 'vibey:roadmap',\n  label: 'Vibey: Show Roadmap',\n\
    \  handler: async () => {\n    // Open extension panel with roadmap\n  }\n});\n\
    ```\n\nCOMMAND FEATURES:\n- Auto-completion\n- Parameter validation\n- Error handling\n\
    - Progress indicators\n\nINTEGRATION:\n- Extension panel opens on command\n- Data\
    \ loaded via useVibey hook\n- Results displayed in UI\n\nDELIVERABLES:\n- CLUI\
    \ command implementations\n- Command registration\n- Help documentation\n- Error\
    \ handling\n"
