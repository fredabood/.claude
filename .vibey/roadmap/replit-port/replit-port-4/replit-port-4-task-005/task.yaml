  description: |
    Implement CLUI (Command-Line User Interface) commands for common Vibey
    operations in Replit.

    CLUI COMMANDS:
    1. vibey:roadmap
       - Show roadmap overview
       - Display in Extension panel

    2. vibey:sprint
       - Show current sprint details
       - List tasks

    3. vibey:task <task-id>
       - Show task details
       - Update task status

    4. vibey:sync
       - Sync roadmap with Git
       - Refresh MCP data

    5. vibey:context
       - Generate context file
       - Show in editor

    COMMAND REGISTRATION:
    ```typescript
    import { registerCommand } from '@replit/extensions';

    registerCommand({
      id: 'vibey:roadmap',
      label: 'Vibey: Show Roadmap',
      handler: async () => {
        // Open extension panel with roadmap
      }
    });
    ```

    COMMAND FEATURES:
    - Auto-completion
    - Parameter validation
    - Error handling
    - Progress indicators

    INTEGRATION:
    - Extension panel opens on command
    - Data loaded via useVibey hook
    - Results displayed in UI

    DELIVERABLES:
    - CLUI command implementations
    - Command registration
    - Help documentation
    - Error handling
