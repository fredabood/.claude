  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-24T00:00:00+00:00'
    design_doc: docs/FRAMEWORK_ROADMAP.md
    implementation_plan: .vibey/roadmap/replit-port/context/IMPLEMENTATION_PLAN.md
    notes: "REPLIT PORT - WEB-NATIVE PLATFORM (Nov 2025 Research)\n\nCRITICAL UPDATE:\
      \ Replit has NATIVE MCP SUPPORT.\nOne of the first platforms to ship MCP (early\
      \ adopter).\n\nMCP SUPPORT (CONFIRMED):\n- Native MCP support in Replit environment\n\
      - Pre-built templates for quick MCP experimentation\n- Full Python runtime in\
      \ browser\n- Template-based deployment (no local setup)\n\nRESEARCH FINDINGS:\n\
      - Agent 3 architecture with multi-agent capabilities\n- Extensions API with\
      \ React bindings and TypeScript\n- .replit TOML + replit.nix configuration system\n\
      - No programmatic Agent invocation API (yet)\n\nCOMPATIBILITY ASSESSMENT: 80-85%\n\
      Higher than original estimate due to:\n- Native MCP support (major advantage)\n\
      - Full Python runtime in browser\n- Extensions API for custom tooling\n- Template-based\
      \ distribution\n\nKEY INSIGHT: Replit is the first web-based platform port for\
      \ Vibey.\nValidates that the framework can run in browser-based Python environments.\n\
      \nUNIQUE CHALLENGES:\n- Web-based environment (no local filesystem)\n- JavaScript/React\
      \ Extension development (new skillset)\n- No programmatic Agent invocation API\
      \ (yet)\n- Browser sandbox limitations\n\nARCHITECTURE (Zero-Drift):\n┌─────────────────────────────────────────────────────────────────┐\n\
      │            SINGLE SOURCE OF TRUTH                              │\n│  agents/*.md,\
      \ workflows/*.md, handoffs/*.md (frontmatter)      │\n└─────────────────────────────────────────────────────────────────┘\n\
      \                        │\n       ┌────────────────┼────────────────┐\n   \
      \    ▼                ▼                ▼\n┌───────────────┐  ┌───────────────┐\
      \  ┌───────────────┐\n│ MCP Server    │  │ REPLIT.md     │  │ .replit      \
      \ │\n│ (reusable)    │  │ Generator     │  │ Generator     │\n└───────────────┘\
      \  └───────────────┘  └───────────────┘\n       │                  │       \
      \           │\n       └──────────────────┼──────────────────┘\n            \
      \              ▼\n             ┌─────────────────────────┐\n             │ \
      \ Replit Extension       │\n             │  (generated artifact)   │\n     \
      \        └─────────────────────────┘\n                          │\n        \
      \                  ▼\n             ┌─────────────────────────┐\n           \
      \  │  Forkable Template      │\n             │  (distribution)         │\n \
      \            └─────────────────────────┘\n\nREPLIT INTEGRATION POINTS:\n1. MCP\
      \ Servers - Native support (shipped 2024)\n2. Extensions - Custom UI panels,\
      \ commands, file handlers\n3. Templates - Forkable project distribution\n4.\
      \ .replit - TOML configuration file\n5. replit.nix - Nix-based dependency management\n\
      \nTIMELINE: 8 weeks (increased from 4-6 for comprehensive port)\n- Sprint 1:\
      \ Research & MCP Validation (1 week)\n- Sprint 2: Adapter Foundation (1.5 weeks)\n\
      - Sprint 3: Configuration Generation (1 week)\n- Sprint 4: Extension Scaffolding\
      \ (1.5 weeks)\n- Sprint 5: Extension Features (1.5 weeks)\n- Sprint 6: Template\
      \ & Documentation (1 week)\n\nCOMPARISON TO GEMINI PORT:\n- Similar: MCP-first\
      \ integration, zero-drift architecture\n- Different: JavaScript Extension (not\
      \ TOML commands)\n- Different: Template distribution (not extension package)\n\
      - Additional: Web environment considerations\n\nPRIORITY UPGRADE: Low -> Medium\n\
      Rationale:\n- Native MCP support makes integration easier than expected\n- Education\
      \ market represents significant growth opportunity\n- Web-native port validates\
      \ browser execution patterns\n\nSOURCES:\n- https://docs.replit.com/replitai/agent\n\
      - https://blog.replit.com/everything-you-need-to-know-about-mcp\n- https://docs.replit.com/extensions/extensions\n\
      - https://docs.replit.com/replit-app/configuration\n- https://docs.replit.com/extensions/category/api-reference\n"
    estimated_tokens: 0
