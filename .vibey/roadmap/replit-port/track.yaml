  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-23T00:00:00+00:00'
    design_doc: docs/FRAMEWORK_ROADMAP.md
    implementation_plan: .vibey/roadmap/replit-port/context/IMPLEMENTATION_PLAN.md
    notes: |
      REPLIT PORT - WEB-NATIVE PLATFORM (Nov 2025 Research)

      CRITICAL UPDATE: Replit has NATIVE MCP SUPPORT.
      One of the first platforms to ship MCP (early adopter).

      MCP SUPPORT (CONFIRMED):
      - Native MCP support in Replit environment
      - Pre-built templates for quick MCP experimentation
      - Full Python runtime in browser
      - Template-based deployment (no local setup)

      RESEARCH FINDINGS:
      - Agent 3 architecture with multi-agent capabilities
      - Extensions API with React bindings and TypeScript
      - .replit TOML + replit.nix configuration system
      - No programmatic Agent invocation API (yet)

      COMPATIBILITY ASSESSMENT: 80-85%
      Higher than original estimate due to:
      - Native MCP support (major advantage)
      - Full Python runtime in browser
      - Extensions API for custom tooling
      - Template-based distribution

      KEY INSIGHT: Replit is the first web-based platform port for Vibey.
      Validates that the framework can run in browser-based Python environments.

      UNIQUE CHALLENGES:
      - Web-based environment (no local filesystem)
      - JavaScript/React Extension development (new skillset)
      - No programmatic Agent invocation API (yet)
      - Browser sandbox limitations

      ARCHITECTURE (Zero-Drift):
      ┌─────────────────────────────────────────────────────────────────┐
      │            SINGLE SOURCE OF TRUTH                              │
      │  agents/*.md, workflows/*.md, handoffs/*.md (frontmatter)      │
      └─────────────────────────────────────────────────────────────────┘
                              │
             ┌────────────────┼────────────────┐
             ▼                ▼                ▼
      ┌───────────────┐  ┌───────────────┐  ┌───────────────┐
      │ MCP Server    │  │ REPLIT.md     │  │ .replit       │
      │ (reusable)    │  │ Generator     │  │ Generator     │
      └───────────────┘  └───────────────┘  └───────────────┘
             │                  │                  │
             └──────────────────┼──────────────────┘
                                ▼
                   ┌─────────────────────────┐
                   │  Replit Extension       │
                   │  (generated artifact)   │
                   └─────────────────────────┘
                                │
                                ▼
                   ┌─────────────────────────┐
                   │  Forkable Template      │
                   │  (distribution)         │
                   └─────────────────────────┘

      REPLIT INTEGRATION POINTS:
      1. MCP Servers - Native support (shipped 2024)
      2. Extensions - Custom UI panels, commands, file handlers
      3. Templates - Forkable project distribution
      4. .replit - TOML configuration file
      5. replit.nix - Nix-based dependency management

      TIMELINE: 8 weeks (increased from 4-6 for comprehensive port)
      - Sprint 1: Research & MCP Validation (1 week)
      - Sprint 2: Adapter Foundation (1.5 weeks)
      - Sprint 3: Configuration Generation (1 week)
      - Sprint 4: Extension Scaffolding (1.5 weeks)
      - Sprint 5: Extension Features (1.5 weeks)
      - Sprint 6: Template & Documentation (1 week)

      COMPARISON TO GEMINI PORT:
      - Similar: MCP-first integration, zero-drift architecture
      - Different: JavaScript Extension (not TOML commands)
      - Different: Template distribution (not extension package)
      - Additional: Web environment considerations

      PRIORITY UPGRADE: Low -> Medium
      Rationale:
      - Native MCP support makes integration easier than expected
      - Education market represents significant growth opportunity
      - Web-native port validates browser execution patterns

      SOURCES:
      - https://docs.replit.com/replitai/agent
      - https://blog.replit.com/everything-you-need-to-know-about-mcp
      - https://docs.replit.com/extensions/extensions
      - https://docs.replit.com/replit-app/configuration
      - https://docs.replit.com/extensions/category/api-reference

    estimated_tokens: 0
