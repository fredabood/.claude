  description: |
    Document schema decisions made during remediation.

    CREATE: .vibey/roadmap/SCHEMA_DECISIONS.md

    CONTENT:
    1. Hierarchical vs Embedded Tasks
       - Hierarchical is canonical for active tracks
       - Embedded acceptable for completed tracks (historical)
       - Embedded acceptable for planning-only (not_started)

    2. Status Taxonomy
       - not_started: Planning allowed, no implementation
       - in_progress: Implementation underway
       - completed: All work done

    3. Progress Counters
       - Must match actual task files
       - Reset phantom progress to 0%

    4. Quality Gates
       - Run before marking track complete
       - Document results in track.yaml
