  title: Backup archive integrity verification
  description: |
    Verify all backup archives are readable, uncorrupted, and contain expected data
    before beginning forensic audit work. Critical safety check to ensure we can
    recover from migration issues if needed.

    Backup Archives to Verify:
    1. .vibey/hierarchical-migration-backups/backup_20251109_171311/
       - Most critical backup (pre-hierarchical migration)
       - Should contain flat structure: tracks/*.yaml, sprints/*.yaml, tasks/*-tasks.yaml
       - Expected: 11 tracks, 8 sprints, 8 task files

    2. .vibey/hierarchical-migration-backups/backup_20251110_183045/
       - Post-first-migration backup
       - Verify structure transition

    3. .vibey/hierarchical-migration-backups/backup_20251110_194522/
       - Latest backup
       - Verify final state before integrity fixes

    4. .vibey/config-backups/ (if exists)
       - Config migration backups
       - Verify config integrity

    Verification Steps:
    1. Check each backup directory exists and is readable
    2. Verify file count matches expectations
    3. Test YAML parsing on all backup files
    4. Compare backup timestamps to git history
    5. Verify backup completeness (no missing tracks/sprints)
    6. Test sample restoration to /tmp to verify recoverability
    7. Document any corrupted or missing backup data
    8. Create backup comparison matrix

    Acceptance Criteria:
    - All backup archives cataloged with sizes and file counts
    - All YAML files successfully parse without errors
    - Backup comparison matrix created
    - Sample restoration tested and successful
    - Any corruption or gaps documented
    - Backup integrity report generated

    Deliverables:
    - Backup integrity verification report (markdown)
    - Backup comparison matrix
    - Sample restoration test results
    - List of any corrupted or incomplete backups
