  title: Document rollback procedures
  description: "Create comprehensive rollback procedures for reverting changes if\
    \ forensic\naudit or corrections cause unexpected issues. Ensures we can always\
    \ return\nto known-good state.\n\nQA Gap Addressed:\n\"No rollback strategy documented.\
    \ If audit breaks something or stakeholder\nrejects findings, how do we revert?\
    \ Need documented rollback procedure.\"\n\nRollback Scenarios to Address:\n\n\
    1. Rollback After Forensic Audit\n   - Audit findings incorrect or incomplete\n\
    \   - Need to return to pre-audit state\n   - Restore from checkpoint backup\n\
    \n2. Rollback After Status Corrections\n   - Status changes applied incorrectly\n\
    \   - Need to undo bulk status updates\n   - Restore previous sprint/task states\n\
    \n3. Rollback After Commit Backfilling\n   - Commits mapped to wrong tasks\n \
    \  - Need to remove incorrect commit references\n   - Restore task.yaml files\
    \ to pre-backfill state\n\n4. Rollback After Structural Repairs\n   - Directory\
    \ structure changes caused issues\n   - Need to restore previous hierarchy\n \
    \  - Complex multi-file restoration\n\n5. Emergency Full Rollback\n   - Critical\
    \ issue discovered\n   - Need to restore entire .vibey/ directory\n   - Use most\
    \ recent checkpoint or backup archive\n\nRollback Procedures to Document:\n\n\
    Procedure 1: Checkpoint Restoration\n```bash\n# Stop all active work\n# Identify\
    \ checkpoint to restore from\n# Backup current state (even if broken)\n# Restore\
    \ .vibey/ from checkpoint\n# Verify restoration successful\n# Test roadmap commands\
    \ work\n# Document what was rolled back and why\n```\n\nProcedure 2: Selective\
    \ File Rollback\n```bash\n# Identify specific files to rollback\n# Extract files\
    \ from checkpoint backup\n# Restore individual files\n# Verify YAML syntax valid\n\
    # Test affected sprints/tasks load correctly\n# Document specific changes reverted\n\
    ```\n\nProcedure 3: Git-Based Rollback\n```bash\n# Find git commit before changes\n\
    # Create rollback branch\n# Checkout .vibey/ directory from previous commit\n\
    # Verify restoration\n# Test roadmap integrity\n# Document git commit used for\
    \ rollback\n```\n\nProcedure 4: Backup Archive Restoration\n```bash\n# Choose\
    \ backup archive (chronological)\n# Extract backup to temporary location\n# Compare\
    \ current vs backup state\n# Selective or full restoration decision\n# Execute\
    \ restoration\n# Verify roadmap commands functional\n# Document what was restored\
    \ from archive\n```\n\nRollback Safety Checks:\n\nPre-Rollback:\n- [ ] Current\
    \ state backed up (even if broken)\n- [ ] Rollback target identified (checkpoint/backup/git\
    \ commit)\n- [ ] Rollback scope determined (full/selective)\n- [ ] Stakeholder\
    \ notified of rollback plan\n\nDuring Rollback:\n- [ ] Files restored to correct\
    \ locations\n- [ ] YAML syntax validated\n- [ ] Directory structure intact\n-\
    \ [ ] No files accidentally deleted\n\nPost-Rollback:\n- [ ] Roadmap commands\
    \ functional (`vibey roadmap status`)\n- [ ] Track/sprint/task data loads without\
    \ errors\n- [ ] Git status clean or expected\n- [ ] Rollback documented in audit\
    \ trail\n\nRollback Documentation Requirements:\n\nFor Each Rollback Event:\n\
    - Timestamp and operator\n- Reason for rollback\n- Rollback scope (full/selective/files\
    \ affected)\n- Source used (checkpoint/backup/git commit)\n- Verification results\n\
    - Lessons learned\n- Prevention recommendations\n\nRollback Testing:\n\nTest Scenarios:\n\
    1. Test checkpoint restoration to /tmp (non-destructive)\n2. Test selective file\
    \ restoration\n3. Test git-based rollback simulation\n4. Test backup archive restoration\n\
    5. Measure rollback time for each procedure\n\nDeliverables:\n- Rollback procedures\
    \ guide (markdown, 800+ lines)\n- Rollback decision tree (when to use which procedure)\n\
    - Rollback safety checklist\n- Rollback documentation template\n- Tested rollback\
    \ procedures (verification results)\n\nAcceptance Criteria:\n- All 4 rollback\
    \ procedures documented step-by-step\n- Safety checks defined for each procedure\n\
    - Rollback decision tree created\n- Test restoration performed for each procedure\n\
    - Documentation template created\n- Procedures validated with test rollbacks\n\
    \nDeliverables:\n- Rollback procedures guide\n- Rollback decision tree\n- Rollback\
    \ safety checklist\n- Test rollback verification results\n"
