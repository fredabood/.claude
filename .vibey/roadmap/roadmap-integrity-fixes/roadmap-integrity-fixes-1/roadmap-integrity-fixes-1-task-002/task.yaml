       ```

       Features:
       - Automatic timestamp generation
       - Custom checkpoint naming
       - Checksum verification
       - Manifest generation
       - Progress reporting
       - Error handling with cleanup

    2. Automated Rollback:

       Script: restore-integrity-checkpoint.sh
       ```bash
       #!/bin/bash
       # Restores .vibey/ from checkpoint
       # Usage: ./restore-integrity-checkpoint.sh <checkpoint-name> [--verify-only]

       CHECKPOINT_NAME="$1"
       VERIFY_ONLY="${2:-false}"

       # Validate checkpoint exists
       # Verify checkpoint integrity (checksums)
       # Create pre-rollback backup (current state)
       # Restore files from checkpoint
       # Verify restoration (checksums)
       # Test roadmap commands work
       # Report success/failure
       ```

       Features:
       - Checkpoint validation before restore
       - Automatic pre-rollback backup
       - Checksum verification
       - Dry-run mode (--verify-only)
       - Rollback testing
       - Detailed logging

    3. Selective File Restoration:

       Script: restore-selective-files.sh
       ```bash
       #!/bin/bash
       # Restores specific files from checkpoint
       # Usage: ./restore-selective-files.sh <checkpoint> <file-pattern>

       CHECKPOINT_NAME="$1"
       FILE_PATTERN="$2"

       # Find files matching pattern in checkpoint
       # Create backup of current versions
       # Restore selected files
       # Verify YAML syntax
       # Test affected areas
       # Report success/failure
       ```

       Features:
       - Glob pattern support
       - Targeted restoration
       - Pre-restoration backup
       - YAML validation
       - Granular control

    4. Checkpoint Management:

       Script: manage-checkpoints.sh
       ```bash
       #!/bin/bash
       # Manages checkpoint lifecycle
       # Usage: ./manage-checkpoints.sh [list|verify|clean|compare]

       # list: Show all checkpoints with sizes/dates
       # verify: Verify checksums for all checkpoints
       # clean: Remove old checkpoints (keep last N)
       # compare: Show differences between checkpoints
       ```

       Features:
       - List all checkpoints
       - Verify integrity of all checkpoints
       - Cleanup old checkpoints
       - Compare checkpoint contents
       - Storage management

    5. Verification Functions:

       Python Module: checkpoint_verifier.py
       ```python
       def verify_checkpoint_integrity(checkpoint_path):
           """Verify all files match checksums in manifest"""

       def verify_yaml_syntax(directory):
           """Verify all YAML files parse correctly"""

       def verify_roadmap_commands():
           """Test that vibey roadmap commands work"""

       def generate_checkpoint_report(checkpoint_path):
           """Generate detailed checkpoint report"""
       ```

    6. Integration with Roadmap CLI:

       Add commands to vibey CLI:
       ```bash
       vibey roadmap checkpoint create [name]
       vibey roadmap checkpoint restore <name> [--verify-only]
       vibey roadmap checkpoint list
       vibey roadmap checkpoint verify <name>
       ```

    Testing Requirements:

    Test Scenarios:
    1. Create checkpoint of current state
    2. Make changes to .vibey/ directory
    3. Restore from checkpoint
    4. Verify restoration matches original
    5. Test selective file restoration
    6. Test checkpoint verification
    7. Test checkpoint cleanup
    8. Test with corrupted checkpoint
    9. Test with missing files
    10. Test with invalid YAML

    Performance Targets:
    - Checkpoint creation: <30 seconds for full .vibey/
    - Restoration: <60 seconds for full .vibey/
    - Verification: <15 seconds for checksum check
    - Selective restore: <10 seconds for individual files

    Error Handling:
    - Disk space checks before backup
    - Permission checks
    - Corrupt checkpoint detection
    - Partial restoration recovery
    - Detailed error messages

    Acceptance Criteria:
    - All 4 scripts implemented and tested
    - Python verification module created
    - CLI integration complete
    - All 10 test scenarios pass
    - Performance targets met
    - Error handling comprehensive
    - Documentation with examples

    Deliverables:
    - create-integrity-checkpoint.sh
    - restore-integrity-checkpoint.sh
    - restore-selective-files.sh
    - manage-checkpoints.sh
    - checkpoint_verifier.py (Python module)
    - CLI integration code
    - Testing results for all scenarios
    - User documentation with examples
