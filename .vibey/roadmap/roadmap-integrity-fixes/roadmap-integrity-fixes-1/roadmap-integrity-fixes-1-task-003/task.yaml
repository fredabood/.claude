  task_type: development
  title: Create YAML editing safeguards
  description: "Implement safe YAML editing library with automatic validation, backups,\n\
    and rollback to prevent data corruption during bulk status corrections.\n\nQA\
    \ Gap Addressed:\n\"No YAML editing safeguards. Bulk status updates on 100+ task\
    \ files could\ncorrupt data. Need safe editing with validation and automatic rollback.\"\
    \n\nSafeguard Requirements:\n\n1. Safe YAML Editor Class:\n\n   Python Module:\
    \ safe_yaml_editor.py\n   ```python\n   class SafeYAMLEditor:\n       \"\"\"Safe\
    \ YAML editing with automatic validation and backups\"\"\"\n\n       def __init__(self,\
    \ auto_backup=True, validate=True):\n           self.auto_backup = auto_backup\n\
    \           self.validate = validate\n           self.changes_log = []\n\n   \
    \    def edit_file(self, file_path, modifications):\n           \"\"\"Safely edit\
    \ single YAML file with validation\"\"\"\n           # Create backup before edit\n\
    \           # Load and parse YAML\n           # Validate current structure\n \
    \          # Apply modifications\n           # Validate modified structure\n \
    \          # Write to file if valid\n           # Log change\n           # Return\
    \ success/failure\n\n       def bulk_edit(self, file_pattern, modifications):\n\
    \           \"\"\"Safely edit multiple YAML files with transaction semantics\"\
    \"\"\n           # Find all matching files\n           # Create checkpoint backup\n\
    \           # Edit each file with validation\n           # Track successes and\
    \ failures\n           # If any failure, rollback all changes\n           # Return\
    \ detailed results\n\n       def rollback_last_edit(self):\n           \"\"\"\
    Rollback the most recent edit operation\"\"\"\n\n       def validate_yaml_file(self,\
    \ file_path):\n           \"\"\"Validate YAML syntax and schema\"\"\"\n   ```\n\
    \n2. Validation Rules:\n\n   Schema Validation:\n   - Required fields present\
    \ (id, sprint_id, track_id, status, etc.)\n   - Field types correct (strings,\
    \ lists, dicts)\n   - Enum values valid (status: not_started|in_progress|completed)\n\
    \   - Date formats correct (ISO 8601)\n   - References valid (sprint_id exists,\
    \ track_id exists)\n\n   Structural Validation:\n   - YAML syntax valid (parseable)\n\
    \   - No duplicate keys\n   - Proper indentation (2 spaces)\n   - Lists properly\
    \ formatted\n   - No tabs (only spaces)\n\n   Business Logic Validation:\n   -\
    \ Task ID matches directory name\n   - Sprint ID matches parent directory\n  \
    \ - Completion dates only if status=completed\n   - Progress counters consistent\
    \ (completed ≤ total)\n   - Blocking dependencies don't create cycles\n\n3. Automatic\
    \ Backup System:\n\n   Before Each Edit:\n   - Create timestamped backup in .vibey/safe-edit-backups/\n\
    \   - Store original file with metadata\n   - Record modification intent\n   -\
    \ Keep last 50 backups (auto-cleanup old)\n\n   Backup Metadata:\n   ```yaml\n\
    \   backup:\n     original_file: .vibey/roadmap/track/sprint/task/task.yaml\n\
    \     backup_timestamp: 2025-11-12T21:00:00Z\n     modification_intent: \"Update\
    \ status to completed\"\n     backup_path: .vibey/safe-edit-backups/backup_20251112_210000/\n\
    \     checksum_before: abc123...\n     checksum_after: def456...\n   ```\n\n4.\
    \ Transaction Semantics for Bulk Edits:\n\n   All-or-Nothing Guarantee:\n   -\
    \ Begin transaction: Create checkpoint\n   - Apply edits one by one\n   - Validate\
    \ each edit\n   - If ANY edit fails: Rollback ALL changes\n   - If all succeed:\
    \ Commit transaction\n   - Log transaction results\n\n   Example:\n   ```python\n\
    \   editor = SafeYAMLEditor()\n   results = editor.bulk_edit(\n       file_pattern=\"\
    .vibey/roadmap/*/sprint-2/*/task.yaml\",\n       modifications={\"status\": \"\
    completed\"}\n   )\n\n   if results.success:\n       print(f\"Updated {results.files_changed}\
    \ files\")\n   else:\n       print(f\"Rollback performed. Errors: {results.errors}\"\
    )\n   ```\n\n5. Dry-Run Mode:\n\n   Preview Changes Without Applying:\n   ```python\n\
    \   editor.dry_run_edit(\n       file_path=\"task.yaml\",\n       modifications={\"\
    status\": \"completed\"}\n   )\n   # Shows what WOULD change\n   # Validates modifications\
    \ would work\n   # Doesn't actually modify file\n   ```\n\n6. Change Logging:\n\
    \n   Track All Modifications:\n   ```yaml\n   change_log:\n     - timestamp: 2025-11-12T21:00:00Z\n\
    \       file: .vibey/roadmap/track/sprint/task/task.yaml\n       operation: edit_field\n\
    \       field: status\n       old_value: in_progress\n       new_value: completed\n\
    \       success: true\n       validation_passed: true\n   ```\n\n7. Error Recovery:\n\
    \n   Handling Edit Failures:\n   - Parse error → Keep original file, report error\n\
    \   - Validation error → Keep original file, report what's invalid\n   - Disk\
    \ full → Rollback, report disk space needed\n   - Permission error → Skip file,\
    \ continue with others\n   - Corrupt backup → Use previous backup, warn user\n\
    \n8. CLI Integration:\n\n   Add safe editing commands:\n   ```bash\n   vibey roadmap\
    \ edit --file <path> --set status=completed [--dry-run]\n   vibey roadmap bulk-edit\
    \ --pattern \"sprint-2/*\" --set status=completed [--dry-run]\n   vibey roadmap\
    \ rollback-edit [--last-n 1]\n   vibey roadmap validate --file <path>\n   vibey\
    \ roadmap validate --all\n   ```\n\nTesting Requirements:\n\nTest Cases:\n1. Edit\
    \ single valid file → Success\n2. Edit with invalid YAML syntax → Rollback\n3.\
    \ Edit with invalid schema → Rollback\n4. Bulk edit 10 files, all valid → Success\n\
    5. Bulk edit 10 files, 1 invalid → Rollback all\n6. Edit with disk full → Graceful\
    \ failure\n7. Edit with permission denied → Skip and report\n8. Rollback last\
    \ edit → Restore original\n9. Dry-run mode → No actual changes\n10. Validate 100\
    \ files → Report all issues\n\nPerformance Targets:\n- Single file edit: <1 second\n\
    - Bulk edit 100 files: <30 seconds\n- Validation: <0.5 seconds per file\n- Rollback:\
    \ <10 seconds for 100 files\n\nAcceptance Criteria:\n- SafeYAMLEditor class implemented\n\
    - All validation rules implemented\n- Automatic backup system working\n- Transaction\
    \ semantics for bulk edits\n- Dry-run mode functional\n- Change logging complete\n\
    - Error recovery handles all cases\n- CLI integration complete\n- All 10 test\
    \ cases pass\n- Performance targets met\n\nDeliverables:\n- safe_yaml_editor.py\
    \ (Python module, 600+ lines)\n- Validation schema definitions\n- CLI integration\
    \ code\n- Change log system\n- Testing results for all cases\n- User documentation\
    \ with examples\n"
