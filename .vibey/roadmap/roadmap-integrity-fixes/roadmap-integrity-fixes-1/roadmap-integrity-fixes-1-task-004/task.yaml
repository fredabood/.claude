  title: Optimize validation performance
  description: |
    Optimize roadmap validation to run in <10 seconds for full roadmap scan,
    enabling fast feedback during integrity fixes.

    QA Gap Addressed:
    "No validation performance optimization. Validating 19 tracks × 100+ files
    could take minutes. Need <10s validation for fast feedback loop."

    Current Performance Issues:

    1. Slow YAML Parsing:
       - Loading 100+ YAML files sequentially
       - Parsing same files multiple times
       - No caching of parsed data

    2. Inefficient Validation:
       - Running full schema validation on every check
       - Recalculating progress counters repeatedly
       - No incremental validation

    3. Expensive Operations:
       - Deep object traversal on every validation
       - Regex matching on every field
       - File I/O not optimized

    Optimization Strategies:

    1. Parallel YAML Loading:

       ```python
       from concurrent.futures import ThreadPoolExecutor

       def load_yaml_files_parallel(file_paths, max_workers=8):
           """Load multiple YAML files in parallel"""
           with ThreadPoolExecutor(max_workers=max_workers) as executor:
               results = executor.map(load_yaml_file, file_paths)
           return list(results)
       ```

       Benefits:
       - 8x speedup with 8 cores
       - Load 100 files in ~2 seconds instead of 16 seconds

    2. Smart Caching:

       ```python
       from functools import lru_cache
       import hashlib

       @lru_cache(maxsize=1000)
       def load_and_validate_cached(file_path, file_hash):
           """Cache parsed YAML by file content hash"""
           # Only re-parse if file content changed
           return load_and_validate(file_path)

       def get_file_hash(file_path):
           """Fast file content hashing"""
           with open(file_path, 'rb') as f:
               return hashlib.md5(f.read()).hexdigest()
       ```

       Benefits:
       - Unchanged files validated instantly (cache hit)
       - Only changed files re-parsed

    3. Incremental Validation:

       ```python
       def validate_incrementally(changed_files_only=True):
           """Validate only changed files since last run"""
           if changed_files_only:
               # Use git status to find changed files
               # Only validate those files
               # Use cached results for unchanged files
           else:
               # Full validation
       ```

       Benefits:
       - Typical validation: 1-2 seconds (only changed files)
       - Full validation: 8-10 seconds (all files)

    4. Lazy Loading:

       ```python
       class LazyRoadmap:
           """Load roadmap data on-demand, not all upfront"""

           def __init__(self, roadmap_path):
               self.roadmap_path = roadmap_path
               self._tracks = None  # Load when accessed

           @property
           def tracks(self):
               if self._tracks is None:
                   self._tracks = self._load_tracks()
               return self._tracks
       ```

       Benefits:
       - Only load data actually needed for validation
       - Skip expensive operations for unrelated tracks

    5. Optimized Schema Validation:

       ```python
       import jsonschema

       # Compile schema once, reuse for all validations
       COMPILED_TASK_SCHEMA = jsonschema.Draft7Validator(TASK_SCHEMA)

       def validate_fast(data):
           """Use pre-compiled schema validator"""
           return COMPILED_TASK_SCHEMA.validate(data)
       ```

       Benefits:
       - 3-5x faster than recompiling schema each time

    6. Progress Counter Caching:

       ```python
       def calculate_progress_cached(sprint_id):
           """Cache expensive progress calculations"""
           cache_key = f"{sprint_id}:{get_sprint_hash(sprint_id)}"
           if cache_key in progress_cache:
               return progress_cache[cache_key]

           progress = calculate_progress_expensive(sprint_id)
           progress_cache[cache_key] = progress
           return progress
       ```

       Benefits:
       - Recalculate only when sprint data changes

    7. Batch File I/O:

       ```python
