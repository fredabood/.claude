  title: Enhance error handling framework
  description: |
    Enhance error handling to gracefully handle edge cases discovered during
    integrity checks: circular dependencies, orphaned tasks, missing references,
    corrupt YAML, etc.

    QA Gap Addressed:
    "Limited error handling for edge cases. Need comprehensive error handling
    for: circular dependencies, orphaned tasks, corrupt YAML, missing references."

    Edge Cases to Handle:

    1. Circular Dependencies:

       Example:
       - Task A depends_on Task B
       - Task B depends_on Task C
       - Task C depends_on Task A (CIRCULAR!)

       Detection:
       ```python
       def detect_circular_dependencies(tasks):
           """Find circular dependency chains"""
           visited = set()
           rec_stack = set()
           cycles = []

           for task in tasks:
               if task.id not in visited:
                   find_cycles(task, visited, rec_stack, cycles)

           return cycles
       ```

       Handling:
       - Detect all circular dependencies
       - Report full cycle chain (A → B → C → A)
       - Flag all tasks in cycle
       - Suggest breaking points
       - Validation fails with clear error

    2. Orphaned Tasks:

       Example:
       - Task references sprint_id: "deleted-sprint-1"
       - Sprint doesn't exist (deleted or never created)

       Detection:
       ```python
       def find_orphaned_tasks(tasks, sprints):
           """Find tasks referencing non-existent sprints"""
           sprint_ids = {s.id for s in sprints}
           orphaned = []

           for task in tasks:
               if task.sprint_id not in sprint_ids:
                   orphaned.append(task)

           return orphaned
       ```

       Handling:
       - List all orphaned tasks
       - Show missing sprint IDs
       - Suggest creating sprint or reassigning task
       - Allow "adoption" of orphaned tasks into existing sprints

    3. Missing References:

       Example:
       - Task.blocks = ["task-999"]
       - task-999 doesn't exist

       Detection:
       ```python
       def validate_references(task, all_task_ids):
           """Validate all task ID references exist"""
           broken_refs = []

           for blocked_id in task.blocks:
               if blocked_id not in all_task_ids:
                   broken_refs.append(('blocks', blocked_id))

           for dep_id in task.depends_on:
               if dep_id not in all_task_ids:
                   broken_refs.append(('depends_on', dep_id))

           return broken_refs
       ```

       Handling:
       - Report missing task IDs
       - Show which field contains broken reference
       - Offer to remove broken references
       - Suggest similar task IDs (fuzzy match)

    4. Corrupt YAML Files:

       Example:
       - YAML syntax errors (bad indentation, etc.)
       - Unparseable content
       - Binary data in YAML file

       Detection:
       ```python
       import yaml

       def load_yaml_safe(file_path):
           """Load YAML with comprehensive error handling"""
           try:
               with open(file_path, 'r') as f:
                   return yaml.safe_load(f)
           except yaml.YAMLError as e:
               return YAMLParseError(file_path, str(e))
           except UnicodeDecodeError as e:
               return BinaryFileError(file_path)
           except Exception as e:
               return UnknownFileError(file_path, str(e))
       ```

       Handling:
       - Detect specific error type
       - Show line number for syntax errors
       - Suggest fixes (common mistakes)
       - Offer to restore from backup
       - Skip file and continue validation

    5. Schema Violations:

       Example:
       - Required field missing: task.id
       - Wrong type: task.estimated_tokens = "many"
       - Invalid enum: task.status = "done"

       Detection:
       ```python
       import jsonschema

       def validate_schema_comprehensive(data, schema):
           """Validate with detailed error reporting"""
           v = jsonschema.Draft7Validator(schema)
           errors = sorted(v.iter_errors(data), key=lambda e: e.path)

           return [
               SchemaError(
                   field='.'.join(str(p) for p in err.path),
                   message=err.message,
                   expected=err.schema,
                   actual=err.instance
               )
               for err in errors
           ]
       ```

       Handling:
       - Report all schema errors (not just first)
       - Show field path, expected type, actual value
       - Suggest corrections
       - Offer to auto-fix common issues

    6. Inconsistent Progress Counters:

       Example:
       - sprint.progress.tasks_completed = 10
       - Actual completed tasks: 5

       Detection:
       ```python
       def validate_progress_counters(sprint):
           """Check claimed vs actual progress"""
           claimed_completed = sprint.progress.tasks_completed
           actual_completed = len([t for t in sprint.tasks
                                  if t.status == 'completed'])

           if claimed_completed != actual_completed:
               return ProgressMismatch(
                   claimed=claimed_completed,
                   actual=actual_completed,
                   diff=abs(claimed_completed - actual_completed)
               )
       ```

       Handling:
       - Report claimed vs actual
       - Show difference
       - Offer to auto-correct counters
       - Explain why mismatch occurred

    7. Date Logic Errors:

       Example:
       - task.completed before task.started
       - task.started before task.created

       Detection:
       ```python
       from datetime import datetime

       def validate_date_logic(task):
           """Validate date chronological order"""
           errors = []

           if task.completed and task.started:
               if task.completed < task.started:
                   errors.append(DateOrderError(
                       'completed before started',
                       task.completed, task.started
                   ))

           if task.started and task.created:
               if task.started < task.created:
                   errors.append(DateOrderError(
                       'started before created',
                       task.started, task.created
                   ))

           return errors
       ```

       Handling:
       - Report date logic violations
       - Show conflicting dates
       - Suggest corrections
       - Flag for manual review

    Error Handling Framework:

    ```python
    class IntegrityError:
        """Base class for all integrity errors"""
        severity: str  # critical, error, warning
        category: str  # circular_dep, orphaned, etc.
        file_path: str
        details: dict
        suggested_fix: str

    class ErrorHandler:
        """Centralized error handling"""

        def handle_error(self, error: IntegrityError):
            """Process error based on severity and type"""

        def can_auto_fix(self, error: IntegrityError) -> bool:
            """Check if error is auto-fixable"""

        def auto_fix(self, error: IntegrityError):
            """Attempt automatic fix"""

        def suggest_manual_fix(self, error: IntegrityError) -> str:
            """Provide fix instructions"""
    ```

    CLI Integration:

    ```bash
    vibey roadmap validate --auto-fix     # Auto-fix safe errors
    vibey roadmap validate --report-only  # No fixes, just report
    vibey roadmap validate --strict       # Fail on any error
    vibey roadmap check-circular-deps
    vibey roadmap find-orphaned-tasks
    vibey roadmap fix-broken-references
    ```

