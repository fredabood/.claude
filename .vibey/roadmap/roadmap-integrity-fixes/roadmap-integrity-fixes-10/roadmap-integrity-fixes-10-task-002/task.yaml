  title: Define documentation organization standards
  description: "Create comprehensive documentation organization standards for the\
    \ project.\n\nGOAL: Define clear rules for where documentation belongs\n\nKEY\
    \ DISTINCTION:\n\n**Context Documentation** (informs development):\n- Location:\
    \ `.vibey/roadmap/[track]/[sprint]/[task]/context/`\n- Purpose: Support development\
    \ process, capture decisions, record analysis\n- Lifecycle: Tied to specific track/sprint/task\n\
    - Examples:\n  * Analysis reports (schema audits, token usage analysis)\n  * Fix\
    \ strategies and design decisions\n  * QA reports and test results\n  * Research\
    \ findings and benchmarks\n  * Sprint retrospectives\n  * Task rationale and context\n\
    \n**Project Documentation** (describes state):\n- Location: `docs/`\n- Purpose:\
    \ Help users understand and use the project\n- Lifecycle: Maintained as long as\
    \ feature exists\n- Examples:\n  * User guides and tutorials\n  * API reference\
    \ and architecture docs\n  * Contributing guidelines\n  * Framework roadmap\n\
    \  * Agent and workflow definitions\n  * Development guides\n\nSTANDARDS DOCUMENT\
    \ STRUCTURE:\n\n```markdown\n# Documentation Organization Standards\n\n## Overview\n\
    - Purpose of this document\n- Quick decision flowchart\n\n## Context Documentation\n\
    ### Definition\n### Location Rules\n### Naming Conventions\n### File Types\n###\
    \ When to Create\n### Examples\n\n## Project Documentation\n### Definition\n###\
    \ Location Rules (docs/ structure)\n### Naming Conventions\n### When to Update\n\
    ### Examples\n\n## Decision Flowchart\n- Is this informing a specific task/sprint?\n\
    - Is this describing project functionality?\n- Edge cases and examples\n\n## Migration\
    \ Guidelines\n- How to move files safely\n- Updating references\n- Archive vs\
    \ delete decisions\n- Git history preservation\n\n## Validation\n- How to check\
    \ compliance\n- Common violations\n- Remediation steps\n```\n\nDELIVERABLE: docs/development/DOCUMENTATION_ORGANIZATION_STANDARDS.md\n"
