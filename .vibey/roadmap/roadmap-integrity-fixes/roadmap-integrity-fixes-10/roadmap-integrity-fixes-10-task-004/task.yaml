    \ migrations:\n       src_path = Path(source)\n       if src_path.exists():\n\
    \           # Use git mv to preserve history\n           dest_path = Path(dest)\
    \ / src_path.name\n           subprocess.run([\"git\", \"mv\", str(src_path),\
    \ str(dest_path)])\n           print(f\"Moved: {source} \u2192 {dest}\")\n   ```\n\
    \n3. Execute migration:\n   ```bash\n   # Dry run first\n   python3 scripts/migrate-documentation.py\
