    \ scripts/migrate-documentation.py\n   ```python\n   #!/usr/bin/env python3\n\
    \   \"\"\"Migrate documentation files to proper locations.\"\"\"\n\n   import\
    \ subprocess\n   from pathlib import Path\n\n   # Migration map: (source, destination)\n\
    \   migrations = [\n       # Sprint 8 context\n       (\"SCHEMA_AUDIT_REPORT_2025-11-20.md\"\
    ,\n        \".vibey/roadmap/roadmap-integrity-fixes/roadmap-integrity-fixes-8/context/\"\
