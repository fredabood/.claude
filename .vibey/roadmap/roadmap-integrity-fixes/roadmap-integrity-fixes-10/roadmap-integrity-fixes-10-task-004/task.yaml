  description: |
    Move context documentation files to proper locations based on audit results.

    GOAL: Migrate all analysis/report files to appropriate context/ directories

    PROCESS:

    1. Review audit report from Task 001
       - Identify all context documentation files
       - Determine correct destination for each
       - Group by destination for batch processing

    2. Create migration script: scripts/migrate-documentation.py
       ```python
       #!/usr/bin/env python3
       """Migrate documentation files to proper locations."""

       import subprocess
       from pathlib import Path

       # Migration map: (source, destination)
       migrations = [
           # Sprint 8 context
           ("SCHEMA_AUDIT_REPORT_2025-11-20.md",
            ".vibey/roadmap/roadmap-integrity-fixes/roadmap-integrity-fixes-8/context/"),
           ("SCHEMA_FIX_STRATEGY.md",
            ".vibey/roadmap/roadmap-integrity-fixes/roadmap-integrity-fixes-8/context/"),

           # Add more as identified in audit
       ]

       for source, dest in migrations:
           src_path = Path(source)
           if src_path.exists():
               # Use git mv to preserve history
               dest_path = Path(dest) / src_path.name
               subprocess.run(["git", "mv", str(src_path), str(dest_path)])
               print(f"Moved: {source} → {dest}")
       ```

    3. Execute migration:
       ```bash
       # Dry run first
       python3 scripts/migrate-documentation.py --dry-run

       # Review planned changes
       # Execute actual migration
       python3 scripts/migrate-documentation.py
       ```

    4. Update references:
       - Search for links to moved files
       - Update all references
       - Verify no broken links
       ```bash
       # Find broken markdown links
       python3 scripts/validate-markdown-links.py
       ```

    5. Update task.yaml deliverables:
       - If task deliverables reference moved files
       - Update paths in deliverables section
       - Maintain referential integrity

