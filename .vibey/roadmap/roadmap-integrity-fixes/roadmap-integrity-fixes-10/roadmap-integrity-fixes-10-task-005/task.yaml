  title: Update validation scripts and .gitignore
  description: "Create validation tooling to enforce documentation organization standards.\n\
    \nGOAL: Automated enforcement of documentation placement rules\n\nDELIVERABLES:\n\
    \n1. Update .gitignore for context/ directories\n2. Create validation script\n\
    3. Integrate with health dashboard\n\nIMPLEMENTATION:\n\n**1. .gitignore Updates**\n\
    \nAdd to .gitignore:\n```\n# ==============================================================================\n\
    # CONTEXT DOCUMENTATION\n# ==============================================================================\n\
    # Context directories contain development artifacts (analyses, reports, etc.)\n\
    # that inform the development process but aren't part of project documentation.\n\
    # These are typically generated/modified during development and tracked in git.\n\
    \n# Ignore all context directory contents by default\n.vibey/roadmap/*/context/*\n\
    .vibey/roadmap/*/*/context/*\n.vibey/roadmap/*/*/*/context/*\n\n# But preserve\
    \ the directories themselves\n!.vibey/roadmap/*/context/.gitkeep\n!.vibey/roadmap/*/*/context/.gitkeep\n\
    !.vibey/roadmap/*/*/*/context/.gitkeep\n\n# Track important context documents\
    \ (opt-in)\n# Example: !.vibey/roadmap/my-track/my-sprint/context/IMPORTANT_ANALYSIS.md\n\
    ```\n\n**2. Validation Script: scripts/validate-documentation-organization.py**\n\
    \n```python\n#!/usr/bin/env python3\n\"\"\"\nValidate documentation organization\
    \ compliance.\n\nChecks:\n1. All .md files in docs/ are project documentation\n\
    2. All .md files in context/ are context documentation\n3. No misplaced documentation\
    \ files\n4. All documentation links valid\n\"\"\"\n\nimport re\nfrom pathlib import\
    \ Path\nfrom typing import List, Tuple\n\nclass DocumentationValidator:\n    def\
    \ __init__(self):\n        self.errors = []\n        self.warnings = []\n    \
    \    self.project_root = Path(\".\")\n\n    def validate_all(self) -> Tuple[int,\
    \ int]:\n        \"\"\"Run all validation checks.\"\"\"\n        self.check_docs_directory()\n\
    \        self.check_context_directories()\n        self.check_misplaced_files()\n\
    \        self.check_broken_links()\n        return len(self.errors), len(self.warnings)\n\
    \n    def check_docs_directory(self):\n        \"\"\"Verify docs/ contains only\
    \ project documentation.\"\"\"\n        docs_path = self.project_root / \"docs\"\
    \n        for md_file in docs_path.rglob(\"*.md\"):\n            # Check if file\
    \ looks like context documentation\n            if self._is_context_doc(md_file):\n\
    \                self.errors.append(\n                    f\"Context doc in docs/:\
    \ {md_file.relative_to(self.project_root)}\"\n                )\n\n    def check_context_directories(self):\n\
    \        \"\"\"Verify context/ contains only context documentation.\"\"\"\n  \
    \      roadmap_path = self.project_root / \".vibey\" / \"roadmap\"\n        for\
    \ md_file in roadmap_path.rglob(\"context/*.md\"):\n            if self._is_project_doc(md_file):\n\
    \                self.errors.append(\n                    f\"Project doc in context/:\
    \ {md_file.relative_to(self.project_root)}\"\n                )\n\n    def check_misplaced_files(self):\n\
    \        \"\"\"Find documentation files in wrong locations.\"\"\"\n        # Check\
    \ for analysis reports outside context/\n        for md_file in self.project_root.rglob(\"\
    *.md\"):\n            rel_path = md_file.relative_to(self.project_root)\n\n  \
    \          # Skip valid locations\n            if str(rel_path).startswith(\"\
    docs/\"):\n                continue\n            if \"/context/\" in str(rel_path):\n\
    \                continue\n            if md_file.name in [\"README.md\", \"CLAUDE.md\"\
    , \"CHANGELOG.md\"]:\n                continue\n\n            # Check if looks\
    \ like context documentation\n            if self._is_context_doc(md_file):\n\
    \                self.warnings.append(\n                    f\"Possible misplaced\
    \ context doc: {rel_path}\"\n                )\n\n    def _is_context_doc(self,\
    \ file_path: Path) -> bool:\n        \"\"\"Heuristic: does this look like context\
    \ documentation?\"\"\"\n        name = file_path.name.upper()\n        context_indicators\
    \ = [\n            \"AUDIT\", \"REPORT\", \"ANALYSIS\", \"STRATEGY\",\n      \
    \      \"FIX\", \"QA\", \"COMPREHENSIVE\", \"MIGRATION\"\n        ]\n        return\
    \ any(indicator in name for indicator in context_indicators)\n\n    def _is_project_doc(self,\
    \ file_path: Path) -> bool:\n        \"\"\"Heuristic: does this look like project\
    \ documentation?\"\"\"\n        name = file_path.name.upper()\n        project_indicators\
    \ = [\n            \"GUIDE\", \"REFERENCE\", \"API\", \"TUTORIAL\",\n        \
    \    \"CONTRIBUTING\", \"README\", \"ARCHITECTURE\"\n        ]\n        return\
    \ any(indicator in name for indicator in project_indicators)\n\n    def check_broken_links(self):\n\
    \        \"\"\"Check for broken markdown links.\"\"\"\n        for md_file in\
    \ self.project_root.rglob(\"*.md\"):\n            content = md_file.read_text()\n\
    \            # Find markdown links: [text](path)\n            links = re.findall(r'\\\
    [([^\\]]+)\\]\\(([^)]+)\\)', content)\n            for text, link in links:\n\
    \                if link.startswith(\"http\"):\n                    continue \
    \ # Skip external links\n                link_path = (md_file.parent / link).resolve()\n\
    \                if not link_path.exists():\n                    self.errors.append(\n\
    \                        f\"Broken link in {md_file.name}: {link}\"\n        \
    \            )\n\n    def report(self) -> str:\n        \"\"\"Generate validation\
    \ report.\"\"\"\n        total_errors = len(self.errors)\n        total_warnings\
    \ = len(self.warnings)\n\n        report = f\"\"\"\nDocumentation Organization\
    \ Validation Report\n============================================\n\nErrors: {total_errors}\n\
    Warnings: {total_warnings}\n\n\"\"\"\n        if self.errors:\n            report\
    \ += \"\\nERRORS:\\n\"\n            for error in self.errors:\n              \
    \  report += f\"  ❌ {error}\\n\"\n\n        if self.warnings:\n            report\
    \ += \"\\nWARNINGS:\\n\"\n            for warning in self.warnings:\n        \
    \        report += f\"  ⚠️  {warning}\\n\"\n\n        if not self.errors and not\
    \ self.warnings:\n            report += \"✅ All documentation properly organized!\\\
    n\"\n\n        return report\n\nif __name__ == \"__main__\":\n    validator =\
    \ DocumentationValidator()\n    errors, warnings = validator.validate_all()\n\
    \    print(validator.report())\n    exit(0 if errors == 0 else 1)\n```\n\n**3.\
    \ Health Dashboard Integration**\n\nAdd to scripts/roadmap-health-dashboard.py:\n\
    ```python\ndef check_documentation_organization() -> int:\n    \"\"\"Check documentation\
    \ organization compliance.\"\"\"\n    from scripts.validate_documentation_organization\
    \ import DocumentationValidator\n\n    validator = DocumentationValidator()\n\
    \    errors, warnings = validator.validate_all()\n\n    # Score: 100 - (errors\
    \ * 10) - (warnings * 2)\n    score = max(0, 100 - (errors * 10) - (warnings *\
    \ 2))\n    return score\n```\n"
