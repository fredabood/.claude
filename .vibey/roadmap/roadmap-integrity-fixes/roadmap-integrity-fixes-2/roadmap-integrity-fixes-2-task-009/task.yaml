  task_type: development
  title: Forensic audit of infrastructure-fixes track
  description: |
    Perform comprehensive forensic audit of infrastructure-fixes track to determine
    actual completion status vs YAML claims.

    YAML Claims:
    - 1 sprint, 13 tasks claimed complete
    - Sprint status: production_ready
    - Track status: completed

    Investigation Steps:

    1. Backup Archive Analysis (PRIORITY 1)
       - Check .vibey/hierarchical-migration-backups/backup_20251109_171311/
       - Look for infrastructure-fixes files in old flat structure
       - Check tracks/infrastructure-fixes.yaml if exists
       - Check sprints/infrastructure-fixes-*.yaml if exists
       - Check tasks/infrastructure-fixes-*-tasks.yaml if exists
       - Extract task completion records from old format
       - Compare old backup data vs current YAML claims
       - Verify migration preserved all completion data

    2. Git History Analysis
       - Search for commits with keywords: "infrastructure", "fix", "bug"
       - Find commits fixing infrastructure issues
       - Extract commit SHAs, messages, dates, file changes
       - Count lines added/modified for infrastructure fixes
       - Cross-reference commits with backup timestamps
       - Map commits to specific tasks they implement

    3. Codebase Audit
       - Identify infrastructure components fixed
       - Verify fixes are implemented
       - Check for regression tests
       - Count actual infrastructure improvements

    4. Documentation Audit
       - Search for infrastructure fix documentation
       - Check for changelog entries
       - Verify deliverable documentation exists

    5. Test Suite Audit
       - Search for infrastructure-related tests
       - Verify regression tests exist
       - Check tests are passing
       - Verify fixes don't break existing functionality

    6. Migration Verification
       - Compare backup data vs current hierarchical structure
       - Verify all completed tasks from old format were preserved
       - Check if any task completion records were lost during migration
       - Verify progress counters accurately migrated
       - Identify any data loss or corruption during migration

    7. Cross-Reference Analysis
       - Compare git commits to claimed tasks (13)
       - Map fixes to claimed deliverables
       - Determine if 13 tasks is accurate count
       - Calculate real completion percentage based on ALL evidence
       - Reconcile backup data vs current data vs git history

    8. Commit Backfilling (Git Tracking System Integration)
       - For each identified commit related to infrastructure-fixes work:
         * Determine which task it implements
         * Add commit SHA to that task's commits: [] field in task.yaml
         * Update task metadata with commit backfill timestamp
       - Create audit trail of commit-to-task mappings
       - Verify all commits accounted for in task files
       - Update task completion dates based on commit timestamps if needed
       - Document any commits that cannot be mapped to specific tasks

    Acceptance Criteria:
    - All 8 investigation steps completed
    - Backup archive evidence reviewed and documented
    - Git history documented (commits, dates, changes)
    - All identified commits mapped to specific tasks
    - Commits backfilled into task.yaml files (commits: [] field)
    - Codebase evidence cataloged (files, lines, features)
    - Documentation evidence cataloged
    - Cross-reference analysis shows claimed vs actual
    - Accurate completion percentage calculated
    - Recommended status determined (completed/in_progress/not_started)
    - Evidence-based assessment documented
    - Git tracking system populated with commit evidence

    Deliverables:
    - Forensic audit report for infrastructure-fixes (markdown, 1000+ lines)
    - Git history analysis section
    - Commit-to-task mapping document
    - Updated task.yaml files with commits backfilled
    - Codebase evidence section
    - Documentation evidence section
    - Cross-reference analysis
    - Accurate status recommendation
    - Git tracking system integration verification
