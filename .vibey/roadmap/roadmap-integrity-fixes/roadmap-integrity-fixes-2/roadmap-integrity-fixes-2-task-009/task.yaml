  description: "Perform comprehensive forensic audit of infrastructure-fixes track\
    \ to determine\nactual completion status vs YAML claims.\n\nYAML Claims:\n- 1\
    \ sprint, 13 tasks claimed complete\n- Sprint status: production_ready\n- Track\
    \ status: completed\n\nInvestigation Steps:\n\n1. Backup Archive Analysis (PRIORITY\
    \ 1)\n   - Check .vibey/hierarchical-migration-backups/backup_20251109_171311/\n\
    \   - Look for infrastructure-fixes files in old flat structure\n   - Check tracks/infrastructure-fixes.yaml\
    \ if exists\n   - Check sprints/infrastructure-fixes-*.yaml if exists\n   - Check\
    \ tasks/infrastructure-fixes-*-tasks.yaml if exists\n   - Extract task completion\
    \ records from old format\n   - Compare old backup data vs current YAML claims\n\
    \   - Verify migration preserved all completion data\n\n2. Git History Analysis\n\
    \   - Search for commits with keywords: \"infrastructure\", \"fix\", \"bug\"\n\
    \   - Find commits fixing infrastructure issues\n   - Extract commit SHAs, messages,\
    \ dates, file changes\n   - Count lines added/modified for infrastructure fixes\n\
    \   - Cross-reference commits with backup timestamps\n   - Map commits to specific\
    \ tasks they implement\n\n3. Codebase Audit\n   - Identify infrastructure components\
    \ fixed\n   - Verify fixes are implemented\n   - Check for regression tests\n\
    \   - Count actual infrastructure improvements\n\n4. Documentation Audit\n   -\
    \ Search for infrastructure fix documentation\n   - Check for changelog entries\n\
    \   - Verify deliverable documentation exists\n\n5. Test Suite Audit\n   - Search\
    \ for infrastructure-related tests\n   - Verify regression tests exist\n   - Check\
    \ tests are passing\n   - Verify fixes don't break existing functionality\n\n\
    6. Migration Verification\n   - Compare backup data vs current hierarchical structure\n\
    \   - Verify all completed tasks from old format were preserved\n   - Check if\
    \ any task completion records were lost during migration\n   - Verify progress\
    \ counters accurately migrated\n   - Identify any data loss or corruption during\
    \ migration\n\n7. Cross-Reference Analysis\n   - Compare git commits to claimed\
    \ tasks (13)\n   - Map fixes to claimed deliverables\n   - Determine if 13 tasks\
    \ is accurate count\n   - Calculate real completion percentage based on ALL evidence\n\
    \   - Reconcile backup data vs current data vs git history\n\n8. Commit Backfilling\
    \ (Git Tracking System Integration)\n   - For each identified commit related to\
    \ infrastructure-fixes work:\n     * Determine which task it implements\n    \
    \ * Add commit SHA to that task's commits: [] field in task.yaml\n     * Update\
    \ task metadata with commit backfill timestamp\n   - Create audit trail of commit-to-task\
    \ mappings\n   - Verify all commits accounted for in task files\n   - Update task\
    \ completion dates based on commit timestamps if needed\n   - Document any commits\
    \ that cannot be mapped to specific tasks\n\nAcceptance Criteria:\n- All 8 investigation\
    \ steps completed\n- Backup archive evidence reviewed and documented\n- Git history\
    \ documented (commits, dates, changes)\n- All identified commits mapped to specific\
    \ tasks\n- Commits backfilled into task.yaml files (commits: [] field)\n- Codebase\
    \ evidence cataloged (files, lines, features)\n- Documentation evidence cataloged\n\
    - Cross-reference analysis shows claimed vs actual\n- Accurate completion percentage\
    \ calculated\n- Recommended status determined (completed/in_progress/not_started)\n\
    - Evidence-based assessment documented\n- Git tracking system populated with commit\
    \ evidence\n\nDeliverables:\n- Forensic audit report for infrastructure-fixes\
    \ (markdown, 1000+ lines)\n- Git history analysis section\n- Commit-to-task mapping\
    \ document\n- Updated task.yaml files with commits backfilled\n- Codebase evidence\
    \ section\n- Documentation evidence section\n- Cross-reference analysis\n- Accurate\
    \ status recommendation\n- Git tracking system integration verification\n"
