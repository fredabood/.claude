  task_type: development
  title: Cross-track analysis and pattern identification
  description: "Synthesize findings from all 10 individual track audits to identify\
    \ patterns,\nroot causes, and systemic issues across the roadmap system.\n\nThis\
    \ task depends on completion of tasks 001-010.\n\nAnalysis Steps:\n\n1. Pattern\
    \ Identification\n   - Identify common issues across multiple tracks\n   - Classify\
    \ issue types (migration failures, manual edits, etc.)\n   - Determine which issues\
    \ are systemic vs track-specific\n   - Calculate frequency of each issue type\n\
    \n2. Migration Analysis\n   - Compare backup data across all tracks\n   - Identify\
    \ which tracks had successful migrations\n   - Identify which tracks lost data\
    \ during migration\n   - Determine if migration failures follow a pattern\n  \
    \ - Calculate migration success rate\n\n3. Commit Pattern Analysis\n   - Analyze\
    \ commit-to-task mappings across all tracks\n   - Identify tracks with good git\
    \ hygiene\n   - Identify tracks with missing commit evidence\n   - Determine commit\
    \ backfilling coverage\n   - Calculate percentage of tasks with commit evidence\n\
    \n4. Completion Accuracy Analysis\n   - Compare YAML claims vs actual evidence\
    \ for all tracks\n   - Calculate accuracy rate (correct vs fraudulent claims)\n\
    \   - Identify tracks with highest discrepancies\n   - Determine if manual YAML\
    \ editing is the root cause\n\n5. Timeline Reconstruction\n   - Build timeline\
    \ of all work across all tracks\n   - Identify when issues were introduced\n \
    \  - Map issues to specific events (migrations, manual edits)\n   - Determine\
    \ critical dates for data corruption\n\n6. Root Cause Analysis\n   - Identify\
    \ primary causes of data integrity issues\n   - Determine if automation failures\
    \ or manual edits are primary cause\n   - Assess impact of migration on data quality\n\
    \   - Identify preventable vs unavoidable issues\n\n7. Impact Assessment\n   -\
    \ Calculate percentage of roadmap affected by issues\n   - Identify blocking dependencies\
    \ caused by bad data\n   - Assess trustworthiness of current roadmap metrics\n\
    \   - Determine scope of required fixes\n\n8. Recommendations Synthesis\n   -\
    \ Synthesize fix recommendations across all tracks\n   - Identify quick wins vs\
    \ complex fixes\n   - Prioritize fixes by impact and effort\n   - Determine critical\
    \ path to roadmap integrity\n\nAcceptance Criteria:\n- All 10 track audits reviewed\
    \ and synthesized\n- Pattern analysis complete with quantified findings\n- Migration\
    \ success/failure analysis documented\n- Commit backfilling coverage calculated\n\
    - Root cause analysis completed\n- Timeline of issues reconstructed\n- Impact\
    \ assessment quantified\n- Prioritized recommendations produced\n\nDeliverables:\n\
    - Cross-track analysis report (markdown, 500+ lines)\n- Pattern identification\
    \ matrix\n- Migration success analysis\n- Commit coverage metrics\n- Root cause\
    \ determination\n- Timeline of data corruption events\n- Impact assessment summary\n\
    - Prioritized fix recommendations\n"
