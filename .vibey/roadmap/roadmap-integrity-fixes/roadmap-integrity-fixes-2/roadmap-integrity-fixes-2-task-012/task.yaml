  title: Comprehensive forensic audit summary report
  description: |
    Produce final comprehensive forensic audit report synthesizing all findings
    from tasks 001-011.

    This is the final deliverable for Sprint 0.

    Report Structure:

    1. Executive Summary
       - Overall findings summary
       - Key statistics (tracks audited, issues found, commits mapped)
       - Critical findings highlights
       - Recommended actions summary

    2. Methodology
       - 8-step forensic audit process
       - Standards compliance review process
       - Tools and data sources used
       - Quality assurance measures
       - Limitations and caveats

    3. Individual Track Findings
       - Summary of each of 10 track audits
       - Reference to detailed track audit reports
       - Status recommendations per track
       - Commit backfilling results per track

    4. Cross-Track Analysis
       - Patterns and systemic issues
       - Migration analysis results
       - Root cause determination
       - Timeline of data corruption

    5. Standards & Modernization Audit
       - Legacy structures identified
       - Outdated references catalog
       - Deprecated systems still referenced
       - Modernization priority matrix
       - Update effort estimates

    6. Backup Archive Analysis
       - Migration accuracy assessment
       - Data loss quantification
       - Backup restoration recommendations

    7. Git Tracking System Integration
       - Commit backfilling statistics
       - Coverage metrics (% tasks with commits)
       - Unmapped commits analysis
       - Git tracking system health

    8. Evidence Summary
       - Git history evidence by track
       - Codebase evidence by track
       - Documentation evidence by track
       - Test evidence by track

    9. Accurate Status Determinations
       - Recommended status for each track
       - Recommended progress percentages
       - Evidence-based justifications
       - Confidence levels per determination

    10. Impact Assessment
        - Roadmap trustworthiness score
        - Percentage of roadmap affected
        - Blocking dependencies impact
        - Timeline impact
        - Content currency assessment

    11. Recommendations
        - Immediate fixes required (Sprint 1)
        - Structural repairs needed (Sprint 3)
        - Validation system requirements (Sprint 4)
        - Modernization updates needed
        - Prevention measures
        - Long-term improvements

    12. Appendices
        - Detailed statistics
        - Commit-to-task mapping tables
        - Migration verification results
        - Quality gate recommendations
        - Legacy structures inventory

    Acceptance Criteria:
    - All sections completed with comprehensive detail
    - All 10 track audit reports referenced and summarized
    - Cross-track analysis integrated
    - Evidence summary complete
    - Accurate status recommendations for all tracks
    - Impact assessment quantified
    - Recommendations actionable and prioritized
    - Report length 2000+ lines
    - Report formatted as markdown
    - Report ready for stakeholder review

    Deliverables:
    - Comprehensive forensic audit report (markdown, 2000+ lines)
    - Executive summary (suitable for non-technical stakeholders)
    - Detailed findings by track
    - Cross-track analysis integration
    - Evidence summary tables
    - Accurate status recommendation matrix
    - Prioritized action plan for Sprints 1-4
    - Quality gate recommendations
