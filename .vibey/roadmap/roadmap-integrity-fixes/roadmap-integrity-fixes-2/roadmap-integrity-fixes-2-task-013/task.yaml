  title: Comprehensive standards and modernization audit
  description: "Review all tracks, sprints, and tasks to ensure they're up to date\
    \ with\ncurrent standards, systems, and requirements. Identify legacy structures\n\
    and outdated references from old systems.\n\nThis audit runs in parallel with\
    \ forensic audit (tasks 001-010) and feeds\ninto the comprehensive summary report\
    \ (task 012).\n\nAudit Categories:\n\n1. Architecture & Pattern Compliance:\n\
    \   - Verify all tracks use current hierarchical structure\n   - Identify any\
    \ flat structure remnants\n   - Check for deprecated patterns (embedded tasks,\
    \ tasks_summary)\n   - Verify compliance with current data models\n   - Flag any\
    \ old migration artifacts\n\n2. System References Audit:\n   - Identify references\
    \ to deleted/deprecated systems\n   - Check for old slash command references (deleted\
    \ in Sprint 1)\n   - Verify CLI command references use current syntax\n   - Check\
    \ for obsolete MCP references\n   - Flag references to old config structure (pre-modular\
    \ config)\n\n3. Standards Compliance:\n   - Check if tracks follow current naming\
    \ conventions\n   - Verify task descriptions match current templates\n   - Check\
    \ deliverable format compliance\n   - Verify metadata fields are current\n   -\
    \ Check quality gate structure is up to date\n\n4. Documentation References:\n\
    \   - Verify all doc references point to existing files\n   - Check for references\
    \ to moved/renamed documentation\n   - Identify outdated documentation links\n\
    \   - Verify README references are current\n   - Check for broken internal links\n\
    \n5. Technology Stack Audit:\n   - Verify Python version references (3.10+ required)\n\
    \   - Check for deprecated library references\n   - Verify test framework references\
    \ current (pytest)\n   - Check for old datetime.utcnow() usage (deprecated)\n\
    \   - Identify any Python 2 legacy code references\n\n6. Terminology Audit:\n\
    \   - Check for old framework terminology\n   - Verify agent names match current\
    \ roster\n   - Check workflow references are current\n   - Verify template references\
    \ match current templates\n   - Flag any obsolete framework concepts\n\n7. Feature\
    \ References:\n   - Identify tasks referencing deleted features\n   - Check for\
    \ references to deprecated functionality\n   - Verify claimed deliverables are\
    \ still relevant\n   - Flag work that may be obsolete\n   - Identify features\
    \ superseded by new implementations\n\n8. Integration Points:\n   - Check for\
    \ old integration patterns\n   - Verify API references are current\n   - Check\
    \ for deprecated hooks/callbacks\n   - Verify tool integration references current\n\
    \   - Flag old platform-specific code\n\n9. Quality Standards Review:\n   - Verify\
    \ test coverage requirements current\n   - Check documentation requirements current\n\
    \   - Review security standards compliance\n   - Check performance benchmarks\
    \ relevant\n   - Verify deployment standards current\n\n10. Priority & Relevance\
    \ Assessment:\n    - Flag tracks that may no longer be relevant\n    - Identify\
    \ work that's been superseded\n    - Check if priorities align with current strategy\n\
    \    - Verify estimated durations realistic\n    - Flag tasks that should be reconsidered\n\
    \nFor Each Track/Sprint/Task:\n\n1. Content Review:\n   - Read full description\n\
    \   - Identify all system references\n   - Check all technology mentions\n   -\
    \ Review all deliverables\n   - Analyze acceptance criteria\n\n2. Standards Check:\n\
    \   - Compare against current standards\n   - Flag deviations\n   - Note outdated\
    \ patterns\n   - Document legacy structures\n\n3. Modernization Recommendations:\n\
    \   - What needs updating?\n   - What should be deleted?\n   - What needs rewriting?\n\
    \   - Priority for updates?\n\n4. Documentation:\n   - List all legacy references\
    \ found\n   - Document current standard for each\n   - Provide migration recommendations\n\
    \   - Estimate effort to modernize\n\nLegacy Systems to Check For:\n\n- Old slash\
    \ command system (deleted Nov 2025)\n- Standalone Python scripts (replaced by\
    \ CLI)\n- Flat roadmap structure (pre-Nov 10 migration)\n- Embedded tasks pattern\
    \ (simplified pattern)\n- tasks_summary text lists (invalid pattern)\n- Old config\
    \ format (pre-modular config)\n- Deprecated datetime.utcnow() usage\n- Old agent\
    \ names or structures\n- Deprecated workflow patterns\n- Old template formats\n\
    - Legacy quality gate patterns\n- Old MCP server implementations\n\nAcceptance\
    \ Criteria:\n- All 19 tracks reviewed for standards compliance\n- All sprints\
    \ reviewed for current patterns\n- All tasks reviewed for outdated references\n\
    - Legacy structures cataloged\n- Modernization recommendations documented\n- Priority\
    \ levels assigned to updates\n- Integration with forensic audit complete\n\nDeliverables:\n\
    - Standards compliance audit report (markdown, 1000+ lines)\n- Legacy structures\
    \ inventory\n- Outdated references catalog\n- Modernization priority matrix\n\
    - Update effort estimates\n- Migration recommendations per track\n- Integration\
    \ with comprehensive summary (task 012)\n"
