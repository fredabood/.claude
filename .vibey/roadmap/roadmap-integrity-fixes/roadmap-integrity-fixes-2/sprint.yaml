      This sprint performs comprehensive forensic analysis to determine what
      work was actually done vs what YAML claims.

      INVESTIGATION TARGETS (10 tracks):
      1. standards-system (51 tasks claimed)
      2. testing-system (30 tasks claimed)
      3. documentation-system (5/19 tasks)
      4. missing-agents (0 tasks, status completed)
      5. claude-port (0 tasks, status completed)
      6. roadmap-system (0 tasks, status completed)
      7. interface-unification (load error)
      8. platform-context-management (load error)
      9. infrastructure-fixes (13 tasks claimed)
      10. directory-migration (multiple sprints)

      METHODOLOGY: Git history + codebase + docs + tests + backup archives + cross-reference + commit backfilling

      BACKUP ARCHIVES TO AUDIT:
      - .vibey/migration-backups/backup_20251109_163859/
      - .vibey/hierarchical-migration-backups/backup_20251109_171311/
      - .vibey/hierarchical-migration-backups/backup_20251109_171342/
      - .vibey/backups/ (claude-code backups)

      These backups contain the OLD FLAT STRUCTURE:
      - tracks/*.yaml (11 track files)
      - sprints/*.yaml (8 sprint files)
      - tasks/*-tasks.yaml (8 task list files)

      CRITICAL: Work may have been completed in old format but not properly
      migrated to new hierarchical structure. Must verify migration accuracy.

      GIT TRACKING SYSTEM INTEGRATION:
      During the forensic audit, all commits identified as implementing tasks will
      be backfilled into the task.yaml files' commits: [] field. This creates
      permanent traceability between tasks and actual implementation, populating
      the git tracking system with historical evidence.

      Steps for each commit found:
      1. Identify which task(s) the commit implements
      2. Add commit SHA to task.yaml commits: [] field
      3. Update task metadata with backfill timestamp
      4. Document commit-to-task mappings in audit report

      TASK BREAKDOWN:
      - Tasks 001-010: Forensic audit per track (includes backup review + commit backfilling)
      - Task 011: Cross-track analysis
      - Task 012: Comprehensive forensic report
      - Task 013: Standards & modernization audit (legacy systems review)
