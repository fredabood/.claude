  title: Clean up missing sprint declarations
  description: |
    Fix discrepancies where tracks declare sprints that don't exist on disk.

    Audit found: 30 declared sprints missing from disk across 9 tracks

    Process:
    1. Identify all tracks with missing sprint declarations
    2. For each missing sprint, determine:
       - Was sprint deleted/moved?
       - Was declaration added but sprint never created?
       - Is sprint planned but not yet started?

    3. Decision tree per missing sprint:
       - IF sprint was deleted: Remove declaration from track.yaml
       - IF sprint never created: Remove declaration OR create directory
       - IF sprint planned: Create sprint directory with not_started status

    4. For each decision:
       - Update track.yaml sprint list
       - Update sprints_total counter
       - Document reason for change
       - Preserve audit trail

    5. Tracks to check (from audit):
       - Check all 19 tracks for sprint declaration mismatches
       - Focus on tracks with highest discrepancies

    6. Validation:
       - Verify all declared sprints exist on disk
       - Verify no orphaned sprint directories
       - Check referential integrity

    Deliverables:
    - Cleaned sprint declarations across all tracks
    - Updated track.yaml files
    - Documentation of changes
    - Validation results showing no missing sprints
