  title: Verify all tracks use hierarchical structure correctly
  description: "Audit all tracks to ensure they follow the hierarchical directory\
    \ structure\npattern consistently.\n\nHierarchical Structure Standard:\n```\n\
    .vibey/roadmap/\n\u2514\u2500\u2500 {track-id}/\n    \u251C\u2500\u2500 track.yaml\n\
    \    \u251C\u2500\u2500 {sprint-id}/\n    \u2502   \u251C\u2500\u2500 sprint.yaml\n\
    \    \u2502   \u2514\u2500\u2500 {task-id}/\n    \u2502       \u2514\u2500\u2500\
    \ task.yaml\n    ```\n\nVerification Checks:\n1. Track level:\n   - track.yaml\
    \ exists\n   - All fields present and valid\n   - Sprint list matches directories\n\
    \n2. Sprint level:\n   - Sprint directories match track.yaml declarations\n  \
    \ - sprint.yaml exists in each directory\n   - Task count matches actual task\
    \ directories\n   - No embedded tasks in sprint.yaml (allowed but flag for review)\n\
    \n3. Task level:\n   - Task directories follow naming convention\n   - task.yaml\
    \ exists in each directory\n   - Task IDs consistent with directory names\n  \
    \ - All required fields present\n\n4. Structural Issues to Check:\n   - No flat\
    \ structure remnants\n   - No nested .vibey directories\n   - No orphaned files\n\
    \   - Consistent naming conventions\n   - Proper file permissions\n\n5. Pattern\
    \ Variations:\n   - Identify tracks using embedded tasks pattern\n   - Document\
    \ which tracks use which pattern\n   - Recommend migration to hierarchical if\
    \ needed\n\nDeliverables:\n- Structural audit report for all 19 tracks\n- List\
    \ of structural issues found\n- Corrections applied\n- Pattern usage documentation\n\
    - Recommendations for standardization\n"
