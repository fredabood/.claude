  task_type: development
  title: Implement vibey roadmap validate command
  description: |
    Create comprehensive validation command to check roadmap data integrity.

    Implementation:
    1. Create vibey/cli/commands/roadmap_validate.py
    2. Implement validation checks (see task 002-004 for specific checks)
    3. Add Click command interface
    4. Support verbose and JSON output modes
    5. Return exit code 0 (success) or 1 (failures found)

    Command Interface:
    ```bash
    vibey roadmap validate [OPTIONS]

    Options:
      --track TEXT          Validate specific track only
      --verbose            Show detailed validation output
      --json               Output results as JSON
      --fix                Attempt to fix issues automatically (future)
    ```

    Validation Categories:
    - Status/progress consistency (task 002)
    - Referential integrity (task 003)
    - Task data model validation (task 004)
    - Dependency cache accuracy
    - Blocked status correctness

    Output Format:
    - Summary: tracks checked, issues found, severity
    - Detailed: per-track validation results
    - Recommendations: how to fix issues
    - Exit code: 0 (pass) or 1 (fail)

    Integration:
    - Call from pre-commit hook (task 005)
    - Call from CI/CD pipeline (task 006)
    - Use in interactive CLI workflows

    Deliverables:
    - vibey roadmap validate command implemented
    - All validation checks integrated
    - Documentation for command usage
    - Unit tests for validation logic
