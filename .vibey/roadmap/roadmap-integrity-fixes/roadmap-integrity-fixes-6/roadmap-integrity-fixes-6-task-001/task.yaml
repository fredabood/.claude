  title: Implement vibey roadmap validate command
  description: "Create comprehensive validation command to check roadmap data integrity.\n\
    \nImplementation:\n1. Create vibey/cli/commands/roadmap_validate.py\n2. Implement\
    \ validation checks (see task 002-004 for specific checks)\n3. Add Click command\
    \ interface\n4. Support verbose and JSON output modes\n5. Return exit code 0 (success)\
    \ or 1 (failures found)\n\nCommand Interface:\n```bash\nvibey roadmap validate\
    \ [OPTIONS]\n\nOptions:\n  --track TEXT          Validate specific track only\n\
    \  --verbose            Show detailed validation output\n  --json            \
    \   Output results as JSON\n  --fix                Attempt to fix issues automatically\
    \ (future)\n```\n\nValidation Categories:\n- Status/progress consistency (task\
    \ 002)\n- Referential integrity (task 003)\n- Task data model validation (task\
    \ 004)\n- Dependency cache accuracy\n- Blocked status correctness\n\nOutput Format:\n\
    - Summary: tracks checked, issues found, severity\n- Detailed: per-track validation\
    \ results\n- Recommendations: how to fix issues\n- Exit code: 0 (pass) or 1 (fail)\n\
    \nIntegration:\n- Call from pre-commit hook (task 005)\n- Call from CI/CD pipeline\
    \ (task 006)\n- Use in interactive CLI workflows\n\nDeliverables:\n- vibey roadmap\
    \ validate command implemented\n- All validation checks integrated\n- Documentation\
    \ for command usage\n- Unit tests for validation logic\n"
