  task_type: development
  title: Add status/progress mismatch detection
  description: |
    Implement validation logic to detect status/progress mismatches.

    Validation Rules:

    1. Track Level:
       - IF status == completed: progress.completion_percent MUST be 100
       - IF status == in_progress: completion_percent MUST be 1-99
       - IF status == not_started: completion_percent MUST be 0
       - tasks_completed MUST be <= tasks_total
       - sprints_completed MUST be <= sprints_total

    2. Sprint Level:
       - IF status == completed: completion_percent MUST be 100
       - IF status == production_ready: completion_percent MUST be 100
       - IF status == in_progress: completion_percent MUST be 1-99
       - IF status == not_started: completion_percent MUST be 0
       - tasks_completed MUST be <= tasks_total

    3. Task Level:
       - IF status == completed: completed timestamp MUST exist
       - IF status == in_progress: started timestamp MUST exist
       - IF status == not_started: both timestamps MUST be null

    4. Progress Calculation Validation:
       - Calculate expected completion_percent from actual task data
       - Compare to declared completion_percent
       - Flag if difference > 5%

    Implementation:
    - Create validation functions in vibey/operations/roadmap/validation.py
    - Add comprehensive test cases
    - Return structured validation results
    - Include severity levels (error, warning)

    Deliverables:
    - Status/progress validation logic
    - Test suite
    - Documentation of validation rules
