  task_type: development
  title: Add referential integrity checks
  description: "Implement validation logic to detect referential integrity violations.\n\
    \nValidation Rules:\n\n1. Sprint References:\n   - All sprints declared in track.yaml\
    \ MUST exist on disk\n   - All sprint directories MUST be declared in track.yaml\n\
    \   - Sprint IDs in sprint.yaml MUST match directory names\n\n2. Task References:\n\
    \   - All tasks referenced in sprint.yaml MUST exist on disk\n   - All task directories\
    \ MUST be referenced (or embedded pattern)\n   - Task IDs in task.yaml MUST match\
    \ directory names\n\n3. Dependency References:\n   - All depends_on references\
    \ MUST point to existing tracks/sprints/tasks\n   - All blocks references MUST\
    \ point to existing tracks/sprints/tasks\n   - All blocked_by references MUST\
    \ have reciprocal blocks entry\n   - Dependency cycles MUST be detected and flagged\n\
    \n4. Track References:\n   - All tracks in roadmap.yaml MUST have directories\n\
    \   - All track directories MUST be in roadmap.yaml\n   - Track IDs MUST be consistent\n\
    \n5. ID Consistency:\n   - Track ID in track.yaml matches directory name\n   -\
    \ Sprint ID in sprint.yaml matches directory name\n   - Task ID in task.yaml matches\
    \ directory name\n   - IDs follow naming convention: {parent-id}-{number}\n\n\
    Implementation:\n- Create referential integrity validation functions\n- Check\
    \ all reference types (tracks, sprints, tasks)\n- Detect orphaned objects\n- Detect\
    \ missing objects\n- Comprehensive test coverage\n\nDeliverables:\n- Referential\
    \ integrity validation logic\n- Test suite\n- Documentation of validation rules\n"
