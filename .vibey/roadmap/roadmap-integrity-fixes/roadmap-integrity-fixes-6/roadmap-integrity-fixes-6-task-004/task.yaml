  task_type: development
  title: Add task data model validation
  description: |
    Implement validation logic to enforce task data model standards.

    Validation Rules:

    1. Task Storage Pattern:
       - REJECT: tasks_summary without actual task objects (fraud prevention)
       - ACCEPT: Hierarchical task directories with task.yaml files
       - ACCEPT: Embedded tasks in sprint.yaml (warn to migrate)
       - REJECT: Empty tasks: [] list if tasks_total > 0

    2. Required Fields:
       - All task.yaml files MUST have required fields:
         * id, sprint_id, track_id, roadmap_id
         * task_type, title, description, status
         * created timestamp
       - Optional but recommended: deliverables, commits

    3. Field Types:
       - status: enum (not_started, in_progress, completed)
       - priority: enum (low, medium, high, critical)
       - complexity: enum (low, medium, high, very_high)
       - Timestamps: ISO 8601 format
       - Lists and dicts: proper YAML structure

    4. Task Completion Requirements:
       - IF status == completed:
         * completed timestamp MUST exist
         * All deliverables SHOULD be documented
         * commits list SHOULD have at least 1 commit
       - IF status == in_progress:
         * started timestamp MUST exist

    5. Pattern Validation:
       - Hierarchical pattern: tasks live in {sprint-id}/{task-id}/task.yaml
       - Embedded pattern: tasks list in sprint.yaml
       - REJECT: tasks_summary text without task objects

    Implementation:
    - Create task data model validation functions
    - Add pattern detection logic
    - Enforce data quality standards
    - Comprehensive test coverage

    Deliverables:
    - Task data model validation logic
    - Test suite
    - Documentation of validation rules
    - Pattern detection documentation
