  title: Create pre-commit validation hook
  description: "Create Git pre-commit hook to validate roadmap data before commits.\n\
    \nImplementation:\n\n1. Create hook script:\n   - File: .git/hooks/pre-commit\n\
    \   - Language: Bash wrapper calling Python validation\n   - Make executable\n\
    \n2. Validation flow:\n   - Detect if .vibey/roadmap/ files changed\n   - Run\
    \ vibey roadmap validate on changed tracks\n   - If validation fails: reject commit\
    \ with error message\n   - If validation passes: allow commit to proceed\n\n3.\
    \ Hook script structure:\n   ```bash\n   #!/bin/bash\n   # Pre-commit hook for\
    \ roadmap validation\n\n   # Check if roadmap files changed\n   if git diff --cached\
    \ --name-only | grep -q \"^.vibey/roadmap/\"\n   then\n     echo \"Validating\
    \ roadmap data...\"\n     vibey roadmap validate\n     if [ $? -ne 0 ]; then\n\
    \       echo \"❌ Roadmap validation failed. Fix issues before committing.\"\n\
    \       exit 1\n     fi\n     echo \"✅ Roadmap validation passed.\"\n   fi\n \
    \  exit 0\n   ```\n\n4. Installation:\n   - Add hook installer to vibey CLI\n\
    \   - Command: vibey roadmap install-hooks\n   - Auto-install on first roadmap\
    \ command (optional)\n   - Document manual installation\n\n5. Configuration:\n\
    \   - Allow bypass for emergencies (--no-verify)\n   - Add config option to disable\
    \ validation\n   - Support custom validation rules\n\n6. Testing:\n   - Test with\
    \ valid roadmap changes\n   - Test with invalid roadmap changes\n   - Test with\
    \ non-roadmap changes\n   - Verify rejection works correctly\n\nDeliverables:\n\
    - Pre-commit hook script\n- Hook installer command\n- Documentation\n- Test suite\n"
