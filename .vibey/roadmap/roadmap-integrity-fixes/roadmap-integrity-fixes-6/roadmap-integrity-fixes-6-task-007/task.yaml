  task_type: development
  title: Implement audit trail for status changes
  description: |
    Create audit trail system to track all roadmap status changes.

    Implementation:

    1. Audit Trail Storage:
       - File: .vibey/audit-trail.yaml (or per-track)
       - Structure:
         ```yaml
         audit_log:
         - timestamp: '2025-11-12T20:00:00+00:00'
           object_type: track
           object_id: standards-system
           field: status
           old_value: not_started
           new_value: in_progress
           changed_by: claude-code
           reason: Started work on Sprint 1
           commit: abc123def
         ```

    2. Change Tracking:
       - Track status changes (track, sprint, task)
       - Track progress changes
       - Track completion timestamp changes
       - Track blocking status changes
       - Capture reason for change (required)

    3. Integration Points:
       - Intercept status changes in CLI commands
       - Require --reason flag for manual status changes
       - Auto-log changes made by CLI operations
       - Log git commit SHA if available

    4. Audit Commands:
       ```bash
       vibey roadmap audit log              # Show recent changes
       vibey roadmap audit show <track-id>  # Show track history
       vibey roadmap audit revert <entry>   # Revert a change
       ```

    5. Validation:
       - Require reason for manual overrides
       - Flag suspicious changes (e.g., completed → not_started)
       - Detect unauthorized manual YAML edits
       - Alert on progress rollbacks

    6. Reporting:
       - Generate audit reports
       - Show timeline of changes
       - Identify manual vs automated changes
       - Track who/when/why for accountability

    Deliverables:
    - Audit trail storage implementation
    - Change tracking integration
    - Audit commands
    - Documentation
    - Test suite
