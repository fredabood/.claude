  title: Document validation standards and best practices
  description: "Create comprehensive documentation for roadmap validation system and\n\
    prevention best practices.\n\nDocumentation Structure:\n\n1. Validation System\
    \ Overview:\n   - Purpose and benefits\n   - Architecture diagram\n   - Validation\
    \ categories\n   - Integration points\n\n2. Validation Rules Reference:\n   -\
    \ Status/progress consistency rules\n   - Referential integrity rules\n   - Task\
    \ data model rules\n   - Dependency rules\n   - Blocked status rules\n\n3. CLI\
    \ Command Reference:\n   - vibey roadmap validate usage\n   - vibey roadmap audit\
    \ commands\n   - vibey roadmap install-hooks\n   - Examples and use cases\n\n\
    4. Pre-commit Hook Guide:\n   - Installation instructions\n   - Configuration\
    \ options\n   - Bypassing validation (emergencies)\n   - Troubleshooting\n\n5.\
    \ CI/CD Integration Guide:\n   - GitHub Actions setup\n   - Branch protection\
    \ rules\n   - PR workflow integration\n   - Customization options\n\n6. Best Practices\
    \ Guide:\n   - Use CLI commands instead of manual YAML edits\n   - Always provide\
    \ reason for status changes\n   - Run validation before commits\n   - Review audit\
    \ trail regularly\n   - Keep roadmap data quality high\n\n7. Troubleshooting Guide:\n\
    \   - Common validation errors\n   - How to fix each error type\n   - When to\
    \ use --no-verify\n   - Getting help\n\n8. Prevention Checklist:\n   - Pre-work:\
    \ Validate before starting\n   - During work: Use CLI commands only\n   - Post-work:\
    \ Validate before commit\n   - Code review: Check validation passed\n   - Maintenance:\
    \ Review audit trail weekly\n\nFiles to Create:\n- docs/roadmap/VALIDATION_SYSTEM.md\n\
    - docs/roadmap/VALIDATION_RULES.md\n- docs/roadmap/BEST_PRACTICES.md\n- docs/roadmap/TROUBLESHOOTING.md\n\
    \nDeliverables:\n- Complete validation system documentation\n- Best practices\
    \ guide\n- Troubleshooting guide\n- Integration guides\n- Examples and use cases\n"
