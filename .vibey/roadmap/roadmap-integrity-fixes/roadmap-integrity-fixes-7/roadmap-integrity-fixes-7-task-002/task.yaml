  title: Add pre-commit hook for Python serialization detection
  description: 'Add a pre-commit hook to .pre-commit-config.yaml that prevents

    committing YAML files with Python object serialization.


    Hook specification:

    - Searches all .yaml files for PYTHON_SERIALIZATION_PATTERN patterns

    - Fails commit if pattern found

    - Provides clear error message

    - Runs fast (<1 second)


    Test by attempting to commit a file with PYTHON_SERIALIZATION_PATTERN pattern.

    '
