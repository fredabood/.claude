  task_type: development
  title: Fix enum serialization bug in dependency update code
  description: 'Find and fix the root cause of Python object serialization in YAML:

    enum values not being converted to strings before YAML dump.


    Steps:

    1. Find all code that writes dependency status to YAML

    2. Ensure Status enums use .value before assignment

    3. Add validation to catch this pattern in code review

    4. Test by updating a dependency and checking YAML output


    Files likely affected:

    - vibey/operations/roadmap/update.py

    - vibey/operations/roadmap/init.py

    - Any code that modifies track dependencies


    Pattern to fix:

    BAD:  dep[''current_status''] = Status.COMPLETED

    GOOD: dep[''current_status''] = Status.COMPLETED.value

    '
