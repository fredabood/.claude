  description: "Create GitHub Actions workflow for automated roadmap validation.\n\
    \nCreate .github/workflows/roadmap-validation.yml with jobs:\n1. YAML Syntax Validation\n\
    \   - Use yamllint to check all .vibey/roadmap/**/*.yaml\n   - Fail on syntax\
    \ errors\n\n2. Python Serialization Detection\n   - Grep for PYTHON_SERIALIZATION_PATTERN\
    \ patterns\n   - Fail if found\n\n3. Dependency Status Validation\n   - Verify\
    \ all dependency statuses are strings\n   - Fail if enum objects found\n\n4. Track\
    \ Loadability Test\n   - Attempt to load all tracks with Python loader\n   - Fail\
    \ if any track fails to load\n\nTrigger: On push to main, on pull requests\n\n\
    Report: Create artifact with validation results\n"
