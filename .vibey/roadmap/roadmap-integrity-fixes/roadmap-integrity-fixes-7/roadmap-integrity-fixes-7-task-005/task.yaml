  description: |
    Create GitHub Actions workflow for automated roadmap validation.

    Create .github/workflows/roadmap-validation.yml with jobs:
    1. YAML Syntax Validation
       - Use yamllint to check all .vibey/roadmap/**/*.yaml
       - Fail on syntax errors

    2. Python Serialization Detection
       - Grep for PYTHON_SERIALIZATION_PATTERN patterns
       - Fail if found

    3. Dependency Status Validation
       - Verify all dependency statuses are strings
       - Fail if enum objects found

    4. Track Loadability Test
       - Attempt to load all tracks with Python loader
       - Fail if any track fails to load

    Trigger: On push to main, on pull requests

    Report: Create artifact with validation results
  acceptance_criteria:
  - GitHub Actions workflow file created
  - Workflow triggers on push and PR
  - All 4 validation jobs defined
  - Workflow runs successfully on current state
  - Intentional corruption fails the workflow
  - Results clearly indicate which check failed
  deliverables:
  - .github/workflows/roadmap-validation.yml
