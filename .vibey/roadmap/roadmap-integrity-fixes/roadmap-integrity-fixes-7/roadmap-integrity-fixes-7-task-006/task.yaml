  task_type: development
  title: Implement automated dependency status refresh
  description: 'Implement automated refresh of dependency statuses to prevent staleness.


    Options to implement:

    1. CLI command: vibey roadmap refresh-dependencies

    2. Git hook: On track status change, auto-update dependents

    3. Scheduled job: Daily/weekly dependency refresh


    Implementation requirements:

    - Read all track dependencies from track.yaml files

    - Check current status of each dependency track

    - Update current_status if changed

    - Update last_checked timestamp

    - Use .value for proper enum serialization

    - Log all updates for audit trail


    Prevents:

    - Stale dependency statuses (claude-port shows in_progress when completed)

    - Manual dependency checks

    - Tracks incorrectly blocked/unblocked

    '
