  description: "Add validation to ensure all cross-object references point to existing\
    \ objects.\n\nCRITICAL GAP: No validation that IDs reference actual objects. This\
    \ allows:\n\n```yaml\ntask:\n  sprint_id: \"non-existent-sprint\"  # Sprint doesn't\
    \ exist ✗\n\ndepends_on:\n  - blocker_id: \"fake-track\"  # Track doesn't exist\
    \ ✗\n```\n\nImpact: Broken relationships, orphaned tasks, invalid dependency graphs.\n\
    \nImplementation:\n1. Add to tests/validation/test_yaml_integrity.py:\n   - test_task_sprint_references_exist()\n\
    \   - test_task_track_references_exist()\n   - test_dependency_references_exist()\n\
    \   - test_blocker_references_exist()\n\n2. Build index of all valid IDs:\n  \
    \ - Scan all track.yaml files → collect track IDs\n   - Scan all sprint.yaml files\
    \ → collect sprint IDs\n   - Scan all task.yaml files → collect task IDs\n\n3.\
    \ Validate references:\n   - For each task: verify sprint_id exists, track_id\
    \ exists\n   - For each dependency: verify blocker_id/target_id exists\n   - For\
    \ each blocker: verify dependency_id exists\n\n4. Add validation function:\n \
    \  ```python\n   def validate_references(root_dir: Path) -> List[str]:\n     \
    \  \"\"\"Validate all cross-object references.\"\"\"\n       errors = []\n   \
    \    # Build indexes\n       tracks = load_all_tracks()\n       sprints = load_all_sprints()\n\
    \       tasks = load_all_tasks()\n\n       # Validate task references\n      \
    \ for task in tasks:\n           if task.sprint_id not in sprints:\n         \
    \      errors.append(f\"Task {task.id} references non-existent sprint {task.sprint_id}\"\
    )\n           if task.track_id not in tracks:\n               errors.append(f\"\
    Task {task.id} references non-existent track {task.track_id}\")\n\n       # Validate\
    \ dependencies\n       for track in tracks:\n           for dep in track.depends_on:\n\
    \               if dep.blocker_id not in tracks:\n                   errors.append(f\"\
    Track {track.id} depends on non-existent track {dep.blocker_id}\")\n\n       return\
    \ errors\n   ```\n\nVerification:\n- All reference validation tests pass on current\
    \ YAML\n- Create orphaned task with invalid sprint_id and verify test fails\n\
    - Fix reference and verify test passes\n"
  acceptance_criteria:
  - Reference validation tests implemented
  - All task → sprint references validated
  - All task → track references validated
  - All dependency references validated
