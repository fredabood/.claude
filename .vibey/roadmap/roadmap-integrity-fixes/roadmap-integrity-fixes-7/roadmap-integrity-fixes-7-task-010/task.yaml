  description: "Add validation to ensure progress calculations match actual completion\
    \ state.\n\nCRITICAL GAP: No validation that aggregate progress fields are correct.\
    \ This allows:\n\n```yaml\nprogress:\n  tasks_total: 10\n  tasks_completed: 3\n\
    \  completion_percent: 75  # Should be 30%, not 75% ✗\n```\n\nImpact: Misleading\
    \ progress indicators, incorrect roadmap status.\n\nImplementation:\n1. Add to\
    \ tests/validation/test_yaml_integrity.py:\n   - test_roadmap_progress_accurate()\n\
    \   - test_track_progress_accurate()\n   - test_sprint_progress_accurate()\n\n\
    2. Validation logic for each level:\n\n   **Roadmap:**\n   - Count actual tracks\
    \ (completed vs total)\n   - Count actual sprints across all tracks\n   - Count\
    \ actual tasks across all sprints\n   - Verify completion_percent = (tasks_completed\
    \ / tasks_total) * 100\n\n   **Track:**\n   - Count actual sprints (from sprints\
    \ list)\n   - Count actual tasks (sum across all sprints)\n   - Verify completion_percent\
    \ = (tasks_completed / tasks_total) * 100\n\n   **Sprint:**\n   - Count actual\
    \ tasks (from task files in sprint directory)\n   - Count completed tasks (status\
    \ = completed)\n   - Verify completion_percent = (tasks_completed / tasks_total)\
    \ * 100\n\n3. Tolerance for rounding:\n   ```python\n   expected = (completed\
    \ / total) * 100\n   assert abs(actual - expected) < 1  # Allow 1% rounding error\n\
    \   ```\n\n4. Edge cases:\n   - Division by zero (tasks_total = 0)\n   - Empty\
    \ sprints/tracks\n   - Completed count > total count (should error)\n\nVerification:\n\
    - All progress validation tests pass on current YAML\n- Corrupt a test file with\
    \ wrong completion_percent and verify test fails\n- Fix calculation and verify\
    \ test passes\n"
  acceptance_criteria:
  - Progress validation tests implemented for roadmap/track/sprint
  - Tests verify completion_percent matches actual completion
  - Tests verify total counts match actual object counts
  - Tests verify completed counts ≤ total counts
  - Tests allow 1% rounding tolerance
