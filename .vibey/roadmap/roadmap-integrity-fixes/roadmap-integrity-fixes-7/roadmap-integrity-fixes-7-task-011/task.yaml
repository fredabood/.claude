  description: |
    Add validation to ensure date fields follow logical chronological order.

    GAP: No validation of date relationships. This allows nonsensical timelines:

    ```yaml
    task:
      created: '2025-11-16T00:00:00+00:00'
      completed: '2025-11-15T00:00:00+00:00'  # Before created ✗
      started: '2025-11-17T00:00:00+00:00'    # After completed ✗
    ```

    Impact: Nonsensical timelines, incorrect duration calculations.

    Implementation:
    1. Add to tests/validation/test_yaml_integrity.py:
       - test_roadmap_dates_chronological()
       - test_track_dates_chronological()
       - test_sprint_dates_chronological()
       - test_task_dates_chronological()

    2. Date validation rules:

       **All objects:**
       - created ≤ started (if both exist)
       - started ≤ completed (if both exist)
       - created ≤ completed (if both exist)

       **Sprint-specific:**
       - started ≤ completion_gate_check_at ≤ completed
       - completed ≤ production_gate_check_at ≤ production_ready_at
       - production_ready_at ≤ deployed_at

       **Roadmap-specific:**
       - created ≤ started ≤ completed ≤ deployed

    3. Handle None values:
       ```python
       def validate_chronological(created, started, completed):
           if created and started:
               assert created <= started, "started before created"
           if started and completed:
               assert started <= completed, "completed before started"
           if created and completed:
               assert created <= completed, "completed before created"
       ```

    4. Collect all violations:
       - Report file path and object ID
       - Report which date pair is out of order
       - Report actual dates for debugging

    Verification:
    - All date validation tests pass on current YAML
    - Create test file with completed < started and verify test fails
    - Fix dates and verify test passes
  acceptance_criteria:
