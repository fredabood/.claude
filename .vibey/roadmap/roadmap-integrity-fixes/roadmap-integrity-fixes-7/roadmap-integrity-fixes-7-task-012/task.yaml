  description: "Add validation to detect circular dependencies that create deadlocks.\n\
    \nGAP: No validation that dependencies don't form cycles. This allows:\n\n```yaml\n\
    # Track A depends on Track B\n# Track B depends on Track A\n# = Deadlock - neither\
    \ can ever complete ✗\n```\n\nImpact: Tracks that can never unblock, roadmap progress\
    \ stalls.\n\nImplementation:\n1. Add to tests/validation/test_yaml_integrity.py:\n\
    \   - test_no_dependency_cycles_in_tracks()\n   - test_no_dependency_cycles_in_sprints()\n\
    \   - test_no_dependency_cycles_in_tasks()\n\n2. Cycle detection algorithm (Depth-First\
    \ Search):\n   ```python\n   def detect_cycles(nodes, get_dependencies):\n   \
    \    \"\"\"\n       Detect cycles in dependency graph using DFS.\n\n       Args:\n\
    \           nodes: List of all objects (tracks/sprints/tasks)\n           get_dependencies:\
    \ Function to get dependencies of a node\n\n       Returns:\n           List of\
    \ cycles found (each cycle is a list of node IDs)\n       \"\"\"\n       visited\
    \ = set()\n       rec_stack = set()\n       cycles = []\n\n       def dfs(node_id,\
    \ path):\n           if node_id in rec_stack:\n               # Found a cycle\n\
    \               cycle_start = path.index(node_id)\n               cycle = path[cycle_start:]\
    \ + [node_id]\n               cycles.append(cycle)\n               return\n\n\
    \           if node_id in visited:\n               return\n\n           visited.add(node_id)\n\
    \           rec_stack.add(node_id)\n           path.append(node_id)\n\n      \
    \     for dep in get_dependencies(node_id):\n               dfs(dep, path[:])\n\
    \n           rec_stack.remove(node_id)\n\n       for node in nodes:\n        \
    \   if node.id not in visited:\n               dfs(node.id, [])\n\n       return\
    \ cycles\n   ```\n\n3. Apply to each level:\n   - **Tracks:** Build dependency\
    \ graph from depends_on field\n   - **Sprints:** Build dependency graph from development_gates\n\
    \   - **Tasks:** Build dependency graph from dependencies field\n\n4. Report cycles\
    \ clearly:\n   ```\n   ERROR: Dependency cycle detected in tracks:\n     track-a\
    \ → track-b → track-c → track-a\n   ```\n\n5. Edge cases:\n   - Self-dependency\
    \ (track depends on itself)\n   - Multi-hop cycles (A→B→C→A)\n   - Multiple independent\
    \ cycles\n\nVerification:\n- Test passes on current YAML (no cycles)\n- Create\
    \ test file with A→B→A cycle and verify test fails\n- Break cycle and verify test\
    \ passes\n"
  acceptance_criteria:
