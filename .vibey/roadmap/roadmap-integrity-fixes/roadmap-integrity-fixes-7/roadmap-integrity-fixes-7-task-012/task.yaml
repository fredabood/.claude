  description: |
    Add validation to detect circular dependencies that create deadlocks.

    GAP: No validation that dependencies don't form cycles. This allows:

    ```yaml
    # Track A depends on Track B
    # Track B depends on Track A
    # = Deadlock - neither can ever complete ✗
    ```

    Impact: Tracks that can never unblock, roadmap progress stalls.

    Implementation:
    1. Add to tests/validation/test_yaml_integrity.py:
       - test_no_dependency_cycles_in_tracks()
       - test_no_dependency_cycles_in_sprints()
       - test_no_dependency_cycles_in_tasks()

    2. Cycle detection algorithm (Depth-First Search):
       ```python
       def detect_cycles(nodes, get_dependencies):
           """
           Detect cycles in dependency graph using DFS.

           Args:
               nodes: List of all objects (tracks/sprints/tasks)
               get_dependencies: Function to get dependencies of a node

           Returns:
               List of cycles found (each cycle is a list of node IDs)
           """
           visited = set()
           rec_stack = set()
           cycles = []

           def dfs(node_id, path):
               if node_id in rec_stack:
                   # Found a cycle
                   cycle_start = path.index(node_id)
                   cycle = path[cycle_start:] + [node_id]
                   cycles.append(cycle)
                   return

               if node_id in visited:
                   return

               visited.add(node_id)
               rec_stack.add(node_id)
               path.append(node_id)

               for dep in get_dependencies(node_id):
                   dfs(dep, path[:])

               rec_stack.remove(node_id)

           for node in nodes:
               if node.id not in visited:
                   dfs(node.id, [])

           return cycles
       ```

    3. Apply to each level:
       - **Tracks:** Build dependency graph from depends_on field
       - **Sprints:** Build dependency graph from development_gates
       - **Tasks:** Build dependency graph from dependencies field

    4. Report cycles clearly:
       ```
       ERROR: Dependency cycle detected in tracks:
         track-a → track-b → track-c → track-a
       ```

    5. Edge cases:
       - Self-dependency (track depends on itself)
       - Multi-hop cycles (A→B→C→A)
       - Multiple independent cycles

    Verification:
    - Test passes on current YAML (no cycles)
    - Create test file with A→B→A cycle and verify test fails
    - Break cycle and verify test passes
