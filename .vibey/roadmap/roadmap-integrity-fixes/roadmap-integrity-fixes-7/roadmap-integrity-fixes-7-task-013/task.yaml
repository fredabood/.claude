  description: |
    Add validation to enforce that all required fields are present in YAML files.

    GAP: Dataclasses use defaults, so missing required fields don't error at load time.

    ```yaml
    task:
      id: my-task
      # Missing: sprint_id, track_id, status (all required) ✗
    ```

    Currently this loads successfully with None/default values instead of failing.

    Impact: Partial objects that fail at runtime when required fields are accessed.

    Implementation:
    1. Add to tests/validation/test_yaml_integrity.py:
       - test_roadmap_required_fields()
       - test_track_required_fields()
       - test_sprint_required_fields()
       - test_task_required_fields()

    2. Define required fields per object type:

       **Roadmap:**
       - id, name, version, status, created, progress

       **Track:**
       - id, name, roadmap_id, status, priority, created, progress, metadata

       **Sprint:**
       - id, name, track_id, roadmap_id, status, created, progress, metadata

       **Task:**
       - id, sprint_id, track_id, status, title, created, priority, metadata

    3. Validation approach:
       ```python
       def validate_required_fields(yaml_path, required_fields):
           """Validate that all required fields are present."""
           with open(yaml_path) as f:
               data = yaml.safe_load(f)

           obj_data = data.get('task') or data.get('sprint') or data.get('track')

           missing = []
           for field in required_fields:
               if field not in obj_data or obj_data[field] is None:
                   missing.append(field)

           if missing:
               raise ValueError(f"{yaml_path}: Missing required fields: {missing}")
       ```

    4. Check nested required fields:
       - progress.tasks_total (not just progress exists)
       - metadata.last_updated (not just metadata exists)

    5. Report missing fields with file path:
       ```
       ERROR: .vibey/roadmap/track-a/track.yaml
         Missing required fields: status, priority
       ```

    Verification:
    - All required field tests pass on current YAML
    - Remove required field from test file and verify test fails
    - Restore field and verify test passes
  acceptance_criteria:
