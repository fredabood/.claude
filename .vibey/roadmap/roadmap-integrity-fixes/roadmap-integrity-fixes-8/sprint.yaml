    priority: critical
    rationale: 'CRITICAL BUGFIX SPRINT - Created 2025-11-20


      CONTEXT: Sprint 7 completion revealed critical bugs in CLI tooling

      - Unable to use ''vibey roadmap complete'' for deterministic updates

      - Forced manual YAML edits as workaround

      - Violates automated state management principles


      PROBLEM: 4 bugs prevent automated sprint state updates:

      1. Deliverables schema incompatibility (string vs dict)

      2. Invalid DeliverableType enum values

      3. Standards enforcement field mismatch (title vs name)

      4. Task object structure inconsistency


      EVIDENCE:

      - KeyError: ''type'' when loading tasks

      - ValueError: ''configuration'' is not valid DeliverableType

      - KeyError: ''title'' in standards enforcement

      - Inconsistent field naming across codebase


      RISK: Without fixes, roadmap system unusable for automation

      - Manual YAML edits required for every sprint

      - Non-deterministic state updates

      - High error rate, low confidence

      - Cannot scale to automated workflows


      SPRINT GOAL: Fix CLI bugs enabling deterministic state management


      This sprint fixes the infrastructure issues that prevent automated

      roadmap state updates, enabling proper workflow automation for all

      future sprints.'
    notes: "Sprint 8: CLI State Management Bugs\n====================================\n\
      \nCreated: 2025-11-20\nTrigger: Bugs found during Sprint 7 completion attempt\n\
      Duration: 3-4 hours\nPriority: CRITICAL\n\nTASK BREAKDOWN\n==============\n\n\
      Task 1: Fix deliverables schema backward compatibility (1 hour, P0)\n------------------------------------------------------------------\n\
      File: vibey/roadmap/serialization/yaml_loader.py:815-821\n\nCurrent code expects:\n\
      \  deliverables:\n    - type: documentation\n      paths: [...]\n\nLegacy YAML\
      \ has:\n  deliverables:\n    - Fixed aider-port/track.yaml\n\nFix: Add backward-compatible\
      \ parsing\n  if isinstance(d, str):\n      deliverables.append(Deliverable(type=DeliverableType.OTHER,\
      \ paths=[d]))\n  elif isinstance(d, dict):\n      deliverables.append(Deliverable(type=d['type'],\
      \ paths=d['paths']))\n\nTask 2: Fix DeliverableType enum normalization (30 min,\
      \ P0)\n-----------------------------------------------------------\nProblem:\
      \ YAML uses 'configuration', enum expects 'config'\n\nOptions:\n1. Add alias\
      \ mapping: {\"configuration\": \"config\"}\n2. Migration script to normalize\
      \ all YAML files\n3. Validation at creation time\n\nRecommended: Option 1 (quick)\
      \ + Option 2 (clean up)\n\nTask 3: Fix standards enforcement field mismatch\
      \ (1 hour, P0)\n-------------------------------------------------------------\n\
      File: vibey/operations/roadmap/standards_enforcement.py\n\nProblem: Code accesses\
      \ task.title, but model has task.name\n\nFix: Update all field references\n\
      \  grep -rn \"task\\.title\" vibey/operations/roadmap/\n  Replace with task.name\n\
      \nTask 4: Audit Task model field consistency (1.5 hours, P1)\n----------------------------------------------------------\n\
      Problem: Inconsistent field naming across codebase\n\nSteps:\n1. Audit all Task\
      \ field accesses: grep -rn \"task\\.\" vibey/\n2. Document expected vs actual\
      \ fields\n3. Standardize on one naming convention\n4. Update all references\n\
      5. Add tests to prevent regression\n\nSUCCESS CRITERIA\n================\n\n\
      ✅ vibey roadmap complete works without errors\n✅ Backward-compatible with legacy\
      \ deliverables format\n✅ All DeliverableType values normalized\n✅ Standards\
      \ enforcement uses correct field names\n✅ Test suite validates CLI state management\n\
      ✅ No manual YAML edits required for sprint completion\n"
