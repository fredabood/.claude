    notes: "Sprint 9: YAML Schema Remediation\n==================================\n\
      \nCreated: 2025-11-20\nTrigger: Health dashboard showing 4.8% schema compliance\n\
      Duration: 1-2 weeks\nPriority: CRITICAL\nScope: 414 schema validation failures\
      \ across 435 files\n\nTASK BREAKDOWN\n==============\n\nTask 1: Audit schema\
      \ validation failures (2 hours)\n--------------------------------------------------\n\
      Use validate-roadmap-schema.py to categorize all 414 failures:\n\n1. Missing\
      \ required fields (47 critical)\n   - Which fields? (sprint_id, title, task_id)\n\
      \   - Which file types? (tracks, sprints, tasks)\n   - Pattern analysis\n\n\
      2. Field hierarchy issues (373 high)\n   - Fields at wrong nesting level\n \
      \  - Incorrect parent/child relationships\n   - Schema evolution mismatches\n\
      \n3. Type validation failures\n   - String vs int mismatches\n   - Date format\
      \ issues\n   - Enum value problems\n\nDeliverable: Categorized audit report\
      \ with fix strategy\n\nTask 2: Fix missing required fields (4 hours)\n---------------------------------------------\n\
      Fix 47 critical issues:\n\nPattern: Missing 'sprint_id' in track.yaml\n  grep\
      \ -r \"track.yaml\" | xargs check for sprint_id field\n  Add where missing\n\
      \nPattern: Missing 'title' in sprint.yaml\n  Could be: title vs name field confusion\n\
      \  Check if 'name' exists, add 'title' or rename\n\nPattern: Missing 'task_id'\
      \ in sprint.yaml\n  May be: incorrect nesting level\n  Move to correct location\n\
      \nVerification: Reduced critical count from 47 to 0\n\nTask 3: Fix field hierarchy\
      \ issues (6 hours)\n--------------------------------------------\nFix 373 high\
      \ severity issues:\n\nCommon patterns:\n1. Task summary in wrong location\n\
      2. Progress fields at wrong level\n3. Dependency structure mismatch\n4. Metadata\
      \ nesting incorrect\n\nStrategy:\n- Group by error pattern\n- Create fix template\
      \ per pattern\n- Batch apply with validation\n- Manual review edge cases\n\n\
      Verification: Reduced high count from 373 to 0\n\nTask 4: Create schema migration\
      \ script (3 hours)\n------------------------------------------------\nAutomated\
      \ tool for future schema changes:\n\nFeatures:\n1. Detect schema version from\
      \ YAML\n2. Apply migration transformations\n3. Validate before/after\n4. Rollback\
      \ on failure\n5. Dry-run mode\n\nUsage:\n  python scripts/migrate-roadmap-schema.py\
      \ \\\n    --from v2.0 --to v2.1 --dry-run\n\nTask 5: Validate all files pass\
      \ schema (2 hours)\n------------------------------------------------\nRun full\
      \ validation:\n\npython scripts/validate-roadmap-schema.py --strict\n\nSuccess\
      \ criteria:\n- 435/435 files pass (100%)\n- 0 critical issues\n- 0 high issues\n\
      - Document any acceptable warnings\n\nTask 6: Update Pydantic models (2 hours)\n\
      ----------------------------------------\nIf schema reveals model issues:\n\n\
      1. Review failed validations\n2. Determine if YAML wrong or model wrong\n3.\
      \ Update models for backward compatibility\n4. Add optional fields where needed\n\
      5. Document breaking changes\n\nTask 7: Add schema validation to CI/CD (1 hour)\n\
      -----------------------------------------------\nUpdate .github/workflows/roadmap-validation.yml:\n\
      \nAdd blocking step:\n  - name: Schema validation (blocking)\n    run: |\n \
      \     python scripts/validate-roadmap-schema.py --strict\n    # No continue-on-error\
      \ - must pass\n\nSUCCESS CRITERIA\n================\n\n✅ 100% schema validation\
      \ pass rate (435/435)\n✅ 0 critical issues\n✅ 0 high severity issues\n✅ All\
      \ required fields present\n✅ Correct field hierarchy\n✅ Pydantic models load\
      \ all files\n✅ CI/CD blocks schema violations\n✅ Migration script for future\
      \ changes\n✅ Health score increases to 98+/100\n"
