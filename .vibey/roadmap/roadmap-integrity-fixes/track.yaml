    notes: |
      CRITICAL INFRASTRUCTURE TRACK - Foundation for Roadmap Trust

      This track addresses the 34 data integrity issues discovered in the
      2025-11-12 comprehensive audit. The roadmap system currently has:

      CRITICAL ISSUES (13):
      - 4 tracks marked "completed" with 0-26% actual progress
      - 81 phantom tasks claimed complete with no task objects
      - 9 sprints claiming 100% completion with 0 actual tasks

      ERRORS (2):
      - 2 tracks with YAML structure errors preventing load

      WARNINGS (19):
      - 30 declared sprints missing from disk
      - Task count mismatches across multiple sprints

      IMPACT:
      - 52% of tracks (10/19) have integrity issues
      - Cannot trust roadmap completion metrics
      - Automation exists but bypassed by manual edits
      - No validation prevents corruption

      WHY THIS BLOCKS ALL WORK:
      The roadmap is the source of truth for what work is done, in progress,
      and planned. If the roadmap data is corrupted:
      - Cannot determine what's actually been completed
      - Cannot calculate realistic timelines
      - Cannot trust dependency chains
      - Cannot generate accurate project status

      This track MUST be completed before resuming other work to ensure:
      1. All completion claims are backed by actual task data
      2. All status fields accurately reflect progress
      3. All automation is working correctly
      4. Validation prevents future corruption

      SPRINT BREAKDOWN (7 sprints, 24 days):

      Sprint 0: Pre-Audit Preparation (2 days, 6 tasks)
      - Verify backup archive integrity
      - Create checkpoint backup of current state
      - Establish stakeholder approval process
      - Define evidence conflict resolution framework
      - Document rollback procedures
      - Extend forensic audit timeline to realistic 7 days
      QA-driven preparation sprint ensuring safe audit work

      Sprint 1: Tooling & Algorithm Development (3 days, 5 tasks)
      - Design commit-to-task mapping algorithm (85%+ accuracy)
      - Implement backup/rollback automation
      - Create YAML editing safeguards with validation
      - Optimize validation performance (<10s for full roadmap)
      - Enhance error handling for edge cases
      Foundational tooling for safe, efficient forensic work

      Sprint 2: Comprehensive Forensic Audit (7 days, 13 tasks)
      - Forensic audit of 10 flagged tracks (8-step methodology)
      - Git history analysis with commit backfilling
      - Backup archive comparison and migration verification
      - Codebase, documentation, and test suite audits
      - Cross-reference analysis (YAML vs actual evidence)
      - Standards & modernization audit (legacy system detection)
      Evidence-based determination of actual completion status

      Sprint 3: Critical Status & Data Fixes (2 days, 7 tasks)
      - Fix 4 tracks marked completed with minimal progress
      - Reset phantom completion claims (81 tasks)
      - Recalculate all progress from actual data
      - Verify automation is working
      Requires stakeholder approval gate before implementation

      Sprint 4: Phantom Task Data Cleanup (3 days, 5 tasks)
      - Investigate standards-system work claims
      - Investigate testing-system work claims
      - Either create proper task objects or remove claims
      - Document what work was actually done

      Sprint 5: Structural Repairs & Load Error Fixes (3 days, 6 tasks)
      - Fix interface-unification load error
      - Fix platform-context-management load error
      - Clean up missing sprint declarations
      - Verify hierarchical structure consistency

      Sprint 6: Validation System & Prevention (4 days, 8 tasks)
      - Implement `vibey roadmap validate` command
      - Add pre-commit validation hooks
      - Add CI/CD validation pipeline
      - Implement audit trail for status changes
      - Document validation standards

      SUCCESS CRITERIA:
      - Zero critical issues in follow-up audit
      - All tracks loadable without errors
      - All status fields match actual progress
      - All declared sprints exist on disk
      - Validation catching issues before commit
      - Audit trail tracking all modifications

      TIMELINE:
      Start: Immediately
      Duration: 24 days (5 weeks with buffer)
      Priority: CRITICAL (blocks all other work)

      QA REVIEW INTEGRATION:
      This track incorporates critical gaps identified by parallel QA review:
      - Sprint 0 & 1 added as preparation phases (5 days)
      - Sprint 2 timeline extended from 4 to 7 days (realistic scope)
      - Stakeholder approval gate added before status corrections
      - Evidence conflict resolution framework established
      - Backup/rollback automation implemented
      - Commit-to-task mapping algorithm developed

      This is not optional. The roadmap system is the foundation of the
      entire project management system. It must be trustworthy.
