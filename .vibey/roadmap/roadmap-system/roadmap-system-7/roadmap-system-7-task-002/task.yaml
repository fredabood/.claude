  description: 'Add token-based fields to Task, Sprint, and Track models.


    TASK MODEL UPDATES (vibey/roadmap/models/task.py):

    ```python

    # Keep existing time fields for backward compatibility

    estimated_duration: Optional[str] = None

    actual_duration: Optional[float] = None


    # NEW: Token-based sizing

    estimated_tokens: Optional[int] = None  # Planned token usage

    actual_tokens: Optional[int] = None  # Measured token usage

    token_efficiency: Optional[float] = None  # actual/estimated ratio

    size_category: Optional[str] = None  # S/M/L/XL/XXL

    ```


    SPRINT MODEL UPDATES (vibey/roadmap/models/sprint.py):

    ```python

    # NEW: Aggregated token metrics

    estimated_tokens: Optional[int] = None  # Sum of task estimates

    actual_tokens: Optional[int] = None  # Sum of actual usage

    token_budget: Optional[int] = None  # Max tokens allocated

    token_burn_rate: Optional[float] = None  # Tokens consumed per day

    tokens_remaining: Optional[int] = None  # budget - actual

    ```


    TRACK MODEL UPDATES (vibey/roadmap/models/track.py):

    ```python

    # NEW: Track-level token tracking

    estimated_tokens: Optional[int] = None  # Total across all sprints

    actual_tokens: Optional[int] = None  # Cumulative actual usage

    token_budget: Optional[int] = None  # Total budget for track

    ```


    IMPLEMENTATION STEPS:

    1. Update Task dataclass

    2. Update Sprint dataclass

    3. Update Track dataclass

    4. Update YAML dumper to serialize new fields

    5. Update YAML loader to deserialize new fields

    6. Maintain backward compatibility (old files without token fields)

    7. Update schema validation

    8. Add field documentation


    TESTING:

    - Load/save tasks with token fields

    - Load old tasks without token fields

    - Validate token field types and ranges

    - Test aggregation (sprint tokens = sum of task tokens)

    '
