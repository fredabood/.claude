  description: "Migrate all 435 existing YAML files to include token-based estimates.\n\
    \nCREATE: scripts/migrate-to-token-estimates.py\n\nMIGRATION STRATEGY:\n\nFor\
    \ completed tasks:\n1. Analyze completion context if available\n2. Calculate actual\
    \ tokens from session logs\n3. Set estimated_tokens = actual_tokens (retroactive)\n\
    4. Calculate token_efficiency = 1.0\n5. Assign size_category based on actual tokens\n\
    \nFor pending tasks:\n1. Estimate based on:\n   - Description length and complexity\n\
    \   - Task type historical averages\n   - Complexity field if present\n   - Dependencies\
    \ and blockers\n2. Assign size_category\n3. Set estimated_tokens\n4. Leave actual_tokens\
    \ empty\n\nFor all tasks:\n1. Keep existing time fields (backward compatibility)\n\
    2. Add new token fields\n3. Validate updated YAML\n4. Create migration report\n\
    \nMIGRATION PROCESS:\n```python\ndef migrate_task(task_path: Path) -> bool:\n\
    \    task = load_task(task_path)\n    \n    if task.status == 'completed':\n \
    \       # Retroactive calculation\n        task.actual_tokens = analyze_completion(task)\n\
    \        task.estimated_tokens = task.actual_tokens\n        task.token_efficiency\
    \ = 1.0\n    else:\n        # Estimate for pending\n        estimator = TokenEstimator()\n\
    \        task.estimated_tokens = estimator.estimate_task(task)\n    \n    task.size_category\
    \ = categorize_size(task.estimated_tokens)\n    save_task(task, task_path)\n \
    \   return True\n```\n\nSCOPE:\n- 435 YAML files total\n- 20 tracks\n- 51 sprints\n\
    - 364 tasks\n\nDRY-RUN MODE:\n- Test migration without writing files\n- Generate\
    \ preview report\n- Validate all estimates reasonable\n- Check for outliers\n\n\
    VALIDATION:\n- All files load successfully\n- Token estimates within reasonable\
    \ ranges\n- Size categories distributed properly\n- No data loss (all existing\
    \ fields preserved)\n"
