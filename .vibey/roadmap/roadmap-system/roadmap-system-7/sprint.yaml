    rationale: 'TOKEN-BASED EFFORT ESTIMATION - Created 2025-11-20


      CONTEXT: Current roadmap uses time-based effort estimates

      - Tasks: "estimated_duration: 2 hours"

      - Sprints: "estimated_duration: 2 weeks"

      - Tracks: "estimated_duration: 11 weeks"


      PROBLEM: Time-based estimates don''t reflect AI-assisted development

      1. Token usage is better predictor of effort than wall time

      2. Same task may take 5 minutes or 5 hours depending on context window

      3. Cannot compare efficiency across different sessions

      4. No way to budget token usage across sprints

      5. Actual vs estimated duration meaningless without token context


      EVIDENCE:

      - Sprint 7 (roadmap-integrity-fixes): 13 tasks, ~100K tokens actual

      - Sprint 8 (roadmap-integrity-fixes): 7 tasks, 120K tokens so far (incomplete)

      - Token usage varies wildly based on context, errors, iterations

      - Current "2 hour" estimates provide no useful planning data


      BENEFITS OF TOKEN-BASED SIZING:

      1. **Predictability**: Tokens correlate with actual effort

      2. **Budgeting**: Can allocate token budgets per sprint/track

      3. **Efficiency**: Track tokens/task over time to measure improvement

      4. **Planning**: Know if sprint fits in 200K token limit

      5. **Cost**: Direct correlation with API costs


      PROPOSED SIZING:

      - Small: <10K tokens

      - Medium: 10K-30K tokens

      - Large: 30K-75K tokens

      - X-Large: 75K-150K tokens

      - XX-Large: 150K+ tokens (split into multiple tasks)


      METRICS TO TRACK:

      - estimated_tokens: int (planned token usage)

      - actual_tokens: int (measured token usage)

      - token_efficiency: float (actual/estimated ratio)

      - tokens_per_hour: int (productivity metric)


      SPRINT GOAL: Replace time-based estimates with token-based sizing


      This sprint modernizes effort estimation to align with AI-assisted

      development reality, enabling better planning, budgeting, and efficiency

      tracking across the roadmap system.'
