  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-12-04T00:00:00+00:00'
    notes: "Sprint 1: Jira Core Integration & JiraSemanticLayer\n\nDESIGN REFERENCE:\
      \ sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\nCODE REFERENCE: sqlite-backend-6/context/sample_code/models/semantic_layer.py\n\
      \nGOAL: Implement JiraSemanticLayer per the pluggable semantic layer architecture.\n\
      This replaces ad-hoc Jira mapping with a proper semantic layer that integrates\n\
      with Layers 0-2 (Completable, Ticket, HierarchicalTicket).\n\nKEY ARCHITECTURAL\
      \ POINTS:\n\n1. JiraSemanticLayer extends SemanticLayer ABC\n   - Defines Jira-specific\
      \ ticket types and hierarchy\n   - Maps Jira statuses to canonical TicketStatus\n\
      \   - Provides type-specific field definitions\n\n2. Jira tickets extend HierarchicalTicket\
      \ (Layer 2)\n   - Share all Layer 0-2 functionality\n   - Add Jira-specific\
      \ fields (issue_key, story_points, etc.)\n   - Store in completables table with\
      \ semantic_layer='jira:PROJ'\n\n3. External ID tracking\n   - external_id stores\
      \ Jira issue key (PROJ-123)\n   - Internal ULID remains primary key\n   - Enables\
      \ bidirectional sync\n\n4. Import writes YAML with semantic layer header:\n\
      \   ```yaml\n   meta:\n     semantic_layer: jira:PROJ\n     schema_version:\
      \ \"2.0\"\n   issue:\n     id: 01JD4EXAMPLE\n     external_id: PROJ-123\n  \
      \   ...\n   ```\n\nJira API Reference:\n- REST API v3: https://developer.atlassian.com/cloud/jira/platform/rest/v3/\n\
      - Agile API: https://developer.atlassian.com/cloud/jira/software/rest/\n"
