  - id: atlassian-integration-1-task-001
    name: Implement JiraSemanticLayer class
    status: not_started
    priority: critical
    estimated_hours: 16
    assigned_agent: architecture-agent
    description: "Implement JiraSemanticLayer per unified ticket architecture.\n\n\
      DESIGN REFERENCE: sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\n\
      CODE REFERENCE: sqlite-backend-6/context/sample_code/models/semantic_layer.py\n\
      \nDELIVERABLES:\n\n1. JiraSemanticLayer class (extends SemanticLayer ABC):\n\
      \   - name: \"jira:{project_key}\"\n   - ticket_types: [\"project\", \"epic\"\
      , \"sprint\", \"issue\", \"subtask\"]\n   - hierarchy: {\"issue\": \"sprint\"\
      \ or \"epic\", \"subtask\": \"issue\", ...}\n   - get_ticket_class(type) → JiraProject,\
      \ JiraEpic, etc.\n   - get_type_fields(type) → Jira-specific field definitions\n\
      \   - map_status_to_canonical(type, jira_status) → TicketStatus\n   - map_status_from_canonical(type,\
      \ status) → Jira status string\n\n2. JiraProjectConfig class:\n   - project_key,\
      \ project_name\n   - has_epics, has_sprints (board configuration)\n   - status_map:\
      \ Dict[str, str] (Jira status → canonical)\n   - custom_fields: Dict[str, FieldConfig]\n\
      \n3. Jira ticket classes (all extend HierarchicalTicket):\n   - JiraProject:\
      \ project_key, project_type, lead\n   - JiraEpic: epic_key, epic_color\n   -\
      \ JiraSprint: sprint_id, board_id, start_date, end_date, goal\n   - JiraIssue:\
      \ issue_key, issue_type, story_points, components[], labels[], custom_fields\n\
      \   - JiraSubtask: issue_key, parent_issue_key\n\n4. JiraIssueType enum:\n \
      \  - STORY, BUG, TASK, EPIC, SUBTASK, SPIKE, FEATURE, IMPROVEMENT\n\n5. Registration:\n\
      \   - SemanticLayerRegistry.register(jira_layer)\n   - Configuration to set\
      \ as default\n"
