  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-12-04T00:00:00+00:00'
    notes: "Sprint 2: Jira Bidirectional Sync using Semantic Layer\n\nDESIGN REFERENCE:\
      \ sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\n\nKEY INTEGRATION\
      \ POINTS:\n\n1. STATUS MAPPING VIA SEMANTIC LAYER:\n   On pull from Jira:\n\
      \   ```python\n   jira_status = issue['fields']['status']['name']  # \"In Review\"\
      \n   canonical = jira_layer.map_status_to_canonical(\"issue\", jira_status)\n\
      \   # → TicketStatus.IN_PROGRESS\n   ```\n\n   On push to Jira:\n   ```python\n\
      \   canonical = ticket.status  # TicketStatus.COMPLETED\n   jira_status = jira_layer.map_status_from_canonical(\"\
      issue\", canonical)\n   # → \"Done\"\n   ```\n\n2. EXTERNAL_STATUS FOR ROUND-TRIP:\n\
      \   - Preserve original Jira status in external_status field\n   - If status\
      \ unchanged locally, use external_status on push back\n   - If status changed\
      \ locally, map from canonical\n\n3. SYNC STATE TRACKING:\n   - Use content hash\
      \ for change detection\n   - External timestamps from Jira API\n   - Internal\
      \ timestamps from Ticket fields\n\n4. CONFLICT DETECTION:\n   - Compare last_sync\
      \ timestamp with both sides' modification times\n   - If both modified since\
      \ sync → conflict\n   - Conflict resolution strategies: Jira-wins, Vibey-wins,\
      \ manual\n\nSYNC MODES:\n1. PULL-ONLY: Jira is source of truth, Vibey is read-only\n\
      2. PUSH-ONLY: Vibey is source of truth, Jira reflects\n3. BIDIRECTIONAL: Both\
      \ sides can change, conflicts resolved\n\nFor teams using Jira, PULL-ONLY is\
      \ recommended.\nFor solo devs wanting Jira visibility, PUSH-ONLY works.\nBIDIRECTIONAL\
      \ is complex but powerful.\n"
