  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-12-04T00:00:00+00:00'
    notes: "Sprint 3: Confluence Documentation as Artifacts\n\nDESIGN REFERENCE: sqlite-backend-6/context/architecture/03-ARTIFACT-SYSTEM.md\n\
      \nARCHITECTURAL INTEGRATION:\n\n1. CONFLUENCE PAGES AS ARTIFACTS:\n   Confluence\
      \ pages can be tracked as Artifact entities:\n   ```yaml\n   artifact:\n   \
      \  id: 01JD4CONFLUENCE\n     artifact_type: DOCUMENTATION\n     paths: [\"docs/api-guide.md\"\
      ]\n     provenance:\n       type: EXTERNAL\n       source: \"confluence:SPACE/page-id\"\
      \n     documents_artifact_id: 01JD4API_MODULE  # What it documents\n   ```\n\
      \n2. STALENESS DETECTION:\n   If source artifact (e.g., API code) changes:\n\
      \   - documented_source_hash will differ from current hash\n   - is_stale property\
      \ returns true\n   - Confluence page flagged for update\n\n3. BIDIRECTIONAL\
      \ SYNC CONSIDERATIONS:\n   - Confluence page content hash tracked\n   - Local\
      \ markdown modifications detected\n   - Sync respects same conflict resolution\
      \ as Jira\n\nKey challenge: Confluence storage format is complex XHTML.\nNeed\
      \ high-fidelity conversion to/from Markdown.\n\nConfluence API Reference:\n\
      - REST API: https://developer.atlassian.com/cloud/confluence/rest/v2/\n\nConversion\
      \ considerations:\n- Confluence macros have no Markdown equivalent\n- Some formatting\
      \ will be lossy\n- Round-trip conversion should preserve meaning\n"
  slug: atlassian-integration-3
