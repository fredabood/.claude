  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-12-04T00:00:00+00:00'
    notes: "Sprint 4: Unified Atlassian Experience & SemanticLayerRegistry\n\nDESIGN\
      \ REFERENCE: sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\n\nKEY\
      \ ARCHITECTURAL DELIVERABLES:\n\n1. SEMANTIC LAYER CONFIGURATION:\n   ```yaml\n\
      \   # .vibey/config/semantic.yaml\n   semantic_layer:\n     provider: jira\n\
      \n     jira:\n       site: company.atlassian.net\n       project_key: PROJ\n\
      \n       type_mapping:\n         project: roadmap\n         epic: tracks\n \
      \        sprint: sprints\n         issue: tasks\n         subtask: tasks\n\n\
      \       status_map:\n         \"To Do\": not_started\n         \"In Progress\"\
      : in_progress\n         \"Done\": completed\n         \"Released\": deployed\n\
      \n       field_map:\n         story_points: estimated_tokens\n   ```\n\n2. SEMANTIC\
      \ LAYER REGISTRY INTEGRATION:\n   ```python\n   # On startup with Jira config\n\
      \   jira_layer = JiraSemanticLayer(JiraProjectConfig(...))\n   SemanticLayerRegistry.register(jira_layer)\n\
      \   SemanticLayerRegistry.set_default(\"jira:PROJ\")\n   ```\n\n3. MIXED SEMANTIC\
      \ LAYERS (future):\n   Support for multiple semantic layers in same roadmap:\n\
      \   - Local Vibey tracks for internal work\n   - Synced Jira tracks for external\
      \ collaboration\n   - Coexisting with different semantic_layer values\n\nFocus\
      \ areas:\n1. User experience - smooth CLI, good errors\n2. Cross-product integration\
      \ - Jira + Confluence together\n3. Enterprise features - bulk ops, notifications\n\
      4. Documentation - make it easy to adopt\n\nAfter this sprint, teams can:\n\
      - Manage Vibey roadmap from Jira\n- Keep Confluence docs in sync with repo\n\
      - Get full audit trail in Atlassian\n- Collaborate with non-technical stakeholders\n"
