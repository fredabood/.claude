  description: 'Sprint 6 designed a comprehensive unified ticket architecture with
    criteria-based

    completion. However, the actual integration was never completed. This sprint

    implements the full design:


    1. AUDIT: Compare Sprint 6 design documents against current codebase

    2. SCHEMA: Add criteria and criterion_targets tables

    3. SERIALIZATION: Update YAML/SQL loaders/dumpers for criteria

    4. MIGRATION: Convert legacy dependencies to CompletableTarget criteria

    5. ENFORCEMENT: Implement can_transition_to() checks throughout system

    6. GIT HOOKS: Add verify_completion_claims() for commit validation


    Reference: sqlite-backend-6/context/architecture/

    '
  goal: Fully implement the unified ticket architecture designed in Sprint 6
  success_criteria:
  - All criteria are stored in database, not JSON columns
  - Dependencies use CompletableTarget with blocks_transition_to=IN_PROGRESS
  - Status changes require can_transition_to() validation
  - Pre-commit hook blocks completion claims if criteria not met
  - Round-trip validation passes for criteria
  - Quality gates converted to ThresholdTarget criteria with score comparison
  - Standards cascade via Requirements with inherit_mode (INHERIT/OVERRIDE/SKIP)
  - Progress computed automatically from met/unmet criteria per transition type
  risks:
  - Breaking changes to existing YAML format
  - Migration complexity for existing roadmaps
  - Performance impact of criteria evaluation
  notes: 'KEY ARCHITECTURE REFERENCES:

