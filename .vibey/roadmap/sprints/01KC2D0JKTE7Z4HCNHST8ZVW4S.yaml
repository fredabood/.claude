    description: Migration script for directory restructuring
  description: 'Migrate from nested directory structure (track/sprint/task) to flat
    structure

    (tracks/, sprints/, tasks/) as designed in sqlite-backend-6/context/architecture/09-DESIGN-DECISIONS.md.


    CURRENT STRUCTURE (1,300+ directories):

    .vibey/roadmap/

    ├── track-id/

    │   ├── track.yaml

    │   └── sprint-id/

    │       ├── sprint.yaml

    │       └── task-id/

    │           └── task.yaml


    TARGET STRUCTURE (~30 directories):

    .vibey/roadmap/

    ├── roadmap.yaml

    ├── tracks/

    │   └── {track-id}.yaml

    ├── sprints/

    │   └── {sprint-id}.yaml

    ├── tasks/

    │   └── {task-id}.yaml

    ├── artifacts/

    └── context/


    Benefits:

    - 98% reduction in directories

    - Max depth 4 levels (from 10+)

    - Simpler navigation and tooling

    - Better git performance

    '
  goal: Flatten roadmap directory structure from nested to flat organization
  success_criteria:
  - All track.yaml files moved to tracks/ directory
  - All sprint.yaml files moved to sprints/ directory
  - All task.yaml files moved to tasks/ directory
  - Context files consolidated to context/ directory
  - All YAML file references updated
  - Round-trip validation passes
  - Git history preserved via moves (not delete+create)
  risks:
  - Git history may be disrupted if using delete+create instead of git mv
  - References between files may break if not updated atomically
