sprint:
  id: 01KC2D0JKTE7Z4HCNHST8ZVW50
  track_id: unified-architecture-migration
  roadmap_id: vibey-framework-v2
  name: Database Schema Migration
  description: 'Migrate from separate tables (roadmaps, tracks, sprints, tasks) to
    unified schema

    (completables, criteria) as designed in sqlite-backend-6/context/architecture/05-DATABASE-SCHEMA.md.


    CURRENT SCHEMA:

    - roadmaps table

    - tracks table

    - sprints table

    - tasks table

    - Various JSON blobs for dependencies, blockers, etc.


    TARGET SCHEMA:

    - completables table (single table inheritance for all ticket types)

    - criteria table (unified blocking with polymorphic targets)

    - artifacts table (first-class artifact entities)

    - Views for type-specific queries (v_tracks, v_sprints, v_tasks)


    Benefits:

    - Single table for all completable entities

    - Unified criteria-based blocking (replaces blocked_by, depends_on, etc.)

    - Polymorphic targets for different criterion types

    - First-class artifact support

    '
