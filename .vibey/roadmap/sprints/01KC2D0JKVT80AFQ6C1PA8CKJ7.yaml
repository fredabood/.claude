  name: ULID Identity System
  description: 'Implement ULID-based identity system as designed in sqlite-backend-6/context/architecture/04-IDENTITY-SYSTEM.md.


    CURRENT STATE:

    - Slug-based IDs: sqlite-backend-6-task-004

    - ID encodes hierarchy: track-sprint-task

    - Renaming requires updating all references


    TARGET STATE:

    - ULID identifiers: 01HXYZ123ABC456DEF

    - Separate sequence field for ordering

    - Separate slug field for human-readable paths

    - .id files mapping slug ↔ ULID

    - Renaming only updates slug, not ULID


    Benefits:

    - Immutable identity (ULID never changes)

    - Rename without breaking references

    - Reorder without ID changes

    - Better conflict handling in distributed scenarios

    '
