  description: "Migrate all YAML files from v1 format to v2 format (criteria-based).\n\
    \nV1 FORMAT (current):\n```yaml\ntask:\n  id: sqlite-backend-6-task-004\n  blocked:\
    \ false\n  blocked_by:\n    - target_id: sqlite-backend-6-task-003\n  depends_on:\n\
    \    - blocker_id: sqlite-backend-6-task-002\n  deliverables:\n    - path: vibey/roadmap/models/ticket.py\n\
    ```\n\nV2 FORMAT (target):\n```yaml\ntask:\n  id: 01HXYZ123ABC456DEF789GHJ\n \
    \ slug: sqlite-backend-6-task-004\n  sequence: 4\n  parent_ref: 01HXYZ987ZYX654CBA321MLK\n\
    \  criteria:\n    - id: dep-task-003\n      description: Task 003 must complete\
    \ before starting\n      blocks_transition_to: in_progress\n      target:\n  \
    \      type: completable\n        completable_id: 01HXYZ...\n        required_status:\
    \ completed\n    - id: del-ticket-py\n      description: Ticket model must be\
    \ implemented\n      blocks_transition_to: completed\n      target:\n        type:\
    \ file_exists\n        path: vibey/roadmap/models/ticket.py\n```\n\nBenefits:\n\
    - Unified blocking model (criteria)\n- Computed blocked field (no longer stored)\n\
    - Polymorphic targets for different criterion types\n- Compatible with unified\
    \ ticket architecture\n"
  goal: Convert all YAML files to v2 criteria-based format
