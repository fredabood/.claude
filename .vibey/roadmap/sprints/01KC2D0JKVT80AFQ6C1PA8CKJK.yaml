sprint:
  id: 01KC2D0JKVT80AFQ6C1PA8CKJK
  track_id: unified-architecture-migration
  roadmap_id: vibey-framework-v2
  name: Operations Layer Migration
  description: 'Migrate all operations to use new Pydantic models and criteria-based
    blocking.


    CURRENT STATE:

    - Operations use legacy dataclass models (Roadmap, Track, Sprint, Task)

    - Blocking checks scattered across multiple functions

    - Status transitions not centralized


    TARGET STATE:

    - Operations use new Pydantic models (RoadmapTicket, TrackTicket, etc.)

    - All blocking via can_transition_to() on Completable

    - All status transitions through Ticket.start()/complete()

    - Criteria-based progress calculation


    This sprint completes the unified architecture migration by making

    the operations layer use all the infrastructure built in Sprints 1-4.

    '
  status: in_progress
  created: '2025-12-07T15:00:00+00:00'
