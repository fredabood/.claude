  - id: user-journey-audit-2-task-001
    name: Design CLI reference auto-generation architecture
    status: not_started
    priority: critical
    estimated_hours: 6
    assigned_agent: architecture-agent
    description: 'Design the auto-generation system:

      - How to introspect Click commands programmatically

      - Output format (Markdown, structured data, both?)

      - Template system for consistent formatting

      - Handling of examples and usage patterns

      - Version tracking and change detection

      - Integration with build/CI pipeline

      '
  - id: user-journey-audit-2-task-002
    name: Build CLI introspection module
    status: not_started
    priority: critical
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: 'Create module to extract CLI metadata:

      - Walk Click command tree

      - Extract command names, help text

      - Extract options, flags, arguments

      - Extract types, defaults, required status

      - Extract examples from docstrings

      - Output as structured data (JSON/YAML)

      '
  - id: user-journey-audit-2-task-003
    name: Build CLI reference Markdown generator
    status: not_started
    priority: critical
    estimated_hours: 8
    assigned_agent: backend-engineer
    description: 'Create Markdown generator from CLI metadata:

      - Jinja2 templates for reference format

      - Command hierarchy navigation

      - Option/flag tables

      - Example code blocks

      - Cross-references between commands

      - Table of contents generation

      '
  - id: user-journey-audit-2-task-004
    name: Implement drift detection
    status: not_started
    priority: high
    estimated_hours: 6
    assigned_agent: backend-engineer
    description: 'Detect when CLI changes without doc regeneration:

      - Hash CLI metadata on generation

      - Compare current CLI to stored hash

      - CI check that fails if drift detected

      - Clear error message showing what changed

      - `vibey docs check` command

      '
  - id: user-journey-audit-2-task-005
    name: Implement vibey docs generate cli command
    status: not_started
    priority: critical
    estimated_hours: 4
    assigned_agent: backend-engineer
    description: 'Add CLI command for doc generation:

      - `vibey docs generate cli` - generate CLI reference

      - `vibey docs generate cli --check` - verify up to date

      - `vibey docs generate cli --output PATH` - custom output

      - Integrate with existing CLI structure

      '
  - id: user-journey-audit-2-task-006
    name: Generate initial CLI reference guide
    status: not_started
    priority: critical
    estimated_hours: 4
    assigned_agent: backend-engineer
    description: 'Run the generator to produce CLI reference:

      - Generate complete CLI reference

      - Verify 100% command coverage

      - Review output for quality

      - Place in docs/reference/CLI_REFERENCE.md

      - Commit as baseline

      '
  - id: user-journey-audit-2-task-007
    name: Add CI integration for CLI reference freshness
    status: not_started
    priority: high
    estimated_hours: 4
    assigned_agent: backend-engineer
    description: 'Integrate into CI/CD pipeline:

      - Pre-commit hook option

      - GitHub Actions check

      - Fail PR if CLI reference is stale

      - Auto-generate in CI (optional)

      - Document CI integration

      '
