  description: |
    Add token estimation to the unified ticket architecture:

    Layer 1 (Ticket):
    - input_tokens: Optional[TokenEstimate] - Local input estimate
    - output_tokens: Optional[TokenEstimate] - Local output estimate

    Layer 2 (HierarchicalTicket):
    - input_tokens_aggregated: TokenEstimate - Sum from descendants
    - output_tokens_aggregated: TokenEstimate - Sum from descendants

    Parent tickets aggregate child tokens automatically. Budgets are
    set on parent tickets to constrain total child consumption.
  goal: Add token estimation fields using unified ticket architecture
