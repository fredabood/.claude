  description: |
    Build the task execution engine:

    1. TaskContextBuilder: Assemble context for task execution
       - Load task description and criteria
       - Load relevant files (from task plan)
       - Include parent ticket context (sprint goals, etc.)
       - Build system prompt with task instructions

    2. TaskExecutor: Execute task via agent subprocess
       - Spawn Claude Code agent with task context
       - Stream output for monitoring
       - Capture result (success, failure, blocked)
       - Record token usage

    3. ExecutionResult: Capture execution outcome
       - Success/failure/blocked status
       - Files modified
       - Commits created
       - Tokens consumed
       - Error messages if failed
  goal: Implement task execution via agent subprocess
