  description: |
    Add progress monitoring and error handling:

    1. Progress Display:
       - Show current task being executed
       - Display overall progress (X/Y tasks)
       - Token usage summary
       - Estimated time remaining

    2. Logging:
       - Log each task start/complete/fail
       - Record to activity log (JSONL)
       - Include execution metadata
       - Support log levels (debug, info, warn, error)

    3. Error Recovery:
       - Catch and log execution errors
       - Mark task as blocked with error reason
       - Option to retry failed tasks
       - Continue to next task on failure
  goal: Implement progress monitoring and error recovery
  success_criteria:
  - Progress visible during execution
