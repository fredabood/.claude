  description: |
    Add CLI commands for implementation mode:

    1. Main Command:
       vibey implement [OPTIONS]

       Options:
       --track <id>        Only tasks in this track
       --sprint <id>       Only tasks in this sprint
       --max-tasks <n>     Stop after N tasks
       --max-tokens <n>    Stop after N tokens
       --dry-run           Show what would run without executing
       --background        Run as background process

    2. Control Commands:
       vibey implement status   Show current execution state
       vibey implement pause    Pause execution after current task
       vibey implement resume   Resume paused execution
       vibey implement stop     Stop execution immediately

    3. Configuration:
       .vibey/config/implement.yaml:
       ```yaml
       defaults:
         max_tasks_per_session: 10
         max_tokens_per_session: 100000
         retry_failed_tasks: false
         approval_required: [critical, complex]
       ```
  goal: Add CLI commands for controlling implementation mode
  success_criteria:
  - vibey implement starts execution loop
  - Control commands work correctly
  - Configuration is respected
