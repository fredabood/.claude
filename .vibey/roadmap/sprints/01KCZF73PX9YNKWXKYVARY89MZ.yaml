  description: "Add CLI commands for implementation mode:\n\n1. Main Command:\n  \
    \ vibey implement [OPTIONS]\n\n   Options:\n   --track <id>        Only tasks\
    \ in this track\n   --sprint <id>       Only tasks in this sprint\n   --max-tasks\
    \ <n>     Stop after N tasks\n   --max-tokens <n>    Stop after N tokens\n   --dry-run\
    \           Show what would run without executing\n   --background        Run\
    \ as background process\n\n2. Control Commands:\n   vibey implement status   Show\
    \ current execution state\n   vibey implement pause    Pause execution after current\
    \ task\n   vibey implement resume   Resume paused execution\n   vibey implement\
    \ stop     Stop execution immediately\n\n3. Configuration:\n   .vibey/config/implement.yaml:\n\
    \   ```yaml\n   defaults:\n     max_tasks_per_session: 10\n     max_tokens_per_session:\
    \ 100000\n     retry_failed_tasks: false\n     approval_required: [critical, complex]\n\
    \   ```\n"
