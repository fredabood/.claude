  description: |
    Add safety guardrails for autonomous execution:

    1. Token Budget Enforcement:
       - Check remaining budget before each task
       - Stop execution when budget exhausted
       - Support per-task and per-session budgets
       - Integration with token estimation system

    2. Checkpoint/Rollback:
       - Create git checkpoint before each task
       - Tag checkpoint with task ID
       - Option to rollback failed tasks
       - Preserve rollback history

    3. Human Approval Gates:
       - Configurable approval requirements
       - Pause for approval on critical tasks
       - Notification system (terminal, email, webhook)
       - Timeout handling for approvals

    Configuration:
    ```yaml
    safety:
      require_approval:
        - complexity: [complex, very_complex]
        - priority: critical
        - task_type: infrastructure
      checkpoint:
        enabled: true
        auto_rollback_on_failure: false
      budget:
        per_session: 100000
        per_task: 25000
    ```
  goal: Implement safety guardrails for autonomous execution
  success_criteria:
  - Budget limits are enforced
  - Checkpoints created before each task
  - Approval gates pause execution correctly
