  description: "Add safety guardrails for autonomous execution:\n\n1. Token Budget\
    \ Enforcement:\n   - Check remaining budget before each task\n   - Stop execution\
    \ when budget exhausted\n   - Support per-task and per-session budgets\n   - Integration\
    \ with token estimation system\n\n2. Checkpoint/Rollback:\n   - Create git checkpoint\
    \ before each task\n   - Tag checkpoint with task ID\n   - Option to rollback\
    \ failed tasks\n   - Preserve rollback history\n\n3. Human Approval Gates:\n \
    \  - Configurable approval requirements\n   - Pause for approval on critical tasks\n\
    \   - Notification system (terminal, email, webhook)\n   - Timeout handling for\
    \ approvals\n\nConfiguration:\n```yaml\nsafety:\n  require_approval:\n    - complexity:\
    \ [complex, very_complex]\n    - priority: critical\n    - task_type: infrastructure\n\
    \  checkpoint:\n    enabled: true\n    auto_rollback_on_failure: false\n  budget:\n\
    \    per_session: 100000\n    per_task: 25000\n```\n"
  goal: Implement safety guardrails for autonomous execution
