  description: "Implement regression prevention to ensure task completion doesn't\
    \ break\npreviously passing criteria:\n\n1. Criterion Dependency Graph:\n   -\
    \ Build graph of all criteria across tickets\n   - Track which criteria depend\
    \ on which code/artifacts\n   - Identify transitive dependencies between tickets\n\
    \n2. Pre-Task Snapshot:\n   - Before starting a task, capture all passing criteria\n\
    \   - Store snapshot with task execution state\n   - Include criteria from current\
    \ task and all dependents\n\n3. Regression Detection:\n   - After task execution,\
    \ re-evaluate all snapshotted criteria\n   - Compare before/after states\n   -\
    \ Flag any criteria that changed from passing to failing\n\n4. Intentional Regression\
    \ Handling:\n   - Allow marking regressions as intentional\n   - Support deprecation\
    \ annotations\n   - Support sunset/legacy criteria flags\n   - Require explicit\
    \ acknowledgment for intentional regressions\n\n5. Completion Gate Integration:\n\
    \   - Block task completion if unacknowledged regressions exist\n   - Provide\
    \ clear error messages about which criteria regressed\n   - Option to force-complete\
    \ with regression acknowledgment\n\nKey principle: A task cannot be marked complete\
    \ if it causes any\npreviously-passing criteria to fail, unless explicitly acknowledged.\n"
  goal: Prevent regressions during autonomous task execution
