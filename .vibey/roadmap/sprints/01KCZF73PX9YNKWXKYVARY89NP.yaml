  description: |
    Implement pre-execution validation to ensure tasks are ready for execution:

    1. Task Plan Verification:
       - Check if task has a comprehensive plan
       - If no plan exists, generate one before execution
       - Save plan to sprint context directory
       - Validate plan covers all acceptance criteria

    2. Roadmap State Verification:
       - Before each task, verify YAML matches SQLite
       - Run `vibey roadmap db status` equivalent check
       - Auto-fix discrepancies or abort with clear error
       - Log any sync issues found

    3. Bug Logging Designation:
       - Configure a designated ticket for logging CLI bugs
       - When bugs are discovered during execution, auto-create child tickets
       - Track bugs found vs bugs fixed during session
       - Support configurable bug logging behavior

    From tested prompts:
    ```
    1) verify the roadmap state is correct and the yaml matches the sqlite database
    2) use CLI to correct any issues
    3) log any CLI new bugs as a child ticket to: [bug_logging_ticket]
    ```
  goal: Ensure tasks are ready and roadmap state is valid before execution
  success_criteria:
  - Tasks without plans get plans generated
  - YAML/SQLite sync verified before each task
  - CLI bugs logged to designated ticket
  risks:
  - Plan generation may consume significant tokens
