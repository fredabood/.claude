    \ bugs found vs bugs fixed during session\n   - Support configurable bug logging\
    \ behavior\n\nFrom tested prompts:\n```\n1) verify the roadmap state is correct\
    \ and the yaml matches the sqlite database\n2) use CLI to correct any issues\n\
    3) log any CLI new bugs as a child ticket to: [bug_logging_ticket]\n```\n"
