  description: |
    Implement context management and documentation capture:

    1. Context Compaction:
       - After each task, compact context to manage token budget
       - Summarize completed work for future reference
       - Preserve essential state for next task
       - Clear transient execution details

    2. Post-Mortem Generation:
       - After each task completion, generate post-mortem
       - Capture what worked, what didn't, lessons learned
       - Record actual vs estimated tokens/time
       - Note any unexpected issues or discoveries

    3. Learning Capture:
       - Save post-mortems to sprint context directory
       - Aggregate learnings across tasks in sprint
       - Update sprint-level documentation
       - Build knowledge base for future executions

    From tested prompts:
    ```
    5) compact your context
    7) save post mortem to appropriate context
    ```

    Context structure:
    ```
    .vibey/roadmap/context/sprints/{sprint-slug}/
    ├── SPRINT_PLAN.md
    ├── tasks/
    │   ├── {task-slug}/
    │   │   ├── TASK_PLAN.md
    │   │   └── POST_MORTEM.md
    │   └── ...
    └── SPRINT_RETROSPECTIVE.md
    ```
  goal: Manage context efficiently and capture learnings
  success_criteria:
  - Context compacted between tasks
  - Post-mortems generated and saved
  - Learnings accessible for future tasks
  risks:
