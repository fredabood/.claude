  description: "Implement parallel execution for independent tasks:\n\n1. Independent\
    \ Task Identification:\n   - Analyze criterion dependency graph\n   - Identify\
    \ tasks with no mutual dependencies\n   - Group tasks that can execute in parallel\n\
    \   - Consider file conflict potential\n\n2. Agent Spawning:\n   - Spawn separate\
    \ Claude Code agents for parallel tasks\n   - Each agent gets isolated context\n\
    \   - Coordinate via shared state file\n   - Handle agent failures gracefully\n\
    \n3. Result Aggregation:\n   - Collect results from parallel agents\n   - Detect\
    \ and resolve conflicts (same file modified)\n   - Merge commits appropriately\n\
    \   - Update roadmap state atomically\n\nFrom tested prompts:\n```\nfor all planned\
    \ and unblocked children in the dependency graph, launch an agent to:\n...\n```\n\
    \nParallel execution model:\n```\nMain Loop\n    │\n    ├─► Agent 1: Task A (no\
    \ dependencies)\n    │       └─► commit, push\n    │\n    ├─► Agent 2: Task B\
    \ (no dependencies)\n    │       └─► commit, push\n    │\n    └─► Wait for all\
    \ agents\n            │\n            └─► Aggregate results, resolve conflicts\n\
    ```\n\nConfiguration:\n```yaml\nimplement:\n  parallel:\n    enabled: true\n \
    \   max_concurrent_agents: 3\n    conflict_resolution: prompt  # prompt, abort,\
    \ merge\n    isolate_git_branches: true\n```\n"
  goal: Execute independent tasks in parallel for faster completion
