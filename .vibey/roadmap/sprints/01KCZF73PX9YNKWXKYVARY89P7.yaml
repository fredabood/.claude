  description: |
    Implement strict content versioning across all 3 stages of ticket implementation:

    Stage 1: PLAN
    - Initial task plan creation
    - Plan revisions during refinement
    - Pre-execution plan snapshot

    Stage 2: EXECUTION
    - Execution state at start
    - Intermediate execution snapshots
    - Execution completion state

    Stage 3: POST-MORTEM
    - Initial post-mortem generation
    - Post-mortem revisions
    - Final archived version

    Version tracking:
    ```
    .vibey/roadmap/versions/{ticket_id}/
    ├── plan/
    │   ├── v1_2025-12-20T10:00:00.yaml
    │   ├── v2_2025-12-20T11:00:00.yaml
    │   └── current -> v2_...
    ├── execution/
    │   ├── start_2025-12-20T12:00:00.yaml
    │   ├── checkpoint_2025-12-20T12:30:00.yaml
    │   └── complete_2025-12-20T13:00:00.yaml
    └── post_mortem/
        ├── v1_2025-12-20T13:30:00.yaml
        └── current -> v1_...
    ```

    Each version includes:
    - Content hash (SHA256)
    - Timestamp
    - Author (agent/user)
    - Parent version reference
    - Change summary
    - Full content snapshot

    Benefits:
    - Complete audit trail
    - Rollback capability
    - Change diffing
    - Compliance/governance
  goal: Maintain complete version history of all ticket content
  success_criteria:
  - Every plan change creates new version
  - Execution states captured at key points
  - Post-mortems versioned on update
  - Versions can be compared/diffed
  - Rollback to any version possible
  risks:
  - Storage growth from version history
  notes: Strict versioning for all 3 implementation stages
