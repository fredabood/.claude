  description: "Implement strict content versioning across all 3 stages of ticket\
    \ implementation:\n\nStage 1: PLAN\n- Initial task plan creation\n- Plan revisions\
    \ during refinement\n- Pre-execution plan snapshot\n\nStage 2: EXECUTION\n- Execution\
    \ state at start\n- Intermediate execution snapshots\n- Execution completion state\n\
    \nStage 3: POST-MORTEM\n- Initial post-mortem generation\n- Post-mortem revisions\n\
    - Final archived version\n\nVersion tracking:\n```\n.vibey/roadmap/versions/{ticket_id}/\n\
    ├── plan/\n│   ├── v1_2025-12-20T10:00:00.yaml\n│   ├── v2_2025-12-20T11:00:00.yaml\n\
    │   └── current -> v2_...\n├── execution/\n│   ├── start_2025-12-20T12:00:00.yaml\n\
    │   ├── checkpoint_2025-12-20T12:30:00.yaml\n│   └── complete_2025-12-20T13:00:00.yaml\n\
    └── post_mortem/\n    ├── v1_2025-12-20T13:30:00.yaml\n    └── current -> v1_...\n\
    ```\n\nEach version includes:\n- Content hash (SHA256)\n- Timestamp\n- Author\
    \ (agent/user)\n- Parent version reference\n- Change summary\n- Full content snapshot\n\
    \nBenefits:\n- Complete audit trail\n- Rollback capability\n- Change diffing\n\
    - Compliance/governance\n"
