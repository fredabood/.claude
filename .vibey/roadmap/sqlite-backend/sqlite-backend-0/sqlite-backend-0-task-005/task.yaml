  task_type: development
  title: "Design YAML synchronization strategy"
  description: |
    Design the bidirectional sync between SQLite and YAML:
    - DB to YAML dump: Deterministic output (sorted keys, consistent formatting)
    - YAML to DB rebuild: Parse all YAML files into DB
    - Conflict detection: Identify YAML changes not in DB
    - Merge strategy: How to handle external YAML edits
    - Hook integration points: When to dump/rebuild
    - Partial sync: Only sync changed entities
