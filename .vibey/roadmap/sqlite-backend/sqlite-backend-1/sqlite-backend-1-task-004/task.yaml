    - entity_deliverables: link_deliverable(), unlink_deliverable()
    - entity_commits: link_commit(), unlink_commit()

    Quality gates (quality_gates):
    - add_gate(), update_gate(), remove_gate(), list_gates()
    - Polymorphic: owner_type = 'track' or 'sprint'

    Query helpers:
    - get_dependency_chain(entity_id) - recursive CTE for transitive deps
    - detect_circular_dependencies() - cycle detection
