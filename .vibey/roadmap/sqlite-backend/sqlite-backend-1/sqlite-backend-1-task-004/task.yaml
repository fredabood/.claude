  title: "Implement relationship and junction table operations"
  description: |
    Implement CRUD for relationship tables in crud/relationships.py:

    Blocking relationships (entity_blocks, entity_blocked_by):
    - add_blocker(), remove_blocker(), get_blockers(), get_blocked_by()
    - Polymorphic: works for task/sprint/track

    Soft dependencies (entity_depends_on):
    - add_dependency(), remove_dependency(), get_dependencies()
