  title: "Implement triggers (40 triggers from design)"
  description: |
    Implement SQLite triggers from 004-triggers-design.md:

    Timestamp triggers (9):
    - Auto-set created_at, started_at, completed_at, updated_at
    - For tasks, sprints, tracks, roadmaps

    Blocked flag triggers (6):
    - Keep blocked column in sync with entity_blocked_by entries
    - Update when blockers added/removed/completed

    Auto-completion triggers (5):
    - Clear blockers when entities complete
    - Auto-start parent when first child starts
    - Auto-complete parent when all children complete

    Summary table triggers (11):
    - Keep denormalized summaries in sync
    - Update track_summaries, sprint_summaries, task_summaries

    Activity log triggers (6):
    - Log significant events to activity_log table
    - Track status changes, completion, blocking

    Validation triggers (3):
    - Prevent completing blocked tasks
    - Prevent invalid status transitions
    - Enforce referential integrity

    Create in vibey/roadmap/database/triggers.py
