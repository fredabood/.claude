  title: "Fix quality_gates schema/model/CLI consistency"
  description: |
    Currently quality_gates has inconsistent support across the codebase:

    | Level  | Schema | Model | YAML Files | CLI |
    |--------|--------|-------|------------|-----|
    | Track  | ✅     | ✅    | ✅         | ❌  |
    | Sprint | ❌     | ❌    | ✅         | ✅  |

    This task fixes the gap by:
    1. Adding quality_gates to sprint.schema.yaml
    2. Adding quality_gates to sprint.py model (Sprint class)
    3. Adding --track-id support to CLI gate command

    This ensures the SQLite database schema matches a consistent Vibey implementation.
