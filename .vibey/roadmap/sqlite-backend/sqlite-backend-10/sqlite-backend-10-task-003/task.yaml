    DOCUMENTATION DELIVERABLES:

    1. MIGRATION GUIDE (docs/roadmap/MIGRATION_GUIDE.md):

       # Migrating to Unified Ticket Architecture

       ## Overview
       The unified ticket architecture introduces hierarchy
       attributes and smart accessors that change how you
       interact with roadmap data.

       ## Breaking Changes
       - Field names: commits → commits_local
       - Progress: Now computed, not stored
       - Standards: Now inherited from ancestors

       ## Migration Steps
       1. Run `vibey roadmap migrate-format --dry-run`
       2. Review changes
       3. Run `vibey roadmap migrate-format`
       4. Commit migrated files

       ## Backward Compatibility
       - Old YAML format still readable
       - Old field names mapped automatically
       - Gradual migration supported

    2. ARCHITECTURE DOCUMENTATION (docs/roadmap/ARCHITECTURE.md):

       # Unified Ticket Architecture

       ## Three-Layer Design
       - Layer 1: Base Ticket (local fields, hierarchy attributes)
       - Layer 2: HierarchicalTicket (smart accessors)
       - Layer 3: Domain Models (semantic-specific fields)

       ## Hierarchy Attributes
       - is_parent: Has children
       - is_child: Has parent
       - is_ultimate_parent: Root node
       - is_ultimate_child: Leaf node
       - is_intermediate: Middle node

       ## Smart Accessors
       - ticket.commits → local if leaf, aggregated if parent
       - ticket.standards → local if root, effective if child
       - ticket.progress → None if leaf, computed if parent

    3. CLI REFERENCE UPDATE (docs/reference/CLI_REFERENCE.md):

       Update command documentation:
       - New inheritance display format
       - New aggregation indicators
       - New hierarchy navigation options

    4. MCP API REFERENCE (docs/reference/MCP_API.md):

