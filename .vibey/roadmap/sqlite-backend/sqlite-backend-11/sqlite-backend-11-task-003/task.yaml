  task_type: development
  title: Add DB dump to pre-commit hook
  description: |
    Modify vibey/operations/git/hooks/pre_commit.py to dump DB to YAML:

    Current behavior:
    - Validates YAML syntax only
    - No database awareness
    - Fails with "no such table: database_state" if DB not initialized

    Required changes:
    1. Check if database is initialized and dirty (is_dirty = 1)
    2. If dirty, dump DB to YAML files using yaml_dumper
    3. Stage the generated YAML files (git add)
    4. Clear is_dirty flag after successful dump
    5. Continue with existing YAML validation

    Flow:
    ```
    pre-commit hook
    ├── Check DB initialized?
    │   └── No: Skip DB operations, validate YAML only
    ├── Check is_dirty?
    │   └── Yes: Dump DB → YAML, stage files
    ├── Validate YAML syntax
    └── Allow/block commit
    ```

    Edge cases:
    - DB not initialized: graceful fallback to YAML-only
    - Dump fails: block commit with clear error
    - Partial dump: rollback and block
