  task_type: development
  title: Add DB rebuild to post-merge hook
  description: |
    Modify vibey/operations/git/hooks/post_merge.py to rebuild DB from YAML:

    Current behavior:
    - Shell script calls `python -m vibey.operations.git.hooks post-merge`
    - Python module exists but may not rebuild DB

    Required changes:
    1. Detect if roadmap YAML files changed in merge
    2. If changed, rebuild DB from YAML using sql_loader
    3. Verify rebuild succeeded (count entities)
    4. Log rebuild statistics

    Flow:
    ```
    post-merge hook
    ├── Check if .vibey/roadmap/ files changed
    │   └── No: Exit early
    ├── Rebuild DB from YAML
    │   ├── Load all tracks, sprints, tasks via yaml_loader
    │   └── Save to DB via sql_dumper
    ├── Verify counts match
    └── Log success/failure
    ```

    Also implement post-checkout with same logic for branch switches.

    Edge cases:
    - Merge conflicts in YAML: warn but don't block
    - DB locked: retry with backoff
    - Partial rebuild: log warning, continue
