  title: 'Validation Steps 2-3: YAML round-trip verification'
  description: |
    Created vibey/roadmap/database/round_trip_validation.py with:
    - dump_database_to_yaml(): Dumps SQLite database to YAML directory structure
    - compare_yaml_directories(): Compares generated vs original YAML files
    - run_round_trip_validation(): Full Steps 2-3 validation

    Bugs Fixed During Validation:
    1. db_init/rebuild missing task fields (description, metadata, gate_info, audit_results)
       FIXED: commands.py:1804-1852 now passes all task fields to db_create_task
    2. yaml_loader audit_results parser required specific format
       FIXED: yaml_loader.py:1380-1398 handles custom audit_results formats
    3. TaskMetadata.last_updated defaulting to now() instead of null
       FIXED: Made last_updated Optional, yaml_loader preserves null
    4. yaml_dumper save_task function missing for single-task saves
       ADDED: yaml_dumper.py:611-760 adds save_task() function

    Validation Results After Fixes:
    - 945 tasks loaded (previously 944 with 1 skipped)
    - Reduced from 988 to 55 content differences
    - Remaining differences are:
      * 5 track: computed blocked/progress differs from stored values
      * 37 sprint: fields not in database schema (deliverables, etc.)
      * 12 task: datetime microseconds, multi-line string formatting

    The validation correctly identifies schema gaps and stale YAML values.
    Future work: Expand database schema and add YAML remediation for 100% fidelity.
