  title: Modify update operations to write to both backends
  description: |
    Update vibey/operations/roadmap/update.py to write to SQLite when available:

    Current behavior:
    - `_use_sqlite_backend()` checks if DB is initialized
    - If True, sets `is_dirty = 1` in database_state
    - Still only writes to YAML via save_roadmap/track/sprint/tasks

    Required changes:
    1. Import sql_dumper functions (save_track, save_sprint, save_tasks, etc.)
    2. After each YAML save, also call corresponding sql_dumper function
    3. Mark database as NOT dirty after successful dual-write
    4. Handle errors gracefully (YAML is still authoritative)

    Affected functions (see grep results):
    - save_tasks() calls at lines 279, 374, 453, 905, 1321
    - save_sprint() calls at lines 523, 647, 935, 1056, 1281
    - save_track() calls at lines 550, 729, 965, 1129, 1247

    Key insight: YAML remains source of truth, SQLite is kept in sync
    for fast queries. On conflict, YAML wins.
