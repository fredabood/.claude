  title: Update sql_loader to load criteria from database
  description: "Update sql_loader.py to load criteria from the criteria and criterion_targets\
    \ tables.\n\nREQUIREMENTS:\n1. Query criteria table joined with criterion_targets\n\
    2. Reconstruct Criterion objects with appropriate CriterionTarget\n3. Attach criteria\
    \ to loaded Task/Sprint/Track objects\n4. Handle polymorphic target types based\
    \ on target_type column\n\nQUERY PATTERN:\n```sql\nSELECT c.*, ct.*\nFROM criteria\
    \ c\nLEFT JOIN criterion_targets ct ON c.id = ct.criterion_id\nWHERE c.completable_id\
    \ = ?\n```\n\nIMPLEMENTATION:\n```python\ndef _load_criteria_for_ticket(ticket_id:\
    \ str, conn) -> List[Criterion]:\n    rows = conn.execute(CRITERIA_QUERY, (ticket_id,)).fetchall()\n\
    \    criteria = []\n    for row in rows:\n        target = _build_target_from_row(row)\n\
    \        criteria.append(Criterion(\n            id=row['id'],\n            description=row['description'],\n\
    \            blocks_transition_to=TicketStatus(row['blocks_transition_to']),\n\
    \            target=target,\n            required=bool(row['required']),\n   \
    \     ))\n    return criteria\n```\n\nREFERENCE:\n- vibey/roadmap/serialization/sql_loader.py\
    \ (current loader)\n- sqlite-backend-6/context/architecture/05-DATABASE-SCHEMA.md\n"
