  title: Update yaml_dumper to serialize criteria to YAML
  description: "Update yaml_dumper.py to serialize criteria to YAML format.\n\nREQUIREMENTS:\n\
    1. Serialize Criterion objects to YAML criteria section\n2. Handle all CriterionTarget\
    \ types correctly\n3. Maintain round-trip integrity (load -> dump -> load = same)\n\
    4. Skip empty criteria lists (don't output criteria: [])\n\nIMPLEMENTATION:\n\
    ```python\ndef _dump_criteria(criteria: List[Criterion]) -> List[Dict]:\n    if\
    \ not criteria:\n        return None  # Don't include empty list\n    return [\n\
    \        {\n            'id': c.id,\n            'description': c.description,\n\
    \            'blocks_transition_to': c.blocks_transition_to.value,\n         \
    \   'required': c.required,\n            'target': _dump_target(c.target),\n \
    \       }\n        for c in criteria\n    ]\n```\n\nREFERENCE:\n- vibey/roadmap/serialization/yaml_dumper.py\
    \ (current dumper)\n- sqlite-backend-6/context/sample_code/yaml/example_criteria.yaml\n"
