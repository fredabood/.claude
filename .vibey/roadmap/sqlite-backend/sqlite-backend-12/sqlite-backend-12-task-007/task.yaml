  title: End-to-end sync system validation
  description: |
    Validate the complete sync system works end-to-end:

    Test scenarios:
    1. Fresh clone workflow:
       - Clone repo (YAML files only, no .db)
       - Run `vibey roadmap db init`
       - Verify DB matches YAML

    2. Update workflow:
       - Make change via CLI (`vibey roadmap update task ...`)
       - Verify both YAML and DB updated
       - Commit (pre-commit dumps if dirty)
       - Verify YAML committed matches DB

    3. Pull workflow:
       - Simulate incoming YAML changes
       - Run post-merge hook
       - Verify DB rebuilt from YAML

    4. Conflict scenario:
       - Make local DB change
       - Pull conflicting YAML change
       - Verify YAML wins (source of truth)

    5. Integrity verification:
       - Run full integrity audit
       - Verify zero discrepancies
       - Verify all 864+ tasks load without validation errors

    Success criteria:
    - All 5 scenarios pass
    - `vibey roadmap db status` shows healthy
    - Integrity audit shows 0 issues
    - No data loss in any scenario
