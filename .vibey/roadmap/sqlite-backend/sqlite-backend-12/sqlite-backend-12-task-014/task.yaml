  title: Implement Requirements cascade for standards enforcement
  description: "Implement the Requirements system for standards enforcement via cascade.\n\
    \nGAP ADDRESSED: GAP-002 (Standards System)\n\nCURRENT STATE:\n- Standard class\
    \ with: type, enforcement, validation, enabled, overrides\n- StandardType enum:\
    \ COMMIT_CHECK, FILE_CHECK, TEST_RUN, CUSTOM_SCRIPT\n- EnforcementMode enum: BLOCKING,\
    \ WARNING, AUDIT\n- StandardOverride mechanism for exceptions\n\nTARGET STATE:\n\
    - Requirements cascade from parent to child tickets\n- Requirement contains CriterionTemplate\
    \ that instantiates as Criterion\n- InheritMode: INHERIT (use stricter), OVERRIDE\
    \ (replace), SKIP (opt out)\n- Enforceable flag prevents children from skipping\n\
    - StandardType mapped to CriterionTargetType:\n  - FILE_CHECK -> FileExistsTarget\n\
    \  - TEST_RUN -> TestPassesTarget\n  - CUSTOM_SCRIPT -> TestPassesTarget with\
    \ custom command\n  - COMMIT_CHECK -> TestPassesTarget with git command\n- EnforcementMode\
    \ mapped to criterion.required:\n  - BLOCKING -> required=True\n  - WARNING ->\
    \ required=False (tracked, shown in progress)\n  - AUDIT -> required=False (implementation\
    \ note: could add visible_in_progress flag)\n\nIMPLEMENTATION:\n1. Implement Requirement\
    \ model (already exists in sample code)\n2. Implement RequirementResolver for\
    \ cascade logic\n3. Implement CriterionInstantiator to create Criterion from templates\n\
    4. Add requirements_local to Ticket model\n5. Add requirements_effective computed\
    \ property to HierarchicalTicket\n6. Update YAML format for requirements section\n\
    7. Update serialization for requirements\n\nEXAMPLE:\n```yaml\n# Roadmap-level\
    \ requirement (enforceable)\nrequirements:\n  - id: req-test-coverage\n    name:\
    \ \"All code requires 80% test coverage\"\n    enforceable: true\n    applies_to_types:\
    \ [sprint, task]\n    criterion_template:\n      description: \"Test coverage\
    \ >= 80%\"\n      blocks_transition_to: completed\n      target:\n        type:\
    \ test_coverage\n        coverage_threshold: 80.0\n\n# Sprint-level override (if\
    \ not enforceable)\nrequirements:\n  - id: req-test-coverage\n    inherit_mode:\
    \ override\n    criterion_template:\n      target:\n        coverage_threshold:\
    \ 70.0  # Lower threshold for this sprint\n```\n\nREFERENCE:\n- sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\
    \ (Requirement System)\n- sqlite-backend-6/context/sample_code/models/requirement.py\n\
    - sqlite-backend-6/context/sample_code/models/func_resolve_requirements.py\n"
