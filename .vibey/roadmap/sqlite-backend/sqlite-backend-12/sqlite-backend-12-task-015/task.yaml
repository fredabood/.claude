  title: Implement computed progress from criteria
  description: "Implement automatic progress computation from criteria satisfaction.\n\
    \nGAP ADDRESSED: GAP-006 (Progress Calculation)\n\nCURRENT STATE:\n- Manual progress\
    \ counters in YAML:\n  - development_tasks_total/completed\n  - completion_gate_tasks_total/completed\n\
    \  - production_gate_tasks_total/completed\n  - tasks_total/completed\n  - completion_percent\n\
    - Progress tracked by task_type dimension\n- Requires manual counter updates (error-prone)\n\
    \nTARGET STATE:\n- Progress computed automatically from criteria:\n  - progress_for_transition(IN_PROGRESS)\
    \ -> criteria blocking start\n  - progress_for_transition(COMPLETED) -> criteria\
    \ blocking completion\n  - progress_for_transition(PRODUCTION_READY) -> criteria\
    \ blocking deploy\n- No manual counters needed\n- Progress is always accurate\
    \ and consistent\n\nIMPLEMENTATION:\n1. Completable.progress_for_transition()\
    \ already exists in models\n2. Add computed progress property that aggregates\
    \ all transitions\n3. Update CLI status display to show transition-based progress\n\
    4. Remove manual progress counters from YAML format\n5. Add SQL view for computed\
    \ progress (performance)\n6. Update yaml_dumper to compute progress on export\n\
    \nPROGRESS DISPLAY CHANGE:\n```\n# BEFORE (task type dimension)\nSprint: 5/8 dev\
    \ tasks, 2/3 gate tasks (70%)\n\n# AFTER (transition dimension)\nSprint:\n  Ready\
    \ to start: 3/3 criteria met ✓\n  Ready to complete: 5/8 criteria met (62%)\n\
    \  Ready to deploy: 0/2 criteria met\n```\n\nSQL VIEW:\n```sql\nCREATE VIEW v_ticket_progress\
    \ AS\nSELECT\n  t.id,\n  t.status,\n  COUNT(CASE WHEN c.blocks_transition_to =\
    \ 'in_progress' THEN 1 END) AS start_total,\n  COUNT(CASE WHEN c.blocks_transition_to\
    \ = 'in_progress' AND c.is_met THEN 1 END) AS start_met,\n  COUNT(CASE WHEN c.blocks_transition_to\
    \ = 'completed' THEN 1 END) AS complete_total,\n  COUNT(CASE WHEN c.blocks_transition_to\
    \ = 'completed' AND c.is_met THEN 1 END) AS complete_met,\n  COUNT(CASE WHEN c.blocks_transition_to\
    \ = 'production_ready' THEN 1 END) AS deploy_total,\n  COUNT(CASE WHEN c.blocks_transition_to\
    \ = 'production_ready' AND c.is_met THEN 1 END) AS deploy_met\nFROM tickets t\n\
    LEFT JOIN criteria c ON c.completable_id = t.id\nGROUP BY t.id;\n```\n\nREFERENCE:\n\
    - vibey/roadmap/models/ticket/completable.py (progress_for_transition)\n- sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\
    \ (Progress section)\n"
