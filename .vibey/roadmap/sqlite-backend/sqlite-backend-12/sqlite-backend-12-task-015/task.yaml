  title: Implement computed progress from criteria
  description: |
    Implement automatic progress computation from criteria satisfaction.

    GAP ADDRESSED: GAP-006 (Progress Calculation)

    CURRENT STATE:
    - Manual progress counters in YAML:
      - development_tasks_total/completed
      - completion_gate_tasks_total/completed
      - production_gate_tasks_total/completed
      - tasks_total/completed
      - completion_percent
    - Progress tracked by task_type dimension
    - Requires manual counter updates (error-prone)

    TARGET STATE:
    - Progress computed automatically from criteria:
      - progress_for_transition(IN_PROGRESS) -> criteria blocking start
      - progress_for_transition(COMPLETED) -> criteria blocking completion
      - progress_for_transition(PRODUCTION_READY) -> criteria blocking deploy
    - No manual counters needed
    - Progress is always accurate and consistent

    IMPLEMENTATION:
    1. Completable.progress_for_transition() already exists in models
    2. Add computed progress property that aggregates all transitions
    3. Update CLI status display to show transition-based progress
    4. Remove manual progress counters from YAML format
    5. Add SQL view for computed progress (performance)
    6. Update yaml_dumper to compute progress on export

    PROGRESS DISPLAY CHANGE:
    ```
    # BEFORE (task type dimension)
    Sprint: 5/8 dev tasks, 2/3 gate tasks (70%)

    # AFTER (transition dimension)
    Sprint:
      Ready to start: 3/3 criteria met ✓
      Ready to complete: 5/8 criteria met (62%)
      Ready to deploy: 0/2 criteria met
    ```

    SQL VIEW:
    ```sql
    CREATE VIEW v_ticket_progress AS
    SELECT
      t.id,
      t.status,
      COUNT(CASE WHEN c.blocks_transition_to = 'in_progress' THEN 1 END) AS start_total,
      COUNT(CASE WHEN c.blocks_transition_to = 'in_progress' AND c.is_met THEN 1 END) AS start_met,
      COUNT(CASE WHEN c.blocks_transition_to = 'completed' THEN 1 END) AS complete_total,
      COUNT(CASE WHEN c.blocks_transition_to = 'completed' AND c.is_met THEN 1 END) AS complete_met,
      COUNT(CASE WHEN c.blocks_transition_to = 'production_ready' THEN 1 END) AS deploy_total,
      COUNT(CASE WHEN c.blocks_transition_to = 'production_ready' AND c.is_met THEN 1 END) AS deploy_met
    FROM tickets t
    LEFT JOIN criteria c ON c.completable_id = t.id
    GROUP BY t.id;
    ```

    REFERENCE:
    - vibey/roadmap/models/ticket/completable.py (progress_for_transition)
    - sqlite-backend-6/context/architecture/02-CLASS-MODEL.md (Progress section)
