    notes: |
      Sprint to restructure .vibey directory to mirror SQLite database 1:1.

      CURRENT STRUCTURE (problematic):
      .vibey/
        roadmap.yaml
        roadmap.db
        roadmap/
          <track-id>/           # One folder per track
            track.yaml
            context/
            <sprint-id>/        # One folder per sprint
              sprint.yaml
              context/
              <task-id>/        # One folder per task
                task.yaml
                context/

      PROBLEMS:
      1. Directory depth: 4-5 levels deep for task files
      2. Unbounded growth: directories grow with tracks/sprints/tasks
      3. Complex navigation: finding files requires knowing hierarchy
      4. Dump/init complexity: must traverse tree, transform data
      5. Context files scattered: audit/research files in many places

      PROPOSED STRUCTURE (mirrors SQLite):
      .vibey/
        roadmap/
          roadmap.db
          tables/
            roadmaps/           # One file per row
              <roadmap-id>.yaml
            tracks/
              <track-id>.yaml
            sprints/
              <sprint-id>.yaml
            tasks/
              <task-id>.yaml
            audit_trail/
              <entry-id>.yaml
            ... (other tables)
          views/                # Optional: materialized views
          triggers/
            <trigger-name>.sql
          context/              # All context files consolidated
            <track>_<sprint>_<task>/
              <timestamp>_<title>.md

      BENEFITS:
      1. Flat structure: max 3 levels deep
      2. Bounded directories: fixed number based on schema
      3. 1:1 mapping: each file = one row, each folder = one table
      4. Simple dump/init: iterate folders, read/write files
      5. Context consolidated: single location for all analysis

      FILE FORMAT CONSIDERATIONS:
      - YAML: Human readable, good AI context, verbose
      - JSON: Pandas/Spark compatible, less readable, compact
      - XML: Schema validation, verbose, legacy tooling

      Must evaluate trade-offs for:
      - SQLite <-> text translation speed
      - AI readability in prompts
      - Human editability
      - Tooling ecosystem (pandas, spark, jq, yq)
