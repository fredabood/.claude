  title: Evaluate file formats (YAML vs JSON vs XML) for roadmap data
  description: |
    Compare file formats for storing roadmap data, considering SQLite translation
    and AI/human readability trade-offs.

    FORMATS TO EVALUATE:

    1. YAML (current)
       Pros:
       - Human readable/editable
       - Good for AI context (natural language-like)
       - Comments supported
       - Anchors/aliases for deduplication
       Cons:
       - Indentation-sensitive (error-prone)
       - Multiple parsers with subtle differences
       - Slower to parse than JSON
       - No native schema validation

    2. JSON
       Pros:
       - Pandas/Spark native support
       - Fast parsing (C libraries)
       - Strict schema (JSON Schema)
       - Universal tooling (jq, etc.)
       - SQLite JSON functions for direct queries
       Cons:
       - Less human readable (no comments)
       - Verbose for nested structures
       - No multiline strings

    3. XML
       Pros:
       - Schema validation (XSD)
       - XSLT for transformations
       - Mature tooling
       Cons:
       - Very verbose
       - Poor AI readability
       - Heavy parsing overhead
       - Outdated ecosystem

    4. JSONL (JSON Lines)
       Pros:
       - Streaming-friendly
       - One record per line
       - Append-only friendly
       - Great for pandas.read_json(lines=True)
       Cons:
       - No single-file structure
       - Less human readable

    EVALUATION CRITERIA:
    1. SQLite <-> text translation speed
    2. AI readability in prompts
    3. Human editability
    4. Pandas/Spark integration
    5. Git diff quality
    6. Schema validation options
    7. Error resilience

    BENCHMARK APPROACH:
    - Convert current roadmap to each format
    - Measure file sizes
    - Measure parse/serialize times
    - Test with pandas read/write
    - Evaluate diff readability
    - Test AI comprehension with sample prompts

    DELIVERABLES:
    - Benchmark results table
    - Sample files in each format
    - Recommendation with rationale
    - Migration path if changing formats
