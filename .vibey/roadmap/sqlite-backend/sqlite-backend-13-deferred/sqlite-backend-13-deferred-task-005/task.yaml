  title: Create migration script for existing roadmaps
  description: |
    Build a migration script to convert existing .vibey directory structure
    to the new table-based structure.

    MIGRATION REQUIREMENTS:

    1. Pre-migration validation:
       - Count all files in current structure
       - Validate YAML syntax of all files
       - Create backup of .vibey/roadmap/

    2. Entity extraction:
       - Extract all track.yaml -> tracks/<id>.yaml
       - Extract all sprint.yaml -> sprints/<id>.yaml
       - Extract all task.yaml -> tasks/<id>.yaml
       - Extract roadmap.yaml -> roadmaps/<id>.yaml

    3. Context consolidation:
       - Find all */context/ directories
       - Move files with new naming convention
       - Preserve file timestamps

    4. Relationship preservation:
       - Ensure all foreign keys valid
       - Verify no orphan entities
       - Check blocked_by/blocks references

    5. Post-migration validation:
       - Count files in new structure
       - Verify counts match
       - Load into SQLite and compare

    SCRIPT INTERFACE:
    ```bash
    vibey roadmap migrate-structure [--dry-run] [--backup-dir PATH]

    Options:
      --dry-run      Show what would be done without changing files
      --backup-dir   Where to store backup (default: .vibey-backup-<timestamp>)
      --force        Skip confirmation prompts
    ```

    ROLLBACK SUPPORT:
    - Keep backup until explicitly deleted
    - Provide rollback command: vibey roadmap migrate-structure --rollback

    EDGE CASES:
    - Partially migrated state (idempotent re-run)
    - Files with special characters in names
    - Symlinks in .vibey directory
    - Git submodules

    DELIVERABLES:
    - Migration script (Python)
    - CLI command integration
    - Dry-run mode
    - Rollback capability
    - Migration documentation
