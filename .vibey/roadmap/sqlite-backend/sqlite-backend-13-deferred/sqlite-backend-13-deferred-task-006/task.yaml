  task_type: development
  title: Update CLI and tooling for new directory structure
  description: |
    Update all CLI commands and tooling to work with the new table-based
    directory structure.

    CLI COMMANDS TO UPDATE:

    1. vibey roadmap db init:
       - Create tables/ subdirectories
       - Initialize empty files or folders
       - Set up context/ directory

    2. vibey roadmap db dump:
       - Iterate SQLite tables
       - Write one file per row to tables/<table>/
       - Simple 1:1 mapping (no hierarchy traversal)

    3. vibey roadmap db rebuild:
       - Read all files from tables/
       - Insert into SQLite
       - Validate foreign keys

    4. vibey roadmap db validate:
       - Check file counts match row counts
       - Validate YAML syntax
       - Check foreign key references

    5. vibey roadmap update:
       - Update correct file path in new structure
       - No longer need to navigate hierarchy

    6. vibey roadmap query:
       - Work with flat file structure
       - Faster file lookups (no tree traversal)

    CODE CHANGES EXPECTED:
    - vibey/operations/roadmap/db.py
    - vibey/operations/roadmap/query.py
    - vibey/operations/roadmap/update.py
    - vibey/cli/commands.py (path references)

    TESTING:
    - All existing CLI tests should pass
    - New tests for table-based paths
    - Performance comparison (old vs new)

    DELIVERABLES:
    - Updated CLI commands
    - Updated operations code
    - Test results
    - Performance benchmark
