  deliverables:
  - Production database initialized with full schema (27 tables, 21 views)
  - Dual-write pattern for all update operations
  - Pre-commit hook that dumps DB to YAML
  - Post-merge hook that rebuilds DB from YAML
  - Data integrity fixes for existing roadmap YAML
  - Sprint summary validation in integrity audit
  - End-to-end sync system validation suite
  - Migration script for existing roadmaps
  - Updated CLI with new directory structure support
  - ActivityLog integration with ticket lifecycle events
  - Optional auto-progression for status transitions
  description: 'Execute the production cutover where SQLite becomes the primary source
    of truth

    for roadmap operations, with YAML as a derived artifact kept in sync via git hooks.


    SYNC ARCHITECTURE:

    ```

    ┌──────────────────────────────────────────────────────────────────┐

    │                      WRITE PATH                                   │

    │  CLI Command → Update SQLite → Pre-commit Hook → Dump to YAML    │

    └──────────────────────────────────────────────────────────────────┘


    ┌──────────────────────────────────────────────────────────────────┐

    │                      READ PATH                                    │

    │  Git Pull → Post-Merge Hook → Rebuild SQLite from YAML           │

    └──────────────────────────────────────────────────────────────────┘

    ```


    POST-CUTOVER STATE:

    - SQLite = Primary source of truth for writes

    - YAML = Version-controlled artifacts (git-tracked)

    - Automatic sync via git hooks

    - Deterministic completion via criteria evaluation


    REMAINING GAPS ADDRESSED:

    - GAP-003: Audit trail → ActivityLog integration

    - GAP-008: Auto-progression → Optional config-driven auto-status


    Reference: sqlite-backend-6/context/005-yaml-sync-strategy.md

    '
  goal: Execute production cutover to SQLite with automatic YAML sync via git hooks
  success_criteria:
  - Production database created with full schema
  - All update operations write to SQLite first
  - Pre-commit hook exports DB to YAML before commit
  - Post-merge hook rebuilds DB from YAML after merge
  - No manual YAML editing required for status changes
  - Round-trip integrity maintained (YAML → DB → YAML)
  - ActivityLog captures all lifecycle events
  - Migration script works on existing vibey roadmaps
  risks:
  - Data loss if hooks fail silently
  - Merge conflicts in YAML after concurrent edits
  - Performance impact of full DB dump on commit
  - User confusion during transition period
  notes: 'CRITICAL: This sprint is the final cutover. Once complete:

    1. SQLite is the primary data store

    2. YAML is a derived artifact for git

    3. All tooling reads from SQLite

    4. Git hooks maintain sync automatically


    ROLLBACK PLAN:

    - If issues arise, disable hooks and revert to YAML-primary mode

    - DB can always be rebuilt from YAML via: vibey roadmap db rebuild

    '
