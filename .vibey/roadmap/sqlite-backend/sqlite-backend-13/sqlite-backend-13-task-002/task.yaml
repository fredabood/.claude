  task_type: development
  title: Modify update operations to write to both backends
  description: |
    Implement dual-write pattern for all update operations.

    WRITE PATTERN:
    1. Receive update command (CLI or MCP)
    2. Write to SQLite database (primary)
    3. Mark database as dirty (has uncommitted changes)
    4. On pre-commit: dump dirty records to YAML
    5. Clear dirty flag after successful dump

    OPERATIONS TO UPDATE:
    - start_task() / start_sprint() / start_track()
    - complete_task() / complete_sprint() / complete_track()
    - update_task_status() / update_sprint_status()
    - add_commit_to_task()
    - add_deliverable_to_task()
    - update_progress()

    IMPLEMENTATION:
    ```python
    def complete_task(task_id: str) -> None:
        # 1. Load from DB
        task = sql_load_task(task_id)

        # 2. Validate transition
        can_complete, blocking = task.can_transition_to(COMPLETED)
        if not can_complete:
            raise TransitionBlockedError(blocking)

        # 3. Update DB
        task.status = COMPLETED
        task.completed_at = datetime.now(timezone.utc)
        sql_save_task(task)

        # 4. Mark dirty
        mark_dirty(task_id)

        # 5. Log activity
        log_activity(TICKET_COMPLETED, task_id)
    ```

    REFERENCE:
    - vibey/operations/roadmap/update.py
    - vibey/roadmap/serialization/backend.py (SyncManager)
