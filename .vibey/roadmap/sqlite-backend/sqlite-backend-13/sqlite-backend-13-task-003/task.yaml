  task_type: development
  title: Add DB dump to pre-commit hook
  description: "Add pre-commit hook that dumps SQLite database to YAML before commit.\n\
    \nHOOK RESPONSIBILITIES:\n1. Check if database has uncommitted changes (is_dirty\
    \ flag)\n2. If dirty, dump changed records to YAML files\n3. Stage the updated\
    \ YAML files\n4. Clear dirty flag\n5. Verify completion claims in commit message\
    \ (from Sprint 12)\n\nHOOK LOCATION: .vibey/hooks/pre-commit\n\nIMPLEMENTATION:\n\
    ```bash\n#!/bin/bash\nset -e\n\n# Check if database is dirty\nif vibey roadmap\
    \ db is-dirty; then\n    echo \"Dumping database changes to YAML...\"\n    vibey\
    \ roadmap db dump --staged-only\n\n    # Stage updated YAML files\n    git add\
    \ .vibey/roadmap/**/*.yaml\nfi\n\n# Verify completion claims (from Sprint 12)\n\
    COMMIT_MSG=$(cat \"$1\" 2>/dev/null || echo \"\")\nvibey roadmap verify-completion-claims\
    \ \"$COMMIT_MSG\"\n```\n\nDUMP STRATEGY:\n- Only dump records marked dirty (not\
    \ full database)\n- Maintain YAML file structure: track/sprint/task directories\n\
    - Update summary counters in parent files\n- Preserve formatting and comments\
    \ where possible\n\nREFERENCE:\n- sqlite-backend-6/context/005-yaml-sync-strategy.md\n\
    - vibey/roadmap/serialization/yaml_dumper.py\n"
