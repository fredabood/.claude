  title: End-to-end sync system validation
  description: "Comprehensive validation of the full sync system before production\
    \ cutover.\n\nVALIDATION SCENARIOS:\n\n1. WRITE PATH (CLI → DB → YAML)\n   - Make\
    \ status change via CLI\n   - Verify DB updated immediately\n   - Run pre-commit\
    \ hook\n   - Verify YAML updated correctly\n   - Commit and verify clean state\n\
    \n2. READ PATH (Git Pull → DB Rebuild)\n   - Clone repo on second machine\n  \
    \ - Modify YAML on first machine, commit, push\n   - Pull on second machine\n\
    \   - Verify post-merge hook fires\n   - Verify DB matches YAML\n\n3. CONFLICT\
    \ RESOLUTION\n   - Two users modify same task\n   - Create merge conflict in YAML\n\
    \   - Verify graceful failure of rebuild\n   - Resolve conflict manually\n   -\
    \ Verify rebuild succeeds after resolution\n\n4. ROUND-TRIP INTEGRITY\n   - Start\
    \ with clean state\n   - Make 10 random changes via CLI\n   - Dump to YAML\n \
    \  - Delete DB\n   - Rebuild from YAML\n   - Compare state to original\n\n5. PERFORMANCE\n\
    \   - Measure dump time for 1000 tasks\n   - Measure rebuild time for 1000 tasks\n\
    \   - Ensure acceptable latency (<5s for typical roadmap)\n\n6. ERROR RECOVERY\n\
    \   - Simulate hook failure mid-dump\n   - Verify rollback occurs\n   - Verify\
    \ no data corruption\n\nTEST COMMANDS:\n```\nvibey roadmap sync test --scenario\
    \ write-path\nvibey roadmap sync test --scenario read-path\nvibey roadmap sync\
    \ test --scenario conflict\nvibey roadmap sync test --scenario round-trip\nvibey\
    \ roadmap sync test --scenario performance\nvibey roadmap sync test --all\n```\n\
    \nREFERENCE:\n- sqlite-backend-6/context/005-yaml-sync-strategy.md\n"
