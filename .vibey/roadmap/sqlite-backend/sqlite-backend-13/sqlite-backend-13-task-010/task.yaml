  title: Integrate ActivityLog with unified ticket lifecycle
  description: |
    Integrate the unified ActivityLog with ticket lifecycle events.

    GAP ADDRESSED: GAP-003 (Audit Trail Integration)

    DESIGN DECISION:
    The audit trail is kept as an operational concern, NOT integrated into the
    domain model. ActivityLog at the RoadmapTicket level captures high-level events.
    Per-field change tracking is handled by:
    1. Git history for YAML files (comprehensive, immutable)
    2. ActivityLogEntry for structured event queries
    3. Optional detailed audit_trail table for compliance needs

    IMPLEMENTATION:
    1. Hook ActivityLog into Ticket lifecycle methods:
       - start() -> log START event
       - complete() -> log COMPLETE event
       - transition to PRODUCTION_READY -> log DEPLOY_READY event
    2. Log criteria evaluation results:
       - can_transition_to() blocked -> log BLOCKED event with reasons
       - criteria met -> log CRITERIA_MET event
    3. Add event types to ActivityType enum:
       - TICKET_STARTED
       - TICKET_COMPLETED
       - TICKET_BLOCKED
       - CRITERIA_MET
       - CRITERIA_FAILED
       - STATUS_CHANGED
    4. Update CLI to display recent activity

    ACTIVITY LOG ENTRY STRUCTURE:
    ```python
    class ActivityLogEntry(BaseModel):
        timestamp: datetime
        event_type: ActivityType
        ticket_id: str
        ticket_type: str  # roadmap, track, sprint, task
        actor: str  # claude-code, user, system, hook
        details: Optional[Dict[str, Any]]
        commit_sha: Optional[str]
    ```

    CLI DISPLAY:
    ```
    $ vibey roadmap activity --last 10
    2025-12-06 14:30  TICKET_COMPLETED  task-123  claude-code
    2025-12-06 14:29  CRITERIA_MET      task-123  Tests passed
    2025-12-06 14:00  TICKET_STARTED    task-123  claude-code
    ```

    REFERENCE:
    - sqlite-backend-6/context/architecture/02-CLASS-MODEL.md (ActivityLogEntry)
    - vibey/roadmap/models/ticket/hierarchical.py (RoadmapTicket.activity_log)
