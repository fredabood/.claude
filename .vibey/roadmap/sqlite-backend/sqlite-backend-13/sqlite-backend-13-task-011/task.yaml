  title: Implement optional auto-progression for status transitions
  description: "Implement optional automatic status progression when criteria are\
    \ met.\n\nGAP ADDRESSED: GAP-008 (Status Auto-Progression Logic)\n\nDESIGN DECISION:\n\
    Auto-progression is OPTIONAL and config-driven. Users can choose between:\n1.\
    \ EXPLICIT mode: Status only changes via manual command\n2. AUTO mode: Status\
    \ advances automatically when criteria are met\n\nThis is a configuration choice,\
    \ not a change to the domain model.\n\nCURRENT STATE:\n- can_transition_to() only\
    \ CHECKS if transition is allowed\n- Does not trigger the transition automatically\n\
    - Status changes require explicit CLI command\n\nIMPLEMENTATION:\n1. Add configuration\
    \ option:\n   ```yaml\n   # .vibey/config/roadmap.yaml\n   roadmap:\n     auto_progression:\n\
    \       enabled: true  # or false for explicit mode\n       transitions:\n   \
    \      - from: not_started\n           to: in_progress\n           when: all_start_criteria_met\n\
    \         - from: in_progress\n           to: completed\n           when: all_completion_criteria_met\n\
    \   ```\n\n2. Implement StatusManager.check_and_advance():\n   ```python\n   def\
    \ check_and_advance(ticket: Ticket) -> Optional[TicketStatus]:\n       \"\"\"\
    Check if ticket can auto-advance and do so if configured.\"\"\"\n       if not\
    \ config.auto_progression.enabled:\n           return None\n\n       for transition\
    \ in config.auto_progression.transitions:\n           if ticket.status == transition.from_status:\n\
    \               can_advance, _ = ticket.can_transition_to(transition.to_status)\n\
    \               if can_advance:\n                   ticket.status = transition.to_status\n\
    \                   return transition.to_status\n       return None\n   ```\n\n\
    3. Hook auto-progression into:\n   - Post-update checks (after any ticket update)\n\
    \   - Post-commit hooks (after git commit changes)\n   - CLI status display (show\
    \ pending auto-transitions)\n\n4. Add CLI commands:\n   ```\n   $ vibey roadmap\
    \ auto-progress --check  # Show what would advance\n   $ vibey roadmap auto-progress\
    \ --apply  # Actually advance tickets\n   ```\n\nPARENT CHAIN PROPAGATION:\nWhen\
    \ a child ticket completes, check if parent can now advance:\n```python\ndef propagate_completion(ticket:\
    \ Ticket):\n    \"\"\"Propagate completion up the hierarchy.\"\"\"\n    if ticket.parent_ref:\n\
    \        parent = load_ticket(ticket.parent_ref)\n        advanced = check_and_advance(parent)\n\
    \        if advanced:\n            propagate_completion(parent)  # Recurse up\n\
    ```\n\nREFERENCE:\n- GAP_ANALYSIS.md (GAP-008)\n- sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\
    \ (can_transition_to)\n"
