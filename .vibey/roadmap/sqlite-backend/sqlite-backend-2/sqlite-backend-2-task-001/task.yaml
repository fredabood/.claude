  roadmap_id: vibey-framework-v2
  task_type: development
  title: "Add vibey roadmap db subcommand group"
  description: |
    Create new CLI command group in vibey/cli/roadmap_commands/db.py:

    vibey roadmap db init:
    - Create .vibey/roadmap.db with schema
    - Load all YAML files into database
    - Compute checksums and store in yaml_checksums table
    - Set database_state.is_dirty = 0

    vibey roadmap db rebuild [--force]:
    - Check if database is dirty (uncommitted changes)
    - If dirty and no --force: error with instructions
    - Drop and recreate all tables
    - Reload from YAML files

    vibey roadmap db status:
    - Show database exists/missing
    - Show is_dirty flag and last sync time
    - Show file count vs table row counts
    - Show any checksum mismatches

    vibey roadmap db backup:
    - Copy .vibey/roadmap.db to .vibey/roadmap.db.backup
    - Include timestamp in backup name

    Register in main.py as subcommand group.
