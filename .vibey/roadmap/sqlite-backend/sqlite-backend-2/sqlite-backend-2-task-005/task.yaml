  roadmap_id: vibey-framework-v2
  task_type: development
  title: "Implement backend mode detection and configuration"
  description: |
    Implement automatic backend selection in vibey/roadmap/serialization/backend.py:

    Mode detection logic:
    1. Check config: .vibey/config/roadmap.yaml → backend: "auto"|"sqlite"|"yaml"
    2. If "auto" (default):
       - If .vibey/roadmap.db exists and is valid: use sqlite
       - Otherwise: use yaml
    3. If "sqlite": require database, error if missing
    4. If "yaml": always use YAML (ignore database)

    Database validation:
    - Check file exists
    - Check schema version matches expected
    - Check tables exist
    - Quick integrity check (PRAGMA integrity_check)

    Graceful degradation:
    - If database corrupted: warn and fall back to YAML
    - If schema version mismatch: warn and offer rebuild

    Add CLI flags:
    - --backend=sqlite|yaml (override for single command)

    Integration points:
    - get_backend() called by operations layer
    - Returns YAMLBackend or SQLiteBackend
    - Operations don't know which backend is active
