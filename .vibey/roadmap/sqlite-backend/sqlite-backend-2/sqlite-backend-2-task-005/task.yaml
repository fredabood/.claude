  title: Implement backend mode detection and configuration
  description: "Implement automatic backend selection in vibey/roadmap/serialization/backend.py:\n\
    \nMode detection logic:\n1. Check config: .vibey/config/roadmap.yaml → backend:\
    \ \"auto\"|\"sqlite\"|\"yaml\"\n2. If \"auto\" (default):\n   - If .vibey/roadmap.db\
    \ exists and is valid: use sqlite\n   - Otherwise: use yaml\n3. If \"sqlite\"\
    : require database, error if missing\n4. If \"yaml\": always use YAML (ignore\
    \ database)\n\nDatabase validation:\n- Check file exists\n- Check schema version\
    \ matches expected\n- Check tables exist\n- Quick integrity check (PRAGMA integrity_check)\n\
    \nGraceful degradation:\n- If database corrupted: warn and fall back to YAML\n\
    - If schema version mismatch: warn and offer rebuild\n\nAdd CLI flags:\n- --backend=sqlite|yaml\
    \ (override for single command)\n\nIntegration points:\n- get_backend() called\
    \ by operations layer\n- Returns YAMLBackend or SQLiteBackend\n- Operations don't\
    \ know which backend is active\n"
