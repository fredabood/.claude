  title: "Implement deterministic DB to YAML dump"
  description: |
    Implement dump logic in vibey/roadmap/database/sync/dump.py:

    vibey roadmap dump command:
    - Query all entities from database
    - Write to hierarchical YAML structure:
      - .vibey/roadmap.yaml (roadmap root)
      - .vibey/roadmap/{track}/track.yaml
      - .vibey/roadmap/{track}/{sprint}/sprint.yaml
      - .vibey/roadmap/{track}/{sprint}/{task}/task.yaml

    Deterministic output requirements (from 005-yaml-sync-strategy.md):
    - Fixed key ordering per entity type (defined in code)
    - Arrays sorted by ID or natural key
    - ISO 8601 timestamps with Z suffix
    - Explicit null for optional fields (no omission)
    - 2-space indentation, no flow style

    Pre-dump safety check:
    - Compute current checksums of YAML files
    - Compare with yaml_checksums table (stored at load time)
    - If mismatch: YAML was edited manually since load
    - Error with instructions: "YAML modified outside CLI, run rebuild first"
    - --force flag to overwrite anyway

    Post-dump:
    - Update yaml_checksums with new checksums
    - Set database_state.is_dirty = 0
    - Record last_yaml_dump timestamp

    Test: Run dump twice, compare byte-for-byte (must be identical)
