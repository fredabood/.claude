  task_type: development
  title: "Implement YAML to DB rebuild"
  description: |
    Implement rebuild logic in vibey/roadmap/database/sync/rebuild.py:

    vibey roadmap db rebuild command:
    - Parse all YAML files using existing yaml_loader.py
    - Insert/update all entities into database tables
    - Compute and store checksums in yaml_checksums table
    - Set database_state.is_dirty = 0
    - Record source_commit (git HEAD) and source_branch

    Pre-rebuild safety check:
    - Check database_state.is_dirty flag
    - If dirty (uncommitted changes): error with instructions
      "Database has uncommitted changes. Options:
       - vibey roadmap dump (save changes to YAML first)
       - vibey roadmap db rebuild --force (discard local changes)"
    - --force flag to discard uncommitted changes

    Rebuild modes:
    - Full rebuild (default): DROP all tables, recreate, reimport
    - Incremental (--incremental): Compare checksums, only update changed

    Validation during import:
    - Use existing vibey/roadmap/validation/ for YAML validation
    - Log errors per file with line numbers
    - Option to continue on errors (--skip-errors)
    - Summary at end: "Imported X tracks, Y sprints, Z tasks. N errors."

    Post-rebuild:
    - Run computed views and verify accuracy
    - Report any integrity issues
