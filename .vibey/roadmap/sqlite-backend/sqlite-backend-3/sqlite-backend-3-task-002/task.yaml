    \ in yaml_checksums table\n- Set database_state.is_dirty = 0\n- Record source_commit\
    \ (git HEAD) and source_branch\n\nPre-rebuild safety check:\n- Check database_state.is_dirty\
    \ flag\n- If dirty (uncommitted changes): error with instructions\n  \"Database\
    \ has uncommitted changes. Options:\n   - vibey roadmap dump (save changes to\
    \ YAML first)\n   - vibey roadmap db rebuild --force (discard local changes)\"\
    \n- --force flag to discard uncommitted changes\n\nRebuild modes:\n- Full rebuild\
    \ (default): DROP all tables, recreate, reimport\n- Incremental (--incremental):\
    \ Compare checksums, only update changed\n\nValidation during import:\n- Use existing\
    \ vibey/roadmap/validation/ for YAML validation\n- Log errors per file with line\
    \ numbers\n- Option to continue on errors (--skip-errors)\n- Summary at end: \"\
    Imported X tracks, Y sprints, Z tasks. N errors.\"\n\nPost-rebuild:\n- Run computed\
    \ views and verify accuracy\n- Report any integrity issues\n"
