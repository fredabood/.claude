  task_type: development
  title: "Integrate with pre-commit hook"
  description: |
    Update vibey/operations/git/hooks/pre_commit.py for SQLite integration:

    Pre-commit flow (when database mode active):
    1. Check if database exists and is valid
    2. Check database_state.is_dirty
    3. If dirty:
       a. Run pre-dump safety check (detect manual YAML edits)
       b. If manual edits detected:
          - Log conflict to sync_conflicts table
          - Block commit with message explaining conflict
          - Suggest resolution: rebuild --force or dump --force
       c. If no conflicts: run dump
       d. Stage generated YAML files (git add .vibey/roadmap/)
    4. Continue with existing YAML validation

    New validation rule (yaml_db_sync):
    - Compare YAML file checksums with yaml_checksums table
    - Block if YAML modified manually when DB is source of truth
    - Enforcement mode: blocking (default), advisory, audit

    Update hooks/installer.py:
    - Install SQLite-aware pre-commit hook
    - Keep backward compatibility (YAML-only mode still works)

    Error messages should be clear:
    - "Database has uncommitted changes - running dump..."
    - "YAML files modified manually - sync conflict detected"
    - "Suggestion: vibey roadmap db rebuild --force"
