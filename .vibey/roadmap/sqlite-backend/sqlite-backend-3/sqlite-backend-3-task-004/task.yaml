  task_type: development
  title: "Integrate with post-merge and post-checkout hooks"
  description: |
    Create vibey/operations/git/hooks/post_merge.py:

    Post-merge flow:
    1. Check if database mode is active
    2. Check if any .vibey/roadmap/**/*.yaml files changed in merge
    3. If YAML files changed:
       a. Check database_state.is_dirty (uncommitted local changes)
       b. If dirty: warn user about potential conflict
          "Warning: Local DB changes exist. Merge may have updated YAML.
           Run: vibey roadmap db status (to check sync state)"
       c. If not dirty: run rebuild automatically
    4. Report status: "Database rebuilt from merged YAML files"

    Post-checkout flow:
    - Same as post-merge (branch switch may have different YAML)
    - Only trigger if .vibey/roadmap/ files differ between branches

    Update hooks/installer.py:
    - Install post-merge hook
    - Install post-checkout hook
    - Both hooks call same rebuild logic

    Handle merge conflicts in YAML files:
    - Detect conflict markers (<<<<<<, ======, >>>>>>)
    - Block rebuild until conflicts resolved
    - Clear error message with file list

    Integration with database_state:
    - After successful rebuild, update source_commit to merged HEAD
    - Update source_branch if branch changed
