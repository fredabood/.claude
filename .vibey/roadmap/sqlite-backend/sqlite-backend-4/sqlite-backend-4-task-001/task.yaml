  title: Build Computed DB from task files
  description: 'Create validation tooling in vibey/roadmap/database/validation/:


    computed_db.py - Build database from task files only:

    - Read all task.yaml files into tasks table

    - Read entity metadata (id, name, status) from sprint/track/roadmap YAML

    - DO NOT read progress counters from YAML

    - Use v_sprint_progress view to compute sprint progress

    - Use v_track_progress view to compute track progress

    - Use v_roadmap_progress view to compute roadmap progress


    This represents "ground truth" - what counters SHOULD be based on

    actual task statuses.


    CLI command: vibey roadmap validate --level=computed

    - Builds computed DB in memory (or temp file)

    - Uses existing views from Sprint 1


    Key insight from impact audit:

    - Current codebase has ~24 computed fields that require manual sync

    - These views replace ALL manual aggregations

    - Comparison with declared values reveals state drift

    '
