  title: Add track_sprint_summaries computed view
  description: |
    Add a computed view to the SQLite schema that generates track_sprint_summaries
    from existing sprints and tasks tables, eliminating redundant embedded data.

    CURRENT STATE:
    - track.yaml files contain embedded sprint summaries that drift from actual sprint.yaml
    - 25 mismatches detected between embedded summaries and actual sprints
    - Declared database has separate track_sprint_summaries table (173 rows)

    IMPLEMENTATION:
    1. Add view to schema.sql:
       CREATE VIEW track_sprint_summaries AS
       SELECT
           s.track_id,
           s.id AS sprint_id,
           s.name,
           s.status,
           (SELECT SUM(CASE WHEN estimated_duration IS NOT NULL THEN 1 ELSE 0 END)
            FROM tasks WHERE sprint_id = s.id) AS estimated_duration,
           (SELECT COUNT(*) FROM tasks WHERE sprint_id = s.id) AS tasks_count,
           s.started,
           s.completed
       FROM sprints s;

    2. Update compare_databases.py to:
       - Recognize track_sprint_summaries as a view in computed DB
       - Compare view output against declared table
       - Report any data discrepancies

    3. Update integrity_audit.py to:
       - Include track_sprint_summaries comparison in report
       - Flag embedded summary drift as integrity issue
       - Recommend using computed view as source of truth

    SUCCESS CRITERIA:
    - View returns 173 rows matching sprint count
    - Comparison shows view data matches actual sprint data
    - Drift from embedded summaries clearly identified in report
