  title: Add description and score fields to quality_gates table
  description: |
    Fix sql_dumper.py to preserve description and score fields when saving quality gates.

    CURRENT STATE:
    - quality_gates table exists with 140 rows (correct count)
    - Schema has description and score columns
    - sql_dumper.py line 179 only saves: owner_type, owner_id, name, threshold, status, blocking
    - description field is empty in computed DB but has data in declared DB
    - score field exists but may not be populated

    IMPLEMENTATION:
    1. Update sql_dumper.py save_track() function:
       - Line 178-181: Add description and score to INSERT statement
       - Change from:
         INSERT INTO quality_gates (owner_type, owner_id, name, threshold, status, blocking)
         VALUES ('track', ?, ?, ?, ?, ?)
       - To:
         INSERT INTO quality_gates (owner_type, owner_id, name, description, threshold, status, blocking, score)
         VALUES ('track', ?, ?, ?, ?, ?, ?, ?)

    2. Verify QualityGate model has description and score attributes

    3. Update compare_databases.py to:
       - Compare quality_gates table (computed) vs track_quality_gates table (declared)
       - Account for schema differences (polymorphic vs direct track_id)
       - Report any missing descriptions

    4. Regenerate computed database and verify all 140 gates have descriptions

    SUCCESS CRITERIA:
    - All 140 quality gates have description field populated
    - Comparison shows 0 data gaps for quality gates
    - Schema matches: computed quality_gates ≡ declared track_quality_gates
