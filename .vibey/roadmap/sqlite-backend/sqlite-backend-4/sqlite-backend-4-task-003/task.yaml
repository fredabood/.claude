  task_type: development
  title: "Implement database comparison engine"
  description: |
    Create comparison logic in vibey/roadmap/database/validation/compare.py:

    Comparison fields per level:
    Sprint: tasks_total, tasks_completed, completion_percent,
            development_tasks_total, development_tasks_completed
    Track: sprints_total, sprints_completed, tasks_total, tasks_completed,
           completion_percent
    Roadmap: tracks_total, tracks_completed, sprints_total, sprints_completed,
             tasks_total, tasks_completed, completion_percent

    Mismatch classification:
    - CRITICAL: tasks_completed wrong (affects blocking decisions)
    - HIGH: completion_percent > 5% off
    - MEDIUM: totals wrong (file count mismatch)
    - LOW: completion_percent < 5% off (rounding)

    Output format (per mismatch):
    {
      "entity_type": "sprint",
      "entity_id": "sqlite-backend-1",
      "field": "tasks_completed",
      "computed": 5,
      "declared": 3,
      "severity": "CRITICAL",
      "suggestion": "Update .vibey/roadmap/sqlite-backend/sqlite-backend-1/sprint.yaml"
    }

    CLI command: vibey roadmap validate --level=full
    - Runs comparison and reports all mismatches
    - Exit code 0 if no mismatches, 1 otherwise
