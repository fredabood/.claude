    notes: |
      Key insight: The DependencyStatus model in models/common.py defines:
      - required_status: Status blocker must reach to unblock (e.g., "completed")
      - blocks_transition_to: What transition this blocks (e.g., "in_progress")

      These fields enable sophisticated dependency logic:
      - "Can't start until X is completed" (blocks_transition_to='in_progress')
      - "Can't complete until X is production_ready" (blocks_transition_to='completed')

      Without preserving these, the database loses critical workflow logic.
