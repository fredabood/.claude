  title: Add business logic fields to entity_blocked_by table
  description: |
    Extend entity_blocked_by schema and sql_dumper to preserve dependency business logic.

    CURRENT STATE:
    - entity_blocked_by table has 102 rows (dependencies captured)
    - Missing fields: required_status, blocks_transition_to
    - reason field exists but always NULL (not saved by dumper)
    - declared dependencies table has 28 rows with full business logic

    DISCREPANCY ANALYSIS:
    - declared.dependencies: 28 rows from sprint.depends_on fields
    - computed.entity_blocked_by: 102 rows from blocked_by fields
    - Different sources: depends_on vs blocked_by are semantically different

    IMPLEMENTATION:
    1. Extend entity_blocked_by schema in schema.sql:
       ALTER TABLE entity_blocked_by ADD COLUMN required_status TEXT;
       ALTER TABLE entity_blocked_by ADD COLUMN blocks_transition_to TEXT;
       -- reason column already exists

    2. Update sql_dumper.py for tracks (line 168-173):
       - Extract required_status from DependencyStatus model
       - Extract blocks_transition_to from DependencyStatus model
       - Save reason field (currently hardcoded to None)

    3. Update sql_dumper.py for sprints (line 237-242):
       - Same changes as tracks

    4. Update sql_dumper.py for tasks (line 346-350):
       - Same changes as tracks/sprints

    5. Update compare_databases.py to:
       - Compare entity_blocked_by against declared dependencies
       - Report missing business logic fields
       - Flag where required_status differs from default 'completed'

    6. Regenerate computed database and verify business logic preserved

    SUCCESS CRITERIA:
    - entity_blocked_by has required_status, blocks_transition_to columns
    - All dependencies have business logic fields populated
    - reason field populated where defined in YAML
    - Comparison shows 0 dependency business logic gaps
