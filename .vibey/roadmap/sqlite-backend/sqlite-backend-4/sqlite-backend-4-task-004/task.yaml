  title: Implement transactional activity log writes
  description: |
    Refactor all entity mutation operations to use atomic transactions that write
    to both activity_log and entity tables, preventing drift between audit trail
    and current state.

    PROBLEM:
    Current architecture uses triggers to write activity_log entries after entity
    updates. This creates risk of drift if:
    - Trigger fails but entity update succeeds
    - Activity log schema changes break triggers
    - Bulk operations disable triggers for performance

    SOLUTION (Hybrid Architecture):
    All mutations flow through a transaction layer that atomically:
    1. INSERT into activity_log (the event)
    2. UPDATE/INSERT entity tables (the state change)
    3. Let existing triggers handle cascading updates (summaries, blocked flags)
    4. COMMIT or ROLLBACK as a unit

    IMPLEMENTATION:

    1. Create transaction helper module (vibey/roadmap/database/transactions.py):
       ```python
       @contextmanager
       def atomic_mutation(conn):
           """Context manager for atomic activity_log + entity writes."""
           cursor = conn.cursor()
           try:
               cursor.execute("BEGIN TRANSACTION")
               yield cursor
               conn.commit()
           except Exception:
               conn.rollback()
               raise
       ```

    2. Create mutation functions that use atomic_mutation:
       - complete_task(conn, task_id, actor) -> logs event + updates task
       - start_task(conn, task_id, actor) -> logs event + updates task
       - create_task(conn, task_data, actor) -> logs event + inserts task
       - update_task_status(conn, task_id, new_status, actor) -> logs + updates
       - Similar functions for sprints and tracks

    3. Update activity_log schema to capture before/after state:
       ```sql
       ALTER TABLE activity_log ADD COLUMN old_state TEXT;  -- JSON snapshot
       ALTER TABLE activity_log ADD COLUMN new_state TEXT;  -- JSON snapshot
       ```

    4. Refactor CLI commands to use new mutation functions:
       - vibey roadmap update-task -> calls update_task_status()
       - vibey roadmap add-task -> calls create_task()
       - All commands use atomic_mutation context

    5. Remove redundant activity_log triggers (optional):
       - trg_activity_task_status -> now handled by mutation function
       - trg_activity_sprint_status -> now handled by mutation function
       - trg_activity_track_status -> now handled by mutation function
       - Keep entity creation triggers OR move to mutation functions

    6. Add validation tests:
       - Test: failed entity update rolls back activity_log entry
       - Test: failed activity_log insert rolls back entity update
       - Test: concurrent mutations maintain consistency
       - Test: before/after snapshots accurately capture state

    ARCHITECTURE DIAGRAM:
    ```
    ┌─────────────────────────────────────────────────────────────┐
    │                    CLI Command                               │
    │                        │                                     │
    │                        ▼                                     │
    │              ┌─────────────────┐                            │
    │              │ Mutation Layer  │                            │
    │              │ (transactions.py)│                            │
    │              └────────┬────────┘                            │
    │                       │                                      │
    │         BEGIN TRANSACTION                                    │
    │                       │                                      │
    │    ┌──────────────────┼──────────────────┐                  │
    │    ▼                  ▼                  ▼                   │
    │ ┌────────┐     ┌────────────┐     ┌──────────┐             │
    │ │activity│     │  entity    │     │ triggers │             │
    │ │  _log  │     │  tables    │     │(cascades)│             │
    │ └────────┘     └────────────┘     └──────────┘             │
    │                       │                                      │
    │         COMMIT (or ROLLBACK on any failure)                 │
    └─────────────────────────────────────────────────────────────┘
    ```

    SUCCESS CRITERIA:
    - All entity mutations go through atomic_mutation context
    - activity_log and entity tables always consistent (no drift)
    - Failed operations leave no partial state
    - Before/after snapshots enable state reconstruction
    - Existing trigger-based cascades still work within transaction
