    notes: |
      This task implements the "hybrid architecture" discussed in design review.

      KEY INSIGHT: SQLite fully supports multi-statement transactions with ACID
      guarantees. By wrapping activity_log + entity writes in a single transaction,
      we get the audit trail benefits of event sourcing without the complexity of
      making activity_log the sole entry point.

      TRADE-OFF DECISION:
      - Rejected: Pure event sourcing (activity_log as single entry point)
        - Pros: Complete audit by design, time-travel
        - Cons: Query performance, trigger complexity, SQLite limitations
      - Accepted: Hybrid transactional writes
        - Pros: Fast queries, simple triggers, guaranteed consistency
        - Cons: Must discipline all writes through mutation layer

      The hybrid approach preserves the current architecture while eliminating
      the drift risk between audit trail and entity state.
