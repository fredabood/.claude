  title: Create relationship aggregation views
  description: |
    Create SQL views that aggregate relationship data from normalized tables
    back into JSON arrays matching YAML structure.

    CURRENT STATE:
    - entity_blocked_by has 102 rows (relationship data)
    - entity_blocks has 147 rows
    - entity_depends_on has 0 rows (not populated yet)
    - YAML files have blocked_by, blocks, depends_on as JSON arrays per entity
    - Comparison shows these as "missing columns" but data exists in tables

    VIEWS TO CREATE:

    1. v_task_relationships:
       SELECT
           t.id AS task_id,
           (SELECT json_group_array(json_object(
               'blocker_type', blocker_type,
               'blocker_id', blocker_id,
               'reason', reason
           )) FROM entity_blocked_by
           WHERE blocked_type = 'task' AND blocked_id = t.id) AS blocked_by,

           (SELECT json_group_array(json_object(
               'blocked_type', blocked_type,
               'blocked_id', blocked_id,
               'reason', reason
           )) FROM entity_blocks
           WHERE blocker_type = 'task' AND blocker_id = t.id) AS blocks
       FROM tasks t;

    2. v_sprint_relationships:
       Similar structure for sprints, including depends_on and depended_on_by

    3. v_track_relationships:
       Similar structure for tracks

    IMPLEMENTATION:
    1. Add views to schema.sql
    2. Test that views return valid JSON arrays
    3. Verify empty relationships return '[]' not NULL
    4. Update comparison script to use views for relationship comparison

    SUCCESS CRITERIA:
    - All 102 entity_blocked_by rows accessible via views
    - All 147 entity_blocks rows accessible via views
    - JSON output matches YAML array format
    - Comparison shows 0 gaps for relationship columns
