  task_type: development
  title: Analyze optimal directory structure mirroring SQLite schema
  description: "Design the new .vibey directory structure that mirrors SQLite database\
    \ 1:1.\nThis analysis informs the unified ticket architecture design.\n\nCURRENT\
    \ STRUCTURE ANALYSIS:\n- roadmap/ contains 36+ track folders\n- Each track contains\
    \ sprint folders (avg 3-5 per track)\n- Each sprint contains task folders (avg\
    \ 5-10 per sprint)\n- Total: ~36 tracks * 4 sprints * 7 tasks = ~1000 directories\n\
    - Depth: 5 levels (.vibey/roadmap/track/sprint/task/)\n\nPROPOSED STRUCTURE OPTIONS:\n\
    \nOption A: Table-based folders\n.vibey/roadmap/\n  tables/\n    tracks/     \
    \  # 36 files\n    sprints/      # 175 files\n    tasks/        # 892 files\n\
    \    audit_trail/  # 62 files\n  context/        # All context consolidated\n\n\
    Option B: Entity-type folders (flatter)\n.vibey/roadmap/\n  tracks.d/       #\
    \ 36 files\n  sprints.d/      # 175 files\n  tasks.d/        # 892 files\n  context.d/\
    \      # All context files\n\nOption C: Single folder with prefixes\n.vibey/roadmap/\n\
    \  entities/\n    track_<id>.yaml\n    sprint_<id>.yaml\n    task_<id>.yaml\n\n\
    EVALUATION CRITERIA:\n1. Dump/init simplicity (1:1 with SQL)\n2. File system navigation\
    \ ease\n3. Git diff readability\n4. Tool compatibility (glob patterns)\n5. Scalability\
    \ (10K+ tasks)\n\nDELIVERABLES:\n- Comparison matrix of options\n- Recommendation\
    \ with rationale\n- Sample directory tree for chosen approach\n- File naming convention\
    \ specification\n"
