  title: Implement Layer 3 - RoadmapTicket (Ultimate Parent)
  description: |
    Create the RoadmapTicket class - the top-level container in the hierarchy.
    Roadmap is ALWAYS an ultimate parent (is_ultimate_parent=True).

    DESIGN PRINCIPLE: L3 contains ONLY semantic-specific fields.
    All common fields and behaviors inherited from L1/L2.

    HIERARCHY CONSTRAINTS:
    - is_ultimate_parent: True (always - no parent allowed)
    - is_parent: True (always has Track children via CompletableTarget criteria)
    - is_child: False (never - root of hierarchy)
    - is_ultimate_child: False (never - always has children)

    These constraints are ENFORCED by validators - if someone tries to
    set parent_ref on a RoadmapTicket, validation fails.

    INHERITED FROM L1 (Ticket extends Completable):
    - From Completable: id, name, description, criteria (THE source of truth)
    - From Completable: is_complete, progress, blocking_reasons, children (computed)
    - Ticket-specific: status, lifecycle timestamps
    - Ticket-specific: assigned_agents, priority, commits, dependencies
    - Ticket-specific: requirements_local (templates for children)

    INHERITED FROM L2 (HierarchicalTicket):
    - Smart accessors: commits (aggregated), requirements_effective (local for root)
    - Smart accessors: all_criteria (explicit + instantiated from requirements)
    - Hierarchy traversal: parent, children_tickets, ancestors, descendants
    - Convenience accessors: deliverables, tests, subtasks, manual_checks

    ROADMAP-SPECIFIC FIELDS (L3 only):

    1. Type Discriminator:
       - ticket_type: Literal["roadmap"] = "roadmap"

    2. Version Management:
       - version: str (semantic version, default "0.1.0")
       - version_strategy: Optional[VersionStrategy]
       - version_history: list[VersionHistoryEntry]

    3. Target Dates:
       - target_completion: Optional[datetime]

    4. Deployment Tracking:
       - deployed_at: Optional[datetime]
       - deployed_platforms: list[PlatformDeployment]

    5. Activity Tracking:
       - activity_log: list[ActivityLogEntry]

    6. CHILD TYPE CONSTRAINT:
       - Children derived from CompletableTarget criteria (not explicit)
       - Must reference TrackTicket IDs in CompletableTarget criteria
       - get_tracks() -> list[TrackTicket] (typed accessor, filters criteria)

    Note on children: Roadmap's children (tracks) are determined by
    CompletableTarget criteria. Example:

    criteria:
      - id: "track-core"
        description: "Core framework track complete"
        target:
          type: "completable"
          completable_id: "core-framework"
          required_status: "completed"

    This criterion creates the parent-child relationship.

    SUPPORTING CLASSES (defined in support.py - Task 009):
    - VersionStrategy: scheme, auto_bump, components
    - ActivityLogEntry: timestamp, action, ticket_id, actor, details
    - PlatformDeployment: platform, context_window, deployed_at, primary

    ADDITIONAL SUPPORT CLASS (roadmap-specific):
    - VersionHistoryEntry:
      - version: str
      - released_at: datetime
      - milestone: Optional[str]
      - git_tag: Optional[str]
      - description: Optional[str]

    VALIDATORS:
    - parent_ref must be None (ultimate parent constraint)
    - version must be valid semver format
    - All CompletableTarget criteria must reference TrackTicket IDs

    COMPUTED PROPERTIES (via Completable base):
    - is_complete: all criteria met
    - progress: met_criteria / total_criteria
    - children: list of completable_ids from CompletableTarget criteria
    - tracks_total: len(subtasks) - subtasks filters CompletableTarget
    - tracks_completed: count where target.is_satisfied()

    METHODS:
    - get_tracks() -> list[TrackTicket]
    - bump_version(part: str) -> RoadmapTicket
    - log_activity(action: str, details: str) -> None

    IMPLEMENTATION:

    1. Add RoadmapTicket to vibey/roadmap/models/ticket/domain.py
    2. Inherit from HierarchicalTicket
    3. Add validator: parent_id must be None
    4. Add VersionHistoryEntry class (roadmap-specific)
    5. Implement typed child accessor (get_tracks)

    SUCCESS CRITERIA:
    - RoadmapTicket cannot have parent_ref set (validation error)
    - is_ultimate_parent always returns True
    - Children derived from CompletableTarget criteria
    - is_complete = all track criteria satisfied
    - Progress = tracks_completed / tracks_total
    - Version management works correctly
    - Activity log captures roadmap-level events
    - Smart accessors inherited from L2 work correctly
    - 100% test coverage
