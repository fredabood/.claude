    notes: |
      THINNER L3: Most fields now inherited from L1/L2.

      RoadmapTicket is unique because it's ALWAYS an ultimate parent.
      This means:
      - requirements_effective = requirements_local (no inheritance)
      - commits = aggregated (from all descendants)
      - progress = computed from criteria (tracks as CompletableTarget)

      KEY CHANGE: Children are now implicit via CompletableTarget criteria.
      Roadmap doesn't store `tracks` list - instead it has criteria like:
        criteria:
          - target: {type: completable, completable_id: "core-track"}

      The `children` property derives track IDs from these criteria.

      The hierarchy constraint (parent_ref=None) is enforced via validator.

      Tasks 003-006 can run in parallel after Tasks 001-002 complete.
