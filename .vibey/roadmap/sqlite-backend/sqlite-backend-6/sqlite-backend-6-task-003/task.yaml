  task_type: development
  title: Design context file consolidation strategy
  description: "Plan consolidation of context files from scattered track/sprint/task\
    \ folders\ninto a single organized location. This informs the unified architecture\
    \ design.\n\nCURRENT STATE:\nContext files are scattered across:\n- .vibey/roadmap/<track>/context/\n\
    - .vibey/roadmap/<track>/<sprint>/context/\n- .vibey/roadmap/<track>/<sprint>/<task>/context/\n\
    \nFile types found:\n- TRACK_AUDIT_REPORT.md\n- REMEDIATION_*.md\n- IMPLEMENTATION_PLAN.md\n\
    - SESSION_*.md\n- TEST_*.md\n- Various dated files (*_2025-*.md)\n\nPROPOSED CONSOLIDATION:\n\
    \nOption A: Flat with naming convention\n.vibey/roadmap/context/\n  <track>_AUDIT.md\n\
    \  <track>_<sprint>_PLAN.md\n  <track>_<sprint>_<task>_<timestamp>_<title>.md\n\
    \nOption B: Hierarchical by scope\n.vibey/roadmap/context/\n  tracks/\n    <track>/\n\
    \      AUDIT.md\n      ...\n  sprints/\n    <sprint>/\n      PLAN.md\n      ...\n\
    \  tasks/\n    <task>/\n      <timestamp>_<title>.md\n\nOption C: Hierarchical\
    \ by type\n.vibey/roadmap/context/\n  audits/\n    <track>_AUDIT.md\n  plans/\n\
    \    <sprint>_PLAN.md\n  sessions/\n    <timestamp>_<title>.md\n\nCONSIDERATIONS:\n\
    1. Preserve historical context (don't lose files)\n2. Easy to find context for\
    \ specific entity\n3. Scalable naming (no collisions)\n4. Git-friendly (stable\
    \ paths)\n5. Archive strategy for old files\n\nMIGRATION REQUIREMENTS:\n- Inventory\
    \ all existing context files\n- Map old paths to new paths\n- Create migration\
    \ script design\n- Update any code referencing context paths\n- Preserve git history\
    \ if possible\n\nDELIVERABLES:\n- Context file inventory (count per location)\n\
    - Recommended structure\n- Naming convention specification\n- Migration script\
    \ design\n"
