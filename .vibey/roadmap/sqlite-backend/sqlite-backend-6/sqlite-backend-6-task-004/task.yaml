  title: Define Enum Types for Unified Completion Model
  description: "Create all enum types needed by the unified completion model.\nThis\
    \ is the foundation - everything else imports from here.\n\nDESIGN PRINCIPLE:\
    \ Single source of truth for all type values.\nAll enums defined here, imported\
    \ everywhere else.\n\nENUM DEFINITIONS:\n\n1. TicketStatus (lifecycle states)\n\
    \   Values:\n   - NOT_STARTED = \"not_started\"\n   - IN_PROGRESS = \"in_progress\"\
    \n   - PAUSED = \"paused\"\n   - COMPLETED = \"completed\"\n   - CANCELLED = \"\
    cancelled\"\n\n2. TicketType (hierarchy discriminator)\n   Values:\n   - ROADMAP\
    \ = \"roadmap\"\n   - TRACK = \"track\"\n   - SPRINT = \"sprint\"\n   - TASK =\
    \ \"task\"\n\n3. TaskType (semantic task classification)\n   Values:\n   - DEVELOPMENT\
    \ = \"development\"\n   - DOCUMENTATION = \"documentation\"\n   - TESTING = \"\
    testing\"\n   - RESEARCH = \"research\"\n   - REVIEW = \"review\"\n   - INFRASTRUCTURE\
    \ = \"infrastructure\"\n\n4. CriterionTargetType (polymorphic target discriminator)\n\
    \   Values:\n   - COMPLETABLE = \"completable\"      # Another ticket must be\
    \ complete\n   - FILE_EXISTS = \"file_exists\"      # File(s) must exist\n   -\
    \ TEST_PASSES = \"test_passes\"      # Test must pass\n   - THRESHOLD = \"threshold\"\
    \          # Metric meets threshold\n   - MANUAL = \"manual\"                #\
    \ Human assessment\n   - EXTERNAL = \"external\"            # External system\
    \ check\n\n5. ThresholdComparison (how to compare values)\n   Values:\n   - GTE\
    \ = \"gte\"   # >= (at least)\n   - GT = \"gt\"     # > (more than)\n   - EQ =\
    \ \"eq\"     # == (exactly)\n   - LTE = \"lte\"   # <= (at most)\n   - LT = \"\
    lt\"     # < (less than)\n\n6. Priority (ticket priority levels)\n   Values:\n\
    \   - CRITICAL = \"critical\"\n   - HIGH = \"high\"\n   - MEDIUM = \"medium\"\n\
    \   - LOW = \"low\"\n\n7. Complexity (work complexity estimate)\n   Values:\n\
    \   - LOW = \"low\"\n   - MEDIUM = \"medium\"\n   - HIGH = \"high\"\n\n8. InheritMode\
    \ (requirement inheritance behavior)\n   Values:\n   - INHERIT = \"inherit\" \
    \   # Use stricter of local vs ancestor\n   - OVERRIDE = \"override\"  # Replace\
    \ ancestor entirely\n   - SKIP = \"skip\"          # Explicitly not applicable\n\
    \n9. EnforcementMode (how strictly requirement applies)\n   Values:\n   - BLOCKING\
    \ = \"blocking\"      # Prevents completion\n   - WARNING = \"warning\"      \
    \  # Shows warning, allows completion\n   - AUDIT = \"audit\"            # Logs\
    \ only\n\n10. RequirementType (what kind of requirement)\n    Values:\n    - TEST_COVERAGE\
    \ = \"test_coverage\"\n    - CODE_STYLE = \"code_style\"\n    - DOCUMENTATION\
    \ = \"documentation\"\n    - SECURITY = \"security\"\n    - PERFORMANCE = \"performance\"\
    \n    - REVIEW = \"review\"\n    - CUSTOM = \"custom\"\n\n11. DependencyType (sibling\
    \ relationship type)\n    Values:\n    - BLOCKS = \"blocks\"           # This\
    \ blocks that\n    - DEPENDS_ON = \"depends_on\"   # This depends on that\n  \
    \  - RELATED = \"related\"         # Informational link\n\nIMPLEMENTATION:\n\n\
    1. Create vibey/roadmap/models/ticket/enums.py\n2. Use Python StrEnum pattern\
    \ for JSON/YAML serialization:\n   class TicketStatus(str, Enum):\n       NOT_STARTED\
    \ = \"not_started\"\n\n3. Add docstrings for each enum and value\n4. Export all\
    \ enums from __init__.py\n\nSUCCESS CRITERIA:\n- All 11 enum types defined\n-\
    \ StrEnum pattern for serialization\n- Comprehensive docstrings\n- 100% test coverage\n"
