    notes: |
      CORE LAYER 1 TASK

      Key design decisions:

      1. Ticket IS-A Completable
         - Inherits criteria-based completion
         - Inherits can_transition_to() unified interface
         - Adds work semantics (lifecycle, assignment, etc.)

      2. Parent-child via criteria
         - CompletableTarget with blocks_transition_to=COMPLETED
         - parent_ref is denormalized for fast lookup
         - children computed from criteria

      3. Dependencies UNIFIED into criteria
         - NO separate dependencies field
         - Dependencies = criteria with blocks_transition_to=IN_PROGRESS
         - Same Criterion class, different blocks_transition_to value

      4. ALL transitions are deterministic
         - can_transition_to(status) is THE unified interface
         - start() checks can_start() (IN_PROGRESS criteria)
         - complete() checks can_complete() (COMPLETED criteria)
         - deploy() checks can_deploy() (PRODUCTION_READY criteria)
         - THE guardrail for AI manipulation applies to ALL states
