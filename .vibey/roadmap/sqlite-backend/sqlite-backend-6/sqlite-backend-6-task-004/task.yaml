  roadmap_id: vibey-framework-v2
  task_type: development
  title: Implement Layer 1 - Ticket Base Class
  description: |
    Create the Ticket class that extends Completable with work-specific
    semantics. This is Layer 1 of the three-layer architecture.

    DESIGN PRINCIPLE: Ticket IS a Completable with additional work
    tracking (lifecycle, assignment, commits, dependencies).

    Completion is determined by criteria (inherited from Completable).
    Ticket adds work semantics on top.

    LAYER 1 FIELDS:

    1. From Completable (inherited):
       - id: str
       - name: str
       - description: Optional[str]
       - criteria: List[Criterion]

       Computed (inherited):
       - is_complete: bool
       - progress: Progress
       - blocking_reasons: List[str]
       - children: List[str]

    2. Identity Extension:
       - parent_ref: Optional[str]
         (denormalized for fast parent lookup)

       Note: parent_ref is set when this ticket is referenced by a
       CompletableTarget criterion in another ticket. It's denormalized
       for O(1) lookup, but the source of truth is the criterion.

    3. Lifecycle (Ticket-specific):
       - status: TicketStatus
         (not_started, in_progress, paused, completed, cancelled)

       - created_at: datetime
       - started_at: Optional[datetime]
       - completed_at: Optional[datetime]
       - updated_at: datetime

       Lifecycle rules:
       - IN_PROGRESS requires started_at
       - COMPLETED requires completed_at AND is_complete == True
       - Cannot complete if is_complete == False (criteria not met)

    4. Work Assignment:
       - assigned_agents: List[str]
       - priority: Priority

    5. Work Evidence:
       - commits: List[GitCommit]
         (git commits associated with this work)

    6. Sibling Dependencies (NOW UNIFIED INTO CRITERIA):
       Dependencies are NO LONGER a separate field. They are expressed
       as Criterion with blocks_transition_to=IN_PROGRESS.

       Example - Task 003 depends on Task 002:
       criteria:
         - id: dep-task-002
           description: "Task 002 must complete before starting"
           target:
             type: completable
             completable_id: task-002
             required_status: completed
           blocks_transition_to: in_progress  # <-- Makes it a dependency

       Note: Parent-child is ALSO via criteria (CompletableTarget), but
       with blocks_transition_to=COMPLETED (the default).

       Computed:
       - is_blocked: bool = not can_start()[0]
         (can_start checks criteria where blocks_transition_to=IN_PROGRESS)

    7. Requirement Templates:
       - requirements_local: List[Requirement]
         (requirement templates defined on this ticket)

       Note: These cascade to children. Actual criteria are generated
       by RequirementInstantiator when the ticket is created/updated.

    8. Estimation:
       - estimated_duration: Optional[str]

    9. Metadata:
       - metadata: Dict[str, Any]

    HIERARCHY ATTRIBUTES (computed from Completable):

    - is_parent: bool
      Computed: len(children) > 0
      True if this ticket has child tickets (via CompletableTarget criteria)

    - is_child: bool
      Computed: parent_ref is not None
      True if this ticket is referenced by another ticket's criterion

    - is_ultimate_parent: bool
      Computed: is_parent and not is_child
      True for root tickets (Roadmap)

    - is_ultimate_child: bool
      Computed: is_child and not is_parent
      True for leaf tickets (Task)

    - is_intermediate: bool
      Computed: is_parent and is_child
      True for middle tickets (Track, Sprint)

    KEY METHODS:

    1. Lifecycle Transitions (inherited from Completable, extended):
       - can_transition_to(status: TicketStatus) -> tuple[bool, List[str]]
         THE unified interface for ALL transition checks
       - can_start() -> tuple[bool, List[str]]
         = can_transition_to(IN_PROGRESS)
       - can_complete() -> tuple[bool, List[str]]
         = can_transition_to(COMPLETED)
       - can_deploy() -> tuple[bool, List[str]]
         = can_transition_to(PRODUCTION_READY)

       - start() -> Ticket (checks can_start first)
       - complete() -> Ticket (checks can_complete first)
       - pause() -> Ticket
       - cancel() -> Ticket

       Note: All transitions use can_transition_to() which checks
       criteria filtered by blocks_transition_to. This is THE
       deterministic interface.

    2. Criterion Management (inherited from Completable):
       - get_criterion(id: str) -> Optional[Criterion]
       - add_criterion(criterion: Criterion) -> None
       - remove_criterion(id: str) -> bool
       - refresh_criteria() -> None

    3. Progress Per Transition:
       - progress_for_transition(status: TicketStatus) -> Progress
       - start_progress: Progress (toward IN_PROGRESS)
       - completion_progress: Progress (toward COMPLETED)
       - deploy_progress: Progress (toward PRODUCTION_READY)

    4. Convenience Accessors (filter criteria by target type):
       - deliverables: List[Criterion]
         (criteria with FileExistsTarget)

       - tests: List[Criterion]
         (criteria with TestPassesTarget)

       - subtasks: List[Criterion]
         (criteria with CompletableTarget, blocks_transition_to=COMPLETED)

       - dependencies: List[Criterion]
         (criteria with CompletableTarget, blocks_transition_to=IN_PROGRESS)

       - manual_checks: List[Criterion]
         (criteria with ManualTarget)

       - production_gates: List[Criterion]
         (criteria with blocks_transition_to=PRODUCTION_READY)

    VALIDATION RULES:

    1. Status consistency:
       - IN_PROGRESS requires started_at to be set
       - COMPLETED requires completed_at AND can_complete() == True
       - PRODUCTION_READY requires can_deploy() == True
       - PAUSED is always allowed

    2. Unified Blocking (via can_transition_to):
       - Cannot transition to IN_PROGRESS if can_start() fails
       - Cannot transition to COMPLETED if can_complete() fails
       - Cannot transition to PRODUCTION_READY if can_deploy() fails

       All checks use the same mechanism: filter criteria by
       blocks_transition_to, check if all are met.

    3. Timestamps:
       - started_at >= created_at
       - completed_at >= started_at

    4. Parent consistency:
       - If parent_ref is set, that parent must have a CompletableTarget
         criterion referencing this ticket's id

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/ticket.py:
       - Ticket class extending Completable
       - All lifecycle methods
       - Convenience accessors
       - Validation

    2. Use Pydantic v2 features:
       - Field() with descriptions
       - field_validator for field-level validation
       - model_validator for cross-field validation
       - computed_field for derived properties
       - model_copy() for immutable updates

    FILE STRUCTURE:
    vibey/roadmap/models/ticket/
      __init__.py
      enums.py          <- Task 010
      completable.py    <- Task 009
      targets.py        <- Task 009
      support.py        <- Task 009
      requirements.py   <- Task 011
      ticket.py         <- This task (Layer 1)
      hierarchical.py   <- Task 002 (Layer 2)
      domain.py         <- Tasks 003-006 (Layer 3)

    SUCCESS CRITERIA:
    - Ticket extends Completable correctly
    - Lifecycle transitions use unified can_transition_to()
    - Dependencies expressed as criteria (blocks_transition_to: IN_PROGRESS)
    - No separate dependencies field - all in criteria
    - start() checks can_start(), complete() checks can_complete()
    - Hierarchy attributes computed correctly
    - Convenience accessors filter by target type AND blocks_transition_to
    - Progress tracked per transition type
    - Full test coverage
