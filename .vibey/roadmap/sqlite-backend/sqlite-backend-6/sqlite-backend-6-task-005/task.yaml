  title: Implement Layer 2 - HierarchicalTicket Smart Accessors
  description: |
    Create HierarchicalTicket that extends Ticket with smart accessors
    for aggregation and inheritance. This is Layer 2 of the architecture.

    DESIGN PRINCIPLE: Smart accessors use hierarchy attributes to
    determine field behavior automatically. No L3 knowledge needed.

    LAYER 2 SMART ACCESSORS:

    1. commits (aggregation):
       @property
       def commits(self) -> List[GitCommit]:
           """
           Commits: local if leaf, aggregated if parent.

           - is_ultimate_child: return self._commits_local
           - is_parent: aggregate from all children recursively
           """
           if self.is_ultimate_child:
               return self._commits_local
           return self._aggregate_commits()

       def _aggregate_commits(self) -> List[GitCommit]:
           """Collect commits from all descendant tickets."""
           all_commits = list(self._commits_local)
           for child_id in self.children:
               child = self._load_child(child_id)
               all_commits.extend(child.commits)  # Recursive
           return sorted(all_commits, key=lambda c: c.timestamp)

    2. requirements_effective (inheritance):
       @property
       def requirements_effective(self) -> List[Requirement]:
           """
           Requirements: local if root, effective (inherited) if child.

           Uses RequirementResolver to handle inheritance modes:
           - INHERIT: stricter of local vs ancestor
           - OVERRIDE: local replaces ancestor
           - SKIP: explicitly excluded
           """
           if self.is_ultimate_parent:
               return self.requirements_local
           return RequirementResolver().resolve(self)

    3. instantiated_criteria (from requirements):
       @property
       def instantiated_criteria(self) -> List[Criterion]:
           """
           Criteria generated from applicable requirements.

           These are ADDED to explicit criteria, not replacing them.
           """
           return RequirementInstantiator().instantiate(self)

       @property
       def all_criteria(self) -> List[Criterion]:
           """Explicit criteria + instantiated from requirements."""
           return self.criteria + self.instantiated_criteria

    4. progress_for_transition (computed from criteria):
       def progress_for_transition(self, status: TicketStatus) -> Progress:
           """
           Progress toward a specific transition.

           Filters all_criteria by blocks_transition_to, then computes:
           progress = met_criteria / total_criteria
           """
           relevant = [c for c in self.all_criteria
                       if c.blocks_transition_to == status]
           total = len(relevant)
           met = sum(1 for c in relevant if c.is_met())
           return Progress(total=total, completed=met)

       @computed_field
       def progress(self) -> Progress:
           """Default progress (toward COMPLETED)."""
           return self.progress_for_transition(TicketStatus.COMPLETED)

       @computed_field
       def start_progress(self) -> Progress:
           """Progress toward being able to start (IN_PROGRESS)."""
           return self.progress_for_transition(TicketStatus.IN_PROGRESS)

       @computed_field
       def deploy_progress(self) -> Progress:
           """Progress toward production readiness."""
           return self.progress_for_transition(TicketStatus.PRODUCTION_READY)

    CONVENIENCE ACCESSORS:

    These filter criteria by target type AND blocks_transition_to:

    @property
    def deliverables(self) -> List[Criterion]:
        """File-based criteria (FileExistsTarget)."""
        return [c for c in self.all_criteria
                if isinstance(c.target, FileExistsTarget)]

    @property
    def tests(self) -> List[Criterion]:
        """Test-based criteria (TestPassesTarget)."""
        return [c for c in self.all_criteria
                if isinstance(c.target, TestPassesTarget)]

    @property
    def subtasks(self) -> List[Criterion]:
        """Child ticket criteria (CompletableTarget blocking COMPLETED)."""
        return [c for c in self.all_criteria
                if isinstance(c.target, CompletableTarget)
                and c.blocks_transition_to == TicketStatus.COMPLETED]

    @property
    def dependencies(self) -> List[Criterion]:
        """Sibling dependencies (CompletableTarget blocking IN_PROGRESS)."""
        return [c for c in self.all_criteria
                if isinstance(c.target, CompletableTarget)
                and c.blocks_transition_to == TicketStatus.IN_PROGRESS]

    @property
    def thresholds(self) -> List[Criterion]:
        """Threshold-based criteria (ThresholdTarget)."""
        return [c for c in self.all_criteria
                if isinstance(c.target, ThresholdTarget)]

    @property
    def manual_checks(self) -> List[Criterion]:
        """Manual assessment criteria (ManualTarget)."""
        return [c for c in self.all_criteria
                if isinstance(c.target, ManualTarget)]

    @property
    def production_gates(self) -> List[Criterion]:
        """Production deployment gates (any target blocking PRODUCTION_READY)."""
        return [c for c in self.all_criteria
                if c.blocks_transition_to == TicketStatus.PRODUCTION_READY]

    HIERARCHY TRAVERSAL:

    @property
    def parent(self) -> Optional[HierarchicalTicket]:
        """Load parent ticket if exists."""
        if self.parent_ref is None:
            return None
        return self._load_ticket(self.parent_ref)

    @property
    def children_tickets(self) -> List[HierarchicalTicket]:
        """Load all child tickets."""
        return [self._load_ticket(child_id) for child_id in self.children]

    @property
    def ancestors(self) -> List[HierarchicalTicket]:
        """All ancestors from parent to root."""
        result = []
        current = self.parent
        while current is not None:
            result.append(current)
            current = current.parent
        return result

    @property
    def descendants(self) -> List[HierarchicalTicket]:
        """All descendants (children, grandchildren, etc.)."""
        result = []
        for child in self.children_tickets:
            result.append(child)
            result.extend(child.descendants)
        return result

    LOADER ABSTRACTION:

    The _load_ticket and _load_child methods use dependency injection:

    class TicketLoader(Protocol):
        def load(self, ticket_id: str) -> HierarchicalTicket: ...

    class HierarchicalTicket(Ticket):
        _loader: ClassVar[Optional[TicketLoader]] = None

        @classmethod
        def set_loader(cls, loader: TicketLoader) -> None:
            cls._loader = loader

        def _load_ticket(self, ticket_id: str) -> HierarchicalTicket:
            if self._loader is None:
                raise RuntimeError("No loader configured")
            return self._loader.load(ticket_id)

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/hierarchical.py:
       - HierarchicalTicket class extending Ticket
       - All smart accessors
       - Hierarchy traversal methods
       - Loader abstraction

    2. Integrate with RequirementResolver from Task 011
    3. Full test coverage with mock loader

    SUCCESS CRITERIA:
    - All smart accessors work correctly
    - Aggregation collects from all descendants
    - Inheritance resolves with correct modes
    - Instantiated criteria added to explicit criteria
    - progress_for_transition filters by blocks_transition_to
    - progress, start_progress, deploy_progress computed correctly
    - Convenience accessors filter by target type AND blocks_transition_to
    - dependencies accessor returns criteria blocking IN_PROGRESS
    - subtasks accessor returns criteria blocking COMPLETED
    - production_gates accessor returns criteria blocking PRODUCTION_READY
    - Full test coverage
