    notes: |
      LAYER 2 - Smart accessor pattern.

      Key insight: Behavior is determined by hierarchy attributes
      (is_parent, is_child, etc.) from L1. No L3 knowledge needed.

      UNIFIED BLOCKING MODEL:
      All blocking relationships use Criterion with blocks_transition_to.
      Progress is computed per transition type.

      Smart accessor behavior table:
      ┌─────────────┬────────────┬─────────────┬──────────┐
      │ Type        │ commits    │ requirements│ progress │
      ├─────────────┼────────────┼─────────────┼──────────┤
      │ Roadmap     │ aggregated │ local       │ computed │
      │ Track       │ aggregated │ effective   │ computed │
      │ Sprint      │ aggregated │ effective   │ computed │
      │ Task        │ local      │ effective   │ computed │
      └─────────────┴────────────┴─────────────┴──────────┘

      Progress computed per transition:
      - progress = toward COMPLETED (default)
      - start_progress = toward IN_PROGRESS
      - deploy_progress = toward PRODUCTION_READY

      Convenience accessors distinguish by blocks_transition_to:
      - subtasks = CompletableTarget + blocks COMPLETED (parent-child)
      - dependencies = CompletableTarget + blocks IN_PROGRESS (siblings)
