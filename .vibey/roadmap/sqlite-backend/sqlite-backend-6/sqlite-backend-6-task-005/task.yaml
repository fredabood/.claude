  title: Implement Layer 3 - SprintTicket (Intermediate)
  description: |
    Create the SprintTicket class - the deployable unit of work.
    Sprint is ALWAYS intermediate (is_intermediate=True).

    DESIGN PRINCIPLE: L3 contains ONLY semantic-specific fields.
    All common fields and behaviors inherited from L1/L2.

    HIERARCHY CONSTRAINTS:
    - is_intermediate: True (always - has both parent and children)
    - is_parent: True (always has Task children via CompletableTarget criteria)
    - is_child: True (always has Track parent via parent_ref)
    - is_ultimate_parent: False
    - is_ultimate_child: False

    INHERITED FROM L1 (Ticket extends Completable):
    - From Completable: id, name, description, criteria (THE source of truth)
    - From Completable: is_complete, progress, blocking_reasons, children (computed)
    - Ticket-specific: status, lifecycle timestamps
    - Ticket-specific: assigned_agents, priority, commits, dependencies
    - Ticket-specific: requirements_local (templates for children)
    - Ticket-specific: parent_ref (denormalized for fast lookup)

    INHERITED FROM L2 (HierarchicalTicket):
    - Smart accessors: commits (aggregated from tasks)
    - Smart accessors: requirements_effective (merged from track + roadmap + local)
    - Hierarchy traversal: parent, children_tickets, ancestors, descendants
    - Convenience accessors: deliverables, tests, subtasks, manual_checks

    SPRINT-SPECIFIC FIELDS (L3 only):

    1. Type Discriminator:
       - ticket_type: Literal["sprint"] = "sprint"

    2. Parent References:
       - track_id: str (required, must match parent_id)
       - roadmap_id: str (required, grandparent reference)

    3. Extended Lifecycle (sprint has more lifecycle stages):
       - completion_gate_check_at: Optional[datetime]
       - production_gate_check_at: Optional[datetime]
       - production_ready_at: Optional[datetime]
       - deployed_at: Optional[datetime]

    4. Planning:
       - plan_file: Optional[str] (path to sprint plan document)
       - goal: Optional[str] (sprint objective)
       - success_criteria_text: list[str] (human-readable, NOT the same as criteria)
       - risks: list[str]

       NOTE: success_criteria_text is LEGACY - human-readable descriptions.
       The actual completion criteria are in the `criteria` field from Completable.
       success_criteria_text may be deprecated in favor of criteria descriptions.

    5. Estimation:
       - estimated_tokens: Optional[int] (aggregate from tasks)
       - actual_tokens: Optional[int] (aggregate from tasks)

    6. Development Gates (sprint-specific blocking):
       - development_gates: list[DevelopmentGate]

    7. PARENT TYPE CONSTRAINT:
       - parent_ref must reference a TrackTicket ID
       - get_track() -> TrackTicket

    8. CHILD TYPE CONSTRAINT:
       - Children derived from CompletableTarget criteria
       - Must reference TaskTicket IDs in CompletableTarget criteria
       - get_tasks() -> list[TaskTicket] (typed accessor, filters criteria)

    Note on children: Sprint's children (tasks) are determined by
    CompletableTarget criteria. Example:

    criteria:
      - id: "task-001"
        description: "Task 001 complete"
        target:
          type: "completable"
          completable_id: "sqlite-backend-6-task-001"
          required_status: "completed"

    SUPPORTING CLASS (sprint-specific):
    - DevelopmentGate:
      - name: str
      - description: Optional[str]
      - status: GateStatus
      - resolved_at: Optional[datetime]
      - blocking: bool = True

    VALIDATORS:
    - parent_ref must be set and match track_id
    - Sprint ID must start with track_id + "-"
    - track_id and roadmap_id must be set
    - Extended lifecycle timestamps must be in order
    - All CompletableTarget criteria must reference TaskTicket IDs

    COMPUTED PROPERTIES (via Completable base):
    - is_complete: all criteria met
    - progress: met_criteria / total_criteria
    - children: list of completable_ids from CompletableTarget criteria
    - tasks_total: len(subtasks)
    - tasks_completed: count where target.is_satisfied()
    - development_tasks_completed: count dev tasks where complete
    - completion_gates_passed: count gate tasks where complete

    METHODS:
    - get_track() -> TrackTicket
    - get_tasks() -> list[TaskTicket]
    - can_enter_completion_gate_check() -> bool (all dev tasks complete)
    - can_complete() -> bool (all dev + completion gates done)
    - can_be_production_ready() -> bool (all tasks including prod gates)

    IMPLEMENTATION:

    1. Add SprintTicket to vibey/roadmap/models/ticket/domain.py
    2. Inherit from HierarchicalTicket
    3. Add DevelopmentGate class
    4. Implement extended lifecycle validators
    5. Implement lifecycle transition methods

    SUCCESS CRITERIA:
    - SprintTicket must have track_id and roadmap_id
    - is_intermediate always returns True
    - Children derived from CompletableTarget criteria
    - is_complete = all task criteria satisfied
    - Progress = tasks_completed / tasks_total
    - Extended lifecycle timestamps validated in order
    - Development gates block sprint completion
    - Smart accessors work correctly
    - 100% test coverage
