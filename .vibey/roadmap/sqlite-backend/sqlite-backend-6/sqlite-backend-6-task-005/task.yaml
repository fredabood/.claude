    notes: |
      THINNER L3: Most fields now inherited from L1/L2.

      SprintTicket is intermediate but has the MOST complex lifecycle
      with multiple gate checks (completion, production).

      Smart accessors from L2 handle:
      - requirements_effective = merged (from track + roadmap + local)
      - commits = aggregated (from all tasks)
      - progress = computed from criteria (tasks as CompletableTarget)

      KEY CHANGE: Children are now implicit via CompletableTarget criteria.
      Sprint doesn't store `tasks` list - instead it has criteria like:
        criteria:
          - target: {type: completable, completable_id: "sqlite-backend-6-task-001"}

      The `children` property derives task IDs from these criteria.

      Sprint-specific behavior:
      - Extended lifecycle with gate checks
      - Development gates that block completion
      - Task type breakdown (dev vs gate tasks)

      Can run in parallel with tasks 003, 004, 006.
