  title: Implement Layer 3 - TrackTicket (Intermediate)
  description: |
    Create the TrackTicket class - the parallelization boundary.
    Track is ALWAYS intermediate (is_intermediate=True).

    DESIGN PRINCIPLE: L3 contains ONLY semantic-specific fields.
    All common fields and behaviors inherited from L1/L2.

    HIERARCHY CONSTRAINTS:
    - is_intermediate: True (always - has both parent and children)
    - is_parent: True (always has Sprint children via CompletableTarget criteria)
    - is_child: True (always has Roadmap parent via parent_ref)
    - is_ultimate_parent: False (never - always has parent)
    - is_ultimate_child: False (never - always has children)

    These constraints are ENFORCED by validators.

    INHERITED FROM L1 (Ticket extends Completable):
    - From Completable: id, name, description, criteria (THE source of truth)
    - From Completable: is_complete, progress, blocking_reasons, children (computed)
    - Ticket-specific: status, lifecycle timestamps
    - Ticket-specific: assigned_agents, priority, commits, dependencies
    - Ticket-specific: requirements_local (templates for children)
    - Ticket-specific: parent_ref (denormalized for fast lookup)

    INHERITED FROM L2 (HierarchicalTicket):
    - Smart accessors: commits (aggregated from sprints/tasks)
    - Smart accessors: requirements_effective (merged from roadmap + local)
    - Hierarchy traversal: parent, children_tickets, ancestors, descendants
    - Convenience accessors: deliverables, tests, subtasks, manual_checks

    TRACK-SPECIFIC FIELDS (L3 only):

    1. Type Discriminator:
       - ticket_type: Literal["track"] = "track"

    2. Parent Reference:
       - roadmap_id: str (required, must match parent_id)

    3. Priority:
       - priority: Priority enum (critical, high, medium, low)

    4. Strategic Context:
       - strategic_value: list[str] (why this track matters)

    5. PARENT TYPE CONSTRAINT:
       - parent_ref must reference a RoadmapTicket ID
       - get_roadmap() -> RoadmapTicket (typed accessor)

    6. CHILD TYPE CONSTRAINT:
       - Children derived from CompletableTarget criteria
       - Must reference SprintTicket IDs in CompletableTarget criteria
       - get_sprints() -> list[SprintTicket] (typed accessor, filters criteria)

    Note on children: Track's children (sprints) are determined by
    CompletableTarget criteria. Example:

    criteria:
      - id: "sprint-1"
        description: "Sprint 1 complete"
        target:
          type: "completable"
          completable_id: "sqlite-backend-1"
          required_status: "completed"

    VALIDATORS:
    - parent_ref must be set (intermediate constraint)
    - parent_ref must equal roadmap_id
    - Parent must be RoadmapTicket type (loaded and checked)
    - All CompletableTarget criteria must reference SprintTicket IDs
    - Track ID format: simple slug (no "/" or leading "-")

    COMPUTED PROPERTIES (via Completable base):
    - is_complete: all criteria met
    - progress: met_criteria / total_criteria
    - children: list of completable_ids from CompletableTarget criteria
    - sprints_total: len(subtasks)
    - sprints_completed: count where target.is_satisfied()
    - tasks_total: sum of sprint.progress.total for all sprints
    - tasks_completed: sum of sprint.progress.completed for all sprints

    METHODS:
    - get_roadmap() -> RoadmapTicket
    - get_sprints() -> list[SprintTicket]

    IMPLEMENTATION:

    1. Add TrackTicket to vibey/roadmap/models/ticket/domain.py
    2. Inherit from HierarchicalTicket
    3. Add validator: parent_id must be set and match roadmap_id
    4. Implement typed parent/child accessors

    SUCCESS CRITERIA:
    - TrackTicket must have parent_ref set (validation error if None)
    - is_intermediate always returns True
    - Children derived from CompletableTarget criteria
    - is_complete = all sprint criteria satisfied
    - Progress = sprints_completed / sprints_total
    - Requirements from track + roadmap cascade to sprints/tasks
    - Smart accessors work correctly (inheritance + aggregation)
    - 100% test coverage
