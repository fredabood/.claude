  title: Implement Layer 2 - HierarchicalTicket Smart Accessors
  description: "Create HierarchicalTicket that extends Ticket with smart accessors\n\
    for aggregation, inheritance, and sibling ordering. This is Layer 2 of the architecture.\n\n\
    DESIGN PRINCIPLE: Smart accessors use hierarchy attributes to\n\
    determine field behavior automatically. No L3 knowledge needed.\n\n\
    ULID IDENTITY & ORDERING (Part 14 of UNIFIED_TICKET_ARCHITECTURE.md):\n\n\
    HierarchicalTicket adds fields for stable identity and ordering:\n\n\
    1. parent_id: Optional[str]  # ULID reference to parent (not slug!)\n\
    2. sequence: int = 0         # Explicit ordering among siblings (mutable)\n\
    3. slug: str = ''            # Human-readable path segment (mutable)\n\n\
    SIBLING NAVIGATION (based on sequence, not ID):\n\n\
    @property\n\
    def siblings(self) -> List['HierarchicalTicket']:\n\
        '''Other children of same parent, sorted by sequence.'''\n\
        if self.parent_id is None:\n\
            return []\n\
        return self._get_siblings_by_parent_id()\n\n\
    @property\n\
    def next_sibling(self) -> Optional['HierarchicalTicket']:\n\
        '''Next sibling by sequence (not by ID!).'''\n\n\
    @property\n\
    def prev_sibling(self) -> Optional['HierarchicalTicket']:\n\
        '''Previous sibling by sequence.'''\n\n\
    def reorder(self, new_sequence: int) -> None:\n\
        '''Change position without changing identity.'''\n\
        self.sequence = new_sequence\n\
        # Note: Does NOT change self.id - identity is immutable\n\n\
    KEY BENEFITS:\n\
    - Rename entity -> ID stable, references intact\n\
    - Reorder siblings -> sequence changes, ID stable\n\
    - Git history follows ULID across file moves\n\
    - Priority explicit field, not inferred from task number\n\n\
    LAYER 2 SMART ACCESSORS:\n\n1. commits\
    \ (aggregation):\n   @property\n   def commits(self) -> List[GitCommit]:\n   \
    \    \"\"\"\n       Commits: local if leaf, aggregated if parent.\n\n       -\
    \ is_ultimate_child: return self._commits_local\n       - is_parent: aggregate\
    \ from all children recursively\n       \"\"\"\n       if self.is_ultimate_child:\n\
    \           return self._commits_local\n       return self._aggregate_commits()\n\
    \n   def _aggregate_commits(self) -> List[GitCommit]:\n       \"\"\"Collect commits\
    \ from all descendant tickets.\"\"\"\n       all_commits = list(self._commits_local)\n\
    \       for child_id in self.children:\n           child = self._load_child(child_id)\n\
    \           all_commits.extend(child.commits)  # Recursive\n       return sorted(all_commits,\
    \ key=lambda c: c.timestamp)\n\n2. requirements_effective (inheritance):\n   @property\n\
    \   def requirements_effective(self) -> List[Requirement]:\n       \"\"\"\n  \
    \     Requirements: local if root, effective (inherited) if child.\n\n       Uses\
    \ RequirementResolver to handle inheritance modes:\n       - INHERIT: stricter\
    \ of local vs ancestor\n       - OVERRIDE: local replaces ancestor\n       - SKIP:\
    \ explicitly excluded\n       \"\"\"\n       if self.is_ultimate_parent:\n   \
    \        return self.requirements_local\n       return RequirementResolver().resolve(self)\n\
    \n3. instantiated_criteria (from requirements):\n   @property\n   def instantiated_criteria(self)\
    \ -> List[Criterion]:\n       \"\"\"\n       Criteria generated from applicable\
    \ requirements.\n\n       These are ADDED to explicit criteria, not replacing\
    \ them.\n       \"\"\"\n       return RequirementInstantiator().instantiate(self)\n\
    \n   @property\n   def all_criteria(self) -> List[Criterion]:\n       \"\"\"Explicit\
    \ criteria + instantiated from requirements.\"\"\"\n       return self.criteria\
    \ + self.instantiated_criteria\n\n4. progress_for_transition (computed from criteria):\n\
    \   def progress_for_transition(self, status: TicketStatus) -> Progress:\n   \
    \    \"\"\"\n       Progress toward a specific transition.\n\n       Filters all_criteria\
    \ by blocks_transition_to, then computes:\n       progress = met_criteria / total_criteria\n\
    \       \"\"\"\n       relevant = [c for c in self.all_criteria\n            \
    \       if c.blocks_transition_to == status]\n       total = len(relevant)\n \
    \      met = sum(1 for c in relevant if c.is_met())\n       return Progress(total=total,\
    \ completed=met)\n\n   @computed_field\n   def progress(self) -> Progress:\n \
    \      \"\"\"Default progress (toward COMPLETED).\"\"\"\n       return self.progress_for_transition(TicketStatus.COMPLETED)\n\
    \n   @computed_field\n   def start_progress(self) -> Progress:\n       \"\"\"\
    Progress toward being able to start (IN_PROGRESS).\"\"\"\n       return self.progress_for_transition(TicketStatus.IN_PROGRESS)\n\
    \n   @computed_field\n   def deploy_progress(self) -> Progress:\n       \"\"\"\
    Progress toward production readiness.\"\"\"\n       return self.progress_for_transition(TicketStatus.PRODUCTION_READY)\n\
    \nCONVENIENCE ACCESSORS:\n\nThese filter criteria by target type AND blocks_transition_to:\n\
    \n@property\ndef deliverables(self) -> List[Criterion]:\n    \"\"\"File-based\
    \ criteria (FileExistsTarget).\"\"\"\n    return [c for c in self.all_criteria\n\
    \            if isinstance(c.target, FileExistsTarget)]\n\n@property\ndef tests(self)\
    \ -> List[Criterion]:\n    \"\"\"Test-based criteria (TestPassesTarget).\"\"\"\
    \n    return [c for c in self.all_criteria\n            if isinstance(c.target,\
    \ TestPassesTarget)]\n\n@property\ndef subtasks(self) -> List[Criterion]:\n  \
    \  \"\"\"Child ticket criteria (CompletableTarget blocking COMPLETED).\"\"\"\n\
    \    return [c for c in self.all_criteria\n            if isinstance(c.target,\
    \ CompletableTarget)\n            and c.blocks_transition_to == TicketStatus.COMPLETED]\n\
    \n@property\ndef dependencies(self) -> List[Criterion]:\n    \"\"\"Sibling dependencies\
    \ (CompletableTarget blocking IN_PROGRESS).\"\"\"\n    return [c for c in self.all_criteria\n\
    \            if isinstance(c.target, CompletableTarget)\n            and c.blocks_transition_to\
    \ == TicketStatus.IN_PROGRESS]\n\n@property\ndef thresholds(self) -> List[Criterion]:\n\
    \    \"\"\"Threshold-based criteria (ThresholdTarget).\"\"\"\n    return [c for\
    \ c in self.all_criteria\n            if isinstance(c.target, ThresholdTarget)]\n\
    \n@property\ndef manual_checks(self) -> List[Criterion]:\n    \"\"\"Manual assessment\
    \ criteria (ManualTarget).\"\"\"\n    return [c for c in self.all_criteria\n \
    \           if isinstance(c.target, ManualTarget)]\n\n@property\ndef production_gates(self)\
    \ -> List[Criterion]:\n    \"\"\"Production deployment gates (any target blocking\
    \ PRODUCTION_READY).\"\"\"\n    return [c for c in self.all_criteria\n       \
    \     if c.blocks_transition_to == TicketStatus.PRODUCTION_READY]\n\nHIERARCHY\
    \ TRAVERSAL:\n\n@property\ndef parent(self) -> Optional[HierarchicalTicket]:\n\
    \    \"\"\"Load parent ticket if exists.\"\"\"\n    if self.parent_ref is None:\n\
    \        return None\n    return self._load_ticket(self.parent_ref)\n\n@property\n\
    def children_tickets(self) -> List[HierarchicalTicket]:\n    \"\"\"Load all child\
    \ tickets.\"\"\"\n    return [self._load_ticket(child_id) for child_id in self.children]\n\
    \n@property\ndef ancestors(self) -> List[HierarchicalTicket]:\n    \"\"\"All ancestors\
    \ from parent to root.\"\"\"\n    result = []\n    current = self.parent\n   \
    \ while current is not None:\n        result.append(current)\n        current\
    \ = current.parent\n    return result\n\n@property\ndef descendants(self) -> List[HierarchicalTicket]:\n\
    \    \"\"\"All descendants (children, grandchildren, etc.).\"\"\"\n    result\
    \ = []\n    for child in self.children_tickets:\n        result.append(child)\n\
    \        result.extend(child.descendants)\n    return result\n\nLOADER ABSTRACTION:\n\
    \nThe _load_ticket and _load_child methods use dependency injection:\n\nclass\
    \ TicketLoader(Protocol):\n    def load(self, ticket_id: str) -> HierarchicalTicket:\
    \ ...\n\nclass HierarchicalTicket(Ticket):\n    _loader: ClassVar[Optional[TicketLoader]]\
    \ = None\n\n    @classmethod\n    def set_loader(cls, loader: TicketLoader) ->\
    \ None:\n        cls._loader = loader\n\n    def _load_ticket(self, ticket_id:\
    \ str) -> HierarchicalTicket:\n        if self._loader is None:\n            raise\
    \ RuntimeError(\"No loader configured\")\n        return self._loader.load(ticket_id)\n\
    \nIMPLEMENTATION:\n\n1. Create vibey/roadmap/models/ticket/hierarchical.py:\n\
    \   - HierarchicalTicket class extending Ticket\n   - All smart accessors\n  \
    \ - Hierarchy traversal methods\n   - Loader abstraction\n\n2. Integrate with\
    \ RequirementResolver from Task 011\n3. Full test coverage with mock loader\n\n\
    SUCCESS CRITERIA:\n- All smart accessors work correctly\n- Aggregation collects\
    \ from all descendants\n- Inheritance resolves with correct modes\n- Instantiated\
    \ criteria added to explicit criteria\n- progress_for_transition filters by blocks_transition_to\n\
    - progress, start_progress, deploy_progress computed correctly\n- Convenience\
    \ accessors filter by target type AND blocks_transition_to\n- dependencies accessor\
    \ returns criteria blocking IN_PROGRESS\n- subtasks accessor returns criteria\
    \ blocking COMPLETED\n- production_gates accessor returns criteria blocking PRODUCTION_READY\n\
    - Full test coverage\n"
