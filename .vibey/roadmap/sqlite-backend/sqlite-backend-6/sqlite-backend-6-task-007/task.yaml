    notes: |
      THINNER L3: Most fields now inherited from L1/L2.

      TrackTicket is an INTERMEDIATE node - it inherits from ancestors
      AND aggregates from descendants. Smart accessors handle both:
      - requirements_effective = merged (from roadmap + local)
      - commits = aggregated (from all sprints/tasks)
      - progress = computed from criteria (sprints as CompletableTarget)

      KEY CHANGE: Children are now implicit via CompletableTarget criteria.
      Track doesn't store `sprints` list - instead it has criteria like:
        criteria:
          - target: {type: completable, completable_id: "sqlite-backend-1"}

      The `children` property derives sprint IDs from these criteria.

      Track is the parallelization boundary - sibling tracks can
      run independently without dependencies.

      Can run in parallel with tasks 003, 005, 006.
