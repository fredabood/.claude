    notes: |
      THINNER L3: Most fields now inherited from L1/L2.

      TaskTicket is unique because it's ALWAYS an ultimate child.
      This means:
      - Cannot have CompletableTarget criteria (leaf node)
      - commits = local only (no aggregation)
      - requirements_effective = full inheritance chain
      - is_complete = all(c.is_met() for c in all_criteria)

      KEY CHANGE: Task completion is now deterministic:
      - criteria field holds FileExistsTarget, TestPassesTarget, etc.
      - instantiated_criteria generated from effective requirements
      - all_criteria = explicit + instantiated
      - is_complete = all criteria met

      This is THE deterministic interface that prevents AI manipulation.
      The AI cannot mark a task complete unless all criteria are met.

      Example criteria for a development task:
        criteria:
          - target: {type: file_exists, paths: ["src/api.py"]}
          - target: {type: test_passes, test_command: "pytest", pass_threshold: 100}
          - target: {type: threshold, metric_name: "coverage", threshold: 85}

      Task-specific concerns:
      - Gate vs development task distinction
      - Token estimation and efficiency
      - Gate blocking semantics

      Can run in parallel with tasks 003, 004, 005.
