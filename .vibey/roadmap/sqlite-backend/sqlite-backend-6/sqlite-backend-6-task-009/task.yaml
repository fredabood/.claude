  title: Implement Layer 3 - TrackTicket (Intermediate)
  description: "Create the TrackTicket class - the parallelization boundary.\nTrack\
    \ is ALWAYS intermediate (is_intermediate=True).\n\nDESIGN PRINCIPLE: L3 contains\
    \ ONLY semantic-specific fields.\nAll common fields and behaviors inherited from\
    \ L1/L2.\n\nHIERARCHY CONSTRAINTS:\n- is_intermediate: True (always - has both\
    \ parent and children)\n- is_parent: True (always has Sprint children via CompletableTarget\
    \ criteria)\n- is_child: True (always has Roadmap parent via parent_ref)\n- is_ultimate_parent:\
    \ False (never - always has parent)\n- is_ultimate_child: False (never - always\
    \ has children)\n\nThese constraints are ENFORCED by validators.\n\nINHERITED\
    \ FROM L1 (Ticket extends Completable):\n- From Completable: id, name, description,\
    \ criteria (THE source of truth)\n- From Completable: is_complete, progress, blocking_reasons,\
    \ children (computed)\n- Ticket-specific: status, lifecycle timestamps\n- Ticket-specific:\
    \ assigned_agents, priority, commits, dependencies\n- Ticket-specific: requirements_local\
    \ (templates for children)\n- Ticket-specific: parent_ref (denormalized for fast\
    \ lookup)\n\nINHERITED FROM L2 (HierarchicalTicket):\n- Smart accessors: commits\
    \ (aggregated from sprints/tasks)\n- Smart accessors: requirements_effective (merged\
    \ from roadmap + local)\n- Hierarchy traversal: parent, children_tickets, ancestors,\
    \ descendants\n- Convenience accessors: deliverables, tests, subtasks, manual_checks\n\
    \nTRACK-SPECIFIC FIELDS (L3 only):\n\n1. Type Discriminator:\n   - ticket_type:\
    \ Literal[\"track\"] = \"track\"\n\n2. Parent Reference:\n   - roadmap_id: str\
    \ (required, must match parent_id)\n\n3. Priority:\n   - priority: Priority enum\
    \ (critical, high, medium, low)\n\n4. Strategic Context:\n   - strategic_value:\
    \ list[str] (why this track matters)\n\n5. PARENT TYPE CONSTRAINT:\n   - parent_ref\
    \ must reference a RoadmapTicket ID\n   - get_roadmap() -> RoadmapTicket (typed\
    \ accessor)\n\n6. CHILD TYPE CONSTRAINT:\n   - Children derived from CompletableTarget\
    \ criteria\n   - Must reference SprintTicket IDs in CompletableTarget criteria\n\
    \   - get_sprints() -> list[SprintTicket] (typed accessor, filters criteria)\n\
    \nNote on children: Track's children (sprints) are determined by\nCompletableTarget\
    \ criteria. Example:\n\ncriteria:\n  - id: \"sprint-1\"\n    description: \"Sprint\
    \ 1 complete\"\n    target:\n      type: \"completable\"\n      completable_id:\
    \ \"sqlite-backend-1\"\n      required_status: \"completed\"\n\nVALIDATORS:\n\
    - parent_ref must be set (intermediate constraint)\n- parent_ref must equal roadmap_id\n\
    - Parent must be RoadmapTicket type (loaded and checked)\n- All CompletableTarget\
    \ criteria must reference SprintTicket IDs\n- Track ID format: simple slug (no\
    \ \"/\" or leading \"-\")\n\nCOMPUTED PROPERTIES (via Completable base):\n- is_complete:\
    \ all criteria met\n- progress: met_criteria / total_criteria\n- children: list\
    \ of completable_ids from CompletableTarget criteria\n- sprints_total: len(subtasks)\n\
    - sprints_completed: count where target.is_satisfied()\n- tasks_total: sum of\
    \ sprint.progress.total for all sprints\n- tasks_completed: sum of sprint.progress.completed\
    \ for all sprints\n\nMETHODS:\n- get_roadmap() -> RoadmapTicket\n- get_sprints()\
    \ -> list[SprintTicket]\n\nIMPLEMENTATION:\n\n1. Add TrackTicket to vibey/roadmap/models/ticket/domain.py\n\
    2. Inherit from HierarchicalTicket\n3. Add validator: parent_id must be set and\
    \ match roadmap_id\n4. Implement typed parent/child accessors\n\nSUCCESS CRITERIA:\n\
    - TrackTicket must have parent_ref set (validation error if None)\n- is_intermediate\
    \ always returns True\n- Children derived from CompletableTarget criteria\n- is_complete\
    \ = all sprint criteria satisfied\n- Progress = sprints_completed / sprints_total\n\
    - Requirements from track + roadmap cascade to sprints/tasks\n- Smart accessors\
    \ work correctly (inheritance + aggregation)\n- 100% test coverage\n"
