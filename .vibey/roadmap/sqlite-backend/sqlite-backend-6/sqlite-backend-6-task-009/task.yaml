  title: Implement Layer 3 - TaskTicket (Ultimate Child)
  description: |
    Create the TaskTicket class - the atomic work unit (leaf node).
    Task is ALWAYS an ultimate child (is_ultimate_child=True).

    DESIGN PRINCIPLE: L3 contains ONLY semantic-specific fields.
    All common fields and behaviors inherited from L1/L2.

    HIERARCHY CONSTRAINTS:
    - is_ultimate_child: True (always - no children/CompletableTarget allowed)
    - is_child: True (always has Sprint parent via parent_ref)
    - is_parent: False (never - leaf node, no CompletableTarget criteria)
    - is_ultimate_parent: False
    - is_intermediate: False

    These constraints are ENFORCED by validators.

    INHERITED FROM L1 (Ticket extends Completable):
    - From Completable: id, name, description, criteria (THE source of truth)
    - From Completable: is_complete, progress, blocking_reasons (computed)
    - From Completable: children = [] (always empty for tasks)
    - Ticket-specific: status, lifecycle timestamps
    - Ticket-specific: assigned_agents, priority, commits, dependencies
    - Ticket-specific: requirements_local (but rarely used - tasks inherit)
    - Ticket-specific: parent_ref (denormalized for fast lookup)

    INHERITED FROM L2 (HierarchicalTicket):
    - Smart accessors: commits (local for tasks - no children to aggregate)
    - Smart accessors: requirements_effective (full inheritance chain)
    - Smart accessors: all_criteria (explicit + instantiated from requirements)
    - Hierarchy traversal: parent, ancestors (no children/descendants)
    - Convenience accessors: deliverables, tests, thresholds, manual_checks

    SMART ACCESSOR BEHAVIOR FOR TASKS:
    Because is_ultimate_child=True:
    - commits → returns commits (local only, no aggregation)
    - requirements_effective → full inheritance from sprint + track + roadmap
    - all_criteria → explicit criteria + instantiated from requirements
    - is_complete → all(c.is_met() for c in all_criteria)
    - progress → met_criteria / total_criteria (same formula as parents)

    TASK-SPECIFIC FIELDS (L3 only):

    1. Type Discriminator:
       - ticket_type: Literal["task"] = "task"

    2. Parent References:
       - sprint_id: str (required, must match parent_id)
       - track_id: str (required, grandparent reference)
       - roadmap_id: str (required, root reference)

    3. Task Classification:
       - task_type_detail: TaskType enum (development, completion_gate,
         production_gate, documentation, testing, research, review)
       - title: str (short task title - alias for name)

    4. Assignment:
       - assigned_agent: Optional[str] (single agent for task)
       - priority: Priority enum
       - phase_label: Optional[str]

    5. Estimation:
       - estimated_tokens: int (required, > 0)
       - actual_tokens: Optional[int]
       - complexity: Complexity enum (low, medium, high)

    6. Gate-Specific (for gate tasks only):
       - gate_info: Optional[GateInfo]
       - audit_results: Optional[AuditResults]

    7. PARENT TYPE CONSTRAINT:
       - parent_ref must reference a SprintTicket ID
       - get_sprint() -> SprintTicket

    8. NO CHILDREN (enforced):
       - Cannot have CompletableTarget criteria (leaf node)
       - children property always returns []
       - Validation error if CompletableTarget criterion added

    Note: Tasks have criteria like FileExistsTarget, TestPassesTarget,
    ThresholdTarget, ManualTarget - but NOT CompletableTarget.

    Example task criteria:

    criteria:
      - id: "deliverable-api"
        description: "API module exists"
        target:
          type: "file_exists"
          paths: ["src/api.py"]

      - id: "test-coverage"
        description: "Test coverage ≥85%"
        target:
          type: "threshold"
          metric_name: "coverage"
          threshold: 85.0
          comparison: "gte"

      - id: "tests-pass"
        description: "Unit tests pass"
        target:
          type: "test_passes"
          test_command: "pytest tests/test_api.py"
          pass_threshold: 100.0

    SUPPORTING CLASSES (task-specific):
    - GateInfo:
      - blocks_status: str (what status this gate blocks)
      - threshold: float (pass threshold 0-100)
      - is_blocking: bool
      - score: Optional[float]
      - evaluated_at: Optional[datetime]
      - has_passed() -> bool

    - AuditResults:
      - issues_found: int
      - issues_fixed: int
      - recommendations: list[str]
      - audit_type: str
      - audited_at: datetime

    VALIDATORS:
    - Cannot have CompletableTarget criteria (ultimate child constraint)
    - Task ID must start with sprint_id + "-task-"
    - estimated_tokens must be > 0
    - Development tasks cannot have gate_info
    - Gate tasks must have gate_info
    - If gate_info.is_blocking, gate must pass before sprint completes

    COMPUTED PROPERTIES (via Completable base):
    - is_complete: all(c.is_met() for c in all_criteria)
    - progress: met_criteria / total_criteria
    - blocking_reasons: [c.description for c if not c.is_met()]
    - children: [] (always empty for tasks)

    Task-specific computed:
    - token_efficiency: Optional[float] (actual / estimated)
    - size_category: SizeCategory (computed from estimated_tokens)

    METHODS:
    - get_sprint() -> SprintTicket
    - get_track() -> TrackTicket (via sprint)
    - get_roadmap() -> RoadmapTicket (via track)
    - is_development_task() -> bool
    - is_quality_gate() -> bool
    - has_passed_gate() -> bool

    IMPLEMENTATION:

    1. Add TaskTicket to vibey/roadmap/models/ticket/domain.py
    2. Inherit from HierarchicalTicket
    3. Add validator: cannot have children
    4. Add GateInfo and AuditResults classes
    5. Implement task-specific methods

    SUCCESS CRITERIA:
    - TaskTicket cannot have CompletableTarget criteria (validation error)
    - is_ultimate_child always returns True
    - is_complete = all criteria met (FileExists, TestPasses, etc.)
    - Progress computed from task's own criteria
    - Requirements inherited from sprint + track + roadmap
    - Instantiated criteria generated from effective requirements
    - Gate tasks require gate_info, dev tasks reject it
    - Token estimation and efficiency tracking works
    - Smart accessors work correctly (local commits, no aggregation)
    - 100% test coverage
