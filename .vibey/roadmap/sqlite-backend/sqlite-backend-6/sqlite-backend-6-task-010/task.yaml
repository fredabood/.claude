  title: Create SQLAlchemy ORM for Unified Completion Model
  description: |
    Create SQLAlchemy ORM models that map to the unified completion model.
    Key change: criteria are stored in a separate table with polymorphic targets.

    DESIGN REQUIREMENTS:

    1. ORM Strategy: Single-Table Inheritance for Tickets
       - One `tickets` table with discriminator column
       - All ticket types share common columns
       - Type-specific columns nullable

    2. Separate Criteria Table (polymorphic targets)
       The criteria table holds all completion criteria with polymorphic
       target types stored as JSON.

    SCHEMA:

    1. tickets table:
       CREATE TABLE tickets (
           id TEXT PRIMARY KEY,
           name TEXT NOT NULL,
           description TEXT,
           ticket_type TEXT NOT NULL,  -- discriminator

           -- Hierarchy
           parent_ref TEXT REFERENCES tickets(id),

           -- Lifecycle
           status TEXT NOT NULL,
           created_at TEXT NOT NULL,
           started_at TEXT,
           completed_at TEXT,
           updated_at TEXT NOT NULL,

           -- Work (Ticket-specific)
           assigned_agents_json TEXT,  -- JSON array
           priority TEXT,
           estimated_duration TEXT,
           commits_json TEXT,  -- JSON array of GitCommit
           -- NOTE: NO dependencies_json - dependencies are now criteria
           -- with blocks_transition_to = 'in_progress'

           -- Requirements (templates for children)
           requirements_local_json TEXT,  -- JSON array of Requirement

           -- Metadata
           metadata_json TEXT,

           -- Type-specific columns (nullable)
           -- Roadmap
           version TEXT,
           version_strategy_json TEXT,
           activity_log_json TEXT,

           -- Track
           strategic_value_json TEXT,

           -- Sprint
           plan_file TEXT,
           goal TEXT,
           success_criteria_json TEXT,
           development_gates_json TEXT,

           -- Task
           task_type_detail TEXT,
           estimated_tokens INTEGER,
           actual_tokens INTEGER,
           complexity TEXT,
           gate_info_json TEXT,
           audit_results_json TEXT
       );

    2. criteria table:
       CREATE TABLE criteria (
           id TEXT PRIMARY KEY,
           ticket_id TEXT NOT NULL REFERENCES tickets(id),
           description TEXT NOT NULL,
           required INTEGER DEFAULT 1,  -- boolean

           -- UNIFIED BLOCKING: which transition does this block?
           blocks_transition_to TEXT NOT NULL DEFAULT 'completed',
           -- Values: 'in_progress', 'completed', 'production_ready'

           -- Target (polymorphic via target_type)
           target_type TEXT NOT NULL,  -- discriminator
           target_json TEXT NOT NULL,  -- type-specific target data

           -- Cached state
           is_met INTEGER,  -- boolean, cached
           last_checked TEXT,

           FOREIGN KEY (ticket_id) REFERENCES tickets(id) ON DELETE CASCADE
       );

       -- Index for finding children (CompletableTarget blocking COMPLETED)
       CREATE INDEX idx_criteria_completable_target
       ON criteria(json_extract(target_json, '$.completable_id'))
       WHERE target_type = 'completable' AND blocks_transition_to = 'completed';

       -- Index for finding dependencies (CompletableTarget blocking IN_PROGRESS)
       CREATE INDEX idx_criteria_dependencies
       ON criteria(json_extract(target_json, '$.completable_id'))
       WHERE target_type = 'completable' AND blocks_transition_to = 'in_progress';

       -- Index for finding criteria by transition type
       CREATE INDEX idx_criteria_blocks_transition
       ON criteria(ticket_id, blocks_transition_to);

    3. ORM Models:

       class TicketORM(Base):
           __tablename__ = 'tickets'

           id = Column(String, primary_key=True)
           name = Column(String, nullable=False)
           ticket_type = Column(String, nullable=False)
           parent_ref = Column(String, ForeignKey('tickets.id'))
           status = Column(String, nullable=False)
           # ... etc

           # Relationships
           criteria = relationship("CriterionORM", back_populates="ticket",
                                   cascade="all, delete-orphan")
           parent = relationship("TicketORM", remote_side=[id])

           __mapper_args__ = {
               'polymorphic_on': ticket_type,
               'polymorphic_identity': 'ticket'
           }

       class CriterionORM(Base):
           __tablename__ = 'criteria'

           id = Column(String, primary_key=True)
           ticket_id = Column(String, ForeignKey('tickets.id'), nullable=False)
           description = Column(String, nullable=False)
           required = Column(Boolean, default=True)
           blocks_transition_to = Column(String, nullable=False, default='completed')
           target_type = Column(String, nullable=False)
           target_json = Column(JSON, nullable=False)
           is_met = Column(Boolean)
           last_checked = Column(DateTime)

           # Relationships
           ticket = relationship("TicketORM", back_populates="criteria")

    4. Target Serialization:

       Each target type serializes to JSON:

       CompletableTarget:
         {"completable_id": "task-001", "required_status": "completed",
          "current_status": "in_progress", "last_checked": "2025-11-29T..."}

       FileExistsTarget:
         {"paths": ["src/api.py"], "all_required": true,
          "existing_paths": ["src/api.py"], "missing_paths": [],
          "last_checked": "2025-11-29T..."}

       TestPassesTarget:
         {"test_command": "pytest tests/", "pass_threshold": 100.0,
          "coverage_threshold": 85.0, "last_result": {...}}

       ThresholdTarget:
         {"metric_name": "coverage", "threshold": 85.0, "comparison": "gte",
          "current_value": 92.0, "last_checked": "..."}

       ManualTarget:
         {"assessor": "senior-eng", "instructions": "Review code",
          "assessed": true, "met": true, "assessed_by": "john",
          "evidence": "LGTM in PR #123", "assessed_at": "..."}

    5. Pydantic <-> ORM Conversion:

       class CriterionORM:
           @classmethod
           def from_pydantic(cls, criterion: Criterion) -> CriterionORM:
               return cls(
                   id=criterion.id,
                   description=criterion.description,
                   required=criterion.required,
                   blocks_transition_to=criterion.blocks_transition_to.value,
                   target_type=criterion.target.type,
                   target_json=criterion.target.model_dump(),
                   is_met=criterion.is_met(),
                   last_checked=datetime.now()
               )

           def to_pydantic(self) -> Criterion:
               target = deserialize_target(self.target_type, self.target_json)
               return Criterion(
                   id=self.id,
                   description=self.description,
                   required=self.required,
                   blocks_transition_to=TicketStatus(self.blocks_transition_to),
                   target=target
               )

    6. Repository Pattern:

       class TicketRepository:
           def get(self, ticket_id: str) -> Optional[Ticket]
           def get_with_criteria(self, ticket_id: str) -> Ticket
           def save(self, ticket: Ticket) -> None
           def save_criterion(self, ticket_id: str, criterion: Criterion) -> None
           def delete_criterion(self, criterion_id: str) -> None
           def find_children(self, parent_id: str) -> List[Ticket]
           def find_dependencies(self, ticket_id: str) -> List[Criterion]
           def find_by_status(self, status: TicketStatus) -> List[Ticket]
           def find_blocked(self) -> List[Ticket]  # can_start() fails
           def find_incomplete(self) -> List[Ticket]  # can_complete() fails
           def find_criteria_by_transition(
               self, ticket_id: str, blocks: TicketStatus
           ) -> List[Criterion]

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/orm.py:
       - TicketORM base and subclasses
       - CriterionORM
       - Target serialization/deserialization

    2. Create vibey/roadmap/models/ticket/repository.py:
       - TicketRepository class
       - CriterionRepository class

    3. Update database schema (migration script if needed)

    SUCCESS CRITERIA:
    - Single-table inheritance for tickets works
    - Criteria stored separately with polymorphic targets
    - blocks_transition_to column in criteria table
    - NO dependencies_json in tickets table (consolidated into criteria)
    - Round-trip Pydantic -> ORM -> Pydantic without data loss
    - Repository provides queries for criteria by transition type
    - find_children uses criteria WHERE blocks_transition_to='completed'
    - find_dependencies uses criteria WHERE blocks_transition_to='in_progress'
    - Computed fields (can_transition_to, progress_for_transition) work correctly
    - 100% test coverage
