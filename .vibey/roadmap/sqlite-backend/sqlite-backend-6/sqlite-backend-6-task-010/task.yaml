    notes: |
      KEY CHANGE: Criteria are stored in separate table with
      blocks_transition_to column for UNIFIED BLOCKING.

      The criteria table now handles:
      - Parent-child relationships (blocks_transition_to='completed')
      - Sibling dependencies (blocks_transition_to='in_progress')
      - Production gates (blocks_transition_to='production_ready')

      This ELIMINATES the need for dependencies_json in tickets table.
      All blocking relationships are criteria with different
      blocks_transition_to values.

      Indexes are created for efficient queries:
      - Find children: CompletableTarget + blocks='completed'
      - Find dependencies: CompletableTarget + blocks='in_progress'
      - Find criteria by transition type

      The target_json column stores the target-specific data,
      with target_type as the discriminator for deserialization.
