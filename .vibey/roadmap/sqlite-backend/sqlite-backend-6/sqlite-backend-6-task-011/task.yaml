    notes: |
      This is the largest and most complex task in the sprint.
      Consider splitting into sub-tasks if scope grows.

      KEY MIGRATION CHALLENGE:
      Converting explicit children AND dependencies to CompletableTarget
      criteria is the core transformation. The blocks_transition_to field
      determines what type of relationship it is.

      UNIFIED BLOCKING MODEL:
      All blocking relationships use Criterion with blocks_transition_to:
      - IN_PROGRESS: dependency (must be met before starting)
      - COMPLETED: success criteria / children (must be met before completing)
      - PRODUCTION_READY: production gate (must be met before deploying)

      MIGRATION TRANSFORMATIONS:
      - Roadmap.tracks -> criteria (blocks_transition_to=COMPLETED)
      - Track.sprints -> criteria (blocks_transition_to=COMPLETED)
      - Sprint.tasks -> criteria (blocks_transition_to=COMPLETED)
      - *.blocked_by -> criteria (blocks_transition_to=IN_PROGRESS)
      - *.depends_on -> criteria (blocks_transition_to=IN_PROGRESS)
      - *.deliverables -> criteria with FileExistsTarget (blocks_transition_to=COMPLETED)
      - *.development_gates -> criteria (blocks_transition_to=PRODUCTION_READY)

      The Dependency class is ELIMINATED. Dependencies are now criteria
      with blocks_transition_to=IN_PROGRESS.

      The adapter layer allows non-breaking incremental migration.
      Operations can continue using old models while we migrate.

      DETERMINISTIC COMPLETION:
      After migration, can_transition_to(status) is THE unified interface.
      Progress is computed per transition type.
      This is THE guardrail against AI manipulation.
      The AI cannot transition a ticket unless all relevant criteria are met.

      May need to coordinate with Sprint 6 file format work.
