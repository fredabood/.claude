  title: Migrate existing dataclass models to unified Pydantic models
  description: |
    Create migration adapters and update codebase to use the new unified
    ticket architecture with criteria-based completion model.

    KEY ARCHITECTURAL CHANGE:
    The new model uses `criteria: List[Criterion]` as THE source of truth
    for completion. Parent-child relationships are implicit via
    CompletableTarget criteria, not explicit `tracks`/`sprints`/`tasks` lists.

    CURRENT STATE:

    Existing Models (dataclasses in vibey/roadmap/models/):
    - roadmap.py: Roadmap, Progress, TrackSummary, etc.
    - track.py: Track, TrackProgress, SprintSummary, etc.
    - sprint.py: Sprint, SprintProgress, TaskSummary, etc.
    - task.py: Task, TaskMetadata, GateInfo, etc.
    - common.py: Status, TaskStatus, Priority, TaskType, etc.

    These are used by:
    - vibey/roadmap/serialization/yaml_loader.py
    - vibey/roadmap/serialization/yaml_dumper.py
    - vibey/roadmap/serialization/sql_loader.py
    - vibey/roadmap/serialization/sql_dumper.py
    - vibey/operations/roadmap/*.py
    - vibey/cli/commands.py

    MIGRATION STRATEGY:

    1. Phase 1: Adapter Layer (Non-Breaking)
       Create adapters that convert between old and new models:

       class ModelAdapter:
           @staticmethod
           def roadmap_to_ticket(old: Roadmap) -> RoadmapTicket:
               # Convert explicit tracks list to CompletableTarget criteria
               criteria = [
                   Criterion(
                       id=f"track-{track_id}",
                       description=f"Track {track_id} complete",
                       target=CompletableTarget(
                           completable_id=track_id,
                           required_status=TicketStatus.COMPLETED
                       )
                   )
                   for track_id in old.tracks
               ]
               return RoadmapTicket(criteria=criteria, ...)

           @staticmethod
           def ticket_to_roadmap(new: RoadmapTicket) -> Roadmap:
               # Extract track IDs from CompletableTarget criteria
               tracks = [
                   c.target.completable_id
                   for c in new.criteria
                   if isinstance(c.target, CompletableTarget)
               ]
               return Roadmap(tracks=tracks, ...)

       Similar adapters for Track -> TrackTicket, Sprint -> SprintTicket, etc.

    2. Phase 2: Update Serialization
       - yaml_loader.py: Load YAML -> construct new Pydantic models
         - Handle criteria field with polymorphic targets
         - Generate criteria from legacy tracks/sprints/tasks lists
       - yaml_dumper.py: Dump new Pydantic models -> YAML
         - Serialize criteria with target type discriminator
         - Optionally emit legacy format for backward compatibility
       - sql_loader.py: Query DB -> construct via ORM
         - Load from tickets + criteria tables (separate)
         - Deserialize polymorphic targets from JSON
       - sql_dumper.py: Save via ORM
         - Persist to tickets + criteria tables
         - Serialize targets as JSON with type discriminator

    3. Phase 3: Update Operations
       - Update vibey/operations/roadmap/*.py to use new models
       - Use TicketRepository pattern instead of direct SQL
       - Leverage smart accessors (is_complete, progress, children)
       - Use Completable.can_complete() for deterministic completion

    4. Phase 4: Deprecation
       - Mark old models as deprecated
       - Update all imports to use new models
       - Remove adapter layer once migration complete
       - Remove legacy YAML format support (or keep as backward compat)

    FIELD MAPPING:

    Old Roadmap -> New RoadmapTicket:
    - id -> id
    - name -> name
    - version -> version
    - status -> status
    - created -> created_at
    - started -> started_at
    - completed -> completed_at
    - tracks -> criteria (as CompletableTarget, blocks_transition_to=COMPLETED)
    - progress -> (computed from criteria)
    - activity_log -> activity_log
    - metadata -> metadata
    - blocked_by -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)
    - depends_on -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)

    NOTE: The Dependency class has been ELIMINATED. Dependencies are now
    expressed as Criterion with blocks_transition_to=IN_PROGRESS.

    Old Sprint -> New SprintTicket:
    - tasks -> criteria (as CompletableTarget, blocks_transition_to=COMPLETED)
    - deliverables -> criteria (as FileExistsTarget, blocks_transition_to=COMPLETED)
    - success_criteria -> criteria.descriptions
    - depends_on -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)
    - development_gates -> criteria (as various targets, blocks_transition_to=PRODUCTION_READY)

    Old Task -> New TaskTicket:
    - deliverables (strings) -> criteria (as FileExistsTarget, blocks_transition_to=COMPLETED)
    - depends_on -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)
    - (no subtasks - tasks are leaf nodes)
    - Add criteria for test coverage, code review, etc.

    BREAKING CHANGES TO HANDLE:

    1. Children lists -> CompletableTarget criteria (blocks_transition_to=COMPLETED)
       - tracks: List[str] becomes criteria with CompletableTarget
       - sprints: List[str] becomes criteria with CompletableTarget
       - tasks: List[str] becomes criteria with CompletableTarget

    2. Dependencies -> CompletableTarget criteria (blocks_transition_to=IN_PROGRESS)
       - blocked_by: List[str] becomes criteria with CompletableTarget
       - depends_on: List[Dependency] becomes criteria with CompletableTarget
       - The Dependency class is ELIMINATED

    3. Production gates -> Criteria (blocks_transition_to=PRODUCTION_READY)
       - development_gates become criteria blocking production readiness

    4. Progress is now computed from criteria PER TRANSITION
       - progress = progress_for_transition(COMPLETED)
       - start_progress = progress_for_transition(IN_PROGRESS)
       - deploy_progress = progress_for_transition(PRODUCTION_READY)

    5. can_transition_to(status) is THE unified interface
       - can_start() = can_transition_to(IN_PROGRESS)
       - can_complete() = can_transition_to(COMPLETED)
       - can_deploy() = can_transition_to(PRODUCTION_READY)
       - Cannot override - THE guardrail against AI manipulation

    6. Deliverables become FileExistsTarget criteria
       - deliverables: ["src/api.py"] becomes:
         criteria: [{target: {type: file_exists, paths: ["src/api.py"]},
                    blocks_transition_to: completed}]

    7. Requirements cascade and instantiate as criteria
       - Roadmap requirements become task criteria via instantiation

    8. Timestamp field names: created -> created_at

    9. Enum consolidation: Status/TaskStatus -> TicketStatus

    YAML FORMAT CHANGES:

    Old format (explicit children and dependencies):
    ```yaml
    roadmap:
      tracks:
        - core-framework
        - goose-port
      blocked_by:
        - other-roadmap
    ```

    New format (criteria-based with blocks_transition_to):
    ```yaml
    roadmap:
      criteria:
        # Children (block COMPLETED)
        - id: track-core
          description: Core framework track complete
          target:
            type: completable
            completable_id: core-framework
            required_status: completed
          blocks_transition_to: completed  # Default, can omit

        # Dependencies (block IN_PROGRESS)
        - id: dep-other-roadmap
          description: Other roadmap must complete before starting
          target:
            type: completable
            completable_id: other-roadmap
            required_status: completed
          blocks_transition_to: in_progress  # Makes it a dependency

        # Production gates (block PRODUCTION_READY)
        - id: gate-security-audit
          description: Security audit must pass
          target:
            type: manual
            assessor: security-team
          blocks_transition_to: production_ready
    ```

    MIGRATION TOOL:

    Create vibey/roadmap/migration/yaml_migrator.py:
    - migrate_roadmap_yaml(old_yaml) -> new_yaml
    - migrate_track_yaml(old_yaml) -> new_yaml
    - migrate_sprint_yaml(old_yaml) -> new_yaml
    - migrate_task_yaml(old_yaml) -> new_yaml

    Each function:
    1. Parses old YAML
    2. Converts to new Pydantic model via adapter
    3. Dumps to new YAML format

    DELIVERABLES:

    1. vibey/roadmap/models/ticket/adapters.py:
       - ModelAdapter class with conversion methods
       - Legacy-to-criteria conversion utilities
       - Criteria-to-legacy extraction utilities

    2. vibey/roadmap/migration/yaml_migrator.py:
       - YAML format migration functions
       - Batch migration for entire roadmap directory

    3. Updated serialization modules:
       - yaml_loader.py: Handle criteria with polymorphic targets
       - yaml_dumper.py: Serialize criteria with target type
       - sql_loader.py: Load from tickets + criteria tables via ORM
       - sql_dumper.py: Save to tickets + criteria tables via ORM

    4. Migration documentation:
       - Criteria-based completion model explained
       - Field mapping reference
       - Breaking changes list
       - Upgrade guide for any external code

    SUCCESS CRITERIA:
    - Existing YAML files load correctly into new models
    - Legacy children lists converted to CompletableTarget criteria
    - Round-trip YAML -> Pydantic -> YAML produces equivalent output
    - Round-trip YAML -> Pydantic -> SQLite -> Pydantic -> YAML works
    - All existing tests pass (with adapter layer)
    - Operations use new repository pattern
    - is_complete computed correctly from criteria
    - Progress computed correctly from criteria
    - No data loss during migration
