task:
  id: sqlite-backend-6-task-012
  sprint_id: sqlite-backend-6
  track_id: sqlite-backend
  roadmap_id: vibey-framework-v2
  task_type: development
  title: Implement Completable, Criterion, and Target Types
  description: |
    Create the core completion model: Completable base class, Criterion,
    and all CriterionTarget types. This is the heart of the unified
    completion system.

    DESIGN PRINCIPLE: Everything that can be completed shares the same
    abstraction. Completion is determined by criteria, and criteria have
    polymorphic targets.

    CORE CLASSES:

    1. Completable (abstract base)
       """Anything that can be marked complete."""

       Fields:
       - id: str (unique identifier)
       - name: str (human-readable name)
       - description: Optional[str]
       - criteria: List[Criterion] (THE source of truth)

       Computed Properties:
       - is_complete: bool (computed via can_transition_to(COMPLETED))
       - progress: Progress (for COMPLETED transition by default)
       - blocking_reasons: List[str] (for current transition)
       - children: List[str] = [c.target.completable_id for CompletableTargets]

       Methods:
       - can_transition_to(status: TicketStatus) -> tuple[bool, List[str]]
         THE unified interface for checking if a transition is allowed
       - progress_for_transition(status: TicketStatus) -> Progress
         Progress toward a specific transition
       - get_criterion(id: str) -> Optional[Criterion]
       - add_criterion(criterion: Criterion) -> None
       - remove_criterion(id: str) -> bool

       Convenience methods:
       - can_start() -> tuple[bool, List[str]]
         = can_transition_to(IN_PROGRESS)
       - can_complete() -> tuple[bool, List[str]]
         = can_transition_to(COMPLETED)
       - can_deploy() -> tuple[bool, List[str]]
         = can_transition_to(PRODUCTION_READY)

    2. Criterion
       """A requirement that blocks a state transition."""

       Fields:
       - id: str (unique within parent Completable)
       - description: str (what must be true)
       - target: CriterionTarget (polymorphic - determines how to check)
       - required: bool = True (if False, doesn't block transition)
       - blocks_transition_to: TicketStatus = COMPLETED
         (which state transition this criterion guards)

       The blocks_transition_to field enables UNIFIED blocking:
       - IN_PROGRESS: Must be met before work can start (dependency)
       - COMPLETED: Must be met before marking complete (success criteria)
       - PRODUCTION_READY: Must be met before deployment (production gate)

       This REPLACES the separate Dependency class. A "dependency" is now
       just a Criterion with blocks_transition_to=IN_PROGRESS.

       Computed Properties:
       - is_met: bool = target.is_satisfied() or not required

       Methods:
       - refresh() -> None (update target state)

    3. CriterionTarget (abstract base)
       """Base for all criterion target types."""

       Abstract Methods:
       - is_satisfied() -> bool
       - get_status_description() -> str
       - refresh() -> None

    TARGET TYPES:

    4. CompletableTarget
       """Criterion met when another Completable is complete."""

       Fields:
       - completable_id: str (ID of target Completable)
       - required_status: TicketStatus = COMPLETED

       Cached State:
       - current_status: Optional[TicketStatus]
       - last_checked: Optional[datetime]

       Methods:
       - is_satisfied() -> bool:
           return current_status >= required_status

       NOTE: This target type creates parent-child relationships.
       The parent is the Completable containing this criterion.
       The child is the Completable referenced by completable_id.

    5. FileExistsTarget
       """Criterion met when file(s) exist."""

       Fields:
       - paths: List[str] (file paths or glob patterns)
       - all_required: bool = True (all must exist vs any)

       Cached State:
       - existing_paths: List[str]
       - missing_paths: List[str]
       - last_checked: Optional[datetime]

       Methods:
       - is_satisfied() -> bool:
           if all_required:
               return len(missing_paths) == 0
           return len(existing_paths) > 0

       - refresh() -> None:
           # Check file system, update existing/missing

    6. TestPassesTarget
       """Criterion met when test passes with optional thresholds."""

       Fields:
       - test_command: str (e.g., "pytest tests/test_foo.py")
       - pass_threshold: float = 100.0 (% tests must pass)
       - coverage_threshold: Optional[float] (optional coverage %)

       Cached State:
       - last_result: Optional[TestResult]

       Methods:
       - is_satisfied() -> bool:
           if last_result is None:
               return False
           if last_result.pass_rate < pass_threshold:
               return False
           if coverage_threshold and last_result.coverage < coverage_threshold:
               return False
           return True

       - run() -> TestResult:
           # Execute test command, capture result

    7. TestResult (support class for TestPassesTarget)
       """Result of a test execution."""

       Fields:
       - run_at: datetime
       - passed: bool
       - pass_rate: float (0-100)
       - total_tests: int
       - passed_tests: int
       - failed_tests: int
       - skipped_tests: int
       - coverage_percent: Optional[float]
       - duration_seconds: float
       - output: Optional[str] (truncated)
       - commit_sha: Optional[str]

    8. ThresholdTarget
       """Criterion met when a metric meets a threshold."""

       Fields:
       - metric_name: str (e.g., "coverage", "lint_score")
       - threshold: float
       - comparison: ThresholdComparison = GTE

       Cached State:
       - current_value: Optional[float]
       - last_checked: Optional[datetime]

       Methods:
       - is_satisfied() -> bool:
           if current_value is None:
               return False
           return compare(current_value, threshold, comparison)

    9. ManualTarget
       """Criterion met when manually assessed."""

       Fields:
       - assessor: Optional[str] (who should assess)
       - instructions: Optional[str] (how to assess)

       State:
       - assessed: bool = False
       - met: Optional[bool] = None
       - assessed_at: Optional[datetime]
       - assessed_by: Optional[str]
       - evidence: Optional[str] (notes, links)

       Methods:
       - is_satisfied() -> bool:
           return assessed and met == True

       - assess(met: bool, by: str, evidence: str) -> None:
           self.assessed = True
           self.met = met
           self.assessed_by = by
           self.evidence = evidence
           self.assessed_at = now()

    10. ExternalTarget
        """Criterion met when external system reports success."""

        Fields:
        - system_name: str (e.g., "CI", "Security Scanner")
        - endpoint: Optional[str] (API to check)
        - expected_status: str = "success"

        Cached State:
        - current_status: Optional[str]
        - last_checked: Optional[datetime]
        - response_data: Optional[Dict]

        Methods:
        - is_satisfied() -> bool:
            return current_status == expected_status

    ADDITIONAL SUPPORT CLASSES:

    11. Progress
        """Progress tracking toward a transition."""

        Fields:
        - total: int
        - completed: int
        - in_progress: int = 0
        - blocked: int = 0

        Computed:
        - completion_percent: float = completed / total * 100

    NOTE: The Dependency class has been ELIMINATED.

    Dependencies are now represented as Criterion with:
    - target: CompletableTarget (referencing the blocker ticket)
    - blocks_transition_to: IN_PROGRESS (or other status)

    Example - Task 003 depends on Task 002:

    OLD (separate Dependency class):
      dependencies:
        - target_id: task-002
          required_status: completed
          blocks_transition_to: in_progress

    NEW (unified Criterion):
      criteria:
        - id: dep-task-002
          description: "Task 002 must complete before starting"
          target:
            type: completable
            completable_id: task-002
            required_status: completed
          blocks_transition_to: in_progress

    This consolidation means:
    - ONE system for all blocking relationships
    - Same Criterion used for dependencies, completion, and deployment gates
    - Same progress tracking for all transition types
    - Simpler mental model and implementation

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/completable.py:
       - Completable base class with can_transition_to()
       - Criterion class with blocks_transition_to field

    2. Create vibey/roadmap/models/ticket/targets.py:
       - CriterionTarget base
       - All 6 target types
       - TestResult support class

    3. Create vibey/roadmap/models/ticket/support.py:
       - Progress class
       - (NO Dependency class - consolidated into Criterion)

    4. Use Pydantic v2 BaseModel for all classes
    5. Use computed_field for derived properties
    6. Implement refresh() methods for cached state
    7. Full test coverage

    FILE STRUCTURE:
    vibey/roadmap/models/ticket/
      __init__.py
      enums.py         <- Task 010
      completable.py   <- Completable, Criterion (with blocks_transition_to)
      targets.py       <- All target types
      support.py       <- Progress (NO Dependency - eliminated)

    SUCCESS CRITERIA:
    - Completable base class with unified can_transition_to()
    - Criterion has blocks_transition_to field
    - All 6 target types implemented
    - Progress computed per transition type
    - Children derived from CompletableTarget criteria
    - Dependencies expressed as criteria (blocks_transition_to: IN_PROGRESS)
    - Full test coverage
    - JSON/YAML serialization works
