    notes: |
      CRITICAL TASK - Core of the unified completion model.

      KEY CONSOLIDATION: Criterion.blocks_transition_to unifies:
      - Dependencies (blocks_transition_to: IN_PROGRESS)
      - Success criteria (blocks_transition_to: COMPLETED)
      - Production gates (blocks_transition_to: PRODUCTION_READY)

      This ELIMINATES the separate Dependency class. All blocking
      relationships are now expressed as Criterion with appropriate
      blocks_transition_to value.

      Key insight: CompletableTarget criteria create parent-child
      relationships implicitly. The Completable containing the
      criterion is the parent; the referenced Completable is the child.

      Progress formula is universal per transition:
        progress = met_criteria / total_criteria
        (filtered by blocks_transition_to)

      can_transition_to(status) is THE unified interface for checking
      if any state transition is allowed.
