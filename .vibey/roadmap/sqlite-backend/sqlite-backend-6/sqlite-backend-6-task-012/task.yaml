task:
  id: sqlite-backend-6-task-012
  sprint_id: sqlite-backend-6
  track_id: sqlite-backend
  roadmap_id: vibey-framework-v2
  task_type: development
  title: Create SQLAlchemy ORM for Unified Completion Model
  description: "Create SQLAlchemy ORM models that map to the unified completion model.\n\
    Key change: criteria are stored in a separate table with polymorphic targets.\n\
    \nDESIGN REQUIREMENTS:\n\n1. ORM Strategy: Single-Table Inheritance for Tickets\n\
    \   - One `tickets` table with discriminator column\n   - All ticket types share\
    \ common columns\n   - Type-specific columns nullable\n\n2. Separate Criteria\
    \ Table (polymorphic targets)\n   The criteria table holds all completion criteria\
    \ with polymorphic\n   target types stored as JSON.\n\nSCHEMA:\n\n1. tickets table:\n\
    \   CREATE TABLE tickets (\n       id TEXT PRIMARY KEY,\n       name TEXT NOT\
    \ NULL,\n       description TEXT,\n       ticket_type TEXT NOT NULL,  -- discriminator\n\
    \n       -- Hierarchy & Ordering (Part 14 of UNIFIED_TICKET_ARCHITECTURE.md)\n\
    \       parent_id TEXT REFERENCES tickets(id),  -- ULID reference to parent\n\
    \       sequence INTEGER DEFAULT 0,  -- Sibling ordering (mutable)\n       slug\
    \ TEXT,  -- Human-readable path segment (mutable)\n\n       -- Lifecycle\n   \
    \    status TEXT NOT NULL,\n       created_at TEXT NOT NULL,\n       started_at\
    \ TEXT,\n       completed_at TEXT,\n       updated_at TEXT NOT NULL,\n\n     \
    \  -- Work (Ticket-specific)\n       assigned_agents_json TEXT,  -- JSON array\n\
    \       priority TEXT,\n       estimated_duration TEXT,\n       commits_json TEXT,\
    \  -- JSON array of GitCommit\n       -- NOTE: NO dependencies_json - dependencies\
    \ are now criteria\n       -- with blocks_transition_to = 'in_progress'\n\n  \
    \     -- Requirements (templates for children)\n       requirements_local_json\
    \ TEXT,  -- JSON array of Requirement\n\n       -- Metadata\n       metadata_json\
    \ TEXT,\n\n       -- Type-specific columns (nullable)\n       -- Roadmap\n   \
    \    version TEXT,\n       version_strategy_json TEXT,\n       activity_log_json\
    \ TEXT,\n\n       -- Track\n       strategic_value_json TEXT,\n\n       -- Sprint\n\
    \       plan_file TEXT,\n       goal TEXT,\n       success_criteria_json TEXT,\n\
    \       development_gates_json TEXT,\n\n       -- Task\n       task_type_detail\
    \ TEXT,\n       estimated_tokens INTEGER,\n       actual_tokens INTEGER,\n   \
    \    complexity TEXT,\n       gate_info_json TEXT,\n       audit_results_json\
    \ TEXT\n   );\n\n2. criteria table:\n   CREATE TABLE criteria (\n       id TEXT\
    \ PRIMARY KEY,\n       ticket_id TEXT NOT NULL REFERENCES tickets(id),\n     \
    \  description TEXT NOT NULL,\n       required INTEGER DEFAULT 1,  -- boolean\n\
    \n       -- UNIFIED BLOCKING: which transition does this block?\n       blocks_transition_to\
    \ TEXT NOT NULL DEFAULT 'completed',\n       -- Values: 'in_progress', 'completed',\
    \ 'production_ready'\n\n       -- Target (polymorphic via target_type)\n     \
    \  target_type TEXT NOT NULL,  -- discriminator\n       target_json TEXT NOT NULL,\
    \  -- type-specific target data\n\n       -- Cached state\n       is_met INTEGER,\
    \  -- boolean, cached\n       last_checked TEXT,\n\n       FOREIGN KEY (ticket_id)\
    \ REFERENCES tickets(id) ON DELETE CASCADE\n   );\n\n   -- Index for finding children\
    \ (CompletableTarget blocking COMPLETED)\n   CREATE INDEX idx_criteria_completable_target\n\
    \   ON criteria(json_extract(target_json, '$.completable_id'))\n   WHERE target_type\
    \ = 'completable' AND blocks_transition_to = 'completed';\n\n   -- Index for finding\
    \ dependencies (CompletableTarget blocking IN_PROGRESS)\n   CREATE INDEX idx_criteria_dependencies\n\
    \   ON criteria(json_extract(target_json, '$.completable_id'))\n   WHERE target_type\
    \ = 'completable' AND blocks_transition_to = 'in_progress';\n\n   -- Index for\
    \ finding criteria by transition type\n   CREATE INDEX idx_criteria_blocks_transition\n\
    \   ON criteria(ticket_id, blocks_transition_to);\n\n3. ORM Models:\n\n   class\
    \ TicketORM(Base):\n       __tablename__ = 'tickets'\n\n       id = Column(String,\
    \ primary_key=True)\n       name = Column(String, nullable=False)\n       ticket_type\
    \ = Column(String, nullable=False)\n       parent_id = Column(String, ForeignKey('tickets.id'))\
    \  # ULID ref\n       sequence = Column(Integer, default=0)  # Sibling ordering\n\
    \       slug = Column(String)  # Human-readable path segment\n       status =\
    \ Column(String, nullable=False)\n       # ... etc\n\n       # Relationships\n\
    \       criteria = relationship(\"CriterionORM\", back_populates=\"ticket\",\n\
    \                               cascade=\"all, delete-orphan\")\n       parent\
    \ = relationship(\"TicketORM\", remote_side=[id])\n\n       __mapper_args__ =\
    \ {\n           'polymorphic_on': ticket_type,\n           'polymorphic_identity':\
    \ 'ticket'\n       }\n\n   class CriterionORM(Base):\n       __tablename__ = 'criteria'\n\
    \n       id = Column(String, primary_key=True)\n       ticket_id = Column(String,\
    \ ForeignKey('tickets.id'), nullable=False)\n       description = Column(String,\
    \ nullable=False)\n       required = Column(Boolean, default=True)\n       blocks_transition_to\
    \ = Column(String, nullable=False, default='completed')\n       target_type =\
    \ Column(String, nullable=False)\n       target_json = Column(JSON, nullable=False)\n\
    \       is_met = Column(Boolean)\n       last_checked = Column(DateTime)\n\n \
    \      # Relationships\n       ticket = relationship(\"TicketORM\", back_populates=\"\
    criteria\")\n\n4. Target Serialization:\n\n   Each target type serializes to JSON:\n\
    \n   CompletableTarget:\n     {\"completable_id\": \"task-001\", \"required_status\"\
    : \"completed\",\n      \"current_status\": \"in_progress\", \"last_checked\"\
    : \"2025-11-29T...\"}\n\n   FileExistsTarget:\n     {\"paths\": [\"src/api.py\"\
    ], \"all_required\": true,\n      \"existing_paths\": [\"src/api.py\"], \"missing_paths\"\
    : [],\n      \"last_checked\": \"2025-11-29T...\"}\n\n   TestPassesTarget:\n \
    \    {\"test_command\": \"pytest tests/\", \"pass_threshold\": 100.0,\n      \"\
    coverage_threshold\": 85.0, \"last_result\": {...}}\n\n   ThresholdTarget:\n \
    \    {\"metric_name\": \"coverage\", \"threshold\": 85.0, \"comparison\": \"gte\"\
    ,\n      \"current_value\": 92.0, \"last_checked\": \"...\"}\n\n   ManualTarget:\n\
    \     {\"assessor\": \"senior-eng\", \"instructions\": \"Review code\",\n    \
    \  \"assessed\": true, \"met\": true, \"assessed_by\": \"john\",\n      \"evidence\"\
    : \"LGTM in PR #123\", \"assessed_at\": \"...\"}\n\n5. Pydantic <-> ORM Conversion:\n\
    \n   class CriterionORM:\n       @classmethod\n       def from_pydantic(cls, criterion:\
    \ Criterion) -> CriterionORM:\n           return cls(\n               id=criterion.id,\n\
    \               description=criterion.description,\n               required=criterion.required,\n\
    \               blocks_transition_to=criterion.blocks_transition_to.value,\n \
    \              target_type=criterion.target.type,\n               target_json=criterion.target.model_dump(),\n\
    \               is_met=criterion.is_met(),\n               last_checked=datetime.now()\n\
    \           )\n\n       def to_pydantic(self) -> Criterion:\n           target\
    \ = deserialize_target(self.target_type, self.target_json)\n           return\
    \ Criterion(\n               id=self.id,\n               description=self.description,\n\
    \               required=self.required,\n               blocks_transition_to=TicketStatus(self.blocks_transition_to),\n\
    \               target=target\n           )\n\n6. Repository Pattern:\n\n   class\
    \ TicketRepository:\n       def get(self, ticket_id: str) -> Optional[Ticket]\n\
    \       def get_with_criteria(self, ticket_id: str) -> Ticket\n       def save(self,\
    \ ticket: Ticket) -> None\n       def save_criterion(self, ticket_id: str, criterion:\
    \ Criterion) -> None\n       def delete_criterion(self, criterion_id: str) ->\
    \ None\n       def find_children(self, parent_id: str) -> List[Ticket]\n     \
    \  def find_dependencies(self, ticket_id: str) -> List[Criterion]\n       def\
    \ find_by_status(self, status: TicketStatus) -> List[Ticket]\n       def find_blocked(self)\
    \ -> List[Ticket]  # can_start() fails\n       def find_incomplete(self) -> List[Ticket]\
    \  # can_complete() fails\n       def find_criteria_by_transition(\n         \
    \  self, ticket_id: str, blocks: TicketStatus\n       ) -> List[Criterion]\n\n\
    IMPLEMENTATION:\n\n1. Create vibey/roadmap/models/ticket/orm.py:\n   - TicketORM\
    \ base and subclasses\n   - CriterionORM\n   - Target serialization/deserialization\n\
    \n2. Create vibey/roadmap/models/ticket/repository.py:\n   - TicketRepository\
    \ class\n   - CriterionRepository class\n\n3. Update database schema (migration\
    \ script if needed)\n\nSUCCESS CRITERIA:\n- Single-table inheritance for tickets\
    \ works\n- Criteria stored separately with polymorphic targets\n- blocks_transition_to\
    \ column in criteria table\n- ULID ordering columns: parent_id, sequence, slug\
    \ in tickets table\n- NO dependencies_json in tickets table (consolidated into\
    \ criteria)\n- Round-trip Pydantic -> ORM -> Pydantic without data loss\n- Repository\
    \ provides queries for criteria by transition type\n- find_children uses criteria\
    \ WHERE blocks_transition_to='completed'\n- find_dependencies uses criteria WHERE\
    \ blocks_transition_to='in_progress'\n- Computed fields (can_transition_to, progress_for_transition)\
    \ work correctly\n- 100% test coverage\n"
