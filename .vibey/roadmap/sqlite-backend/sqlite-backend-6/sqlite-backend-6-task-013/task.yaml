task:
  id: sqlite-backend-6-task-013
  sprint_id: sqlite-backend-6
  track_id: sqlite-backend
  roadmap_id: vibey-framework-v2
  task_type: development
  title: Migrate existing dataclass models to unified Pydantic models
  description: "Create migration adapters and update codebase to use the new unified\n\
    ticket architecture with criteria-based completion model.\n\nKEY ARCHITECTURAL\
    \ CHANGE:\nThe new model uses `criteria: List[Criterion]` as THE source of truth\n\
    for completion. Parent-child relationships are implicit via\nCompletableTarget\
    \ criteria, not explicit `tracks`/`sprints`/`tasks` lists.\n\nCURRENT STATE:\n\
    \nExisting Models (dataclasses in vibey/roadmap/models/):\n- roadmap.py: Roadmap,\
    \ Progress, TrackSummary, etc.\n- track.py: Track, TrackProgress, SprintSummary,\
    \ etc.\n- sprint.py: Sprint, SprintProgress, TaskSummary, etc.\n- task.py: Task,\
    \ TaskMetadata, GateInfo, etc.\n- common.py: Status, TaskStatus, Priority, TaskType,\
    \ etc.\n\nThese are used by:\n- vibey/roadmap/serialization/yaml_loader.py\n-\
    \ vibey/roadmap/serialization/yaml_dumper.py\n- vibey/roadmap/serialization/sql_loader.py\n\
    - vibey/roadmap/serialization/sql_dumper.py\n- vibey/operations/roadmap/*.py\n\
    - vibey/cli/commands.py\n\nMIGRATION STRATEGY:\n\n1. Phase 1: Adapter Layer (Non-Breaking)\n\
    \   Create adapters that convert between old and new models:\n\n   class ModelAdapter:\n\
    \       @staticmethod\n       def roadmap_to_ticket(old: Roadmap) -> RoadmapTicket:\n\
    \           # Convert explicit tracks list to CompletableTarget criteria\n   \
    \        criteria = [\n               Criterion(\n                   id=f\"track-{track_id}\"\
    ,\n                   description=f\"Track {track_id} complete\",\n          \
    \         target=CompletableTarget(\n                       completable_id=track_id,\n\
    \                       required_status=TicketStatus.COMPLETED\n             \
    \      )\n               )\n               for track_id in old.tracks\n      \
    \     ]\n           return RoadmapTicket(criteria=criteria, ...)\n\n       @staticmethod\n\
    \       def ticket_to_roadmap(new: RoadmapTicket) -> Roadmap:\n           # Extract\
    \ track IDs from CompletableTarget criteria\n           tracks = [\n         \
    \      c.target.completable_id\n               for c in new.criteria\n       \
    \        if isinstance(c.target, CompletableTarget)\n           ]\n          \
    \ return Roadmap(tracks=tracks, ...)\n\n   Similar adapters for Track -> TrackTicket,\
    \ Sprint -> SprintTicket, etc.\n\n2. Phase 2: Update Serialization\n   - yaml_loader.py:\
    \ Load YAML -> construct new Pydantic models\n     - Handle criteria field with\
    \ polymorphic targets\n     - Generate criteria from legacy tracks/sprints/tasks\
    \ lists\n   - yaml_dumper.py: Dump new Pydantic models -> YAML\n     - Serialize\
    \ criteria with target type discriminator\n     - Optionally emit legacy format\
    \ for backward compatibility\n   - sql_loader.py: Query DB -> construct via ORM\n\
    \     - Load from tickets + criteria tables (separate)\n     - Deserialize polymorphic\
    \ targets from JSON\n   - sql_dumper.py: Save via ORM\n     - Persist to tickets\
    \ + criteria tables\n     - Serialize targets as JSON with type discriminator\n\
    \n3. Phase 3: Update Operations\n   - Update vibey/operations/roadmap/*.py to\
    \ use new models\n   - Use TicketRepository pattern instead of direct SQL\n  \
    \ - Leverage smart accessors (is_complete, progress, children)\n   - Use Completable.can_complete()\
    \ for deterministic completion\n\n4. Phase 4: Deprecation\n   - Mark old models\
    \ as deprecated\n   - Update all imports to use new models\n   - Remove adapter\
    \ layer once migration complete\n   - Remove legacy YAML format support (or keep\
    \ as backward compat)\n\nFIELD MAPPING:\n\nOld Roadmap -> New RoadmapTicket:\n\
    - id -> id\n- name -> name\n- version -> version\n- status -> status\n- created\
    \ -> created_at\n- started -> started_at\n- completed -> completed_at\n- tracks\
    \ -> criteria (as CompletableTarget, blocks_transition_to=COMPLETED)\n- progress\
    \ -> (computed from criteria)\n- activity_log -> activity_log\n- metadata -> metadata\n\
    - blocked_by -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)\n\
    - depends_on -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)\n\
    \nNOTE: The Dependency class has been ELIMINATED. Dependencies are now\nexpressed\
    \ as Criterion with blocks_transition_to=IN_PROGRESS.\n\nOld Sprint -> New SprintTicket:\n\
    - tasks -> criteria (as CompletableTarget, blocks_transition_to=COMPLETED)\n-\
    \ deliverables -> criteria (as FileExistsTarget, blocks_transition_to=COMPLETED)\n\
    - success_criteria -> criteria.descriptions\n- depends_on -> criteria (as CompletableTarget,\
    \ blocks_transition_to=IN_PROGRESS)\n- development_gates -> criteria (as various\
    \ targets, blocks_transition_to=PRODUCTION_READY)\n\nOld Task -> New TaskTicket:\n\
    - deliverables (strings) -> criteria (as FileExistsTarget, blocks_transition_to=COMPLETED)\n\
    - depends_on -> criteria (as CompletableTarget, blocks_transition_to=IN_PROGRESS)\n\
    - (no subtasks - tasks are leaf nodes)\n- Add criteria for test coverage, code\
    \ review, etc.\n\nBREAKING CHANGES TO HANDLE:\n\n1. Children lists -> CompletableTarget\
    \ criteria (blocks_transition_to=COMPLETED)\n   - tracks: List[str] becomes criteria\
    \ with CompletableTarget\n   - sprints: List[str] becomes criteria with CompletableTarget\n\
    \   - tasks: List[str] becomes criteria with CompletableTarget\n\n2. Dependencies\
    \ -> CompletableTarget criteria (blocks_transition_to=IN_PROGRESS)\n   - blocked_by:\
    \ List[str] becomes criteria with CompletableTarget\n   - depends_on: List[Dependency]\
    \ becomes criteria with CompletableTarget\n   - The Dependency class is ELIMINATED\n\
    \n3. Production gates -> Criteria (blocks_transition_to=PRODUCTION_READY)\n  \
    \ - development_gates become criteria blocking production readiness\n\n4. Progress\
    \ is now computed from criteria PER TRANSITION\n   - progress = progress_for_transition(COMPLETED)\n\
    \   - start_progress = progress_for_transition(IN_PROGRESS)\n   - deploy_progress\
    \ = progress_for_transition(PRODUCTION_READY)\n\n5. can_transition_to(status)\
    \ is THE unified interface\n   - can_start() = can_transition_to(IN_PROGRESS)\n\
    \   - can_complete() = can_transition_to(COMPLETED)\n   - can_deploy() = can_transition_to(PRODUCTION_READY)\n\
    \   - Cannot override - THE guardrail against AI manipulation\n\n6. Deliverables\
    \ become FileExistsTarget criteria\n   - deliverables: [\"src/api.py\"] becomes:\n\
    \     criteria: [{target: {type: file_exists, paths: [\"src/api.py\"]},\n    \
    \            blocks_transition_to: completed}]\n\n7. Requirements cascade and\
    \ instantiate as criteria\n   - Roadmap requirements become task criteria via\
    \ instantiation\n\n8. Timestamp field names: created -> created_at\n\n9. Enum\
    \ consolidation: Status/TaskStatus -> TicketStatus\n\n10. ULID Identity System\
    \ (Part 14 of UNIFIED_TICKET_ARCHITECTURE.md):\n   - Slug-based IDs -> ULID format\
    \ ({type}_{ulid})\n   - Add parent_id (ULID reference), sequence, slug fields\n\
    \   - Migration generates ULIDs for existing entities\n   - Creates .id validation\
    \ files in directories\n\nYAML FORMAT CHANGES:\n\nOld format (explicit children\
    \ and dependencies):\n```yaml\nroadmap:\n  tracks:\n    - core-framework\n   \
    \ - goose-port\n  blocked_by:\n    - other-roadmap\n```\n\nNew format (criteria-based\
    \ with blocks_transition_to):\n```yaml\nroadmap:\n  criteria:\n    # Children\
    \ (block COMPLETED)\n    - id: track-core\n      description: Core framework track\
    \ complete\n      target:\n        type: completable\n        completable_id:\
    \ core-framework\n        required_status: completed\n      blocks_transition_to:\
    \ completed  # Default, can omit\n\n    # Dependencies (block IN_PROGRESS)\n \
    \   - id: dep-other-roadmap\n      description: Other roadmap must complete before\
    \ starting\n      target:\n        type: completable\n        completable_id:\
    \ other-roadmap\n        required_status: completed\n      blocks_transition_to:\
    \ in_progress  # Makes it a dependency\n\n    # Production gates (block PRODUCTION_READY)\n\
    \    - id: gate-security-audit\n      description: Security audit must pass\n\
    \      target:\n        type: manual\n        assessor: security-team\n      blocks_transition_to:\
    \ production_ready\n```\n\nMIGRATION TOOL:\n\nCreate vibey/roadmap/migration/yaml_migrator.py:\n\
    - migrate_roadmap_yaml(old_yaml) -> new_yaml\n- migrate_track_yaml(old_yaml) ->\
    \ new_yaml\n- migrate_sprint_yaml(old_yaml) -> new_yaml\n- migrate_task_yaml(old_yaml)\
    \ -> new_yaml\n\nEach function:\n1. Parses old YAML\n2. Converts to new Pydantic\
    \ model via adapter\n3. Dumps to new YAML format\n\nDELIVERABLES:\n\n1. vibey/roadmap/models/ticket/adapters.py:\n\
    \   - ModelAdapter class with conversion methods\n   - Legacy-to-criteria conversion\
    \ utilities\n   - Criteria-to-legacy extraction utilities\n\n2. vibey/roadmap/migration/yaml_migrator.py:\n\
    \   - YAML format migration functions\n   - Batch migration for entire roadmap\
    \ directory\n\n3. Updated serialization modules:\n   - yaml_loader.py: Handle\
    \ criteria with polymorphic targets\n   - yaml_dumper.py: Serialize criteria with\
    \ target type\n   - sql_loader.py: Load from tickets + criteria tables via ORM\n\
    \   - sql_dumper.py: Save to tickets + criteria tables via ORM\n\n4. Migration\
    \ documentation:\n   - Criteria-based completion model explained\n   - Field mapping\
    \ reference\n   - Breaking changes list\n   - Upgrade guide for any external code\n\
    \nSUCCESS CRITERIA:\n- Existing YAML files load correctly into new models\n- Legacy\
    \ children lists converted to CompletableTarget criteria\n- Round-trip YAML ->\
    \ Pydantic -> YAML produces equivalent output\n- Round-trip YAML -> Pydantic ->\
    \ SQLite -> Pydantic -> YAML works\n- All existing tests pass (with adapter layer)\n\
    - Operations use new repository pattern\n- is_complete computed correctly from\
    \ criteria\n- Progress computed correctly from criteria\n- No data loss during\
    \ migration\n"
