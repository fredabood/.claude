  task_type: development
  title: Define Enum Types for Unified Completion Model
  description: |
    Create all enum types needed by the unified completion model.
    This is the foundation - everything else imports from here.

    DESIGN PRINCIPLE: Single source of truth for all type values.
    All enums defined here, imported everywhere else.

    ENUM DEFINITIONS:

    1. TicketStatus (lifecycle states)
       Values:
       - NOT_STARTED = "not_started"
       - IN_PROGRESS = "in_progress"
       - PAUSED = "paused"
       - COMPLETED = "completed"
       - CANCELLED = "cancelled"

    2. TicketType (hierarchy discriminator)
       Values:
       - ROADMAP = "roadmap"
       - TRACK = "track"
       - SPRINT = "sprint"
       - TASK = "task"

    3. TaskType (semantic task classification)
       Values:
       - DEVELOPMENT = "development"
       - DOCUMENTATION = "documentation"
       - TESTING = "testing"
       - RESEARCH = "research"
       - REVIEW = "review"
       - INFRASTRUCTURE = "infrastructure"

    4. CriterionTargetType (polymorphic target discriminator)
       Values:
       - COMPLETABLE = "completable"      # Another ticket must be complete
       - FILE_EXISTS = "file_exists"      # File(s) must exist
       - TEST_PASSES = "test_passes"      # Test must pass
       - THRESHOLD = "threshold"          # Metric meets threshold
       - MANUAL = "manual"                # Human assessment
       - EXTERNAL = "external"            # External system check

    5. ThresholdComparison (how to compare values)
       Values:
       - GTE = "gte"   # >= (at least)
       - GT = "gt"     # > (more than)
       - EQ = "eq"     # == (exactly)
       - LTE = "lte"   # <= (at most)
       - LT = "lt"     # < (less than)

    6. Priority (ticket priority levels)
       Values:
       - CRITICAL = "critical"
       - HIGH = "high"
       - MEDIUM = "medium"
       - LOW = "low"

    7. Complexity (work complexity estimate)
       Values:
       - LOW = "low"
       - MEDIUM = "medium"
       - HIGH = "high"

    8. InheritMode (requirement inheritance behavior)
       Values:
       - INHERIT = "inherit"    # Use stricter of local vs ancestor
       - OVERRIDE = "override"  # Replace ancestor entirely
       - SKIP = "skip"          # Explicitly not applicable

    9. EnforcementMode (how strictly requirement applies)
       Values:
       - BLOCKING = "blocking"      # Prevents completion
       - WARNING = "warning"        # Shows warning, allows completion
       - AUDIT = "audit"            # Logs only

    10. RequirementType (what kind of requirement)
        Values:
        - TEST_COVERAGE = "test_coverage"
        - CODE_STYLE = "code_style"
        - DOCUMENTATION = "documentation"
        - SECURITY = "security"
        - PERFORMANCE = "performance"
        - REVIEW = "review"
        - CUSTOM = "custom"

    11. DependencyType (sibling relationship type)
        Values:
        - BLOCKS = "blocks"           # This blocks that
        - DEPENDS_ON = "depends_on"   # This depends on that
        - RELATED = "related"         # Informational link

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/enums.py
    2. Use Python StrEnum pattern for JSON/YAML serialization:
       class TicketStatus(str, Enum):
           NOT_STARTED = "not_started"

    3. Add docstrings for each enum and value
    4. Export all enums from __init__.py

    SUCCESS CRITERIA:
    - All 11 enum types defined
    - StrEnum pattern for serialization
    - Comprehensive docstrings
    - 100% test coverage
