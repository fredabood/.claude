task:
  id: sqlite-backend-6-task-014
  sprint_id: sqlite-backend-6
  track_id: sqlite-backend
  roadmap_id: vibey-framework-v2
  task_type: development
  title: Implement Requirement System (Criterion Templates)
  description: "Create the requirement system that generates criteria from templates.\n\
    Requirements cascade down the hierarchy and instantiate as criteria\nwhen applicable.\n\
    \nDESIGN PRINCIPLE: Requirements are reusable criterion templates.\nThey define\
    \ WHAT criteria should exist, not the criteria themselves.\nWhen applied to a\
    \ ticket, they generate actual Criterion instances.\n\nCORE CLASSES:\n\n1. Requirement\n\
    \   \"\"\"A criterion template that cascades down the hierarchy.\"\"\"\n\n   Fields:\n\
    \   - id: str (unique identifier, e.g., \"test-coverage\")\n   - name: str (human-readable\
    \ name)\n   - description: str (what this requirement enforces)\n\n   Template:\n\
    \   - criterion_template: CriterionTemplate (how to generate criterion)\n\n  \
    \ Applicability:\n   - applicability: ApplicabilityRules (when does this apply)\n\
    \n   Inheritance:\n   - inherit_mode: InheritMode (inherit, override, skip)\n\n\
    \   Enforcement:\n   - enforcement: EnforcementMode (blocking, warning, audit)\n\
    \n   Methods:\n   - is_applicable(ticket: Ticket) -> bool\n   - instantiate(ticket:\
    \ Ticket) -> Criterion\n   - compare_strictness(other: Requirement) -> int\n\n\
    2. CriterionTemplate\n   \"\"\"Template for generating a criterion.\"\"\"\n\n\
    \   Fields:\n   - target_type: CriterionTargetType (what kind of target)\n   -\
    \ target_config: Dict[str, Any] (type-specific configuration)\n   - description_template:\
    \ str (template for criterion description)\n\n   Methods:\n   - instantiate(ticket:\
    \ Ticket) -> Criterion:\n       target = create_target(self.target_type, self.target_config)\n\
    \       description = self.description_template.format(ticket=ticket)\n      \
    \ return Criterion(\n           id=f\"{self.id}-{ticket.id}\",\n           description=description,\n\
    \           target=target\n       )\n\n3. ApplicabilityRules\n   \"\"\"Rules for\
    \ when a requirement applies.\"\"\"\n\n   Fields:\n   - ticket_types: Optional[List[TicketType]]\n\
    \     (only apply to these ticket types)\n\n   - task_types: Optional[List[TaskType]]\n\
    \     (only apply to these task types)\n\n   - has_criterion_types: Optional[List[CriterionTargetType]]\n\
    \     (only apply if ticket has criteria of these types)\n\n   - has_file_patterns:\
    \ Optional[List[str]]\n     (only apply if ticket has file criteria matching patterns)\n\
    \n   - expression: Optional[str]\n     (custom expression for complex rules)\n\
    \n   Methods:\n   - matches(ticket: Ticket) -> bool:\n       # Check all rules,\
    \ return True if all match\n\n   Examples:\n   - \"Test coverage only if has code\
    \ files\":\n     ApplicabilityRules(\n         has_file_patterns=[\"*.py\", \"\
    *.ts\", \"*.js\"]\n     )\n\n   - \"Documentation review for doc tasks\":\n  \
    \   ApplicabilityRules(\n         task_types=[TaskType.DOCUMENTATION]\n     )\n\
    \n   - \"Security review for all sprint-level\":\n     ApplicabilityRules(\n \
    \        ticket_types=[TicketType.SPRINT]\n     )\n\n4. RequirementResolver\n\
    \   \"\"\"Resolves effective requirements for a ticket.\"\"\"\n\n   Methods:\n\
    \   - resolve(ticket: Ticket) -> List[Requirement]:\n       \"\"\"\n       Get\
    \ effective requirements for a ticket.\n\n       Algorithm:\n       1. Collect\
    \ requirements from ancestors (roadmap → track → sprint)\n       2. Collect local\
    \ requirements\n       3. For each local requirement:\n          - INHERIT: use\
    \ stricter of local vs ancestor\n          - OVERRIDE: replace ancestor with local\n\
    \          - SKIP: exclude this requirement type\n       4. Filter to applicable\
    \ requirements\n       5. Return final list\n       \"\"\"\n\n   - collect_ancestor_requirements(ticket:\
    \ Ticket) -> List[Requirement]\n   - resolve_inheritance(local: Requirement, inherited:\
    \ Requirement) -> Requirement\n   - filter_applicable(requirements: List[Requirement],\
    \ ticket: Ticket) -> List[Requirement]\n\n5. RequirementInstantiator\n   \"\"\"\
    Instantiates requirements as criteria on a ticket.\"\"\"\n\n   Methods:\n   -\
    \ instantiate_requirements(ticket: Ticket) -> List[Criterion]:\n       \"\"\"\n\
    \       Convert applicable requirements to criteria.\n\n       Called when:\n\
    \       - Ticket is created\n       - Ticket criteria are modified (may affect\
    \ applicability)\n       - Requirements are updated on ancestors\n       \"\"\"\
    \n       resolver = RequirementResolver()\n       requirements = resolver.resolve(ticket)\n\
    \       criteria = []\n       for req in requirements:\n           if req.is_applicable(ticket):\n\
    \               criterion = req.instantiate(ticket)\n               criteria.append(criterion)\n\
    \       return criteria\n\nSTRICTNESS COMPARISON:\n\nFor requirements with thresholds\
    \ (test coverage, etc.):\n- INHERIT mode uses the stricter of local vs ancestor\n\
    - \"Stricter\" depends on comparison type:\n  - GTE/GT: higher threshold is stricter\
    \ (≥95% vs ≥85%)\n  - LTE/LT: lower threshold is stricter (≤5 errors vs ≤10 errors)\n\
    \nExample:\n- Sprint has test coverage ≥85%\n- Task has test coverage ≥95% (INHERIT\
    \ mode)\n- Result: ≥95% is used (stricter)\n\n- Sprint has test coverage ≥85%\n\
    - Task has no test coverage requirement\n- Result: ≥85% inherited from sprint\n\
    \n- Sprint has test coverage ≥85%\n- Task is documentation-only (no code files)\n\
    - Result: Requirement not applicable (filtered out)\n\nEXAMPLE REQUIREMENTS:\n\
    \n1. Test Coverage Requirement:\n   Requirement(\n       id=\"test-coverage\"\
    ,\n       name=\"Test Coverage\",\n       description=\"Code must have test coverage\"\
    ,\n       criterion_template=CriterionTemplate(\n           target_type=CriterionTargetType.THRESHOLD,\n\
    \           target_config={\n               \"metric_name\": \"coverage\",\n \
    \              \"threshold\": 85.0,\n               \"comparison\": \"gte\"\n\
    \           },\n           description_template=\"Test coverage ≥{threshold}%\"\
    \n       ),\n       applicability=ApplicabilityRules(\n           has_file_patterns=[\"\
    *.py\"]\n       ),\n       inherit_mode=InheritMode.INHERIT,\n       enforcement=EnforcementMode.BLOCKING\n\
    \   )\n\n2. Code Review Requirement:\n   Requirement(\n       id=\"code-review\"\
    ,\n       name=\"Code Review\",\n       description=\"Code must be reviewed\"\
    ,\n       criterion_template=CriterionTemplate(\n           target_type=CriterionTargetType.MANUAL,\n\
    \           target_config={\n               \"assessor\": \"senior-engineer\"\
    ,\n               \"instructions\": \"Review code for quality and correctness\"\
    \n           },\n           description_template=\"Code review by {assessor}\"\
    \n       ),\n       applicability=ApplicabilityRules(\n           task_types=[TaskType.DEVELOPMENT]\n\
    \       ),\n       inherit_mode=InheritMode.INHERIT,\n       enforcement=EnforcementMode.BLOCKING\n\
    \   )\n\nIMPLEMENTATION:\n\n1. Create vibey/roadmap/models/ticket/requirements.py:\n\
    \   - Requirement class\n   - CriterionTemplate class\n   - ApplicabilityRules\
    \ class\n   - RequirementResolver class\n   - RequirementInstantiator class\n\n\
    2. Use Pydantic v2 BaseModel\n3. Implement strictness comparison for thresholds\n\
    4. Full test coverage for resolution algorithm\n\nSUCCESS CRITERIA:\n- Requirement\
    \ class with all fields\n- CriterionTemplate generates correct criteria\n- ApplicabilityRules\
    \ filters correctly\n- RequirementResolver handles inheritance modes\n- Strictness\
    \ comparison works for thresholds\n- Full test coverage\n"
