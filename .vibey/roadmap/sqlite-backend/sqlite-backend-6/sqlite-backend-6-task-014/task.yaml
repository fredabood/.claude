  title: Implement Requirement System (Criterion Templates)
  description: |
    Create the requirement system that generates criteria from templates.
    Requirements cascade down the hierarchy and instantiate as criteria
    when applicable.

    DESIGN PRINCIPLE: Requirements are reusable criterion templates.
    They define WHAT criteria should exist, not the criteria themselves.
    When applied to a ticket, they generate actual Criterion instances.

    CORE CLASSES:

    1. Requirement
       """A criterion template that cascades down the hierarchy."""

       Fields:
       - id: str (unique identifier, e.g., "test-coverage")
       - name: str (human-readable name)
       - description: str (what this requirement enforces)

       Template:
       - criterion_template: CriterionTemplate (how to generate criterion)

       Applicability:
       - applicability: ApplicabilityRules (when does this apply)

       Inheritance:
       - inherit_mode: InheritMode (inherit, override, skip)

       Enforcement:
       - enforcement: EnforcementMode (blocking, warning, audit)

       Methods:
       - is_applicable(ticket: Ticket) -> bool
       - instantiate(ticket: Ticket) -> Criterion
       - compare_strictness(other: Requirement) -> int

    2. CriterionTemplate
       """Template for generating a criterion."""

       Fields:
       - target_type: CriterionTargetType (what kind of target)
       - target_config: Dict[str, Any] (type-specific configuration)
       - description_template: str (template for criterion description)

       Methods:
       - instantiate(ticket: Ticket) -> Criterion:
           target = create_target(self.target_type, self.target_config)
           description = self.description_template.format(ticket=ticket)
           return Criterion(
               id=f"{self.id}-{ticket.id}",
               description=description,
               target=target
           )

    3. ApplicabilityRules
       """Rules for when a requirement applies."""

       Fields:
       - ticket_types: Optional[List[TicketType]]
         (only apply to these ticket types)

       - task_types: Optional[List[TaskType]]
         (only apply to these task types)

       - has_criterion_types: Optional[List[CriterionTargetType]]
         (only apply if ticket has criteria of these types)

       - has_file_patterns: Optional[List[str]]
         (only apply if ticket has file criteria matching patterns)

       - expression: Optional[str]
         (custom expression for complex rules)

       Methods:
       - matches(ticket: Ticket) -> bool:
           # Check all rules, return True if all match

       Examples:
       - "Test coverage only if has code files":
         ApplicabilityRules(
             has_file_patterns=["*.py", "*.ts", "*.js"]
         )

       - "Documentation review for doc tasks":
         ApplicabilityRules(
             task_types=[TaskType.DOCUMENTATION]
         )

       - "Security review for all sprint-level":
         ApplicabilityRules(
             ticket_types=[TicketType.SPRINT]
         )

    4. RequirementResolver
       """Resolves effective requirements for a ticket."""

       Methods:
       - resolve(ticket: Ticket) -> List[Requirement]:
           """
           Get effective requirements for a ticket.

           Algorithm:
           1. Collect requirements from ancestors (roadmap → track → sprint)
           2. Collect local requirements
           3. For each local requirement:
              - INHERIT: use stricter of local vs ancestor
              - OVERRIDE: replace ancestor with local
              - SKIP: exclude this requirement type
           4. Filter to applicable requirements
           5. Return final list
           """

       - collect_ancestor_requirements(ticket: Ticket) -> List[Requirement]
       - resolve_inheritance(local: Requirement, inherited: Requirement) -> Requirement
       - filter_applicable(requirements: List[Requirement], ticket: Ticket) -> List[Requirement]

    5. RequirementInstantiator
       """Instantiates requirements as criteria on a ticket."""

       Methods:
       - instantiate_requirements(ticket: Ticket) -> List[Criterion]:
           """
           Convert applicable requirements to criteria.

           Called when:
           - Ticket is created
           - Ticket criteria are modified (may affect applicability)
           - Requirements are updated on ancestors
           """
           resolver = RequirementResolver()
           requirements = resolver.resolve(ticket)
           criteria = []
           for req in requirements:
               if req.is_applicable(ticket):
                   criterion = req.instantiate(ticket)
                   criteria.append(criterion)
           return criteria

    STRICTNESS COMPARISON:

    For requirements with thresholds (test coverage, etc.):
    - INHERIT mode uses the stricter of local vs ancestor
    - "Stricter" depends on comparison type:
      - GTE/GT: higher threshold is stricter (≥95% vs ≥85%)
      - LTE/LT: lower threshold is stricter (≤5 errors vs ≤10 errors)

    Example:
    - Sprint has test coverage ≥85%
    - Task has test coverage ≥95% (INHERIT mode)
    - Result: ≥95% is used (stricter)

    - Sprint has test coverage ≥85%
    - Task has no test coverage requirement
    - Result: ≥85% inherited from sprint

    - Sprint has test coverage ≥85%
    - Task is documentation-only (no code files)
    - Result: Requirement not applicable (filtered out)

    EXAMPLE REQUIREMENTS:

    1. Test Coverage Requirement:
       Requirement(
           id="test-coverage",
           name="Test Coverage",
           description="Code must have test coverage",
           criterion_template=CriterionTemplate(
               target_type=CriterionTargetType.THRESHOLD,
               target_config={
                   "metric_name": "coverage",
                   "threshold": 85.0,
                   "comparison": "gte"
               },
               description_template="Test coverage ≥{threshold}%"
           ),
           applicability=ApplicabilityRules(
               has_file_patterns=["*.py"]
           ),
           inherit_mode=InheritMode.INHERIT,
           enforcement=EnforcementMode.BLOCKING
       )

    2. Code Review Requirement:
       Requirement(
           id="code-review",
           name="Code Review",
           description="Code must be reviewed",
           criterion_template=CriterionTemplate(
               target_type=CriterionTargetType.MANUAL,
               target_config={
                   "assessor": "senior-engineer",
                   "instructions": "Review code for quality and correctness"
               },
               description_template="Code review by {assessor}"
           ),
           applicability=ApplicabilityRules(
               task_types=[TaskType.DEVELOPMENT]
           ),
           inherit_mode=InheritMode.INHERIT,
           enforcement=EnforcementMode.BLOCKING
       )

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/requirements.py:
       - Requirement class
       - CriterionTemplate class
       - ApplicabilityRules class
       - RequirementResolver class
       - RequirementInstantiator class

    2. Use Pydantic v2 BaseModel
    3. Implement strictness comparison for thresholds
    4. Full test coverage for resolution algorithm

    SUCCESS CRITERIA:
    - Requirement class with all fields
    - CriterionTemplate generates correct criteria
    - ApplicabilityRules filters correctly
    - RequirementResolver handles inheritance modes
    - Strictness comparison works for thresholds
    - Full test coverage
