    notes: |
      Requirements are criterion TEMPLATES, not criteria themselves.

      Key distinction:
      - Requirement: "All dev tasks need 85% test coverage"
      - Criterion: "task-001 has 85% test coverage" (instantiated)

      The RequirementResolver handles the hybrid inheritance:
      - INHERIT: stricter wins
      - OVERRIDE: local replaces ancestor
      - SKIP: explicitly not applicable

      ApplicabilityRules filter out requirements that don't apply:
      - Test coverage doesn't apply to documentation tasks
      - Security review only applies to sprint-level
