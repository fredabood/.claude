    notes: |
      GAP REMEDIATION: Auto-Progression Support

      This task adds the infrastructure needed for automatic status
      progression when criteria are met. The is_automatic flag tells
      the system which criteria can be auto-evaluated vs which require
      human intervention.

      Key insight: ManualTarget is the ONLY non-automatic target.
      All others can refresh their state from external sources.
