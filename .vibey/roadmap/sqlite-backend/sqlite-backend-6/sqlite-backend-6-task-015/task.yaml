  title: Add is_automatic Flag and refresh() to CriterionTarget
  description: "Implement the is_automatic property and refresh() method on all CriterionTarget\n\
    types to support auto-progression of parent tickets when children complete.\n\n\
    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 11.5\n\nCHANGES TO CriterionTarget\
    \ BASE CLASS:\n\n1. Add abstract property:\n   @property\n   @abstractmethod\n\
    \   def is_automatic(self) -> bool:\n       \"\"\"Can this target auto-evaluate\
    \ without human intervention?\"\"\"\n\n2. Add optional refresh method:\n   def\
    \ refresh(self, context: RefreshContext) -> None:\n       \"\"\"Refresh cached\
    \ state from external source.\"\"\"\n       pass  # Default no-op, override in\
    \ subclasses\n\n3. Create RefreshContext dataclass:\n   @dataclass\n   class RefreshContext:\n\
    \       ticket_registry: TicketRegistry\n       test_runner: Optional[TestRunner]\
    \ = None\n       metrics: Optional[MetricsSource] = None\n       http_client:\
    \ Optional[HttpClient] = None\n       activity_log: List[ActivityLogEntry] = field(default_factory=list)\n\
    \nPER-TARGET IMPLEMENTATION:\n\nCompletableTarget:\n  - is_automatic: True (can\
    \ check ticket status)\n  - refresh(): Update current_status from ticket_registry\n\
    \nFileExistsTarget:\n  - is_automatic: True (can check filesystem)\n  - refresh():\
    \ Update existing_paths/missing_paths via Path.exists()\n\nTestPassesTarget:\n\
    \  - is_automatic: True (can run test command)\n  - refresh(): Run test_command,\
    \ update last_result\n\nThresholdTarget:\n  - is_automatic: True (can query metrics)\n\
    \  - refresh(): Get current_value from metrics source\n\nManualTarget:\n  - is_automatic:\
    \ False (requires human)\n  - refresh(): No-op (must use assess() method)\n\n\
    ExternalTarget:\n  - is_automatic: True (can query endpoint)\n  - refresh(): HTTP\
    \ GET to endpoint, update current_status\n\nFILE CHANGES:\n- vibey/roadmap/models/ticket/targets.py\
    \ (update all target classes)\n- vibey/roadmap/models/ticket/support.py (add RefreshContext)\n\
    - tests/roadmap/models/ticket/test_targets.py (add refresh tests)\n\nSUCCESS CRITERIA:\n\
    - All CriterionTarget types implement is_automatic property\n- Automatic targets\
    \ implement refresh() method\n- ManualTarget.is_automatic returns False\n- RefreshContext\
    \ provides access to external systems\n- Full test coverage for refresh behavior\n"
