  title: Implement Deferred Flag on Ticket with Completion Exclusion
  description: |
    Add the `deferred` boolean flag to the Ticket base class and update
    completion logic to exclude deferred children from blocking checks.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 12.3 (GAP-ML-005)

    BACKGROUND:

    The `deferred` flag marks tickets as optional for production. A parent
    ticket can complete even if deferred children are not complete.

    Example use case:
    - Track has 12 sprints
    - Sprint 12 is marked `deferred: true` (optional optimization work)
    - Track can complete when sprints 1-11 are done
    - Sprint 12 doesn't block track completion

    IMPLEMENTATION:

    1. ADD FIELD TO TICKET (Layer 1):

       class Ticket(Completable):
           """Layer 1: Base ticket with work semantics."""

           # ... existing fields ...

           # Deferral flag - marks ticket as optional for production
           deferred: bool = False

    2. ADD HELPER METHOD TO HIERARCHICALTICKET (Layer 2):

       class HierarchicalTicket(Ticket):
           """Layer 2: Ticket with hierarchy-aware accessors."""

           def _is_child_deferred(self, child_id: str) -> bool:
               """Check if a child ticket is deferred."""
               child = self._load_child(child_id)
               return child.deferred if child else False

           @property
           def required_children(self) -> List[str]:
               """Children that are required (not deferred)."""
               return [
                   c.target.completable_id
                   for c in self.criteria
                   if isinstance(c.target, CompletableTarget)
                   and not self._is_child_deferred(c.target.completable_id)
               ]

           @property
           def deferred_children(self) -> List[str]:
               """Children that are deferred (optional for production)."""
               return [
                   c.target.completable_id
                   for c in self.criteria
                   if isinstance(c.target, CompletableTarget)
                   and self._is_child_deferred(c.target.completable_id)
               ]

    3. UPDATE can_transition_to() IN COMPLETABLE:

       def can_transition_to(self, status: TicketStatus) -> tuple[bool, List[str]]:
           """
           Check if transition is allowed.

           Deferred children are excluded from blocking checks.
           """
           blocking = []
           for criterion in self.criteria:
               if criterion.blocks_transition_to != status:
                   continue
               if not criterion.required:
                   continue

               # Skip deferred children for COMPLETED/PRODUCTION_READY checks
               if isinstance(criterion.target, CompletableTarget):
                   if self._is_child_deferred(criterion.target.completable_id):
                       continue  # Deferred child doesn't block

               if not criterion.is_met:
                   blocking.append(criterion.description)

           return (len(blocking) == 0, blocking)

    4. UPDATE PROGRESS CALCULATION:

       def progress_for_transition(self, status: TicketStatus) -> Progress:
           """Progress computed per transition type, excluding deferred."""
           relevant = []
           for c in self.criteria:
               if c.blocks_transition_to != status:
                   continue
               # Exclude deferred children from progress calculation
               if isinstance(c.target, CompletableTarget):
                   if self._is_child_deferred(c.target.completable_id):
                       continue
               relevant.append(c)

           total = len(relevant)
           met = sum(1 for c in relevant if c.is_met)
           return Progress(
               total=total,
               completed=met,
               completion_percent=(met / total * 100) if total > 0 else 100.0
           )

    5. DATABASE SCHEMA:

       -- Add to tickets table
       ALTER TABLE tickets ADD COLUMN deferred INTEGER DEFAULT 0;

       -- View for required vs deferred children
       CREATE VIEW v_required_children AS
       SELECT
           parent.id AS parent_id,
           child.id AS child_id,
           child.deferred
       FROM tickets parent
       JOIN criteria c ON c.ticket_id = parent.id
       JOIN tickets child ON json_extract(c.target_data, '$.completable_id') = child.id
       WHERE c.target_type = 'completable';

    FILE CHANGES:
    - vibey/roadmap/models/ticket/ticket.py (add deferred field)
    - vibey/roadmap/models/ticket/hierarchical.py (add helpers, update can_transition_to)
    - vibey/roadmap/models/ticket/completable.py (update progress calculation)
    - vibey/roadmap/database/schema.py (add deferred column)
    - tests/roadmap/models/ticket/test_deferred.py (new test file)

    SUCCESS CRITERIA:
    - deferred: bool field exists on Ticket with default False
    - _is_child_deferred() helper works correctly
    - required_children excludes deferred children
    - deferred_children returns only deferred children
    - can_transition_to() skips deferred children
    - progress_for_transition() excludes deferred children
    - Parent can complete with incomplete deferred children
    - Full test coverage
