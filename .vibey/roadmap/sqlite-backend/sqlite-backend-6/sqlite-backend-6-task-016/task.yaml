  title: Implement auto_progress() Method on HierarchicalTicket
  description: "Implement the auto_progress() method that refreshes automatic criteria\n\
    and progresses ticket status when all criteria for a transition are met.\n\nDESIGN\
    \ REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 11.5\n\nAUTO_PROGRESS ALGORITHM:\n\
    \ndef auto_progress(self, context: RefreshContext) -> List[str]:\n    \"\"\"\n\
    \    Refresh automatic criteria and progress status if possible.\n    Returns\
    \ list of transitions made.\n    \"\"\"\n    transitions = []\n\n    # Step 1:\
    \ Refresh all automatic criteria\n    for criterion in self.criteria:\n      \
    \  if criterion.target.is_automatic:\n            criterion.target.refresh(context)\n\
    \n    # Step 2: Check each possible transition in order\n    status_order = [\n\
    \        TicketStatus.IN_PROGRESS,\n        TicketStatus.COMPLETION_GATE_CHECK,\n\
    \        TicketStatus.COMPLETED,\n        TicketStatus.PRODUCTION_GATE_CHECK,\n\
    \        TicketStatus.PRODUCTION_READY,\n    ]\n\n    for target_status in status_order:\n\
    \        if self.status.precedes(target_status):\n            can, reasons = self.can_transition_to(target_status)\n\
    \            if can:\n                old_status = self.status\n             \
    \   self._transition_to(target_status)\n                transitions.append(f\"\
    {self.id}: {old_status} → {target_status}\")\n\n                # Log the auto-progression\n\
    \                context.activity_log.append(ActivityLogEntry(\n             \
    \       timestamp=datetime.now(timezone.utc),\n                    type=ActivityType.AUTO_PROGRESSION,\n\
    \                    description=f\"Auto-progressed from {old_status} to {target_status}\"\
    ,\n                    entity_type=self.ticket_type,\n                    entity_id=self.id,\n\
    \                    field=\"status\",\n                    old_value=old_status.value,\n\
    \                    new_value=target_status.value\n                ))\n\n   \
    \ return transitions\n\nHELPER METHOD:\n\ndef _transition_to(self, status: TicketStatus)\
    \ -> None:\n    \"\"\"Internal method to update status and timestamps.\"\"\"\n\
    \    self.status = status\n    self.updated_at = datetime.now(timezone.utc)\n\n\
    \    if status == TicketStatus.IN_PROGRESS:\n        self.started_at = datetime.now(timezone.utc)\n\
    \    elif status == TicketStatus.COMPLETED:\n        self.completed_at = datetime.now(timezone.utc)\n\
    \    # ... other status-specific timestamp updates\n\nSTATUS ORDERING:\n\nAdd\
    \ to TicketStatus enum:\n    def precedes(self, other: \"TicketStatus\") -> bool:\n\
    \        \"\"\"Check if this status comes before other in progression.\"\"\"\n\
    \        order = [NOT_STARTED, IN_PROGRESS, PAUSED, COMPLETION_GATE_CHECK,\n \
    \                COMPLETED, PRODUCTION_GATE_CHECK, PRODUCTION_READY, DEPLOYED]\n\
    \        try:\n            return order.index(self) < order.index(other)\n   \
    \     except ValueError:\n            return False  # Terminal states don't precede\
    \ anything\n\nFILE CHANGES:\n- vibey/roadmap/models/ticket/hierarchical.py (add\
    \ auto_progress)\n- vibey/roadmap/models/ticket/enums.py (add precedes() method)\n\
    - tests/roadmap/models/ticket/test_hierarchical.py (test auto_progress)\n\nSUCCESS\
    \ CRITERIA:\n- auto_progress() refreshes all automatic criteria\n- Status progression\
    \ follows correct order\n- Each transition is logged to activity_log\n- Non-automatic\
    \ criteria (ManualTarget) are skipped during refresh\n- Terminal states (WONT_DO,\
    \ SUPERSEDED) stop progression\n- Full test coverage including edge cases\n"
