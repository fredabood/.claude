  title: Implement auto_progress() Method on HierarchicalTicket
  description: |
    Implement the auto_progress() method that refreshes automatic criteria
    and progresses ticket status when all criteria for a transition are met.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 11.5

    AUTO_PROGRESS ALGORITHM:

    def auto_progress(self, context: RefreshContext) -> List[str]:
        """
        Refresh automatic criteria and progress status if possible.
        Returns list of transitions made.
        """
        transitions = []

        # Step 1: Refresh all automatic criteria
        for criterion in self.criteria:
            if criterion.target.is_automatic:
                criterion.target.refresh(context)

        # Step 2: Check each possible transition in order
        status_order = [
            TicketStatus.IN_PROGRESS,
            TicketStatus.COMPLETION_GATE_CHECK,
            TicketStatus.COMPLETED,
            TicketStatus.PRODUCTION_GATE_CHECK,
            TicketStatus.PRODUCTION_READY,
        ]

        for target_status in status_order:
            if self.status.precedes(target_status):
                can, reasons = self.can_transition_to(target_status)
                if can:
                    old_status = self.status
                    self._transition_to(target_status)
                    transitions.append(f"{self.id}: {old_status} → {target_status}")

                    # Log the auto-progression
                    context.activity_log.append(ActivityLogEntry(
                        timestamp=datetime.now(timezone.utc),
                        type=ActivityType.AUTO_PROGRESSION,
                        description=f"Auto-progressed from {old_status} to {target_status}",
                        entity_type=self.ticket_type,
                        entity_id=self.id,
                        field="status",
                        old_value=old_status.value,
                        new_value=target_status.value
                    ))

        return transitions

    HELPER METHOD:

    def _transition_to(self, status: TicketStatus) -> None:
        """Internal method to update status and timestamps."""
        self.status = status
        self.updated_at = datetime.now(timezone.utc)

        if status == TicketStatus.IN_PROGRESS:
            self.started_at = datetime.now(timezone.utc)
        elif status == TicketStatus.COMPLETED:
            self.completed_at = datetime.now(timezone.utc)
        # ... other status-specific timestamp updates

    STATUS ORDERING:

    Add to TicketStatus enum:
        def precedes(self, other: "TicketStatus") -> bool:
            """Check if this status comes before other in progression."""
            order = [NOT_STARTED, IN_PROGRESS, PAUSED, COMPLETION_GATE_CHECK,
                     COMPLETED, PRODUCTION_GATE_CHECK, PRODUCTION_READY, DEPLOYED]
            try:
                return order.index(self) < order.index(other)
            except ValueError:
                return False  # Terminal states don't precede anything

    FILE CHANGES:
    - vibey/roadmap/models/ticket/hierarchical.py (add auto_progress)
    - vibey/roadmap/models/ticket/enums.py (add precedes() method)
    - tests/roadmap/models/ticket/test_hierarchical.py (test auto_progress)

    SUCCESS CRITERIA:
    - auto_progress() refreshes all automatic criteria
    - Status progression follows correct order
    - Each transition is logged to activity_log
    - Non-automatic criteria (ManualTarget) are skipped during refresh
    - Terminal states (WONT_DO, SUPERSEDED) stop progression
    - Full test coverage including edge cases
