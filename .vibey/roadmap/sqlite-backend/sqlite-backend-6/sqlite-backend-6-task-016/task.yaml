      GAP REMEDIATION: Auto-Progression Implementation

      This is the core auto-progression logic. When a child ticket completes,
      calling auto_progress() on the parent will:
      1. Refresh all automatic criteria (checking child status)
      2. Progress the parent's status if all criteria are met
      3. Log each transition to the activity log

      This replaces the scattered auto-progression logic in the current
      update.py with a centralized, testable method on the model itself.
