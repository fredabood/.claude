  title: Add DeliverableType and computed_tokens to Model Layer
  description: "Implement DeliverableType classification on FileExistsTarget and\n\
    computed_tokens aggregation on HierarchicalTicket.\n\nDESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md\
    \ Parts 11.4 and 11.7\n\nPART 1: DeliverableType on FileExistsTarget\n\nAdd DeliverableType\
    \ enum:\n    class DeliverableType(str, Enum):\n        CODE = \"code\"\n    \
    \    TEST = \"test\"\n        DOCUMENTATION = \"documentation\"\n        CONFIG\
    \ = \"config\"\n        OTHER = \"other\"\n\nUpdate FileExistsTarget:\n    class\
    \ FileExistsTarget(CriterionTarget):\n        paths: List[str]\n        all_required:\
    \ bool = True\n        deliverable_type: DeliverableType = DeliverableType.OTHER\
    \  # NEW\n\nThis enables:\n- Querying by deliverable type (\"show all CODE deliverables\"\
    )\n- Reporting (\"Sprint has 5 code, 3 test deliverables\")\n- Requirements can\
    \ target specific types\n\nPART 2: computed_tokens on HierarchicalTicket\n\nTaskTicket\
    \ already has estimated_tokens. Add computed aggregation:\n\n    class HierarchicalTicket(Ticket):\n\
    \        @computed_field\n        def computed_tokens(self) -> int:\n        \
    \    \"\"\"\n            Token estimate for this ticket.\n            - Ultimate\
    \ children (tasks): return estimated_tokens\n            - Parents: aggregate\
    \ from children's computed_tokens\n            \"\"\"\n            if self.is_ultimate_child:\n\
    \                return getattr(self, 'estimated_tokens', 0)\n\n            #\
    \ Aggregate from children\n            return sum(\n                child.computed_tokens\n\
    \                for child in self._load_children()\n            )\n\nUpdate start()\
    \ method signature:\n    def start(self, platform_context_window: Optional[int]\
    \ = None) -> tuple[bool, List[str]]:\n        can, reasons = self.can_transition_to(TicketStatus.IN_PROGRESS)\n\
    \n        # Platform fit check (warning, not blocker)\n        if platform_context_window\
    \ and self.computed_tokens > platform_context_window:\n            warning = (\n\
    \                f\"Ticket requires ~{self.computed_tokens} tokens but platform\
    \ \"\n                f\"context window is {platform_context_window}. Consider\
    \ splitting.\"\n            )\n            reasons.append(warning)\n         \
    \   logger.warning(warning)\n\n        if can:\n            self.status = TicketStatus.IN_PROGRESS\n\
    \            self.started_at = datetime.now(timezone.utc)\n\n        return (can,\
    \ reasons)\n\nFILE CHANGES:\n- vibey/roadmap/models/ticket/enums.py (add DeliverableType)\n\
    - vibey/roadmap/models/ticket/targets.py (add deliverable_type field)\n- vibey/roadmap/models/ticket/hierarchical.py\
    \ (add computed_tokens)\n- vibey/roadmap/models/ticket/ticket.py (update start()\
    \ signature)\n- tests/roadmap/models/ticket/test_tokens.py (new test file)\n\n\
    SUCCESS CRITERIA:\n- DeliverableType enum with 5 values\n- FileExistsTarget has\
    \ deliverable_type field with default OTHER\n- computed_tokens returns estimated_tokens\
    \ for tasks\n- computed_tokens aggregates from children for sprints/tracks\n-\
    \ start() accepts optional platform_context_window parameter\n- Context window\
    \ warning is logged but doesn't block\n- Full test coverage for aggregation\n"
