    notes: |
      Sprint to implement unified ticket architecture with three layers:

      LAYER 1: Base Ticket
      - Atomic work unit with core identity, status, lifecycle
      - Pydantic BaseModel with validation
      - No knowledge of hierarchy or relationships

      LAYER 2: HierarchicalTicket
      - Parent/child relationships
      - Aggregation (push-up): commits, deliverables, progress
      - Inheritance (push-down): standards, quality_gates, assigned_agents
      - Sibling dependencies (depends_on, blocks)

      LAYER 3: Domain Models
      - RoadmapTicket: Top-level, version management, activity log
      - TrackTicket: Parallelization boundary, priority, strategic value
      - SprintTicket: Deployable unit, lifecycle gates, planning
      - TaskTicket: Atomic work, estimation, gate info

      ARCHITECTURE BENEFITS:
      - Single source of truth for field definitions
      - Explicit aggregation/inheritance rules
      - Pydantic validation replaces manual __post_init__
      - SQLAlchemy ORM for database interaction
      - Type-safe with full IDE support

      PARALLEL WITH SPRINT 6:
      - Sprint 6 focuses on file format and directory structure
      - Sprint 6a focuses on Python object model and ORM
      - Both can proceed independently
      - Integration happens in Sprint 7 (Data Validation)
