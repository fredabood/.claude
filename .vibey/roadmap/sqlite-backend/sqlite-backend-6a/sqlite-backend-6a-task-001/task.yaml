  title: Implement Layer 1 - Base Ticket with Pydantic
  description: |
    Create the foundational Ticket class using Pydantic BaseModel.
    This is the atomic unit that all hierarchy levels inherit from.

    DESIGN REQUIREMENTS:

    1. Core Identity Fields:
       - id: str (globally unique identifier)
       - name: str (human-readable name/title)
       - description: Optional[str]

    2. Status & Lifecycle Fields:
       - status: TicketStatus enum (not_started, in_progress, paused, blocked, completed, cancelled)
       - blocked: bool
       - blocked_reason: Optional[str]

    3. Timestamp Fields:
       - created_at: datetime (required, defaults to now)
       - started_at: Optional[datetime]
       - completed_at: Optional[datetime]
       - updated_at: datetime (auto-updated)

    4. Metadata:
       - metadata: dict[str, Any] (flexible key-value store)

    5. Validators:
       - started_at >= created_at
       - completed_at >= started_at
       - IN_PROGRESS requires started_at
       - COMPLETED requires completed_at
       - blocked=True requires blocked_reason

    6. Methods:
       - can_start() -> bool
       - can_complete() -> bool
       - start() -> Ticket (returns new instance)
       - complete() -> Ticket (returns new instance)

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/__init__.py
    2. Create vibey/roadmap/models/ticket/base.py with:
       - TicketStatus enum
       - Ticket class

    3. Use Pydantic v2 features:
       - Field() with descriptions
       - field_validator for field-level validation
       - model_validator for cross-field validation
       - computed_field for derived properties
       - model_copy() for immutable updates

    FILE STRUCTURE:
    vibey/roadmap/models/ticket/
      __init__.py
      base.py          <- This task
      hierarchical.py  <- Task 002
      domain.py        <- Tasks 003-006

    SUCCESS CRITERIA:
    - All validators pass for valid data
    - Invalid data raises ValidationError with clear messages
    - Immutable state transitions via model_copy()
    - 100% test coverage for Ticket class
