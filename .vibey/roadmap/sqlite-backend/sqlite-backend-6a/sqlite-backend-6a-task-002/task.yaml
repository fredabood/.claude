  title: Implement Layer 2 - HierarchicalTicket with aggregation/inheritance
  description: |
    Create the HierarchicalTicket class that adds parent/child relationships
    with explicit aggregation (push-up) and inheritance (push-down) semantics.

    DESIGN REQUIREMENTS:

    1. Hierarchy Fields:
       - parent_id: Optional[str] (ID of parent ticket)
       - _parent: PrivateAttr (loaded lazily, not serialized)
       - _children: PrivateAttr (loaded lazily, not serialized)

    2. Dependency Fields (between siblings):
       - depends_on: list[DependencyRef]
       - blocks: list[DependencyRef]
       - depended_on_by: list[str] (reverse index)

    3. Aggregation Pattern (push-up from children):
       For each aggregated field, define:
       - {field}_local: list[T] (values directly on this ticket)
       - {field}_aggregated: list[T] (computed from all descendants)

       Fields to aggregate:
       - commits: concat strategy
       - deliverables: concat strategy
       - progress: computed (count completed/total children)

    4. Inheritance Pattern (push-down from ancestors):
       For each inherited field, define:
       - {field}_local: list[T] (values defined on this ticket)
       - {field}_effective: list[T] (local + inherited from ancestors)

       Fields to inherit:
       - standards: merge strategy (all values kept)
       - quality_gates: merge strategy
       - assigned_agents: default_only strategy (inherit only if local empty)

    5. Configuration Classes:
       - AggregationRule(field_name, strategy, source_field)
       - InheritanceRule(field_name, strategy, source_field)

       Strategies:
       - concat: append all child values
       - union: deduplicated concat
       - sum: sum numeric values
       - count: count of items
       - merge: local + all inherited
       - override: local wins, else nearest ancestor
       - default_only: only inherit if local empty
       - append: ancestors first, then local

    6. Methods:
       - aggregate_from_children(children) -> dict
       - compute_progress(children) -> Progress
       - inherit_from_ancestors(ancestors) -> dict
       - is_blocked_by_dependencies() -> bool
       - get_blocking_dependencies() -> list[DependencyRef]
       - can_transition_to(status) -> tuple[bool, Optional[str]]

    7. Supporting Classes:
       - DependencyRef: blocker_id, blocker_type, required_status, current_status,
                        blocks_transition_to, reason, last_checked, is_satisfied property
       - Progress: total, completed, percent, breakdown dict

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/hierarchical.py
    2. Define class-level _aggregation_rules and _inheritance_rules as ClassVar
    3. Use Generic[T] for type-safe child type hints
    4. Implement aggregation/inheritance computation methods

    SUCCESS CRITERIA:
    - Aggregation correctly rolls up commits/deliverables from children
    - Inheritance correctly merges standards from ancestors
    - Dependency blocking logic works for status transitions
    - Progress computation handles nested hierarchies
    - 100% test coverage
