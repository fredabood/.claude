  title: Implement Layer 3 - RoadmapTicket
  description: |
    Create the RoadmapTicket class - the top-level container in the hierarchy.
    Roadmap has no parent and aggregates from all descendant tracks/sprints/tasks.

    DESIGN REQUIREMENTS:

    1. Type Discriminator:
       - ticket_type: Literal["roadmap"] = "roadmap"

    2. Aggregation Rules (inherits from HierarchicalTicket):
       - commits: concat from Track -> Sprint -> Task
       - deliverables: concat from Track -> Sprint -> Task

    3. Inheritance Rules:
       - standards: merge (roadmap standards cascade to all descendants)

    4. Roadmap-Specific Fields:
       Version Management:
       - version: str (semantic version, default "0.1.0")
       - version_strategy: Optional[VersionStrategy]
       - version_history: list[VersionHistoryEntry]

       Timing:
       - target_completion: Optional[datetime]
       - deployed_at: Optional[datetime]

       Activity:
       - activity_log: list[ActivityLogEntry]

       Platforms:
       - deployed_platforms: list[PlatformDeployment]

       External Dependencies:
       - external_dependencies: list[ExternalDependency]

    5. Computed Properties:
       - tracks_total: int (from progress_local)
       - tracks_completed: int (from progress_local)

    6. Validators:
       - Roadmap cannot have a parent (parent_id must be None)

    7. Supporting Classes (if not already defined):
       - VersionStrategy: major_on, minor_on, patch_on triggers
       - VersionHistoryEntry: version, date, milestone, git_tag, description
       - ActivityLogEntry: timestamp, type, description, context
       - PlatformDeployment: platform, context_window, deployed_at, deployed_by, primary
       - ExternalDependency: type, name, status, required_for

    IMPLEMENTATION:

    1. Add RoadmapTicket to vibey/roadmap/models/ticket/domain.py
    2. Define _aggregation_rules and _inheritance_rules as ClassVar
    3. Implement roadmap-specific validators
    4. Add computed properties for progress access

    SUCCESS CRITERIA:
    - Roadmap cannot have parent_id set
    - Standards defined on roadmap are inherited by all tracks/sprints/tasks
    - Commits from tasks aggregate up to roadmap level
    - Activity log captures roadmap-level events
    - Version management works correctly
    - 100% test coverage
