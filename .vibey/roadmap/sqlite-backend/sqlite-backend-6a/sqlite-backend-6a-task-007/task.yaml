  title: Create SQLAlchemy ORM mapping for unified models
  description: |
    Create SQLAlchemy ORM models that map to the unified ticket architecture.
    Use single-table inheritance for the ticket hierarchy.

    DESIGN REQUIREMENTS:

    1. ORM Strategy: Single-Table Inheritance
       - One `tickets` table with discriminator column
       - All ticket types share common columns
       - Type-specific columns nullable (only used by that type)
       - Efficient for our read-heavy workload

    2. Base ORM Model:
       class TicketORM(Base):
           __tablename__ = 'tickets'

           # Identity
           id = Column(String, primary_key=True)
           name = Column(String, nullable=False)
           ticket_type = Column(String, nullable=False)  # discriminator

           # Hierarchy
           parent_id = Column(String, ForeignKey('tickets.id'))

           # Status
           status = Column(String, nullable=False)
           blocked = Column(Boolean, default=False)
           blocked_reason = Column(String)

           # Timestamps
           created_at = Column(DateTime, nullable=False)
           started_at = Column(DateTime)
           completed_at = Column(DateTime)
           updated_at = Column(DateTime, nullable=False)

           # JSON columns for complex data
           metadata_json = Column(JSON)
           depends_on_json = Column(JSON)
           blocks_json = Column(JSON)
           commits_local_json = Column(JSON)
           deliverables_local_json = Column(JSON)
           standards_local_json = Column(JSON)

           # Relationships
           parent = relationship("TicketORM", remote_side=[id], backref="children")

           __mapper_args__ = {
               'polymorphic_on': ticket_type,
               'polymorphic_identity': 'ticket'
           }

    3. Subclass ORM Models:
       class RoadmapORM(TicketORM):
           __mapper_args__ = {'polymorphic_identity': 'roadmap'}
           version = Column(String)
           version_strategy_json = Column(JSON)
           activity_log_json = Column(JSON)
           # ... roadmap-specific columns

       class TrackORM(TicketORM):
           __mapper_args__ = {'polymorphic_identity': 'track'}
           roadmap_id = Column(String)
           priority = Column(String)
           strategic_value_json = Column(JSON)
           # ... track-specific columns

       class SprintORM(TicketORM):
           __mapper_args__ = {'polymorphic_identity': 'sprint'}
           track_id = Column(String)
           roadmap_id = Column(String)
           plan_file = Column(String)
           # ... sprint-specific columns

       class TaskORM(TicketORM):
           __mapper_args__ = {'polymorphic_identity': 'task'}
           sprint_id = Column(String)
           track_id = Column(String)
           roadmap_id = Column(String)
           task_type_detail = Column(String)  # development, completion_gate, etc.
           estimated_tokens = Column(Integer)
           # ... task-specific columns

    4. Pydantic <-> ORM Conversion:
       - TicketORM.from_pydantic(ticket: Ticket) -> TicketORM
       - TicketORM.to_pydantic() -> Ticket
       - Handle JSON serialization for complex fields
       - Preserve type discrimination

    5. Repository Pattern:
       class TicketRepository:
           def __init__(self, session: Session): ...
           def get(self, ticket_id: str) -> Optional[Ticket]: ...
           def get_with_children(self, ticket_id: str) -> Ticket: ...
           def get_with_ancestors(self, ticket_id: str) -> Ticket: ...
           def save(self, ticket: Ticket) -> None: ...
           def delete(self, ticket_id: str) -> None: ...
           def find_by_status(self, status: TicketStatus) -> list[Ticket]: ...
           def find_blocked(self) -> list[Ticket]: ...

    6. Session Management:
       - Use existing connection.py infrastructure
       - Support both direct connections and context managers
       - Transaction support for atomic updates

    IMPLEMENTATION:

    1. Create vibey/roadmap/models/ticket/orm.py:
       - TicketORM base class
       - RoadmapORM, TrackORM, SprintORM, TaskORM subclasses
       - Pydantic conversion methods

    2. Create vibey/roadmap/models/ticket/repository.py:
       - TicketRepository class
       - CRUD operations
       - Query methods

    3. Update vibey/roadmap/database/connection.py if needed:
       - SQLAlchemy engine/session creation
       - Integration with existing get_connection()

    SUCCESS CRITERIA:
    - Single-table inheritance works correctly
    - Pydantic models round-trip through ORM without data loss
    - Repository provides clean API for ticket operations
    - JSON columns correctly serialize/deserialize complex objects
    - Existing database schema compatible (or migration provided)
    - 100% test coverage
