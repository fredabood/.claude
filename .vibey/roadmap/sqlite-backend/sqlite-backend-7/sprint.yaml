    notes: |
      Sprint 7: Artifact System Architecture

      DESIGN REFERENCE: sqlite-backend-6/context/architecture/03-ARTIFACT-SYSTEM.md

      GOAL: Implement Artifact as a Completable sibling (not child) that exists
      independently of tickets. This enables tracking of pre-existing files,
      generated documentation, framework components, and comprehensive impact
      analysis.

      DEPENDS ON: Sprint 6 (unified ticket architecture)

      KEY ARCHITECTURAL INSIGHT:
      - Artifact EXTENDS Completable (sibling to Ticket, not child)
      - Both Artifact and Ticket share criteria-based completion
      - Use CompletableTarget for BOTH (ArtifactTarget is REMOVED)
      - Artifacts have implicit FileExistsTarget (file must exist)
      - Documentation staleness via documented_source_hash comparison

      LAYER ARCHITECTURE (from sqlite-backend-6):
      ┌─────────────────────────────────────────────────────────────┐
      │ LAYER 0: COMPLETABLE                                         │
      │                    ┌──────────────────────────────┐          │
      │                    │       Completable            │          │
      │                    │  id, name, status, criteria  │          │
      │                    └──────────────┬───────────────┘          │
      │                                   │                          │
      │                    ┌──────────────┴──────────────┐           │
      │                    ▼                             ▼           │
      │              ┌──────────┐               ┌────────────────┐   │
      │              │  Ticket  │               │    Artifact    │   │
      │              │ (work)   │               │ (file entity)  │   │
      │              └────┬─────┘               └────────────────┘   │
      │                   ↓                                          │
      │         HierarchicalTicket → Domain Models                   │
      └─────────────────────────────────────────────────────────────┘

      ARTIFACT STATUS PROGRESSION:
      - NOT_STARTED: File doesn't exist (FileExistsTarget not met)
      - IN_PROGRESS: File exists, but other criteria not met
      - COMPLETED: File exists AND all criteria pass

      ARTIFACT PROVENANCE TYPES:
      - TICKET_CREATED: Created by ticket work
      - PRE_EXISTING: Existed before roadmap system
      - GENERATED: Auto-generated from other artifacts
      - EXTERNAL: From external source
      - FRAMEWORK: Vibey framework component

      ARTIFACT TYPES:
      - CODE, TEST, CONFIG
      - DOCUMENTATION (project docs)
      - CONTEXT (ticket planning/execution)
      - AGENT, WORKFLOW, TEMPLATE (framework)
      - DATA, ASSET, SCHEMA, OTHER

      COMMIT TRACKING ON ARTIFACTS:
      - created_by_commit: SHA of commit that created the file
      - last_modified_by_commit: SHA of most recent modifying commit
      - deleted_by_commit: SHA if file was deleted
      - commit_history: List of all SHAs that touched this artifact

      TASK EXECUTION ORDER:
      1. Task 001 (SQLAlchemy Core Setup) - Engine, metadata, connection management
      2. Task 002 (Table Definitions) - Define all tables using SQLAlchemy Table()
      3. Task 003 (JSON Dialect Helpers) - Abstract json_extract vs jsonb operators
      4. Task 004 (Enums) - ArtifactType, ProvenanceType
      5. Task 005 (Artifact entity) - extends Completable, depends on 004
      6. Task 006 (ArtifactProvenance) - depends on 004
      7. Task 007 (CompletableTarget update) - ensure works for Artifacts
      8. Task 008 (Database schema migration) - artifact columns via SQLAlchemy
      9. Task 009 (ImpactAnalyzer) - staleness detection
      10. Task 010 (Layer integration) - link with GitCommit
      11. Task 011 (Test suite) - comprehensive tests for both systems

      SQLALCHEMY CORE RATIONALE:
      - SQLAlchemy Core (not ORM) for transparent SQL generation
      - Keeps existing Pydantic models as domain layer (no model duplication)
      - Automatic dialect handling: SQLite json_extract() vs PostgreSQL ->>
      - Single Table() definition works for both databases
      - Easy to debug: print(stmt) shows exact SQL
      - Minimal learning curve vs full ORM

      DATABASE CONFIGURATION:
      ```python
      # Default: SQLite (local development, single-user)
      DATABASE_URL = "sqlite:///.vibey/roadmap.db"

      # Alternative: PostgreSQL (team, cloud deployment)
      DATABASE_URL = "postgresql://user:pass@host/vibey"
      ```

      CONNECTION MANAGEMENT:
      ```python
      from sqlalchemy import create_engine, MetaData

      engine = create_engine(os.environ.get("DATABASE_URL", "sqlite:///.vibey/roadmap.db"))
      metadata = MetaData()

      # Tables defined once, work on both backends
      completables = Table("completables", metadata, ...)
      criteria = Table("criteria", metadata, ...)
      ```

      JSON DIALECT ABSTRACTION:
      ```python
      def json_field(column, path: str):
          """Dialect-aware JSON field extraction."""
          if engine.dialect.name == "sqlite":
              return func.json_extract(column, f"$.{path}")
          else:  # PostgreSQL
              return column[path].astext
      ```

