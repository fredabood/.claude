  deliverables:
  - SQLAlchemy Core integration (dialect-agnostic database layer)
  - Table definitions using SQLAlchemy Table objects (not ORM models)
  - Connection management with engine/connection abstraction
  - Dialect-aware JSON helpers (sqlite json_extract vs postgres jsonb operators)
  - Database backend configuration (DATABASE_URL environment variable)
  - Artifact entity class (extends Completable at Layer 0)
  - ArtifactProvenance with provenance types (TICKET_CREATED, PRE_EXISTING, GENERATED,
    EXTERNAL, FRAMEWORK)
  - ArtifactType enum with subtypes (CODE, TEST, CONFIG, DOCUMENTATION, CONTEXT, etc.)
  - CompletableTarget works for both Tickets AND Artifacts (no separate ArtifactTarget)
  - Implicit FileExistsTarget criterion on all Artifacts
  - Artifact rows in completables table (single-table inheritance via completable_type='artifact')
  - Artifact commit tracking fields (created_by_commit, last_modified_by_commit, commit_history)
  - v_orphan_artifacts and v_documentation_graph views
  - v_stale_documentation view for staleness detection
  - ImpactAnalyzer for documentation staleness via documented_source_hash
  - Comprehensive test suite for artifact system and database abstraction
