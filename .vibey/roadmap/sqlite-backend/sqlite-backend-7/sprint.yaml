    notes: |
      Sprint 7: Artifact System Architecture

      DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13

      GOAL: Implement Artifact as a first-class entity (Layer 0a) that exists
      independently of tickets. This enables tracking of pre-existing files,
      generated documentation, framework components, and comprehensive impact
      analysis.

      DEPENDS ON: Sprint 6 (unified ticket architecture)

      KEY ARCHITECTURAL CHANGE:
      - Artifact exists independently of tickets
      - Criteria reference artifacts via ArtifactTarget (by ID)
      - Artifacts track provenance (how they came to exist)
      - Documentation artifacts link to what they document
      - Staleness detection via content hash comparison

      LAYER ARCHITECTURE UPDATE:
      ┌─────────────────────────────────────────────┐
      │ LAYER 0a: ARTIFACT (NEW)                    │
      │ First-class entity for file-based artifacts │
      ├─────────────────────────────────────────────┤
      │ LAYER 0b: COMPLETABLE                       │
      │ Base abstraction with criteria              │
      ├─────────────────────────────────────────────┤
      │ LAYER 1: TICKET                             │
      │ Work semantics                              │
      ├─────────────────────────────────────────────┤
      │ LAYER 2: HIERARCHICAL TICKET                │
      │ Smart accessors                             │
      ├─────────────────────────────────────────────┤
      │ LAYER 3: DOMAIN MODELS                      │
      │ RoadmapTicket, TrackTicket, etc.            │
      └─────────────────────────────────────────────┘

      ARTIFACT PROVENANCE TYPES:
      - TICKET_CREATED: Created by ticket work
      - PRE_EXISTING: Existed before roadmap system
      - GENERATED: Auto-generated from other artifacts
      - EXTERNAL: From external source
      - FRAMEWORK: Vibey framework component

      ARTIFACT TYPES:
      - CODE, TEST, CONFIG
      - DOCUMENTATION (project docs)
      - CONTEXT (ticket planning/execution)
      - AGENT, WORKFLOW, TEMPLATE (framework)
      - DATA, ASSET, SCHEMA, OTHER

      TASK EXECUTION ORDER:
      1. Task 001 (Enums) - ArtifactType, ProvenanceType, ArtifactVerification
      2. Task 002 (Artifact entity) - depends on 001
      3. Task 003 (ArtifactProvenance) - depends on 001
      4. Task 004 (ArtifactTarget) - depends on 002
      5. Task 005 (Database schema) - depends on 002, 003, 004
      6. Task 006 (ImpactAnalyzer) - depends on 005
      7. Task 007 (Layer integration) - depends on 002, 004, 006
      8. Task 008 (Test suite) - depends on all

