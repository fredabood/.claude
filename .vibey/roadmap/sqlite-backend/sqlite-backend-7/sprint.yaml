      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2518\n\nARTIFACT STATUS PROGRESSION:\n- NOT_STARTED: File\
      \ doesn't exist (FileExistsTarget not met)\n- IN_PROGRESS: File exists, but\
      \ other criteria not met\n- COMPLETED: File exists AND all criteria pass\n\n\
      ARTIFACT PROVENANCE TYPES:\n- TICKET_CREATED: Created by ticket work\n- PRE_EXISTING:\
      \ Existed before roadmap system\n- GENERATED: Auto-generated from other artifacts\n\
      - EXTERNAL: From external source\n- FRAMEWORK: Vibey framework component\n\n\
      ARTIFACT TYPES:\n- CODE, TEST, CONFIG\n- DOCUMENTATION (project docs)\n- CONTEXT\
      \ (ticket planning/execution)\n- AGENT, WORKFLOW, TEMPLATE (framework)\n- DATA,\
      \ ASSET, SCHEMA, OTHER\n\nCOMMIT TRACKING ON ARTIFACTS:\n- created_by_commit:\
      \ SHA of commit that created the file\n- last_modified_by_commit: SHA of most\
      \ recent modifying commit\n- deleted_by_commit: SHA if file was deleted\n- commit_history:\
      \ List of all SHAs that touched this artifact\n\nTASK EXECUTION ORDER:\n1. Task\
      \ 001 (SQLAlchemy Core Setup) - Engine, metadata, connection management\n2.\
      \ Task 002 (Table Definitions) - Define all tables using SQLAlchemy Table()\n\
      3. Task 003 (JSON Dialect Helpers) - Abstract json_extract vs jsonb operators\n\
      4. Task 004 (Enums) - ArtifactType, ProvenanceType\n5. Task 005 (Artifact entity)\
      \ - extends Completable, depends on 004\n6. Task 006 (ArtifactProvenance) -\
      \ depends on 004\n7. Task 007 (CompletableTarget update) - ensure works for\
      \ Artifacts\n8. Task 008 (Database schema migration) - artifact columns via\
      \ SQLAlchemy\n9. Task 009 (ImpactAnalyzer) - staleness detection\n10. Task 010\
      \ (Layer integration) - link with GitCommit\n11. Task 011 (Test suite) - comprehensive\
      \ tests for both systems\n\nSQLALCHEMY CORE RATIONALE:\n- SQLAlchemy Core (not\
      \ ORM) for transparent SQL generation\n- Keeps existing Pydantic models as domain\
      \ layer (no model duplication)\n- Automatic dialect handling: SQLite json_extract()\
      \ vs PostgreSQL ->>\n- Single Table() definition works for both databases\n\
      - Easy to debug: print(stmt) shows exact SQL\n- Minimal learning curve vs full\
      \ ORM\n\nDATABASE CONFIGURATION:\n```python\n# Default: SQLite (local development,\
      \ single-user)\nDATABASE_URL = \"sqlite:///.vibey/roadmap.db\"\n\n# Alternative:\
      \ PostgreSQL (team, cloud deployment)\nDATABASE_URL = \"postgresql://user:pass@host/vibey\"\
      \n```\n\nCONNECTION MANAGEMENT:\n```python\nfrom sqlalchemy import create_engine,\
      \ MetaData\n\nengine = create_engine(os.environ.get(\"DATABASE_URL\", \"sqlite:///.vibey/roadmap.db\"\
      ))\nmetadata = MetaData()\n\n# Tables defined once, work on both backends\n\
      completables = Table(\"completables\", metadata, ...)\ncriteria = Table(\"criteria\"\
      , metadata, ...)\n```\n\nJSON DIALECT ABSTRACTION:\n```python\ndef json_field(column,\
      \ path: str):\n    \"\"\"Dialect-aware JSON field extraction.\"\"\"\n    if\
      \ engine.dialect.name == \"sqlite\":\n        return func.json_extract(column,\
      \ f\"$.{path}\")\n    else:  # PostgreSQL\n        return column[path].astext\n\
      ```\n"
