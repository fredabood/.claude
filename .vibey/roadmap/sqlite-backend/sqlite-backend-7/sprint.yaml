      \                     \u2502\n\u2502         HierarchicalTicket \u2192 Domain\
      \ Models                   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
