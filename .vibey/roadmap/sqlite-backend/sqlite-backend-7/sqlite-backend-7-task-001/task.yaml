  task_type: development
  title: Define Artifact System Enums
  description: "Create enum types for the artifact system: ArtifactType, ProvenanceType,\n\
    ArtifactVerification, and subtype enums.\n\nDESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md\
    \ Part 13.5, 13.6, Appendix E\n\nENUMS TO IMPLEMENT:\n\n1. ArtifactType (primary\
    \ classification):\n   - CODE: Source code (.py, .js, .ts, etc.)\n   - TEST: Test\
    \ files\n   - CONFIG: Configuration files (.yaml, .json, .toml)\n   - DOCUMENTATION:\
    \ Project docs (describes current state)\n   - CONTEXT: Ticket context (planning,\
    \ notes, retros)\n   - AGENT: Vibey agent definition\n   - WORKFLOW: Vibey workflow\
    \ definition\n   - TEMPLATE: Handoff or rendering template\n   - DATA: Data files,\
    \ fixtures, samples\n   - ASSET: Images, diagrams, media\n   - SCHEMA: API schemas,\
    \ database schemas\n   - OTHER: Catch-all\n\n   Properties:\n   - is_documentation_type:\
    \ bool (DOCUMENTATION, CONTEXT)\n   - is_code_type: bool (CODE, TEST, CONFIG)\n\
    \   - is_framework_type: bool (AGENT, WORKFLOW, TEMPLATE)\n\n2. ProvenanceType\
    \ (how artifact came to exist):\n   - TICKET_CREATED: Created by a ticket's work\n\
    \   - PRE_EXISTING: Existed before roadmap system\n   - GENERATED: Auto-generated\
    \ from other artifacts\n   - EXTERNAL: From external source (vendored, fetched)\n\
    \   - FRAMEWORK: Vibey framework component\n\n3. ArtifactVerification (how to\
    \ verify criterion is satisfied):\n   - EXISTS: Files exist (default)\n   - NOT_STALE:\
    \ Exists AND not stale (for documentation)\n   - HASH_UNCHANGED: Content hasn't\
    \ changed since criterion created\n\n4. ContextArtifactSubtype (subtypes for CONTEXT\
    \ artifacts):\n   - PLANNING_DOC: Pre-work planning (design doc, RFC)\n   - IMPLEMENTATION_NOTES:\
    \ During-work notes\n   - DECISION_RECORD: ADR, design decisions\n   - AUDIT_REPORT:\
    \ Validation/audit results\n   - RETROSPECTIVE: Post-work reflection\n\n5. DocumentationSubtype\
    \ (subtypes for DOCUMENTATION artifacts):\n   - README: README files\n   - API_REFERENCE:\
    \ API documentation\n   - USER_GUIDE: How-to guides\n   - ARCHITECTURE: Architecture\
    \ documentation\n   - CHANGELOG: Version history\n   - TUTORIAL: Step-by-step\
    \ tutorials\n\n6. DocumentationHealth (aggregate documentation status):\n   -\
    \ HEALTHY: All docs current\n   - DEGRADED: Some docs stale (non-blocking)\n \
    \  - CRITICAL: Stale docs blocking completion\n\nFILE LOCATION:\nvibey/roadmap/models/ticket/artifact_enums.py\n\
    \nSUCCESS CRITERIA:\n- All 6 enums implemented with correct values\n- Property\
    \ methods on ArtifactType work correctly\n- JSON/YAML serialization works\n- Full\
    \ test coverage\n"
