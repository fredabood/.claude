  title: Define Artifact System Enums
  description: |
    Create enum types for the artifact system: ArtifactType, ProvenanceType,
    ArtifactVerification, and subtype enums.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.5, 13.6, Appendix E

    ENUMS TO IMPLEMENT:

    1. ArtifactType (primary classification):
       - CODE: Source code (.py, .js, .ts, etc.)
       - TEST: Test files
       - CONFIG: Configuration files (.yaml, .json, .toml)
       - DOCUMENTATION: Project docs (describes current state)
       - CONTEXT: Ticket context (planning, notes, retros)
       - AGENT: Vibey agent definition
       - WORKFLOW: Vibey workflow definition
       - TEMPLATE: Handoff or rendering template
       - DATA: Data files, fixtures, samples
       - ASSET: Images, diagrams, media
       - SCHEMA: API schemas, database schemas
       - OTHER: Catch-all

       Properties:
       - is_documentation_type: bool (DOCUMENTATION, CONTEXT)
       - is_code_type: bool (CODE, TEST, CONFIG)
       - is_framework_type: bool (AGENT, WORKFLOW, TEMPLATE)

    2. ProvenanceType (how artifact came to exist):
       - TICKET_CREATED: Created by a ticket's work
       - PRE_EXISTING: Existed before roadmap system
       - GENERATED: Auto-generated from other artifacts
       - EXTERNAL: From external source (vendored, fetched)
       - FRAMEWORK: Vibey framework component

    3. ArtifactVerification (how to verify criterion is satisfied):
       - EXISTS: Files exist (default)
       - NOT_STALE: Exists AND not stale (for documentation)
       - HASH_UNCHANGED: Content hasn't changed since criterion created

    4. ContextArtifactSubtype (subtypes for CONTEXT artifacts):
       - PLANNING_DOC: Pre-work planning (design doc, RFC)
       - IMPLEMENTATION_NOTES: During-work notes
       - DECISION_RECORD: ADR, design decisions
       - AUDIT_REPORT: Validation/audit results
       - RETROSPECTIVE: Post-work reflection

    5. DocumentationSubtype (subtypes for DOCUMENTATION artifacts):
       - README: README files
       - API_REFERENCE: API documentation
       - USER_GUIDE: How-to guides
       - ARCHITECTURE: Architecture documentation
       - CHANGELOG: Version history
       - TUTORIAL: Step-by-step tutorials

    6. DocumentationHealth (aggregate documentation status):
       - HEALTHY: All docs current
       - DEGRADED: Some docs stale (non-blocking)
       - CRITICAL: Stale docs blocking completion

    FILE LOCATION:
    vibey/roadmap/models/ticket/artifact_enums.py

    SUCCESS CRITERIA:
    - All 6 enums implemented with correct values
    - Property methods on ArtifactType work correctly
    - JSON/YAML serialization works
    - Full test coverage
