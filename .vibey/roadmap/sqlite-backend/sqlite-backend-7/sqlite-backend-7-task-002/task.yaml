  task_type: development
  title: Implement Artifact Entity (Layer 0a)
  description: |
    Create the Artifact entity as a first-class entity independent of tickets.
    This is the core of the artifact system.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.3

    ARTIFACT ENTITY FIELDS:

    Identity:
    - id: str (ULID)
    - name: str
    - description: Optional[str]

    File Location:
    - paths: List[str] (one artifact may span multiple files)
    - content_hash: Optional[str] (SHA256 of concatenated file contents)
    - last_verified: Optional[datetime] (when files were last checked)

    Classification:
    - artifact_type: ArtifactType
    - artifact_subtype: Optional[str] (more specific classification)

    Provenance:
    - provenance: ArtifactProvenance (how artifact came to exist)

    Relationships:
    - documents_artifact_id: Optional[str] (what does this artifact document?)
    - depends_on_artifact_ids: List[str] (artifact dependencies)

    State:
    - exists: bool (False if files were deleted)
    - is_stale: bool (for docs: source artifact changed since last update)

    Timestamps:
    - created_at: datetime
    - updated_at: datetime

    COMPUTED PROPERTIES:

    - is_orphan: bool (no criteria reference this artifact)
    - referencing_criteria: List[str] (criterion IDs that reference this)
    - is_documentation: bool (documents_artifact_id is set)

    METHODS:

    - check_staleness(artifact_registry) -> bool:
        Check if this documentation artifact is stale by comparing
        documented artifact's current hash to stored hash.

    - mark_updated(artifact_registry) -> None:
        Mark documentation as updated (capture source hash, clear stale flag).

    - compute_content_hash() -> str:
        Compute SHA256 hash of all files in paths[].

    - verify_exists() -> bool:
        Check if all files in paths[] exist on filesystem.

    PRIVATE FIELDS (for staleness tracking):
    - _documented_source_hash: Optional[str] (hash of source when doc was updated)

    FILE LOCATION:
    vibey/roadmap/models/ticket/artifact.py

    SUCCESS CRITERIA:
    - Artifact entity with all fields implemented
    - Staleness detection works correctly
    - Content hash computation works
    - File existence verification works
    - JSON/YAML serialization works
    - Full test coverage
