    notes: |
      CRITICAL TASK - Core of the artifact system.

      Key insight: Artifact is Layer 0a, existing independently of tickets.
      This enables tracking pre-existing files, generated docs, and
      framework components that don't belong to any specific ticket.

      Staleness detection is critical for maintaining documentation
      accuracy. When source code changes, documentation becomes stale
      until updated.
