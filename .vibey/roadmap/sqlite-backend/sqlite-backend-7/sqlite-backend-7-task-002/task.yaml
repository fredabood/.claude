  title: Update yaml_dumper.py for hierarchy serialization
  description: |
    Refactor yaml_dumper.py to serialize the new unified ticket models
    with hierarchy attributes and _local field naming.

    CURRENT STATE:
    - yaml_dumper.py handles Roadmap, Track, Sprint, Task
    - Outputs old field names (commits, deliverables, standards)
    - No hierarchy attribute serialization

    CHANGES REQUIRED:

    1. OUTPUT FORMAT (always v2):
       - Use _local suffix for local content fields
       - Include hierarchy attributes in output
       - Exclude computed/aggregated fields (they're recomputed on load)

    2. FIELD SERIALIZATION:
       # Fields to serialize (stored)
       commits_local → commits_local
       deliverables_local → deliverables_local
       standards_local → standards_local
       quality_gates_local → quality_gates_local
       assigned_agents_local → assigned_agents_local
       depends_on → depends_on (DependencyRef format)

       # Fields to EXCLUDE (computed)
       commits (smart accessor) → DO NOT serialize
       standards (smart accessor) → DO NOT serialize
       is_parent, is_child, etc. → DO NOT serialize (computed on load)
       commits_aggregated → DO NOT serialize
       standards_effective → DO NOT serialize

    3. DUMPER FUNCTIONS:
       def dump_task(task: TaskTicket) -> dict:
           return {
               'task': {
                   'id': task.id,
                   'name': task.name,
                   'commits_local': [dump_commit(c) for c in task.commits_local],
                   'deliverables_local': [dump_deliverable(d) for d in task.deliverables_local],
                   # ... other stored fields
                   # NOTE: Do NOT include task.commits (smart accessor)
               }
           }

    4. HIERARCHY REFERENCE HANDLING:
       - Serialize parent_id (stored reference)
       - Do NOT serialize children (derived from parent_id)
       - Do NOT serialize hierarchy attributes (computed)

    5. DETERMINISTIC OUTPUT:
       - Sort keys consistently
       - Sort list items where order doesn't matter
       - Ensure identical input produces identical output

    IMPLEMENTATION STEPS:

    1. Update dump_task() for TaskTicket
    2. Update dump_sprint() for SprintTicket
    3. Update dump_track() for TrackTicket
    4. Update dump_roadmap() for RoadmapTicket
    5. Update dump_commit() for unified GitCommit
    6. Add dump_dependency_ref() for DependencyRef
    7. Ensure deterministic output ordering
    8. Add format version marker to output

    SUCCESS CRITERIA:
    - Output uses v2 format (with _local suffixes)
    - Computed fields not serialized
    - Round-trip: load → dump → load produces identical objects
    - Deterministic output (same input = same output)
    - All existing tests pass with format adaptation
