  task_type: development
  title: Implement Artifact Entity (Layer 0a)
  description: "Create the Artifact entity as a first-class entity independent of\
    \ tickets.\nThis is the core of the artifact system.\n\nDESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md\
    \ Part 13.3\n\nARTIFACT ENTITY FIELDS:\n\nIdentity:\n- id: str (ULID)\n- name:\
    \ str\n- description: Optional[str]\n\nFile Location:\n- paths: List[str] (one\
    \ artifact may span multiple files)\n- content_hash: Optional[str] (SHA256 of\
    \ concatenated file contents)\n- last_verified: Optional[datetime] (when files\
    \ were last checked)\n\nClassification:\n- artifact_type: ArtifactType\n- artifact_subtype:\
    \ Optional[str] (more specific classification)\n\nProvenance:\n- provenance: ArtifactProvenance\
    \ (how artifact came to exist)\n\nRelationships:\n- documents_artifact_id: Optional[str]\
    \ (what does this artifact document?)\n- depends_on_artifact_ids: List[str] (artifact\
    \ dependencies)\n\nState:\n- exists: bool (False if files were deleted)\n- is_stale:\
    \ bool (for docs: source artifact changed since last update)\n\nTimestamps:\n\
    - created_at: datetime\n- updated_at: datetime\n\nCOMPUTED PROPERTIES:\n\n- is_orphan:\
    \ bool (no criteria reference this artifact)\n- referencing_criteria: List[str]\
    \ (criterion IDs that reference this)\n- is_documentation: bool (documents_artifact_id\
    \ is set)\n\nMETHODS:\n\n- check_staleness(artifact_registry) -> bool:\n    Check\
    \ if this documentation artifact is stale by comparing\n    documented artifact's\
    \ current hash to stored hash.\n\n- mark_updated(artifact_registry) -> None:\n\
    \    Mark documentation as updated (capture source hash, clear stale flag).\n\n\
    - compute_content_hash() -> str:\n    Compute SHA256 hash of all files in paths[].\n\
    \n- verify_exists() -> bool:\n    Check if all files in paths[] exist on filesystem.\n\
    \nPRIVATE FIELDS (for staleness tracking):\n- _documented_source_hash: Optional[str]\
    \ (hash of source when doc was updated)\n\nFILE LOCATION:\nvibey/roadmap/models/ticket/artifact.py\n\
    \nSUCCESS CRITERIA:\n- Artifact entity with all fields implemented\n- Staleness\
    \ detection works correctly\n- Content hash computation works\n- File existence\
    \ verification works\n- JSON/YAML serialization works\n- Full test coverage\n"
