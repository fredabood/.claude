  title: Implement ArtifactProvenance
  description: |
    Create the ArtifactProvenance class that tracks how an artifact came to exist.
    Different provenance types have different metadata.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.4

    ARTIFACTPROVENANCE FIELDS:

    Core:
    - provenance_type: ProvenanceType (TICKET_CREATED, PRE_EXISTING, etc.)

    For TICKET_CREATED:
    - created_by_ticket_id: Optional[str]
    - created_by_criterion_id: Optional[str]

    For PRE_EXISTING:
    - discovered_at: Optional[datetime]
    - discovered_by: Optional[str] (user, scan process, "filesystem_scan")

    For GENERATED:
    - generator_type: Optional[str] ("sphinx", "pdoc", "typedoc", "mkdocs")
    - generator_config: Optional[Dict[str, Any]]
    - source_artifact_ids: Optional[List[str]] (artifacts used to generate this)

    For EXTERNAL:
    - external_source: Optional[str] (URL, package name, etc.)
    - external_version: Optional[str]

    For FRAMEWORK:
    - framework_component_type: Optional[str] ("agent", "workflow", "template")

    FACTORY METHODS:

    @classmethod
    def ticket_created(cls, ticket_id: str, criterion_id: Optional[str] = None):
        Create provenance for ticket-created artifact.

    @classmethod
    def pre_existing(cls, discovered_by: str = "filesystem_scan"):
        Create provenance for pre-existing artifact.

    @classmethod
    def generated(cls, generator_type: str, source_artifact_ids: List[str]):
        Create provenance for generated artifact.

    @classmethod
    def external(cls, source: str, version: Optional[str] = None):
        Create provenance for external artifact.

    @classmethod
    def framework(cls, component_type: str):
        Create provenance for framework component.

    FILE LOCATION:
    vibey/roadmap/models/ticket/artifact_provenance.py

    SUCCESS CRITERIA:
    - ArtifactProvenance with all fields implemented
    - Factory methods for each provenance type work correctly
    - Validation ensures type-specific fields match provenance_type
    - JSON/YAML serialization works
    - Full test coverage
