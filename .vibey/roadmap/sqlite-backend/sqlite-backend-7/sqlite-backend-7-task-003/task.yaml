  title: Implement ArtifactProvenance
  description: "Create the ArtifactProvenance class that tracks how an artifact came\
    \ to exist.\nDifferent provenance types have different metadata.\n\nDESIGN REFERENCE:\
    \ UNIFIED_TICKET_ARCHITECTURE.md Part 13.4\n\nARTIFACTPROVENANCE FIELDS:\n\nCore:\n\
    - provenance_type: ProvenanceType (TICKET_CREATED, PRE_EXISTING, etc.)\n\nFor\
    \ TICKET_CREATED:\n- created_by_ticket_id: Optional[str]\n- created_by_criterion_id:\
    \ Optional[str]\n\nFor PRE_EXISTING:\n- discovered_at: Optional[datetime]\n- discovered_by:\
    \ Optional[str] (user, scan process, \"filesystem_scan\")\n\nFor GENERATED:\n\
    - generator_type: Optional[str] (\"sphinx\", \"pdoc\", \"typedoc\", \"mkdocs\"\
    )\n- generator_config: Optional[Dict[str, Any]]\n- source_artifact_ids: Optional[List[str]]\
    \ (artifacts used to generate this)\n\nFor EXTERNAL:\n- external_source: Optional[str]\
    \ (URL, package name, etc.)\n- external_version: Optional[str]\n\nFor FRAMEWORK:\n\
    - framework_component_type: Optional[str] (\"agent\", \"workflow\", \"template\"\
    )\n\nFACTORY METHODS:\n\n@classmethod\ndef ticket_created(cls, ticket_id: str,\
    \ criterion_id: Optional[str] = None):\n    Create provenance for ticket-created\
    \ artifact.\n\n@classmethod\ndef pre_existing(cls, discovered_by: str = \"filesystem_scan\"\
    ):\n    Create provenance for pre-existing artifact.\n\n@classmethod\ndef generated(cls,\
    \ generator_type: str, source_artifact_ids: List[str]):\n    Create provenance\
    \ for generated artifact.\n\n@classmethod\ndef external(cls, source: str, version:\
    \ Optional[str] = None):\n    Create provenance for external artifact.\n\n@classmethod\n\
    def framework(cls, component_type: str):\n    Create provenance for framework\
    \ component.\n\nFILE LOCATION:\nvibey/roadmap/models/ticket/artifact_provenance.py\n\
    \nSUCCESS CRITERIA:\n- ArtifactProvenance with all fields implemented\n- Factory\
    \ methods for each provenance type work correctly\n- Validation ensures type-specific\
    \ fields match provenance_type\n- JSON/YAML serialization works\n- Full test coverage\n"
