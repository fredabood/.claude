    notes: |
      CRITICAL: Must not lose any existing data.

      Consider whether to use single-table inheritance (one tickets
      table) or keep separate tables (roadmaps, tracks, sprints, tasks)
      with shared columns.

      Single-table pros:
      - Simpler ORM mapping
      - Easier hierarchy queries
      - One place for common columns

      Single-table cons:
      - Many nullable columns
      - Larger table size
      - Type-specific constraints harder

      RECOMMENDATION: Use single-table inheritance as specified
      in Sprint 6a Task 007 (ORM design).
