  title: Implement ArtifactTarget CriterionTarget
  description: |
    Create the ArtifactTarget criterion target type that references first-class
    Artifact entities. This replaces/extends FileExistsTarget for artifact-based
    criteria.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.6

    ARTIFACTTARGET FIELDS:

    Core:
    - artifact_id: str (references Artifact.id)
    - verification: ArtifactVerification = EXISTS

    Cached State (denormalized from Artifact for performance):
    - artifact_exists: bool = False
    - artifact_hash: Optional[str] = None
    - artifact_is_stale: bool = False
    - last_checked: Optional[datetime] = None

    PROPERTIES:

    - is_automatic: bool = True (can refresh from artifact registry)

    METHODS:

    - is_satisfied() -> bool:
        Based on verification mode:
        - EXISTS: return artifact_exists
        - NOT_STALE: return artifact_exists and not artifact_is_stale
        - HASH_UNCHANGED: return artifact_exists and hash matches stored hash

    - refresh(context: RefreshContext) -> None:
        Get artifact from registry, update cached state:
        - artifact_exists = artifact.exists
        - artifact_hash = artifact.content_hash
        - artifact_is_stale = artifact.is_stale
        - last_checked = now()

    VERIFICATION MODES:

    1. EXISTS (default):
       - Files in artifact.paths[] exist
       - Used for: code deliverables, any file-based criterion

    2. NOT_STALE:
       - Files exist AND documentation is not stale
       - Used for: documentation that must track source changes
       - Example: API docs must be current with API code

    3. HASH_UNCHANGED:
       - Content hasn't changed since criterion was created
       - Used for: ensuring no unexpected modifications
       - Captures artifact_hash at criterion creation time

    UPDATE CriterionTargetType ENUM:

    Add to existing enum in enums.py:
    - ARTIFACT = "artifact"

    FILE LOCATION:
    vibey/roadmap/models/ticket/targets.py (add to existing file)

    SUCCESS CRITERIA:
    - ArtifactTarget extends CriterionTarget
    - All three verification modes work correctly
    - refresh() updates cached state from artifact registry
    - is_automatic returns True
    - CriterionTargetType enum updated with ARTIFACT
    - JSON/YAML serialization works
    - Full test coverage
