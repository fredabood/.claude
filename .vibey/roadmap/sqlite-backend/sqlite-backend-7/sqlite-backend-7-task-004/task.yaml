  title: Implement ArtifactTarget CriterionTarget
  description: "Create the ArtifactTarget criterion target type that references first-class\n\
    Artifact entities. This replaces/extends FileExistsTarget for artifact-based\n\
    criteria.\n\nDESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.6\n\nARTIFACTTARGET\
    \ FIELDS:\n\nCore:\n- artifact_id: str (references Artifact.id)\n- verification:\
    \ ArtifactVerification = EXISTS\n\nCached State (denormalized from Artifact for\
    \ performance):\n- artifact_exists: bool = False\n- artifact_hash: Optional[str]\
    \ = None\n- artifact_is_stale: bool = False\n- last_checked: Optional[datetime]\
    \ = None\n\nPROPERTIES:\n\n- is_automatic: bool = True (can refresh from artifact\
    \ registry)\n\nMETHODS:\n\n- is_satisfied() -> bool:\n    Based on verification\
    \ mode:\n    - EXISTS: return artifact_exists\n    - NOT_STALE: return artifact_exists\
    \ and not artifact_is_stale\n    - HASH_UNCHANGED: return artifact_exists and\
    \ hash matches stored hash\n\n- refresh(context: RefreshContext) -> None:\n  \
    \  Get artifact from registry, update cached state:\n    - artifact_exists = artifact.exists\n\
    \    - artifact_hash = artifact.content_hash\n    - artifact_is_stale = artifact.is_stale\n\
    \    - last_checked = now()\n\nVERIFICATION MODES:\n\n1. EXISTS (default):\n \
    \  - Files in artifact.paths[] exist\n   - Used for: code deliverables, any file-based\
    \ criterion\n\n2. NOT_STALE:\n   - Files exist AND documentation is not stale\n\
    \   - Used for: documentation that must track source changes\n   - Example: API\
    \ docs must be current with API code\n\n3. HASH_UNCHANGED:\n   - Content hasn't\
    \ changed since criterion was created\n   - Used for: ensuring no unexpected modifications\n\
    \   - Captures artifact_hash at criterion creation time\n\nUPDATE CriterionTargetType\
    \ ENUM:\n\nAdd to existing enum in enums.py:\n- ARTIFACT = \"artifact\"\n\nFILE\
    \ LOCATION:\nvibey/roadmap/models/ticket/targets.py (add to existing file)\n\n\
    SUCCESS CRITERIA:\n- ArtifactTarget extends CriterionTarget\n- All three verification\
    \ modes work correctly\n- refresh() updates cached state from artifact registry\n\
    - is_automatic returns True\n- CriterionTargetType enum updated with ARTIFACT\n\
    - JSON/YAML serialization works\n- Full test coverage\n"
