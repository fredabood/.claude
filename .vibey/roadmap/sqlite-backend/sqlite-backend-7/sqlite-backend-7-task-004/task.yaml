    notes: |
      ArtifactTarget is the bridge between the artifact system and
      the criterion system.

      Key insight: ArtifactTarget references artifacts by ID rather
      than embedding file paths. This enables:
      - Artifact reuse across multiple criteria
      - Staleness tracking via artifact's is_stale flag
      - Impact analysis via artifact relationships

      FileExistsTarget is retained for cases where you want to check
      file existence without creating an Artifact entity (simple
      one-off checks).
