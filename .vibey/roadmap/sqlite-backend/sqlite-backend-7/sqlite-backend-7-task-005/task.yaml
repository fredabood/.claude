  title: Add Artifacts Table to Database Schema
  description: "Add the artifacts table and related views to the SQLite database schema.\n\
    This enables persistence and querying of the artifact graph.\n\nDESIGN REFERENCE:\
    \ UNIFIED_TICKET_ARCHITECTURE.md Part 13.9\n\nARTIFACTS TABLE:\n\nCREATE TABLE\
    \ artifacts (\n    -- Identity\n    id TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n\
    \    description TEXT,\n\n    -- File Location\n    paths TEXT NOT NULL,  -- JSON\
    \ array of file paths\n    content_hash TEXT,\n    last_verified TEXT,  -- ISO\
    \ timestamp\n\n    -- Classification\n    artifact_type TEXT NOT NULL,\n    artifact_subtype\
    \ TEXT,\n\n    -- Provenance (JSON object)\n    provenance TEXT NOT NULL,\n\n\
    \    -- Relationships\n    documents_artifact_id TEXT,\n    depends_on_artifact_ids\
    \ TEXT,  -- JSON array\n\n    -- State\n    exists INTEGER NOT NULL DEFAULT 1,\n\
    \    is_stale INTEGER NOT NULL DEFAULT 0,\n\n    -- Staleness tracking (for documentation)\n\
    \    documented_source_hash TEXT,\n\n    -- Timestamps\n    created_at TEXT NOT\
    \ NULL,\n    updated_at TEXT NOT NULL,\n\n    -- Foreign keys\n    FOREIGN KEY\
    \ (documents_artifact_id) REFERENCES artifacts(id)\n);\n\nINDEXES:\n\nCREATE INDEX\
    \ idx_artifacts_type ON artifacts(artifact_type);\nCREATE INDEX idx_artifacts_documents\
    \ ON artifacts(documents_artifact_id);\nCREATE INDEX idx_artifacts_stale ON artifacts(is_stale)\
    \ WHERE is_stale = 1;\n\nVIEWS:\n\n1. v_orphan_artifacts - Artifacts not referenced\
    \ by any criterion:\n\nCREATE VIEW v_orphan_artifacts AS\nSELECT a.*\nFROM artifacts\
    \ a\nLEFT JOIN criteria c ON json_extract(c.target_data, '$.artifact_id') = a.id\n\
    WHERE c.id IS NULL AND a.exists = 1;\n\n2. v_documentation_graph - Links between\
    \ docs and their sources:\n\nCREATE VIEW v_documentation_graph AS\nSELECT\n  \
    \  doc.id AS doc_id,\n    doc.name AS doc_name,\n    doc.artifact_type AS doc_type,\n\
    \    doc.is_stale,\n    src.id AS source_id,\n    src.name AS source_name,\n \
    \   src.artifact_type AS source_type,\n    src.content_hash AS source_hash,\n\
    \    doc.documented_source_hash AS documented_hash,\n    CASE\n        WHEN src.content_hash\
    \ != doc.documented_source_hash THEN 1\n        ELSE 0\n    END AS needs_update\n\
    FROM artifacts doc\nJOIN artifacts src ON doc.documents_artifact_id = src.id\n\
    WHERE doc.documents_artifact_id IS NOT NULL;\n\n3. v_stale_documentation - Documentation\
    \ that needs updating:\n\nCREATE VIEW v_stale_documentation AS\nSELECT * FROM\
    \ v_documentation_graph WHERE needs_update = 1 OR is_stale = 1;\n\n4. v_artifact_criteria\
    \ - Which criteria reference each artifact:\n\nCREATE VIEW v_artifact_criteria\
    \ AS\nSELECT\n    a.id AS artifact_id,\n    a.name AS artifact_name,\n    c.id\
    \ AS criterion_id,\n    c.description AS criterion_description,\n    c.ticket_id,\n\
    \    c.blocks_transition_to\nFROM artifacts a\nJOIN criteria c ON json_extract(c.target_data,\
    \ '$.artifact_id') = a.id\nWHERE c.target_type = 'artifact';\n\nUPDATE CRITERIA\
    \ TABLE:\n\nEnsure criteria table can store ArtifactTarget:\n- target_type includes\
    \ 'artifact'\n- target_data JSON includes artifact_id field\n\nFILE CHANGES:\n\
    - vibey/roadmap/database/schema.py (add artifacts table, views, indexes)\n- vibey/roadmap/database/migrations/add_artifacts.py\
    \ (migration script)\n- tests/roadmap/database/test_artifacts_schema.py\n\nSUCCESS\
    \ CRITERIA:\n- artifacts table created with all columns\n- All 4 views work correctly\n\
    - Indexes created for common queries\n- criteria table supports artifact target_type\n\
    - Foreign key constraint on documents_artifact_id\n- Migration script works on\
    \ existing databases\n- Full test coverage\n"
