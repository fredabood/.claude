  title: Add Artifacts Table to Database Schema
  description: |
    Add the artifacts table and related views to the SQLite database schema.
    This enables persistence and querying of the artifact graph.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.9

    ARTIFACTS TABLE:

    CREATE TABLE artifacts (
        -- Identity
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT,

        -- File Location
        paths TEXT NOT NULL,  -- JSON array of file paths
        content_hash TEXT,
        last_verified TEXT,  -- ISO timestamp

        -- Classification
        artifact_type TEXT NOT NULL,
        artifact_subtype TEXT,

        -- Provenance (JSON object)
        provenance TEXT NOT NULL,

        -- Relationships
        documents_artifact_id TEXT,
        depends_on_artifact_ids TEXT,  -- JSON array

        -- State
        exists INTEGER NOT NULL DEFAULT 1,
        is_stale INTEGER NOT NULL DEFAULT 0,

        -- Staleness tracking (for documentation)
        documented_source_hash TEXT,

        -- Timestamps
        created_at TEXT NOT NULL,
        updated_at TEXT NOT NULL,

        -- Foreign keys
        FOREIGN KEY (documents_artifact_id) REFERENCES artifacts(id)
    );

    INDEXES:

    CREATE INDEX idx_artifacts_type ON artifacts(artifact_type);
    CREATE INDEX idx_artifacts_documents ON artifacts(documents_artifact_id);
    CREATE INDEX idx_artifacts_stale ON artifacts(is_stale) WHERE is_stale = 1;

    VIEWS:

    1. v_orphan_artifacts - Artifacts not referenced by any criterion:

    CREATE VIEW v_orphan_artifacts AS
    SELECT a.*
    FROM artifacts a
    LEFT JOIN criteria c ON json_extract(c.target_data, '$.artifact_id') = a.id
    WHERE c.id IS NULL AND a.exists = 1;

    2. v_documentation_graph - Links between docs and their sources:

    CREATE VIEW v_documentation_graph AS
    SELECT
        doc.id AS doc_id,
        doc.name AS doc_name,
        doc.artifact_type AS doc_type,
        doc.is_stale,
        src.id AS source_id,
        src.name AS source_name,
        src.artifact_type AS source_type,
        src.content_hash AS source_hash,
        doc.documented_source_hash AS documented_hash,
        CASE
            WHEN src.content_hash != doc.documented_source_hash THEN 1
            ELSE 0
        END AS needs_update
    FROM artifacts doc
    JOIN artifacts src ON doc.documents_artifact_id = src.id
    WHERE doc.documents_artifact_id IS NOT NULL;

    3. v_stale_documentation - Documentation that needs updating:

    CREATE VIEW v_stale_documentation AS
    SELECT * FROM v_documentation_graph WHERE needs_update = 1 OR is_stale = 1;

    4. v_artifact_criteria - Which criteria reference each artifact:

    CREATE VIEW v_artifact_criteria AS
    SELECT
        a.id AS artifact_id,
        a.name AS artifact_name,
        c.id AS criterion_id,
        c.description AS criterion_description,
        c.ticket_id,
        c.blocks_transition_to
    FROM artifacts a
    JOIN criteria c ON json_extract(c.target_data, '$.artifact_id') = a.id
    WHERE c.target_type = 'artifact';

    UPDATE CRITERIA TABLE:

    Ensure criteria table can store ArtifactTarget:
    - target_type includes 'artifact'
    - target_data JSON includes artifact_id field

    FILE CHANGES:
    - vibey/roadmap/database/schema.py (add artifacts table, views, indexes)
    - vibey/roadmap/database/migrations/add_artifacts.py (migration script)
    - tests/roadmap/database/test_artifacts_schema.py

    SUCCESS CRITERIA:
    - artifacts table created with all columns
    - All 4 views work correctly
    - Indexes created for common queries
    - criteria table supports artifact target_type
    - Foreign key constraint on documents_artifact_id
    - Migration script works on existing databases
    - Full test coverage
