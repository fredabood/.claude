  title: Implement ImpactAnalyzer for Documentation Staleness
  description: |
    Create the ImpactAnalyzer class that detects when code changes affect
    documentation and identifies cascading updates needed.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13.10

    IMPACTANALYZER CLASS:

    class ImpactAnalyzer:
        """Analyzes impact of file changes on artifacts and documentation."""

        def __init__(self, artifact_registry: ArtifactRegistry, db: Database):
            self._registry = artifact_registry
            self._db = db

        def analyze_file_changes(self, changed_files: List[str]) -> ImpactReport:
            """
            Analyze impact of file changes.

            Args:
                changed_files: List of file paths that changed

            Returns:
                ImpactReport with affected artifacts and required updates
            """
            # 1. Find artifacts containing changed files
            directly_impacted = self._find_artifacts_by_files(changed_files)

            # 2. Find documentation that documents impacted artifacts
            stale_documentation = []
            for artifact in directly_impacted:
                docs = self._find_documenting_artifacts(artifact.id)
                stale_documentation.extend(docs)

            # 3. Find tickets with criteria referencing stale documentation
            affected_tickets = self._find_affected_tickets(stale_documentation)

            return ImpactReport(
                changed_files=changed_files,
                directly_impacted_artifacts=directly_impacted,
                stale_documentation=stale_documentation,
                affected_tickets=affected_tickets,
                recommended_actions=self._generate_recommendations(...)
            )

        def mark_documentation_stale(self, artifact_ids: List[str]) -> int:
            """Mark documentation artifacts as stale. Returns count updated."""

        def refresh_artifact_hashes(self, artifact_ids: List[str]) -> int:
            """Recompute content hashes for artifacts. Returns count updated."""

        def _find_artifacts_by_files(self, files: List[str]) -> List[Artifact]:
            """Find artifacts whose paths contain any of the given files."""

        def _find_documenting_artifacts(self, artifact_id: str) -> List[Artifact]:
            """Find artifacts that document the given artifact."""

        def _find_affected_tickets(self, artifacts: List[Artifact]) -> List[str]:
            """Find tickets with criteria referencing these artifacts."""

    IMPACTREPORT CLASS:

    class ImpactReport(BaseModel):
        """Report of impact from file changes."""

        # Input
        changed_files: List[str]
        analyzed_at: datetime

        # Direct impacts
        directly_impacted_artifacts: List[ArtifactSummary]

        # Documentation impacts
        stale_documentation: List[ArtifactSummary]

        # Ticket impacts
        affected_tickets: List[TicketImpact]

        # Recommendations
        recommended_actions: List[RecommendedAction]

        # Summary statistics
        @property
        def total_artifacts_affected(self) -> int
        @property
        def total_tickets_affected(self) -> int
        @property
        def has_blocking_impacts(self) -> bool

    SUPPORTING CLASSES:

    class ArtifactSummary(BaseModel):
        id: str
        name: str
        artifact_type: ArtifactType
        paths: List[str]

    class TicketImpact(BaseModel):
        ticket_id: str
        ticket_name: str
        impact_type: str  # "stale_doc_blocks_completion", "stale_doc_warning"
        criterion_id: str
        artifact_id: str

    class RecommendedAction(BaseModel):
        action_type: str  # "update_documentation", "refresh_hash", "review"
        target_artifact_id: str
        description: str
        priority: str  # "high", "medium", "low"

    GIT HOOK INTEGRATION:

    The ImpactAnalyzer should be usable from git hooks:

    # In pre-commit hook:
    changed_files = get_staged_files()
    analyzer = ImpactAnalyzer(registry, db)
    report = analyzer.analyze_file_changes(changed_files)

    if report.has_blocking_impacts:
        print("WARNING: Documentation may be stale")
        for action in report.recommended_actions:
            print(f"  - {action.description}")

    FILE LOCATION:
    vibey/roadmap/operations/impact_analyzer.py

    SUCCESS CRITERIA:
    - ImpactAnalyzer finds affected artifacts from file changes
    - Documentation staleness cascade detected correctly
    - Affected tickets identified
    - ImpactReport provides actionable recommendations
    - mark_documentation_stale() works correctly
    - Integration with git hooks possible
    - Full test coverage
