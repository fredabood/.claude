    notes: |
      ImpactAnalyzer is the key component for maintaining documentation
      accuracy as code evolves.

      Use case: Developer changes src/api/users.py. ImpactAnalyzer:
      1. Finds artifact for users.py
      2. Finds API documentation that documents users.py
      3. Marks documentation as stale
      4. Finds tickets blocked by stale documentation
      5. Recommends updating documentation

      This enables proactive documentation maintenance rather than
      discovering stale docs during ticket completion.
