    \   - Test RoadmapTicket.all_project_documentation\n   - Test SprintTicket.sprint_context_artifacts\n\
    \nINTEGRATION TESTS:\n\n8. tests/roadmap/integration/test_artifact_workflow.py\n\
    \   - End-to-end: Create artifact, reference in criterion, complete ticket\n \
    \  - End-to-end: Modify source, detect stale docs, block completion\n   - End-to-end:\
    \ Update docs, clear stale flag, complete ticket\n\nTEST FIXTURES:\n\nCreate fixtures\
    \ for:\n- Sample artifacts of each type\n- Sample provenance objects\n- Sample\
    \ ArtifactTarget criteria\n- Sample file trees for existence testing\n- Sample\
    \ ticket hierarchies with artifact criteria\n\nCOVERAGE REQUIREMENTS:\n- Minimum\
    \ 90% line coverage for all artifact modules\n- All edge cases covered (empty\
    \ lists, missing files, etc.)\n- Error paths tested\n\nFILE LOCATION:\ntests/roadmap/\
