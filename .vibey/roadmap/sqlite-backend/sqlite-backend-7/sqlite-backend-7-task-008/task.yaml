  title: Comprehensive Test Suite for Artifact System
  description: |
    Create comprehensive test coverage for all artifact system components.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 13

    TEST MODULES:

    1. tests/roadmap/models/ticket/test_artifact_enums.py
       - Test all enum values exist
       - Test ArtifactType properties (is_documentation_type, etc.)
       - Test enum serialization/deserialization

    2. tests/roadmap/models/ticket/test_artifact.py
       - Test Artifact creation with all fields
       - Test content_hash computation
       - Test verify_exists() with real files
       - Test staleness detection
       - Test mark_updated() updates hash
       - Test is_orphan computed correctly
       - Test JSON/YAML serialization round-trip

    3. tests/roadmap/models/ticket/test_artifact_provenance.py
       - Test factory methods for each provenance type
       - Test validation (type-specific fields match type)
       - Test serialization

    4. tests/roadmap/models/ticket/test_artifact_target.py
       - Test is_satisfied() for each verification mode
       - Test refresh() updates cached state
       - Test is_automatic returns True
       - Test serialization with CriterionTargetType.ARTIFACT

    5. tests/roadmap/database/test_artifacts_schema.py
       - Test table creation
       - Test all indexes exist
       - Test all views return expected results
       - Test foreign key constraint
       - Test JSON fields serialize/deserialize correctly

    6. tests/roadmap/operations/test_impact_analyzer.py
       - Test analyze_file_changes finds correct artifacts
       - Test documentation staleness cascade
       - Test affected tickets identified
       - Test mark_documentation_stale works
       - Test ImpactReport generation

    7. tests/roadmap/models/ticket/test_artifact_integration.py
       - Test Ticket.artifact_criteria
       - Test Ticket.complete() with stale documentation
       - Test HierarchicalTicket.all_referenced_artifacts aggregation
       - Test HierarchicalTicket.stale_documentation_artifacts aggregation
       - Test HierarchicalTicket.documentation_health
       - Test RoadmapTicket.all_project_documentation
       - Test SprintTicket.sprint_context_artifacts

    INTEGRATION TESTS:

    8. tests/roadmap/integration/test_artifact_workflow.py
       - End-to-end: Create artifact, reference in criterion, complete ticket
       - End-to-end: Modify source, detect stale docs, block completion
       - End-to-end: Update docs, clear stale flag, complete ticket

    TEST FIXTURES:

    Create fixtures for:
    - Sample artifacts of each type
    - Sample provenance objects
    - Sample ArtifactTarget criteria
    - Sample file trees for existence testing
    - Sample ticket hierarchies with artifact criteria

    COVERAGE REQUIREMENTS:
    - Minimum 90% line coverage for all artifact modules
    - All edge cases covered (empty lists, missing files, etc.)
    - Error paths tested

    FILE LOCATION:
    tests/roadmap/ (various subdirectories as listed above)

    SUCCESS CRITERIA:
    - All test modules created
    - All tests pass
    - 90%+ code coverage on artifact modules
    - Integration tests verify end-to-end workflows
    - CI runs all tests successfully
