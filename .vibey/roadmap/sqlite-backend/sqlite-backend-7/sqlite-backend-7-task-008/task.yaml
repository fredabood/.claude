    \ cached state\n   - Test is_automatic returns True\n   - Test serialization with\
    \ CriterionTargetType.ARTIFACT\n\n5. tests/roadmap/database/test_artifacts_schema.py\n\
    \   - Test table creation\n   - Test all indexes exist\n   - Test all views return\
    \ expected results\n   - Test foreign key constraint\n   - Test JSON fields serialize/deserialize\
    \ correctly\n\n6. tests/roadmap/operations/test_impact_analyzer.py\n   - Test\
    \ analyze_file_changes finds correct artifacts\n   - Test documentation staleness\
    \ cascade\n   - Test affected tickets identified\n   - Test mark_documentation_stale\
    \ works\n   - Test ImpactReport generation\n\n7. tests/roadmap/models/ticket/test_artifact_integration.py\n\
    \   - Test Ticket.artifact_criteria\n   - Test Ticket.complete() with stale documentation\n\
    \   - Test HierarchicalTicket.all_referenced_artifacts aggregation\n   - Test\
