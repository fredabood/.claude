    notes: |
      Comprehensive testing is critical for the artifact system since
      it's foundational to documentation accuracy and impact analysis.

      Integration tests are especially important to verify:
      - File changes trigger staleness detection
      - Stale documentation blocks completion (when required)
      - Impact analysis provides actionable recommendations

      Test fixtures should cover realistic scenarios from the Vibey
      roadmap itself (eating our own dog food).
