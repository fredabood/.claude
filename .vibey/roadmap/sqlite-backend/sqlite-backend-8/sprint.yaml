    notes: |
      Sprint 8: Serialization Migration

      GOAL: Update all serialization code to use new unified ticket models
      while maintaining backward compatibility with existing YAML files.

      DEPENDS ON: Sprint 7 (artifact system architecture)

      KEY CHALLENGES:
      1. YAML files use old field names (commits vs commits_local)
      2. Database schema needs new hierarchy columns
      3. Must read old format, write new format
      4. Round-trip integrity must be maintained

      BACKWARD COMPATIBILITY STRATEGY:
      - yaml_loader: Detect format version, load appropriately
      - yaml_dumper: Always write new format
      - Migration command: Convert old files to new format

      TESTING REQUIREMENTS:
      - Load all existing YAML files successfully
      - Round-trip: YAML → Pydantic → YAML produces valid output
      - Round-trip: YAML → Pydantic → SQLite → Pydantic → YAML works
      - No data loss during migration
