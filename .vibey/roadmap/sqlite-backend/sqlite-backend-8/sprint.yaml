    notes: |
      Sprint 8: Serialization Migration

      DESIGN REFERENCE: sqlite-backend-6/context/architecture/06-SERIALIZATION.md

      GOAL: Update all serialization code to use new unified ticket models
      with pluggable semantic layer support while maintaining backward
      compatibility with existing YAML files.

      DEPENDS ON: Sprint 7 (artifact system architecture)

      KEY CHANGES:

      1. YAML FORMAT UPDATE:
         All files get meta header:
         ```yaml
         meta:
           semantic_layer: vibey          # or 'jira:PROJ'
           schema_version: "2.0"

         task:                            # or 'issue' for Jira
           id: 01JD4EXAMPLE
           external_id: null              # or 'PROJ-123' for Jira
           ...
         ```

      2. DATABASE SCHEMA UPDATE:
         New columns in completables table:
         - semantic_layer TEXT DEFAULT 'vibey'
         - external_id TEXT (nullable, for Jira issue keys)
         - external_status TEXT (preserve original status for round-trip)
         - type_fields TEXT (JSON for Layer 3 semantic-specific fields)

      3. DIRECTORY STRUCTURE MIGRATION:
         Old: .vibey/roadmap/<track>/<sprint>/<task>/task.yaml
         New: .vibey/roadmap/tasks/<ulid>.yaml

         Flat structure:
         - tracks/<ulid>.yaml
         - sprints/<ulid>.yaml
         - tasks/<ulid>.yaml
         - artifacts/<ulid>.yaml

      4. TYPE_FIELDS JSON:
         Layer 3 fields stored as JSON for extensibility:
         - Vibey: {"task_type": "implementation", "complexity": "medium"}
         - Jira: {"issue_key": "PROJ-123", "story_points": 5, "labels": [...]}

      BACKWARD COMPATIBILITY STRATEGY:
      - yaml_loader: Detect format version via meta header presence
      - yaml_loader: Auto-migrate old field names (commits → commits_local)
      - yaml_dumper: Always write new format with meta header
      - Migration command: Convert old structure to new flat structure

      SQLALCHEMY CORE INTEGRATION (from Sprint 7):
      sql_loader.py and sql_dumper.py will use SQLAlchemy Core:
      ```python
      from vibey.roadmap.database import engine, completables, criteria

      def load_ticket(conn, ticket_id: str) -> Ticket:
          stmt = select(completables).where(completables.c.id == ticket_id)
          row = conn.execute(stmt).mappings().first()
          return Ticket(**row)

      def save_ticket(conn, ticket: Ticket) -> None:
          stmt = insert(completables).values(**ticket.model_dump())
          conn.execute(stmt)
      ```

      JSON FIELD ACCESS (dialect-agnostic):
      ```python
      from vibey.roadmap.database import json_field

      # Works on SQLite AND PostgreSQL
      stmt = select(completables).where(
          json_field(completables.c.type_fields, "story_points") > 5
      )
      ```

      TESTING REQUIREMENTS:
      - Load all existing YAML files successfully
      - Round-trip: YAML → Pydantic → YAML produces valid output
      - Round-trip: YAML → Pydantic → SQLite → Pydantic → YAML works
      - Round-trip: YAML → Pydantic → PostgreSQL → Pydantic → YAML works
      - No data loss during migration
      - Semantic layer preserved through all transformations
      - Identical results on SQLite and PostgreSQL backends
