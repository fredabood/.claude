  title: Update yaml_loader.py to construct new Pydantic models
  description: |
    Refactor yaml_loader.py to construct the new unified ticket models
    (RoadmapTicket, TrackTicket, SprintTicket, TaskTicket) instead of
    the existing dataclass models.

    CURRENT STATE:
    - yaml_loader.py is 1191 lines
    - Constructs Roadmap, Track, Sprint, Task dataclasses
    - Uses __post_init__ for validation
    - Field names: commits, deliverables, standards (no _local suffix)

    CHANGES REQUIRED:

    1. FORMAT DETECTION:
       def detect_yaml_format(data: dict) -> str:
           """Detect if YAML uses old or new format"""
           # Check for _local suffix fields
           if 'commits_local' in data or 'deliverables_local' in data:
               return 'v2'  # New format
           return 'v1'  # Old format

    2. FIELD MAPPING (v1 → v2):
       Old Field          → New Field
       commits            → commits_local
       deliverables       → deliverables_local
       standards          → standards_local
       quality_gates      → quality_gates_local
       assigned_agents    → assigned_agents_local
       blocked_by         → depends_on (with DependencyRef conversion)

    3. LOADER FUNCTIONS:
       Update all load_* functions to:
       - Accept both v1 and v2 formats
       - Return new Pydantic models
       - Set hierarchy attributes correctly

       def load_task(data: dict, format_version: str) -> TaskTicket:
           if format_version == 'v1':
               data = migrate_task_fields(data)
           return TaskTicket(**data)

    4. HIERARCHY ATTRIBUTE COMPUTATION:
       After loading all entities:
       - Set parent_id references
       - Compute is_parent, is_child, etc.
       - Build children lists

    5. VALIDATION:
       - Use Pydantic validators (automatic)
       - Remove manual __post_init__ style checks
       - Add custom validators for hierarchy constraints

    IMPLEMENTATION STEPS:

    1. Create format detection function
    2. Create field migration functions (v1 → v2)
    3. Update load_task() → returns TaskTicket
    4. Update load_sprint() → returns SprintTicket
    5. Update load_track() → returns TrackTicket
    6. Update load_roadmap() → returns RoadmapTicket
    7. Add hierarchy computation post-load
    8. Update all callers to expect new types

    BACKWARD COMPATIBILITY:
    - Must load ALL existing YAML files without modification
    - Log warning when loading v1 format (suggest migration)
    - No data loss during format conversion

    SUCCESS CRITERIA:
    - All existing YAML files load successfully
    - Returns new Pydantic model types
    - Hierarchy attributes computed correctly
    - Validation errors have clear messages
    - Performance: No regression in load time
