  title: Update query.py with hierarchy-aware queries
  description: |
    Refactor query.py operations to use new unified ticket models
    with hierarchy-aware loading and smart accessor support.

    CURRENT STATE:
    - query.py uses old dataclass models
    - Direct field access (task.commits, sprint.deliverables)
    - No hierarchy awareness in queries

    CHANGES REQUIRED:

    1. UPDATE IMPORTS:
       # OLD
       from vibey.roadmap.models.task import Task
       from vibey.roadmap.models.sprint import Sprint

       # NEW
       from vibey.roadmap.models.ticket import (
           TaskTicket, SprintTicket, TrackTicket, RoadmapTicket
       )

    2. USE SMART ACCESSORS:
       Operations should use smart accessors which automatically
       handle aggregation/inheritance:

       # OLD - direct field access
       def get_sprint_commits(sprint_id):
           sprint = load_sprint(sprint_id)
           commits = []
           for task in sprint.tasks:
               commits.extend(task.commits)
           return commits

       # NEW - smart accessor handles aggregation
       def get_sprint_commits(sprint_id):
           sprint = load_sprint_with_children(sprint_id)
           return sprint.commits  # Smart accessor aggregates

    3. HIERARCHY-AWARE LOADING:
       Use repository methods for hierarchy:

       def get_task_with_context(task_id):
           repo = TicketRepository(session)
           task = repo.get_with_ancestors(task_id)
           # task.standards now includes inherited standards
           return task

    4. QUERY FUNCTIONS TO UPDATE:
       - get_roadmap() → returns RoadmapTicket
       - get_track() → returns TrackTicket
       - get_sprint() → returns SprintTicket
       - get_task() → returns TaskTicket
       - find_tasks_by_status()
       - find_blocked_items()
       - get_progress()
       - get_commits_for_sprint()
       - get_deliverables_for_track()
       - get_standards_for_task()

    5. NEW QUERY FUNCTIONS:
       - get_effective_standards(ticket_id) → inherited chain
       - get_aggregated_commits(ticket_id) → from descendants
       - get_hierarchy_path(ticket_id) → [roadmap, track, sprint, task]

    IMPLEMENTATION STEPS:

    1. Update imports to new model types
    2. Update each query function signature
    3. Replace direct field access with smart accessors
    4. Add hierarchy-aware loading where needed
    5. Add new query functions for inheritance/aggregation
    6. Update all callers of query functions
    7. Add/update tests

    SUCCESS CRITERIA:
    - All query functions return new model types
    - Smart accessors used for aggregated/effective fields
    - Hierarchy loading works correctly
    - All existing functionality preserved
    - Performance acceptable
