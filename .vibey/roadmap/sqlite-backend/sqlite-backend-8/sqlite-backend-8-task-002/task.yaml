  title: Update update.py with smart accessor usage
  description: |
    Refactor update.py operations to use new unified ticket models
    and leverage smart accessors for consistent updates.

    CURRENT STATE:
    - update.py handles status transitions, commit sync, etc.
    - Uses old dataclass models
    - Manual aggregation for progress updates

    CHANGES REQUIRED:

    1. UPDATE IMPORTS:
       from vibey.roadmap.models.ticket import (
           TaskTicket, SprintTicket, TrackTicket, RoadmapTicket,
           TicketStatus, GitCommit
       )

    2. STATUS TRANSITION UPDATES:
       Use Ticket methods for transitions:

       # OLD
       def complete_task(task_id):
           task = load_task(task_id)
           task.status = 'completed'
           task.completed = datetime.now()
           save_task(task)

       # NEW
       def complete_task(task_id):
           task = load_task(task_id)
           if not task.can_complete():
               raise ValidationError(task.get_blocking_reason())
           updated_task = task.complete()  # Returns new instance
           save_task(updated_task)

    3. COMMIT SYNC UPDATES:
       Simplified with smart accessors:

       # OLD - manual aggregation
       def sync_commits_to_sprint(sprint_id):
           sprint = load_sprint(sprint_id)
           all_commits = []
           for task in sprint.tasks:
               all_commits.extend(task.commits)
           sprint.commits = all_commits
           save_sprint(sprint)

       # NEW - smart accessor handles it
       def get_sprint_commits(sprint_id):
           sprint = load_sprint_with_children(sprint_id)
           return sprint.commits  # Already aggregated
       # No sync needed - aggregation is computed on access

    4. PROGRESS UPDATES:
       Progress is computed, not stored:

       # OLD - manual calculation
       def update_sprint_progress(sprint_id):
           sprint = load_sprint(sprint_id)
           completed = sum(1 for t in sprint.tasks if t.status == 'completed')
           sprint.progress.completed = completed
           save_sprint(sprint)

       # NEW - computed automatically
       def get_sprint_progress(sprint_id):
           sprint = load_sprint_with_children(sprint_id)
           return sprint.progress  # Computed from children

    5. FUNCTIONS TO UPDATE:
       - update_task_status()
       - update_sprint_status()
       - update_track_status()
       - complete_task()
       - complete_sprint()
       - add_commit_to_task()
       - sync_progress()
       - cascade_block_status()

    6. NEW PATTERN - IMMUTABLE UPDATES:
       Use model_copy() for immutable state changes:

       def add_commit(task_id, commit: GitCommit):
           task = load_task(task_id)
           updated_task = task.model_copy(update={
               'commits_local': task.commits_local + [commit]
           })
           save_task(updated_task)

    IMPLEMENTATION STEPS:

    1. Update imports to new model types
    2. Replace status updates with transition methods
    3. Remove manual aggregation code (smart accessors handle it)
    4. Remove manual progress calculation (computed)
    5. Use model_copy() for immutable updates
    6. Update all callers
    7. Add/update tests

    SUCCESS CRITERIA:
    - All update functions use new models
    - Transition methods enforce validation
    - No manual aggregation code
    - No manual progress calculation
    - Immutable update pattern used
    - All existing functionality preserved
