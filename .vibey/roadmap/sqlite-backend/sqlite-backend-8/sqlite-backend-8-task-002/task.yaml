    notes: |
      KEY SIMPLIFICATION: Smart accessors eliminate sync code.

      Currently update.py has complex logic to:
      - Sync commits from tasks to sprints to tracks
      - Calculate progress at each level
      - Propagate blocked status

      With smart accessors, most of this becomes unnecessary:
      - commits are aggregated on access
      - progress is computed on access
      - blocked status computed from dependencies

      This significantly reduces code complexity and
      eliminates sync bugs.
