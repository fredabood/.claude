  title: Update sql_loader.py with SQLAlchemy ORM
  description: |
    Replace direct SQL queries in sql_loader.py with SQLAlchemy ORM
    operations using the new TicketORM models from Sprint 6a Task 007.

    CURRENT STATE:
    - sql_loader.py uses raw SQL queries
    - Returns old dataclass models
    - No ORM abstraction

    CHANGES REQUIRED:

    1. USE REPOSITORY PATTERN:
       Replace direct SQL with TicketRepository from Task 6a-007:

       # OLD
       def load_task(db_path: str, task_id: str) -> Task:
           conn = get_connection(db_path)
           cursor = conn.execute("SELECT * FROM tasks WHERE id = ?", (task_id,))
           row = cursor.fetchone()
           return Task(**row_to_dict(row))

       # NEW
       def load_task(db_path: str, task_id: str) -> TaskTicket:
           repo = TicketRepository(get_session(db_path))
           return repo.get(task_id)  # Returns TaskTicket via ORM

    2. HIERARCHY LOADING:
       Use repository methods for hierarchy:

       def load_task_with_ancestors(task_id: str) -> TaskTicket:
           repo = TicketRepository(session)
           task = repo.get_with_ancestors(task_id)
           # task.standards_effective now works (ancestors loaded)
           return task

       def load_sprint_with_children(sprint_id: str) -> SprintTicket:
           repo = TicketRepository(session)
           sprint = repo.get_with_children(sprint_id)
           # sprint.commits_aggregated now works (children loaded)
           return sprint

    3. LAZY LOADING SUPPORT:
       Configure SQLAlchemy for lazy loading of relationships:
       - parent relationship: lazy loaded on access
       - children relationship: lazy loaded on access
       - Option for eager loading when needed

    4. JSON COLUMN DESERIALIZATION:
       ORM handles JSON columns → Python objects:
       - commits_local_json → list[GitCommit]
       - standards_local_json → list[Standard]
       - depends_on_json → list[DependencyRef]

    5. SESSION MANAGEMENT:
       Use existing connection.py infrastructure:

       def get_session(db_path: str) -> Session:
           engine = get_engine(db_path)
           return Session(engine)

    IMPLEMENTATION STEPS:

    1. Add SQLAlchemy session management to connection.py
    2. Update load_task() to use TicketRepository
    3. Update load_sprint() to use TicketRepository
    4. Update load_track() to use TicketRepository
    5. Update load_roadmap() to use TicketRepository
    6. Add hierarchy loading functions
    7. Configure lazy/eager loading options
    8. Update all callers to expect new types

    SUCCESS CRITERIA:
    - All load functions return new Pydantic models
    - Hierarchy relationships load correctly
    - JSON columns deserialize to proper types
    - Lazy loading works for parent/children
    - Performance: No regression vs raw SQL
