  title: Update sql_loader.py with SQLAlchemy ORM
  description: "Replace direct SQL queries in sql_loader.py with SQLAlchemy ORM\n\
    operations using the new TicketORM models from Sprint 6a Task 007.\n\nCURRENT\
    \ STATE:\n- sql_loader.py uses raw SQL queries\n- Returns old dataclass models\n\
    - No ORM abstraction\n\nCHANGES REQUIRED:\n\n1. USE REPOSITORY PATTERN:\n   Replace\
    \ direct SQL with TicketRepository from Task 6a-007:\n\n   # OLD\n   def load_task(db_path:\
    \ str, task_id: str) -> Task:\n       conn = get_connection(db_path)\n       cursor\
    \ = conn.execute(\"SELECT * FROM tasks WHERE id = ?\", (task_id,))\n       row\
    \ = cursor.fetchone()\n       return Task(**row_to_dict(row))\n\n   # NEW\n  \
    \ def load_task(db_path: str, task_id: str) -> TaskTicket:\n       repo = TicketRepository(get_session(db_path))\n\
    \       return repo.get(task_id)  # Returns TaskTicket via ORM\n\n2. HIERARCHY\
    \ LOADING:\n   Use repository methods for hierarchy:\n\n   def load_task_with_ancestors(task_id:\
    \ str) -> TaskTicket:\n       repo = TicketRepository(session)\n       task =\
    \ repo.get_with_ancestors(task_id)\n       # task.standards_effective now works\
    \ (ancestors loaded)\n       return task\n\n   def load_sprint_with_children(sprint_id:\
    \ str) -> SprintTicket:\n       repo = TicketRepository(session)\n       sprint\
    \ = repo.get_with_children(sprint_id)\n       # sprint.commits_aggregated now\
    \ works (children loaded)\n       return sprint\n\n3. LAZY LOADING SUPPORT:\n\
    \   Configure SQLAlchemy for lazy loading of relationships:\n   - parent relationship:\
    \ lazy loaded on access\n   - children relationship: lazy loaded on access\n \
    \  - Option for eager loading when needed\n\n4. JSON COLUMN DESERIALIZATION:\n\
    \   ORM handles JSON columns → Python objects:\n   - commits_local_json → list[GitCommit]\n\
    \   - standards_local_json → list[Standard]\n   - depends_on_json → list[DependencyRef]\n\
    \n5. SESSION MANAGEMENT:\n   Use existing connection.py infrastructure:\n\n  \
    \ def get_session(db_path: str) -> Session:\n       engine = get_engine(db_path)\n\
    \       return Session(engine)\n\nIMPLEMENTATION STEPS:\n\n1. Add SQLAlchemy session\
    \ management to connection.py\n2. Update load_task() to use TicketRepository\n\
    3. Update load_sprint() to use TicketRepository\n4. Update load_track() to use\
    \ TicketRepository\n5. Update load_roadmap() to use TicketRepository\n6. Add hierarchy\
    \ loading functions\n7. Configure lazy/eager loading options\n8. Update all callers\
    \ to expect new types\n\nSUCCESS CRITERIA:\n- All load functions return new Pydantic\
    \ models\n- Hierarchy relationships load correctly\n- JSON columns deserialize\
    \ to proper types\n- Lazy loading works for parent/children\n- Performance: No\
    \ regression vs raw SQL\n"
