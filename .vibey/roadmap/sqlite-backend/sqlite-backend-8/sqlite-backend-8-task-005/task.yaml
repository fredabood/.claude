  title: Update sql_dumper.py with SQLAlchemy ORM
  description: |
    Replace direct SQL inserts/updates in sql_dumper.py with SQLAlchemy
    ORM operations using the new TicketORM models.

    CURRENT STATE:
    - sql_dumper.py uses raw SQL INSERT/UPDATE
    - Accepts old dataclass models
    - Manual JSON serialization

    CHANGES REQUIRED:

    1. USE REPOSITORY PATTERN:
       Replace direct SQL with TicketRepository:

       # OLD
       def save_task(db_path: str, task: Task) -> None:
           conn = get_connection(db_path)
           conn.execute(
               "INSERT OR REPLACE INTO tasks (...) VALUES (...)",
               task_to_row(task)
           )

       # NEW
       def save_task(db_path: str, task: TaskTicket) -> None:
           repo = TicketRepository(get_session(db_path))
           repo.save(task)  # ORM handles serialization

    2. PYDANTIC → ORM CONVERSION:
       Repository handles conversion via TicketORM.from_pydantic():

       class TicketRepository:
           def save(self, ticket: Ticket) -> None:
               orm_obj = TicketORM.from_pydantic(ticket)
               self.session.merge(orm_obj)
               self.session.commit()

    3. JSON COLUMN SERIALIZATION:
       ORM handles Python objects → JSON columns:
       - list[GitCommit] → commits_local_json
       - list[Standard] → standards_local_json
       - list[DependencyRef] → depends_on_json

    4. HIERARCHY PRESERVATION:
       When saving a ticket:
       - Save parent_id reference
       - Do NOT save computed hierarchy attributes
       - Children are saved separately (not cascaded)

    5. TRANSACTION SUPPORT:
       def save_sprint_with_tasks(sprint: SprintTicket) -> None:
           with session.begin():
               repo.save(sprint)
               for task in sprint.get_children():
                   repo.save(task)
           # All or nothing

    IMPLEMENTATION STEPS:

    1. Update save_task() to use TicketRepository
    2. Update save_sprint() to use TicketRepository
    3. Update save_track() to use TicketRepository
    4. Update save_roadmap() to use TicketRepository
    5. Add transaction support for batch saves
    6. Handle upsert logic (insert or update)
    7. Update all callers to pass new types

    SUCCESS CRITERIA:
    - All save functions accept new Pydantic models
    - JSON columns serialize correctly
    - Transactions work for batch operations
    - Round-trip: save → load produces identical objects
    - Performance: Acceptable vs raw SQL
