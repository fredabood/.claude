  title: Update sql_dumper.py with SQLAlchemy ORM
  description: "Replace direct SQL inserts/updates in sql_dumper.py with SQLAlchemy\n\
    ORM operations using the new TicketORM models.\n\nCURRENT STATE:\n- sql_dumper.py\
    \ uses raw SQL INSERT/UPDATE\n- Accepts old dataclass models\n- Manual JSON serialization\n\
    \nCHANGES REQUIRED:\n\n1. USE REPOSITORY PATTERN:\n   Replace direct SQL with\
    \ TicketRepository:\n\n   # OLD\n   def save_task(db_path: str, task: Task) ->\
    \ None:\n       conn = get_connection(db_path)\n       conn.execute(\n       \
    \    \"INSERT OR REPLACE INTO tasks (...) VALUES (...)\",\n           task_to_row(task)\n\
    \       )\n\n   # NEW\n   def save_task(db_path: str, task: TaskTicket) -> None:\n\
    \       repo = TicketRepository(get_session(db_path))\n       repo.save(task)\
    \  # ORM handles serialization\n\n2. PYDANTIC → ORM CONVERSION:\n   Repository\
    \ handles conversion via TicketORM.from_pydantic():\n\n   class TicketRepository:\n\
    \       def save(self, ticket: Ticket) -> None:\n           orm_obj = TicketORM.from_pydantic(ticket)\n\
    \           self.session.merge(orm_obj)\n           self.session.commit()\n\n\
    3. JSON COLUMN SERIALIZATION:\n   ORM handles Python objects → JSON columns:\n\
    \   - list[GitCommit] → commits_local_json\n   - list[Standard] → standards_local_json\n\
    \   - list[DependencyRef] → depends_on_json\n\n4. HIERARCHY PRESERVATION:\n  \
    \ When saving a ticket:\n   - Save parent_id reference\n   - Do NOT save computed\
    \ hierarchy attributes\n   - Children are saved separately (not cascaded)\n\n\
    5. TRANSACTION SUPPORT:\n   def save_sprint_with_tasks(sprint: SprintTicket) ->\
    \ None:\n       with session.begin():\n           repo.save(sprint)\n        \
    \   for task in sprint.get_children():\n               repo.save(task)\n     \
    \  # All or nothing\n\nIMPLEMENTATION STEPS:\n\n1. Update save_task() to use TicketRepository\n\
    2. Update save_sprint() to use TicketRepository\n3. Update save_track() to use\
    \ TicketRepository\n4. Update save_roadmap() to use TicketRepository\n5. Add transaction\
    \ support for batch saves\n6. Handle upsert logic (insert or update)\n7. Update\
    \ all callers to pass new types\n\nSUCCESS CRITERIA:\n- All save functions accept\
    \ new Pydantic models\n- JSON columns serialize correctly\n- Transactions work\
    \ for batch operations\n- Round-trip: save → load produces identical objects\n\
    - Performance: Acceptable vs raw SQL\n"
