    notes: |
      Performance is important because roadmap operations
      run frequently during development sessions.

      KEY INSIGHT: Smart accessors may add overhead.
      The trade-off is:
      - Simpler code (fewer bugs, easier maintenance)
      - Potentially slower (more computation per access)

      Mitigation strategies:
      1. Lazy evaluation (don't compute until needed)
      2. Caching (compute once, reuse)
      3. Eager loading (known patterns)
      4. SQL optimization (push computation to DB)

      Target: Operations should feel instant (< 200ms user-perceived).
