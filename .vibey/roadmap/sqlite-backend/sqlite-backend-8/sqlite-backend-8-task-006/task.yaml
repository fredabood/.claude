  title: Round-trip integrity testing
  description: |
    Comprehensive testing to ensure data integrity through all
    serialization paths: YAML ↔ Pydantic ↔ SQLite

    TEST SCENARIOS:

    1. YAML V1 → PYDANTIC → YAML V2:
       - Load existing v1 YAML files
       - Convert to new Pydantic models
       - Save as v2 YAML
       - Verify no data loss
       - Verify field mapping correct

    2. YAML V2 → PYDANTIC → YAML V2:
       - Load v2 YAML files
       - Convert to Pydantic models
       - Save as v2 YAML
       - Verify byte-for-byte identical (deterministic)

    3. YAML → PYDANTIC → SQLITE → PYDANTIC → YAML:
       - Load YAML into Pydantic
       - Save to SQLite via ORM
       - Load from SQLite into Pydantic
       - Save to YAML
       - Compare with original (accounting for format changes)

    4. SQLITE → PYDANTIC → YAML → PYDANTIC → SQLITE:
       - Load from SQLite
       - Save to YAML
       - Load from YAML
       - Save to SQLite
       - Compare database states

    5. HIERARCHY INTEGRITY:
       - Create roadmap with tracks, sprints, tasks
       - Save and reload
       - Verify parent_id references correct
       - Verify is_parent, is_child computed correctly
       - Verify smart accessors return correct values

    6. AGGREGATION INTEGRITY:
       - Create task with commits_local
       - Verify sprint.commits includes task commits
       - Verify track.commits includes all sprint commits
       - Verify roadmap.commits includes everything

    7. INHERITANCE INTEGRITY:
       - Define standards on roadmap
       - Verify track.standards_effective includes roadmap standards
       - Verify sprint.standards_effective includes track + roadmap
       - Verify task.standards_effective includes full chain

    8. EDGE CASES:
       - Empty collections (no commits, no standards)
       - Unicode in text fields
       - Very long descriptions
       - Maximum nesting depth
       - Circular dependency detection

    TEST DATA:

    Use real roadmap data from .vibey/roadmap/ directory:
    - sqlite-backend track (10 sprints, 67+ tasks)
    - Multiple completed sprints with commits
    - Standards defined at various levels

    IMPLEMENTATION:

    1. Create test fixtures from real data
    2. Implement round-trip test framework
    3. Add comparison utilities (diff models)
    4. Create test for each scenario above
    5. Add performance benchmarks
    6. Generate test coverage report

    SUCCESS CRITERIA:
    - All round-trip tests pass
    - No data loss in any path
    - Hierarchy attributes computed correctly
    - Aggregation returns correct values
    - Inheritance chain works correctly
    - Performance acceptable (< 2x current)
