  title: Performance benchmarks and optimization
  description: |
    Benchmark performance of new operations implementation and
    optimize any hotspots that exceed acceptable thresholds.

    BENCHMARK SCENARIOS:

    1. LOAD PERFORMANCE:
       - Load single task: < 10ms
       - Load task with ancestors: < 50ms
       - Load sprint with children: < 100ms
       - Load full roadmap: < 500ms

    2. AGGREGATION PERFORMANCE:
       - sprint.commits (10 tasks): < 20ms
       - track.commits (5 sprints, 50 tasks): < 100ms
       - roadmap.commits (all): < 500ms

    3. INHERITANCE PERFORMANCE:
       - task.standards (4-level chain): < 10ms
       - Multiple standards check: < 50ms

    4. QUERY PERFORMANCE:
       - Find blocked tasks: < 100ms
       - Find tasks by status: < 100ms
       - Get progress for roadmap: < 200ms

    5. UPDATE PERFORMANCE:
       - Update task status: < 50ms
       - Add commit to task: < 50ms
       - Complete sprint (cascade): < 200ms

    OPTIMIZATION TARGETS:

    1. LAZY LOADING:
       - Don't load children until accessed
       - Don't compute aggregation until accessed
       - Cache computed values

    2. EAGER LOADING OPTIONS:
       For known access patterns, provide eager loading:

       # Load sprint with tasks for display
       sprint = repo.get_with_children(sprint_id,
           eager=['tasks', 'tasks.commits'])

    3. CACHING:
       - Cache aggregated values with invalidation
       - Cache effective standards
       - Invalidate on change

    4. DATABASE OPTIMIZATION:
       - Ensure indexes on parent_id
       - Use SQL views for common aggregations
       - Consider materialized views for large roadmaps

    5. BATCH OPERATIONS:
       - Load multiple tickets in one query
       - Batch updates in transactions

    IMPLEMENTATION:

    1. Create benchmark suite
    2. Run benchmarks against current implementation
    3. Identify hotspots (> 2x threshold)
    4. Implement optimizations
    5. Re-run benchmarks
    6. Document optimization decisions

    SUCCESS CRITERIA:
    - All benchmarks within 2x of baseline
    - No operation > 1 second
    - Aggregation scales linearly
    - Memory usage acceptable
