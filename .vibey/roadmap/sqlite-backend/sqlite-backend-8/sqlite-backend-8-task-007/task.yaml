  task_type: development
  title: Create migration CLI command
  description: |
    Create a CLI command to migrate existing YAML files from v1 format
    to v2 format (with _local suffixes and hierarchy attributes).

    COMMAND INTERFACE:

    vibey roadmap migrate-format [OPTIONS]

    Options:
      --dry-run         Show what would change without modifying files
      --backup          Create .bak files before modifying (default: true)
      --path PATH       Path to roadmap directory (default: .vibey/roadmap)
      --force           Overwrite without confirmation
      --verbose         Show detailed progress

    MIGRATION PROCESS:

    1. DISCOVERY:
       - Find all YAML files in roadmap directory
       - Detect format version of each file
       - Report: "Found X files: Y v1, Z v2"

    2. DRY RUN OUTPUT:
       $ vibey roadmap migrate-format --dry-run

       Migration Preview:
       ─────────────────
       Files to migrate: 45
       Already v2: 12
       Skipped: 0

       Changes per file:
       - sqlite-backend/track.yaml: 8 field renames
       - sqlite-backend/sqlite-backend-0/sprint.yaml: 5 field renames
       ...

    3. ACTUAL MIGRATION:
       $ vibey roadmap migrate-format

       Migrating roadmap files to v2 format...
       [1/45] sqlite-backend/track.yaml ✓
       [2/45] sqlite-backend/sqlite-backend-0/sprint.yaml ✓
       ...
       Migration complete: 45 files updated

    4. BACKUP HANDLING:
       - Create .bak file before modifying
       - Keep backups for 7 days (configurable)
       - Provide restore command if needed

    5. VALIDATION:
       After migration:
       - Load each migrated file
       - Verify Pydantic validation passes
       - Report any validation errors

    FIELD TRANSFORMATIONS:

    v1 → v2 Mapping:
    - commits → commits_local
    - deliverables → deliverables_local
    - standards → standards_local
    - quality_gates → quality_gates_local
    - assigned_agents → assigned_agents_local
    - blocked_by → depends_on (with structure change)

    Structure Changes:
    # v1 blocked_by
    blocked_by:
    - sqlite-backend-5

    # v2 depends_on
    depends_on:
    - target_id: sqlite-backend-5
      dependency_type: blocks
      status: satisfied

    IMPLEMENTATION:

    1. Add migrate_format command to CLI
    2. Implement format detection
    3. Implement field transformation
    4. Implement backup/restore
    5. Add dry-run support
    6. Add progress reporting
    7. Add post-migration validation

    SUCCESS CRITERIA:
    - Command migrates all v1 files to v2
    - Backups created before modification
    - Dry-run shows accurate preview
    - Migrated files pass validation
    - No data loss during migration
