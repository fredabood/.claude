    notes: |
      This command provides a safe way to migrate existing
      roadmap files to the new format.

      While the system can read v1 files automatically,
      having an explicit migration command:
      1. Makes the migration visible and intentional
      2. Allows batch conversion with backup
      3. Validates all files after conversion
      4. Reduces ongoing format detection overhead

      RECOMMENDED WORKFLOW:
      1. vibey roadmap migrate-format --dry-run
      2. Review changes
      3. vibey roadmap migrate-format --backup
      4. Commit migrated files
