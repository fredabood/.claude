  title: Implement new directory structure and file format in serialization
  description: |
    Implement the chosen directory structure and file format based on
    analysis from sprint 6 tasks 001-003.

    IMPLEMENTATION STEPS:

    1. Create new directory structure:
       - Create table folders matching SQLite schema
       - Set up context consolidation folder
       - Create triggers folder if needed

    2. Update serialization code:
       - Modify yaml_dumper.py to write to new structure
       - Modify yaml_loader.py to read from new structure
       - Add format conversion if changing from YAML

    3. Update sql_dumper.py:
       - Simplify to iterate table folders
       - One file per row, direct mapping
       - Remove hierarchical traversal logic

    4. Update sql_loader.py:
       - Simplify to read from table folders
       - Direct mapping from files to rows
       - Remove hierarchical assembly logic

    5. Update path utilities:
       - vibey/roadmap/paths.py or similar
       - New functions for table-based paths
       - Deprecate old hierarchical paths

    CODE CHANGES EXPECTED:
    - vibey/roadmap/serialization/yaml_dumper.py
    - vibey/roadmap/serialization/yaml_loader.py
    - vibey/roadmap/serialization/sql_dumper.py
    - vibey/roadmap/serialization/sql_loader.py
    - vibey/operations/roadmap/*.py (path references)

    TESTING:
    - Round-trip test: YAML -> SQLite -> YAML
    - Verify all tasks preserved
    - Verify all relationships maintained
    - Performance comparison (old vs new)

    DELIVERABLES:
    - Updated serialization code
    - New path utility functions
    - Test results showing data integrity
    - Performance benchmark results
