    notes: |
      Sprint 9: Operations Migration

      DESIGN REFERENCE: sqlite-backend-6/context/architecture/02-CLASS-MODEL.md

      GOAL: Update all roadmap operations to use criteria-based completion
      with Requirement inheritance (renamed from Standards).

      DEPENDS ON: Sprint 8 (serialization migration)

      KEY CHANGES:

      1. CRITERIA-BASED STATUS TRANSITIONS:
         All status changes must use can_transition_to():
         ```python
         can_complete, blockers = ticket.can_transition_to(TicketStatus.COMPLETED)
         if not can_complete:
             raise ValidationError(f"Cannot complete: {blockers}")
         ```

      2. REQUIREMENTS SYSTEM (renamed from Standards):
         - standards_enforcement.py → requirements.py
         - Standard → Requirement
         - Supports `enforceable` flag for ancestor-controlled constraints
         - InheritMode: INHERIT, OVERRIDE, SKIP (with justification)

      3. GITCOMMIT INTEGRATION:
         - process_commit(): Post-commit hook function
           * Links commits to artifacts via file paths
           * Updates artifact content hashes
           * Detects documentation staleness
         - verify_completion_claims(): Pre-commit validation
           * Parses "Completes:" lines from commit message
           * Validates all criteria met before allowing completion

      4. COMMIT-ARTIFACT VALIDATION:
         - CommitArtifactValidator for consistency checks
         - Warning (not blocking) for incidental artifact changes
         - Error (blocking) for completion claims with unmet criteria

      OPERATIONS FILES (priority order):
      - query.py (CRITICAL) - criteria-based status computation
      - update.py (CRITICAL) - can_transition_to() enforcement
      - requirements.py (CRITICAL) - renamed, enforceable flag
      - commit_mapper.py (HIGH) - GitCommit with file tracking
      - validate.py (HIGH) - criteria validation
      - summarize.py (HIGH) - progress from criteria
      - context.py (HIGH) - artifact references
      - auto_repair.py (MEDIUM) - criteria-aware repairs
      - audit_trail.py (MEDIUM) - activity log integration
      - checkpoint_verifier.py (MEDIUM) - integrity checks
      - safe_yaml_editor.py (MEDIUM) - semantic layer aware
      - advanced_validator.py (MEDIUM) - cross-entity validation
      - doc_tracking.py (LOW) - artifact staleness
      - init.py (LOW) - initialization

      SMART ACCESSOR USAGE:
      Operations should use smart accessors:
      - ticket.commits (aggregates from children)
      - ticket.requirements_effective (inherits from ancestors)
      - ticket.all_criteria (includes inherited requirements)
      - ticket.can_transition_to(status) (criteria-based)
