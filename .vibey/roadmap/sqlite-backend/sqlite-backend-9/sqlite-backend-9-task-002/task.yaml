  title: Update update.py with smart accessor usage
  description: "Refactor update.py operations to use new unified ticket models\nand\
    \ leverage smart accessors for consistent updates.\n\nCURRENT STATE:\n- update.py\
    \ handles status transitions, commit sync, etc.\n- Uses old dataclass models\n\
    - Manual aggregation for progress updates\n\nCHANGES REQUIRED:\n\n1. UPDATE IMPORTS:\n\
    \   from vibey.roadmap.models.ticket import (\n       TaskTicket, SprintTicket,\
    \ TrackTicket, RoadmapTicket,\n       TicketStatus, GitCommit\n   )\n\n2. STATUS\
    \ TRANSITION UPDATES:\n   Use Ticket methods for transitions:\n\n   # OLD\n  \
    \ def complete_task(task_id):\n       task = load_task(task_id)\n       task.status\
    \ = 'completed'\n       task.completed = datetime.now()\n       save_task(task)\n\
    \n   # NEW\n   def complete_task(task_id):\n       task = load_task(task_id)\n\
    \       if not task.can_complete():\n           raise ValidationError(task.get_blocking_reason())\n\
    \       updated_task = task.complete()  # Returns new instance\n       save_task(updated_task)\n\
    \n3. COMMIT SYNC UPDATES:\n   Simplified with smart accessors:\n\n   # OLD - manual\
    \ aggregation\n   def sync_commits_to_sprint(sprint_id):\n       sprint = load_sprint(sprint_id)\n\
    \       all_commits = []\n       for task in sprint.tasks:\n           all_commits.extend(task.commits)\n\
    \       sprint.commits = all_commits\n       save_sprint(sprint)\n\n   # NEW -\
    \ smart accessor handles it\n   def get_sprint_commits(sprint_id):\n       sprint\
    \ = load_sprint_with_children(sprint_id)\n       return sprint.commits  # Already\
    \ aggregated\n   # No sync needed - aggregation is computed on access\n\n4. PROGRESS\
    \ UPDATES:\n   Progress is computed, not stored:\n\n   # OLD - manual calculation\n\
    \   def update_sprint_progress(sprint_id):\n       sprint = load_sprint(sprint_id)\n\
    \       completed = sum(1 for t in sprint.tasks if t.status == 'completed')\n\
    \       sprint.progress.completed = completed\n       save_sprint(sprint)\n\n\
    \   # NEW - computed automatically\n   def get_sprint_progress(sprint_id):\n \
    \      sprint = load_sprint_with_children(sprint_id)\n       return sprint.progress\
    \  # Computed from children\n\n5. FUNCTIONS TO UPDATE:\n   - update_task_status()\n\
    \   - update_sprint_status()\n   - update_track_status()\n   - complete_task()\n\
    \   - complete_sprint()\n   - add_commit_to_task()\n   - sync_progress()\n   -\
    \ cascade_block_status()\n\n6. NEW PATTERN - IMMUTABLE UPDATES:\n   Use model_copy()\
    \ for immutable state changes:\n\n   def add_commit(task_id, commit: GitCommit):\n\
    \       task = load_task(task_id)\n       updated_task = task.model_copy(update={\n\
    \           'commits_local': task.commits_local + [commit]\n       })\n      \
    \ save_task(updated_task)\n\nIMPLEMENTATION STEPS:\n\n1. Update imports to new\
    \ model types\n2. Replace status updates with transition methods\n3. Remove manual\
    \ aggregation code (smart accessors handle it)\n4. Remove manual progress calculation\
    \ (computed)\n5. Use model_copy() for immutable updates\n6. Update all callers\n\
    7. Add/update tests\n\nSUCCESS CRITERIA:\n- All update functions use new models\n\
    - Transition methods enforce validation\n- No manual aggregation code\n- No manual\
    \ progress calculation\n- Immutable update pattern used\n- All existing functionality\
    \ preserved\n"
