    notes: |
      KEY BENEFIT: Simplified enforcement logic.

      Currently standards_enforcement.py must manually walk
      the hierarchy to collect applicable standards.

      With smart accessors, ticket.standards returns the
      full effective chain automatically. The enforcement
      code just iterates one list.

      INHERITANCE RULES (from Sprint 6a):
      - merge: Local + all inherited, all values kept
      - override: Local wins, else nearest ancestor
      - default_only: Only inherit if local is empty

      Standards use "merge" strategy - all standards from
      all ancestors apply unless explicitly overridden.
