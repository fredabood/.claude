  title: Update standards_enforcement.py with inheritance
  description: |
    Refactor standards_enforcement.py to use the new inheritance
    pattern where standards cascade from parent to child tickets.

    CURRENT STATE:
    - Each level (roadmap, track, sprint) has independent standards
    - Manual checking at each level
    - No inheritance chain concept

    CHANGES REQUIRED:

    1. USE EFFECTIVE STANDARDS:
       The smart accessor standards_effective returns the full
       inheritance chain:

       # OLD - check each level separately
       def check_standards(task_id):
           task = load_task(task_id)
           sprint = load_sprint(task.sprint_id)
           track = load_track(sprint.track_id)
           roadmap = load_roadmap(track.roadmap_id)

           violations = []
           violations.extend(check_against(task, roadmap.standards))
           violations.extend(check_against(task, track.standards))
           violations.extend(check_against(task, sprint.standards))
           return violations

       # NEW - effective standards includes full chain
       def check_standards(task_id):
           task = load_task_with_ancestors(task_id)
           return check_against(task, task.standards)
           # task.standards = standards_effective (inherited)

    2. STANDARD OVERRIDE HANDLING:
       Overrides at lower levels take precedence:

       def get_effective_standard(task_id, standard_id):
           task = load_task_with_ancestors(task_id)
           for standard in task.standards:
               if standard.id == standard_id:
                   return standard
           return None  # Standard not applicable

    3. BLOCKING STANDARD DETECTION:
       def get_blocking_standards(ticket_id):
           ticket = load_ticket_with_ancestors(ticket_id)
           return [s for s in ticket.standards
                   if s.is_blocking() and not s.is_satisfied(ticket)]

    4. STANDARD ENFORCEMENT LEVELS:
       - REQUIRED: Must pass before completion
       - RECOMMENDED: Warning on completion
       - OPTIONAL: Audit only, no blocking

       def can_complete(ticket_id):
           ticket = load_ticket_with_ancestors(ticket_id)
           for standard in ticket.standards:
               if standard.is_blocking() and not standard.is_satisfied(ticket):
                   return False, f"Blocked by standard: {standard.name}"
           return True, None

    5. FUNCTIONS TO UPDATE:
       - check_standards()
       - get_applicable_standards()
       - get_blocking_standards()
       - enforce_standards()
       - validate_against_standard()
       - get_standard_violations()

    6. NEW FUNCTIONS:
       - get_effective_standards(ticket_id)
       - get_inherited_standards(ticket_id)
       - get_local_standards(ticket_id)
       - get_standard_override_chain(ticket_id, standard_id)

    IMPLEMENTATION STEPS:

    1. Update imports to new model types
    2. Replace manual hierarchy traversal with smart accessors
    3. Update enforcement functions to use standards_effective
    4. Add override handling for lower-level precedence
    5. Update blocking detection
    6. Add new helper functions
    7. Update all callers
    8. Add/update tests

    SUCCESS CRITERIA:
    - Standards inherit correctly from ancestors
    - Lower-level overrides take precedence
    - Blocking standards prevent completion
    - No manual hierarchy traversal
    - All existing functionality preserved
