  title: Integration testing for all operations
  description: "Comprehensive integration testing to verify all operations\nwork correctly\
    \ with new unified ticket models.\n\nTEST SCENARIOS:\n\n1. TASK LIFECYCLE:\n \
    \  - Create task with TaskTicket\n   - Start task (status transition)\n   - Add\
    \ commits to task\n   - Complete task\n   - Verify commits appear in sprint.commits\
    \ (aggregation)\n\n2. SPRINT LIFECYCLE:\n   - Create sprint with SprintTicket\n\
    \   - Add tasks to sprint\n   - Complete all development tasks\n   - Pass completion\
    \ gates\n   - Complete sprint\n   - Verify progress computed correctly\n\n3. TRACK\
    \ LIFECYCLE:\n   - Create track with TrackTicket\n   - Add sprints to track\n\
    \   - Complete sprints\n   - Verify track.commits includes all sprint commits\n\
    \   - Verify track.progress computed from sprints\n\n4. STANDARDS INHERITANCE:\n\
    \   - Define standard on roadmap\n   - Verify track.standards includes roadmap\
    \ standard\n   - Verify sprint.standards includes track + roadmap\n   - Verify\
    \ task.standards includes full chain\n   - Override standard at track level\n\
    \   - Verify override takes precedence\n\n5. QUALITY GATES CASCADE:\n   - Define\
    \ quality gate on track\n   - Verify gate applies to sprints\n   - Verify blocking\
    \ gate prevents sprint completion\n\n6. HIERARCHY NAVIGATION:\n   - Create full\
    \ hierarchy (roadmap → track → sprint → task)\n   - Navigate up: task.get_sprint().get_track().get_roadmap()\n\
    \   - Navigate down: roadmap.get_tracks()[0].get_sprints()\n   - Verify hierarchy\
    \ attributes correct at each level\n\n7. AGGREGATION CORRECTNESS:\n   - Add commit\
    \ to task\n   - Verify sprint.commits_aggregated includes it\n   - Verify track.commits_aggregated\
    \ includes it\n   - Verify roadmap.commits_aggregated includes it\n\n8. DEPENDENCY\
    \ HANDLING:\n   - Create task with depends_on\n   - Verify is_blocked computed\
    \ correctly\n   - Complete dependency\n   - Verify task unblocked\n\n9. ERROR\
    \ CASES:\n   - Invalid status transition\n   - Missing required fields\n   - Invalid\
    \ hierarchy (task without sprint)\n   - Circular dependency detection\n\n10. PERFORMANCE:\n\
    \    - Load large roadmap (100+ tasks)\n    - Measure aggregation time\n    -\
    \ Measure hierarchy traversal time\n    - Compare with baseline\n\nTEST DATA:\n\
    \nUse real sqlite-backend track as test fixture:\n- 10+ sprints\n- 67+ tasks\n\
    - Mix of completed/in-progress/not-started\n- Standards defined at multiple levels\n\
    \nIMPLEMENTATION:\n\n1. Create integration test framework\n2. Create test fixtures\
    \ from real data\n3. Implement test for each scenario\n4. Add performance benchmarks\n\
    5. Generate coverage report\n\nSUCCESS CRITERIA:\n- All integration tests pass\n\
    - 90%+ code coverage for operations\n- Performance within 2x of baseline\n- No\
    \ regressions from previous behavior\n"
