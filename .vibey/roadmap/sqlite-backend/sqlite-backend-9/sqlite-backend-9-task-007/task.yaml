  title: Implement Unified Activity Log in Operations
  description: "Update all operations to use the unified ActivityLogEntry for both\n\
    high-level events and field-level audit tracking.\n\nDESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md\
    \ Part 11.3\n\nUNIFIED ACTIVITY LOG:\n\nThe ActivityLogEntry class now handles\
    \ both:\n1. High-level events (SPRINT_COMPLETED, TASK_STARTED, etc.)\n2. Field-level\
    \ audit (FIELD_CHANGED with old_value/new_value)\n\nThis replaces the separate\
    \ audit_trail.py system.\n\nOPERATIONS TO UPDATE:\n\nupdate.py:\n- complete_task():\
    \ Log STATUS_CHANGED with old/new status\n- start_task(): Log TASK_STARTED\n-\
    \ start_sprint(): Log SPRINT_STARTED\n- complete_sprint(): Log SPRINT_COMPLETED\n\
    - All field updates: Log FIELD_CHANGED with entity info\n\nquery.py:\n- Add query_activity_log(filters)\
    \ function\n- Support filtering by entity_type, entity_id, type, date range\n\n\
    validate.py:\n- Log VALIDATION_WARNING for non-blocking issues\n\nauto_repair.py:\n\
    - Log FIELD_CHANGED for each repair with changed_by=\"auto_repair\"\n\nREMOVE/DEPRECATE:\n\
    \naudit_trail.py:\n- Mark as deprecated\n- Add migration function to convert old\
    \ AuditEntry → ActivityLogEntry\n- Keep AuditTrailManager.detect_suspicious_changes()\
    \ but query activity_log\n\nACTIVITY LOG STORAGE:\n\nAll activity entries stored\
    \ in RoadmapTicket.activity_log and\nsynced to activity_log database table.\n\n\
    Add helper function:\n    def log_activity(\n        roadmap: RoadmapTicket,\n\
    \        type: ActivityType,\n        description: str,\n        entity_type:\
    \ Optional[str] = None,\n        entity_id: Optional[str] = None,\n        field:\
    \ Optional[str] = None,\n        old_value: Any = None,\n        new_value: Any\
    \ = None,\n        changed_by: Optional[str] = None,\n        commit_sha: Optional[str]\
    \ = None,\n        context: Optional[Dict] = None\n    ) -> None:\n        roadmap.activity_log.append(ActivityLogEntry(...))\n\
    \nFILE CHANGES:\n- vibey/operations/roadmap/update.py (use log_activity)\n- vibey/operations/roadmap/query.py\
    \ (add query_activity_log)\n- vibey/operations/roadmap/validate.py (log warnings)\n\
    - vibey/operations/roadmap/auto_repair.py (log repairs)\n- vibey/operations/roadmap/audit_trail.py\
    \ (deprecate, add migration)\n- vibey/operations/roadmap/activity.py (new: log_activity\
    \ helper)\n- tests/operations/roadmap/test_activity_log.py\n\nSUCCESS CRITERIA:\n\
    - All status changes logged with old/new values\n- All field changes logged with\
    \ entity info\n- query_activity_log supports filtering\n- audit_trail.py marked\
    \ deprecated\n- Migration converts old audit entries\n- detect_suspicious_changes()\
    \ still works\n- Full test coverage\n"
