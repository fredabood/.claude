  title: Implement Unified Activity Log in Operations
  description: |
    Update all operations to use the unified ActivityLogEntry for both
    high-level events and field-level audit tracking.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 11.3

    UNIFIED ACTIVITY LOG:

    The ActivityLogEntry class now handles both:
    1. High-level events (SPRINT_COMPLETED, TASK_STARTED, etc.)
    2. Field-level audit (FIELD_CHANGED with old_value/new_value)

    This replaces the separate audit_trail.py system.

    OPERATIONS TO UPDATE:

    update.py:
    - complete_task(): Log STATUS_CHANGED with old/new status
    - start_task(): Log TASK_STARTED
    - start_sprint(): Log SPRINT_STARTED
    - complete_sprint(): Log SPRINT_COMPLETED
    - All field updates: Log FIELD_CHANGED with entity info

    query.py:
    - Add query_activity_log(filters) function
    - Support filtering by entity_type, entity_id, type, date range

    validate.py:
    - Log VALIDATION_WARNING for non-blocking issues

    auto_repair.py:
    - Log FIELD_CHANGED for each repair with changed_by="auto_repair"

    REMOVE/DEPRECATE:

    audit_trail.py:
    - Mark as deprecated
    - Add migration function to convert old AuditEntry → ActivityLogEntry
    - Keep AuditTrailManager.detect_suspicious_changes() but query activity_log

    ACTIVITY LOG STORAGE:

    All activity entries stored in RoadmapTicket.activity_log and
    synced to activity_log database table.

    Add helper function:
        def log_activity(
            roadmap: RoadmapTicket,
            type: ActivityType,
            description: str,
            entity_type: Optional[str] = None,
            entity_id: Optional[str] = None,
            field: Optional[str] = None,
            old_value: Any = None,
            new_value: Any = None,
            changed_by: Optional[str] = None,
            commit_sha: Optional[str] = None,
            context: Optional[Dict] = None
        ) -> None:
            roadmap.activity_log.append(ActivityLogEntry(...))

    FILE CHANGES:
    - vibey/operations/roadmap/update.py (use log_activity)
    - vibey/operations/roadmap/query.py (add query_activity_log)
    - vibey/operations/roadmap/validate.py (log warnings)
    - vibey/operations/roadmap/auto_repair.py (log repairs)
    - vibey/operations/roadmap/audit_trail.py (deprecate, add migration)
    - vibey/operations/roadmap/activity.py (new: log_activity helper)
    - tests/operations/roadmap/test_activity_log.py

    SUCCESS CRITERIA:
    - All status changes logged with old/new values
    - All field changes logged with entity info
    - query_activity_log supports filtering
    - audit_trail.py marked deprecated
    - Migration converts old audit entries
    - detect_suspicious_changes() still works
    - Full test coverage
