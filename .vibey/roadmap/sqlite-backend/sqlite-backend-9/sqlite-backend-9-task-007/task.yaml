    notes: |
      GAP REMEDIATION: Unified Activity Log

      This consolidates the separate audit_trail system into the
      activity_log on RoadmapTicket. All entity changes (status,
      fields, progress) are now tracked in one place.

      Benefits:
      - Single source of truth for all changes
      - Consistent logging format
      - Query by entity, date, type
      - Still supports suspicious change detection
