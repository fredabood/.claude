    notes: |
      GAP REMEDIATION: Pre-Commit Completion Verification

      This is THE guardrail that prevents marking tickets complete
      when criteria aren't met. The AI cannot bypass this - git
      itself will reject the commit.

      Key insight: Completion claims live in git history (auditable),
      and the hook verifies them BEFORE they can be committed.

      This enforces the deterministic completion model at the
      git level, not just the CLI level.
