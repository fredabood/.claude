  title: Implement Pre-Commit Hook for Completion Verification
  description: |
    Create a pre-commit hook that verifies criteria are met when a commit
    claims to complete tickets via "Completes:" markers in the message.

    DESIGN REFERENCE: UNIFIED_TICKET_ARCHITECTURE.md Part 11.6

    PRE-COMMIT HOOK BEHAVIOR:

    When a commit message contains "Completes: <ticket-id>":
    1. Parse all "Completes:" lines from commit message
    2. For each claimed ticket:
       a. Load ticket from YAML/database
       b. Call ticket.can_transition_to(COMPLETED)
       c. If can=False, collect blocking reasons
    3. If any tickets can't complete, abort commit with error message

    HOOK IMPLEMENTATION:

    File: .vibey/hooks/pre-commit-completion-check

    #!/usr/bin/env python3
    import sys
    from pathlib import Path
    from vibey.roadmap.hooks import verify_completion_claims

    def main():
        # Read commit message from file passed as argument
        commit_msg_file = sys.argv[1]
        commit_message = Path(commit_msg_file).read_text()

        # Verify completion claims
        root_dir = Path.cwd()
        errors = verify_completion_claims(commit_message, root_dir)

        if errors:
            print("❌ Pre-commit hook failed:\n")
            for error in errors:
                print(error)
                print()
            print("Commit aborted. Fix criteria or remove 'Completes:' line.")
            sys.exit(1)

        sys.exit(0)

    VERIFICATION FUNCTION:

    def verify_completion_claims(commit_message: str, root_dir: Path) -> List[str]:
        errors = []

        # Extract "Completes: ticket-id" lines
        claimed = []
        for line in commit_message.split('\n'):
            if line.strip().startswith('Completes:'):
                ticket_id = line.replace('Completes:', '').strip()
                claimed.append(ticket_id)

        for ticket_id in claimed:
            ticket = load_ticket(ticket_id, root_dir)
            if not ticket:
                errors.append(f"Unknown ticket: {ticket_id}")
                continue

            can, reasons = ticket.can_transition_to(TicketStatus.COMPLETED)

            if not can:
                errors.append(
                    f"Cannot complete {ticket_id} - criteria not met:\n" +
                    "\n".join(f"  - {r}" for r in reasons)
                )

        return errors

    HOOK INSTALLATION:

    Update vibey roadmap install-hooks to:
    1. Copy pre-commit-completion-check to .git/hooks/
    2. Make it executable
    3. Chain with existing pre-commit hooks

    CLI COMMAND UPDATE:

    vibey roadmap install-hooks:
    - Add --completion-check flag (default: enabled)
    - Add --skip-completion-check to disable

    vibey roadmap check-hooks:
    - Show status of completion check hook

    FILE CHANGES:
    - vibey/roadmap/hooks/__init__.py (new module)
    - vibey/roadmap/hooks/completion_check.py (verify_completion_claims)
    - vibey/roadmap/hooks/pre-commit-completion-check (hook script)
    - vibey/cli/commands/roadmap.py (update install-hooks)
    - tests/roadmap/hooks/test_completion_check.py

    SUCCESS CRITERIA:
    - Hook parses "Completes:" markers correctly
    - Hook loads tickets and checks can_transition_to(COMPLETED)
    - Hook aborts commit if criteria not met
    - Hook shows clear error messages with blocking reasons
    - vibey roadmap install-hooks installs the hook
    - Full test coverage
