    notes: |
      SQLite backend to replace YAML as working state for roadmap operations.

      PROBLEM SOLVED:
      Current YAML-based system requires manual synchronization of:
      - Progress counters (tasks_completed, completion_percent)
      - Sprint aggregations
      - Track aggregations
      - Roadmap-level metrics
      This leads to state drift and validation errors (262 fixed in recent session).

      SOLUTION:
      - SQLite database as single source of truth during work
      - Computed views for all aggregations (always accurate)
      - Foreign keys for referential integrity
      - YAML files remain for version control (human-readable diffs)
      - Deterministic DB → YAML dump on commit
      - YAML → DB rebuild on pull

      ARCHITECTURE:
      ```
      vibey CLI → SQLite DB (working state)
                      ↓
      git commit → dump DB → YAML files (version control)
                      ↓
      git pull → rebuild DB from YAML
      ```

      RELATIONSHIP TO GIT-INTEGRATION-5:
      - git-integration-5 focuses on INTEGRITY PROTECTION (preventing unauthorized changes)
      - sqlite-backend focuses on DATA CONSISTENCY (eliminating manual sync)
      - These are orthogonal concerns and can be implemented independently
      - SQLite can later integrate with signing system (checksums in DB)
