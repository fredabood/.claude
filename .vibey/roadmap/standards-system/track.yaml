    notes: |
      ROADMAP STANDARDS SYSTEM - QUALITY POLICY ENFORCEMENT

      This track implements a mandatory standards system that enforces
      organizational policies and quality requirements across the roadmap
      hierarchy. Standards cascade down from roadmap to tracks to sprints
      to tasks, ensuring consistent quality enforcement.

      PROBLEM:
      Currently, quality gates are sprint-specific and optional. There's no
      way to enforce organization-wide policies like:
      - All tasks must have git commits
      - All features must have documentation
      - All code must pass multi-platform tests
      - All changes must meet coverage thresholds

      SOLUTION:
      Implement a hierarchical standards system where:
      1. Standards can be defined at roadmap/track/sprint level
      2. Standards cascade down to all children
      3. Standards are enforced during completion
      4. Standards can be blocking, warning, or audit-only
      5. Override mechanism exists with reason tracking

      ARCHITECTURE:

      1. Data Model (Sprint 1)
         - Standard dataclass with validation rules
         - Standards field added to Roadmap/Track/Sprint
         - YAML serialization/deserialization
         - Backward compatible (standards: [] default)

      2. Resolution Engine (Sprint 2)
         - Resolve effective standards for any item
         - Implement hierarchical inheritance
         - Handle deduplication
         - Support override mechanism

      3. Validators (Sprint 3)
         - CommitCheckValidator: Ensures tasks have commits
         - FileCheckValidator: Ensures specific files modified
         - TestRunValidator: Runs tests and checks results
         - CustomScriptValidator: Runs custom validation
         - Validator registry and result types

      4. CLI Integration (Sprint 4)
         - Update 'complete' command with standards enforcement
         - New 'check-standards' command
         - New 'override-standard' command
         - New 'add-standard' command
         - Enhanced status/show output

      5. Templates (Sprint 5)
         - commit-required.yaml
         - doc-review-required.yaml
         - test-coverage-required.yaml
         - multi-platform-testing.yaml
         - security-review.yaml

      6. UI/UX & Docs (Sprint 6)
         - Enhanced status display
         - Color coding (green/yellow/red)
         - Progress indicators
         - User documentation
         - Developer documentation

      USE CASES FOR VIBEY:

      1. Multi-Platform Testing Standard (Roadmap-level)
         All platforms with completed ports must pass test suite:
         - claude-code: 100% pass rate (required)
         - goose: 100% pass rate (if ported)
         - cursor: 100% pass rate (if ported)
         - Blocking enforcement

      2. Commit Required Standard (Roadmap-level)
         All task completions must have at least one git commit:
         - Enforces code traceability
         - Blocking enforcement
         - Error: "Task must have commit. Use: vibey roadmap add-commit <task-id> --auto"

      3. Documentation Review Standard (Track-level for core-framework)
         All tasks must update documentation:
         - Checks for modified *.md files
         - Warning enforcement (not blocking)
         - Encourages but doesn't require

      4. Test Coverage Standard (Roadmap-level)
         All code changes must include tests:
         - Min 1 test file modified
         - Coverage threshold: 80%
         - Blocking enforcement

      HIERARCHICAL EXAMPLE:

      Roadmap standards (apply to ALL):
        - commit-required (blocking)
        - multi-platform-testing (blocking)

      Track: core-framework standards (apply to core-framework only):
        - doc-review-required (warning)
        - test-coverage-required (blocking)

      Sprint: auth-sprint-1 standards (apply to auth-sprint-1 only):
        - security-review-required (blocking)

      Effective standards for task auth-sprint-1-task-001:
        1. commit-required (from roadmap)
        2. multi-platform-testing (from roadmap)
        3. doc-review-required (from track)
        4. test-coverage-required (from track)
        5. security-review-required (from sprint)

      IMPLEMENTATION STRATEGY:

      Week 1 (Sprint 1): Core Data Model
      - Define Standard dataclass
      - Add standards fields to models
      - YAML serialization
      - Unit tests
      - Backward compatibility verified

      Week 2 (Sprint 2): Resolution Engine
      - Build standards resolver
      - Hierarchical inheritance
      - Deduplication logic
      - Override handling
      - Integration tests

      Week 3 (Sprint 3): Validators
      - Implement 4 validators
      - Validator framework
      - Result types
      - Validator tests
      - Registry system

      Week 4 (Sprint 4): CLI Integration
      - Update complete command
      - Add check-standards command
      - Add override-standard command
      - Add add-standard command
      - CLI tests

      Week 5 (Sprint 5): Templates
      - Create 5 standard templates
      - Template CLI commands
      - Template documentation
      - Template tests
      - Examples

      Week 6 (Sprint 6): UI/UX & Docs
      - Enhanced status output
      - Enhanced show output
      - Color coding
      - User documentation
      - Developer documentation
      - Final integration testing

      VALIDATION CRITERIA:

      1. Test Coverage (90%)
         - >90% coverage for standards system
         - All critical paths tested
         - Integration tests complete

      2. Integration Tests (100%)
         - All standards integration tests pass
         - Hierarchical inheritance works
         - Enforcement works correctly
         - Override mechanism works

      3. Backward Compatibility (100%)
         - Existing roadmaps load without errors
         - Empty standards field works
         - Completion without standards works
         - No breaking changes

      4. Documentation Complete (100%)
         - User guide complete
         - Developer guide complete
         - API documentation complete
         - Examples provided

      RISKS & MITIGATION:

      Risk: Over-enforcement frustrates developers
      → Start with warning mode, upgrade to blocking after feedback
      → Provide clear override mechanism
      → Document why each standard exists

      Risk: Performance impact on completion
      → Cache validation results
      → Run validators in parallel
      → Optimize validator implementations

      Risk: Complex configuration
      → Provide standard templates
      → Clear error messages
      → Comprehensive examples

      SUCCESS METRICS:

      - Standards system implemented and tested
      - >90% code coverage achieved
      - Backward compatibility maintained (100%)
      - Documentation complete
      - Vibey project using standards
      - 90%+ task compliance with commit-required standard
      - 100% sprint compliance with multi-platform-testing
      - Zero production releases with failing standards

      TIMELINE & DEPENDENCIES:

      Timeline: 6 weeks (Q1 2025)
      Priority: CRITICAL (enables quality policy enforcement)
      Dependencies: None (can start immediately)
      Blocks: None (enhancement to existing system)

      This track enables Vibey to enforce organizational quality policies
      automatically, ensuring consistent quality across all development.

      Recommend: START AFTER CORE DOCUMENTATION UPDATES
