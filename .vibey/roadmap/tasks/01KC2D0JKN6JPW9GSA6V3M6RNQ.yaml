  task_type: development
  title: Fix CLI task completion reformatting sibling task files
  description: 'Fixed bug where completing/starting/assigning a single task would
    rewrite ALL sibling

    task files in the same sprint, causing unnecessary file changes and git diffs.


    ROOT CAUSE:

    - roadmap-update.py and operations/roadmap/update.py used save_tasks(tasks, tasks_path)

    - This function iterates over ALL tasks and rewrites each task.yaml file

    - Only the modified task should be saved


    FIX:

    - Updated imports to include save_task (singular)

    - Changed single-task operations to use save_task(task, tasks_path) instead of
    save_tasks()


    FILES MODIFIED:

    - vibey/cli/roadmap-update.py: 4 save_tasks → save_task conversions

    - vibey/operations/roadmap/update.py: 5 save_tasks → save_task conversions


    OPERATIONS FIXED:

    - complete_task: Now saves only the completed task

    - start_task: Now saves only the started task

    - assign_task: Now saves only the assigned task

    - add_commit_to_task: Now saves only the task with new commit

    - update_dependent_cache: Now saves only the task with updated dependency cache


    Note: Batch operations like refresh_all_dependency_caches still use save_tasks()
    as they

    may modify multiple tasks in a sprint.

    '
