    \    criteria = []\n    for row in rows:\n        target = _build_target_from_row(row)\n\
    \        criteria.append(Criterion(\n            id=row['id'],\n            description=row['description'],\n\
    \            blocks_transition_to=TicketStatus(row['blocks_transition_to']),\n\
    \            target=target,\n            required=bool(row['required']),\n   \
    \     ))\n    return criteria\n```\n\nREFERENCE:\n- vibey/roadmap/serialization/sql_loader.py\
