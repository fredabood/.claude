  title: Implement can_transition_to() checks in CLI status updates
  description: "Integrate can_transition_to() validation into CLI status update commands.\n\
    \nCURRENT STATE:\n- vibey roadmap update task --status completed just sets status\n\
    - No validation of blocking criteria\n- AI can mark anything complete\n\nTARGET\
    \ STATE:\n- Status changes must pass can_transition_to() check\n- Blocking criteria\
    \ displayed if transition blocked\n- --force flag to override (with warning)\n\
    \nIMPLEMENTATION:\n```python\n@roadmap.command()\n@click.option('--status', type=str)\n\
    @click.option('--force', is_flag=True, help='Override blocking criteria')\ndef\
    \ update_task(task_id: str, status: str, force: bool):\n    task = load_task(task_id)\n\
    \n    if status:\n        target_status = TicketStatus(status)\n        can_transition,\
    \ blocking = task.can_transition_to(target_status)\n\n        if not can_transition\
    \ and not force:\n            click.echo(\"Cannot transition to {status}. Blocking\
    \ criteria:\")\n            for reason in blocking:\n                click.echo(f\"\
    \  - {reason}\")\n            click.echo(\"Use --force to override.\")\n     \
    \       return\n\n        if not can_transition and force:\n            click.echo(\"\
    WARNING: Forcing status change despite blocking criteria\")\n\n        task.status\
    \ = target_status\n        save_task(task)\n```\n\nREFERENCE:\n- vibey/roadmap/models/ticket/completable.py\
    \ (can_transition_to)\n- sqlite-backend-6/context/architecture/01-DESIGN-PRINCIPLES.md\n"
