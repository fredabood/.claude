  title: Migrate quality_gates to criteria with ThresholdTarget
  description: "Migrate existing quality_gates to the criteria-based system using\
    \ ThresholdTarget.\n\nGAP ADDRESSED: GAP-001 (Quality Gates System)\n\nCURRENT\
    \ STATE:\n- track.quality_gates: List[QualityGate] with name, threshold, blocking,\
    \ status, score\n- sprint.quality_gates: List[QualityGate]\n- GateStatus enum:\
    \ NOT_RUN, RUNNING, PASSED, FAILED, SUPERSEDED\n\nTARGET STATE:\n- Criteria with\
    \ ThresholdTarget and blocks_transition_to=COMPLETED\n- GateStatus lifecycle simplified:\
    \ is_satisfied() returns True/False\n- NOT_RUN state = target.last_checked is\
    \ None\n- blocking: true = criterion.required = True\n- blocking: false = criterion.required\
    \ = False (tracked but doesn't block)\n\nMIGRATION STRATEGY:\n1. For each quality_gate\
    \ entry:\n   - Create Criterion with id=f\"gate-{gate.name.slugify()}\"\n   -\
    \ Create ThresholdTarget with:\n     - metric_name = gate.name\n     - threshold\
    \ = gate.threshold\n     - comparison = GTE (score must be >= threshold)\n   \
    \  - current_value = gate.score\n   - Set required = gate.blocking\n   - Set blocks_transition_to\
    \ = COMPLETED (or PRODUCTION_READY for deploy gates)\n2. Remove legacy quality_gates\
    \ field after migration\n\nEXAMPLE:\n```yaml\n# BEFORE\nquality_gates:\n  - name:\
    \ test_coverage\n    threshold: 80\n    blocking: true\n    status: passed\n \
    \   score: 85\n\n# AFTER\ncriteria:\n  - id: gate-test-coverage\n    description:\
    \ \"Test coverage must be >= 80%\"\n    blocks_transition_to: completed\n    required:\
    \ true\n    target:\n      type: threshold\n      metric_name: test_coverage\n\
    \      threshold: 80.0\n      comparison: gte\n      current_value: 85.0\n```\n\
    \nREFERENCE:\n- vibey/roadmap/models/ticket/targets.py (ThresholdTarget)\n- sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\
    \ (ThresholdTarget section)\n"
