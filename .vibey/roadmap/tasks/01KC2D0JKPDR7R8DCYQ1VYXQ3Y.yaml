  title: Integrate ActivityLog with unified ticket lifecycle
  description: "Integrate the unified ActivityLog with ticket lifecycle events.\n\n\
    GAP ADDRESSED: GAP-003 (Audit Trail Integration)\n\nDESIGN DECISION:\nThe audit\
    \ trail is kept as an operational concern, NOT integrated into the\ndomain model.\
    \ ActivityLog at the RoadmapTicket level captures high-level events.\nPer-field\
    \ change tracking is handled by:\n1. Git history for YAML files (comprehensive,\
    \ immutable)\n2. ActivityLogEntry for structured event queries\n3. Optional detailed\
    \ audit_trail table for compliance needs\n\nIMPLEMENTATION:\n1. Hook ActivityLog\
    \ into Ticket lifecycle methods:\n   - start() -> log START event\n   - complete()\
    \ -> log COMPLETE event\n   - transition to PRODUCTION_READY -> log DEPLOY_READY\
    \ event\n2. Log criteria evaluation results:\n   - can_transition_to() blocked\
    \ -> log BLOCKED event with reasons\n   - criteria met -> log CRITERIA_MET event\n\
    3. Add event types to ActivityType enum:\n   - TICKET_STARTED\n   - TICKET_COMPLETED\n\
    \   - TICKET_BLOCKED\n   - CRITERIA_MET\n   - CRITERIA_FAILED\n   - STATUS_CHANGED\n\
    4. Update CLI to display recent activity\n\nACTIVITY LOG ENTRY STRUCTURE:\n```python\n\
    class ActivityLogEntry(BaseModel):\n    timestamp: datetime\n    event_type: ActivityType\n\
    \    ticket_id: str\n    ticket_type: str  # roadmap, track, sprint, task\n  \
    \  actor: str  # claude-code, user, system, hook\n    details: Optional[Dict[str,\
    \ Any]]\n    commit_sha: Optional[str]\n```\n\nCLI DISPLAY:\n```\n$ vibey roadmap\
    \ activity --last 10\n2025-12-06 14:30  TICKET_COMPLETED  task-123  claude-code\n\
    2025-12-06 14:29  CRITERIA_MET      task-123  Tests passed\n2025-12-06 14:00 \
    \ TICKET_STARTED    task-123  claude-code\n```\n\nREFERENCE:\n- sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\
    \ (ActivityLogEntry)\n- vibey/roadmap/models/ticket/hierarchical.py (RoadmapTicket.activity_log)\n"
