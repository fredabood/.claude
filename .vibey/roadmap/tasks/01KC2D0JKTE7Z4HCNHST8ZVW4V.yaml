  title: Create directory migration script with backup
  description: "Create a migration script that:\n1. Backs up the entire .vibey/roadmap/\
    \ directory\n2. Creates new flat directory structure (tracks/, sprints/, tasks/,\
    \ artifacts/, context/)\n3. Moves files using git mv to preserve history\n4. Updates\
    \ internal file references\n5. Validates the migration\n6. Provides rollback capability\n\
    \nIMPLEMENTATION:\n```python\ndef migrate_to_flat_structure(\n    root_dir: Path,\n\
    \    dry_run: bool = True,\n    backup: bool = True\n) -> MigrationResult:\n \
    \   # 1. Create backup\n    if backup:\n        backup_path = create_backup(root_dir)\n\
    \n    # 2. Scan current structure\n    tracks, sprints, tasks = scan_nested_structure(root_dir)\n\
    \n    # 3. Create new directories\n    create_flat_directories(root_dir)\n\n \
    \   # 4. Move files with git mv\n    for track in tracks:\n        git_mv(track.path,\
    \ root_dir / \"tracks\" / f\"{track.id}.yaml\")\n    # ... sprints, tasks\n\n\
    \    # 5. Update references\n    update_yaml_references(root_dir)\n\n    # 6.\
    \ Validate\n    validate_migration(root_dir)\n\n    return MigrationResult(...)\n\
    ```\n\nCLI COMMAND:\nvibey roadmap migrate-structure --dry-run\nvibey roadmap\
    \ migrate-structure --execute\nvibey roadmap migrate-structure --rollback\n"
