  title: Update YAML loader to support flat structure
  description: "Modify yaml_loader.py to support loading from flat directory structure.\n\
    \nCHANGES REQUIRED:\n1. Add flat structure detection\n2. Update path resolution\
    \ for tracks/, sprints/, tasks/\n3. Support both nested (legacy) and flat (new)\
    \ structures during transition\n4. Update file discovery to use flat glob patterns\n\
    \nPATH CHANGES:\nOLD: .vibey/roadmap/{track_id}/track.yaml\nNEW: .vibey/roadmap/tracks/{track_id}.yaml\n\
    \nOLD: .vibey/roadmap/{track_id}/{sprint_id}/sprint.yaml\nNEW: .vibey/roadmap/sprints/{sprint_id}.yaml\n\
    \nOLD: .vibey/roadmap/{track_id}/{sprint_id}/{task_id}/task.yaml\nNEW: .vibey/roadmap/tasks/{task_id}.yaml\n\
    \nIMPLEMENTATION:\n```python\ndef detect_structure_format(roadmap_dir: Path) ->\
    \ str:\n    if (roadmap_dir / \"tracks\").exists():\n        return \"flat\"\n\
    \    return \"nested\"\n\ndef load_track(track_id: str, roadmap_dir: Path) ->\
    \ Track:\n    format = detect_structure_format(roadmap_dir)\n    if format ==\
    \ \"flat\":\n        path = roadmap_dir / \"tracks\" / f\"{track_id}.yaml\"\n\
    \    else:\n        path = roadmap_dir / track_id / \"track.yaml\"\n    return\
    \ _load_track_from_path(path)\n```\n"
