  title: Design unified completables table schema
  description: "Design the unified completables table that replaces separate roadmaps,\
    \ tracks, sprints, tasks tables.\n\nDESIGN (from 05-DATABASE-SCHEMA.md):\n```sql\n\
    CREATE TABLE completables (\n    -- Identity (ULID)\n    id TEXT PRIMARY KEY,\n\
    \    type TEXT NOT NULL CHECK (type IN ('roadmap', 'track', 'sprint', 'task',\
    \ 'artifact')),\n\n    -- Hierarchy\n    parent_id TEXT REFERENCES completables(id),\n\
    \    sequence INTEGER DEFAULT 0,\n    slug TEXT NOT NULL,\n\n    -- Core fields\n\
    \    name TEXT NOT NULL,\n    description TEXT,\n    status TEXT NOT NULL,\n\n\
    \    -- Timestamps\n    created_at TEXT NOT NULL,\n    updated_at TEXT,\n    started_at\
    \ TEXT,\n    completed_at TEXT,\n\n    -- Type-specific fields (JSON)\n    type_specific\
    \ TEXT,  -- JSON blob for type-specific fields\n\n    -- Metadata\n    metadata\
    \ TEXT\n);\n```\n\nDECISIONS NEEDED:\n1. Which fields go in main table vs type_specific\
    \ JSON?\n2. Index strategy for common queries\n3. View definitions for type-specific\
    \ access\n"
