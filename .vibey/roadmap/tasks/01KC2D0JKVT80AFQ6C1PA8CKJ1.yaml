  task_type: design
  title: Design criteria table with polymorphic targets
  description: "Design the unified criteria table that replaces blocked_by, depends_on,\
    \ deliverables, quality_gates.\n\nDESIGN (from 05-DATABASE-SCHEMA.md):\n```sql\n\
    CREATE TABLE criteria (\n    id TEXT PRIMARY KEY,\n    completable_id TEXT NOT\
    \ NULL REFERENCES completables(id),\n\n    -- Core criterion fields\n    description\
    \ TEXT NOT NULL,\n    blocks_transition_to TEXT NOT NULL CHECK (\n        blocks_transition_to\
    \ IN ('in_progress', 'completed', 'production_ready')\n    ),\n    required INTEGER\
    \ NOT NULL DEFAULT 1,\n    is_met INTEGER NOT NULL DEFAULT 0,\n\n    -- Polymorphic\
    \ target\n    target_type TEXT NOT NULL CHECK (\n        target_type IN (\n  \
    \          'completable', 'file_exists', 'threshold', 'test_passes',\n       \
    \     'manual', 'artifact', 'symbol_exists', 'command_exists'\n        )\n   \
    \ ),\n    target_config TEXT NOT NULL,  -- JSON with target-specific fields\n\n\
    \    -- Metadata\n    created_at TEXT NOT NULL,\n    evaluated_at TEXT\n);\n```\n\
    \nTARGET TYPES:\n- completable: references another completable (dependency)\n\
    - file_exists: file must exist at path\n- threshold: numeric value must meet threshold\n\
    - test_passes: test command must pass\n- manual: requires manual verification\n\
    - artifact: references artifact entity\n"
