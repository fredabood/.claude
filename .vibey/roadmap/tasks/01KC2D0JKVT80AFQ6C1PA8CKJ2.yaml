  title: Design artifacts table schema
  description: "Design the artifacts table for first-class artifact entities.\n\n\
    DESIGN (from 03-ARTIFACT-SYSTEM.md):\n```sql\nCREATE TABLE artifacts (\n    id\
    \ TEXT PRIMARY KEY,\n    name TEXT NOT NULL,\n    description TEXT,\n\n    --\
    \ File location\n    paths TEXT NOT NULL,  -- JSON array of file paths\n    content_hash\
    \ TEXT,\n    last_verified TEXT,\n\n    -- Classification\n    artifact_type TEXT\
    \ NOT NULL,\n    artifact_subtype TEXT,\n\n    -- Provenance (JSON)\n    provenance\
    \ TEXT NOT NULL,\n\n    -- Relationships\n    documents_artifact_id TEXT REFERENCES\
    \ artifacts(id),\n\n    -- State\n    exists INTEGER NOT NULL DEFAULT 1,\n   \
    \ is_stale INTEGER NOT NULL DEFAULT 0,\n\n    -- Timestamps\n    created_at TEXT\
    \ NOT NULL,\n    updated_at TEXT\n);\n\nCREATE TABLE artifact_dependencies (\n\
    \    artifact_id TEXT NOT NULL REFERENCES artifacts(id),\n    depends_on_artifact_id\
    \ TEXT NOT NULL REFERENCES artifacts(id),\n    PRIMARY KEY (artifact_id, depends_on_artifact_id)\n\
    );\n```\n\nARTIFACT TYPES:\n- code: Source code files\n- test: Test files\n- documentation:\
    \ Documentation files\n- context: Context/planning documents\n- config: Configuration\
    \ files\n- agent: Vibey agent definitions\n- workflow: Vibey workflow definitions\n\
    - template: Vibey template files\n"
