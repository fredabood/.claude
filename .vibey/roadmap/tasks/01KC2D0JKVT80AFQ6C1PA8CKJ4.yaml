  title: Update sql_loader for unified schema
  description: "Update sql_loader.py to load from unified schema (completables + criteria\
    \ tables).\n\nCHANGES REQUIRED:\n1. Load from completables table instead of separate\
    \ tables\n2. Load criteria and construct Criterion objects\n3. Return new Pydantic\
    \ models (RoadmapTicket, TrackTicket, etc.)\n4. Support both v1 and v2 schemas\
    \ during transition\n\nIMPLEMENTATION:\n```python\ndef load_task_v2(task_id: str)\
    \ -> TaskTicket:\n    conn = get_connection()\n\n    # Load from completables\n\
    \    row = conn.execute(\n        \"SELECT * FROM completables WHERE id = ? AND\
    \ type = 'task'\",\n        (task_id,)\n    ).fetchone()\n\n    # Load criteria\n\
    \    criteria_rows = conn.execute(\n        \"SELECT * FROM criteria WHERE completable_id\
    \ = ?\",\n        (task_id,)\n    ).fetchall()\n\n    criteria = [row_to_criterion(row)\
    \ for row in criteria_rows]\n\n    return TaskTicket(\n        id=row['id'],\n\
    \        name=row['name'],\n        criteria=criteria,\n        ...\n    )\n```\n"
