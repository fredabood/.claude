    \ (RoadmapTicket, TrackTicket, etc.)\n4. Support both v1 and v2 schemas during\
    \ transition\n\nIMPLEMENTATION:\n```python\ndef dump_task_v2(task: TaskTicket)\
    \ -> None:\n    conn = get_connection()\n\n    # Insert into completables\n  \
    \  conn.execute('''\n        INSERT OR REPLACE INTO completables\n        (id,\
    \ type, parent_id, name, status, ...)\n        VALUES (?, 'task', ?, ?, ?, ...)\n\
    \    ''', (task.id, task.parent_ref, task.name, task.status.value, ...))\n\n \
    \   # Insert criteria\n    for criterion in task.criteria:\n        conn.execute('''\n\
    \            INSERT OR REPLACE INTO criteria\n            (id, completable_id,\
    \ description, blocks_transition_to, target_type, target_config)\n           \
    \ VALUES (?, ?, ?, ?, ?, ?)\n        ''', (\n            criterion.id,\n     \
    \       task.id,\n            criterion.description,\n            criterion.blocks_transition_to.value,\n\
    \            get_target_type(criterion.target),\n            json.dumps(get_target_config(criterion.target))\n\
    \        ))\n\n    conn.commit()\n```\n"
