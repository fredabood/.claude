  title: Add ULID generation and validation
  description: "Implement ULID generation and validation utilities.\n\nULID FORMAT:\n\
    - 26 characters, Crockford Base32\n- First 10 chars: timestamp (48 bits)\n- Last\
    \ 16 chars: randomness (80 bits)\n- Lexicographically sortable\n- Example: 01HXYZ123ABC456DEF789GHJ\n\
    \nIMPLEMENTATION:\n```python\nimport ulid\n\ndef generate_ulid() -> str:\n   \
    \ return str(ulid.new())\n\ndef validate_ulid(value: str) -> bool:\n    try:\n\
    \        ulid.parse(value)\n        return True\n    except ValueError:\n    \
    \    return False\n\ndef ulid_timestamp(value: str) -> datetime:\n    return ulid.parse(value).timestamp().datetime\n\
    ```\n\nDEPENDENCIES:\n- python-ulid package\n\nINTEGRATION:\n- Add to vibey/roadmap/identity/__init__.py\n\
    - Use in model constructors when id not provided\n"
