  title: Create .id file format and parser
  description: "Implement .id file format for mapping slugs to ULIDs.\n\nFILE FORMAT:\n\
    ```\n# .vibey/roadmap/tracks/.id\n# Maps human-readable slugs to immutable ULIDs\n\
    sqlite-backend = 01HXYZ123ABC456DEF789GHJ\nunified-architecture-migration = 01HXYZ987ZYX654CBA321MLK\n\
    ```\n\nIMPLEMENTATION:\n```python\nclass IdFile:\n    def __init__(self, path:\
    \ Path):\n        self.path = path\n        self._mappings: Dict[str, str] = {}\n\
    \        self._load()\n\n    def get_ulid(self, slug: str) -> Optional[str]:\n\
    \        return self._mappings.get(slug)\n\n    def get_slug(self, ulid: str)\
    \ -> Optional[str]:\n        for slug, id in self._mappings.items():\n       \
    \     if id == ulid:\n                return slug\n        return None\n\n   \
    \ def register(self, slug: str, ulid: str) -> None:\n        self._mappings[slug]\
    \ = ulid\n        self._save()\n\n    def rename_slug(self, old_slug: str, new_slug:\
    \ str) -> None:\n        ulid = self._mappings.pop(old_slug)\n        self._mappings[new_slug]\
    \ = ulid\n        self._save()\n```\n\nFILE LOCATIONS:\n- .vibey/roadmap/tracks/.id\n\
    - .vibey/roadmap/sprints/.id\n- .vibey/roadmap/tasks/.id\n"
