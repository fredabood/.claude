  title: Migrate status transitions to use can_transition_to
  description: "Centralize all status transition logic to use Completable.can_transition_to().\n\
    \nCURRENT STATE:\n- Blocking checks in multiple places\n- Some transitions bypass\
    \ validation\n- Inconsistent error messages\n\nTARGET STATE:\n- ALL transitions\
    \ go through can_transition_to()\n- Single source of truth for blocking\n- Consistent\
    \ error messages with blocking reasons\n\nAFFECTED CODE:\n- status_manager.py\
    \ - auto-progression\n- update.py - manual status updates\n- Any direct status\
    \ modifications\n\nIMPLEMENTATION:\n```python\nclass TransitionBlockedError(Exception):\n\
    \    def __init__(self, ticket_id: str, target: TicketStatus, reasons: List[str]):\n\
    \        self.ticket_id = ticket_id\n        self.target = target\n        self.reasons\
    \ = reasons\n        super().__init__(\n            f\"Cannot transition {ticket_id}\
    \ to {target.value}: \"\n            + \", \".join(reasons)\n        )\n\ndef\
    \ transition_ticket(\n    ticket: HierarchicalTicket,\n    target: TicketStatus\n\
    ) -> HierarchicalTicket:\n    can, reasons = ticket.can_transition_to(target)\n\
    \    if not can:\n        raise TransitionBlockedError(ticket.id, target, reasons)\n\
    \n    if target == TicketStatus.IN_PROGRESS:\n        return ticket.start()\n\
    \    elif target == TicketStatus.COMPLETED:\n        return ticket.complete()\n\
    \    # ... etc\n```\n"
