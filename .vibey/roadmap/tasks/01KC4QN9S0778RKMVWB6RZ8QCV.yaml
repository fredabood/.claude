  roadmap_id: vibey-framework-v2
  task_type: development
  description: |
    The `update_sprint_progress` function in roadmap-update.py cannot load tasks
    for sprints when using the flat ULID directory structure. It calls
    `fs.get_tasks_path(sprint_id)` which returns .vibey/roadmap/tasks/ (the entire
    tasks directory), but `load_tasks()` doesn't filter by sprint_id.

    Need to add a `load_tasks_by_sprint_flat()` function that scans the flat tasks
    directory and returns only tasks matching the given sprint_id.
