  title: Create embedded task extraction script
  description: |
    Create a Python script that extracts embedded tasks from sprint YAML files
    to standalone task files.

    Requirements:
    - Scan all sprint files in .vibey/roadmap/sprints/*.yaml
    - For each embedded task in sprint.tasks[]:
      - Generate new ULID if task has legacy slug ID
      - Create standalone task file in tasks/{ulid}.yaml
      - Preserve all task data (status, dates, gate_info, etc.)
    - Handle legacy slug → ULID mapping
    - Create backup before modifications
    - Support dry-run mode
