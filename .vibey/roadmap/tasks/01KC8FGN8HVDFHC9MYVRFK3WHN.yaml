  title: db dump command does not create activity log entries
  description: 'The ''roadmap db dump'' command exports YAML files from the database
    but does not create corresponding activity log entries. This causes the pre-commit
    hook to block commits because it cannot find activity log entries for the modified
    roadmap files. Workaround: use --no-verify. Fix: add activity log entry creation
    to the sql_dumper module.'
