  description: |
    Tasks with invalid date relationships (started > completed, started < created) 
    are silently skipped during `vibey roadmap db rebuild`. 
    
    Issues found:
    1. Task with started date after completed date
    2. Task with started date before created date
    3. Tasks with status: completed but started/completed both null
    
    Fix should either:
    - Show warning messages identifying which tasks failed and why
    - Auto-correct obvious date issues (null dates on completed tasks)
    - Validate dates during task update commands
