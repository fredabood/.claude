  name: Implement unified pre-commit hook with triangle validation
  description: 'Build single pre-commit hook that validates across all three relationship
    edges. Four phases: 1) Collect Data - parse Task:/Completes: from message, resolve
    staged files to Artifacts, 2) Triangle Validation - check consistency between
    staged artifacts and ticket associations, 3) Completion Verification - verify
    can_transition_to(COMPLETED) for Completes: claims, 4) Persist Relationships -
    create TicketCommitLink, CommitArtifactChange, update TicketArtifactAssociation.
    Configurable modes: off|warn|prompt|strict. Source: Sprint 0 Design Decisions
    (Integrated Architecture)'
