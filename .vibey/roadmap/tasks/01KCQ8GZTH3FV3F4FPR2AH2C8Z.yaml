  task_type: infrastructure
  title: DB rebuild fails on v2 format YAML track files
  description: 'The db rebuild command uses load_track() which only supports v1 YAML
    format. When a track file uses v2 format (with format_version: v2, criteria, created_at),
    the rebuild fails with KeyError: ''progress'' or ''created''. The load_track_ticket()
    function exists and supports both formats, but db rebuild doesn''t use it. Workaround:
    convert track files to v1 format.'
