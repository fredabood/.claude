  roadmap_id: vibey-framework-v2
  task_type: development
  title: Track YAML v2 format incompatible with yaml_loader
  description: 'When CLI completes a track using ''vibey roadmap complete'', it writes
    the track file in v2 format (format_version: v2, ticket_type: track, criteria,
    parent_ref) which the yaml_loader.py cannot parse. Error: ''string indices must
    be integers''. The loader expects the old format (roadmap_id, blocked, progress
    with counts, sprints array as objects with id/name/status). Workaround: manually
    convert track file to old format.'
