  task_type: development
  title: Sprint progress not auto-updating when tasks completed via direct YAML edit
  description: |
    When tasks are completed by directly editing their YAML files (status: completed),
    the parent sprint's progress counters (tasks_completed, completion_percent) are not
    updated. This causes sprints to show incorrect progress even when all tasks are done.

    Expected: Sprint progress should be recalculated on db rebuild or have a dedicated
    command to sync progress from task statuses.

    Workaround: Manually edit sprint YAML to update progress counters.
