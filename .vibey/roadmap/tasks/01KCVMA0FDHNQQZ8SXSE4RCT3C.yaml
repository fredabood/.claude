  title: CLI roadmap complete command fails with standards validation errors
  description: |
    The `vibey roadmap complete <task-id>` command fails with various validation errors:
    - "Standards resolution failed" with _convert_v2_track_to_v1 NameError
    - "Track must complete all sprints" even when trying to complete a task
    - StandardOverride.__init__() got unexpected keyword argument 'item_id'

    This forces users to complete tasks by directly editing YAML files, which then
    causes the sprint progress tracking bug (01KCVMA0F3G5XHEG45BX363K6V).

    Expected: CLI complete command should work for tasks without requiring all
    track sprints to be complete.
