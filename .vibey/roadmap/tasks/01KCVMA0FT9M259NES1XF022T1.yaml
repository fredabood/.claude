  task_type: development
  title: Database rebuild skips 1500+ items due to validation errors
  description: 'The `vibey roadmap db rebuild` command skips most tracks, sprints,
    and tasks

    due to validation errors like "Completed tracks must have a completion date".


    Current rebuild results: 21 tracks, 59 sprints, 193 tasks

    Expected: 48+ tracks, 200+ sprints, 1600+ tasks


    This causes ~90% of roadmap data to be inaccessible via the database backend,

    forcing users to use the YAML backend for most operations.


    Root cause: Strict validation during db rebuild rejects items that were

    created before certain validation rules were added.


    Suggested fix: Either auto-repair data during rebuild (set completion dates

    from updated_at), or provide a --lenient flag to skip validation.

    '
