  task_type: development
  title: Implement submodule detection and discovery
  description: 'Implement automatic detection of git submodules with Vibey roadmaps.

    Create SubmoduleDiscovery class in vibey/operations/submodule/discovery.py:

    1) parse_gitmodules() - Parse .gitmodules file using configparser: - Extract submodule
    name, path, url for each entry - Return list of raw submodule entries

    2) validate_submodule(path) - Validate submodule is initialized: - Run git submodule
    status <path> - Check if submodule directory exists and has content - Return validation
    result with status

    3) has_vibey_roadmap(path) - Check for Vibey roadmap: - Check if <path>/.vibey/roadmap/
    exists - Read roadmap_id from <path>/.vibey/roadmap.yaml if present - Return (has_roadmap:
    bool, roadmap_id: Optional[str])

    4) discover() - Main discovery method: - Call parse_gitmodules() - For each entry,
    call validate_submodule() and has_vibey_roadmap() - Build list of SubmoduleReference
    objects for valid submodules - Write results to .vibey/config/submodules.yaml
    (per registry design) - Return list of discovered SubmoduleReference

    5) get_vibey_submodules() - Get current registry: - Read from .vibey/config/submodules.yaml
    if exists - Return list of SubmoduleReference objects

    6) refresh(path) - Refresh single submodule: - Re-validate and update entry in
    submodules.yaml

    See design doc: SUBMODULE_ISOLATION_AND_PUSHDOWN.md'
