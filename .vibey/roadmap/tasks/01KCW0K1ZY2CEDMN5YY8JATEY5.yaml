  title: Implement submodule detection and discovery
  description: 'Implement automatic detection of git submodules via .gitmodules parsing.
    Create SubmoduleDiscovery class in vibey/operations/submodule/discovery.py that:
    1) Parses .gitmodules file using configparser
    2) Validates entries with git submodule status command
    3) Identifies submodules with .vibey/roadmap directories
    4) Reads submodule roadmap IDs
    5) Builds submodule registry with paths and roadmap references
    6) Provides get_vibey_submodules() and refresh(path) methods
    Follow Sprint 1 design document specifications exactly.'
