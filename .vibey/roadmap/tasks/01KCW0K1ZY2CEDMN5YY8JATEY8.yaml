  roadmap_id: vibey-framework-v2
  task_type: development
  title: Implement progress pull-up mechanism
  description: 'Implement pull-up of progress/status from submodule to parent roadmaps.
    Create ProgressAggregator class in vibey/operations/submodule/pull.py that:
    1) Collects SubmoduleProgress from each submodule with Vibey roadmap
    2) Surfaces SubmoduleBlocker objects from submodules to parent (by severity)
    3) Computes AggregatedProgress with combined metrics across all submodules
    4) Supports collection methods (POLLING, ON_DEMAND, WEBHOOK, GIT_HOOK)
    5) Tracks staleness with configurable stale_threshold_minutes
    6) Propagates status changes (submodule completion triggers parent updates)
    7) Stores progress snapshots in .vibey/roadmap/submodule_progress/
    Follow Sprint 1 design document submodule.py specifications.'
