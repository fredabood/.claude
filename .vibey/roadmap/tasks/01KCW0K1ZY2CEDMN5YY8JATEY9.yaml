  task_type: development
  title: Implement cross-repo dependency tracking
  description: 'Implement dependency tracking across repo boundaries.
    Create CrossRepoDependencyResolver class in vibey/operations/submodule/deps.py that:
    1) Creates CrossRepoDependency objects linking tickets across repos
    2) Supports dependency types (COMPLETION, ARTIFACT, INTERFACE, MILESTONE, APPROVAL)
    3) Validates dependencies span repos correctly
    4) Detects circular dependencies spanning multiple repos
    5) Evaluates ResolutionCriteria to check if dependencies are satisfied
    6) Extends criterion system with CrossRepoCriterionTarget for cross-repo blockers
    7) Generates dependency graph visualization across repos
    8) Stores dependencies in .vibey/roadmap/cross_repo_deps/ (outgoing/incoming)
    Follow Sprint 1 design document cross_repo.py specifications.'
