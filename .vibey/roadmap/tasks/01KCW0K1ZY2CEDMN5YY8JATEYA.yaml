  task_type: development
  title: Add CLI commands for submodule management
  description: 'Implement all 16 CLI commands in vibey/cli/submodule.py per design
    decisions:

    DISCOVERY & REGISTRY (3 commands): 1) vibey submodule list - list all detected
    submodules with Vibey status 2) vibey submodule discover - auto-discover from
    .gitmodules, write to config 3) vibey submodule show <path> - show details for
    specific submodule

    PUSH-DOWN with Direct Write (4 commands): 4) vibey submodule push <submodule_path>
    --title --description --mode [linked|parent_only|submodule_only] - linked (default):
    creates task in BOTH parent and submodule, stores ULID mapping - parent_only:
    creates external dependency in parent only - submodule_only: creates task in submodule
    only 5) vibey submodule requirements --direction [outgoing] --status 6) vibey
    submodule link <parent_task_id> <submodule_task_id> - manually link existing tasks
    7) vibey submodule unlink <parent_task_id> - remove link to submodule task

    PULL-UP / AGGREGATION (4 commands): 8) vibey submodule status - show aggregated
    progress across all submodules 9) vibey submodule aggregate - pull progress from
    all submodules, update blocked_by statuses 10) vibey submodule blockers --severity
    [critical|high|medium|low] 11) vibey submodule refresh <path> - force refresh
    single submodule progress

    CROSS-REPO DEPENDENCIES (4 commands): 12) vibey submodule add-dep <ticket_id>
    <submodule:task_ref> --type --blocking 13) vibey submodule deps <ticket_id> --direction
    [outgoing|incoming|both] 14) vibey submodule validate-deps - check for cycles
    and missing targets 15) vibey submodule dep-graph - visualize cross-repo dependency
    graph

    CONFIG (1 command): 16) vibey submodule config - edit .vibey/config/submodules.yaml
    settings

    Register submodule command group in vibey/cli/main.py. See design doc: SUBMODULE_ISOLATION_AND_PUSHDOWN.md'
