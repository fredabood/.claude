  name: Create UNIFIED_ADAPTER_ARCHITECTURE.md design document
  description: |
    Create comprehensive design document for the unified adapter architecture that makes
    Vibey just another adapter on equal footing with Jira, GitHub, Trello, and Asana.

    Implementation steps:
    1. Document current architecture pain points (tight coupling, Vibey-specific semantics)
    2. Design Generic Ticket model with HierarchyType enum (PROJECT, WORKSTREAM, ITERATION, WORK_ITEM)
    3. Design TicketAdapter ABC with read/write/sync operations
    4. Design TicketService as CLI/MCP interface
    5. Outline VibeyAdapter implementation that uses existing YAML+SQLite storage
    6. Create field mapping reference table (Vibey↔Jira↔GitHub↔Trello↔Asana)
    7. Define migration path with phased sprint structure

    Deliverables:
    - .vibey/roadmap/context/tracks/pm-tool-integrations/design/UNIFIED_ADAPTER_ARCHITECTURE.md
