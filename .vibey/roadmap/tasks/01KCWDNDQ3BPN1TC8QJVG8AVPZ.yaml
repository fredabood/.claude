  name: Write ADR for generic ticket model
  description: |
    Create ADR-0006 documenting the decision to introduce a generic Ticket model as the
    core abstraction for all PM tool integrations.

    Implementation steps:
    1. Document the context: CLI/MCP tightly coupled to Vibey-specific models
    2. Document the decision: Generic Ticket with HierarchyType enum
    3. Explain why HierarchyType uses generic terms (PROJECT, WORKSTREAM, ITERATION, WORK_ITEM)
    4. Document consequences: Vibey becomes an adapter, not the core
    5. Document alternatives considered: extending existing models, separate models per tool
    6. Reference UNIFIED_ADAPTER_ARCHITECTURE.md for implementation details

    Deliverables:
    - docs/architecture/adr/0006-generic-ticket-model.md

    Dependencies:
    - Requires: 01KCWDNDQ3BPN1TC8QJVG8AVPY (design document)
