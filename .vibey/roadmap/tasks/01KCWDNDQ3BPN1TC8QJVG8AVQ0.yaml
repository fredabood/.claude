  name: Write ADR for adapter pattern
  description: |
    Create ADR-0007 documenting the decision to use the adapter pattern for PM tool
    integrations, making Vibey just another adapter.

    Implementation steps:
    1. Document the context: Need to support multiple PM tools without coupling CLI/MCP
    2. Document the decision: TicketAdapter ABC with concrete implementations per tool
    3. Explain the key insight: Vibey semantics move into VibeyAdapter
    4. Document the adapter interface (read/write/sync operations)
    5. Document the registry pattern for adapter discovery
    6. Document consequences: Clean separation, testability, extensibility
    7. Reference existing PlatformAdapter pattern in vibey/adapters/base.py

    Deliverables:
    - docs/architecture/adr/0007-pm-adapter-pattern.md

    Dependencies:
    - Requires: 01KCWDNDQ3BPN1TC8QJVG8AVPY (design document)
    - Requires: 01KCWDNDQ3BPN1TC8QJVG8AVPZ (generic ticket ADR)
