  title: Create vibey/core/ticket.py with generic Ticket model
  description: "Create the foundational Generic Ticket model that serves as the core\
    \ abstraction\nfor all PM tool integrations. This model is tool-agnostic and uses\
    \ generic terms.\n\nImplementation steps:\n1. Create vibey/core/ directory with\
    \ __init__.py\n2. Create HierarchyType enum: PROJECT, WORKSTREAM, ITERATION, WORK_ITEM\n\
    3. Create TicketStatus enum: NOT_STARTED, IN_PROGRESS, BLOCKED, COMPLETED, CANCELLED\n\
    4. Create Ticket Pydantic model with fields:\n   - Identity: id, external_id,\
    \ source_adapter\n   - Classification: hierarchy_type, item_type\n   - Content:\
    \ name, description\n   - Hierarchy: parent_id, children_ids\n   - Status: status,\
    \ blocked, blocked_reason\n   - Timestamps: created_at, updated_at, started_at,\
    \ completed_at\n   - Assignment: assignee, labels, priority\n   - Progress: children_total,\
    \ children_completed, completion_percent\n   - Criteria: criteria list (from Unified\
    \ Ticket Architecture)\n   - Metadata: metadata dict for adapter-specific data\n\
    5. Add docstrings explaining the generic nature and mapping concepts\n6. Export\
    \ all models from vibey/core/__init__.py\n\nDeliverables:\n- vibey/core/__init__.py\n\
    - vibey/core/ticket.py\n\nReference: UNIFIED_ADAPTER_ARCHITECTURE.md Part 3.1\n"
