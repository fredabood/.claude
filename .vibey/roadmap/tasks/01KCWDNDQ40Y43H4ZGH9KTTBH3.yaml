task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBH3
  name: Create vibey/adapters/pm/types.py with SyncResult, PMCapabilities
  description: |
    Create supporting types for the PM adapter system including sync results,
    capabilities declarations, and conflict resolution types.

    Implementation steps:
    1. Create SyncResult Pydantic model:
       - success: bool
       - direction: SyncDirection
       - items_imported, items_exported, items_updated: int
       - conflicts: List[Dict[str, Any]]
       - errors: List[str]
       - started_at, completed_at: datetime
    2. Create PMCapabilities dataclass/model:
       - supported_hierarchy_types: List[HierarchyType]
       - supports_sprints: bool
       - supports_bidirectional_sync: bool
       - supports_webhooks: bool
       - supports_attachments: bool
       - supports_comments: bool
       - max_description_length: Optional[int]
    3. Create ConflictResolution enum: LOCAL_WINS, REMOTE_WINS, MANUAL, MERGE
    4. Create SyncConflict model for conflict details
    5. Export all types from vibey/adapters/pm/__init__.py

    Deliverables:
    - vibey/adapters/pm/types.py (updated __init__.py)

    Dependencies:
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH1 (Generic Ticket model)
