task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBH4
  name: Create vibey/adapters/pm/registry.py with PMAdapterRegistry
  description: |
    Create the registry pattern for discovering and managing PM tool adapters.
    Mirrors the existing AdapterRegistry in vibey/adapters/registry.py.

    Implementation steps:
    1. Create PMAdapterRegistry class:
       - _adapters: Dict[str, Type[TicketAdapter]] class variable
       - _default_adapter: Optional[str] class variable
       - register(name, adapter_class) class method
       - unregister(name) class method
       - get(name) -> TicketAdapter class method
       - get_default() -> TicketAdapter class method
       - set_default(name) class method
       - list_adapters() -> List[str] class method
       - get_capabilities(name) -> PMCapabilities class method
    2. Add @pm_adapter decorator for auto-registration
    3. Implement lazy loading for adapter classes
    4. Add configuration support for default adapter selection
    5. Handle adapter not found errors gracefully

    Deliverables:
    - vibey/adapters/pm/registry.py

    Dependencies:
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH2 (TicketAdapter ABC)
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH3 (PMCapabilities type)

    Reference: vibey/adapters/registry.py (existing pattern)
