  title: Create vibey/adapters/pm/registry.py with PMAdapterRegistry
  description: "Create the registry pattern for discovering and managing PM tool adapters.\n\
    Mirrors the existing AdapterRegistry in vibey/adapters/registry.py.\n\nImplementation\
    \ steps:\n1. Create PMAdapterRegistry class:\n   - _adapters: Dict[str, Type[TicketAdapter]]\
    \ class variable\n   - _default_adapter: Optional[str] class variable\n   - register(name,\
    \ adapter_class) class method\n   - unregister(name) class method\n   - get(name)\
    \ -> TicketAdapter class method\n   - get_default() -> TicketAdapter class method\n\
    \   - set_default(name) class method\n   - list_adapters() -> List[str] class\
    \ method\n   - get_capabilities(name) -> PMCapabilities class method\n2. Add @pm_adapter\
    \ decorator for auto-registration\n3. Implement lazy loading for adapter classes\n\
    4. Add configuration support for default adapter selection\n5. Handle adapter\
    \ not found errors gracefully\n\nDeliverables:\n- vibey/adapters/pm/registry.py\n\
    \nDependencies:\n- Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH2 (TicketAdapter ABC)\n\
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH3 (PMCapabilities type)\n\nReference: vibey/adapters/registry.py\
    \ (existing pattern)\n"
