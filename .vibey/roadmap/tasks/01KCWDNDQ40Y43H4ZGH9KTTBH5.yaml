  title: Create vibey/services/ticket_service.py with TicketService
  description: "Create the service layer that CLI and MCP will use for all ticket\
    \ operations.\nThis is the adapter-agnostic interface that enables swapping PM\
    \ tools.\n\nImplementation steps:\n1. Create vibey/services/ directory with __init__.py\n\
    2. Create TicketService class:\n   - __init__(adapter: Optional[TicketAdapter]\
    \ = None) - uses default if none\n   - adapter_name property\n   - set_adapter(adapter)\
    \ method for switching adapters\n   - Read operations: list_projects, get_ticket,\
    \ list_children,\n     get_workstreams, get_iterations, get_work_items, search\n\
    \   - Write operations: create, update, delete\n   - Convenience methods: start,\
    \ complete, block (common operations)\n   - Sync operations: sync, detect_conflicts\n\
    3. Add proper type hints for all methods\n4. Implement error handling with custom\
    \ exceptions\n5. Add logging for operations\n6. Export from vibey/services/__init__.py\n\
    \nDeliverables:\n- vibey/services/__init__.py\n- vibey/services/ticket_service.py\n\
    \nDependencies:\n- Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH2 (TicketAdapter ABC)\n\
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH4 (PMAdapterRegistry)\n\nReference: UNIFIED_ADAPTER_ARCHITECTURE.md\
    \ Part 3.3\n"
