task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBH5
  name: Create vibey/services/ticket_service.py with TicketService
  description: |
    Create the service layer that CLI and MCP will use for all ticket operations.
    This is the adapter-agnostic interface that enables swapping PM tools.

    Implementation steps:
    1. Create vibey/services/ directory with __init__.py
    2. Create TicketService class:
       - __init__(adapter: Optional[TicketAdapter] = None) - uses default if none
       - adapter_name property
       - set_adapter(adapter) method for switching adapters
       - Read operations: list_projects, get_ticket, list_children,
         get_workstreams, get_iterations, get_work_items, search
       - Write operations: create, update, delete
       - Convenience methods: start, complete, block (common operations)
       - Sync operations: sync, detect_conflicts
    3. Add proper type hints for all methods
    4. Implement error handling with custom exceptions
    5. Add logging for operations
    6. Export from vibey/services/__init__.py

    Deliverables:
    - vibey/services/__init__.py
    - vibey/services/ticket_service.py

    Dependencies:
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH2 (TicketAdapter ABC)
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH4 (PMAdapterRegistry)

    Reference: UNIFIED_ADAPTER_ARCHITECTURE.md Part 3.3
