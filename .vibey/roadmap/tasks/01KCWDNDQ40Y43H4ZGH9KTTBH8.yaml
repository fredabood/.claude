task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBH8
  name: Create vibey/adapters/pm/vibey/adapter.py
  description: |
    Create the VibeyAdapter class that implements TicketAdapter for Vibey's native
    YAML + SQLite roadmap system. This extracts Vibey-specific semantics into an adapter.

    Implementation steps:
    1. Create vibey/adapters/pm/vibey/ directory with __init__.py
    2. Create VibeyAdapter class extending TicketAdapter:
       - __init__(vibey_dir: Optional[Path] = None)
       - Store _vibey_dir and _roadmap_dir paths
    3. Implement identity properties:
       - adapter_name -> "vibey"
       - display_name -> "Vibey Roadmap"
    4. Implement capability properties:
       - supports_sprints -> True
       - supports_bidirectional_sync -> True (can sync with other adapters)
    5. Add class docstring explaining Vibey hierarchy mapping:
       - Roadmap → PROJECT
       - Track → WORKSTREAM
       - Sprint → ITERATION
       - Task → WORK_ITEM
    6. Register with PMAdapterRegistry using @pm_adapter decorator

    Deliverables:
    - vibey/adapters/pm/vibey/__init__.py
    - vibey/adapters/pm/vibey/adapter.py (class skeleton)

    Dependencies:
    - Requires: Sprint 1 complete (TicketAdapter ABC, registry)

    Reference: UNIFIED_ADAPTER_ARCHITECTURE.md Part 4
