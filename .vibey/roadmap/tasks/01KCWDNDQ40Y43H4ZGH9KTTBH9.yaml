task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBH9
  name: Implement map_to_generic for Roadmap/Track/Sprint/Task
  description: |
    Implement the map_to_generic method in VibeyAdapter to convert Vibey models
    to generic Ticket objects. This is the Vibey→Generic direction.

    Implementation steps:
    1. Implement map_to_generic(native_item: Any) -> Ticket dispatcher:
       - Detect type: Roadmap, Track, Sprint, Task
       - Route to appropriate private method
    2. Implement _roadmap_to_ticket(roadmap) -> Ticket:
       - hierarchy_type = PROJECT
       - item_type = "roadmap"
       - Map name, description, status
       - Map progress fields (tracks_total, tracks_completed)
    3. Implement _track_to_ticket(track) -> Ticket:
       - hierarchy_type = WORKSTREAM
       - item_type = "track"
       - parent_id = roadmap_id
       - Map priority, status, progress
    4. Implement _sprint_to_ticket(sprint) -> Ticket:
       - hierarchy_type = ITERATION
       - item_type = "sprint"
       - parent_id = track_id
       - Map blocked, blocked_reason, timestamps
    5. Implement _task_to_ticket(task) -> Ticket:
       - hierarchy_type = WORK_ITEM
       - item_type = task_type (development, testing, etc.)
       - parent_id = sprint_id
       - Map complexity, estimated_tokens to metadata
    6. Implement _map_status(status) -> TicketStatus helper

    Deliverables:
    - Updated vibey/adapters/pm/vibey/adapter.py with mapping methods

    Dependencies:
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH8 (VibeyAdapter skeleton)

    Reference: UNIFIED_ADAPTER_ARCHITECTURE.md Part 4.1, existing ModelAdapter
