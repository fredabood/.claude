  title: Implement map_from_generic for all entity types
  description: "Implement the map_from_generic method in VibeyAdapter to convert generic\
    \ Ticket\nobjects back to Vibey models. This is the Generic→Vibey direction.\n\
    \nImplementation steps:\n1. Implement map_from_generic(ticket: Ticket) -> Any\
    \ dispatcher:\n   - Check ticket.hierarchy_type\n   - Route to appropriate private\
    \ method\n2. Implement _ticket_to_roadmap(ticket) -> Roadmap:\n   - Requires hierarchy_type\
    \ == PROJECT\n   - Map back to Vibey Roadmap dataclass\n   - Handle missing optional\
    \ fields with defaults\n3. Implement _ticket_to_track(ticket) -> Track:\n   -\
    \ Requires hierarchy_type == WORKSTREAM\n   - Map parent_id to roadmap_id\n  \
    \ - Map priority, status\n4. Implement _ticket_to_sprint(ticket) -> Sprint:\n\
    \   - Requires hierarchy_type == ITERATION\n   - Map parent_id to track_id\n \
    \  - Map blocked, blocked_reason, timestamps\n5. Implement _ticket_to_task(ticket)\
    \ -> Task:\n   - Requires hierarchy_type == WORK_ITEM\n   - Map parent_id to sprint_id\n\
    \   - Extract complexity, estimated_tokens from metadata\n6. Implement _map_status_reverse(status:\
    \ TicketStatus) -> str helper\n\nDeliverables:\n- Updated vibey/adapters/pm/vibey/adapter.py\
    \ with reverse mapping\n\nDependencies:\n- Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH9\
    \ (forward mapping)\n\nNote: This enables creating Vibey entities from generic\
    \ tickets (e.g., imported from Jira)\n"
