task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBHA
  name: Implement map_from_generic for all entity types
  description: |
    Implement the map_from_generic method in VibeyAdapter to convert generic Ticket
    objects back to Vibey models. This is the Generic→Vibey direction.

    Implementation steps:
    1. Implement map_from_generic(ticket: Ticket) -> Any dispatcher:
       - Check ticket.hierarchy_type
       - Route to appropriate private method
    2. Implement _ticket_to_roadmap(ticket) -> Roadmap:
       - Requires hierarchy_type == PROJECT
       - Map back to Vibey Roadmap dataclass
       - Handle missing optional fields with defaults
    3. Implement _ticket_to_track(ticket) -> Track:
       - Requires hierarchy_type == WORKSTREAM
       - Map parent_id to roadmap_id
       - Map priority, status
    4. Implement _ticket_to_sprint(ticket) -> Sprint:
       - Requires hierarchy_type == ITERATION
       - Map parent_id to track_id
       - Map blocked, blocked_reason, timestamps
    5. Implement _ticket_to_task(ticket) -> Task:
       - Requires hierarchy_type == WORK_ITEM
       - Map parent_id to sprint_id
       - Extract complexity, estimated_tokens from metadata
    6. Implement _map_status_reverse(status: TicketStatus) -> str helper

    Deliverables:
    - Updated vibey/adapters/pm/vibey/adapter.py with reverse mapping

    Dependencies:
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH9 (forward mapping)

    Note: This enables creating Vibey entities from generic tickets (e.g., imported from Jira)
