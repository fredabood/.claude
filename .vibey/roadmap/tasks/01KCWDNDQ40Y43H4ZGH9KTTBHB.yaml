  title: Implement read operations (list_projects, get_ticket, etc.)
  description: "Implement all TicketAdapter read operations in VibeyAdapter using\
    \ existing\nYAML loader and SQLite database.\n\nImplementation steps:\n1. Implement\
    \ list_projects() -> List[Ticket]:\n   - Load roadmap from .vibey/roadmap/roadmap.yaml\n\
    \   - Convert to Ticket using map_to_generic\n   - Return as single-item list\
    \ (Vibey has one roadmap per project)\n2. Implement get_ticket(ticket_id: str)\
    \ -> Optional[Ticket]:\n   - Query SQLite by ID to determine entity type\n   -\
    \ Load appropriate YAML file (tracks/, sprints/, tasks/)\n   - Convert to Ticket\n\
    \   - Return None if not found\n3. Implement list_children(parent_id: str) ->\
    \ List[Ticket]:\n   - Query SQLite for children of parent_id\n   - Load each child\
    \ YAML\n   - Convert all to Tickets\n4. Implement search_tickets(...) -> List[Ticket]:\n\
    \   - Build SQLite query from parameters\n   - Support filtering by: query (name/description),\
    \ hierarchy_type,\n     status, assignee, labels\n   - Convert results to Tickets\n\
    5. Use existing yaml_loader functions for YAML parsing\n6. Add caching layer for\
    \ frequently accessed data (optional)\n\nDeliverables:\n- Updated vibey/adapters/pm/vibey/adapter.py\
    \ with read operations\n\nDependencies:\n- Requires: 01KCWDNDQ40Y43H4ZGH9KTTBH9\
    \ (map_to_generic)\n\nReference: vibey/roadmap/serialization/yaml_loader.py\n"
