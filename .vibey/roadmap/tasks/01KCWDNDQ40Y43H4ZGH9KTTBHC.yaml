  title: Implement write operations (create, update, delete)
  description: "Implement all TicketAdapter write operations in VibeyAdapter using\
    \ existing\nYAML dumper and ensuring database sync.\n\nImplementation steps:\n\
    1. Implement create_ticket(ticket: Ticket) -> Ticket:\n   - Convert from generic\
    \ using map_from_generic\n   - Generate ULID if no ID provided\n   - Write YAML\
    \ file to appropriate directory\n   - Update SQLite database\n   - Return created\
    \ ticket with ID\n2. Implement update_ticket(ticket: Ticket) -> Ticket:\n   -\
    \ Load existing entity\n   - Apply changes from ticket\n   - Write updated YAML\n\
    \   - Update SQLite database\n   - Return updated ticket\n3. Implement update_status(ticket_id:\
    \ str, status: TicketStatus) -> Ticket:\n   - Load entity by ID\n   - Update status\
    \ field\n   - Update timestamps (started_at, completed_at as appropriate)\n  \
    \ - Write YAML and update database\n   - Return updated ticket\n4. Implement delete_ticket(ticket_id:\
    \ str) -> bool:\n   - Verify entity exists\n   - Check for children (prevent delete\
    \ if has children?)\n   - Remove YAML file\n   - Remove from SQLite database\n\
    \   - Return success\n5. Use existing yaml_dumper functions\n6. Ensure atomic\
    \ operations (rollback on failure)\n\nDeliverables:\n- Updated vibey/adapters/pm/vibey/adapter.py\
    \ with write operations\n\nDependencies:\n- Requires: 01KCWDNDQ40Y43H4ZGH9KTTBHA\
    \ (map_from_generic)\n- Requires: 01KCWDNDQ40Y43H4ZGH9KTTBHB (read operations\
    \ for validation)\n\nReference: vibey/roadmap/serialization/yaml_dumper.py\n"
