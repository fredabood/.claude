task:
  id: 01KCWDNDQ40Y43H4ZGH9KTTBHC
  name: Implement write operations (create, update, delete)
  description: |
    Implement all TicketAdapter write operations in VibeyAdapter using existing
    YAML dumper and ensuring database sync.

    Implementation steps:
    1. Implement create_ticket(ticket: Ticket) -> Ticket:
       - Convert from generic using map_from_generic
       - Generate ULID if no ID provided
       - Write YAML file to appropriate directory
       - Update SQLite database
       - Return created ticket with ID
    2. Implement update_ticket(ticket: Ticket) -> Ticket:
       - Load existing entity
       - Apply changes from ticket
       - Write updated YAML
       - Update SQLite database
       - Return updated ticket
    3. Implement update_status(ticket_id: str, status: TicketStatus) -> Ticket:
       - Load entity by ID
       - Update status field
       - Update timestamps (started_at, completed_at as appropriate)
       - Write YAML and update database
       - Return updated ticket
    4. Implement delete_ticket(ticket_id: str) -> bool:
       - Verify entity exists
       - Check for children (prevent delete if has children?)
       - Remove YAML file
       - Remove from SQLite database
       - Return success
    5. Use existing yaml_dumper functions
    6. Ensure atomic operations (rollback on failure)

    Deliverables:
    - Updated vibey/adapters/pm/vibey/adapter.py with write operations

    Dependencies:
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBHA (map_from_generic)
    - Requires: 01KCWDNDQ40Y43H4ZGH9KTTBHB (read operations for validation)

    Reference: vibey/roadmap/serialization/yaml_dumper.py
