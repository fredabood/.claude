task:
  id: 01KCWDNDQ5MGHF8E9MEM2737T1
  name: Refactor roadmap start/complete commands
  description: |
    Refactor `vibey roadmap start` and `vibey roadmap complete` commands to use
    TicketService while maintaining identical behavior.

    Implementation steps:
    1. Refactor roadmap start command:
       - Replace direct status update with service.start(ticket_id)
       - TicketService handles timestamp updates automatically
       - Maintain validation (can't start completed task)
    2. Refactor roadmap complete command:
       - Replace direct status update with service.complete(ticket_id)
       - Service handles completed_at timestamp
       - Maintain parent status propagation logic
    3. Update both commands:
       - Use get_ticket to validate ID exists
       - Use generic Ticket for display
       - Add --adapter flag support
    4. Handle edge cases:
       - Starting already-in-progress task
       - Completing not-started task
       - Completing blocked task
    5. Remove direct model imports
    6. Test status transitions work correctly

    Deliverables:
    - Updated roadmap_start and roadmap_complete in commands.py
    - Tests for status transitions

    Dependencies:
    - Requires: 01KCWDNDQ5MGHF8E9MEM2737T0 (status command refactored)
