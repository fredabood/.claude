task:
  id: 01KCWDNDQ5MGHF8E9MEM2737T5
  name: Implement Atlassian OAuth 2.0 authentication
  description: |
    Implement OAuth 2.0 (3LO) authentication flow for Atlassian Cloud products
    (Jira and Confluence).

    Implementation steps:
    1. Create vibey/adapters/pm/atlassian/ directory with __init__.py
    2. Create vibey/adapters/pm/atlassian/auth.py:
       - AtlassianOAuth class for OAuth 2.0 flow
       - generate_authorization_url() for user consent
       - exchange_code_for_tokens(code) for token exchange
       - refresh_access_token() for token refresh
       - get_accessible_resources() to list sites
    3. Implement token storage:
       - Store tokens in .vibey/config/atlassian_credentials.json
       - Encrypt sensitive data at rest
       - Handle token expiration and refresh
    4. Create CLI commands for auth:
       - vibey auth atlassian login
       - vibey auth atlassian logout
       - vibey auth atlassian status
    5. Handle scopes:
       - read:jira-work, write:jira-work
       - read:sprint:jira-software, write:sprint:jira-software
       - read:me, offline_access
    6. Add error handling for common OAuth failures

    Deliverables:
    - vibey/adapters/pm/atlassian/__init__.py
    - vibey/adapters/pm/atlassian/auth.py
    - CLI auth commands

    Dependencies:
    - Requires: Sprint 3 complete (CLI using TicketService)

    Reference: https://developer.atlassian.com/cloud/jira/platform/oauth-2-3lo-apps/
