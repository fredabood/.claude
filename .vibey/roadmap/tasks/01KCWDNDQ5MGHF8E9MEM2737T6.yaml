  title: Create Jira REST API client
  description: "Create a typed Python client for Jira Cloud REST API v3 with automatic\n\
    authentication and error handling.\n\nImplementation steps:\n1. Create vibey/adapters/pm/atlassian/jira_client.py:\n\
    \   - JiraClient class with httpx async client\n   - __init__(auth: AtlassianOAuth,\
    \ cloud_id: str)\n   - Automatic token refresh on 401\n2. Implement project operations:\n\
    \   - get_projects() -> List[JiraProject]\n   - get_project(key: str) -> JiraProject\n\
    3. Implement sprint operations (Jira Software):\n   - get_boards() -> List[JiraBoard]\n\
    \   - get_sprints(board_id: int) -> List[JiraSprint]\n   - get_sprint(sprint_id:\
    \ int) -> JiraSprint\n4. Implement issue operations:\n   - get_issues(jql: str)\
    \ -> List[JiraIssue]\n   - get_issue(key: str) -> JiraIssue\n   - create_issue(data:\
    \ dict) -> JiraIssue\n   - update_issue(key: str, data: dict) -> JiraIssue\n \
    \  - transition_issue(key: str, transition_id: str)\n5. Create Pydantic models\
    \ for Jira entities:\n   - JiraProject, JiraBoard, JiraSprint, JiraIssue\n   -\
    \ JiraStatus, JiraPriority, JiraIssueType\n6. Add rate limiting and retry logic\n\
    7. Add pagination support for large result sets\n\nDeliverables:\n- vibey/adapters/pm/atlassian/jira_client.py\n\
    - vibey/adapters/pm/atlassian/jira_models.py\n\nDependencies:\n- Requires: 01KCWDNDQ5MGHF8E9MEM2737T5\
    \ (OAuth authentication)\n\nReference: https://developer.atlassian.com/cloud/jira/platform/rest/v3/\n"
