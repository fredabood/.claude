task:
  id: 01KCWDNDQ5MGHF8E9MEM2737T7
  name: Implement JiraAdapter class
  description: |
    Create the JiraAdapter that implements TicketAdapter for Jira Cloud,
    using the Jira REST client and field mapping.

    Implementation steps:
    1. Create vibey/adapters/pm/jira/adapter.py:
       - JiraAdapter extending TicketAdapter
       - __init__(client: JiraClient)
    2. Implement identity properties:
       - adapter_name -> "jira"
       - display_name -> "Jira Cloud"
    3. Implement capability properties:
       - supports_sprints -> True (with Jira Software)
       - supports_bidirectional_sync -> True
       - supports_webhooks -> True
    4. Implement read operations:
       - list_projects() -> convert JiraProjects to Tickets
       - get_ticket(key) -> convert JiraIssue to Ticket
       - list_children(key) -> issues in sprint/project
       - search_tickets(jql) -> JQL query support
    5. Implement write operations:
       - create_ticket() -> create Jira issue
       - update_ticket() -> update Jira issue
       - update_status() -> transition issue
       - delete_ticket() -> delete issue (if permitted)
    6. Register with @pm_adapter decorator

    Deliverables:
    - vibey/adapters/pm/jira/__init__.py
    - vibey/adapters/pm/jira/adapter.py

    Dependencies:
    - Requires: 01KCWDNDQ5MGHF8E9MEM2737T6 (Jira REST client)
    - Requires: 01KCWDNDQ5MGHF8E9MEM2737T8 (field mapping)
