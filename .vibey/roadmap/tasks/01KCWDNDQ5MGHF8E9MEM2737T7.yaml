  title: Implement JiraAdapter class
  description: "Create the JiraAdapter that implements TicketAdapter for Jira Cloud,\n\
    using the Jira REST client and field mapping.\n\nImplementation steps:\n1. Create\
    \ vibey/adapters/pm/jira/adapter.py:\n   - JiraAdapter extending TicketAdapter\n\
    \   - __init__(client: JiraClient)\n2. Implement identity properties:\n   - adapter_name\
    \ -> \"jira\"\n   - display_name -> \"Jira Cloud\"\n3. Implement capability properties:\n\
    \   - supports_sprints -> True (with Jira Software)\n   - supports_bidirectional_sync\
    \ -> True\n   - supports_webhooks -> True\n4. Implement read operations:\n   -\
    \ list_projects() -> convert JiraProjects to Tickets\n   - get_ticket(key) ->\
    \ convert JiraIssue to Ticket\n   - list_children(key) -> issues in sprint/project\n\
    \   - search_tickets(jql) -> JQL query support\n5. Implement write operations:\n\
    \   - create_ticket() -> create Jira issue\n   - update_ticket() -> update Jira\
    \ issue\n   - update_status() -> transition issue\n   - delete_ticket() -> delete\
    \ issue (if permitted)\n6. Register with @pm_adapter decorator\n\nDeliverables:\n\
    - vibey/adapters/pm/jira/__init__.py\n- vibey/adapters/pm/jira/adapter.py\n\n\
    Dependencies:\n- Requires: 01KCWDNDQ5MGHF8E9MEM2737T6 (Jira REST client)\n- Requires:\
    \ 01KCWDNDQ5MGHF8E9MEM2737T8 (field mapping)\n"
