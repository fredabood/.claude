  title: Implement Jira field mapping (issue types, statuses, priorities)
  description: "Create configurable mapping between Jira fields and generic Ticket\
    \ fields,\nhandling the semantic differences between systems.\n\nImplementation\
    \ steps:\n1. Create vibey/adapters/pm/jira/mapping.py:\n   - JiraFieldMapper class\n\
    \   - Configurable mapping tables\n2. Implement hierarchy type mapping:\n   -\
    \ Epic → WORKSTREAM\n   - Sprint → ITERATION\n   - Story/Task/Bug/etc. → WORK_ITEM\n\
    \   - Project → PROJECT\n3. Implement status mapping:\n   - \"To Do\", \"Open\"\
    , \"Backlog\" → NOT_STARTED\n   - \"In Progress\", \"In Review\" → IN_PROGRESS\n\
    \   - \"Done\", \"Closed\", \"Resolved\" → COMPLETED\n   - \"Blocked\" → BLOCKED\n\
    \   - Handle custom statuses via configuration\n4. Implement priority mapping:\n\
    \   - Highest/Blocker → critical\n   - High → high\n   - Medium → medium\n   -\
    \ Low/Lowest → low\n5. Implement issue type mapping:\n   - Bug → task_type: bug\n\
    \   - Story → task_type: development\n   - Task → task_type: development\n   -\
    \ Epic → handled at hierarchy level\n6. Make mapping configurable per project\n\
    7. Support custom field mapping\n\nDeliverables:\n- vibey/adapters/pm/jira/mapping.py\n\
    - Default mapping configuration\n\nDependencies:\n- Requires: 01KCWDNDQ5MGHF8E9MEM2737T6\
    \ (Jira client for fetching metadata)\n"
