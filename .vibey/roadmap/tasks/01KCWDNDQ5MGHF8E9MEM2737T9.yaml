task:
  id: 01KCWDNDQ5MGHF8E9MEM2737T9
  name: Implement import operations (project→track, sprint→sprint, issue→task)
  description: |
    Implement one-way import from Jira to Vibey, converting Jira entities to
    generic Tickets that can be stored locally.

    Implementation steps:
    1. Implement sync() method in JiraAdapter for IMPORT direction:
       - Fetch all projects user has access to
       - For each project, fetch sprints and issues
       - Convert to generic Tickets using map_to_generic
    2. Implement import CLI command:
       - vibey import jira --project KEY
       - vibey import jira --board BOARD_ID
       - vibey import jira --sprint SPRINT_ID
    3. Handle hierarchy construction:
       - Import Project as PROJECT ticket
       - Import Epics as WORKSTREAM tickets
       - Import Sprints as ITERATION tickets
       - Import Issues as WORK_ITEM tickets
    4. Preserve relationships:
       - Issue → Sprint relationship (parent_id)
       - Epic → Issue relationship
       - Subtask relationships
    5. Store external_id mapping:
       - Map Jira issue keys to local ticket IDs
       - Store in .vibey/sync/jira_mapping.json
    6. Handle incremental imports:
       - Track last import timestamp
       - Only fetch updated issues on subsequent imports

    Deliverables:
    - Import functionality in JiraAdapter
    - CLI import commands
    - ID mapping storage

    Dependencies:
    - Requires: 01KCWDNDQ5MGHF8E9MEM2737T7 (JiraAdapter)
