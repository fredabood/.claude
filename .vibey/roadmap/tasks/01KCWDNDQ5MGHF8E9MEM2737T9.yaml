  title: Implement import operations (project→track, sprint→sprint, issue→task)
  description: "Implement one-way import from Jira to Vibey, converting Jira entities\
    \ to\ngeneric Tickets that can be stored locally.\n\nImplementation steps:\n1.\
    \ Implement sync() method in JiraAdapter for IMPORT direction:\n   - Fetch all\
    \ projects user has access to\n   - For each project, fetch sprints and issues\n\
    \   - Convert to generic Tickets using map_to_generic\n2. Implement import CLI\
    \ command:\n   - vibey import jira --project KEY\n   - vibey import jira --board\
    \ BOARD_ID\n   - vibey import jira --sprint SPRINT_ID\n3. Handle hierarchy construction:\n\
    \   - Import Project as PROJECT ticket\n   - Import Epics as WORKSTREAM tickets\n\
    \   - Import Sprints as ITERATION tickets\n   - Import Issues as WORK_ITEM tickets\n\
    4. Preserve relationships:\n   - Issue → Sprint relationship (parent_id)\n   -\
    \ Epic → Issue relationship\n   - Subtask relationships\n5. Store external_id\
    \ mapping:\n   - Map Jira issue keys to local ticket IDs\n   - Store in .vibey/sync/jira_mapping.json\n\
    6. Handle incremental imports:\n   - Track last import timestamp\n   - Only fetch\
    \ updated issues on subsequent imports\n\nDeliverables:\n- Import functionality\
    \ in JiraAdapter\n- CLI import commands\n- ID mapping storage\n\nDependencies:\n\
    - Requires: 01KCWDNDQ5MGHF8E9MEM2737T7 (JiraAdapter)\n"
