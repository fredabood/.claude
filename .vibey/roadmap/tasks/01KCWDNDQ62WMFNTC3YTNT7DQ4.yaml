  name: Design and implement sync state tracking
  description: "Design and implement sync state tracking to enable reliable\nbidirectional\
    \ synchronization.\n\nImplementation steps:\n1. Create sync state storage:\n \
    \  - .vibey/sync/jira/state.json\n   - Track last sync timestamp per entity\n\
    \   - Track entity versions/ETags\n2. Create SyncState model:\n   - local_id,\
    \ external_id mapping\n   - local_version, remote_version\n   - last_synced_at\
    \ timestamp\n   - sync_status: synced, pending_push, pending_pull, conflict\n\
    3. Implement change detection:\n   - Compare local updated_at with last_synced_at\n\
    \   - Query Jira for changes since last sync\n   - Identify new, modified, deleted\
    \ entities\n4. Create sync manifest:\n   - List of entities to push\n   - List\
    \ of entities to pull\n   - List of conflicts\n5. Add CLI commands:\n   - vibey\
    \ sync status jira\n   - vibey sync diff jira\n\nDeliverables:\n- vibey/adapters/pm/sync/state.py\n\
    - Sync state storage schema\n- CLI status commands\n\nDependencies:\n- Requires:\
    \ 01KCWDNDQ62WMFNTC3YTNT7DQ3 (export working)"
