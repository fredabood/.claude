  name: Implement bidirectional sync engine
  description: "Implement full bidirectional sync engine that keeps Vibey and Jira\n\
    in sync automatically.\n\nImplementation steps:\n1. Implement sync() for BIDIRECTIONAL:\n\
    \   - Load sync state\n   - Detect local changes\n   - Detect remote changes\n\
    \   - Merge changes (prefer strategy)\n   - Push local changes\n   - Pull remote\
    \ changes\n   - Update sync state\n2. Implement sync strategies:\n   - LOCAL_WINS:\
    \ Local changes overwrite remote\n   - REMOTE_WINS: Remote changes overwrite local\n\
    \   - MANUAL: Flag conflicts for user resolution\n3. Handle edge cases:\n   -\
    \ Entity deleted locally but modified remotely\n   - Entity deleted remotely but\
    \ modified locally\n   - Same field modified in both places\n4. Add CLI sync command:\n\
    \   - vibey sync jira [--strategy STRATEGY]\n   - vibey sync jira --dry-run\n\
    5. Add progress reporting:\n   - Show entities being synced\n   - Report conflicts\
    \ found\n   - Summary of changes\n\nDeliverables:\n- Bidirectional sync in JiraAdapter\n\
    - CLI sync command\n- Sync strategies\n\nDependencies:\n- Requires: 01KCWDNDQ62WMFNTC3YTNT7DQ4\
    \ (state tracking)"
