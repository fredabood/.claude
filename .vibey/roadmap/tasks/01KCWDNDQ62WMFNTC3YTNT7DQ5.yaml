  title: Implement bidirectional sync engine
  description: "Implement full bidirectional sync engine that keeps Vibey and Jira\n\
    in sync automatically.\n\nImplementation steps:\n1. Implement sync() for BIDIRECTIONAL:\n\
    \   - Load sync state\n   - Detect local changes\n   - Detect remote changes\n\
    \   - Merge changes (prefer strategy)\n   - Push local changes\n   - Pull remote\
