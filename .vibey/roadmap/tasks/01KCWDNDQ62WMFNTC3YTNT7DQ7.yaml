  name: Add Jira webhook support for real-time sync
  description: "Add Jira webhook support for real-time sync notifications\ninstead\
    \ of polling.\n\nImplementation steps:\n1. Create webhook endpoint:\n   - vibey/adapters/pm/jira/webhook.py\n\
    \   - POST /webhook/jira endpoint\n   - Verify webhook signature\n2. Implement\
    \ webhook handlers:\n   - issue_created -> create local ticket\n   - issue_updated\
    \ -> update local ticket\n   - issue_deleted -> handle deletion\n   - sprint_started/closed\
    \ -> update iteration\n3. Register webhooks with Jira:\n   - CLI: vibey webhook\
    \ register jira\n   - Configure webhook URL (ngrok for dev)\n   - Select events\
    \ to subscribe to\n4. Handle webhook processing:\n   - Queue webhook events\n\
    \   - Process asynchronously\n   - Retry failed processing\n5. Add webhook management\
    \ CLI:\n   - vibey webhook list jira\n   - vibey webhook unregister jira\n\nDeliverables:\n\
    - Webhook handler endpoint\n- Webhook registration\n- CLI webhook commands\n\n\
    Dependencies:\n- Requires: 01KCWDNDQ62WMFNTC3YTNT7DQ6 (conflict resolution)\n\n\
    Note: Optional enhancement - manual sync still works without webhooks"
