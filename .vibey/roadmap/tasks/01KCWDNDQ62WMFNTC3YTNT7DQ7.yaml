  title: Add Jira webhook support for real-time sync
  description: "Add Jira webhook support for real-time sync notifications\ninstead\
    \ of polling.\n\nImplementation steps:\n1. Create webhook endpoint:\n   - vibey/adapters/pm/jira/webhook.py\n\
    \   - POST /webhook/jira endpoint\n   - Verify webhook signature\n2. Implement\
