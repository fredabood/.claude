task:
  id: 01KCWDNDQ62WMFNTC3YTNT7DQ9
  name: Create GitHub REST/GraphQL client
  description: "Create a typed Python client for GitHub REST API and GraphQL API\n\
    for Issues and Projects v2.\n\nImplementation steps:\n1. Create vibey/adapters/pm/github/client.py:\n\
    \   - GitHubClient class\n   - Support both REST and GraphQL\n   - Use GitHub\
    \ App or PAT authentication\n2. Implement REST API operations:\n   - get_repos()\
    \ -> List[GitHubRepo]\n   - get_issues(repo) -> List[GitHubIssue]\n   - get_milestones(repo)\
    \ -> List[GitHubMilestone]\n   - create/update/close issue\n3. Implement GraphQL\
    \ operations:\n   - get_projects_v2() -> List[GitHubProject]\n   - get_project_items(project_id)\
    \ -> List[ProjectItem]\n   - update_project_item_field()\n4. Create Pydantic models:\n\
    \   - GitHubRepo, GitHubIssue, GitHubMilestone\n   - GitHubProject, ProjectItem,\
    \ ProjectField\n   - GitHubLabel, GitHubAssignee\n5. Handle authentication:\n\
    \   - Personal Access Token (PAT)\n   - GitHub App installation token\n   - OAuth\
    \ for user context\n6. Add rate limiting and pagination\n\nDeliverables:\n- vibey/adapters/pm/github/client.py\n\
    - vibey/adapters/pm/github/models.py\n\nDependencies:\n- Requires: Sprint 5 complete\
    \ (sync infrastructure)\n\nReference: https://docs.github.com/en/rest"
