task:
  id: 01KCY7Y55TB3GM73V85A6S821M
  name: Fix track.production_ready_at AttributeError
  description: |
    Bug discovered during roadmap verification when running `vibey roadmap db rebuild --force`.

    Error:
    AttributeError: 'Track' object has no attribute 'production_ready_at'

    Root Cause:
    The track auto-progression code in vibey/operations/roadmap/update.py (line 1739)
    and vibey/cli/roadmap-update.py (line 455) tried to access track.production_ready_at,
    but the Track model only has 'started' and 'completed' timestamp fields.

    Solution:
    Removed the invalid PRODUCTION_READY status handling for tracks since tracks
    only support NOT_STARTED, IN_PROGRESS, and COMPLETED status transitions.
    Added clarifying comment about track timestamp limitations.

    Files Modified:
    - vibey/operations/roadmap/update.py (lines 1733-1740)
    - vibey/cli/roadmap-update.py (lines 449-456)
