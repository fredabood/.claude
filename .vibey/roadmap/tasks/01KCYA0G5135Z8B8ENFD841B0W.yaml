task:
  id: 01KCYA0G5135Z8B8ENFD841B0W
  name: Add token models and fields to Ticket class (Layer 1)
  description: |
    Add token-related models and fields to the base Ticket class in the unified
    ticket architecture. These fields represent LOCAL token data for this ticket
    only (not aggregated from children).

    New Pydantic models:

    ```python
    class TokenEstimate(BaseModel):
        '''Planning - expected usage range.'''
        min: Optional[int] = None
        max: Optional[int] = None
        target: Optional[int] = None

        @model_validator(mode='after')
        def validate_range(self) -> 'TokenEstimate':
            if self.min and self.target and self.min > self.target:
                raise ValueError('min must be <= target')
            if self.target and self.max and self.target > self.max:
                raise ValueError('target must be <= max')
            return self


    class EscalationStep(BaseModel):
        '''Automatic mode escalation at usage threshold.'''
        at: float              # Usage ratio threshold (0.0-1.0+)
        mode: str              # Mode to escalate to

    class TokenEnforcement(BaseModel):
        '''Budget enforcement settings (per-direction or ticket-level).'''
        mode: str = "warn"                          # warn, soft_stop, hard_stop
        thresholds: List[float] = [0.8, 0.9, 1.0]   # Warning thresholds
        allow_override: bool = True                  # Allow CLI/env override
        grace_percent: float = 0.0                   # Overage grace (0.1 = 10%)
        escalation: Optional[List[EscalationStep]] = None  # Auto-escalation


    class Tokens(BaseModel):
        '''All token data for one direction (input or output).'''
        estimate: Optional[TokenEstimate] = None
        budget: Optional[int] = None   # Hard limit for this direction
        usage: Optional[int] = None    # Actual consumption
        enforcement: Optional[TokenEnforcement] = None  # Per-direction override

        @model_validator(mode='after')
        def validate_budget(self) -> 'Tokens':
            if self.budget and self.estimate and self.estimate.target:
                if self.budget < self.estimate.target:
                    raise ValueError('budget must be >= estimate.target')
            return self
    ```

    Add to Ticket class:
    ```python
    class Ticket:
        # Token tracking per direction (each with own enforcement)
        input_tokens: Optional[Tokens] = None
        output_tokens: Optional[Tokens] = None

        # Optional combined budget at ticket level
        total_token_budget: Optional[int] = None
        total_token_enforcement: Optional[TokenEnforcement] = None
    ```

    Enforcement resolution order (per direction):
    1. ticket.input_tokens.enforcement (direction-specific)
    2. .vibey/config/token_budgets.yaml (project default)
    3. Built-in defaults (warn, [0.8, 0.9, 1.0])

    Lifecycle by status:
    - not_started: estimate populated, budget optional, usage null
    - in_progress: estimate + budget, usage accumulating, enforcement active
    - completed: estimate preserved, usage final

    Files to modify:
    - vibey/roadmap/models/ticket/ticket.py
    - vibey/roadmap/models/ticket/__init__.py (export new models)

    Design note: These are LOCAL values. Aggregation happens in
    HierarchicalTicket (Layer 2) via computed properties.
