  title: Add token models and fields to Ticket class (Layer 1)
  description: "Add token-related models and fields to the base Ticket class in the\
    \ unified\nticket architecture. These fields represent LOCAL token data for this\
    \ ticket\nonly (not aggregated from children).\n\nNew Pydantic models:\n\n```python\n\
    class TokenEstimate(BaseModel):\n    '''Planning - expected usage range.'''\n\
    \    min: Optional[int] = None\n    max: Optional[int] = None\n    target: Optional[int]\
    \ = None\n\n    @model_validator(mode='after')\n    def validate_range(self) ->\
    \ 'TokenEstimate':\n        if self.min and self.target and self.min > self.target:\n\
    \            raise ValueError('min must be <= target')\n        if self.target\
    \ and self.max and self.target > self.max:\n            raise ValueError('target\
    \ must be <= max')\n        return self\n\n\nclass EscalationStep(BaseModel):\n\
    \    '''Automatic mode escalation at usage threshold.'''\n    at: float      \
    \        # Usage ratio threshold (0.0-1.0+)\n    mode: str              # Mode\
    \ to escalate to\n\nclass TokenEnforcement(BaseModel):\n    '''Budget enforcement\
    \ settings (per-direction or ticket-level).'''\n    # Core enforcement\n    mode:\
    \ str = \"warn\"                          # warn, soft_stop, hard_stop\n    thresholds:\
    \ List[float] = [0.8, 0.9, 1.0]   # Warning thresholds\n    allow_override: bool\
    \ = True                  # Allow CLI/env override\n    grace_percent: float =\
    \ 0.0                   # Overage grace (0.1 = 10%)\n    escalation: Optional[List[EscalationStep]]\
    \ = None  # Auto-escalation\n\n    # Hierarchical enforcement (all optional, disabled\
    \ by default)\n    require_children_sum_valid: bool = False    # Validation: sum(children)\
    \ <= parent\n    check_ancestors_during_execution: bool = False  # Runtime: check\
    \ parent budgets\n    block_new_children_when_exceeded: bool = False  # Pre-start:\
    \ block if parent exceeded\n\n\nclass Tokens(BaseModel):\n    '''All token data\
    \ for one direction (input or output).'''\n    estimate: Optional[TokenEstimate]\
    \ = None\n    budget: Optional[int] = None   # Hard limit for this direction\n\
    \    usage: Optional[int] = None    # Actual consumption\n    enforcement: Optional[TokenEnforcement]\
    \ = None  # Per-direction override\n\n    @model_validator(mode='after')\n   \
    \ def validate_budget(self) -> 'Tokens':\n        if self.budget and self.estimate\
    \ and self.estimate.target:\n            if self.budget < self.estimate.target:\n\
    \                raise ValueError('budget must be >= estimate.target')\n     \
    \   return self\n```\n\nAdd to Ticket class:\n```python\nclass Ticket:\n    #\
    \ Token tracking per direction (each with own enforcement)\n    input_tokens:\
    \ Optional[Tokens] = None\n    output_tokens: Optional[Tokens] = None\n\n    #\
    \ Optional combined budget at ticket level\n    total_token_budget: Optional[int]\
    \ = None\n    total_token_enforcement: Optional[TokenEnforcement] = None\n```\n\
    \nEnforcement resolution order (per direction):\n1. ticket.input_tokens.enforcement\
    \ (direction-specific)\n2. .vibey/config/token_budgets.yaml (project default)\n\
    3. Built-in defaults (warn, [0.8, 0.9, 1.0])\n\nLifecycle by status:\n- not_started:\
    \ estimate populated, budget optional, usage null\n- in_progress: estimate + budget,\
    \ usage accumulating, enforcement active\n- completed: estimate preserved, usage\
    \ final\n\nFiles to modify:\n- vibey/roadmap/models/ticket/ticket.py\n- vibey/roadmap/models/ticket/__init__.py\
    \ (export new models)\n\nDesign note: These are LOCAL values. Aggregation happens\
    \ in\nHierarchicalTicket (Layer 2) via computed properties.\n"
