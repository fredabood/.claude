  name: Update Task model with token estimation fields
  description: |
    Add new token estimation fields to the Task model:

    Input Token Fields:
    - input_tokens_min: Optional[int] - Minimum expected input tokens
    - input_tokens_max: Optional[int] - Maximum expected input tokens
    - input_tokens_target: Optional[int] - Target/expected input tokens
    - input_tokens_budget: Optional[int] - Hard limit for input tokens
    - actual_input_tokens: Optional[int] - Actual input tokens used

    Output Token Fields:
    - output_tokens_min: Optional[int] - Minimum expected output tokens
    - output_tokens_max: Optional[int] - Maximum expected output tokens
    - output_tokens_target: Optional[int] - Target/expected output tokens
    - output_tokens_budget: Optional[int] - Hard limit for output tokens
    - actual_output_tokens: Optional[int] - Actual output tokens used

    Files to modify:
    - vibey/roadmap/models/task.py
    - vibey/roadmap/models/ticket/ticket.py (if using unified model)

    Validation rules:
    - min <= target <= max (when all specified)
    - budget >= target (when both specified)
    - All fields optional for backwards compatibility
