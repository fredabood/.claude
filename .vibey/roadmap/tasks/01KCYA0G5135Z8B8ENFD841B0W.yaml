task:
  id: 01KCYA0G5135Z8B8ENFD841B0W
  name: Add token estimation fields to Ticket class (Layer 1)
  description: |
    Add token estimation fields to the base Ticket class in the unified
    ticket architecture. These fields represent LOCAL token estimates
    for this ticket only (not aggregated from children).

    New Pydantic model for token estimates:
    ```python
    class TokenEstimate(BaseModel):
        '''Token estimation with min/max/target range.'''
        min: Optional[int] = None
        max: Optional[int] = None
        target: Optional[int] = None
        budget: Optional[int] = None  # Hard limit
        actual: Optional[int] = None  # Recorded usage

        @model_validator(mode='after')
        def validate_range(self) -> 'TokenEstimate':
            if self.min and self.target and self.min > self.target:
                raise ValueError('min must be <= target')
            if self.target and self.max and self.target > self.max:
                raise ValueError('target must be <= max')
            if self.budget and self.target and self.budget < self.target:
                raise ValueError('budget must be >= target')
            return self
    ```

    Add to Ticket class:
    - input_tokens: Optional[TokenEstimate] = None
    - output_tokens: Optional[TokenEstimate] = None

    Files to modify:
    - vibey/roadmap/models/ticket/ticket.py

    Design note: These are LOCAL estimates. Aggregation happens in
    HierarchicalTicket (Layer 2) via computed properties.
