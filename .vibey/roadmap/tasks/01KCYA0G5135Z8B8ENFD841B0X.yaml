task:
  id: 01KCYA0G5135Z8B8ENFD841B0X
  name: Add token aggregation to HierarchicalTicket (Layer 2)
  description: |
    Add computed properties to HierarchicalTicket that aggregate token
    estimates from child tickets, following the same pattern as
    `commits_aggregated`.

    New computed properties:
    ```python
    @computed_field
    @property
    def input_tokens_aggregated(self) -> TokenEstimate:
        '''Aggregate input token estimates from all descendants.'''
        if not self.is_parent:
            return self.input_tokens or TokenEstimate()

        # Sum up child tokens
        total = TokenEstimate()
        for child in self.children_tickets:
            child_tokens = child.input_tokens_aggregated
            total.min = (total.min or 0) + (child_tokens.min or 0)
            total.max = (total.max or 0) + (child_tokens.max or 0)
            total.target = (total.target or 0) + (child_tokens.target or 0)
            total.actual = (total.actual or 0) + (child_tokens.actual or 0)

        # Budget comes from this ticket (not aggregated)
        total.budget = self.input_tokens.budget if self.input_tokens else None
        return total

    @computed_field
    @property
    def output_tokens_aggregated(self) -> TokenEstimate:
        '''Aggregate output token estimates from all descendants.'''
        # Same pattern as input_tokens_aggregated
    ```

    Files to modify:
    - vibey/roadmap/models/ticket/hierarchical.py

    Design note: Parent tickets set their own budget, but estimates
    and actuals are aggregated from children. This allows setting a
    budget constraint on a sprint that covers all its tasks.
