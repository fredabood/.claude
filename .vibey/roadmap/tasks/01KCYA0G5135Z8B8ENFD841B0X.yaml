task:
  id: 01KCYA0G5135Z8B8ENFD841B0X
  name: Add token aggregation to HierarchicalTicket (Layer 2)
  description: |
    Add computed properties to HierarchicalTicket that aggregate token
    data from child tickets, following the same pattern as `commits_aggregated`.

    New computed properties:
    ```python
    @computed_field
    @property
    def input_tokens_aggregated(self) -> Tokens:
        '''Aggregate input token data from all descendants.'''
        if not self.is_parent:
            return self.input_tokens or Tokens()

        # Aggregate estimates from children
        estimate = TokenEstimate(min=0, max=0, target=0)
        total_usage = 0

        for child in self.children_tickets:
            child_tokens = child.input_tokens_aggregated
            if child_tokens.estimate:
                estimate.min += child_tokens.estimate.min or 0
                estimate.max += child_tokens.estimate.max or 0
                estimate.target += child_tokens.estimate.target or 0
            if child_tokens.usage:
                total_usage += child_tokens.usage

        return Tokens(
            estimate=estimate,
            # Budget comes from THIS ticket (not aggregated)
            budget=self.input_tokens.budget if self.input_tokens else None,
            # Usage is sum of children
            usage=total_usage if total_usage > 0 else None,
        )

    @computed_field
    @property
    def output_tokens_aggregated(self) -> Tokens:
        '''Aggregate output token data from all descendants.'''
        # Same pattern as input_tokens_aggregated

    @computed_field
    @property
    def total_tokens_aggregated(self) -> dict:
        '''Combined token summary.'''
        input_agg = self.input_tokens_aggregated
        output_agg = self.output_tokens_aggregated
        return {
            'estimate_total': (
                (input_agg.estimate.target or 0) +
                (output_agg.estimate.target or 0)
            ),
            'usage_total': (
                (input_agg.usage or 0) +
                (output_agg.usage or 0)
            ),
            'budget': self.total_token_budget,
            'within_budget': self._check_budget(),
        }
    ```

    Files to modify:
    - vibey/roadmap/models/ticket/hierarchical.py

    Design notes:
    - Estimates and usage aggregate UP from children
    - Budgets are set at each level (not aggregated)
    - Parent budget covers all descendant usage
    - Enables sprint-level and track-level budget constraints
