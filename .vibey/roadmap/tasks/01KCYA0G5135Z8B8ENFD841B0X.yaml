  title: Add token aggregation to HierarchicalTicket (Layer 2)
  description: "Add computed properties to HierarchicalTicket that aggregate token\n\
    data from child tickets, following the same pattern as `commits_aggregated`.\n\
    \nNew computed properties:\n```python\n@computed_field\n@property\ndef input_tokens_aggregated(self)\
    \ -> Tokens:\n    '''Aggregate input token data from all descendants.'''\n   \
    \ if not self.is_parent:\n        return self.input_tokens or Tokens()\n\n   \
    \ # Aggregate estimates from children\n    estimate = TokenEstimate(min=0, max=0,\
    \ target=0)\n    total_usage = 0\n\n    for child in self.children_tickets:\n\
    \        child_tokens = child.input_tokens_aggregated\n        if child_tokens.estimate:\n\
    \            estimate.min += child_tokens.estimate.min or 0\n            estimate.max\
    \ += child_tokens.estimate.max or 0\n            estimate.target += child_tokens.estimate.target\
    \ or 0\n        if child_tokens.usage:\n            total_usage += child_tokens.usage\n\
    \n    return Tokens(\n        estimate=estimate,\n        # Budget comes from\
    \ THIS ticket (not aggregated)\n        budget=self.input_tokens.budget if self.input_tokens\
    \ else None,\n        # Usage is sum of children\n        usage=total_usage if\
    \ total_usage > 0 else None,\n    )\n\n@computed_field\n@property\ndef output_tokens_aggregated(self)\
    \ -> Tokens:\n    '''Aggregate output token data from all descendants.'''\n  \
    \  # Same pattern as input_tokens_aggregated\n\n@computed_field\n@property\ndef\
    \ total_tokens_aggregated(self) -> dict:\n    '''Combined token summary.'''\n\
    \    input_agg = self.input_tokens_aggregated\n    output_agg = self.output_tokens_aggregated\n\
    \    return {\n        'estimate_total': (\n            (input_agg.estimate.target\
    \ or 0) +\n            (output_agg.estimate.target or 0)\n        ),\n       \
    \ 'usage_total': (\n            (input_agg.usage or 0) +\n            (output_agg.usage\
    \ or 0)\n        ),\n        'budget': self.total_token_budget,\n        'within_budget':\
    \ self._check_budget(),\n    }\n```\n\nFiles to modify:\n- vibey/roadmap/models/ticket/hierarchical.py\n\
    \nDesign notes:\n- Estimates and usage aggregate UP from children\n- Budgets are\
    \ set at each level (not aggregated)\n- Parent budget covers all descendant usage\n\
    - Enables sprint-level and track-level budget constraints\n"
