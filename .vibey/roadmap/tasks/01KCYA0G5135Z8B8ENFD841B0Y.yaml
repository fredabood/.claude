  title: Update YAML and database serialization for token fields
  description: "Update serialization to persist token models (Tokens, TokenEstimate,\n\
    TokenEnforcement).\n\nYAML Format (in ticket YAML files):\n```yaml\nticket:\n\
    \  id: 01ABC...\n  name: Some Task\n  input_tokens:\n    estimate:\n      min:\
    \ 5000\n      max: 20000\n      target: 10000\n    budget: 25000\n    usage: 8234\
    \  # null until execution\n    enforcement:  # Optional per-direction override\n\
    \      mode: warn\n      thresholds: [0.8, 0.9, 1.0]\n      grace_percent: 0.1\n\
    \      escalation:\n        - at: 0.9\n          mode: soft_stop\n        - at:\
    \ 1.0\n          mode: hard_stop\n  output_tokens:\n    estimate:\n      min:\
    \ 2000\n      max: 10000\n      target: 5000\n    budget: 12000\n    usage: 4521\n\
    \    enforcement:\n      mode: hard_stop  # Stricter for output\n  total_token_budget:\
    \ 35000\n  total_token_enforcement:\n    mode: soft_stop\n```\n\nSQLite Schema:\n\
    ```sql\n-- Add to tickets table (flattened for query efficiency)\n-- Estimate\
    \ fields\nALTER TABLE tickets ADD COLUMN input_tokens_estimate_min INTEGER;\n\
    ALTER TABLE tickets ADD COLUMN input_tokens_estimate_max INTEGER;\nALTER TABLE\
    \ tickets ADD COLUMN input_tokens_estimate_target INTEGER;\nALTER TABLE tickets\
    \ ADD COLUMN input_tokens_budget INTEGER;\nALTER TABLE tickets ADD COLUMN input_tokens_usage\
    \ INTEGER;\nALTER TABLE tickets ADD COLUMN output_tokens_estimate_min INTEGER;\n\
    ALTER TABLE tickets ADD COLUMN output_tokens_estimate_max INTEGER;\nALTER TABLE\
    \ tickets ADD COLUMN output_tokens_estimate_target INTEGER;\nALTER TABLE tickets\
    \ ADD COLUMN output_tokens_budget INTEGER;\nALTER TABLE tickets ADD COLUMN output_tokens_usage\
    \ INTEGER;\nALTER TABLE tickets ADD COLUMN total_token_budget INTEGER;\n\n-- Enforcement\
    \ fields (JSON for complex nested structure)\nALTER TABLE tickets ADD COLUMN input_tokens_enforcement\
    \ TEXT;  -- JSON\nALTER TABLE tickets ADD COLUMN output_tokens_enforcement TEXT;\
    \  -- JSON\nALTER TABLE tickets ADD COLUMN total_token_enforcement TEXT;    --\
    \ JSON\n```\n\nFiles to modify:\n- vibey/roadmap/serialization/yaml_loader.py\n\
    - vibey/roadmap/serialization/yaml_dumper.py\n- vibey/operations/roadmap/database.py\
    \ (schema)\n- vibey/roadmap/serialization/sql_loader.py\n- vibey/roadmap/serialization/sql_dumper.py\n\
    \nNotes:\n- Aggregated values computed at runtime (not stored)\n- Nested structure\
    \ in YAML, flattened in SQLite\n- Enforcement stored as JSON in SQLite (complex\
    \ nested structure)\n- Handle null/missing values gracefully\n"
