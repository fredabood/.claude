task:
  id: 01KCYA0G5135Z8B8ENFD841B0Z
  name: Create token estimation service
  description: |
    Create a new service for estimating token usage. This service generates
    `TokenEstimate` objects that get wrapped in `Tokens` on the Ticket.

    vibey/services/token_estimator.py:

    ```python
    from vibey.roadmap.models.ticket import TokenEstimate, Tokens

    class EstimationResult:
        '''Result of token estimation for a task.'''
        input_estimate: TokenEstimate  # min/max/target for input
        output_estimate: TokenEstimate  # min/max/target for output
        confidence: float  # 0.0-1.0 based on available data

    class TokenEstimator:
        def estimate_task(self, task: Task) -> EstimationResult:
            '''
            Estimate tokens for a task based on type and complexity.

            Returns EstimationResult with separate input/output estimates.
            These get assigned to task.input_tokens.estimate and
            task.output_tokens.estimate.
            '''

        def estimate_from_description(
            self,
            description: str,
            task_type: str,
            complexity: str
        ) -> EstimationResult:
            '''Estimate tokens from task description.'''

        def apply_estimates(self, task: Task, result: EstimationResult):
            '''
            Apply estimation result to task.

            Creates Tokens objects with estimates if they don't exist,
            or updates existing estimate fields.
            '''
            if task.input_tokens is None:
                task.input_tokens = Tokens(estimate=result.input_estimate)
            else:
                task.input_tokens.estimate = result.input_estimate

            if task.output_tokens is None:
                task.output_tokens = Tokens(estimate=result.output_estimate)
            else:
                task.output_tokens.estimate = result.output_estimate
    ```

    Base estimation factors:
    - Description length → context tokens needed
    - Task type → typical input/output ratios
    - Complexity → multipliers for each level

    The service generates estimates that integrate with the Tokens model
    from Sprint 1, keeping estimate/budget/usage cleanly separated.
