task:
  id: 01KCYA0G5135Z8B8ENFD841B10
  name: Implement task-type-specific estimation algorithms
  description: |
    Create estimation algorithms for each task type:

    Task Types and Characteristics:
    - development: High output (code), medium input (context)
    - documentation: High output (docs), low input
    - testing: Medium output (tests), medium input (code to test)
    - research: Low output (findings), high input (exploration)
    - review: Low output (comments), high input (code to review)
    - infrastructure: Variable, depends on scope
    - design: Medium output (specs), low input
    - gate: Minimal tokens (validation only)

    Base estimates per type (in tokens):
    | Type          | Input Range    | Output Range   |
    |---------------|----------------|----------------|
    | development   | 5000-50000     | 2000-20000     |
    | documentation | 2000-20000     | 3000-30000     |
    | testing       | 3000-30000     | 2000-15000     |
    | research      | 10000-100000   | 1000-10000     |
    | review        | 5000-50000     | 500-5000       |

    Implementation:
    - Create ESTIMATION_PROFILES dict with base ranges
    - Apply complexity multipliers (simple=0.5, medium=1.0, complex=2.0, very_complex=4.0)
