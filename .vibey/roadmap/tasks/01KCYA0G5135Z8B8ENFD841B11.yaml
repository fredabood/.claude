task:
  id: 01KCYA0G5135Z8B8ENFD841B11
  name: Add historical data calibration
  description: |
    Calibrate estimation algorithms using historical task data:

    1. Collect Historical Data:
       - Query completed tasks with actual_input_tokens and actual_output_tokens
       - Group by task_type and complexity
       - Calculate mean, median, std dev for each group

    2. Calibration Process:
       - Compare estimates to actuals for completed tasks
       - Calculate adjustment factors per task type
       - Store calibration data in .vibey/config/token_calibration.yaml

    3. Apply Calibration:
       - Load calibration data on estimator init
       - Adjust base estimates using calibration factors
       - Improve confidence scores based on sample size

    4. Continuous Learning:
       - Update calibration after each task completion
       - Track estimate accuracy over time
       - Alert when estimates consistently off

    Files:
    - vibey/services/token_estimator.py (add calibration)
    - .vibey/config/token_calibration.yaml (new)
