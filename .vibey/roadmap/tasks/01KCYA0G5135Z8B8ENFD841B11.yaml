  title: Add historical data calibration
  description: "Calibrate estimation algorithms using historical task data. Uses the\n\
    preserved estimate and recorded usage from completed tasks.\n\n1. Collect Historical\
    \ Data:\n   - Query completed tasks with input_tokens.usage and output_tokens.usage\n\
    \   - Also retrieve input_tokens.estimate and output_tokens.estimate\n   - Group\
    \ by task_type and complexity\n   - Calculate mean, median, std dev for each group\n\
    \n2. Calibration Process:\n   - Compare estimate.target to actual usage for completed\
    \ tasks\n   - Calculate adjustment factors per task type\n   - Store calibration\
    \ data in .vibey/config/token_calibration.yaml\n\n   ```python\n   # Example calibration\
    \ analysis\n   for task in completed_tasks:\n       input_accuracy = task.input_tokens.usage\
    \ / task.input_tokens.estimate.target\n       output_accuracy = task.output_tokens.usage\
    \ / task.output_tokens.estimate.target\n       # Track by task_type, complexity\n\
    \   ```\n\n3. Apply Calibration:\n   - Load calibration data on estimator init\n\
    \   - Adjust base estimates using calibration factors\n   - Improve confidence\
    \ scores based on sample size\n\n4. Continuous Learning:\n   - Update calibration\
    \ after each task completion\n   - Track estimate accuracy over time (estimate.target\
    \ vs usage)\n   - Alert when estimates consistently off\n\nFiles:\n- vibey/services/token_estimator.py\
    \ (add calibration)\n- .vibey/config/token_calibration.yaml (new)\n\nNote: Estimates\
    \ are preserved on completed tasks specifically to enable\nthis retroactive accuracy\
    \ analysis.\n"
