task:
  id: 01KCYA0G5135Z8B8ENFD841B11
  name: Add historical data calibration
  description: |
    Calibrate estimation algorithms using historical task data. Uses the
    preserved estimate and recorded usage from completed tasks.

    1. Collect Historical Data:
       - Query completed tasks with input_tokens.usage and output_tokens.usage
       - Also retrieve input_tokens.estimate and output_tokens.estimate
       - Group by task_type and complexity
       - Calculate mean, median, std dev for each group

    2. Calibration Process:
       - Compare estimate.target to actual usage for completed tasks
       - Calculate adjustment factors per task type
       - Store calibration data in .vibey/config/token_calibration.yaml

       ```python
       # Example calibration analysis
       for task in completed_tasks:
           input_accuracy = task.input_tokens.usage / task.input_tokens.estimate.target
           output_accuracy = task.output_tokens.usage / task.output_tokens.estimate.target
           # Track by task_type, complexity
       ```

    3. Apply Calibration:
       - Load calibration data on estimator init
       - Adjust base estimates using calibration factors
       - Improve confidence scores based on sample size

    4. Continuous Learning:
       - Update calibration after each task completion
       - Track estimate accuracy over time (estimate.target vs usage)
       - Alert when estimates consistently off

    Files:
    - vibey/services/token_estimator.py (add calibration)
    - .vibey/config/token_calibration.yaml (new)

    Note: Estimates are preserved on completed tasks specifically to enable
    this retroactive accuracy analysis.
