task:
  id: 01KCYA0G5135Z8B8ENFD841B12
  name: Add budget validation on task creation
  description: |
    Validate token budgets when tasks are created or updated.
    Leverages the validators already on Tokens and TokenEstimate models.

    Always-On Validation Rules (per direction - input and output):
    1. TokenEstimate: min <= target <= max (validated in model)
    2. Tokens: budget >= estimate.target (validated in model)
    3. Ticket: total_token_budget >= sum of input+output budgets

    Optional Hierarchical Validation (when require_children_sum_valid=true):
    4. Parent budget >= sum of children budgets (per direction)
    5. Parent total_token_budget >= sum of children total_token_budgets

    Implementation:
    ```python
    # Model validators (already in Tokens/TokenEstimate from Sprint 1)
    # Additional validation for hierarchical constraints:

    class Ticket:
        @model_validator(mode='after')
        def validate_total_budget(self) -> 'Ticket':
            # Always validate: total >= input + output
            if self.total_token_budget:
                input_budget = self.input_tokens.budget if self.input_tokens else 0
                output_budget = self.output_tokens.budget if self.output_tokens else 0
                if self.total_token_budget < (input_budget or 0) + (output_budget or 0):
                    raise ValueError(
                        f'total_token_budget ({self.total_token_budget}) must be >= '
                        f'sum of input ({input_budget}) + output ({output_budget}) budgets'
                    )
            return self


    class BudgetValidator:
        '''Validates hierarchical budget constraints.'''

        def validate_children_sum(
            self,
            parent: HierarchicalTicket,
            direction: str,  # 'input', 'output', or 'total'
        ) -> Optional[ValidationError]:
            '''
            Optional validation: sum(children budgets) <= parent budget.
            Only runs if parent enforcement has require_children_sum_valid=True.
            '''
            enforcement = self.get_enforcement(parent, direction)
            if not enforcement.require_children_sum_valid:
                return None  # Skip validation if not enabled

            parent_budget = self._get_budget(parent, direction)
            if not parent_budget:
                return None  # No parent budget to validate against

            children_sum = sum(
                self._get_budget(child, direction) or 0
                for child in parent.children_tickets
            )

            if children_sum > parent_budget:
                return ValidationError(
                    f'{direction} budget sum of children ({children_sum:,}) '
                    f'exceeds parent budget ({parent_budget:,})'
                )

            return None

        def validate_on_child_budget_change(
            self,
            child: HierarchicalTicket,
            new_budget: int,
            direction: str,
        ) -> Optional[ValidationError]:
            '''
            Validate when a child's budget is set or changed.
            Checks if new budget would violate parent's constraint.
            '''
            parent = child.parent
            if not parent:
                return None

            enforcement = self.get_enforcement(parent, direction)
            if not enforcement.require_children_sum_valid:
                return None

            parent_budget = self._get_budget(parent, direction)
            if not parent_budget:
                return None

            # Calculate what the sum would be with the new budget
            current_child_budget = self._get_budget(child, direction) or 0
            other_children_sum = sum(
                self._get_budget(c, direction) or 0
                for c in parent.children_tickets
                if c.id != child.id
            )
            new_sum = other_children_sum + new_budget

            if new_sum > parent_budget:
                return ValidationError(
                    f'Setting {direction} budget to {new_budget:,} would make '
                    f'children sum ({new_sum:,}) exceed parent budget ({parent_budget:,})'
                )

            return None
    ```

    Error Messages:
    - "Input token budget ({budget}) must be >= target estimate ({target})"
    - "Invalid token range: min ({min}) > target ({target})"
    - "Children sum ({sum}) exceeds parent budget ({budget})" (only if enabled)

    Files:
    - vibey/roadmap/models/ticket/ticket.py (always-on validation)
    - vibey/services/budget_validator.py (optional hierarchical validation)
    - vibey/operations/roadmap/update.py (CLI validation integration)
