  title: Add budget validation on task creation
  description: "Validate token budgets when tasks are created or updated.\nLeverages\
    \ the validators already on Tokens and TokenEstimate models.\n\nAlways-On Validation\
    \ Rules (per direction - input and output):\n1. TokenEstimate: min <= target <=\
    \ max (validated in model)\n2. Tokens: budget >= estimate.target (validated in\
    \ model)\n3. Ticket: total_token_budget >= sum of input+output budgets\n\nOptional\
    \ Hierarchical Validation (when require_children_sum_valid=true):\n4. Parent budget\
    \ >= sum of children budgets (per direction)\n5. Parent total_token_budget >=\
    \ sum of children total_token_budgets\n\nImplementation:\n```python\n# Model validators\
    \ (already in Tokens/TokenEstimate from Sprint 1)\n# Additional validation for\
    \ hierarchical constraints:\n\nclass Ticket:\n    @model_validator(mode='after')\n\
    \    def validate_total_budget(self) -> 'Ticket':\n        # Always validate:\
    \ total >= input + output\n        if self.total_token_budget:\n            input_budget\
    \ = self.input_tokens.budget if self.input_tokens else 0\n            output_budget\
    \ = self.output_tokens.budget if self.output_tokens else 0\n            if self.total_token_budget\
    \ < (input_budget or 0) + (output_budget or 0):\n                raise ValueError(\n\
    \                    f'total_token_budget ({self.total_token_budget}) must be\
    \ >= '\n                    f'sum of input ({input_budget}) + output ({output_budget})\
    \ budgets'\n                )\n        return self\n\n\nclass BudgetValidator:\n\
    \    '''Validates hierarchical budget constraints.'''\n\n    def validate_children_sum(\n\
    \        self,\n        parent: HierarchicalTicket,\n        direction: str, \
    \ # 'input', 'output', or 'total'\n    ) -> Optional[ValidationError]:\n     \
    \   '''\n        Optional validation: sum(children budgets) <= parent budget.\n\
    \        Only runs if parent enforcement has require_children_sum_valid=True.\n\
    \        '''\n        enforcement = self.get_enforcement(parent, direction)\n\
    \        if not enforcement.require_children_sum_valid:\n            return None\
    \  # Skip validation if not enabled\n\n        parent_budget = self._get_budget(parent,\
    \ direction)\n        if not parent_budget:\n            return None  # No parent\
    \ budget to validate against\n\n        children_sum = sum(\n            self._get_budget(child,\
    \ direction) or 0\n            for child in parent.children_tickets\n        )\n\
    \n        if children_sum > parent_budget:\n            return ValidationError(\n\
    \                f'{direction} budget sum of children ({children_sum:,}) '\n \
    \               f'exceeds parent budget ({parent_budget:,})'\n            )\n\n\
    \        return None\n\n    def validate_on_child_budget_change(\n        self,\n\
    \        child: HierarchicalTicket,\n        new_budget: int,\n        direction:\
    \ str,\n    ) -> Optional[ValidationError]:\n        '''\n        Validate when\
    \ a child's budget is set or changed.\n        Checks if new budget would violate\
    \ parent's constraint.\n        '''\n        parent = child.parent\n        if\
    \ not parent:\n            return None\n\n        enforcement = self.get_enforcement(parent,\
    \ direction)\n        if not enforcement.require_children_sum_valid:\n       \
    \     return None\n\n        parent_budget = self._get_budget(parent, direction)\n\
    \        if not parent_budget:\n            return None\n\n        # Calculate\
    \ what the sum would be with the new budget\n        current_child_budget = self._get_budget(child,\
    \ direction) or 0\n        other_children_sum = sum(\n            self._get_budget(c,\
    \ direction) or 0\n            for c in parent.children_tickets\n            if\
    \ c.id != child.id\n        )\n        new_sum = other_children_sum + new_budget\n\
    \n        if new_sum > parent_budget:\n            return ValidationError(\n \
    \               f'Setting {direction} budget to {new_budget:,} would make '\n\
    \                f'children sum ({new_sum:,}) exceed parent budget ({parent_budget:,})'\n\
    \            )\n\n        return None\n```\n\nError Messages:\n- \"Input token\
    \ budget ({budget}) must be >= target estimate ({target})\"\n- \"Invalid token\
    \ range: min ({min}) > target ({target})\"\n- \"Children sum ({sum}) exceeds parent\
    \ budget ({budget})\" (only if enabled)\n\nFiles:\n- vibey/roadmap/models/ticket/ticket.py\
    \ (always-on validation)\n- vibey/services/budget_validator.py (optional hierarchical\
    \ validation)\n- vibey/operations/roadmap/update.py (CLI validation integration)\n"
