  title: Implement runtime token tracking
  description: "Track actual token usage during task execution. Updates the `usage`\n\
    field within the `Tokens` objects on the task.\n\n1. Token Tracking Interface:\n\
    \   vibey/services/token_tracker.py:\n\n   ```python\n   from vibey.roadmap.models.ticket\
    \ import Tokens\n\n   class TokenTracker:\n       def __init__(self, task_id:\
    \ str):\n           self.task_id = task_id\n           self._input_accumulated\
    \ = 0\n           self._output_accumulated = 0\n\n       def record_usage(self,\
    \ input_tokens: int, output_tokens: int):\n           '''\n           Record token\
    \ usage from an API call.\n           Accumulates during execution.\n        \
    \   '''\n           self._input_accumulated += input_tokens\n           self._output_accumulated\
    \ += output_tokens\n\n       def get_remaining_budget(self) -> Tuple[Optional[int],\
    \ Optional[int]]:\n           '''\n           Returns (input_remaining, output_remaining).\n\
    \           None if no budget set for that direction.\n           '''\n      \
    \     task = self._load_task()\n           input_remaining = None\n          \
    \ output_remaining = None\n\n           if task.input_tokens and task.input_tokens.budget:\n\
    \               input_remaining = task.input_tokens.budget - self._input_accumulated\n\
    \n           if task.output_tokens and task.output_tokens.budget:\n          \
    \     output_remaining = task.output_tokens.budget - self._output_accumulated\n\
    \n           return (input_remaining, output_remaining)\n\n       def save(self):\n\
    \           '''\n           Persist accumulated usage to task YAML.\n        \
    \   Updates task.input_tokens.usage and task.output_tokens.usage.\n          \
    \ '''\n           task = self._load_task()\n\n           if task.input_tokens:\n\
    \               task.input_tokens.usage = self._input_accumulated\n          \
    \ else:\n               task.input_tokens = Tokens(usage=self._input_accumulated)\n\
    \n           if task.output_tokens:\n               task.output_tokens.usage =\
    \ self._output_accumulated\n           else:\n               task.output_tokens\
    \ = Tokens(usage=self._output_accumulated)\n\n           self._save_task(task)\n\
    \   ```\n\n2. Integration Points:\n   - MCP tool calls\n   - CLI command execution\n\
    \   - Agent task runners\n   - Git commits (via post-commit hook)\n\n3. Git Commit\
    \ Integration:\n   Git commits trigger automatic token usage snapshot:\n\n   ```python\n\
    \   class TokenTracker:\n       # ... existing methods ...\n\n       def get_delta_since_last_commit(self)\
    \ -> TokenDelta:\n           '''Get usage since last commit checkpoint.'''\n \
    \          return TokenDelta(\n               input=self._input_accumulated -\
    \ self._last_commit_input,\n               output=self._output_accumulated - self._last_commit_output,\n\
    \           )\n\n       def mark_commit_checkpoint(self, commit_sha: str):\n \
    \          '''Mark current usage as checkpoint after commit.'''\n           self._last_commit_input\
    \ = self._input_accumulated\n           self._last_commit_output = self._output_accumulated\n\
    \           self._commit_history.append(CommitUsage(\n               sha=commit_sha,\n\
    \               input_delta=self._input_accumulated - self._last_commit_input,\n\
    \               output_delta=self._output_accumulated - self._last_commit_output,\n\
    \               cumulative_input=self._input_accumulated,\n               cumulative_output=self._output_accumulated,\n\
    \               timestamp=datetime.now(UTC),\n           ))\n\n       def on_commit(self,\
    \ commit_sha: str):\n           '''\n           Called by post-commit hook.\n\
    \           Records usage delta and updates ticket.\n           '''\n        \
    \   delta = self.get_delta_since_last_commit()\n\n           # Update ticket usage\n\
    \           self.save()\n\n           # Record per-commit breakdown\n        \
    \   self._record_commit_usage(commit_sha, delta)\n\n           # Mark checkpoint\n\
    \           self.mark_commit_checkpoint(commit_sha)\n   ```\n\n4. Per-Commit Usage\
    \ Log:\n   ```yaml\n   # .vibey/context/commits/<sha>/usage.yaml\n   commit: abc123\n\
    \   ticket_id: 01KCYA...\n   timestamp: 2025-12-22T10:30:00Z\n   tokens:\n   \
    \  input:\n       delta: 5234\n       cumulative: 18340\n     output:\n      \
    \ delta: 2100\n       cumulative: 8450\n   ```\n\n5. Persistence:\n   - Update\
    \ task.input_tokens.usage and task.output_tokens.usage\n   - Aggregated values\
    \ computed at runtime via HierarchicalTicket\n   - Log usage history in activity\
    \ log\n   - Per-commit usage breakdown in .vibey/context/commits/\n\nCross-reference:\
    \ Implementation Mode Sprint 10 (TicketCommitLinker)\nhandles the git hook integration\
    \ that calls TokenTracker.on_commit().\n"
