task:
  id: 01KCYA0G5135Z8B8ENFD841B14
  name: Add warning and hard-stop thresholds
  description: |
    Implement the full budget enforcement system with per-direction settings,
    grace periods, and automatic escalation.

    1. Enforcement Modes:
       - warn: Log warnings but continue execution
       - soft_stop: Warn and prompt for confirmation to continue
       - hard_stop: Terminate execution when budget exceeded

    2. Enforcement Resolution Order (per direction):
       ```python
       def get_enforcement(task: Ticket, direction: str) -> TokenEnforcement:
           tokens = getattr(task, f'{direction}_tokens')

           # 1. Per-direction override
           if tokens and tokens.enforcement:
               return tokens.enforcement

           # 2. Project defaults
           config = load_config('.vibey/config/token_budgets.yaml')
           if config and config.get('enforcement'):
               return TokenEnforcement(**config['enforcement'])

           # 3. Built-in defaults
           return TokenEnforcement(
               mode='warn',
               thresholds=[0.8, 0.9, 1.0],
               allow_override=True,
               grace_percent=0.0,
           )
       ```

    3. Project Default Configuration:
       .vibey/config/token_budgets.yaml:
       ```yaml
       enforcement:
         mode: warn
         thresholds: [0.8, 0.9, 1.0]
         allow_override: true
         grace_percent: 0.0
         escalation:
           - at: 0.9
             mode: soft_stop
           - at: 1.0
             mode: hard_stop
       ```

    4. Grace Period Logic:
       ```python
       def should_hard_stop(usage: int, budget: int, grace: float) -> bool:
           effective_limit = budget * (1 + grace)
           return usage >= effective_limit
       ```

    5. Escalation Logic:
       ```python
       def get_effective_mode(
           enforcement: TokenEnforcement,
           usage_ratio: float
       ) -> str:
           if not enforcement.escalation:
               return enforcement.mode

           effective_mode = enforcement.mode
           for step in sorted(enforcement.escalation, key=lambda s: s.at):
               if usage_ratio >= step.at:
                   effective_mode = step.mode
           return effective_mode
       ```

    6. Budget Checker Implementation:
       ```python
       class BudgetChecker:
           def check_thresholds(self, task: Ticket) -> List[BudgetWarning]:
               warnings = []

               for direction in ['input', 'output']:
                   tokens = getattr(task, f'{direction}_tokens')
                   if not tokens or not tokens.budget or not tokens.usage:
                       continue

                   enforcement = self.get_enforcement(task, direction)
                   ratio = tokens.usage / tokens.budget
                   effective_mode = self.get_effective_mode(enforcement, ratio)

                   # Check each threshold
                   for threshold in enforcement.thresholds:
                       if ratio >= threshold:
                           warnings.append(BudgetWarning(
                               direction=direction,
                               threshold=threshold,
                               ratio=ratio,
                               mode=effective_mode,
                               grace_remaining=(
                                   (1 + enforcement.grace_percent) - ratio
                                   if ratio >= 1.0 else None
                               ),
                           ))

               return warnings

           def should_stop(self, task: Ticket, direction: str) -> bool:
               tokens = getattr(task, f'{direction}_tokens')
               if not tokens or not tokens.budget or not tokens.usage:
                   return False

               enforcement = self.get_enforcement(task, direction)
               ratio = tokens.usage / tokens.budget
               effective_mode = self.get_effective_mode(enforcement, ratio)

               if effective_mode == 'hard_stop':
                   effective_limit = 1 + enforcement.grace_percent
                   return ratio >= effective_limit

               return False
       ```

    7. Hybrid Hierarchical Enforcement (all optional, disabled by default):

       Three optional flags on TokenEnforcement:
       - require_children_sum_valid: Validation-time constraint
       - check_ancestors_during_execution: Runtime ancestor checks
       - block_new_children_when_exceeded: Pre-start blocking

       ```python
       class BudgetChecker:
           def can_start_task(self, task: HierarchicalTicket) -> CanStartResult:
               '''Check before starting a task.'''
               # Check own budget headroom
               if self._exceeds_own_budget(task):
                   return CanStartResult(allowed=False, reason="Task budget exceeded")

               # Optional: Check if any ancestor is exceeded
               for ancestor in task.ancestors:
                   enforcement = self.get_enforcement(ancestor, 'total')
                   if not enforcement.block_new_children_when_exceeded:
                       continue  # Skip if not enabled

                   if self._ancestor_exceeded(ancestor):
                       return CanStartResult(
                           allowed=False,
                           reason=f"Ancestor {ancestor.id} budget exceeded",
                           ancestor_id=ancestor.id,
                       )

               return CanStartResult(allowed=True)

           def check_during_execution(
               self,
               task: HierarchicalTicket,
               new_usage: int,
               direction: str,
           ) -> ExecutionCheckResult:
               '''Check during task execution.'''
               # Always check own budget
               result = self._check_own_budget(task, new_usage, direction)
               if result.should_stop:
                   return result

               # Optional: Check ancestors if enabled
               enforcement = self.get_enforcement(task, direction)
               if enforcement.check_ancestors_during_execution:
                   for ancestor in task.ancestors:
                       ancestor_result = self._check_ancestor_budget(
                           ancestor, task, new_usage, direction
                       )
                       if ancestor_result.should_stop:
                           return ancestor_result

               return ExecutionCheckResult(should_stop=False)

           def _check_ancestor_budget(
               self,
               ancestor: HierarchicalTicket,
               child: HierarchicalTicket,
               child_new_usage: int,
               direction: str,
           ) -> ExecutionCheckResult:
               '''Check if child's new usage would exceed ancestor's budget.'''
               # Get ancestor's aggregated usage (includes all descendants)
               agg_tokens = getattr(ancestor, f'{direction}_tokens_aggregated')
               if not agg_tokens or not agg_tokens.budget:
                   return ExecutionCheckResult(should_stop=False)

               # Project new aggregated usage
               current_child_usage = getattr(child, f'{direction}_tokens')
               current_child_usage = current_child_usage.usage if current_child_usage else 0
               usage_delta = child_new_usage - (current_child_usage or 0)
               projected_usage = (agg_tokens.usage or 0) + usage_delta

               ratio = projected_usage / agg_tokens.budget
               enforcement = self.get_enforcement(ancestor, direction)
               effective_mode = self.get_effective_mode(enforcement, ratio)

               if effective_mode == 'hard_stop':
                   effective_limit = 1 + enforcement.grace_percent
                   if ratio >= effective_limit:
                       return ExecutionCheckResult(
                           should_stop=True,
                           reason=f"Would exceed ancestor {ancestor.id} budget",
                           ancestor_id=ancestor.id,
                       )

               return ExecutionCheckResult(should_stop=False)
       ```

       Use Cases:
       - Strict: All three enabled - prevents any way to exceed parent
       - Flexible: Only block_new_children - allows pooled budgets
       - Permissive: All disabled - just track usage, no blocking

    8. Override Mechanism:
       - CLI flag: --ignore-token-budget
       - Environment variable: VIBEY_IGNORE_TOKEN_BUDGET=1
       - Only works if enforcement.allow_override=true

    Files:
    - vibey/services/budget_checker.py (new)
    - vibey/services/token_tracker.py (integrate with checker)
