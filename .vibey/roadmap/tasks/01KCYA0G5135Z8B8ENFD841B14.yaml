task:
  id: 01KCYA0G5135Z8B8ENFD841B14
  name: Add warning and hard-stop thresholds
  description: |
    Implement configurable thresholds for budget enforcement:

    1. Warning Thresholds (configurable):
       - 80% of budget: First warning
       - 90% of budget: Urgent warning
       - 100% of budget: Budget exceeded

    2. Enforcement Modes:
       - warn: Log warnings but continue execution
       - soft_stop: Warn and prompt for confirmation to continue
       - hard_stop: Terminate execution when budget exceeded

    3. Configuration:
       .vibey/config/token_budgets.yaml:
       ```yaml
       enforcement:
         mode: warn  # warn, soft_stop, hard_stop
         warning_thresholds: [0.8, 0.9, 1.0]
         allow_override: true
       ```

    4. Warning Messages:
       - "[TOKEN WARNING] Task {id} at 80% of input budget ({used}/{budget})"
       - "[TOKEN WARNING] Task {id} at 90% of output budget ({used}/{budget})"
       - "[TOKEN EXCEEDED] Task {id} exceeded budget. Mode: {mode}"

    5. Override Mechanism:
       - CLI flag: --ignore-token-budget
       - Environment variable: VIBEY_IGNORE_TOKEN_BUDGET=1
