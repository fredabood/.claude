task:
  id: 01KCYA0G5135Z8B8ENFD841B14
  name: Add warning and hard-stop thresholds
  description: "Implement the full budget enforcement system with per-direction settings,\n\
    grace periods, and automatic escalation.\n\n1. Enforcement Modes:\n   - warn:\
    \ Log warnings but continue execution\n   - soft_stop: Warn and prompt for confirmation\
    \ to continue\n   - hard_stop: Terminate execution when budget exceeded\n\n2.\
    \ Enforcement Resolution Order (per direction):\n   ```python\n   def get_enforcement(task:\
    \ Ticket, direction: str) -> TokenEnforcement:\n       tokens = getattr(task,\
    \ f'{direction}_tokens')\n\n       # 1. Per-direction override\n       if tokens\
    \ and tokens.enforcement:\n           return tokens.enforcement\n\n       # 2.\
    \ Project defaults\n       config = load_config('.vibey/config/token_budgets.yaml')\n\
    \       if config and config.get('enforcement'):\n           return TokenEnforcement(**config['enforcement'])\n\
    \n       # 3. Built-in defaults\n       return TokenEnforcement(\n           mode='warn',\n\
    \           thresholds=[0.8, 0.9, 1.0],\n           allow_override=True,\n   \
    \        grace_percent=0.0,\n       )\n   ```\n\n3. Project Default Configuration:\n\
    \   .vibey/config/token_budgets.yaml:\n   ```yaml\n   enforcement:\n     mode:\
    \ warn\n     thresholds: [0.8, 0.9, 1.0]\n     allow_override: true\n     grace_percent:\
    \ 0.0\n     escalation:\n       - at: 0.9\n         mode: soft_stop\n       -\
    \ at: 1.0\n         mode: hard_stop\n   ```\n\n4. Grace Period Logic:\n   ```python\n\
    \   def should_hard_stop(usage: int, budget: int, grace: float) -> bool:\n   \
    \    effective_limit = budget * (1 + grace)\n       return usage >= effective_limit\n\
    \   ```\n\n5. Escalation Logic:\n   ```python\n   def get_effective_mode(\n  \
    \     enforcement: TokenEnforcement,\n       usage_ratio: float\n   ) -> str:\n\
    \       if not enforcement.escalation:\n           return enforcement.mode\n\n\
    \       effective_mode = enforcement.mode\n       for step in sorted(enforcement.escalation,\
    \ key=lambda s: s.at):\n           if usage_ratio >= step.at:\n              \
    \ effective_mode = step.mode\n       return effective_mode\n   ```\n\n6. Budget\
    \ Checker Implementation:\n   ```python\n   class BudgetChecker:\n       def check_thresholds(self,\
    \ task: Ticket) -> List[BudgetWarning]:\n           warnings = []\n\n        \
    \   for direction in ['input', 'output']:\n               tokens = getattr(task,\
    \ f'{direction}_tokens')\n               if not tokens or not tokens.budget or\
    \ not tokens.usage:\n                   continue\n\n               enforcement\
    \ = self.get_enforcement(task, direction)\n               ratio = tokens.usage\
    \ / tokens.budget\n               effective_mode = self.get_effective_mode(enforcement,\
    \ ratio)\n\n               # Check each threshold\n               for threshold\
    \ in enforcement.thresholds:\n                   if ratio >= threshold:\n    \
    \                   warnings.append(BudgetWarning(\n                         \
    \  direction=direction,\n                           threshold=threshold,\n   \
    \                        ratio=ratio,\n                           mode=effective_mode,\n\
    \                           grace_remaining=(\n                              \
    \ (1 + enforcement.grace_percent) - ratio\n                               if ratio\
    \ >= 1.0 else None\n                           ),\n                       ))\n\
    \n           return warnings\n\n       def should_stop(self, task: Ticket, direction:\
    \ str) -> bool:\n           tokens = getattr(task, f'{direction}_tokens')\n  \
    \         if not tokens or not tokens.budget or not tokens.usage:\n          \
    \     return False\n\n           enforcement = self.get_enforcement(task, direction)\n\
    \           ratio = tokens.usage / tokens.budget\n           effective_mode =\
    \ self.get_effective_mode(enforcement, ratio)\n\n           if effective_mode\
    \ == 'hard_stop':\n               effective_limit = 1 + enforcement.grace_percent\n\
    \               return ratio >= effective_limit\n\n           return False\n \
    \  ```\n\n7. Hybrid Hierarchical Enforcement (all optional, disabled by default):\n\
    \n   Three optional flags on TokenEnforcement:\n   - require_children_sum_valid:\
    \ Validation-time constraint\n   - check_ancestors_during_execution: Runtime ancestor\
    \ checks\n   - block_new_children_when_exceeded: Pre-start blocking\n\n   ```python\n\
    \   class BudgetChecker:\n       def can_start_task(self, task: HierarchicalTicket)\
    \ -> CanStartResult:\n           '''Check before starting a task.'''\n       \
    \    # Check own budget headroom\n           if self._exceeds_own_budget(task):\n\
    \               return CanStartResult(allowed=False, reason=\"Task budget exceeded\"\
    )\n\n           # Optional: Check if any ancestor is exceeded\n           for\
    \ ancestor in task.ancestors:\n               enforcement = self.get_enforcement(ancestor,\
    \ 'total')\n               if not enforcement.block_new_children_when_exceeded:\n\
    \                   continue  # Skip if not enabled\n\n               if self._ancestor_exceeded(ancestor):\n\
    \                   return CanStartResult(\n                       allowed=False,\n\
    \                       reason=f\"Ancestor {ancestor.id} budget exceeded\",\n\
    \                       ancestor_id=ancestor.id,\n                   )\n\n   \
    \        return CanStartResult(allowed=True)\n\n       def check_during_execution(\n\
    \           self,\n           task: HierarchicalTicket,\n           new_usage:\
    \ int,\n           direction: str,\n       ) -> ExecutionCheckResult:\n      \
    \     '''Check during task execution.'''\n           # Always check own budget\n\
    \           result = self._check_own_budget(task, new_usage, direction)\n    \
    \       if result.should_stop:\n               return result\n\n           # Optional:\
    \ Check ancestors if enabled\n           enforcement = self.get_enforcement(task,\
    \ direction)\n           if enforcement.check_ancestors_during_execution:\n  \
    \             for ancestor in task.ancestors:\n                   ancestor_result\
    \ = self._check_ancestor_budget(\n                       ancestor, task, new_usage,\
    \ direction\n                   )\n                   if ancestor_result.should_stop:\n\
    \                       return ancestor_result\n\n           return ExecutionCheckResult(should_stop=False)\n\
    \n       def _check_ancestor_budget(\n           self,\n           ancestor: HierarchicalTicket,\n\
    \           child: HierarchicalTicket,\n           child_new_usage: int,\n   \
    \        direction: str,\n       ) -> ExecutionCheckResult:\n           '''Check\
    \ if child's new usage would exceed ancestor's budget.'''\n           # Get ancestor's\
    \ aggregated usage (includes all descendants)\n           agg_tokens = getattr(ancestor,\
    \ f'{direction}_tokens_aggregated')\n           if not agg_tokens or not agg_tokens.budget:\n\
    \               return ExecutionCheckResult(should_stop=False)\n\n           #\
    \ Project new aggregated usage\n           current_child_usage = getattr(child,\
    \ f'{direction}_tokens')\n           current_child_usage = current_child_usage.usage\
    \ if current_child_usage else 0\n           usage_delta = child_new_usage - (current_child_usage\
    \ or 0)\n           projected_usage = (agg_tokens.usage or 0) + usage_delta\n\n\
    \           ratio = projected_usage / agg_tokens.budget\n           enforcement\
    \ = self.get_enforcement(ancestor, direction)\n           effective_mode = self.get_effective_mode(enforcement,\
    \ ratio)\n\n           if effective_mode == 'hard_stop':\n               effective_limit\
    \ = 1 + enforcement.grace_percent\n               if ratio >= effective_limit:\n\
    \                   return ExecutionCheckResult(\n                       should_stop=True,\n\
    \                       reason=f\"Would exceed ancestor {ancestor.id} budget\"\
    ,\n                       ancestor_id=ancestor.id,\n                   )\n\n \
    \          return ExecutionCheckResult(should_stop=False)\n   ```\n\n   Orthogonal\
    \ Flags - All 8 Combinations Valid:\n   The three flags are fully independent.\
    \ No invalid combinations.\n\n   | require_children | check_ancestors | block_new_children\
    \ | Use Case |\n   |:---:|:---:|:---:|---|\n   | ❌ | ❌ | ❌ | Permissive: Track\
    \ only, no blocking |\n   | ❌ | ❌ | ✅ | Lazy blocking: Prevent new tasks when\
    \ over |\n   | ❌ | ✅ | ❌ | Runtime-only: Stop running, allow new |\n   | ❌ | ✅\
    \ | ✅ | Pooled + protected: Flexible with safety |\n   | ✅ | ❌ | ❌ | Upfront only:\
    \ Validate, trust runtime |\n   | ✅ | ❌ | ✅ | Upfront + pre-start: Validate +\
    \ block |\n   | ✅ | ✅ | ❌ | Validate + runtime: Catch violations |\n   | ✅ | ✅\
    \ | ✅ | Strict: Maximum protection |\n\n   Common Presets:\n   - Strict: All three\
    \ enabled - mathematically prevents exceeding parent\n   - Flexible: Only block_new_children\
    \ - allows pooled budgets\n   - Permissive: All disabled - just track usage, no\
    \ blocking\n\n8. Override Mechanism:\n   - CLI flag: --ignore-token-budget\n \
    \  - Environment variable: VIBEY_IGNORE_TOKEN_BUDGET=1\n   - Only works if enforcement.allow_override=true\n\
    \nFiles:\n- vibey/services/budget_checker.py (new)\n- vibey/services/token_tracker.py\
    \ (integrate with checker)\n"
