task:
  id: 01KCYA0G5135Z8B8ENFD841B15
  name: Add CLI token commands
  description: |
    Add new CLI commands for viewing and managing token metrics:

    1. View Task Tokens:
       vibey roadmap tokens <task-id>

       Output:
       Token Estimates for Task: <name>
       ─────────────────────────────────
       Input Tokens:
         Min:      5,000
         Target:  10,000
         Max:     20,000
         Budget:  25,000
         Actual:   8,234 (82% of target)

       Output Tokens:
         Min:      2,000
         Target:   5,000
         Max:     10,000
         Budget:  12,000
         Actual:   4,521 (90% of target)

    2. View Sprint/Track Tokens:
       vibey roadmap tokens --sprint <id>
       vibey roadmap tokens --track <id>

    3. Set Token Estimates:
       vibey roadmap update task <id> \
         --input-tokens-target 10000 \
         --output-tokens-target 5000 \
         --input-tokens-budget 25000

    4. Auto-estimate:
       vibey roadmap estimate <task-id>
       # Uses TokenEstimator to set min/max/target
