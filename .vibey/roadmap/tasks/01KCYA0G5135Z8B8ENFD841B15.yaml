task:
  id: 01KCYA0G5135Z8B8ENFD841B15
  name: Add CLI token commands
  description: |
    Add new CLI commands for viewing and managing token metrics.
    Displays data from the Tokens model (estimate/budget/usage/enforcement).

    1. View Task Tokens:
       vibey roadmap tokens <task-id>

       Output:
       Token Data for Task: <name>
       ─────────────────────────────────
       Input Tokens:
         Estimate:
           Min:      5,000
           Target:  10,000
           Max:     20,000
         Budget:    25,000
         Usage:      8,234 (82% of target, 33% of budget)
         Enforcement: warn → soft_stop@90% → hard_stop@100% [grace: 10%]

       Output Tokens:
         Estimate:
           Min:      2,000
           Target:   5,000
           Max:     10,000
         Budget:    12,000
         Usage:      4,521 (90% of target, 38% of budget)
         Enforcement: hard_stop [no grace] ⚠️ STRICTER

       Total Token Budget: 35,000
       Total Enforcement: soft_stop (from project defaults)

    2. View Sprint/Track Tokens (aggregated):
       vibey roadmap tokens --sprint <id>
       vibey roadmap tokens --track <id>
       # Uses *_tokens_aggregated computed properties from HierarchicalTicket

    3. Set Token Data:
       vibey roadmap update task <id> \
         --input-estimate-target 10000 \
         --input-estimate-min 5000 \
         --input-estimate-max 20000 \
         --input-budget 25000 \
         --output-estimate-target 5000 \
         --output-budget 12000 \
         --total-token-budget 35000

    4. Set Enforcement (per direction):
       vibey roadmap update task <id> \
         --input-enforcement-mode hard_stop \
         --input-enforcement-grace 0.1 \
         --output-enforcement-mode warn

       # Or set from YAML file for complex escalation:
       vibey roadmap update task <id> \
         --input-enforcement-file ./enforcement.yaml

    5. View Enforcement Settings:
       vibey roadmap tokens <task-id> --show-enforcement

       Shows full enforcement details including:
       - Resolution source (ticket/project/default)
       - Escalation steps
       - Current effective mode based on usage

    6. Manual Estimation:
       vibey roadmap estimate <task-id>
       # Uses TokenEstimator to set estimate.min/max/target
       # Does not set budgets or enforcement (those are manual)

       vibey roadmap estimate <sprint-id>
       # Estimate all tasks in sprint

       vibey roadmap estimate <track-id>
       # Estimate all tasks in track

    Note: For automatic estimation triggers (on creation, on start, on
    calibration update), see the auto-estimation configuration task.
