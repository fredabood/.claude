  task_type: development
  title: Add CLI token commands
  description: "Add new CLI commands for viewing and managing token metrics.\nDisplays\
    \ data from the Tokens model (estimate/budget/usage/enforcement).\n\n1. View Task\
    \ Tokens:\n   vibey roadmap tokens <task-id>\n\n   Output:\n   Token Data for\
    \ Task: <name>\n   ─────────────────────────────────\n   Input Tokens:\n     Estimate:\n\
    \       Min:      5,000\n       Target:  10,000\n       Max:     20,000\n    \
    \ Budget:    25,000\n     Usage:      8,234 (82% of target, 33% of budget)\n \
    \    Enforcement: warn → soft_stop@90% → hard_stop@100% [grace: 10%]\n\n   Output\
    \ Tokens:\n     Estimate:\n       Min:      2,000\n       Target:   5,000\n  \
    \     Max:     10,000\n     Budget:    12,000\n     Usage:      4,521 (90% of\
    \ target, 38% of budget)\n     Enforcement: hard_stop [no grace] ⚠️ STRICTER\n\
    \n   Total Token Budget: 35,000\n   Total Enforcement: soft_stop (from project\
    \ defaults)\n\n2. View Sprint/Track Tokens (aggregated):\n   vibey roadmap tokens\
    \ --sprint <id>\n   vibey roadmap tokens --track <id>\n   # Uses *_tokens_aggregated\
    \ computed properties from HierarchicalTicket\n\n3. Set Token Data:\n   vibey\
    \ roadmap update task <id> \\\n     --input-estimate-target 10000 \\\n     --input-estimate-min\
    \ 5000 \\\n     --input-estimate-max 20000 \\\n     --input-budget 25000 \\\n\
    \     --output-estimate-target 5000 \\\n     --output-budget 12000 \\\n     --total-token-budget\
    \ 35000\n\n4. Set Enforcement (per direction):\n   vibey roadmap update task <id>\
    \ \\\n     --input-enforcement-mode hard_stop \\\n     --input-enforcement-grace\
    \ 0.1 \\\n     --output-enforcement-mode warn\n\n   # Or set from YAML file for\
    \ complex escalation:\n   vibey roadmap update task <id> \\\n     --input-enforcement-file\
    \ ./enforcement.yaml\n\n5. View Enforcement Settings:\n   vibey roadmap tokens\
    \ <task-id> --show-enforcement\n\n   Shows full enforcement details including:\n\
    \   - Resolution source (ticket/project/default)\n   - Escalation steps\n   -\
    \ Current effective mode based on usage\n\n6. Manual Estimation:\n   vibey roadmap\
    \ estimate <task-id>\n   # Uses TokenEstimator to set estimate.min/max/target\n\
    \   # Does not set budgets or enforcement (those are manual)\n\n   vibey roadmap\
    \ estimate <sprint-id>\n   # Estimate all tasks in sprint\n\n   vibey roadmap\
    \ estimate <track-id>\n   # Estimate all tasks in track\n\nNote: For automatic\
    \ estimation triggers (on creation, on start, on\ncalibration update), see the\
    \ auto-estimation configuration task.\n"
