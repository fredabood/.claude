  title: Add MCP tools for token metrics
  description: "Add MCP tools for AI assistants to query and manage token metrics.\n\
    Uses the Tokens/TokenEstimate models from Sprint 1.\n\n1. Query Tools:\n   - get_task_tokens(task_id)\
    \ -> {input_tokens: Tokens, output_tokens: Tokens, total_budget: int}\n   - get_sprint_token_summary(sprint_id)\
    \ -> TokenSummary (aggregated)\n   - get_track_token_summary(track_id) -> TokenSummary\
    \ (aggregated)\n   - get_remaining_budget(task_id) -> {input: int|null, output:\
    \ int|null, total: int|null}\n\n2. Update Tools:\n   - set_task_token_estimate(task_id,\
    \ direction: 'input'|'output',\n       min: int, max: int, target: int)\n   -\
    \ set_task_token_budget(task_id, input_budget: int, output_budget: int,\n    \
    \   total_budget: int)\n   - record_token_usage(task_id, input_tokens: int, output_tokens:\
    \ int)\n     # Adds to existing usage\n\n3. Estimation Tools:\n   - estimate_task_tokens(task_id)\
    \ -> {\n       input_estimate: TokenEstimate,\n       output_estimate: TokenEstimate,\n\
    \       confidence: float\n     }\n   - estimate_from_description(description,\
    \ task_type, complexity) -> same\n\n4. Report Tools:\n   - get_token_usage_report(track_id?,\
    \ sprint_id?, date_range?) -> Report\n\nReturn types use the actual model structure:\n\
    ```python\nclass TokensResponse(TypedDict):\n    estimate: Optional[dict]  # {min,\
    \ max, target}\n    budget: Optional[int]\n    usage: Optional[int]\n```\n\nFiles:\n\
    - vibey/mcp/tools/token_tools.py (new)\n- vibey/mcp/server.py (register tools)\n"
