task:
  id: 01KCYA0G5135Z8B8ENFD841B17
  name: Add MCP tools for token metrics
  description: |
    Add MCP tools for AI assistants to query and manage token metrics:

    1. Query Tools:
       - get_task_token_estimates(task_id) -> TokenEstimate
       - get_sprint_token_summary(sprint_id) -> TokenSummary
       - get_track_token_summary(track_id) -> TokenSummary
       - get_remaining_budget(task_id) -> BudgetStatus

    2. Update Tools:
       - set_task_token_estimates(task_id, estimates: TokenEstimate)
       - set_task_token_budget(task_id, input_budget, output_budget)
       - record_token_usage(task_id, input_tokens, output_tokens)

    3. Estimation Tools:
       - estimate_task_tokens(task_id) -> TokenEstimate
       - estimate_from_description(description, task_type, complexity) -> TokenEstimate

    4. Report Tools:
       - get_token_usage_report(track_id?, sprint_id?, date_range?) -> Report

    Files:
    - vibey/mcp/tools/token_tools.py (new)
    - vibey/mcp/server.py (register tools)
