task:
  id: 01KCZF73PX9YNKWXKYVARY89N1
  name: Implement TaskSelector for finding executable tasks
  description: |
    Create TaskSelector class to find the next task to execute:

    ```python
    class TaskSelector:
        def __init__(self, roadmap_root: Path):
            self.root = roadmap_root

        def get_next_task(
            self,
            track_id: Optional[str] = None,
            sprint_id: Optional[str] = None,
        ) -> Optional[HierarchicalTicket]:
            '''
            Find next planned+unblocked task.

            Selection criteria:
            1. status == 'planned'
            2. blocked == False
            3. All depends_on are completed
            4. Ordered by priority, then creation date
            '''

        def get_all_executable(self, ...) -> List[HierarchicalTicket]:
            '''Get all currently executable tasks.'''

        def count_remaining(self, ...) -> int:
            '''Count tasks that could be executed.'''
    ```

    Implementation:
    - Query database for planned tasks
    - Filter by blocked=False
    - Check dependency status
    - Order by priority (critical > high > medium > low)
    - Return first match or None

    Files:
    - vibey/services/implementation/selector.py (new)
