  name: Implement ImplementationLoop main execution loop
  description: |
    Create the main execution loop:

    ```python
    class ImplementationLoop:
        def __init__(
            self,
            selector: TaskSelector,
            executor: TaskExecutor,
            config: ImplementConfig,
        ):
            self.selector = selector
            self.executor = executor
            self.config = config
            self.state = LoopState()

        async def run(self) -> LoopResult:
            '''
            Main execution loop.

            while not self.should_stop():
                task = self.selector.get_next_task()
                if task is None:
                    break

                self.state.current_task = task
                result = await self.executor.execute(task)
                self.handle_result(task, result)

            return self.state.to_result()
            '''

        def should_stop(self) -> bool:
            '''Check stop conditions (paused, max tasks, budget).'''

        def handle_result(self, task, result):
            '''Update task status based on result.'''
    ```

    Features:
    - Async execution with proper cancellation
    - Graceful interrupt handling (SIGINT, SIGTERM)
    - State persistence for resume capability

    Files:
