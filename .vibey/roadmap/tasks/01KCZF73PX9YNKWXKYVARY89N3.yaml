task:
  id: 01KCZF73PX9YNKWXKYVARY89N3
  name: Implement LoopState for tracking execution
  description: |
    Create LoopState class for tracking execution state:

    ```python
    @dataclass
    class LoopState:
        '''Mutable state for the execution loop.'''

        # Session info
        session_id: str = field(default_factory=lambda: str(ULID()))
        started_at: datetime = field(default_factory=lambda: datetime.now(timezone.utc))
        ended_at: Optional[datetime] = None

        # Current execution
        current_task: Optional[str] = None
        status: LoopStatus = LoopStatus.RUNNING  # running, paused, stopped, completed

        # Progress
        tasks_attempted: int = 0
        tasks_completed: int = 0
        tasks_failed: int = 0
        tasks_blocked: int = 0

        # Resource usage
        tokens_input: int = 0
        tokens_output: int = 0

        # History
        task_results: List[TaskResult] = field(default_factory=list)

        def save(self, path: Path):
            '''Persist state to file for resume.'''

        @classmethod
        def load(cls, path: Path) -> 'LoopState':
            '''Load state from file.'''
    ```

