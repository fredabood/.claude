  name: Implement TaskExecutor for running tasks via agent
  description: |
    Create TaskExecutor class to execute tasks via Claude Code agent:

    ```python
    class TaskExecutor:
        def __init__(self, config: ImplementConfig):
            self.config = config

        async def execute(self, context: TaskContext) -> ExecutionResult:
            '''
            Execute task via Claude Code agent subprocess.

            Steps:
            1. Prepare agent command with context
            2. Spawn subprocess with proper environment
            3. Stream output for monitoring
            4. Wait for completion or timeout
            5. Parse result and return ExecutionResult
            '''

        async def spawn_agent(self, context: TaskContext) -> asyncio.Process:
            '''Spawn Claude Code agent with task prompt.'''

        async def stream_output(self, process: asyncio.Process) -> str:
            '''Stream and capture agent output.'''

        def parse_result(self, output: str, returncode: int) -> ExecutionResult:
            '''Parse agent output to determine success/failure.'''
    ```

    Agent invocation:
    ```bash
    claude --print --dangerously-skip-permissions \
      --system-prompt "..." \
      "Execute task: {task_description}"
    ```

    Files:
    - vibey/services/implementation/executor.py (new)
