  title: Implement ExecutionResult for capturing outcomes
  description: "Create ExecutionResult dataclass to capture task execution outcomes:\n\
    \n```python\nclass ExecutionStatus(Enum):\n    SUCCESS = \"success\"\n    FAILURE\
    \ = \"failure\"\n    BLOCKED = \"blocked\"\n    TIMEOUT = \"timeout\"\n    CANCELLED\
    \ = \"cancelled\"\n\n@dataclass\nclass ExecutionResult:\n    '''Result of executing\
    \ a single task.'''\n\n    task_id: str\n    status: ExecutionStatus\n    started_at:\
    \ datetime\n    completed_at: datetime\n\n    # Token usage\n    tokens_input:\
    \ int = 0\n    tokens_output: int = 0\n\n    # Artifacts\n    files_modified:\
    \ List[Path] = field(default_factory=list)\n    files_created: List[Path] = field(default_factory=list)\n\
    \    commits: List[str] = field(default_factory=list)\n\n    # Output\n    stdout:\
    \ str = \"\"\n    stderr: str = \"\"\n    error_message: Optional[str] = None\n\
    \n    # Metadata\n    agent_model: str = \"claude-sonnet-4-20250514\"\n    exit_code:\
    \ int = 0\n\n    @property\n    def duration(self) -> timedelta:\n        return\
    \ self.completed_at - self.started_at\n\n    @property\n    def succeeded(self)\
    \ -> bool:\n        return self.status == ExecutionStatus.SUCCESS\n\n    def to_dict(self)\
    \ -> dict:\n        '''Serialize for logging/storage.'''\n```\n\nFiles:\n- vibey/services/implementation/result.py\
    \ (new)\n"
