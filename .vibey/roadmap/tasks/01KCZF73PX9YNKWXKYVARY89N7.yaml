            Progress: 5/12 tasks (41.7%)

            Tokens: 15,234 input / 8,456 output
            Duration: 00:23:45
            Remaining: ~00:32:00 (estimated)
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            '''

        def show_task_start(self, task: HierarchicalTicket):
            '''Display task starting notification.'''

        def show_task_complete(self, task: HierarchicalTicket, result: ExecutionResult):
            '''Display task completion with result.'''

        def show_summary(self, state: LoopState):
            '''Display final execution summary.'''

        def estimate_remaining(self) -> timedelta:
            '''Estimate time remaining based on average task duration.'''
    ```

    Use Rich library for terminal formatting.

