task:
  id: 01KCZF73PX9YNKWXKYVARY89N8
  name: Implement structured logging for execution
  description: |
    Create structured logging system for implementation mode:

    ```python
    class ExecutionLogger:
        def __init__(self, activity_log_path: Path):
            self.log_path = activity_log_path
            self.session_id: Optional[str] = None

        def start_session(self, session_id: str):
            '''Log session start event.'''
            self._log({
                "event": "session_start",
                "session_id": session_id,
                "timestamp": datetime.now(timezone.utc).isoformat(),
            })

        def log_task_start(self, task: HierarchicalTicket):
            '''Log task execution start.'''

        def log_task_complete(self, task: HierarchicalTicket, result: ExecutionResult):
            '''Log task completion with result.'''

        def log_task_error(self, task: HierarchicalTicket, error: Exception):
            '''Log task execution error.'''

        def end_session(self, state: LoopState):
            '''Log session end with summary.'''

        def _log(self, event: dict):
            '''Append event to JSONL activity log.'''
    ```

    Log format (JSONL):
    ```json
    {"event": "task_complete", "task_id": "01KC...", "status": "success", "tokens_input": 1234, ...}
    ```

    Integration with existing activity log system.

    Files:
    - vibey/services/implementation/logging.py (new)
