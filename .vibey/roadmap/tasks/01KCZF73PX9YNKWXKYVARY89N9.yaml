  name: Implement error recovery and retry logic
  description: |
    Create error recovery system for implementation mode:

    ```python
    class ErrorRecovery:
        def __init__(self, config: ImplementConfig):
            self.config = config
            self.retry_counts: Dict[str, int] = {}

        def handle_error(
            self,
            task: HierarchicalTicket,
            error: Exception,
            result: ExecutionResult,
        ) -> RecoveryAction:
            '''
            Determine recovery action for failed task.

            Returns:
            - RETRY: Retry the task (if retries remaining)
            - SKIP: Mark blocked and continue to next task
            - STOP: Stop execution loop
            '''

        def should_retry(self, task_id: str) -> bool:
            '''Check if task has retries remaining.'''
            return self.retry_counts.get(task_id, 0) < self.config.max_retries

        def record_attempt(self, task_id: str):
            '''Record retry attempt.'''

        def mark_blocked(self, task: HierarchicalTicket, reason: str):
            '''Mark task as blocked with error reason.'''

        def classify_error(self, error: Exception) -> ErrorSeverity:
            '''Classify error as transient or permanent.'''
    ```

    Recovery actions:
    ```python
    class RecoveryAction(Enum):
        RETRY = "retry"      # Retry immediately
        SKIP = "skip"        # Skip and continue
        STOP = "stop"        # Stop loop
        WAIT = "wait"        # Wait and retry (rate limit)
    ```

    Files:
    - vibey/services/implementation/recovery.py (new)
