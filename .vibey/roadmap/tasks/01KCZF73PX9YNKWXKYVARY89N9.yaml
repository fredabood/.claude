  title: Implement error recovery and retry logic
  description: "Create error recovery system for implementation mode:\n\n```python\n\
    class ErrorRecovery:\n    def __init__(self, config: ImplementConfig):\n     \
    \   self.config = config\n        self.retry_counts: Dict[str, int] = {}\n\n \
    \   def handle_error(\n        self,\n        task: HierarchicalTicket,\n    \
    \    error: Exception,\n        result: ExecutionResult,\n    ) -> RecoveryAction:\n\
    \        '''\n        Determine recovery action for failed task.\n\n        Returns:\n\
    \        - RETRY: Retry the task (if retries remaining)\n        - SKIP: Mark\
    \ blocked and continue to next task\n        - STOP: Stop execution loop\n   \
    \     '''\n\n    def should_retry(self, task_id: str) -> bool:\n        '''Check\
    \ if task has retries remaining.'''\n        return self.retry_counts.get(task_id,\
    \ 0) < self.config.max_retries\n\n    def record_attempt(self, task_id: str):\n\
    \        '''Record retry attempt.'''\n\n    def mark_blocked(self, task: HierarchicalTicket,\
    \ reason: str):\n        '''Mark task as blocked with error reason.'''\n\n   \
    \ def classify_error(self, error: Exception) -> ErrorSeverity:\n        '''Classify\
    \ error as transient or permanent.'''\n```\n\nRecovery actions:\n```python\nclass\
    \ RecoveryAction(Enum):\n    RETRY = \"retry\"      # Retry immediately\n    SKIP\
    \ = \"skip\"        # Skip and continue\n    STOP = \"stop\"        # Stop loop\n\
    \    WAIT = \"wait\"        # Wait and retry (rate limit)\n```\n\nFiles:\n- vibey/services/implementation/recovery.py\
    \ (new)\n"
