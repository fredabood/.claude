  name: Implement vibey implement CLI command
  description: |
    Add main implementation mode CLI command:

    ```python
    @cli.command()
    @click.option('--track', help='Only tasks in this track')
    @click.option('--sprint', help='Only tasks in this sprint')
    @click.option('--max-tasks', type=int, help='Stop after N tasks')
    @click.option('--max-tokens', type=int, help='Stop after N tokens')
    @click.option('--dry-run', is_flag=True, help='Show what would run')
    @click.option('--background', is_flag=True, help='Run as background process')
    def implement(track, sprint, max_tasks, max_tokens, dry_run, background):
        '''
        Run implementation mode to execute planned tasks.

        Starts execution loop that:
        1. Finds next planned+unblocked task
        2. Executes task via Claude Code agent
        3. Updates task status based on result
        4. Continues until no more tasks or limit reached

        Examples:
            vibey implement                    # Run all planned tasks
            vibey implement --track 01KC...    # Only tasks in track
            vibey implement --max-tasks 5      # Stop after 5 tasks
            vibey implement --dry-run          # Preview without executing
        '''
    ```

    Files:
    - vibey/cli/implement.py (new)
    - Update vibey/cli/main.py to register command
