  title: Implement control commands (status, pause, resume, stop)
  description: "Add control commands for managing running implementation:\n\n```python\n\
    @implement.command()\ndef status():\n    '''\n    Show current implementation\
    \ mode status.\n\n    Output:\n    - Session ID and start time\n    - Current\
    \ task being executed\n    - Progress (X/Y tasks completed)\n    - Token usage\n\
    \    - Status (running/paused/stopped)\n    '''\n\n@implement.command()\ndef pause():\n\
    \    '''\n    Pause execution after current task completes.\n\n    Sets state.status\
    \ = PAUSED\n    Loop will stop after current task finishes.\n    '''\n\n@implement.command()\n\
    def resume():\n    '''\n    Resume paused execution.\n\n    Loads state from .vibey/implementation/state.yaml\n\
    \    Continues from where it left off.\n    '''\n\n@implement.command()\ndef stop():\n\
    \    '''\n    Stop execution immediately.\n\n    Sends SIGINT to running agent\
    \ subprocess.\n    Marks current task as blocked.\n    Saves state for potential\
    \ resume.\n    '''\n```\n\nState file: .vibey/implementation/state.yaml\n\nFiles:\n\
    - vibey/cli/implement.py (update)\n"
