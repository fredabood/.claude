task:
  id: 01KCZF73PX9YNKWXKYVARY89NB
  name: Implement control commands (status, pause, resume, stop)
  description: |
    Add control commands for managing running implementation:

    ```python
    @implement.command()
    def status():
        '''
        Show current implementation mode status.

        Output:
        - Session ID and start time
        - Current task being executed
        - Progress (X/Y tasks completed)
        - Token usage
        - Status (running/paused/stopped)
        '''

    @implement.command()
    def pause():
        '''
        Pause execution after current task completes.

        Sets state.status = PAUSED
        Loop will stop after current task finishes.
        '''

    @implement.command()
    def resume():
        '''
        Resume paused execution.

        Loads state from .vibey/implementation/state.yaml
        Continues from where it left off.
        '''

    @implement.command()
    def stop():
        '''
        Stop execution immediately.

        Sends SIGINT to running agent subprocess.
        Marks current task as blocked.
        Saves state for potential resume.
        '''
    ```

    State file: .vibey/implementation/state.yaml

    Files:
    - vibey/cli/implement.py (update)
