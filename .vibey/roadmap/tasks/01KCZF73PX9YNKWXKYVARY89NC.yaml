  name: Implement configuration system for implementation mode
  description: |
    Create configuration system for implementation mode:

    Configuration file: .vibey/config/implement.yaml

    ```yaml
    implement:
      # Execution limits
      defaults:
        max_tasks_per_session: 10
        max_tokens_per_session: 100000
        max_tokens_per_task: 25000
        timeout_per_task: 600  # seconds

      # Retry behavior
      retry:
        max_retries: 2
        retry_on:
          - timeout
          - rate_limit
        skip_on:
          - syntax_error
          - import_error

      # Task selection
      selection:
        priority_order: [critical, high, medium, low]
        prefer_smaller_tasks: true
        exclude_complexity: [very_complex]

      # Agent configuration
      agent:
        model: claude-sonnet-4-20250514
        dangerously_skip_permissions: true
        print_output: true
    ```

    ```python
    @dataclass
    class ImplementConfig:
        max_tasks_per_session: int = 10
        max_tokens_per_session: int = 100000
        max_tokens_per_task: int = 25000
        timeout_per_task: int = 600
        max_retries: int = 2
        agent_model: str = "claude-sonnet-4-20250514"

        @classmethod
        def load(cls, config_path: Path) -> 'ImplementConfig':
            '''Load config from YAML file.'''

        def merge_cli_options(self, **kwargs) -> 'ImplementConfig':
            '''Override with CLI options.'''
    ```

    Files:
    - vibey/services/implementation/config.py (new)
    - .vibey/config/implement.yaml (template)
