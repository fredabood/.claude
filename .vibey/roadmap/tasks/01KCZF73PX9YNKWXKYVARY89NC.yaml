  title: Implement configuration system for implementation mode
  description: "Create configuration system for implementation mode:\n\nConfiguration\
    \ file: .vibey/config/implement.yaml\n\n```yaml\nimplement:\n  # Execution limits\n\
    \  defaults:\n    max_tasks_per_session: 10\n    max_tokens_per_session: 100000\n\
    \    max_tokens_per_task: 25000\n    timeout_per_task: 600  # seconds\n\n  # Retry\
    \ behavior\n  retry:\n    max_retries: 2\n    retry_on:\n      - timeout\n   \
    \   - rate_limit\n    skip_on:\n      - syntax_error\n      - import_error\n\n\
    \  # Task selection\n  selection:\n    priority_order: [critical, high, medium,\
    \ low]\n    prefer_smaller_tasks: true\n    exclude_complexity: [very_complex]\n\
    \n  # Agent configuration\n  agent:\n    model: claude-sonnet-4-20250514\n   \
    \ dangerously_skip_permissions: true\n    print_output: true\n```\n\n```python\n\
    @dataclass\nclass ImplementConfig:\n    max_tasks_per_session: int = 10\n    max_tokens_per_session:\
    \ int = 100000\n    max_tokens_per_task: int = 25000\n    timeout_per_task: int\
    \ = 600\n    max_retries: int = 2\n    agent_model: str = \"claude-sonnet-4-20250514\"\
    \n\n    @classmethod\n    def load(cls, config_path: Path) -> 'ImplementConfig':\n\
    \        '''Load config from YAML file.'''\n\n    def merge_cli_options(self,\
    \ **kwargs) -> 'ImplementConfig':\n        '''Override with CLI options.'''\n\
    ```\n\nFiles:\n- vibey/services/implementation/config.py (new)\n- .vibey/config/implement.yaml\
    \ (template)\n"
