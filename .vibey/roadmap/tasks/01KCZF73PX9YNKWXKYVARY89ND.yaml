  name: Implement token budget enforcement
  description: |
    Create token budget enforcement system:

    ```python
    class TokenBudget:
        def __init__(self, config: ImplementConfig):
            self.config = config
            self.session_tokens_input: int = 0
            self.session_tokens_output: int = 0

        def check_budget(self, estimated_tokens: int) -> BudgetCheck:
            '''
            Check if budget allows task execution.

            Returns:
            - ALLOWED: Within budget
            - WARNING: Near limit (>80%)
            - EXCEEDED: Over budget
            '''

        def record_usage(self, result: ExecutionResult):
            '''Record token usage from execution result.'''

        def remaining_budget(self) -> int:
            '''Calculate remaining token budget.'''

        def usage_report(self) -> dict:
            '''Generate budget usage report.'''
    ```

    Integration with ImplementationLoop:
    ```python
    async def run(self):
        while not self.should_stop():
            # Check budget before task
            budget_check = self.budget.check_budget(
                task.estimated_tokens or self.config.max_tokens_per_task
            )
            if budget_check == BudgetCheck.EXCEEDED:
                self.state.status = LoopStatus.BUDGET_EXHAUSTED
                break

            # Execute task...
            self.budget.record_usage(result)
    ```

