task:
  id: 01KCZF73PX9YNKWXKYVARY89NE
  name: Implement checkpoint and rollback support
  description: |
    Create checkpoint/rollback system for safe execution:

    ```python
    class CheckpointManager:
        def __init__(self, repo_root: Path):
            self.repo_root = repo_root

        def create_checkpoint(self, task: HierarchicalTicket) -> str:
            '''
            Create git checkpoint before task execution.

            1. Stage any uncommitted changes
            2. Create checkpoint commit
            3. Tag with task ID: checkpoint/{task_id}

            Returns checkpoint tag name.
            '''

        def rollback(self, checkpoint_tag: str):
            '''
            Rollback to checkpoint.

            1. Reset to checkpoint commit
            2. Remove checkpoint tag
            3. Log rollback event
            '''

        def list_checkpoints(self) -> List[Checkpoint]:
            '''List all checkpoint tags.'''

        def cleanup_old_checkpoints(self, keep_last: int = 10):
            '''Remove old checkpoint tags.'''

        def get_changes_since_checkpoint(self, tag: str) -> List[Path]:
            '''Get files changed since checkpoint.'''
    ```

    Configuration:
    ```yaml
    safety:
      checkpoint:
        enabled: true
        auto_rollback_on_failure: false
        keep_last: 10
    ```

    Files:
    - vibey/services/implementation/checkpoint.py (new)
