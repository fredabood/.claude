  id: 01KCZF73PX9YNKWXKYVARY89NF
  name: Implement human approval gates
  description: |
    Create human approval gate system for critical tasks:

    ```python
    class ApprovalGate:
        def __init__(self, config: ImplementConfig):
            self.config = config

        def requires_approval(self, task: HierarchicalTicket) -> bool:
            '''
            Check if task requires human approval.

            Approval required for:
            - complexity: [complex, very_complex]
            - priority: critical
            - task_type: infrastructure, security
            - Files: migrations, configs
            '''

        async def request_approval(self, task: HierarchicalTicket) -> ApprovalResult:
            '''
            Request human approval for task.

            1. Display task details
            2. Wait for user input (y/n/s)
            3. Handle timeout
            4. Return approval decision
            '''

        def notify(self, task: HierarchicalTicket, channel: str):
            '''Send notification for approval request.'''
    ```

    Approval flow:
    ```
    Task requires approval: Implement database migration

    Details:
    - Complexity: complex
    - Priority: critical
    - Files: migrations/001_add_users.py

    [A]pprove / [S]kip / [Q]uit? _
    ```

    Configuration:
    ```yaml
    safety:
      require_approval:
        - complexity: [complex, very_complex]
        - priority: critical
        - task_type: infrastructure
      approval_timeout: 300  # seconds
    ```

    Files:
    - vibey/services/implementation/approval.py (new)
