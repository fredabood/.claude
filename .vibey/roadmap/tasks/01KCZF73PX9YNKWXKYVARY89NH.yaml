  title: Implement CriterionDependencyGraph builder
  description: "Create system to build and query criterion dependency graphs:\n\n\
    ```python\nclass CriterionDependencyGraph:\n    '''\n    Graph of all criteria\
    \ across tickets with dependency relationships.\n\n    Nodes: Individual criteria\
    \ (identified by ticket_id + criterion_index)\n    Edges: Dependencies between\
    \ criteria (explicit and inferred)\n    '''\n\n    def __init__(self, roadmap_root:\
    \ Path):\n        self.root = roadmap_root\n        self.graph: nx.DiGraph = nx.DiGraph()\n\
    \n    def build(self, scope: Optional[str] = None) -> 'CriterionDependencyGraph':\n\
    \        '''\n        Build dependency graph for all criteria.\n\n        1. Load\
    \ all tickets with criteria\n        2. Parse criterion definitions\n        3.\
    \ Infer dependencies from:\n           - Explicit depends_on relationships\n \
    \          - File path references in criteria\n           - Code artifact references\n\
    \           - Test file associations\n        4. Build directed graph of dependencies\n\
    \        '''\n\n    def get_upstream_criteria(self, ticket_id: str) -> List[Criterion]:\n\
    \        '''Get all criteria that this ticket's criteria depend on.'''\n\n   \
    \ def get_downstream_criteria(self, ticket_id: str) -> List[Criterion]:\n    \
    \    '''Get all criteria that depend on this ticket's criteria.'''\n\n    def\
    \ get_affected_criteria(self, files: List[Path]) -> List[Criterion]:\n       \
    \ '''Get all criteria that could be affected by changes to files.'''\n\n    def\
    \ get_transitive_closure(self, ticket_id: str) -> Set[str]:\n        '''Get all\
    \ transitively connected ticket IDs.'''\n```\n\nCriterion reference structure:\n\
    ```python\n@dataclass\nclass CriterionRef:\n    ticket_id: str\n    criterion_index:\
    \ int\n    criterion_type: str  # artifact, code, test, etc.\n    description:\
    \ str\n    file_refs: List[Path]  # Files this criterion checks\n    status: str\
    \  # met, not_met, blocked\n```\n\nFiles:\n- vibey/services/implementation/dependency_graph.py\
    \ (new)\n"
