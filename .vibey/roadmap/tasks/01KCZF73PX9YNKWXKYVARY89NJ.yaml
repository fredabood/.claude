task:
  id: 01KCZF73PX9YNKWXKYVARY89NJ
  name: Implement CriterionSnapshot for pre-task state capture
  description: |
    Create system to capture criterion states before task execution:

    ```python
    @dataclass
    class CriterionSnapshot:
        '''
        Snapshot of criterion states at a point in time.

        Captured before each task execution to enable
        regression detection after completion.
        '''

        task_id: str
        captured_at: datetime
        criteria_states: Dict[str, CriterionState]

        @dataclass
        class CriterionState:
            ticket_id: str
            criterion_index: int
            criterion_type: str
            description: str
            status: str  # met, not_met, blocked
            last_evaluated: Optional[datetime]
            evidence: Optional[str]  # Why it passed/failed


    class SnapshotManager:
        def __init__(self, graph: CriterionDependencyGraph):
            self.graph = graph

        def capture_snapshot(self, task: HierarchicalTicket) -> CriterionSnapshot:
            '''
            Capture snapshot before task execution.

            Includes:
            1. All criteria for the current task
            2. All criteria for tasks that depend on this task
            3. All criteria that reference files this task may modify
            '''

        def evaluate_criterion(self, ref: CriterionRef) -> CriterionState:
            '''
            Evaluate current state of a criterion.

            Criterion types:
            - artifact: Check if file/directory exists
            - code: Run code analysis or grep check
            - test: Run specific test(s)
            - manual: Check for manual approval flag
            '''

        def save_snapshot(self, snapshot: CriterionSnapshot, path: Path):
            '''Persist snapshot to YAML for comparison.'''

        def load_snapshot(self, path: Path) -> CriterionSnapshot:
            '''Load snapshot from YAML.'''
    ```

    Snapshot file: .vibey/implementation/snapshots/{task_id}.yaml

    Files:
    - vibey/services/implementation/snapshot.py (new)
