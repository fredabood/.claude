  title: Implement RegressionDetector for post-task validation
  description: "Create system to detect regressions after task execution:\n\n```python\n\
    @dataclass\nclass Regression:\n    '''A criterion that changed from passing to\
    \ failing.'''\n\n    criterion_ref: CriterionRef\n    before_state: CriterionState\
    \  # Was passing\n    after_state: CriterionState   # Now failing\n    likely_cause:\
    \ Optional[str]   # Inferred from changed files\n    is_acknowledged: bool = False\n\
    \    acknowledgment: Optional[RegressionAcknowledgment] = None\n\n\n@dataclass\n\
    class RegressionReport:\n    '''Summary of all regressions detected after task\
    \ execution.'''\n\n    task_id: str\n    evaluated_at: datetime\n    total_criteria_checked:\
    \ int\n    regressions: List[Regression]\n    new_failures: List[CriterionRef]\
    \  # Criteria that were already failing\n\n    @property\n    def has_unacknowledged_regressions(self)\
    \ -> bool:\n        return any(not r.is_acknowledged for r in self.regressions)\n\
    \n    @property\n    def blocking_regressions(self) -> List[Regression]:\n   \
    \     return [r for r in self.regressions if not r.is_acknowledged]\n\n\nclass\
    \ RegressionDetector:\n    def __init__(self, snapshot_manager: SnapshotManager):\n\
    \        self.snapshot_manager = snapshot_manager\n\n    def detect_regressions(\n\
    \        self,\n        before: CriterionSnapshot,\n        task: HierarchicalTicket,\n\
    \    ) -> RegressionReport:\n        '''\n        Compare before snapshot with\
    \ current state.\n\n        For each criterion in snapshot:\n        1. Re-evaluate\
    \ current state\n        2. Compare with snapshot state\n        3. If was passing\
    \ and now failing -> regression\n        4. Infer likely cause from git diff\n\
    \        '''\n\n    def infer_cause(self, regression: Regression, changed_files:\
    \ List[Path]) -> str:\n        '''Infer what change likely caused the regression.'''\n\
    \n    def generate_report(self, report: RegressionReport) -> str:\n        '''Generate\
    \ human-readable regression report.'''\n```\n\nReport format:\n```\nRegression\
    \ Report for Task: 01KC...\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n⚠️  2\
    \ REGRESSIONS DETECTED\n\n1. [BLOCKING] Task 01KC.../Criterion #2\n   Was: ✓ Test\
    \ suite passes\n   Now: ✗ 3 tests failing\n   Likely cause: Changes to auth.py\n\
    \n2. [ACKNOWLEDGED] Task 01KC.../Criterion #1\n   Was: ✓ Legacy endpoint responds\n\
    \   Now: ✗ Endpoint removed\n   Reason: Intentional deprecation (PR #123)\n```\n\
    \nFiles:\n- vibey/services/implementation/regression.py (new)\n"
