task:
  id: 01KCZF73PX9YNKWXKYVARY89NK
  name: Implement RegressionDetector for post-task validation
  description: |
    Create system to detect regressions after task execution:

    ```python
    @dataclass
    class Regression:
        '''A criterion that changed from passing to failing.'''

        criterion_ref: CriterionRef
        before_state: CriterionState  # Was passing
        after_state: CriterionState   # Now failing
        likely_cause: Optional[str]   # Inferred from changed files
        is_acknowledged: bool = False
        acknowledgment: Optional[RegressionAcknowledgment] = None


    @dataclass
    class RegressionReport:
        '''Summary of all regressions detected after task execution.'''

        task_id: str
        evaluated_at: datetime
        total_criteria_checked: int
        regressions: List[Regression]
        new_failures: List[CriterionRef]  # Criteria that were already failing

        @property
        def has_unacknowledged_regressions(self) -> bool:
            return any(not r.is_acknowledged for r in self.regressions)

        @property
        def blocking_regressions(self) -> List[Regression]:
            return [r for r in self.regressions if not r.is_acknowledged]


    class RegressionDetector:
        def __init__(self, snapshot_manager: SnapshotManager):
            self.snapshot_manager = snapshot_manager

        def detect_regressions(
            self,
            before: CriterionSnapshot,
            task: HierarchicalTicket,
        ) -> RegressionReport:
            '''
            Compare before snapshot with current state.

            For each criterion in snapshot:
            1. Re-evaluate current state
            2. Compare with snapshot state
            3. If was passing and now failing -> regression
            4. Infer likely cause from git diff
            '''

        def infer_cause(self, regression: Regression, changed_files: List[Path]) -> str:
            '''Infer what change likely caused the regression.'''

        def generate_report(self, report: RegressionReport) -> str:
            '''Generate human-readable regression report.'''
    ```

    Report format:
    ```
    Regression Report for Task: 01KC...
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    ⚠️  2 REGRESSIONS DETECTED

    1. [BLOCKING] Task 01KC.../Criterion #2
       Was: ✓ Test suite passes
       Now: ✗ 3 tests failing
       Likely cause: Changes to auth.py

    2. [ACKNOWLEDGED] Task 01KC.../Criterion #1
       Was: ✓ Legacy endpoint responds
       Now: ✗ Endpoint removed
       Reason: Intentional deprecation (PR #123)
    ```

