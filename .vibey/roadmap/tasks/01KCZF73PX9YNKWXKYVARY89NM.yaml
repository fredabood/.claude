    \        - Valid reason from RegressionReason enum\n        - Justification explaining\
    \ why this is intentional\n        - Optional link to related ticket\n       \
    \ '''\n\n    def is_acknowledged(self, criterion_ref: CriterionRef) -> bool:\n\
    \        '''Check if a criterion has an active acknowledgment.'''\n\n    def get_acknowledgment(self,\
    \ criterion_ref: CriterionRef) -> Optional[RegressionAcknowledgment]:\n      \
    \  '''Get acknowledgment details if exists.'''\n\n    def cleanup_expired(self):\n\
    \        '''Remove expired acknowledgments.'''\n\n    def list_active_acknowledgments(self)\
    \ -> List[RegressionAcknowledgment]:\n        '''List all active regression acknowledgments.'''\n\
    \n    def prompt_for_acknowledgment(\n        self,\n        regression: Regression,\n\
