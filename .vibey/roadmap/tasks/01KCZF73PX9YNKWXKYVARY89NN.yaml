  title: Integrate regression prevention with ImplementationLoop
  description: "Wire regression prevention into the main execution loop:\n\n```python\n\
    class ImplementationLoop:\n    def __init__(\n        self,\n        selector:\
    \ TaskSelector,\n        executor: TaskExecutor,\n        config: ImplementConfig,\n\
    \        regression_detector: RegressionDetector,  # NEW\n    ):\n        self.regression_detector\
    \ = regression_detector\n        self.snapshot_manager = regression_detector.snapshot_manager\n\
    \n    async def run(self) -> LoopResult:\n        while not self.should_stop():\n\
    \            task = self.selector.get_next_task()\n            if task is None:\n\
    \                break\n\n            # NEW: Capture pre-execution snapshot\n\
    \            snapshot = self.snapshot_manager.capture_snapshot(task)\n\n     \
    \       # Execute task\n            self.state.current_task = task\n         \
    \   result = await self.executor.execute(task)\n\n            # NEW: Check for\
    \ regressions before completing\n            if result.succeeded:\n          \
    \      regression_report = self.regression_detector.detect_regressions(\n    \
    \                before=snapshot,\n                    task=task,\n          \
    \      )\n\n                if regression_report.has_unacknowledged_regressions:\n\
    \                    result = self.handle_regressions(task, regression_report)\n\
    \n            self.handle_result(task, result)\n\n        return self.state.to_result()\n\
    \n    def handle_regressions(\n        self,\n        task: HierarchicalTicket,\n\
    \        report: RegressionReport,\n    ) -> ExecutionResult:\n        '''\n \
    \       Handle detected regressions.\n\n        Options based on config:\n   \
    \     1. Block completion (default)\n        2. Prompt for acknowledgment (interactive\
    \ mode)\n        3. Auto-acknowledge with reason (if configured)\n        4. Rollback\
    \ changes (if checkpoint enabled)\n        '''\n\n    def should_block_on_regression(self,\
    \ report: RegressionReport) -> bool:\n        '''\n        Determine if regressions\
    \ should block completion.\n\n        Check config for:\n        - regression_policy:\
    \ block | warn | ignore\n        - allow_acknowledged: true | false\n        -\
    \ auto_rollback: true | false\n        '''\n```\n\nConfiguration:\n```yaml\nimplement:\n\
    \  regression:\n    enabled: true\n    policy: block  # block, warn, ignore\n\
    \    auto_rollback_on_regression: false\n    require_acknowledgment: true\n  \
    \  allowed_regression_reasons:\n      - deprecation\n      - sunset\n      - breaking_change\n\
    ```\n\nCLI integration:\n```bash\n# View regression report\nvibey implement regressions\n\
    \n# Acknowledge a regression\nvibey implement acknowledge <criterion-ref> --reason\
    \ deprecation --justification \"...\"\n\n# Force complete with regressions (requires\
    \ --force)\nvibey implement complete --force --acknowledge-regressions\n```\n\n\
    Files:\n- vibey/services/implementation/loop.py (update)\n- vibey/cli/implement.py\
    \ (update)\n"
