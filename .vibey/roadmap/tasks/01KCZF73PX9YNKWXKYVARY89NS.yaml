  title: Implement TaskPlanVerifier for plan validation and generation
  description: "Create system to verify and generate task plans before execution:\n\
    \n```python\nclass TaskPlanVerifier:\n    def __init__(self, context_root: Path):\n\
    \        self.context_root = context_root\n\n    def has_plan(self, task: HierarchicalTicket)\
    \ -> bool:\n        '''Check if task has a comprehensive plan.'''\n        plan_path\
    \ = self.get_plan_path(task)\n        return plan_path.exists() and self.is_plan_valid(plan_path)\n\
    \n    def get_plan_path(self, task: HierarchicalTicket) -> Path:\n        '''Get\
    \ path to task plan file.'''\n        # .vibey/roadmap/context/sprints/{sprint-slug}/tasks/{task-slug}/TASK_PLAN.md\n\
    \        return self.context_root / \"sprints\" / task.parent_slug / \"tasks\"\
    \ / task.slug / \"TASK_PLAN.md\"\n\n    def is_plan_valid(self, plan_path: Path)\
    \ -> bool:\n        '''\n        Validate plan covers required sections:\n   \
    \     - Objective\n        - Approach\n        - Files to modify\n        - Acceptance\
    \ criteria mapping\n        - Estimated effort\n        '''\n\n    async def generate_plan(self,\
    \ task: HierarchicalTicket) -> str:\n        '''\n        Generate comprehensive\
    \ task plan.\n\n        Uses Claude to analyze task and create plan covering:\n\
    \        1. Clear objective statement\n        2. Step-by-step approach\n    \
    \    3. Files that will be modified/created\n        4. How each criterion will\
    \ be satisfied\n        5. Potential risks and mitigations\n        6. Estimated\
    \ token usage\n        '''\n\n    def save_plan(self, task: HierarchicalTicket,\
    \ plan: str):\n        '''Save plan to context directory.'''\n\n    def load_plan(self,\
    \ task: HierarchicalTicket) -> Optional[str]:\n        '''Load existing plan if\
    \ available.'''\n```\n\nPlan template:\n```markdown\n# Task Plan: {task.name}\n\
    \n## Objective\n{Clear statement of what this task accomplishes}\n\n## Approach\n\
    1. Step one\n2. Step two\n...\n\n## Files\n- `path/to/file.py` - Description of\
    \ changes\n- `path/to/new_file.py` - New file (create)\n\n## Acceptance Criteria\n\
    | Criterion | How to Satisfy |\n|-----------|----------------|\n| {criterion 1}\
    \ | {approach} |\n\n## Risks\n- Risk 1: Mitigation\n- Risk 2: Mitigation\n\n##\
    \ Estimates\n- Tokens: ~{estimated_tokens}\n- Complexity: {complexity}\n```\n\n\
    Files:\n- vibey/services/implementation/plan_verifier.py (new)\n"
