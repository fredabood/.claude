  name: Implement TaskPlanVerifier for plan validation and generation
  description: |
    Create system to verify and generate task plans before execution:

    ```python
    class TaskPlanVerifier:
        def __init__(self, context_root: Path):
            self.context_root = context_root

        def has_plan(self, task: HierarchicalTicket) -> bool:
            '''Check if task has a comprehensive plan.'''
            plan_path = self.get_plan_path(task)
            return plan_path.exists() and self.is_plan_valid(plan_path)

        def get_plan_path(self, task: HierarchicalTicket) -> Path:
            '''Get path to task plan file.'''
            # .vibey/roadmap/context/sprints/{sprint-slug}/tasks/{task-slug}/TASK_PLAN.md
            return self.context_root / "sprints" / task.parent_slug / "tasks" / task.slug / "TASK_PLAN.md"

        def is_plan_valid(self, plan_path: Path) -> bool:
            '''
            Validate plan covers required sections:
            - Objective
            - Approach
            - Files to modify
            - Acceptance criteria mapping
            - Estimated effort
            '''

        async def generate_plan(self, task: HierarchicalTicket) -> str:
            '''
            Generate comprehensive task plan.

            Uses Claude to analyze task and create plan covering:
            1. Clear objective statement
            2. Step-by-step approach
            3. Files that will be modified/created
            4. How each criterion will be satisfied
            5. Potential risks and mitigations
            6. Estimated token usage
            '''

        def save_plan(self, task: HierarchicalTicket, plan: str):
            '''Save plan to context directory.'''

        def load_plan(self, task: HierarchicalTicket) -> Optional[str]:
            '''Load existing plan if available.'''
    ```

    Plan template:
    ```markdown
    # Task Plan: {task.name}

    ## Objective
    {Clear statement of what this task accomplishes}

    ## Approach
    1. Step one
    2. Step two
    ...

    ## Files
    - `path/to/file.py` - Description of changes
    - `path/to/new_file.py` - New file (create)

    ## Acceptance Criteria
    | Criterion | How to Satisfy |
    |-----------|----------------|
    | {criterion 1} | {approach} |

    ## Risks
    - Risk 1: Mitigation
    - Risk 2: Mitigation

    ## Estimates
    - Tokens: ~{estimated_tokens}
    - Complexity: {complexity}
    ```

    Files:
    - vibey/services/implementation/plan_verifier.py (new)
