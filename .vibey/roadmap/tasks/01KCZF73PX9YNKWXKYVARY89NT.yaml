  title: Implement RoadmapStateVerifier for YAML/SQLite sync
  description: "Create system to verify roadmap state before each task:\n\n```python\n\
    class RoadmapStateVerifier:\n    def __init__(self, roadmap_root: Path, db_path:\
    \ Path):\n        self.roadmap_root = roadmap_root\n        self.db_path = db_path\n\
    \n    def verify_sync(self) -> SyncStatus:\n        '''\n        Verify YAML files\
    \ match SQLite database.\n\n        Checks:\n        1. All YAML files have corresponding\
    \ DB records\n        2. All DB records have corresponding YAML files\n      \
    \  3. Field values match between YAML and DB\n        4. Timestamps are consistent\n\
    \        '''\n\n    def get_discrepancies(self) -> List[Discrepancy]:\n      \
    \  '''\n        Get list of all discrepancies between YAML and DB.\n\n       \
    \ Returns list of:\n        - Missing in DB\n        - Missing in YAML\n     \
    \   - Field mismatches\n        '''\n\n    def auto_fix(self, discrepancies: List[Discrepancy])\
    \ -> FixResult:\n        '''\n        Attempt to auto-fix discrepancies.\n\n \
    \       Strategy:\n        - YAML is source of truth\n        - Rebuild DB from\
    \ YAML if major discrepancies\n        - Log all fixes made\n        '''\n\n \
    \   def should_abort(self, status: SyncStatus) -> bool:\n        '''Determine\
    \ if discrepancies are severe enough to abort.'''\n```\n\nSyncStatus:\n```python\n\
    @dataclass\nclass SyncStatus:\n    is_synced: bool\n    yaml_count: int\n    db_count:\
    \ int\n    discrepancies: List[Discrepancy]\n    last_verified: datetime\n\n \
    \   @property\n    def severity(self) -> str:\n        # none, minor, major, critical\n\
    ```\n\nIntegration with loop:\n```python\nasync def run(self):\n    while not\
    \ self.should_stop():\n        # Verify state before each task\n        sync_status\
    \ = self.state_verifier.verify_sync()\n        if not sync_status.is_synced:\n\
    \            if sync_status.severity == \"critical\":\n                raise RoadmapSyncError(sync_status)\n\
    \            self.state_verifier.auto_fix(sync_status.discrepancies)\n\n     \
    \   task = self.selector.get_next_task()\n        ...\n```\n\nFiles:\n- vibey/services/implementation/state_verifier.py\
    \ (new)\n"
