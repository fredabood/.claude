task:
  id: 01KCZF73PX9YNKWXKYVARY89NT
  name: Implement RoadmapStateVerifier for YAML/SQLite sync
  description: |
    Create system to verify roadmap state before each task:

    ```python
    class RoadmapStateVerifier:
        def __init__(self, roadmap_root: Path, db_path: Path):
            self.roadmap_root = roadmap_root
            self.db_path = db_path

        def verify_sync(self) -> SyncStatus:
            '''
            Verify YAML files match SQLite database.

            Checks:
            1. All YAML files have corresponding DB records
            2. All DB records have corresponding YAML files
            3. Field values match between YAML and DB
            4. Timestamps are consistent
            '''

        def get_discrepancies(self) -> List[Discrepancy]:
            '''
            Get list of all discrepancies between YAML and DB.

            Returns list of:
            - Missing in DB
            - Missing in YAML
            - Field mismatches
            '''

        def auto_fix(self, discrepancies: List[Discrepancy]) -> FixResult:
            '''
            Attempt to auto-fix discrepancies.

            Strategy:
            - YAML is source of truth
            - Rebuild DB from YAML if major discrepancies
            - Log all fixes made
            '''

        def should_abort(self, status: SyncStatus) -> bool:
            '''Determine if discrepancies are severe enough to abort.'''
    ```

    SyncStatus:
    ```python
    @dataclass
    class SyncStatus:
        is_synced: bool
        yaml_count: int
        db_count: int
        discrepancies: List[Discrepancy]
        last_verified: datetime

        @property
        def severity(self) -> str:
            # none, minor, major, critical
    ```

    Integration with loop:
    ```python
    async def run(self):
        while not self.should_stop():
            # Verify state before each task
            sync_status = self.state_verifier.verify_sync()
            if not sync_status.is_synced:
                if sync_status.severity == "critical":
                    raise RoadmapSyncError(sync_status)
                self.state_verifier.auto_fix(sync_status.discrepancies)

            task = self.selector.get_next_task()
            ...
    ```

