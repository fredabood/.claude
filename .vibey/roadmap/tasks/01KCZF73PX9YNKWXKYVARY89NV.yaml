  title: Implement BugLogger for automatic bug ticket creation
  description: "Create system to automatically log CLI bugs during execution:\n\n\
    ```python\nclass BugLogger:\n    def __init__(self, bug_ticket_id: str, roadmap_root:\
    \ Path):\n        self.bug_ticket_id = bug_ticket_id\n        self.roadmap_root\
    \ = roadmap_root\n        self.bugs_logged: List[str] = []\n\n    def log_bug(\n\
    \        self,\n        title: str,\n        description: str,\n        context:\
    \ ExecutionContext,\n        severity: BugSeverity = BugSeverity.MEDIUM,\n   \
    \ ) -> str:\n        '''\n        Create child ticket under bug_ticket_id for\
    \ discovered bug.\n\n        Returns created ticket ID.\n        '''\n\n    def\
    \ detect_cli_error(self, output: str, command: str) -> Optional[BugReport]:\n\
    \        '''\n        Analyze CLI output for potential bugs.\n\n        Detects:\n\
    \        - Unhandled exceptions\n        - Validation errors that seem like bugs\n\
    \        - Unexpected behavior patterns\n        - Error messages suggesting implementation\
    \ issues\n        '''\n\n    def create_bug_ticket(self, report: BugReport) ->\
    \ HierarchicalTicket:\n        '''\n        Create bug ticket with:\n        -\
    \ Clear title describing the bug\n        - Steps to reproduce\n        - Expected\
    \ vs actual behavior\n        - Stack trace if available\n        - Context (task\
    \ being executed, command run)\n        '''\n\n    def get_session_bugs(self)\
    \ -> List[str]:\n        '''Get all bug ticket IDs created this session.'''\n\n\
    \    def generate_bug_summary(self) -> str:\n        '''Generate summary of bugs\
    \ found during session.'''\n```\n\nBug ticket template:\n```yaml\ntask:\n  id:\
    \ {generated_ulid}\n  name: \"Bug: {short_description}\"\n  description: |\n \
    \   ## Bug Report\n\n    **Discovered during:** Task {task_id}\n    **Command:**\
    \ `{command}`\n    **Severity:** {severity}\n\n    ### Description\n    {description}\n\
    \n    ### Steps to Reproduce\n    1. {step}\n    ...\n\n    ### Expected Behavior\n\
    \    {expected}\n\n    ### Actual Behavior\n    {actual}\n\n    ### Stack Trace\n\
    \    ```\n    {stack_trace}\n    ```\n  parent_ref: {bug_ticket_id}\n  status:\
    \ not_started\n  priority: {severity_to_priority}\n```\n\nConfiguration:\n```yaml\n\
    implement:\n  bug_logging:\n    enabled: true\n    parent_ticket: \"01KC...\"\
    \  # Designated bug logging ticket\n    auto_detect: true\n    severity_threshold:\
    \ medium  # Only log medium+ severity\n```\n\nFiles:\n- vibey/services/implementation/bug_logger.py\
    \ (new)\n"
