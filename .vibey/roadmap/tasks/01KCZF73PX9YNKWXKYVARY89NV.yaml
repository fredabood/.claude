task:
  id: 01KCZF73PX9YNKWXKYVARY89NV
  name: Implement BugLogger for automatic bug ticket creation
  description: |
    Create system to automatically log CLI bugs during execution:

    ```python
    class BugLogger:
        def __init__(self, bug_ticket_id: str, roadmap_root: Path):
            self.bug_ticket_id = bug_ticket_id
            self.roadmap_root = roadmap_root
            self.bugs_logged: List[str] = []

        def log_bug(
            self,
            title: str,
            description: str,
            context: ExecutionContext,
            severity: BugSeverity = BugSeverity.MEDIUM,
        ) -> str:
            '''
            Create child ticket under bug_ticket_id for discovered bug.

            Returns created ticket ID.
            '''

        def detect_cli_error(self, output: str, command: str) -> Optional[BugReport]:
            '''
            Analyze CLI output for potential bugs.

            Detects:
            - Unhandled exceptions
            - Validation errors that seem like bugs
            - Unexpected behavior patterns
            - Error messages suggesting implementation issues
            '''

        def create_bug_ticket(self, report: BugReport) -> HierarchicalTicket:
            '''
            Create bug ticket with:
            - Clear title describing the bug
            - Steps to reproduce
            - Expected vs actual behavior
            - Stack trace if available
            - Context (task being executed, command run)
            '''

        def get_session_bugs(self) -> List[str]:
            '''Get all bug ticket IDs created this session.'''

        def generate_bug_summary(self) -> str:
            '''Generate summary of bugs found during session.'''
    ```

    Bug ticket template:
    ```yaml
    task:
      id: {generated_ulid}
      name: "Bug: {short_description}"
      description: |
        ## Bug Report

        **Discovered during:** Task {task_id}
        **Command:** `{command}`
        **Severity:** {severity}

        ### Description
        {description}

        ### Steps to Reproduce
        1. {step}
        ...

        ### Expected Behavior
        {expected}

        ### Actual Behavior
        {actual}

        ### Stack Trace
        ```
        {stack_trace}
        ```
      parent_ref: {bug_ticket_id}
      status: not_started
      priority: {severity_to_priority}
    ```

    Configuration:
    ```yaml
    implement:
      bug_logging:
        enabled: true
        parent_ticket: "01KC..."  # Designated bug logging ticket
        auto_detect: true
        severity_threshold: medium  # Only log medium+ severity
    ```

    Files:
    - vibey/services/implementation/bug_logger.py (new)
