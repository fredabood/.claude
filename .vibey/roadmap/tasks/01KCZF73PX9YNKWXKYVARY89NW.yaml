task:
  id: 01KCZF73PX9YNKWXKYVARY89NW
  name: Implement ContextCompactor for token management
  description: |
    Create system to compact context between tasks:

    ```python
    class ContextCompactor:
        def __init__(self, config: ImplementConfig):
            self.config = config
            self.max_context_tokens = config.max_context_tokens or 50000

        def compact(self, state: LoopState, result: ExecutionResult) -> CompactedContext:
            '''
            Compact context after task completion.

            Preserves:
            - Essential session state
            - Summary of completed work
            - Critical errors/blockers
            - Next task context

            Removes:
            - Verbose execution logs
            - Transient file contents
            - Intermediate reasoning
            '''

        def summarize_task(self, task: HierarchicalTicket, result: ExecutionResult) -> str:
            '''
            Generate concise summary of completed task.

            Format:
            Task: {name}
            Status: {success/failure}
            Changes: {files modified}
            Commits: {commit hashes}
            Notes: {key observations}
            '''

        def estimate_tokens(self, context: str) -> int:
            '''Estimate token count for context string.'''

        def should_compact(self, current_tokens: int) -> bool:
            '''Determine if compaction needed based on token usage.'''

        def build_continuation_context(self, state: LoopState) -> str:
            '''
            Build minimal context for next task.

            Includes:
            - Session summary
            - Completed tasks list
            - Current roadmap state
            - Active bugs/blockers
            '''
    ```

    Compaction strategy:
    ```
    Before Compaction:
    ├── Full conversation history
    ├── All file contents read
    ├── Detailed execution logs
    └── ~80,000 tokens

    After Compaction:
    ├── Session summary (500 tokens)
    ├── Completed task summaries (1000 tokens)
    ├── Current state snapshot (500 tokens)
    └── ~2,000 tokens
    ```

    Files:
    - vibey/services/implementation/compactor.py (new)
