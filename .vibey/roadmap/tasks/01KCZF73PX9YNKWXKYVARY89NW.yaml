  description: "Create system to compact context between tasks:\n\n```python\nclass\
    \ ContextCompactor:\n    def __init__(self, config: ImplementConfig):\n      \
    \  self.config = config\n        self.max_context_tokens = config.max_context_tokens\
    \ or 50000\n\n    def compact(self, state: LoopState, result: ExecutionResult)\
    \ -> CompactedContext:\n        '''\n        Compact context after task completion.\n\
    \n        Preserves:\n        - Essential session state\n        - Summary of\
    \ completed work\n        - Critical errors/blockers\n        - Next task context\n\
    \n        Removes:\n        - Verbose execution logs\n        - Transient file\
