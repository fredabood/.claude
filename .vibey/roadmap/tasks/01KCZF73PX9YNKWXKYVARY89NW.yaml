    \      Generate concise summary of completed task.\n\n        Format:\n      \
    \  Task: {name}\n        Status: {success/failure}\n        Changes: {files modified}\n\
    \        Commits: {commit hashes}\n        Notes: {key observations}\n       \
    \ '''\n\n    def estimate_tokens(self, context: str) -> int:\n        '''Estimate\
    \ token count for context string.'''\n\n    def should_compact(self, current_tokens:\
    \ int) -> bool:\n        '''Determine if compaction needed based on token usage.'''\n\
    \n    def build_continuation_context(self, state: LoopState) -> str:\n       \
    \ '''\n        Build minimal context for next task.\n\n        Includes:\n   \
    \     - Session summary\n        - Completed tasks list\n        - Current roadmap\
    \ state\n        - Active bugs/blockers\n        '''\n```\n\nCompaction strategy:\n\
    ```\nBefore Compaction:\n├── Full conversation history\n├── All file contents\
    \ read\n├── Detailed execution logs\n└── ~80,000 tokens\n\nAfter Compaction:\n\
    ├── Session summary (500 tokens)\n├── Completed task summaries (1000 tokens)\n\
    ├── Current state snapshot (500 tokens)\n└── ~2,000 tokens\n```\n\nFiles:\n- vibey/services/implementation/compactor.py\
