task:
  id: 01KCZF73PX9YNKWXKYVARY89NX
  name: Implement PostMortemGenerator for task retrospectives
  description: |
    Create system to generate post-mortems after task completion:

    ```python
    class PostMortemGenerator:
        def __init__(self, context_root: Path):
            self.context_root = context_root

        def generate(
            self,
            task: HierarchicalTicket,
            result: ExecutionResult,
            context: ExecutionContext,
        ) -> PostMortem:
            '''
            Generate post-mortem analysis for completed task.

            Analyzes:
            - What was accomplished
            - What worked well
            - What didn't work
            - Unexpected discoveries
            - Lessons learned
            - Suggestions for similar tasks
            '''

        def save(self, task: HierarchicalTicket, post_mortem: PostMortem):
            '''Save post-mortem to task context directory.'''
            path = self.get_post_mortem_path(task)
            path.write_text(post_mortem.to_markdown())

        def get_post_mortem_path(self, task: HierarchicalTicket) -> Path:
            '''Get path for post-mortem file.'''
            # .vibey/roadmap/context/sprints/{sprint}/tasks/{task}/POST_MORTEM.md

        def aggregate_sprint_learnings(self, sprint_id: str) -> str:
            '''Aggregate learnings from all tasks in sprint.'''
    ```

    PostMortem structure:
    ```python
    @dataclass
    class PostMortem:
        task_id: str
        completed_at: datetime
        duration: timedelta
        tokens_used: int

        # Analysis
        accomplishments: List[str]
        what_worked: List[str]
        what_didnt_work: List[str]
        discoveries: List[str]
        lessons_learned: List[str]

        # Metrics
        estimated_tokens: Optional[int]
        actual_tokens: int
        token_efficiency: float  # actual / estimated

        # Artifacts
        files_modified: List[Path]
        commits: List[str]
        bugs_logged: List[str]

        def to_markdown(self) -> str:
            '''Generate markdown post-mortem document.'''
    ```

    Post-mortem template:
    ```markdown
    # Post-Mortem: {task.name}

    **Completed:** {completed_at}
    **Duration:** {duration}
    **Tokens:** {actual_tokens} (estimated: {estimated_tokens})

    ## Accomplishments
    - {accomplishment}

    ## What Worked Well
    - {success}

    ## What Didn't Work
    - {issue}

    ## Discoveries
    - {discovery}

    ## Lessons Learned
    - {lesson}

    ## Artifacts
    - Files: {files_modified}
    - Commits: {commits}
    - Bugs logged: {bugs_logged}
    ```

    Files:
    - vibey/services/implementation/post_mortem.py (new)
