  title: Implement PostMortemGenerator for task retrospectives
  description: "Create system to generate post-mortems after task completion:\n\n\
    ```python\nclass PostMortemGenerator:\n    def __init__(self, context_root: Path):\n\
    \        self.context_root = context_root\n\n    def generate(\n        self,\n\
    \        task: HierarchicalTicket,\n        result: ExecutionResult,\n       \
    \ context: ExecutionContext,\n    ) -> PostMortem:\n        '''\n        Generate\
    \ post-mortem analysis for completed task.\n\n        Analyzes:\n        - What\
    \ was accomplished\n        - What worked well\n        - What didn't work\n \
    \       - Unexpected discoveries\n        - Lessons learned\n        - Suggestions\
    \ for similar tasks\n        '''\n\n    def save(self, task: HierarchicalTicket,\
    \ post_mortem: PostMortem):\n        '''Save post-mortem to task context directory.'''\n\
    \        path = self.get_post_mortem_path(task)\n        path.write_text(post_mortem.to_markdown())\n\
    \n    def get_post_mortem_path(self, task: HierarchicalTicket) -> Path:\n    \
    \    '''Get path for post-mortem file.'''\n        # .vibey/roadmap/context/sprints/{sprint}/tasks/{task}/POST_MORTEM.md\n\
    \n    def aggregate_sprint_learnings(self, sprint_id: str) -> str:\n        '''Aggregate\
    \ learnings from all tasks in sprint.'''\n```\n\nPostMortem structure:\n```python\n\
    @dataclass\nclass PostMortem:\n    task_id: str\n    completed_at: datetime\n\
    \    duration: timedelta\n    tokens_used: int\n\n    # Analysis\n    accomplishments:\
    \ List[str]\n    what_worked: List[str]\n    what_didnt_work: List[str]\n    discoveries:\
    \ List[str]\n    lessons_learned: List[str]\n\n    # Metrics\n    estimated_tokens:\
    \ Optional[int]\n    actual_tokens: int\n    token_efficiency: float  # actual\
    \ / estimated\n\n    # Artifacts\n    files_modified: List[Path]\n    commits:\
    \ List[str]\n    bugs_logged: List[str]\n\n    def to_markdown(self) -> str:\n\
    \        '''Generate markdown post-mortem document.'''\n```\n\nPost-mortem template:\n\
    ```markdown\n# Post-Mortem: {task.name}\n\n**Completed:** {completed_at}\n**Duration:**\
    \ {duration}\n**Tokens:** {actual_tokens} (estimated: {estimated_tokens})\n\n\
    ## Accomplishments\n- {accomplishment}\n\n## What Worked Well\n- {success}\n\n\
    ## What Didn't Work\n- {issue}\n\n## Discoveries\n- {discovery}\n\n## Lessons\
    \ Learned\n- {lesson}\n\n## Artifacts\n- Files: {files_modified}\n- Commits: {commits}\n\
    - Bugs logged: {bugs_logged}\n```\n\nFiles:\n- vibey/services/implementation/post_mortem.py\
    \ (new)\n"
