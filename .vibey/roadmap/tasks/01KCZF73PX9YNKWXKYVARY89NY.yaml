task:
  id: 01KCZF73PX9YNKWXKYVARY89NY
  name: Implement LearningCapture for knowledge base building
  description: |
    Create system to capture and organize learnings:

    ```python
    class LearningCapture:
        def __init__(self, context_root: Path):
            self.context_root = context_root

        def capture_task_learnings(
            self,
            task: HierarchicalTicket,
            post_mortem: PostMortem,
        ):
            '''Extract and categorize learnings from post-mortem.'''

        def update_sprint_retrospective(self, sprint_id: str):
            '''
            Update sprint-level retrospective with aggregated learnings.

            Creates/updates:
            .vibey/roadmap/context/sprints/{sprint}/SPRINT_RETROSPECTIVE.md
            '''

        def update_track_knowledge_base(self, track_id: str):
            '''
            Update track-level knowledge base.

            Creates/updates:
            .vibey/roadmap/context/tracks/{track}/KNOWLEDGE_BASE.md
            '''

        def find_similar_tasks(self, task: HierarchicalTicket) -> List[str]:
            '''Find similar completed tasks for learning transfer.'''

        def get_relevant_learnings(self, task: HierarchicalTicket) -> List[Learning]:
            '''Get learnings relevant to upcoming task.'''
    ```

    Learning structure:
    ```python
    @dataclass
    class Learning:
        source_task_id: str
        category: LearningCategory  # pattern, anti_pattern, discovery, tip
        description: str
        applicability: List[str]  # task types, file patterns, etc.
        created_at: datetime

    class LearningCategory(Enum):
        PATTERN = "pattern"          # Good approaches to reuse
        ANTI_PATTERN = "anti_pattern"  # Things to avoid
        DISCOVERY = "discovery"      # New information found
        TIP = "tip"                  # Helpful hints
        BUG_PATTERN = "bug_pattern"  # Common bug types
    ```

    Sprint retrospective template:
    ```markdown
    # Sprint Retrospective: {sprint.name}

    **Period:** {start_date} - {end_date}
    **Tasks Completed:** {count}
    **Total Tokens:** {tokens}

    ## Key Learnings

    ### Patterns (What Worked)
    - {pattern}

    ### Anti-Patterns (What to Avoid)
    - {anti_pattern}

    ### Discoveries
    - {discovery}

    ## Metrics
    | Metric | Value |
    |--------|-------|
    | Tasks | {completed}/{total} |
    | Token Efficiency | {avg_efficiency}% |
    | Bugs Found | {bugs_found} |

    ## Recommendations for Future Sprints
    - {recommendation}
    ```

