  title: Implement IndependentTaskIdentifier for parallel grouping
  description: "Create system to identify tasks that can execute in parallel:\n\n\
    ```python\nclass IndependentTaskIdentifier:\n    def __init__(self, dependency_graph:\
    \ CriterionDependencyGraph):\n        self.graph = dependency_graph\n\n    def\
    \ find_parallel_groups(\n        self,\n        tasks: List[HierarchicalTicket],\n\
    \    ) -> List[ParallelGroup]:\n        '''\n        Identify groups of tasks\
    \ that can execute in parallel.\n\n        Tasks are independent if:\n       \
    \ 1. No direct dependency between them\n        2. No transitive dependency\n\
    \        3. No file conflicts (modifying same files)\n        4. No criterion\
    \ conflicts\n        '''\n\n    def has_dependency(self, task_a: str, task_b:\
    \ str) -> bool:\n        '''Check if task_a depends on task_b or vice versa.'''\n\
    \n    def has_file_conflict(self, task_a: str, task_b: str) -> bool:\n       \
    \ '''\n        Check if tasks modify overlapping files.\n\n        Uses task plans\
    \ to identify files each will modify.\n        '''\n\n    def get_max_parallelism(self,\
    \ tasks: List[HierarchicalTicket]) -> int:\n        '''Get maximum number of tasks\
    \ that can run in parallel.'''\n\n    def suggest_execution_order(\n        self,\n\
    \        tasks: List[HierarchicalTicket],\n    ) -> List[List[HierarchicalTicket]]:\n\
    \        '''\n        Suggest optimal execution order with parallelism.\n\n  \
    \      Returns list of \"waves\" where each wave can run in parallel.\n\n    \
    \    Example:\n        [\n            [Task A, Task B, Task C],  # Wave 1: all\
    \ independent\n            [Task D],                   # Wave 2: depends on A\n\
    \            [Task E, Task F],           # Wave 3: depends on D\n        ]\n \
    \       '''\n```\n\nParallelGroup:\n```python\n@dataclass\nclass ParallelGroup:\n\
    \    tasks: List[HierarchicalTicket]\n    wave_number: int\n    max_concurrent:\
    \ int\n    estimated_duration: Optional[timedelta]\n    file_coverage: Set[Path]\
    \  # All files this group touches\n\n    def has_conflict_with(self, other: 'ParallelGroup')\
    \ -> bool:\n        '''Check if this group conflicts with another.'''\n```\n\n\
    Files:\n- vibey/services/implementation/parallel.py (new)\n"
