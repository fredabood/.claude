    \        '''Cancel all running agents.'''\n\n    def get_agent_status(self, agent_id:\
    \ str) -> AgentStatus:\n        '''Get status of specific agent.'''\n```\n\nAgentProcess:\n\
    ```python\n@dataclass\nclass AgentProcess:\n    agent_id: str\n    task_id: str\n\
