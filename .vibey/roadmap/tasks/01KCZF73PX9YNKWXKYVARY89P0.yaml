    \ \\\n          \"{task_prompt}\"\n        '''\n\n    async def wait_for_all(\n\
    \        self,\n        agents: List[AgentProcess],\n        timeout: Optional[int]\
    \ = None,\n    ) -> List[ExecutionResult]:\n        '''Wait for all agents to\
