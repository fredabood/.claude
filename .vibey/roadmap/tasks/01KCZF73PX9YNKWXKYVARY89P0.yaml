    \  Each agent:\n        1. Gets isolated context\n        2. Works on separate\
    \ git branch (if configured)\n        3. Reports progress via shared state\n \
    \       '''\n\n    async def spawn_agent(\n        self,\n        task: HierarchicalTicket,\n\
    \        context: TaskContext,\n    ) -> AgentProcess:\n        '''\n        Spawn\
