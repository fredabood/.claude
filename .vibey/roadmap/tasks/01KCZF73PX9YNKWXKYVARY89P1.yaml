  title: Implement ResultAggregator for conflict resolution
  description: "Create system to aggregate results and resolve conflicts:\n\n```python\n\
    class ResultAggregator:\n    def __init__(self, config: ImplementConfig):\n  \
    \      self.config = config\n\n    def aggregate(\n        self,\n        results:\
    \ List[ExecutionResult],\n    ) -> AggregatedResult:\n        '''\n        Aggregate\
    \ results from parallel agents.\n\n        Handles:\n        1. Collecting all\
    \ execution results\n        2. Detecting file conflicts\n        3. Merging commits\
    \ appropriately\n        4. Updating roadmap state atomically\n        '''\n\n\
    \    def detect_conflicts(\n        self,\n        results: List[ExecutionResult],\n\
    \    ) -> List[FileConflict]:\n        '''\n        Detect files modified by multiple\
    \ agents.\n\n        Returns list of conflicts needing resolution.\n        '''\n\
    \n    async def resolve_conflicts(\n        self,\n        conflicts: List[FileConflict],\n\
    \        strategy: ConflictStrategy,\n    ) -> List[Resolution]:\n        '''\n\
    \        Resolve file conflicts.\n\n        Strategies:\n        - PROMPT: Ask\
    \ user to resolve\n        - ABORT: Rollback all parallel changes\n        - MERGE:\
    \ Attempt automatic merge\n        - LAST_WINS: Use last completion's version\n\
    \        '''\n\n    def merge_commits(\n        self,\n        results: List[ExecutionResult],\n\
    \    ) -> List[str]:\n        '''\n        Merge commits from isolated branches.\n\
    \n        If branch isolation was used:\n        1. Checkout main\n        2.\
    \ Merge each branch in order\n        3. Handle merge conflicts\n        4. Return\
    \ final commit hashes\n        '''\n\n    def update_roadmap_atomically(\n   \
    \     self,\n        results: List[ExecutionResult],\n    ):\n        '''Update\
    \ all task statuses atomically.'''\n```\n\nConflict handling:\n```python\n@dataclass\n\
    class FileConflict:\n    file_path: Path\n    agents: List[str]  # Agent IDs that\
    \ modified this file\n    contents: Dict[str, str]  # agent_id -> file content\n\
    \    conflict_type: ConflictType  # CONTENT, BOTH_CREATED, BOTH_DELETED\n\nclass\
    \ ConflictStrategy(Enum):\n    PROMPT = \"prompt\"       # Ask user\n    ABORT\
    \ = \"abort\"         # Rollback everything\n    MERGE = \"merge\"         # Try\
    \ auto-merge\n    LAST_WINS = \"last_wins\"  # Use last agent's version\n    FIRST_WINS\
    \ = \"first_wins\"  # Use first agent's version\n\n@dataclass\nclass Resolution:\n\
    \    conflict: FileConflict\n    strategy_used: ConflictStrategy\n    resolved_content:\
    \ str\n    required_manual: bool\n```\n\nAggregated result:\n```python\n@dataclass\n\
    class AggregatedResult:\n    individual_results: List[ExecutionResult]\n    conflicts_found:\
    \ List[FileConflict]\n    conflicts_resolved: List[Resolution]\n    final_commits:\
    \ List[str]\n    total_tokens: int\n    total_duration: timedelta\n    success_count:\
    \ int\n    failure_count: int\n```\n\nFiles:\n- vibey/services/implementation/aggregator.py\
    \ (new)\n"
