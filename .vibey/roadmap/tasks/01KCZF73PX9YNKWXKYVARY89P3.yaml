  title: Implement TicketBranchManager for branch lifecycle
  description: "Create system to manage git branches tied to tickets:\n\n```python\n\
    class TicketBranchManager:\n    def __init__(self, repo_root: Path, config: ImplementConfig):\n\
    \        self.repo_root = repo_root\n        self.config = config\n\n    def create_ticket_branch(self,\
    \ ticket: HierarchicalTicket) -> str:\n        '''\n        Create feature branch\
    \ for ticket.\n\n        Branch naming: implement/{ticket_id}\n        or: implement/{ticket_type}/{ticket_id}\n\
    \n        Steps:\n        1. Verify on main/default branch\n        2. Pull latest\
    \ changes\n        3. Create new branch\n        4. Push to remote with -u flag\n\
    \        '''\n\n    def checkout_ticket_branch(self, ticket: HierarchicalTicket)\
    \ -> bool:\n        '''Switch to ticket's feature branch.'''\n\n    def merge_to_main(\n\
    \        self,\n        ticket: HierarchicalTicket,\n        strategy: MergeStrategy\
    \ = MergeStrategy.SQUASH,\n    ) -> MergeResult:\n        '''\n        Merge feature\
    \ branch back to main.\n\n        Strategies:\n        - SQUASH: Single commit\
    \ with all changes\n        - MERGE: Merge commit preserving history\n       \
    \ - REBASE: Rebase onto main\n        '''\n\n    def cleanup_branch(self, ticket:\
    \ HierarchicalTicket):\n        '''Delete feature branch after successful merge.'''\n\
    \n    def get_ticket_branch_name(self, ticket: HierarchicalTicket) -> str:\n \
    \       '''Generate branch name for ticket.'''\n\n    def branch_exists(self,\
    \ ticket: HierarchicalTicket) -> bool:\n        '''Check if ticket branch already\
    \ exists.'''\n\n    def get_branch_status(self, ticket: HierarchicalTicket) ->\
    \ BranchStatus:\n        '''\n        Get status of ticket branch.\n\n       \
    \ Returns:\n        - commits_ahead: int\n        - commits_behind: int\n    \
    \    - has_conflicts: bool\n        - last_commit: datetime\n        '''\n```\n\
    \nBranch naming configuration:\n```yaml\nimplement:\n  git:\n    branch_prefix:\
    \ \"implement\"\n    branch_format: \"{prefix}/{ticket_id}\"  # or \"{prefix}/{type}/{id}\"\
    \n    auto_push: true\n    delete_after_merge: true\n```\n\nFiles:\n- vibey/services/implementation/git/branch_manager.py\
    \ (new)\n"
