task:
  id: 01KCZF73PX9YNKWXKYVARY89P3
  name: Implement TicketBranchManager for branch lifecycle
  description: |
    Create system to manage git branches tied to tickets:

    ```python
    class TicketBranchManager:
        def __init__(self, repo_root: Path, config: ImplementConfig):
            self.repo_root = repo_root
            self.config = config

        def create_ticket_branch(self, ticket: HierarchicalTicket) -> str:
            '''
            Create feature branch for ticket.

            Branch naming: implement/{ticket_id}
            or: implement/{ticket_type}/{ticket_id}

            Steps:
            1. Verify on main/default branch
            2. Pull latest changes
            3. Create new branch
            4. Push to remote with -u flag
            '''

        def checkout_ticket_branch(self, ticket: HierarchicalTicket) -> bool:
            '''Switch to ticket's feature branch.'''

        def merge_to_main(
            self,
            ticket: HierarchicalTicket,
            strategy: MergeStrategy = MergeStrategy.SQUASH,
        ) -> MergeResult:
            '''
            Merge feature branch back to main.

            Strategies:
            - SQUASH: Single commit with all changes
            - MERGE: Merge commit preserving history
            - REBASE: Rebase onto main
            '''

        def cleanup_branch(self, ticket: HierarchicalTicket):
            '''Delete feature branch after successful merge.'''

        def get_ticket_branch_name(self, ticket: HierarchicalTicket) -> str:
            '''Generate branch name for ticket.'''

        def branch_exists(self, ticket: HierarchicalTicket) -> bool:
            '''Check if ticket branch already exists.'''

        def get_branch_status(self, ticket: HierarchicalTicket) -> BranchStatus:
            '''
            Get status of ticket branch.

            Returns:
            - commits_ahead: int
            - commits_behind: int
            - has_conflicts: bool
            - last_commit: datetime
            '''
    ```

    Branch naming configuration:
    ```yaml
    implement:
      git:
        branch_prefix: "implement"
        branch_format: "{prefix}/{ticket_id}"  # or "{prefix}/{type}/{id}"
        auto_push: true
        delete_after_merge: true
    ```

    Files:
    - vibey/services/implementation/git/branch_manager.py (new)
