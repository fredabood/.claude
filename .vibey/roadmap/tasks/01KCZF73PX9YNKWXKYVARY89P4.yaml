  title: Implement CommitFrequencyEnforcer for disciplined commits
  description: "Create system to enforce commit frequency during execution:\n\n```python\n\
    class CommitFrequencyEnforcer:\n    def __init__(self, config: ImplementConfig):\n\
    \        self.config = config\n        self.last_commit_at: Optional[datetime]\
    \ = None\n        self.uncommitted_changes: List[Path] = []\n        self.commit_count:\
    \ int = 0\n\n    def check_commit_needed(self) -> CommitCheck:\n        '''\n\
    \        Check if a commit is needed based on:\n        - Time since last commit\n\
    \        - Number of files changed\n        - Lines of code changed\n        -\
    \ Logical completion points\n        '''\n\n    def get_uncommitted_changes(self)\
    \ -> List[Path]:\n        '''Get list of files with uncommitted changes.'''\n\n\
    \    def should_commit_now(self) -> bool:\n        '''\n        Determine if commit\
    \ needed now.\n\n        Triggers:\n        - Max time between commits exceeded\n\
    \        - Max files changed exceeded\n        - Logical breakpoint reached\n\
    \        - Approaching token limit\n        '''\n\n    def create_wip_commit(self)\
    \ -> str:\n        '''\n        Create work-in-progress commit.\n\n        Message\
    \ format:\n        wip({ticket_id}): Work in progress\n\n        Changes:\n  \
    \      - file1.py\n        - file2.py\n\n        Progress: 60% complete\n    \
    \    '''\n\n    def create_logical_commit(\n        self,\n        description:\
    \ str,\n        files: Optional[List[Path]] = None,\n    ) -> str:\n        '''\n\
    \        Create commit at logical breakpoint.\n\n        Message format:\n   \
    \     feat({ticket_id}): {description}\n        '''\n\n    def get_commit_stats(self)\
    \ -> CommitStats:\n        '''Get statistics about commits this session.'''\n\
    ```\n\nFrequency configuration:\n```yaml\nimplement:\n  git:\n    commit_frequency:\n\
    \      max_minutes_between: 15\n      max_files_changed: 10\n      max_lines_changed:\
    \ 500\n      on_subtask_complete: true\n      wip_on_pause: true\n```\n\nIntegration\
    \ with loop:\n```python\nasync def run(self):\n    while not self.should_stop():\n\
    \        # ... execute task ...\n\n        # Check commit frequency\n        if\
    \ self.commit_enforcer.should_commit_now():\n            self.commit_enforcer.create_wip_commit()\n\
    \n        # After task complete\n        self.commit_enforcer.create_logical_commit(\n\
    \            f\"Complete: {task.name}\"\n        )\n```\n\nFiles:\n- vibey/services/implementation/git/commit_enforcer.py\
    \ (new)\n"
