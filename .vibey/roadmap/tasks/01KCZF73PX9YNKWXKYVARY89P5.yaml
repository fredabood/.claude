  name: Implement TicketCommitLinker for commit-ticket association
  description: |
    Create system to link all commits to tickets:

    ```python
    class TicketCommitLinker:
        def __init__(self, repo_root: Path):
            self.repo_root = repo_root

        def create_linked_commit(
            self,
            ticket: HierarchicalTicket,
            message: str,
            files: Optional[List[Path]] = None,
            commit_type: str = "feat",
        ) -> str:
            '''
            Create commit with ticket metadata.

            Commit message format:
            {type}({ticket_id}): {message}

            {detailed_description}

            Task: {ticket_id}
            Sprint: {sprint_id}
            Track: {track_id}
            Agent: claude-code
            Session: {session_id}
            '''

        def validate_commit_message(self, message: str, ticket: HierarchicalTicket) -> bool:
            '''Validate commit message follows required format.'''

        def update_ticket_commits(self, ticket: HierarchicalTicket, commit_hash: str):
            '''
            Update ticket YAML with commit reference.

            Adds to commits_local field:
            - hash: abc123
              message: "feat(01KC...): Add user auth"
              timestamp: 2025-12-20T17:00:00Z
            '''

        def get_ticket_commits(self, ticket: HierarchicalTicket) -> List[CommitRef]:
            '''Get all commits associated with ticket.'''

        def generate_commit_summary(self, ticket: HierarchicalTicket) -> str:
            '''Generate summary of all commits for ticket.'''

        def get_commits_since(self, since: datetime) -> List[CommitRef]:
            '''Get all implementation mode commits since datetime.'''

        def on_post_commit(self, commit_hash: str, ticket: HierarchicalTicket):
            '''
            Post-commit hook handler. Triggers:
            1. Token usage recording
            2. Context dump
            3. Ticket YAML update
            '''
            # 1. Record token usage
            token_tracker = TokenTracker.get_active(ticket.id)
            if token_tracker:
                token_tracker.on_commit(commit_hash)

            # 2. Dump context
            self.context_dumper.dump_commit_context(
                ticket_id=ticket.id,
                commit_sha=commit_hash,
                output_dir=Path(f".vibey/context/commits/{commit_hash}/"),
            )

            # 3. Update ticket
            self.update_ticket_commits(ticket, commit_hash)
    ```

    Post-commit context dump:
    ```python
    class CommitContextDumper:
        def dump_commit_context(
            self,
            ticket_id: str,
            commit_sha: str,
            output_dir: Path,
        ):
            '''
            Dump full context state at commit time.

            Creates:
            .vibey/context/commits/<sha>/
            ├── usage.yaml       # Token usage (from TokenTracker)
            ├── context.yaml     # Current conversation/task context
            ├── files.yaml       # Files modified in this commit
            ├── decisions.yaml   # Key decisions made
            └── state.yaml       # Task state snapshot
            '''
            output_dir.mkdir(parents=True, exist_ok=True)

            # Context snapshot
            self._dump_context(output_dir / "context.yaml", ticket_id)

            # Files modified
            self._dump_files(output_dir / "files.yaml", commit_sha)

            # Decisions (if tracked)
            self._dump_decisions(output_dir / "decisions.yaml", ticket_id)

            # Task state
            self._dump_state(output_dir / "state.yaml", ticket_id)
    ```

    Commit types:
    ```python
    class CommitType(Enum):
        FEAT = "feat"       # New feature
        FIX = "fix"         # Bug fix
        WIP = "wip"         # Work in progress
        REFACTOR = "refactor"
        DOCS = "docs"
        TEST = "test"
        CHORE = "chore"
    ```

    Commit message templates:
    ```yaml
    implement:
      git:
        commit_format: |
          {type}({ticket_id}): {message}

          {body}

          Task: {ticket_id}
          Sprint: {sprint_id}
          Track: {track_id}
        require_ticket_reference: true
        auto_update_ticket: true
    ```

