  title: Implement TicketCommitLinker for commit-ticket association
  description: "Create system to link all commits to tickets:\n\n```python\nclass\
    \ TicketCommitLinker:\n    def __init__(self, repo_root: Path):\n        self.repo_root\
    \ = repo_root\n\n    def create_linked_commit(\n        self,\n        ticket:\
    \ HierarchicalTicket,\n        message: str,\n        files: Optional[List[Path]]\
    \ = None,\n        commit_type: str = \"feat\",\n    ) -> str:\n        '''\n\
    \        Create commit with ticket metadata.\n\n        Commit message format:\n\
    \        {type}({ticket_id}): {message}\n\n        {detailed_description}\n\n\
    \        Task: {ticket_id}\n        Sprint: {sprint_id}\n        Track: {track_id}\n\
    \        Agent: claude-code\n        Session: {session_id}\n        '''\n\n  \
    \  def validate_commit_message(self, message: str, ticket: HierarchicalTicket)\
    \ -> bool:\n        '''Validate commit message follows required format.'''\n\n\
    \    def update_ticket_commits(self, ticket: HierarchicalTicket, commit_hash:\
    \ str):\n        '''\n        Update ticket YAML with commit reference.\n\n  \
    \      Adds to commits_local field:\n        - hash: abc123\n          message:\
    \ \"feat(01KC...): Add user auth\"\n          timestamp: 2025-12-20T17:00:00Z\n\
    \        '''\n\n    def get_ticket_commits(self, ticket: HierarchicalTicket) ->\
    \ List[CommitRef]:\n        '''Get all commits associated with ticket.'''\n\n\
    \    def generate_commit_summary(self, ticket: HierarchicalTicket) -> str:\n \
    \       '''Generate summary of all commits for ticket.'''\n\n    def get_commits_since(self,\
    \ since: datetime) -> List[CommitRef]:\n        '''Get all implementation mode\
    \ commits since datetime.'''\n\n    def on_post_commit(self, commit_hash: str,\
    \ ticket: HierarchicalTicket):\n        '''\n        Post-commit hook handler.\
    \ Triggers:\n        1. Token usage recording\n        2. Context dump\n     \
    \   3. Ticket YAML update\n        '''\n        # 1. Record token usage\n    \
    \    token_tracker = TokenTracker.get_active(ticket.id)\n        if token_tracker:\n\
    \            token_tracker.on_commit(commit_hash)\n\n        # 2. Dump context\n\
    \        self.context_dumper.dump_commit_context(\n            ticket_id=ticket.id,\n\
    \            commit_sha=commit_hash,\n            output_dir=Path(f\".vibey/context/commits/{commit_hash}/\"\
    ),\n        )\n\n        # 3. Update ticket\n        self.update_ticket_commits(ticket,\
    \ commit_hash)\n```\n\nPost-commit context dump:\n```python\nclass CommitContextDumper:\n\
    \    def dump_commit_context(\n        self,\n        ticket_id: str,\n      \
    \  commit_sha: str,\n        output_dir: Path,\n    ):\n        '''\n        Dump\
    \ full context state at commit time.\n\n        Creates:\n        .vibey/context/commits/<sha>/\n\
    \        ├── usage.yaml       # Token usage (from TokenTracker)\n        ├── context.yaml\
    \     # Current conversation/task context\n        ├── files.yaml       # Files\
    \ modified in this commit\n        ├── decisions.yaml   # Key decisions made\n\
    \        └── state.yaml       # Task state snapshot\n        '''\n        output_dir.mkdir(parents=True,\
    \ exist_ok=True)\n\n        # Context snapshot\n        self._dump_context(output_dir\
    \ / \"context.yaml\", ticket_id)\n\n        # Files modified\n        self._dump_files(output_dir\
    \ / \"files.yaml\", commit_sha)\n\n        # Decisions (if tracked)\n        self._dump_decisions(output_dir\
    \ / \"decisions.yaml\", ticket_id)\n\n        # Task state\n        self._dump_state(output_dir\
    \ / \"state.yaml\", ticket_id)\n```\n\nCommit types:\n```python\nclass CommitType(Enum):\n\
    \    FEAT = \"feat\"       # New feature\n    FIX = \"fix\"         # Bug fix\n\
    \    WIP = \"wip\"         # Work in progress\n    REFACTOR = \"refactor\"\n \
    \   DOCS = \"docs\"\n    TEST = \"test\"\n    CHORE = \"chore\"\n```\n\nCommit\
    \ message templates:\n```yaml\nimplement:\n  git:\n    commit_format: |\n    \
    \  {type}({ticket_id}): {message}\n\n      {body}\n\n      Task: {ticket_id}\n\
    \      Sprint: {sprint_id}\n      Track: {track_id}\n    require_ticket_reference:\
    \ true\n    auto_update_ticket: true\n```\n\nFiles:\n- vibey/services/implementation/git/commit_linker.py\
    \ (new)\n- vibey/services/implementation/git/context_dumper.py (new)\n\nCross-reference:\
    \ Token Estimation Sprint 3 (TokenTracker.on_commit)\nprovides the token usage\
    \ recording called by on_post_commit().\n"
