  name: Implement GitRequirementsEnforcer for strict validation
  description: |
    Create system to enforce strict git requirements in implementation mode:

    ```python
    class GitRequirementsEnforcer:
        def __init__(self, config: ImplementConfig):
            self.config = config

        def validate_preconditions(self) -> ValidationResult:
            '''
            Validate all git preconditions before task execution.

            Checks:
            1. Working tree is clean (no uncommitted changes)
            2. On correct branch (main or ticket branch)
            3. Branch is up to date with remote
            4. No merge conflicts pending
            5. Git hooks are installed
            '''

        def validate_clean_tree(self) -> bool:
            '''Verify no uncommitted changes exist.'''

        def validate_branch_state(self, expected: str) -> bool:
            '''Verify on expected branch.'''

        def validate_remote_sync(self) -> SyncStatus:
            '''
            Verify local is synced with remote.

            Returns:
            - is_synced: bool
            - ahead_by: int
            - behind_by: int
            '''

        def enforce_requirements(self, ticket: HierarchicalTicket) -> EnforcementResult:
            '''
            Run all requirement checks and enforce them.

            On failure:
            - Log detailed error
            - Suggest remediation
            - Block execution
            '''

        def auto_remediate(self, issues: List[GitIssue]) -> RemediationResult:
            '''
            Attempt to auto-fix git issues.

            Can auto-fix:
            - Stash uncommitted changes
            - Pull latest from remote
            - Checkout correct branch

            Cannot auto-fix:
            - Merge conflicts
            - Diverged branches
            '''
    ```

    Requirement levels:
    ```python
    class RequirementLevel(Enum):
        STRICT = "strict"       # Block on any violation
        STANDARD = "standard"   # Block on major, warn on minor
        RELAXED = "relaxed"     # Warn only, don't block
    ```

    Configuration:
    ```yaml
    implement:
      git:
        requirements:
          level: strict  # strict, standard, relaxed
          clean_tree: required
          branch_sync: required
          hooks_installed: required
          auto_remediate: true
          stash_on_dirty: true
    ```

    Integration with loop:
    ```python
    async def run(self):
        # Validate before starting
        validation = self.git_enforcer.validate_preconditions()
        if not validation.passed:
            if self.config.auto_remediate:
                remediation = self.git_enforcer.auto_remediate(validation.issues)
                if not remediation.success:
                    raise GitRequirementsError(validation, remediation)
            else:
                raise GitRequirementsError(validation)

        while not self.should_stop():
            task = self.selector.get_next_task()

            # Validate before each task
            self.git_enforcer.enforce_requirements(task)

            # Create ticket branch
            self.branch_manager.create_ticket_branch(task)

            # ... execute ...
    ```

