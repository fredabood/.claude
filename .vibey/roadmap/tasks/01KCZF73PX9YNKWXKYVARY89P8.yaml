  title: Implement ContentVersioner core versioning system
  description: "Create core content versioning infrastructure:\n\n```python\n@dataclass\n\
    class ContentVersion:\n    '''Immutable version of content at a point in time.'''\n\
    \n    version_id: str  # ULID\n    ticket_id: str\n    stage: VersionStage  #\
    \ PLAN, EXECUTION, POST_MORTEM\n    content_hash: str  # SHA256 of content\n \
    \   content: str  # Full content snapshot\n    timestamp: datetime\n    author:\
    \ str  # agent ID or user\n    parent_version: Optional[str]  # Previous version\
    \ ID\n    change_summary: Optional[str]\n    metadata: Dict[str, Any]\n\n    def\
    \ to_yaml(self) -> str:\n        '''Serialize version to YAML.'''\n\n    @classmethod\n\
    \    def from_yaml(cls, yaml_str: str) -> 'ContentVersion':\n        '''Deserialize\
    \ from YAML.'''\n\n\nclass VersionStage(Enum):\n    PLAN = \"plan\"\n    EXECUTION\
    \ = \"execution\"\n    POST_MORTEM = \"post_mortem\"\n\n\nclass ContentVersioner:\n\
    \    def __init__(self, versions_root: Path):\n        self.versions_root = versions_root\n\
    \n    def create_version(\n        self,\n        ticket_id: str,\n        stage:\
    \ VersionStage,\n        content: str,\n        author: str,\n        change_summary:\
    \ Optional[str] = None,\n    ) -> ContentVersion:\n        '''\n        Create\
    \ new version of content.\n\n        1. Compute content hash\n        2. Get parent\
    \ version (current)\n        3. Create version record\n        4. Save to version\
    \ directory\n        5. Update current symlink\n        '''\n\n    def get_current(self,\
    \ ticket_id: str, stage: VersionStage) -> Optional[ContentVersion]:\n        '''Get\
    \ current (latest) version for stage.'''\n\n    def get_version(self, version_id:\
    \ str) -> Optional[ContentVersion]:\n        '''Get specific version by ID.'''\n\
    \n    def get_history(\n        self,\n        ticket_id: str,\n        stage:\
    \ Optional[VersionStage] = None,\n    ) -> List[ContentVersion]:\n        '''Get\
    \ version history for ticket, optionally filtered by stage.'''\n\n    def compute_hash(self,\
    \ content: str) -> str:\n        '''Compute SHA256 hash of content.'''\n\n   \
    \ def has_changed(self, ticket_id: str, stage: VersionStage, content: str) ->\
    \ bool:\n        '''Check if content differs from current version.'''\n```\n\n\
    Storage structure:\n```\n.vibey/roadmap/versions/\n└── {ticket_id}/\n    ├── plan/\n\
    \    │   ├── {version_id}.yaml\n    │   └── current.yaml -> {latest_version_id}.yaml\n\
    \    ├── execution/\n    │   └── ...\n    └── post_mortem/\n        └── ...\n\
    ```\n\nFiles:\n- vibey/services/implementation/versioning/core.py (new)\n"
