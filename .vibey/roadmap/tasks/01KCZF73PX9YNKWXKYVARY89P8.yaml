task:
  id: 01KCZF73PX9YNKWXKYVARY89P8
  name: Implement ContentVersioner core versioning system
  description: |
    Create core content versioning infrastructure:

    ```python
    @dataclass
    class ContentVersion:
        '''Immutable version of content at a point in time.'''

        version_id: str  # ULID
        ticket_id: str
        stage: VersionStage  # PLAN, EXECUTION, POST_MORTEM
        content_hash: str  # SHA256 of content
        content: str  # Full content snapshot
        timestamp: datetime
        author: str  # agent ID or user
        parent_version: Optional[str]  # Previous version ID
        change_summary: Optional[str]
        metadata: Dict[str, Any]

        def to_yaml(self) -> str:
            '''Serialize version to YAML.'''

        @classmethod
        def from_yaml(cls, yaml_str: str) -> 'ContentVersion':
            '''Deserialize from YAML.'''


    class VersionStage(Enum):
        PLAN = "plan"
        EXECUTION = "execution"
        POST_MORTEM = "post_mortem"


    class ContentVersioner:
        def __init__(self, versions_root: Path):
            self.versions_root = versions_root

        def create_version(
            self,
            ticket_id: str,
            stage: VersionStage,
            content: str,
            author: str,
            change_summary: Optional[str] = None,
        ) -> ContentVersion:
            '''
            Create new version of content.

            1. Compute content hash
            2. Get parent version (current)
            3. Create version record
            4. Save to version directory
            5. Update current symlink
            '''

        def get_current(self, ticket_id: str, stage: VersionStage) -> Optional[ContentVersion]:
            '''Get current (latest) version for stage.'''

        def get_version(self, version_id: str) -> Optional[ContentVersion]:
            '''Get specific version by ID.'''

        def get_history(
            self,
            ticket_id: str,
            stage: Optional[VersionStage] = None,
        ) -> List[ContentVersion]:
            '''Get version history for ticket, optionally filtered by stage.'''

        def compute_hash(self, content: str) -> str:
            '''Compute SHA256 hash of content.'''

        def has_changed(self, ticket_id: str, stage: VersionStage, content: str) -> bool:
            '''Check if content differs from current version.'''
    ```

    Storage structure:
    ```
    .vibey/roadmap/versions/
    └── {ticket_id}/
        ├── plan/
        │   ├── {version_id}.yaml
        │   └── current.yaml -> {latest_version_id}.yaml
        ├── execution/
        │   └── ...
        └── post_mortem/
            └── ...
    ```

    Files:
    - vibey/services/implementation/versioning/core.py (new)
