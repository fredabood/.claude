task:
  id: 01KCZF73PX9YNKWXKYVARY89P9
  name: Implement PlanVersioner for plan stage versioning
  description: |
    Create versioning system for the PLAN stage:

    ```python
    class PlanVersioner:
        def __init__(self, versioner: ContentVersioner):
            self.versioner = versioner

        def version_plan_creation(
            self,
            ticket: HierarchicalTicket,
            plan: str,
            author: str,
        ) -> ContentVersion:
            '''
            Create initial plan version.

            Called when:
            - Task plan first generated
            - Plan created manually
            '''

        def version_plan_revision(
            self,
            ticket: HierarchicalTicket,
            revised_plan: str,
            author: str,
            reason: str,
        ) -> ContentVersion:
            '''
            Create version for plan revision.

            Called when:
            - Plan refined based on feedback
            - Scope adjusted
            - Approach changed
            '''

        def version_pre_execution_snapshot(
            self,
            ticket: HierarchicalTicket,
            author: str,
        ) -> ContentVersion:
            '''
            Create final plan snapshot before execution.

            Captures:
            - Approved plan
            - All acceptance criteria
            - Estimated resources
            - Dependencies confirmed
            '''

        def get_plan_diff(
            self,
            ticket_id: str,
            from_version: str,
            to_version: str,
        ) -> PlanDiff:
            '''
            Generate diff between two plan versions.

            Shows:
            - Added sections
            - Removed sections
            - Changed content
            '''

        def rollback_plan(
            self,
            ticket: HierarchicalTicket,
            to_version: str,
            author: str,
        ) -> ContentVersion:
            '''Rollback plan to previous version.'''
    ```

    Plan version metadata:
    ```python
    @dataclass
    class PlanVersionMetadata:
        plan_status: str  # draft, review, approved, executing
        criteria_count: int
        estimated_tokens: Optional[int]
        files_planned: List[str]
        reviewer: Optional[str]
        approval_timestamp: Optional[datetime]
    ```

    Integration:
    ```python
    # In TaskPlanVerifier
    async def generate_plan(self, task: HierarchicalTicket) -> str:
        plan = await self._generate_plan_content(task)

        # Version the plan creation
        self.plan_versioner.version_plan_creation(
            ticket=task,
            plan=plan,
            author="claude-code",
        )

        return plan
    ```

