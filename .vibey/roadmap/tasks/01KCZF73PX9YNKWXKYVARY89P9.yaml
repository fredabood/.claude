  description: "Create versioning system for the PLAN stage:\n\n```python\nclass PlanVersioner:\n\
    \    def __init__(self, versioner: ContentVersioner):\n        self.versioner\
    \ = versioner\n\n    def version_plan_creation(\n        self,\n        ticket:\
