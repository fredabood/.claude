task:
  id: 01KD438MN86VRXS70K6BPZNB51
  name: Add deferred column to database schema
  description: |
    The YAML files have a `deferred: true` field for tasks that are intentionally
    put on hold, but this field is not stored in the SQLite database. This causes
    data loss when querying the database.

    Root cause: The tasks table schema doesn't have a `deferred` column.

    Solution: Add a `deferred INTEGER NOT NULL DEFAULT 0` column to the tasks table
    and update the sql_dumper to write it and sql_loader to read it.
