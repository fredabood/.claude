task:
  id: 01KD438MN86VRXS70K6BPZNB52
  name: Sprint auto-progress should skip deferred tasks
  description: |
    Sprints with only deferred incomplete tasks should auto-progress to completed
    or production_ready status. Currently, a sprint remains in_progress even when
    all non-deferred tasks are complete.

    Example: Sprint 10 Validation and Sync Bugs has 4/5 tasks complete, but the
    5th task is deferred. The sprint status is in_progress but should be complete.

    Root cause: The auto-progress logic counts all incomplete tasks, not just
    non-deferred incomplete tasks.

    Solution: Update the sprint/track auto-progress logic to exclude deferred tasks
    from the incomplete count.
