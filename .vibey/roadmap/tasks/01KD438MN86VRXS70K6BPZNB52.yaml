  task_type: development
  title: Sprint auto-progress should skip deferred tasks
  description: |
    **Problem:** Sprints with only deferred incomplete tasks remain in_progress
    instead of auto-progressing to completed.

    **Reproduction:**
    1. Find sprint where all incomplete tasks are marked `deferred: true`
    2. Run: vibey roadmap auto-progress --check
    3. Expected: Sprint ready to progress. Actual: Remains in_progress

    **Root Cause Analysis:**
    Code in `vibey/operations/roadmap/update.py:1658-1683` already excludes deferred:
    ```python
    def is_deferred(t):
        return getattr(t, 'deferred', False)
    dev_tasks = [t for t in tasks if ... and not is_deferred(t)]
    ```
    This was implemented 2025-12-23. May already be fixed - needs verification.

    **Implementation Plan:**
    1. Verify fix is working with known deferred sprint
    2. If broken, check MockTask.deferred assignment at line 1645
    3. Verify deferred field loads correctly from YAML and DB

    **Files to Check:**
    - vibey/operations/roadmap/update.py:1645 (MockTask.deferred)
    - vibey/roadmap/serialization/yaml_loader.py
    - vibey/roadmap/serialization/sql_loader.py

    **Verification:**
    - `vibey roadmap auto-progress --check` shows deferred sprints as completable
    - `sqlite3 .vibey/roadmap.db "SELECT id, deferred FROM tasks WHERE deferred=1"`
