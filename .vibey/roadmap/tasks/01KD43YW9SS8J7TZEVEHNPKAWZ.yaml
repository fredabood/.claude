task:
  id: 01KD43YW9SS8J7TZEVEHNPKAWZ
  name: CLI edit validation doesn't recognize production_ready status
  description: |
    The `vibey roadmap edit file` command fails with validation error when
    editing files that have status=production_ready. The validator only
    recognizes ['not_started', 'in_progress', 'blocked', 'completed'].

    Error message:
    "Invalid status: production_ready (must be one of ['not_started', 'in_progress', 'blocked', 'completed'])"

    Root cause: The SafeYamlEditor validator has an incomplete list of valid statuses.

    Solution: Update the validator to include all TicketStatus enum values:
    - not_started, in_progress, paused, completion_gate_check, completed,
    - production_gate_check, production_ready, deployed, wont_do, superseded
  format_version: v2
