  task_type: development
  title: CLI revert doesn't support production_ready to in_progress
  description: 'The `vibey roadmap revert` command cannot revert tracks/sprints from

    production_ready status back to in_progress. This prevents correcting

    premature production_ready transitions.


    Error message:

    "Cannot revert track from ''production_ready'' to ''in_progress''. Valid transitions
    from ''production_ready'': []"


    Root cause: The revert command only supports limited status transitions.


    Solution: Update the revert command to support:

    - production_ready -> in_progress

    - production_ready -> completed (for intermediate revert)

    - deployed -> production_ready

    - deployed -> completed

    '
