task:
  id: 01KD45TRMDZSWFHDYC3CBN6X51
  name: Fix blocker_type CHECK constraint violation in YAML data
  description: |
    Database rebuild fails with CHECK constraint error:
    "CHECK constraint failed: blocker_type IN ('track', 'sprint', 'task')"

    This indicates one or more YAML files have an invalid blocker_type value
    in their blocks/blocked_by/depends_on fields.

    Root cause: Some entity has a blocker_type that is not one of:
    'track', 'sprint', 'task'

    Solution:
    1. Search all YAML files for blocker_type fields
    2. Identify invalid values (e.g., 'roadmap', empty string, typos)
    3. Correct the invalid values to valid types
    4. Verify database rebuild succeeds

    This task blocks Task 1 (deferred column) because the database cannot
    be rebuilt until this data integrity issue is fixed.
