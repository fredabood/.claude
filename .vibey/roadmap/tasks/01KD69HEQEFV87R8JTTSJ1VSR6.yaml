  title: "CLI: vibey roadmap db rebuild fails with missing SQLAlchemy"
  description: |
    When running `vibey roadmap db rebuild`, the command fails with:
    ```
    ModuleNotFoundError: No module named 'sqlalchemy'
    ```

    This indicates SQLAlchemy is not properly included as a dependency for the
    roadmap database operations, or is not being installed during pip install.

    **Reproduction:**
    1. Install vibey: `pip install -e .`
    2. Run: `vibey roadmap db rebuild`
    3. Observe: ModuleNotFoundError

    **Expected:** Command should work after standard pip install

    **Workaround:** Install SQLAlchemy manually: `pip install sqlalchemy`

    **Root Cause Investigation:**
    - Check pyproject.toml dependencies
    - Check if SQLAlchemy is in optional extras but required for db operations
    - Ensure ORM imports are properly guarded

    **Found during:** Token Estimation Sprint 1 task execution
