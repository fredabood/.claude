  title: 'CLI: vibey roadmap db rebuild fails with missing SQLAlchemy'
  description: |
    **Problem:** `vibey roadmap db rebuild` fails with ModuleNotFoundError after
    standard `pip install vibey`.

    **Reproduction:**
    1. Create fresh venv: `python -m venv test_venv && source test_venv/bin/activate`
    2. Install: `pip install -e .`
    3. Run: `vibey roadmap db rebuild`
    4. Error: `ModuleNotFoundError: No module named 'sqlalchemy'`

    **Root Cause:** In `pyproject.toml`, SQLAlchemy is optional:
    ```toml
    [project.optional-dependencies]
    db = ["sqlalchemy>=2.0.0"]
    ```
    Standard install doesn't include it. Requires `pip install vibey[db]`.

    **Implementation Plan (Option A - Recommended):**
    Make SQLAlchemy a required dependency:
    ```toml
    dependencies = [
        ...
        "sqlalchemy>=2.0.0",  # Move from optional
    ]
    ```

    **Implementation Plan (Option B - Graceful error):**
    Add import guard to db commands in `vibey/cli/main.py`:
    ```python
    try:
        import sqlalchemy
    except ImportError:
        print("SQLAlchemy required. Install with: pip install vibey[db]")
        sys.exit(1)
    ```

    **Files to Modify:**
    - pyproject.toml:32-39 (move sqlalchemy to required)
    - OR vibey/cli/main.py (add import guards)

    **Verification:**
    Fresh venv install and `vibey roadmap db rebuild` works without extra pip install
