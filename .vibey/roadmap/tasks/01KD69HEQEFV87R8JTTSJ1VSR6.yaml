  title: 'CLI: vibey roadmap db rebuild fails with missing SQLAlchemy'
  description: "**Problem:** `vibey roadmap db rebuild` fails with ModuleNotFoundError\
    \ after\nstandard `pip install vibey`.\n\n**Reproduction:**\n1. Create fresh venv:\
    \ `python -m venv test_venv && source test_venv/bin/activate`\n2. Install: `pip\
    \ install -e .`\n3. Run: `vibey roadmap db rebuild`\n4. Error: `ModuleNotFoundError:\
    \ No module named 'sqlalchemy'`\n\n**Root Cause:** In `pyproject.toml`, SQLAlchemy\
    \ is optional:\n```toml\n[project.optional-dependencies]\ndb = [\"sqlalchemy>=2.0.0\"\
    ]\n```\nStandard install doesn't include it. Requires `pip install vibey[db]`.\n\
    \n**Implementation Plan (Option A - Recommended):**\nMake SQLAlchemy a required\
    \ dependency:\n```toml\ndependencies = [\n    ...\n    \"sqlalchemy>=2.0.0\",\
    \  # Move from optional\n]\n```\n\n**Implementation Plan (Option B - Graceful\
    \ error):**\nAdd import guard to db commands in `vibey/cli/main.py`:\n```python\n\
    try:\n    import sqlalchemy\nexcept ImportError:\n    print(\"SQLAlchemy required.\
    \ Install with: pip install vibey[db]\")\n    sys.exit(1)\n```\n\n**Files to Modify:**\n\
    - pyproject.toml:32-39 (move sqlalchemy to required)\n- OR vibey/cli/main.py (add\
    \ import guards)\n\n**Verification:**\nFresh venv install and `vibey roadmap db\
    \ rebuild` works without extra pip install\n"
