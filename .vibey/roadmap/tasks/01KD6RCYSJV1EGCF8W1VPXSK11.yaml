  title: 'Bug: roadmap show treats ULID as track ID instead of auto-detecting entity type'
  description: |
    When running 'vibey roadmap show <ULID>' where the ULID is a task ID, the CLI
    incorrectly tries to find it as a track first and fails with 'Track not found'
    error instead of checking tasks, sprints, etc.

    Steps to reproduce:
    1. Get a task ULID (e.g., 01KCYA0G5135Z8B8ENFD841B10)
    2. Run: vibey roadmap show 01KCYA0G5135Z8B8ENFD841B10
    3. Error: "Track '01KCYA0G5135Z8B8ENFD841B10' not found"

    Expected behavior:
    The show command should auto-detect the entity type based on the ULID or
    check all entity types (track, sprint, task) before failing.

    Discovered during: Task 01KCYA0G5135Z8B8ENFD841B10 execution
