  title: 'Bug: roadmap show treats ULID as track ID instead of auto-detecting entity
    type'
  description: |
    **Problem:** `vibey roadmap show <ULID>` fails when given a task/sprint ULID,
    defaulting to "track" lookup instead of detecting the correct entity type.

    **Reproduction:**
    1. Get a task ULID: 01KCYA0G5135Z8B8ENFD841B10
    2. Run: vibey roadmap show 01KCYA0G5135Z8B8ENFD841B10
    3. Error: "Track '01KCYA0G5135Z8B8ENFD841B10' not found"

    **Root Cause:** In `vibey/cli/commands_legacy.py:814-822`, when `_detect_ulid_type()`
    returns None, the code defaults to "track" instead of checking the database or
    returning an error.

    **Implementation Plan:**
    1. Remove track fallback at line 819
    2. Add database lookup as fallback (check tasks, sprints, tracks tables)
    3. Create `detect_entity_type()` helper in `vibey/roadmap/database/queries.py`
    4. Return proper error if entity not found anywhere

    **Files to Modify:**
    - vibey/cli/commands_legacy.py:814-822
    - vibey/roadmap/database/queries.py (add helper)

    **Verification:**
    - `vibey roadmap show <task-ulid>` shows task details
    - `vibey roadmap show <sprint-ulid>` shows sprint details
    - `vibey roadmap show <invalid-ulid>` shows "Entity not found" error
