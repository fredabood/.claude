  title: TaskType enum missing 'bug' value
  description: |
    **Problem:** Tasks with `task_type: bug` fail validation because 'bug' is not
    a valid TaskType enum value.

    **Reproduction:**
    1. Create task YAML with `task_type: bug`
    2. Run: `vibey roadmap db rebuild`
    3. Error: "'bug' is not a valid TaskType"

    **Root Cause:** Two TaskType enum definitions, neither includes 'bug':
    - `vibey/roadmap/models/ticket/enums.py:129-142`
    - `vibey/roadmap/models/common.py:73-85`

    **Implementation Plan:**
    1. Add `BUG = "bug"` to `vibey/roadmap/models/ticket/enums.py:142`
    2. Add `BUG = "bug"` to `vibey/roadmap/models/common.py:85`
    3. Check `vibey/roadmap/database/schema.py` for CHECK constraints on task_type

    **Files to Modify:**
    - vibey/roadmap/models/ticket/enums.py:142
    - vibey/roadmap/models/common.py:85
    - vibey/roadmap/database/schema.py (if CHECK constraint exists)

    **Verification:**
    - Create task with `task_type: bug`, rebuild DB, verify no validation errors
