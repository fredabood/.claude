  title: 'Fix add-artifact command: no such column: id'
  description: "**Problem:** `vibey roadmap task add-artifact` fails with \"no such\
    \ column: id\"\nerror. Artifact creates but fails to associate with task.\n\n\
    **Reproduction:**\n1. Run: `vibey roadmap task add-artifact 01KC2D0JK7READW9KAK1HBX4B8\
    \ vibey/cli/main.py`\n2. Error: \"Failed to add artifact: no such column: id\"\
    \n\n**Root Cause:** Schema mismatch in `vibey/cli/commands/relationship.py:279-282`:\n\
    ```python\nexisting = conn.execute(\"\"\"\n    SELECT id FROM ticket_artifact_associations\
    \  # <-- 'id' doesn't exist!\n    WHERE ticket_id = ? AND artifact_id = ?\n\"\"\
    \", ...).fetchone()\n```\n\nThe actual table uses composite primary key `(ticket_id,\
    \ artifact_id)`, no `id` column:\n```sql\nPRIMARY KEY (ticket_id, artifact_id)\
    \  -- No 'id' column!\n```\n\n**Implementation Plan:**\n1. Change `SELECT id`\
    \ to `SELECT 1` at line 279\n2. Remove or fix `_ensure_tables_exist()` (lines\
    \ 43-93) which creates\n   incompatible schema with `id INTEGER PRIMARY KEY AUTOINCREMENT`\n\
    \n**Files to Modify:**\n- vibey/cli/commands/relationship.py:279 (SELECT id →\
    \ SELECT 1)\n- vibey/cli/commands/relationship.py:43-93 (remove/fix _ensure_tables_exist)\n\
    \n**Verification:**\n- `vibey roadmap task add-artifact <task-id> <path>` succeeds\n\
    - `sqlite3 .vibey/roadmap.db \"SELECT * FROM ticket_artifact_associations\"` shows\
    \ entry\n"
