  title: Design ExperimentConfig dataclass with Variant and VariantType
  description: |
    Create the core experiment configuration dataclasses:

    1. **VariantType** enum: model, prompt, template, strategy, config
    2. **Variant** dataclass:
       - id, name, type, weight (0.0-1.0), config dict, is_control flag
       - Validation for weight range
    3. **ExperimentStatus** enum: draft, active, paused, completed, cancelled
    4. **Experiment** dataclass:
       - id (ULID), name, description, status
       - variants list, metrics list, started_at, ended_at
       - target_sample_size, filters dict
       - Properties: is_active, control_variant, get_variant_by_id()
    5. **ExperimentConfig** dataclass:
       - enabled, experiment_id, auto_assign, storage_path, metrics_retention_days

    File: vibey/services/implementation/experiment/config.py

