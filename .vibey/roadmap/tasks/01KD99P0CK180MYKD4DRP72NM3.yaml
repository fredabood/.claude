  title: Create ExperimentRegistry with YAML persistence
  description: |
    Implement the ExperimentRegistry for managing A/B experiments:

    1. **ExperimentRegistry** class:
       - __init__(storage_path: Path) - Initialize with directory for YAML files
       - _load_experiments() - Load all experiments from storage on init
       - _load_experiment_file(path) - Parse single experiment YAML
       - _save_experiment(experiment) - Persist experiment to YAML

    2. **CRUD Operations**:
       - create_experiment(name, variants, description, metrics, target_sample_size, filters) -> Experiment
       - get_experiment(experiment_id) -> Optional[Experiment]
       - list_experiments(status=None) -> List[Experiment]
       - get_active_experiments() -> List[Experiment]

    3. **Lifecycle Operations**:
       - activate_experiment(experiment_id) -> bool
       - pause_experiment(experiment_id) -> bool
       - complete_experiment(experiment_id) -> bool

    File: vibey/services/implementation/experiment/registry.py

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 2.2
