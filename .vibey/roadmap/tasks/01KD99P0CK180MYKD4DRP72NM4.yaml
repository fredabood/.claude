  title: Implement VariantAssigner with multiple strategies
  description: |
    Implement the VariantAssigner for assigning tasks to experiment variants:

    1. **VariantAssigner** class:
       - __init__(experiment, strategy="deterministic", seed=None)
       - Precompute cumulative weights for weighted selection
       - assign(task: HierarchicalTicket) -> Variant

    2. **Assignment Strategies**:
       - _assign_deterministic(task) - Hash-based (SHA256 of experiment_id:task_id)
         Ensures same task always gets same variant in same experiment
       - _assign_random() - Pure random with weights
       - _assign_round_robin() - Sequential assignment

    3. **Properties**:
       - Normalized cumulative weights for O(n) selection
       - Support for custom random seed for reproducibility

    File: vibey/services/implementation/experiment/assigner.py

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 2.3
