  title: Implement VariantAssigner with multiple strategies
  description: "Implement the VariantAssigner for assigning tasks to experiment variants:\n\
    \n1. **VariantAssigner** class:\n   - __init__(experiment, strategy=\"deterministic\"\
    , seed=None)\n   - Precompute cumulative weights for weighted selection\n   -\
    \ assign(task: HierarchicalTicket) -> Variant\n\n2. **Assignment Strategies**:\n\
    \   - _assign_deterministic(task) - Hash-based (SHA256 of experiment_id:task_id)\n\
    \     Ensures same task always gets same variant in same experiment\n   - _assign_random()\
    \ - Pure random with weights\n   - _assign_round_robin() - Sequential assignment\n\
    \n3. **Properties**:\n   - Normalized cumulative weights for O(n) selection\n\
    \   - Support for custom random seed for reproducibility\n\nFile: vibey/services/implementation/experiment/assigner.py\n\
