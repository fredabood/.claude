  title: Create experiment CLI command group
  description: |
    Create the `vibey experiment` CLI command group:

    1. **Command Group**: `vibey experiment`

    2. **Commands**:
       - `vibey experiment create` - Create new experiment
         Options: --name, --type (model/prompt/template/strategy),
                  --variants (JSON), --target-sample-size
       - `vibey experiment list` - List experiments
         Options: --status (draft/active/paused/completed)
       - `vibey experiment show <id>` - Show experiment details
       - `vibey experiment activate <id>` - Activate experiment
       - `vibey experiment pause <id>` - Pause experiment
       - `vibey experiment complete <id>` - Complete experiment

    3. **Output Formatting**:
       - Rich table output for list
       - Detailed YAML output for show
       - Status indicators with colors

    File: vibey/cli/command_modules/experiment.py (new)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 6.1
