  title: Modify AgentSpawner for variant-aware model selection
  description: |
    Modify AgentSpawner._build_command() to support experiment variants:

    1. **Update _build_command()** (spawner.py:477-508):
       - Accept optional `variant: Variant` parameter
       - If variant is MODEL type, use variant.config["model"]
       - Fallback to config.agent.model if no variant

    2. **Update spawn_agent()**:
       - Accept experiment_context with assigned variant
       - Pass variant to _build_command()

    3. **Integration with ExperimentRegistry**:
       - If experiment is active, get assigned variant before spawning
       - Log variant assignment for debugging

    4. **Backward compatibility**:
       - If no experiment active, use existing behavior
       - If variant has no model config, use default

    Files to modify:
    - vibey/services/implementation/spawner.py:477-508 (model injection)
    - vibey/services/implementation/spawner.py:380-420 (spawn_agent)

    Reference: AGENT_MANAGEMENT_RESEARCH.md Section 3.3
