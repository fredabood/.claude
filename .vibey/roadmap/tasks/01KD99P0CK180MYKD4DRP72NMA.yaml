  title: Implement model metrics collection
  description: |
    Implement basic metrics collection for model experiments:

    1. **Model-specific metrics**:
       - tokens_input, tokens_output, tokens_total
       - success (boolean as 0/1)
       - duration_seconds
       - commits_count
       - retries_count

    2. **Create BasicMetricsCollector**:
       - record_execution(experiment, variant, task_id, result)
       - Extract standard metrics from ExecutionResult
       - Store in JSONL format per experiment

    3. **Integration point**:
       - Call from ImplementationLoop._handle_result()
       - Only collect if experiment is active

    4. **Storage format**:
       - .vibey/experiments/metrics/{experiment_id}.jsonl
       - One JSON line per metric observation

    File: vibey/services/implementation/experiment/metrics.py (new, basic version)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 4.1
