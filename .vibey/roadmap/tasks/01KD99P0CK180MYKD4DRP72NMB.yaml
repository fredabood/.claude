  title: Create model experiment MCP tools
  description: |
    Register MCP tools for model experiment management:

    1. **vibey_create_experiment** tool:
       - Input: name, description, variant_type, variants array, target_sample_size
       - Output: Created experiment ID and status

    2. **vibey_list_experiments** tool:
       - Input: Optional status filter
       - Output: List of experiments with summary

    3. **vibey_get_experiment** tool:
       - Input: experiment_id
       - Output: Full experiment details

    4. **vibey_activate_experiment** tool:
       - Input: experiment_id
       - Output: Success/failure status

    5. **vibey_pause_experiment** tool:
       - Input: experiment_id
       - Output: Success/failure status

    6. **Register in MCP server**:
       - Add to vibey/mcp/tools/experiment.py
       - Register in vibey/mcp/server.py

    File: vibey/mcp/tools/experiment.py (new)

