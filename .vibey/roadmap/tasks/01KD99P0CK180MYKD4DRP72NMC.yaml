  title: Create PromptTemplate dataclass and PromptTemplateRegistry
  description: |
    Create the prompt template infrastructure:

    1. **PromptTemplate** dataclass:
       - id: str (template identifier)
       - name: str (human-readable name)
       - version: str (semver for tracking changes)
       - system_prompt: str (Jinja2 template)
       - task_prompt: str (Jinja2 template)
       - variables: List[str] (expected variables)

    2. **PromptTemplateRegistry**:
       - __init__(template_dir: Path)
       - _load_templates() - Load all .yaml files from directory
       - get_template(template_id) -> Optional[PromptTemplate]
       - list_templates() -> List[PromptTemplate]
       - get_default_template() -> PromptTemplate

    3. **Template storage**:
       - .vibey/config/prompts/{template_id}.yaml
       - Create default.yaml with current hardcoded prompts

    Files:
    - vibey/services/implementation/experiment/prompt_template.py (new)
    - .vibey/config/prompts/default.yaml (new)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 3.3
