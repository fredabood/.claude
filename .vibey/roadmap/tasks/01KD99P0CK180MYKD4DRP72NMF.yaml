  task_type: development
  title: Define PROMPT variant type and context builder integration
  description: |
    Implement PROMPT variant type for A/B testing prompts:

    1. **PromptVariant behavior**:
       - Variant config must include `template_id` key
       - Points to a PromptTemplate in the registry
       - Optional variable overrides in config

    2. **Modify TaskContextBuilder**:
       - Accept optional variant parameter
       - If PROMPT variant, use specified template_id
       - Fallback to default template

    3. **Integration with VariantAssigner**:
       - PROMPT variants assigned same as MODEL variants
       - Template selected based on assigned variant

    4. **Validation**:
       - Verify template_id exists in registry
       - Warn if template variables don't match task context

    Files to modify:
    - vibey/services/implementation/context.py
    - vibey/services/implementation/experiment/prompt_template.py

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 2.1
