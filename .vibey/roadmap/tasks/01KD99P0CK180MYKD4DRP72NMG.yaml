  title: Create prompt template MCP tools
  description: |
    Register MCP tools for prompt template management:

    1. **vibey_list_prompt_templates** tool:
       - Input: None
       - Output: List of available templates with names/versions

    2. **vibey_get_prompt_template** tool:
       - Input: template_id
       - Output: Full template content with variables

    3. **vibey_preview_prompt** tool:
       - Input: task_id, template_id (optional)
       - Output: Rendered prompt for the task
       - Useful for debugging template issues

    4. **vibey_create_prompt_template** tool:
       - Input: id, name, system_prompt, task_prompt, variables
       - Output: Created template confirmation

    5. **Register in MCP server**:
       - Add to vibey/mcp/tools/prompt.py
       - Register in vibey/mcp/server.py

    File: vibey/mcp/tools/prompt.py (new)

