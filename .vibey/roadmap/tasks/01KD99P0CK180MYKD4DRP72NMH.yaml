  task_type: development
  title: Implement full MetricsCollector with JSONL storage
  description: |
    Extend the basic MetricsCollector to full implementation:

    1. **ExperimentMetric** dataclass:
       - experiment_id, variant_id, task_id
       - metric_name, value (float)
       - timestamp, metadata dict
       - to_dict() for serialization

    2. **MetricsCollector** class:
       - __init__(storage_path: Path)
       - record(experiment, variant, task_id, metrics dict, metadata)
       - record_from_result(experiment, variant, task_id, ExecutionResult)
       - get_metrics(experiment_id) -> List[ExperimentMetric]

    3. **Metrics extraction from ExecutionResult**:
       - success (0/1), tokens_input, tokens_output, tokens_total
       - duration_seconds, commits_count, retries_count
       - error_rate, model_used

    4. **Storage format**:
       - JSONL for efficient append-only writes
       - One file per experiment
       - Rotation/cleanup for old experiments

    File: vibey/services/implementation/experiment/metrics.py (extend)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 2.4
