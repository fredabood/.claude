  title: Create VariantMetricsSummary and ExperimentReport
  description: |
    Create data structures for aggregated experiment analysis:

    1. **VariantMetricsSummary** dataclass:
       - variant_id, variant_name
       - sample_count
       - metrics: Dict[metric_name -> {mean, std, min, max, count}]

    2. **ExperimentReport** dataclass:
       - experiment_id, experiment_name, status
       - started_at, ended_at
       - total_samples
       - variant_summaries: List[VariantMetricsSummary]
       - winner: Optional[str] (variant_id)
       - confidence: Optional[float]

    3. **MetricsCollector.get_summary()**:
       - Calculate aggregated statistics per variant
       - Group metrics by variant_id
       - Compute mean, std, min, max for each metric

    4. **MetricsCollector.generate_report()**:
       - Create full ExperimentReport
       - Include statistical comparison results

    File: vibey/services/implementation/experiment/metrics.py (extend)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 4.3
