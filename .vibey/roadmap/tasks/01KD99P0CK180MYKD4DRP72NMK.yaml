  title: Add metrics collection to ImplementationLoop
  description: |
    Integrate metrics collection into the main execution loop:

    1. **Modify ImplementationLoop.__init__()**:
       - Accept optional MetricsCollector
       - Accept optional active Experiment
       - Initialize VariantAssigner if experiment active

    2. **Modify ImplementationLoop.run()**:
       - Before task execution, assign variant
       - Store variant assignment in task context

    3. **Modify ImplementationLoop._handle_result()**:
       - After task completion, record metrics
       - Include experiment_id and variant_id in result
       - Call metrics_collector.record_from_result()

    4. **Experiment lifecycle integration**:
       - Check if experiment target_sample_size reached
       - Auto-complete experiment when target met (optional)

    Files to modify:
    - vibey/services/implementation/loop.py:232-797

