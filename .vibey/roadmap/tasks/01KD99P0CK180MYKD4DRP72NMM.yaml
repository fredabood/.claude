  title: Implement statistical comparison functions
  description: |
    Implement statistical tests for variant comparison:

    1. **StatisticalTest** dataclass:
       - test_name (two_proportion_z_test, t_test, etc.)
       - metric_name
       - control_value, treatment_value
       - difference, relative_difference
       - p_value, confidence_interval
       - is_significant (p_value < alpha)
       - winner property

    2. **Statistical functions**:
       - two_proportion_z_test(control, treatment) - For success_rate
       - welch_t_test(control, treatment) - For continuous metrics
       - calculate_confidence_interval(data, alpha)
       - calculate_sample_size(effect_size, power, alpha)

    3. **ExperimentAnalyzer** class:
       - compare_variants(experiment_id, metric) -> StatisticalTest
       - recommend_winner(experiment_id) -> Optional[str]
       - calculate_power(experiment_id) -> float

    File: vibey/services/implementation/experiment/analysis.py (new)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 4.3
