  task_type: development
  title: Create analysis CLI commands and MCP tools
  description: |
    Create CLI and MCP interfaces for experiment analysis:

    1. **CLI Commands**:
       - `vibey experiment results <id>` - Show aggregated results
         Options: --format (table/json/yaml), --metrics (filter)
       - `vibey experiment analyze <id>` - Statistical analysis
         Options: --metric, --alpha (default 0.05), --detailed
       - `vibey experiment compare <id>` - Side-by-side comparison

    2. **MCP Tools**:
       - vibey_get_experiment_results - Raw metrics and summaries
       - vibey_compare_variants - Statistical comparison
       - vibey_get_experiment_report - Full analysis report

    3. **Output formatting**:
       - Rich tables for CLI
       - Highlighted significant results
       - Confidence interval visualization

    Files:
    - vibey/cli/command_modules/experiment.py (extend)
    - vibey/mcp/tools/experiment.py (extend)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 5.1
