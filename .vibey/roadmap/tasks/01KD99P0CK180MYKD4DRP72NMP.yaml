  title: Define TEMPLATE variant type for ticket templates
  description: |
    Implement TEMPLATE variant type for A/B testing ticket configurations:

    1. **TicketTemplateVariant behavior**:
       - Variant config includes ticket field overrides
       - Can override: priority, complexity, estimated_tokens
       - Can add/modify acceptance criteria templates

    2. **TicketTemplateRegistry**:
       - Load ticket templates from .vibey/config/ticket_templates/
       - Template includes field defaults and criteria generators
       - get_template(template_id) -> TicketTemplate

    3. **Integration with task creation**:
       - When TEMPLATE variant active, apply template to new tasks
       - Preserve original values, override with template

    4. **Example templates**:
       - detailed.yaml - More criteria, longer descriptions
       - minimal.yaml - Fewer criteria, concise
       - test_focused.yaml - Testing emphasis

    Files:
    - vibey/services/implementation/experiment/ticket_template.py (new)
    - .vibey/config/ticket_templates/default.yaml (new)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 7
