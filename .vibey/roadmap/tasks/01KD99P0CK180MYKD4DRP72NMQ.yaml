  title: Define STRATEGY variant type for execution strategies
  description: |
    Implement STRATEGY variant type for A/B testing execution approaches:

    1. **ExecutionStrategyVariant behavior**:
       - Variant config includes strategy parameters
       - strategy_type: sequential, parallel, wave, adaptive
       - max_concurrent: int (for parallel)
       - wave_size: int (for wave)

    2. **StrategySelector**:
       - Given variant, return appropriate execution strategy
       - Strategies: SequentialStrategy, ParallelStrategy, WaveStrategy

    3. **Integration with ImplementationLoop**:
       - If STRATEGY variant active, use specified strategy
       - Strategy affects task ordering and parallelism

    4. **Strategy metrics**:
       - total_duration (end-to-end time)
       - parallelism_factor (tasks/time)
       - throughput (tasks/hour)
       - resource_efficiency

    Files:
    - vibey/services/implementation/experiment/strategy_variant.py (new)
    - vibey/services/implementation/strategies.py (new)

    Reference: AGENT_MANAGEMENT_RESEARCH.md Section 5.4
