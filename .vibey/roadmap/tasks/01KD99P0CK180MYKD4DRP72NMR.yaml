  title: Implement multi-metric optimization for variant selection
  description: |
    Create multi-metric optimization for choosing winning variants:

    1. **WeightedMetricOptimizer**:
       - Configure weights for each metric
       - Example: success_rate: 0.5, tokens_total: -0.2, duration: -0.3
       - Negative weights for metrics to minimize

    2. **Scoring function**:
       - Normalize each metric to 0-1 range
       - Apply weights and sum
       - Return composite score per variant

    3. **Pareto optimization** (optional):
       - Identify Pareto-optimal variants
       - No variant dominates another on all metrics
       - Useful for multi-objective tradeoffs

    4. **Integration with ExperimentAnalyzer**:
       - recommend_winner() uses optimizer
       - Configurable optimization strategy

    File: vibey/services/implementation/experiment/optimizer.py (new)

    Reference: AB_TESTING_RECOMMENDATIONS.md Section 4.2
