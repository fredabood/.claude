  title: 'CLI: vibey roadmap commands timeout but Python direct calls work'
  description: '**Problem:** CLI commands like `vibey roadmap show` and `vibey roadmap
    status` timeout after 60 seconds, but running the same logic directly via Python
    works fine.


    **Reproduction:**

    1. Run: `timeout 60 vibey roadmap show 01KC39XSXJ39N12HWJ93F77KQ9`

    2. Result: Command hangs and times out

    3. Run directly: `.venv/bin/python3 -c "from vibey.roadmap.database.session import
    get_session; ..."`

    4. Result: Works immediately


    **Root Cause:** O(n^2) performance bug in recalculate_all() method.


    **Fix:** Fixed O(n^2) -> O(n) in recalculate_all() by querying tasks per-sprint
    instead of across all sprints.


    **Verification:**

    - `vibey roadmap status` completes within 5 seconds

    - `vibey roadmap show <ULID>` completes within 5 seconds

    '
