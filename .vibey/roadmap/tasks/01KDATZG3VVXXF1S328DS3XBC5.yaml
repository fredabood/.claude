  title: 'CLI: Confirmation prompts timeout with piped input'
  description: |
    **Problem:** CLI commands with confirmation prompts (like `vibey roadmap revert`)
    timeout when running non-interactively, even when piping "y" to stdin.

    **Reproduction:**
    1. Run: `echo "y" | vibey roadmap revert 01KC39XSXJ39N12HWJ93F77KQ9 --to in_progress`
    2. Result: Shows prompt then hangs/times out
    3. Expected: Should accept piped "y" and proceed

    **Root Cause Analysis:**
    Click's `click.confirm()` or custom confirmation logic may:
    1. Check `sys.stdin.isatty()` and behave differently
    2. Use readline which doesn't work with pipes
    3. Have Rich console interference

    **Implementation Plan:**
    1. Check confirmation implementation in commands
    2. Add `--yes` / `-y` flag to bypass confirmations for scripts
    3. Ensure `click.confirm()` works with piped input
    4. Test with `echo "y" | command` pattern

    **Files to Modify:**
    - vibey/cli/commands_legacy.py (add --yes flag to revert and other destructive commands)
    - Any command using confirmation prompts

    **Verification:**
    - `vibey roadmap revert <id> --to in_progress --yes` works without prompt
    - `echo "y" | vibey roadmap revert <id> --to in_progress` works
