  task_type: development
  title: YAML loader fails silently when depends_on missing required_status field
  description: '**Bug**: Tasks with depends_on entries that only contain blocker_type
    and blocker_id

    fail to load with KeyError: ''required_status'', but the error is not surfaced
    during

    db rebuild.


    **Impact**: 24 experiment tasks were not loaded into the database.


    **Root Cause**: The yaml_loader.py expects depends_on entries to have:

    - blocker_type

    - blocker_id

    - required_status (MISSING)

    - current_status (MISSING)

    - blocks_transition_to (MISSING)


    **Fix Options**:

    1. Make required_status/current_status/blocks_transition_to optional with defaults

    2. Validate YAML format when tasks are created

    3. Surface loader errors during db rebuild instead of silently skipping


    **Workaround Applied**: Manually added missing fields to 24 task YAML files.

    '
