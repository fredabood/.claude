  task_type: bug
  title: Orphaned legacy v2 format YAML task not cleaned up during migrations
  description: '**Bug**: Task file 01KC2D0JK325ABWVR9FQD5ZNQY existed in .vibey/roadmap/tasks/

    using the old v2 YAML format with parent_ref instead of sprint_id.


    **Impact**:

    - Task failed to load with ValueError: "Completion date must be after start date"

    - Orphaned file causing db rebuild to silently skip


    **Root Cause**:

    - File used legacy v2 format: parent_ref, name (not title), created_at/started_at/completed_at

    - Also had invalid date ordering (completed_at before started_at)

    - Migration to flat structure didn''t clean up invalid legacy files


    **Fix Options**:

    1. Add cleanup pass in migrations to remove/convert legacy v2 format files

    2. Add validation during db rebuild to report format errors

    3. Add pre-commit hook to validate YAML format


    **Workaround Applied**: Manually deleted the orphaned file.

    '
