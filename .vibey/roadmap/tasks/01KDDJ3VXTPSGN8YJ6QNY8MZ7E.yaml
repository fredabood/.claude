  task_type: bug
  title: Database rebuild silently skips tasks with validation errors
  description: '**Bug**: When `vibey roadmap db rebuild` encounters a YAML file that
    fails validation,

    it silently skips the file without reporting an error. This causes YAML/DB count

    mismatches that are difficult to diagnose.


    **Impact**:

    - 25 tasks were silently skipped during rebuilds

    - No error messages or warnings shown

    - User unaware of data loss


    **Expected Behavior**:

    - Report each file that fails to load

    - Show the specific validation error

    - Option: --strict to fail on first error

    - Option: --report to generate detailed error log


    **Fix Options**:

    1. Add error collection during rebuild, display summary at end

    2. Add --strict flag to abort on first error

    3. Add --verbose flag to show each file processed

    4. Generate .vibey/roadmap/rebuild-errors.log


    **Workaround Applied**: Manually tested individual files with Python to find errors.

    '
