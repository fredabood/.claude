  title: Extend SQLite schema for submodule integration
  description: 'Add SQLite schema extensions for submodule integration per design document:
    1) CREATE TABLE submodule_references - links parent roadmap to submodule roadmaps
    with fields for path, url, commit, detection source, sync status.
    2) CREATE TABLE cross_repo_requirements - stores push-down requirements with
    source/target ticket refs, requirement spec JSON, ownership model, push mode, status.
    3) CREATE TABLE cross_repo_dependencies - tracks dependencies between tickets in
    different repos with blocking flag, resolution criteria, status.
    4) Add indexes: idx_submod_refs_parent, idx_cross_req_source, idx_cross_req_target,
    idx_cross_deps_dependent, idx_cross_deps_dependency.
    Add to vibey/roadmap/database/schema.py following existing patterns.'
