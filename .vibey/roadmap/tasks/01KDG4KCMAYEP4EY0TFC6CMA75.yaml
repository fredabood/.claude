  title: Extend SQLite schema for submodule integration
  description: 'Add SQLite schema extensions for submodule integration per design decisions.

    Per SUBMODULE_ISOLATION_AND_PUSHDOWN.md: All tables exist in PARENT repo only.

    Add to vibey/roadmap/database/schema.py:

    1) CREATE TABLE submodule_references:
       - id TEXT PRIMARY KEY (ULID)
       - roadmap_id TEXT NOT NULL
       - path TEXT NOT NULL (relative path to submodule)
       - submodule_roadmap_id TEXT (roadmap ID from submodule)
       - aggregate BOOLEAN DEFAULT TRUE
       - track_filter TEXT (JSON array of track IDs, null = all)
       - default_push_mode TEXT DEFAULT ''linked''
       - last_synced TIMESTAMP
       - created TIMESTAMP
       - UNIQUE(roadmap_id, path)

    2) CREATE TABLE linked_task_pairs:
       - id TEXT PRIMARY KEY (ULID)
       - parent_task_id TEXT NOT NULL REFERENCES tasks(id)
       - submodule_path TEXT NOT NULL
       - submodule_task_id TEXT NOT NULL
       - push_mode TEXT NOT NULL (linked|parent_only|submodule_only)
       - created TIMESTAMP
       - UNIQUE(parent_task_id, submodule_task_id)

    3) Add columns to existing blocked_by storage (or external_blockers table):
       - resolved_to TEXT (submodule task ULID for linked mode)
       - submodule_path TEXT
       - last_synced TIMESTAMP

    4) CREATE INDEXES:
       - idx_submod_refs_path ON submodule_references(path)
       - idx_linked_pairs_parent ON linked_task_pairs(parent_task_id)
       - idx_linked_pairs_submodule ON linked_task_pairs(submodule_path)

    REMOVED from OLD design:
    - cross_repo_requirements table (replaced by direct task creation)
    - cross_repo_dependencies table (replaced by ExternalBlockerInfo)

    See design doc: SUBMODULE_ISOLATION_AND_PUSHDOWN.md'
