  task_type: development
  title: Create configuration schema for submodule settings
  description: 'Implement configuration support for submodule integration per design:
    1) Create .vibey/config/submodules.yaml schema with sections for:
       - enabled: bool - master toggle for submodule integration
       - discovery: auto_discover triggers, detection_methods priority, include/exclude patterns
       - push_down: enabled, default_mode (automatic|notification|manual), default_ownership
       - pull_up: enabled, triggers, stale_threshold_minutes, blocker surfacing settings
       - cross_repo_deps: enabled, validation rules, resolution settings, notifications
    2) Add configuration loader in vibey/config/ to parse submodules.yaml
    3) Integrate config with SubmoduleDiscovery, RequirementPusher, ProgressAggregator classes
    4) Add CLI command: vibey config submodules --show/--edit'
