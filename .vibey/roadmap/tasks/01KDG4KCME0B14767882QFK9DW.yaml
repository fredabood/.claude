  title: Create directory structure for submodule data storage
  description: 'Create directory structure for submodule data per design document:
    1) .vibey/roadmap/submodules/ - Submodule registry
       - .registry.yaml - master registry of detected submodules
       - {submodule-name}.yaml - individual submodule reference files
    2) .vibey/roadmap/cross_repo_requirements/ - Push-down requirements storage
       - {requirement-id}.yaml files
    3) .vibey/roadmap/cross_repo_deps/ - Cross-repo dependencies
       - outgoing/ - dependencies this repo has on other repos
       - incoming/ - dependencies other repos have on this repo
    4) .vibey/roadmap/submodule_progress/ - Pull-up progress data
       - .aggregated.yaml - combined progress from all submodules
       - {submodule-name}.yaml - individual submodule progress snapshots
    Add directory creation to roadmap init and ensure proper .gitignore handling.'
