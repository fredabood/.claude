  task_type: development
  title: Implement submodule isolation safety measures
  description: 'Ensure submodule repos work 100% independently when accessed directly:

    CORE PRINCIPLE: Repo A must function perfectly whether accessed directly or as
    a submodule of Repo C.

    SAFETY MEASURES TO IMPLEMENT:

    1) Incoming Requirements Isolation (vibey/operations/submodule/incoming.py):
       - Store parent-pushed requirements in .vibey/incoming/ (separate from core roadmap)
       - Mark incoming requirements with source_repo field
       - Add --include-incoming flag to status/show commands (off by default)
       - Warn user about unresolvable incoming refs, never fail

    2) Cross-Repo Reference Validation (vibey/operations/submodule/validation.py):
       - Add validate_standalone() function to verify roadmap works without parent
       - Check all depends_on references resolve locally OR are marked external
       - External dependencies must have fallback behavior (warn, not fail)
       - Add "vibey roadmap validate --standalone" command

    3) Graceful Degradation Patterns:
       - All core commands (status, show, start, complete) must never fail on missing parent
       - Cross-repo features silently degrade when parent unavailable
       - Add is_submodule_context() detection (checks if .git is file vs directory)
       - Log debug messages for skipped cross-repo operations

    4) Data Isolation Rules:
       - Core roadmap (tracks/sprints/tasks) MUST NOT contain parent-repo ULIDs
       - Cross-repo data stored ONLY in .vibey/incoming/ and .vibey/outgoing/
       - Parent requirements are COPIED to local tasks, not referenced
       - Local task is source of truth, incoming requirement is advisory

    5) Test Suite (tests/operations/submodule/test_isolation.py):
       - Test A works when accessed directly (no parent)
       - Test A works when accessed as submodule of C
       - Test A handles corrupt/missing incoming requirements gracefully
       - Test validation catches invalid cross-repo references
       - Test core commands never fail due to cross-repo issues'
