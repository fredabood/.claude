  title: Verify submodule isolation architecture
  description: 'Verify and document that the submodule architecture ensures complete isolation:

    CORE PRINCIPLE: Repo A must function perfectly whether accessed directly or as
    a submodule of Repo C. A has ZERO knowledge of any parent repos.

    ARCHITECTURE VERIFICATION:

    1) Confirm No Cross-Repo Data in Submodules:
       - Submodule A has no .vibey/incoming/ or .vibey/outgoing/ directories
       - Submodule A''s tasks have no external ULIDs in depends_on
       - All cross-repo metadata lives ONLY in parent C
       - Link from C to A stored in C''s blocked_by with resolved_to field

    2) Confirm Parent-Only Cross-Repo Storage:
       - C stores submodule registry in .vibey/config/submodules.yaml
       - C''s tasks use blocked_by with blocker_type: external for submodule deps
       - C stores ULID mapping (resolved_to) for linked mode tasks
       - Aggregation reads A''s roadmap directly, no push from A

    3) Confirm Direct Write Push-Down:
       - C can create tasks in A''s roadmap via vibey submodule push
       - Created tasks in A are standalone (no reference to C)
       - C''s corresponding task stores link via resolved_to field
       - Three modes work: parent_only, submodule_only, linked

    4) Test Suite (tests/operations/submodule/test_isolation.py):
       - Test A works identically whether cloned directly or as submodule
       - Test A''s core commands work with no parent context
       - Test C can aggregate from A without modifying A
       - Test C can push task to A, A''s task is standalone
       - Test ULID linking between C and A tasks

    5) Documentation:
       - Reference design doc: SUBMODULE_ISOLATION_AND_PUSHDOWN.md
       - Add architecture diagram to user guide
       - Document push modes (parent_only, submodule_only, linked)'
