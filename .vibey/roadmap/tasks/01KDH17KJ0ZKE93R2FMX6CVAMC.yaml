  title: 'BUG: roadmap complete command requires unrelated tracks to complete'
  description: 'The `vibey roadmap complete` command incorrectly enforces cross-track
    dependencies when completing a sprint. When attempting to complete Sprint 2 of
    the Git Submodule Integration track (01KCW0K1ZY2CEDMN5YY8JATEY4), the command
    fails with an error listing 51 unrelated tracks that "must complete" first.

    REPRODUCTION: 1. Have a sprint with all tasks completed 2. Run: vibey roadmap
    complete <sprint-id> 3. Error: "Cannot complete <sprint-id>: Track 01KC2D0JK...
    must complete" (51 tracks listed)

    EXPECTED BEHAVIOR: The complete command should only verify that all tasks within
    the sprint are completed, not enforce dependencies on unrelated tracks.

    ACTUAL BEHAVIOR: Command fails with error requiring 51 unrelated tracks to complete
    first.

    WORKAROUND: Manually edit the YAML files to update status fields.

    ROOT CAUSE (suspected): The validation logic in the complete command is incorrectly
    checking track-level dependencies instead of just verifying task completion within
    the sprint.

    '
