  roadmap_id: vibey-framework-v2
  task_type: development
  title: Fix start command V2 format corruption
  description: "The `vibey roadmap start` command is converting V1 format YAML files\
    \ to V2 format when starting sprints/tasks. This breaks the database loader because:\n\
    \n1. V1 uses: track_id, sprint_id, created, started, completed\n2. V2 uses: parent_ref,\
    \ format_version, created_at, started_at, completed_at, criteria\n\nThe loader\
    \ expects V1 format and fails with 'track_id' KeyError when it encounters V2.\n\
    \nFix: Modify the start command to preserve V1 format - only update status and\
    \ started timestamp without restructuring the YAML."
