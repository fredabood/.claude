  name: Audit Data Model Schema
  description: "Document complete data model schema for Delta Lake replication planning.\n\
    \nMETHODOLOGY:\n1. Extract entity schemas from Python models:\n   - vibey/roadmap/models/roadmap.py\
    \ - Roadmap entity\n   - vibey/roadmap/models/track.py - Track entity\n   - vibey/roadmap/models/sprint.py\
    \ - Sprint entity\n   - vibey/roadmap/models/task.py - Task entity\n2. Document\
    \ each entity comprehensively:\n   - All fields with data types\n   - Required\
    \ vs optional fields\n   - Default values\n   - Validation constraints\n   - Computed/derived\
    \ fields\n3. Map field types to Delta Lake equivalents:\n   - String fields →\
    \ STRING\n   - DateTime fields → TIMESTAMP\n   - Boolean fields → BOOLEAN\n  \
    \ - List fields → ARRAY\n   - Nested objects → STRUCT\n4. Document enum types:\n\
    \   - Status values\n   - Priority levels\n   - Task types\n   - Complexity levels\n\
    5. Identify schema evolution considerations:\n   - Fields that may be added in\
    \ future\n   - Nullable vs non-nullable decisions\n\nINPUT FILES:\n- vibey/roadmap/models/*.py\
    \ - All model definitions\n- vibey/roadmap/models/enums.py - Enum definitions\n\
    - .vibey/roadmap/**/*.yaml - Example data for validation\n\nSUCCESS CRITERIA:\n\
    - All 4 entity types fully documented\n- All fields mapped to Delta Lake types\n\
    - All enums documented with valid values\n"
