  name: Audit Entity Relationships
  description: "Document entity relationships and hierarchy for remote storage design.\n\
    \nMETHODOLOGY:\n1. Map hierarchical relationships:\n   - Roadmap → Track (one-to-many)\n\
    \   - Track → Sprint (one-to-many)\n   - Sprint → Task (one-to-many)\n   - Document\
    \ parent ID fields (track_id, sprint_id, etc.)\n2. Document cross-entity references:\n\
    \   - Task dependencies (depends_on, blocked_by)\n   - Task blocking relationships\n\
    \   - Git commit references\n   - Agent assignment references\n3. Analyze relationship\
    \ storage patterns:\n   - In YAML: embedded IDs vs nested structures\n   - In\
    \ SQLite: foreign keys, junction tables\n   - Orphan handling (entity without\
    \ parent)\n4. Document relationship traversal:\n   - Parent lookup queries\n \
    \  - Child enumeration queries\n   - Dependency chain resolution\n   - Recursive\
    \ queries (all tasks in track)\n5. Map to Delta Lake relationships:\n   - Foreign\
    \ key alternatives\n   - JOIN patterns for hierarchies\n   - Denormalization options\n\
    \nINPUT FILES:\n- vibey/roadmap/models/*.py - Model relationships\n- vibey/operations/roadmap/*.py\
    \ - Traversal operations\n- .vibey/roadmap/roadmap.db - SQLite schema\n\nSUCCESS\
    \ CRITERIA:\n- Complete relationship diagram\n- All cross-references documented\n\
    - Delta Lake relationship strategy defined\n"
