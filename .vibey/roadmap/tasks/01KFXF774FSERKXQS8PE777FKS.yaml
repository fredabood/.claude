    post_mortem:
      completed_at: '2026-01-27T00:10:00+00:00'
      implementation_status: Status State Machine Documentation Complete
      ticket_status_enum:
        total_values: 10
        values:
        - NOT_STARTED
        - IN_PROGRESS
        - COMPLETED
        - PRODUCTION_READY
        - DEPLOYED
        - BLOCKED
        - DEFERRED
        - WONT_DO
        - SUPERSEDED
        - ARCHIVED
      task_status_enum:
        total_values: 6
        values:
        - NOT_STARTED
        - IN_PROGRESS
        - BLOCKED
        - COMPLETED
        - WONT_DO
        - DEFERRED
        note: Restricted subset for tasks (no PRODUCTION_READY, DEPLOYED, SUPERSEDED,
          ARCHIVED)
      status_progression:
        happy_path: NOT_STARTED → IN_PROGRESS → COMPLETED → PRODUCTION_READY → DEPLOYED
        terminal_states:
        - DEPLOYED (successful completion)
        - WONT_DO (intentionally abandoned)
        - SUPERSEDED (replaced by another entity)
        - ARCHIVED (historical preservation)
      transition_triggers:
        cli_commands:
        - vibey roadmap start <id> (→ IN_PROGRESS)
        - vibey roadmap complete <id> (→ COMPLETED)
        - vibey roadmap block <id> (→ BLOCKED)
        - vibey roadmap defer <id> (→ DEFERRED)
        - vibey roadmap wont-do <id> (→ WONT_DO)
        auto_progression:
          location: vibey/operations/roadmap/status.py
          function: auto_progress_status()
          triggers: dependency completion, all children complete
        rollup_transitions:
          sprint_completion: When all tasks reach COMPLETED
          track_completion: When all sprints reach PRODUCTION_READY
      validation_rules:
        pre_transition:
        - blocked_by must be empty to transition to IN_PROGRESS
        - Dependencies must be satisfied for COMPLETED
        - Gate tasks require gate_info validation
        post_transition:
        - started_at set on transition to IN_PROGRESS
        - completed_at set on transition to COMPLETED
        - progress counters updated in parent entities
        - Database sync triggered
        invariants:
        - started_at required when status is IN_PROGRESS or later
        - completed_at required when status is COMPLETED or later
        - completed_at >= started_at (temporal consistency)
      blocking_system:
        explicit_blocking:
          fields: blocked_by[], blocks[]
          mechanism: Entity explicitly blocked by another entity
        dependency_blocking:
          fields: depends_on[], depended_on_by[]
          mechanism: Status-based blocking via DependencyResolver
        criteria_blocking:
          field: criteria[]
          mechanism: Unmet acceptance criteria block completion
      remote_sync_considerations:
        optimistic_locking:
          field: updated_at
          strategy: Compare-and-swap on update
        conflict_resolution:
        - Last-write-wins for simple fields
        - Merge strategy for list fields (commits, criteria)
        - Status transitions require ordering (no backward movement)
        sync_events:
        - Status change triggers immediate sync
        - Timestamp updates included in sync payload
        - Parent entity progress recalculated
      success_criteria_met:
      - 'All statuses documented for all entity types: YES'
      - 'State transition diagrams complete: YES (text format)'
      - 'Remote sync considerations documented: YES'
