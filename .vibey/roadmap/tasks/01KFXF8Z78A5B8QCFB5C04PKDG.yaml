    post_mortem:
      completed_at: '2026-01-26T21:45:00+00:00'
      dependency_fields:
        depends_on: List[DependencyStatus] - cached blocking status (primary)
        blocked_by: List[TaskBlocker] - DEPRECATED (legacy)
        depended_on_by: List[str] - reverse index of dependents
        blocks: List[TaskDependency] - forward index of what this blocks
        blocked: bool - computed from depends_on
      unified_criterion_model:
        mechanism: Dependencies are Criteria with CompletableTarget
        key_field: blocks_transition_to determines what status is guarded
        semantics:
          IN_PROGRESS: Dependency (blocks starting work)
          COMPLETED: Success criterion (must be met to complete)
          PRODUCTION_READY: Production gate (must pass before deploy)
      dependency_semantics:
        depends_on_meaning: Has Criterion with CompletableTarget blocking IN_PROGRESS
        blocked_computation: any(not dep.is_satisfied() for dep in depends_on)
        satisfaction_check: current_status >= required_status (using progression order)
      validation:
        circular_detection:
        - Database: Recursive CTE with max_depth=20
        - Graph: NetworkX find_cycle() with CriterionDependencyGraph
        cross_entity: Supported (task→sprint, sprint→track, etc.)
        invalid_refs: Validated on load, pre-commit hook
      blocked_propagation:
        becomes_blocked: ANY dependency in depends_on unsatisfied
        becomes_unblocked: Dependency blocker reaches required_status
        cascading: Forward via depended_on_by reverse index
      resolution_algorithm:
        topological_sort: NetworkX for execution order
        critical_path: Longest chain via nx.ancestors/descendants
        parallel_tasks: Same topo level with no interdependencies
      database_tables:
      - entity_blocks (blocker→blocked)
      - entity_blocked_by (inverse, for queries)
      - entity_depends_on (soft dependencies)
      remote_sync_implications:
        challenges:
        - Stale dependency status
        - Concurrent status changes
        - Out-of-order updates
        solutions:
        - last_checked timestamp on DependencyStatus
        - Periodic background sync
        - Conservative blocking (uncertain = unsatisfied)
        - Force refresh via db rebuild
      key_files:
      - vibey/roadmap/models/common.py (DependencyStatus)
      - vibey/roadmap/models/ticket/completable.py (Criterion)
      - vibey/roadmap/models/ticket/targets.py (CompletableTarget)
      - vibey/roadmap/database/crud/relationships.py (CRUD)
      - vibey/services/implementation/dependency_graph.py (graph analysis)
      success_criteria_met:
      - All dependency fields documented: true
      - Dependency resolution algorithm understood: true
      - Remote sync strategy defined: true
