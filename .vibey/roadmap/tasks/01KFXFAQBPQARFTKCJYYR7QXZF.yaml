          repair: vibey roadmap recalculate-all
      rollup_algorithm:
        pattern: Bottom-up aggregation
        optimization: Pre-loaded task index prevents O(sprints × tasks) file I/O
        cascade_chain: Task → Sprint → Track → Roadmap
        deferred_exclusion: Deferred tasks excluded from all progress totals
      remote_aggregation_considerations:
