      progress_calculation_by_level:
        task:
          model: Binary (0% or 100%)
          completion_criteria: TaskStatus.COMPLETED
          weighting: None - all tasks equal regardless of tokens
          deferred_handling: Excluded from totals
        sprint:
          formula: (tasks_completed / tasks_total) * 100
          task_types:
          - development_tasks
          - completion_gate_tasks
          - production_gate_tasks
          data_structure: SprintProgress with 8 fields
        track:
          formula: Sum of sprint.progress.tasks_completed / Sum of sprint.progress.tasks_total
          sprint_completion_statuses: COMPLETED, PRODUCTION_GATE_CHECK, PRODUCTION_READY,
            DEPLOYED
          data_structure: TrackProgress with 5 fields
        roadmap:
          formula: Sum of track.progress.tasks_completed / Sum of track.progress.tasks_total
          track_completion_statuses: COMPLETED, PRODUCTION_READY, DEPLOYED
          data_structure: Progress with 7 fields
      weighting_factors:
        token_weighting: NOT IMPLEMENTED (equal weight for all tasks)
        complexity_weighting: NOT IMPLEMENTED
        priority_weighting: NOT IMPLEMENTED
        model: Pure count-based (1K-token task = 100K-token task in progress)
      recalculation_triggers:
        explicit_commands:
