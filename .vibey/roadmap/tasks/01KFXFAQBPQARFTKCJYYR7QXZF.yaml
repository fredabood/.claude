      progress_formulas:
        task: Binary (completed or not, no partial progress)
        sprint: tasks_completed / tasks_total * 100 (with 3 task types)
        track: sum(sprint.tasks_completed) / sum(sprint.tasks_total) * 100
        roadmap: sum(track.tasks_completed) / sum(track.tasks_total) * 100
      task_types_tracked:
