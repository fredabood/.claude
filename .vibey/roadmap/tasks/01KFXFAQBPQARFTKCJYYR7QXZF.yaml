task:
  id: 01KFXFAQBPQARFTKCJYYR7QXZF
  name: Audit Progress Rollup Logic
  description: "Document progress rollup logic for remote aggregation design.\n\n\
    METHODOLOGY:\n1. Document progress calculation at each level:\n   - Task: Binary\
    \ (0% or 100%) or weighted?\n   - Sprint: Sum of task completions / total tasks\n\
    \   - Track: Sum of sprint completions / total sprints\n   - Roadmap: Sum of track\
    \ completions / total tracks\n2. Identify weighting factors:\n   - Are all tasks\
    \ equal weight?\n   - Do complexity/priority affect weight?\n   - Token estimation\
    \ influence\n3. Map recalculation triggers:\n   - Task status change\n   - Task\
    \ creation/deletion\n   - Sprint reorganization\n   - Explicit refresh command\n\
    4. Document progress storage:\n   - Cached in database vs computed on-demand\n\
    \   - Stored in YAML vs computed from children\n   - Stale progress handling\n\
    5. Analyze rollup algorithms:\n   - Bottom-up aggregation\n   - Trigger-based\
    \ updates\n   - Batch recalculation\n6. Map to remote mode:\n   - Distributed\
    \ aggregation\n   - Eventual consistency for progress\n   - Real-time vs batch\
    \ updates\n\nINPUT FILES:\n- vibey/operations/roadmap/progress.py - Progress calculations\n\
    - vibey/roadmap/models/*.py - Progress fields\n- Database views for progress queries\n\
    \nSUCCESS CRITERIA:\n- Progress formula documented for each level\n- Recalculation\
    \ triggers identified\n- Remote aggregation strategy defined\n"
