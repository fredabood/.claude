    post_mortem:
      completed_at: '2026-01-26T21:58:00+00:00'
      core_components:
        ImplementationLoop:
          purpose: Main execution orchestrator
          responsibilities: Signal handling, task sequencing, state persistence, regression
            detection
          state: LoopState (session_id, progress counters, task_results)
        TaskSelector:
          purpose: Task prioritization and selection
          responsibilities: Query eligible tasks, apply priority ordering, dependency
            checking
          state: Stateless (reads from SQLite)
        ClaudeTaskExecutor:
          purpose: Execute tasks via Claude agent subprocess
          responsibilities: Context building, subprocess spawning, output streaming,
            result parsing
          state: Stateless (spawns isolated processes)
        TaskContextBuilder:
          purpose: Assemble execution context
          responsibilities: Build system prompt, extract acceptance criteria, identify
            files
          state: Stateless
        ProgressDisplay:
          purpose: Terminal UI for status
          responsibilities: Show progress, task notifications, summaries, time estimation
          state: Stateless (reads from LoopState)
      component_interactions:
        initialization: CLI → create components → load state → create loop → run
        main_loop: Check stop → get task → capture snapshot → execute → handle result
          → detect regressions → save state → loop
        shutdown: Signal received → set flag → cancel task → wait/kill → save state
          → restore handlers
      execution_modes:
        single_task: --ticket <ULID> (task + descendants)
        sprint: --sprint <ULID> (DEPRECATED)
        track: --track <ULID> (DEPRECATED)
        full_roadmap: --all-tickets (requires confirmation)
        continuous: Via scope_ulid in config
        dry_run: --dry-run (preview only)
        background: --background (detached process)
      configuration:
        limits:
          max_tasks_per_session: 10
          max_tokens_per_session: 100000
          max_tokens_per_task: 25000
          timeout_per_task: 600
        retry:
          max_retries: 2
          retry_on:
          - timeout
          - rate_limit
          skip_on:
          - syntax_error
          - import_error
        selection:
          priority_order:
          - critical
          - high
          - medium
          - low
          prefer_smaller_tasks: true
        agent:
          model: claude-sonnet-4
          dangerously_skip_permissions: true
      remote_execution_implications:
        stateless_components: TaskSelector, ClaudeTaskExecutor, TaskContextBuilder,
          ProgressDisplay
        stateful_components: ImplementationLoop, LoopState, RegressionDetector
        sync_strategy:
        - Central state service for LoopState
        - Task queue from TaskSelector
        - Result aggregation for parallel agents
        - File conflict resolution
      key_files:
      - vibey/services/implementation/loop.py (ImplementationLoop)
