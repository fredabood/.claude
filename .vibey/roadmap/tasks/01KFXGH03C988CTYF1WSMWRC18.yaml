  name: Audit Implementation Mode Architecture
  description: "Document Implementation Mode architecture for remote execution design.\n\
    \nMETHODOLOGY:\n1. Document core components:\n   - Executor: Task execution orchestrator\n\
    \   - Loop: Main execution cycle controller\n   - Selector: Task selection logic\n\
    \   - Display: Progress and status UI\n2. Map component responsibilities:\n  \
    \ - What each component does\n   - What state each component manages\n   - What\
    \ interfaces each exposes\n   - How errors are handled\n3. Document component\
    \ interactions:\n   - Initialization sequence\n   - Main loop flow\n   - Task\
    \ execution sequence\n   - Completion and cleanup\n4. Analyze execution modes:\n\
    \   - Single task execution\n   - Sprint execution\n   - Track execution\n   -\
    \ Continuous mode\n5. Document configuration options:\n   - Token limits\n   -\
    \ Timeout settings\n   - Parallelism settings\n   - Agent selection\n6. Map to\
    \ remote execution:\n   - Components that can run remotely\n   - State synchronization\
    \ needs\n   - Remote display/monitoring\n   - Distributed execution possibilities\n\
    \nINPUT FILES:\n- vibey/cli/commands/implement/*.py - Implementation mode CLI\n\
    - vibey/operations/implement/*.py - Execution logic\n- vibey/operations/implement/executor.py\
    \ - Main executor\n- vibey/operations/implement/selector.py - Task selector\n\n\
    SUCCESS CRITERIA:\n- All components documented with responsibilities\n- Component\
    \ interaction diagrams complete\n- Remote execution architecture designed\n"
