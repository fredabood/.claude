      - vibey/services/implementation/executor.py (ClaudeTaskExecutor)
      - vibey/services/implementation/state.py (LoopState)
      - vibey/services/implementation/display.py (ProgressDisplay)
      - vibey/services/implementation/config.py (ImplementConfig)
