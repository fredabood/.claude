  description: "Review PM tool integrations design for remote sync architecture.\n\
    \nMETHODOLOGY:\n1. Review existing track documentation:\n   - Locate PM Tool Integrations\
    \ track\n   - Review sprint plans and task descriptions\n   - Identify architectural\
    \ decisions made\n2. Document planned integrations:\n   - Jira integration (issues,\
