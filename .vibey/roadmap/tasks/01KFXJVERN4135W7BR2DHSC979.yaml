  name: Audit CLI State Management
  description: "Document CLI state management for remote state design.\n\nMETHODOLOGY:\n\
    1. Map configuration state:\n   - .vibey/config/ directory structure\n   - Global\
    \ vs project configuration\n   - Configuration file formats\n   - Configuration\
    \ precedence rules\n2. Document context state:\n   - Current roadmap context\n\
    \   - Active track/sprint/task context\n   - Working directory context\n   - Git\
    \ repository context\n3. Analyze session state:\n   - State that persists across\
    \ commands\n   - State that resets per command\n   - Cached state for performance\n\
    \   - User preferences and settings\n4. Document state initialization:\n   - How\
    \ context is loaded on CLI start\n   - Lazy vs eager loading patterns\n   - State\
    \ validation on load\n   - Default values when state missing\n5. Map state dependencies:\n\
    \   - Which commands require which state\n   - State propagation between commands\n\
    \   - State modification patterns\n6. Remote state considerations:\n   - State\
    \ that must remain local\n   - State that should sync to remote\n   - State caching\
    \ strategies\n   - Offline state handling\n\nINPUT FILES:\n- vibey/cli/context.py\
    \ - CLI context management\n- vibey/common/config.py - Configuration handling\n\
    - .vibey/config/*.yaml - Configuration files\n\nSUCCESS CRITERIA:\n- All state\
    \ types documented\n- State flow diagrams complete\n- Remote state strategy defined\n"
