  name: Audit MCP Server Architecture
  description: "Document MCP server architecture for remote backend integration.\n\
    \nMETHODOLOGY:\n1. Document server lifecycle:\n   - Server initialization\n  \
    \ - Capability negotiation\n   - Connection handling\n   - Graceful shutdown\n\
    \   - Error recovery\n2. Document transport mechanisms:\n   - stdio transport\
    \ (default)\n   - SSE transport (if implemented)\n   - HTTP transport options\n\
    \   - WebSocket considerations\n3. Analyze server state management:\n   - Server-level\
    \ state\n   - Connection-level state\n   - Request-level state\n   - State persistence\n\
    4. Document protocol compliance:\n   - MCP protocol version\n   - Required capabilities\n\
    \   - Optional capabilities\n   - Extension points\n5. Map to remote backend:\n\
    \   - Server as local proxy to Databricks\n   - Direct Databricks MCP server\n\
    \   - Hybrid architecture options\n   - Authentication flow\n   - Request routing\
    \ logic\n\nINPUT FILES:\n- vibey/mcp/server.py - Main server implementation\n\
    - vibey/mcp/transport/*.py - Transport implementations\n- MCP protocol specification\n\
    \nSUCCESS CRITERIA:\n- Server lifecycle documented\n- Transport mechanisms documented\n\
    - Remote backend architecture designed\n"
