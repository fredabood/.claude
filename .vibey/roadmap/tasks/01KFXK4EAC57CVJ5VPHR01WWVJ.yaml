    \  - Default values and validation rules\n3. Map file operations:\n   - Read operations\
    \ (load single, load all, search)\n   - Write operations (create, update, delete)\n\
    \   - Batch operations (bulk updates, migrations)\n4. Analyze flat directory benefits:\n\
    \   - ULID-based filenames (time-sortable, unique)\n   - Git-friendly structure\
    \ (no deep nesting)\n   - File lookup patterns\n5. Document remote storage translation:\n\
    \   - How flat files map to Databricks storage\n   - Considerations for Unity\
    \ Catalog\n   - Delta Lake table alternatives\n\nINPUT FILES:\n- vibey/roadmap/models/*.py\
    \ - Data models\n- vibey/roadmap/serialization/*.py - YAML serialization\n- vibey/operations/roadmap/*.py\
    \ - File operations\n- .vibey/roadmap/**/*.yaml - Example data files\n\nSUCCESS\
    \ CRITERIA:\n- Complete YAML schema documentation for all entity types\n- File\
    \ operation inventory with read/write patterns\n- Remote storage translation recommendations\n"
