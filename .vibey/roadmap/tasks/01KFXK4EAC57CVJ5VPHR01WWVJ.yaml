    post_mortem:
      completed_at: '2026-01-27T02:30:00+00:00'
      implementation_status: YAML Storage Backend Audit Complete
      file_organization:
        structure: Flat directory with ULID-based filenames
        root_file: .vibey/roadmap/roadmap.yaml
        entity_directories:
          tracks: .vibey/roadmap/tracks/{ULID}.yaml (~54 files)
          sprints: .vibey/roadmap/sprints/{ULID}.yaml (~320 files)
          tasks: .vibey/roadmap/tasks/{ULID}.yaml (~1900 files)
        benefits:
        - 98% directory reduction vs nested structure
        - Time-sortable ULID filenames
        - Fast git operations
        - O(1) direct file lookup
      yaml_schemas:
        track:
          root_key: track
          required: id, name, roadmap_id, status, blocked, priority, created, progress
          optional: started, completed, sprints, dependencies, metadata
        sprint:
          root_key: sprint
          required: id, name, track_id, roadmap_id, status, blocked, created, progress
          optional: started, completed, development_gates, depends_on, metadata
        task:
          root_key: task
          required: id, sprint_id, track_id, roadmap_id, task_type, title, description,
            status
          optional: started, completed, gate_info (for gate tasks), commits, metadata
      serialization_patterns:
        loading: yaml.safe_load → typed objects (dataclass/Pydantic)
        dumping: typed objects → dict → yaml.dump
        datetime_format: ISO 8601 with timezone (e.g., 2026-01-27T02:30:00+00:00)
        backward_compat: v1 legacy and v2 Pydantic formats supported
      file_operations:
        read:
        - load_track/sprint/task (single)
        - load_tasks_by_sprint/track (filtered)
        - load_all_tasks (full scan)
        write:
        - save_track/sprint/task (single)
        - save_tasks (batch)
        sync:
        - SyncManager.dump (SQLite → YAML)
        - SyncManager.rebuild (YAML → SQLite)
      remote_storage_translation:
        databricks_mapping:
        - YAML files → Delta Lake tables
        - Each entity type → separate table
        - ULID → primary key
        - Progress objects → nested columns or separate tables
        unity_catalog:
        - Schema per environment (dev/prod)
        - Tables for roadmap, tracks, sprints, tasks
        - Standard Delta Lake format
      success_criteria_met:
      - 'YAML schema documented for all entity types: YES'
      - 'File operation inventory complete: YES'
      - 'Remote storage translation recommendations: YES'
