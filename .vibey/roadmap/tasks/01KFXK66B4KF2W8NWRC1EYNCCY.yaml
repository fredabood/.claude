  title: Audit SQLite Storage Backend
  description: "Document SQLite database architecture to inform Delta Lake table design\
    \ for remote mode.\n\nMETHODOLOGY:\n1. Extract and document database schema:\n\
    \   - Run: sqlite3 .vibey/roadmap/roadmap.db \".schema\"\n   - Document all 33\
    \ tables with columns, types, constraints\n   - Document all 13 views with their\
    \ queries\n   - Document all 40 triggers with their logic\n2. Analyze table relationships:\n\
    \   - Foreign key constraints\n   - Join patterns in views\n   - Cascade behaviors\n\
    3. Document query patterns:\n   - Common SELECT patterns\n   - Index usage\n \
    \  - Aggregation queries (progress rollup)\n4. Map to Delta Lake design:\n   -\
    \ Table-by-table translation considerations\n   - View equivalent in Databricks\
    \ SQL\n   - Trigger alternatives (Databricks workflows, streaming)\n5. Identify\
    \ SQLite-specific features:\n   - Features without Delta Lake equivalent\n   -\
    \ Performance considerations\n   - Transaction semantics differences\n\nINPUT\
    \ FILES:\n- .vibey/roadmap/roadmap.db - SQLite database\n- vibey/operations/roadmap/db/*.py\
    \ - Database operations\n- vibey/roadmap/models/*.py - ORM models if present\n\
    \nSUCCESS CRITERIA:\n- Complete schema documentation (33 tables, 13 views, 40\
    \ triggers)\n- Query pattern inventory\n- Delta Lake translation guide with recommendations\n"
