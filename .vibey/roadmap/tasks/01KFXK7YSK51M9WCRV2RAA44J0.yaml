        - Phase 1: Load tracks from tracks/*.yaml
        - Phase 2: Load sprints from sprints/*.yaml
        - Phase 3: Load tasks from tasks/*.yaml
        features:
        - Backup before rebuild
        - Strict mode (abort on error) or lenient (skip invalid)
        - Error tracking for skipped files
      conflict_detection:
        mechanism: SHA-256 checksum comparison
        tracking_table: yaml_checksums
        conflict_types:
        - yaml_modified
        - db_modified
        - both_modified
        - file_deleted
        - integrity_error
        dirty_flag: database_state.is_dirty
      reconciliation:
        issues_detected:
        - Null completed dates on completed tasks
        - Completed sprint with incomplete tasks
        - Completed track with incomplete sprints
        execution_modes: dry-run, fix, verbose
      sync_triggers:
        user_initiated:
        - vibey roadmap db rebuild
        - vibey roadmap db dump
        automatic: mtime-based lazy sync before operations
        post_operation: Progress recalculation via recalculate_all()
      validation_layers:
        fast: YAML syntax, schema compliance
        advanced: Circular deps, orphans, referential integrity
        round_trip: YAML → SQLite → YAML cycle verification
      remote_sync_requirements:
