    post_mortem:
      completed_at: '2026-01-26T21:45:00+00:00'
      sync_architecture:
        source_of_truth: YAML files in .vibey/roadmap/
        query_cache: SQLite database (.vibey/roadmap.db)
        sync_direction: One-way YAML -> DB (rebuild)
        sync_tables: yaml_checksums, database_state, sync_conflicts
      rebuild_process:
        trigger: vibey roadmap db rebuild
        steps:
        - Safety check (is_dirty flag)
        - Backup creation (.db.bak)
        - Database deletion and reinitialization
        - Schema creation (25 tables, 21 views, 40 triggers)
        - YAML file scanning and FK validation
        - Progress counter recalculation
      conflict_detection:
        mechanisms:
        - Modification time comparison (mtime)
        - Checksum tracking (SHA-256)
        - Dirty flag (database_state.is_dirty)
        conflict_states:
        - IN_SYNC: DB matches YAML
        - DB_AHEAD: DB has uncommitted changes
        - YAML_AHEAD: YAML modified externally
        - CONFLICT: Both changed independently
      remote_sync_requirements:
        current_limitations:
        - No bidirectional sync
        - Manual conflict resolution only
        - No offline support
        - Full rebuild only (no incremental)
        required_for_remote:
        - Operation journal with vector clocks
        - 3-way merge algorithm
        - CRDT data structures
        - Offline operation queuing
        - Incremental entity-level sync
      implementation_phases:
      - Phase 1: Local infrastructure (vector clocks, operation journal)
      - Phase 2: Network foundation (HTTP/gRPC API)
      - Phase 3: Conflict resolution (3-way merge, CRDT)
      - Phase 4: Offline support (queue + replay)
      - Phase 5: Testing and hardening
      success_criteria_met:
      - Complete sync flow documentation: true
      - Conflict resolution strategy documented: true
      - Remote sync requirements identified: true
