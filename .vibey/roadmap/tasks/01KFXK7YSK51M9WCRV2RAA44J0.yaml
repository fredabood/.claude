      sync_architecture:
        source_of_truth: YAML files (.vibey/roadmap/)
        query_cache: SQLite (.vibey/roadmap.db)
        design: YAML-first, SQLite-cache architecture
      sync_operations:
        rebuild: YAML → SQLite (recreates database)
        dump: SQLite → YAML (exports changes)
        auto_sync: mtime-based detection via check_sync_needed()
      rebuild_process:
