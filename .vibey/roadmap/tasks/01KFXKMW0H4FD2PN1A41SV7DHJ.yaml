      remote_mode_requirements:
        critical_path:
        - Remote storage backend (Delta Lake tables)
        - Bidirectional sync protocol (YAML ↔ Delta Lake)
        - Authentication layer (Databricks tokens)
        - Distributed conflict resolution
        architecture_patterns:
          adapter_pattern: RoadmapAdapter abstracts local vs remote
          proxy_pattern: Local MCP proxy to remote API
          cache_pattern: Local SQLite caches remote data
          queue_pattern: Offline changes queued for sync
        state_distribution:
          remote_delegable: Query operations, token estimation, validation
          local_only: Git operations, file watching, pre-commit hooks
          coordination_required: Status transitions, conflict detection, sync
      feature_parity_assessment:
        direct_port: 60% (query commands, status, show, read-only operations)
        needs_adaptation: 30% (start, complete, create - add remote sync)
        new_implementation: 10% (Delta Lake backend, remote auth)
        not_applicable: Local git hooks, file watchers
      recommended_architecture:
        mode_selection: Environment-based (VIBEY_MODE=local|remote|hybrid)
        adapter_layer: RoadmapAdapter with LocalBackend and RemoteBackend
        sync_strategy: Optimistic locking with checksum comparison
        cache_layer: SQLite as local cache for remote data
        offline_support: Queue operations for later sync
      risk_assessment:
