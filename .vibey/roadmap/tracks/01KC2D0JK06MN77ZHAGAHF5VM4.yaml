    notes: "Atlassian integration using PLUGGABLE SEMANTIC LAYER architecture.\n\n\
      DESIGN REFERENCE: sqlite-backend-6/context/architecture/02-CLASS-MODEL.md\n\
      CODE REFERENCE: sqlite-backend-6/context/sample_code/models/semantic_layer.py\n\
      \nARCHITECTURE INTEGRATION:\nThis track implements the JiraSemanticLayer from\
      \ the unified ticket architecture.\nThe semantic layer allows Jira's hierarchy\
      \ to override the default Vibey hierarchy\nwhile sharing Layers 0-2 (Completable,\
      \ Ticket, HierarchicalTicket).\n\nJIRA SEMANTIC LAYER:\n- JiraProject (extends\
      \ HierarchicalTicket) → maps to roadmap.yaml\n- JiraEpic (extends HierarchicalTicket)\
      \ → maps to tracks/\n- JiraSprint (extends HierarchicalTicket) → maps to sprints/\n\
      - JiraIssue (extends HierarchicalTicket) → maps to tasks/\n- JiraSubtask (extends\
      \ HierarchicalTicket) → maps to tasks/ with parent_id\n\nSTATUS MAPPING:\nUses\
      \ SemanticLayer.map_status_to_canonical() and map_status_from_canonical()\n\
      - \"To Do\" → TicketStatus.NOT_STARTED\n- \"In Progress\" → TicketStatus.IN_PROGRESS\n\
      - \"Done\" → TicketStatus.COMPLETED\n- (configurable per Jira workflow)\n\n\
      EXTERNAL ID TRACKING:\n- external_id field stores Jira issue key (e.g., \"PROJ-123\"\
      )\n- Internal ULID remains primary key\n- Enables bidirectional sync\n\nTYPE-SPECIFIC\
      \ FIELDS:\nJira fields stored in type_fields JSON:\n- issue_key, story_points,\
      \ components[], labels[]\n- fix_versions[], affected_versions[]\n- custom fields\
      \ from Jira project config\n\nCONFLUENCE INTEGRATION:\n- Confluence pages can\
      \ become Artifact entities\n- artifact_type: DOCUMENTATION\n- documents_artifact_id\
      \ links to source artifacts\n- Staleness detection via documented_source_hash\n\
      \nSYNC MODES:\n1. Jira as Source of Truth (recommended for teams)\n   - Changes\
      \ in Jira push to Vibey\n   - Vibey is read-only reflection\n2. Vibey as Source\
      \ of Truth (solo developers)\n   - Changes in Vibey push to Jira\n   - Jira\
      \ reflects Vibey state\n3. Bidirectional (advanced)\n   - Changes sync both\
      \ ways\n   - Conflict resolution required\n\nAUTHENTICATION:\n- Atlassian Cloud:\
      \ OAuth 2.0 (3LO)\n- Atlassian Server/DC: Personal Access Tokens\n- Service\
      \ account support for automation\n\nCLI COMMANDS:\n- vibey atlassian connect\n\
      - vibey atlassian sync jira\n- vibey atlassian sync confluence\n- vibey atlassian\
      \ status\n- vibey atlassian import <project>\n- vibey atlassian export <track>\n"
  slug: atlassian-integration
