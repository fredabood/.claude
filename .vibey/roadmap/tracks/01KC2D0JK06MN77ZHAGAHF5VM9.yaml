    notes: "HOMEBREW DISTRIBUTION\n\nProvides `brew install vibey` for macOS and Linux\
      \ users.\n\nTWO OPTIONS FOR FORMULA:\n1. PyPI-based: Downloads from PyPI, installs\
      \ with pip\n   - Pro: Simple, leverages existing PyPI release\n   - Con: Requires\
      \ Python dependency management\n2. Source-based: Builds from GitHub release\
      \ tarball\n   - Pro: More control, can pin dependencies\n   - Con: More complex\
      \ formula\n\nRECOMMENDED: PyPI-based formula using virtualenv resource.\n\n\
      TAP REPOSITORY:\n- Create github.com/vibey-framework/homebrew-vibey\n- Users\
      \ install with: brew tap vibey-framework/vibey && brew install vibey\n- Or shorthand:\
      \ brew install vibey-framework/vibey/vibey\n\nFUTURE: Submit to homebrew-core\
      \ for `brew install vibey` without tap.\n\nDEPENDENCIES:\n- python@3.11 or python@3.12\n\
      - No native dependencies (pure Python)\n\nBLOCKED BY: python-package track must\
      \ complete first (need PyPI release)\n"
