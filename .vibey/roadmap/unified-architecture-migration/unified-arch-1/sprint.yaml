sprint:
  id: unified-arch-1
  track_id: unified-architecture-migration
  roadmap_id: vibey-framework-v2
  name: Directory Structure Migration
  description: |
    Migrate from nested directory structure (track/sprint/task) to flat structure
    (tracks/, sprints/, tasks/) as designed in sqlite-backend-6/context/architecture/09-DESIGN-DECISIONS.md.

    CURRENT STRUCTURE (1,300+ directories):
    .vibey/roadmap/
    ├── track-id/
    │   ├── track.yaml
    │   └── sprint-id/
    │       ├── sprint.yaml
    │       └── task-id/
    │           └── task.yaml

    TARGET STRUCTURE (~30 directories):
    .vibey/roadmap/
    ├── roadmap.yaml
    ├── tracks/
    │   └── {track-id}.yaml
    ├── sprints/
    │   └── {sprint-id}.yaml
    ├── tasks/
    │   └── {task-id}.yaml
    ├── artifacts/
    └── context/

    Benefits:
    - 98% reduction in directories
    - Max depth 4 levels (from 10+)
    - Simpler navigation and tooling
    - Better git performance
  status: not_started
  blocked: false
  created: '2025-12-07T15:00:00+00:00'
  started: null
  completed: null
  goal: Flatten roadmap directory structure from nested to flat organization
  success_criteria:
  - All track.yaml files moved to tracks/ directory
  - All sprint.yaml files moved to sprints/ directory
  - All task.yaml files moved to tasks/ directory
  - Context files consolidated to context/ directory
  - All YAML file references updated
  - Round-trip validation passes
  - Git history preserved via moves (not delete+create)
  tasks:
  - id: unified-arch-1-task-001
    title: Design flat directory schema and file naming convention
    status: not_started
  - id: unified-arch-1-task-002
    title: Create directory migration script with backup
    status: not_started
  - id: unified-arch-1-task-003
    title: Update YAML loader to support flat structure
    status: not_started
  - id: unified-arch-1-task-004
    title: Update YAML dumper to use flat structure
    status: not_started
  - id: unified-arch-1-task-005
    title: Execute migration with validation
    status: not_started
  - id: unified-arch-1-task-006
    title: Update CLI path resolution and documentation
    status: not_started
  dependencies: []
  blocks: []
  blocked_by: []
  depends_on: []
  depended_on_by: []
  development_gates: []
  deliverables:
  - path: vibey/roadmap/serialization/directory_migration.py
    type: code
    description: Migration script for directory restructuring
  risks:
  - Git history may be disrupted if using delete+create instead of git mv
  - References between files may break if not updated atomically
  metadata:
    design_reference: sqlite-backend-6/context/architecture/09-DESIGN-DECISIONS.md
