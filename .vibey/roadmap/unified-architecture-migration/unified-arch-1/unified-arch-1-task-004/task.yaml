  title: Update YAML dumper to use flat structure
  description: |
    Modify yaml_dumper.py to write files using flat directory structure.

    CHANGES REQUIRED:
    1. Update output path calculation
    2. Create flat directories on first write
    3. Support configuration flag for structure format
    4. Update dump_roadmap() to use new paths

    IMPLEMENTATION:
    ```python
    def get_track_path(track_id: str, roadmap_dir: Path, flat: bool = True) -> Path:
        if flat:
            return roadmap_dir / "tracks" / f"{track_id}.yaml"
        return roadmap_dir / track_id / "track.yaml"

    def dump_track(track: Track, roadmap_dir: Path, flat: bool = True) -> None:
        path = get_track_path(track.id, roadmap_dir, flat)
        path.parent.mkdir(parents=True, exist_ok=True)
        with open(path, 'w') as f:
            yaml.dump(track_to_dict(track), f)
    ```

    Also need to update:
