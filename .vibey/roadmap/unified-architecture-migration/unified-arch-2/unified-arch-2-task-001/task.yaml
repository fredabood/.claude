  title: Design unified completables table schema
  description: |
    Design the unified completables table that replaces separate roadmaps, tracks, sprints, tasks tables.

    DESIGN (from 05-DATABASE-SCHEMA.md):
    ```sql
    CREATE TABLE completables (
        -- Identity (ULID)
        id TEXT PRIMARY KEY,
        type TEXT NOT NULL CHECK (type IN ('roadmap', 'track', 'sprint', 'task', 'artifact')),

        -- Hierarchy
        parent_id TEXT REFERENCES completables(id),
        sequence INTEGER DEFAULT 0,
        slug TEXT NOT NULL,

        -- Core fields
        name TEXT NOT NULL,
        description TEXT,
        status TEXT NOT NULL,

        -- Timestamps
        created_at TEXT NOT NULL,
        updated_at TEXT,
        started_at TEXT,
        completed_at TEXT,

        -- Type-specific fields (JSON)
        type_specific TEXT,  -- JSON blob for type-specific fields

        -- Metadata
        metadata TEXT
    );
    ```

    DECISIONS NEEDED:
    1. Which fields go in main table vs type_specific JSON?
    2. Index strategy for common queries
    3. View definitions for type-specific access
