  task_type: design
  title: Design criteria table with polymorphic targets
  description: |
    Design the unified criteria table that replaces blocked_by, depends_on, deliverables, quality_gates.

    DESIGN (from 05-DATABASE-SCHEMA.md):
    ```sql
    CREATE TABLE criteria (
        id TEXT PRIMARY KEY,
        completable_id TEXT NOT NULL REFERENCES completables(id),

        -- Core criterion fields
        description TEXT NOT NULL,
        blocks_transition_to TEXT NOT NULL CHECK (
            blocks_transition_to IN ('in_progress', 'completed', 'production_ready')
        ),
        required INTEGER NOT NULL DEFAULT 1,
        is_met INTEGER NOT NULL DEFAULT 0,

        -- Polymorphic target
        target_type TEXT NOT NULL CHECK (
            target_type IN (
                'completable', 'file_exists', 'threshold', 'test_passes',
                'manual', 'artifact', 'symbol_exists', 'command_exists'
            )
        ),
        target_config TEXT NOT NULL,  -- JSON with target-specific fields

        -- Metadata
        created_at TEXT NOT NULL,
        evaluated_at TEXT
    );
    ```

    TARGET TYPES:
    - completable: references another completable (dependency)
    - file_exists: file must exist at path
    - threshold: numeric value must meet threshold
    - test_passes: test command must pass
    - manual: requires manual verification
    - artifact: references artifact entity
