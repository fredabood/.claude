  task_type: design
  title: Design artifacts table schema
  description: |
    Design the artifacts table for first-class artifact entities.

    DESIGN (from 03-ARTIFACT-SYSTEM.md):
    ```sql
    CREATE TABLE artifacts (
        id TEXT PRIMARY KEY,
        name TEXT NOT NULL,
        description TEXT,

        -- File location
        paths TEXT NOT NULL,  -- JSON array of file paths
        content_hash TEXT,
        last_verified TEXT,

        -- Classification
        artifact_type TEXT NOT NULL,
        artifact_subtype TEXT,

        -- Provenance (JSON)
        provenance TEXT NOT NULL,

        -- Relationships
        documents_artifact_id TEXT REFERENCES artifacts(id),

        -- State
        exists INTEGER NOT NULL DEFAULT 1,
        is_stale INTEGER NOT NULL DEFAULT 0,

        -- Timestamps
        created_at TEXT NOT NULL,
        updated_at TEXT
    );

    CREATE TABLE artifact_dependencies (
        artifact_id TEXT NOT NULL REFERENCES artifacts(id),
        depends_on_artifact_id TEXT NOT NULL REFERENCES artifacts(id),
        PRIMARY KEY (artifact_id, depends_on_artifact_id)
    );
    ```

    ARTIFACT TYPES:
    - code: Source code files
    - test: Test files
    - documentation: Documentation files
    - context: Context/planning documents
    - config: Configuration files
    - agent: Vibey agent definitions
    - workflow: Vibey workflow definitions
    - template: Vibey template files
