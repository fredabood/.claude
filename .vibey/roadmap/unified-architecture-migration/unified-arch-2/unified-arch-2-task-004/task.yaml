  title: Create schema migration script
  description: |
    Create a script to migrate from legacy schema to unified schema.

    MIGRATION STEPS:
    1. Create new tables (completables, criteria, artifacts)
    2. Copy data from legacy tables to completables
    3. Convert blocked_by/depends_on to criteria rows
    4. Convert deliverables to criteria rows
    5. Convert quality_gates to criteria rows
    6. Create views for backward compatibility
    7. Drop legacy tables (optional, can keep for rollback)

    IMPLEMENTATION:
    ```python
    def migrate_to_v2_schema(db_path: Path, dry_run: bool = True) -> MigrationResult:
        conn = sqlite3.connect(db_path)

        # 1. Create backup
        backup_path = create_backup(db_path)

        # 2. Create new tables
        conn.executescript(SCHEMA_V2_SQL)

        # 3. Migrate roadmaps → completables
        for row in conn.execute("SELECT * FROM roadmaps"):
            insert_completable(conn, 'roadmap', row)

        # 4. Migrate tracks → completables
        # 5. Migrate sprints → completables
        # 6. Migrate tasks → completables

        # 7. Convert blocked_by → criteria
        migrate_blocked_by_to_criteria(conn)

        # 8. Convert depends_on → criteria
        migrate_depends_on_to_criteria(conn)

        # 9. Convert deliverables → criteria
        migrate_deliverables_to_criteria(conn)

        return MigrationResult(...)
    ```
