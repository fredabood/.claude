  title: Update sql_loader for unified schema
  description: |
    Update sql_loader.py to load from unified schema (completables + criteria tables).

    CHANGES REQUIRED:
    1. Load from completables table instead of separate tables
    2. Load criteria and construct Criterion objects
    3. Return new Pydantic models (RoadmapTicket, TrackTicket, etc.)
    4. Support both v1 and v2 schemas during transition

    IMPLEMENTATION:
    ```python
    def load_task_v2(task_id: str) -> TaskTicket:
        conn = get_connection()

        # Load from completables
        row = conn.execute(
            "SELECT * FROM completables WHERE id = ? AND type = 'task'",
            (task_id,)
        ).fetchone()

        # Load criteria
        criteria_rows = conn.execute(
            "SELECT * FROM criteria WHERE completable_id = ?",
            (task_id,)
        ).fetchall()

        criteria = [row_to_criterion(row) for row in criteria_rows]

        return TaskTicket(
            id=row['id'],
            name=row['name'],
            criteria=criteria,
            ...
        )
    ```
