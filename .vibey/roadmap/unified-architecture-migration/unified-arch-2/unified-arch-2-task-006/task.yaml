  task_type: development
  title: Update sql_dumper for unified schema
  description: |
    Update sql_dumper.py to write to unified schema (completables + criteria tables).

    CHANGES REQUIRED:
    1. Write to completables table instead of separate tables
    2. Write criteria from Criterion objects
    3. Accept new Pydantic models (RoadmapTicket, TrackTicket, etc.)
    4. Support both v1 and v2 schemas during transition

    IMPLEMENTATION:
    ```python
    def dump_task_v2(task: TaskTicket) -> None:
        conn = get_connection()

        # Insert into completables
        conn.execute('''
            INSERT OR REPLACE INTO completables
            (id, type, parent_id, name, status, ...)
            VALUES (?, 'task', ?, ?, ?, ...)
        ''', (task.id, task.parent_ref, task.name, task.status.value, ...))

        # Insert criteria
        for criterion in task.criteria:
            conn.execute('''
                INSERT OR REPLACE INTO criteria
                (id, completable_id, description, blocks_transition_to, target_type, target_config)
                VALUES (?, ?, ?, ?, ?, ?)
            ''', (
                criterion.id,
                task.id,
                criterion.description,
                criterion.blocks_transition_to.value,
                get_target_type(criterion.target),
                json.dumps(get_target_config(criterion.target))
            ))

        conn.commit()
    ```
