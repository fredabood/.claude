  title: Add ULID generation and validation
  description: |
    Implement ULID generation and validation utilities.

    ULID FORMAT:
    - 26 characters, Crockford Base32
    - First 10 chars: timestamp (48 bits)
    - Last 16 chars: randomness (80 bits)
    - Lexicographically sortable
    - Example: 01HXYZ123ABC456DEF789GHJ

    IMPLEMENTATION:
    ```python
    import ulid

    def generate_ulid() -> str:
        return str(ulid.new())

    def validate_ulid(value: str) -> bool:
        try:
            ulid.parse(value)
            return True
        except ValueError:
            return False

    def ulid_timestamp(value: str) -> datetime:
        return ulid.parse(value).timestamp().datetime
    ```

    DEPENDENCIES:
    - python-ulid package

    INTEGRATION:
    - Add to vibey/roadmap/identity/__init__.py
    - Use in model constructors when id not provided
