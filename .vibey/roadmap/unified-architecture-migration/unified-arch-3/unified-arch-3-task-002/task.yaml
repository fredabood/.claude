  title: Create .id file format and parser
  description: |
    Implement .id file format for mapping slugs to ULIDs.

    FILE FORMAT:
    ```
    # .vibey/roadmap/tracks/.id
    # Maps human-readable slugs to immutable ULIDs
    sqlite-backend = 01HXYZ123ABC456DEF789GHJ
    unified-architecture-migration = 01HXYZ987ZYX654CBA321MLK
    ```

    IMPLEMENTATION:
    ```python
    class IdFile:
        def __init__(self, path: Path):
            self.path = path
            self._mappings: Dict[str, str] = {}
            self._load()

        def get_ulid(self, slug: str) -> Optional[str]:
            return self._mappings.get(slug)

        def get_slug(self, ulid: str) -> Optional[str]:
            for slug, id in self._mappings.items():
                if id == ulid:
                    return slug
            return None

        def register(self, slug: str, ulid: str) -> None:
            self._mappings[slug] = ulid
            self._save()

        def rename_slug(self, old_slug: str, new_slug: str) -> None:
            ulid = self._mappings.pop(old_slug)
            self._mappings[new_slug] = ulid
            self._save()
    ```

    FILE LOCATIONS:
    - .vibey/roadmap/tracks/.id
    - .vibey/roadmap/sprints/.id
    - .vibey/roadmap/tasks/.id
