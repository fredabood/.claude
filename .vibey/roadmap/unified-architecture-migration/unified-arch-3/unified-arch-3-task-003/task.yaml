  title: Update YAML loader/dumper for ULID
  description: |
    Update YAML serialization to use ULIDs and .id files.

    YAML FORMAT CHANGES:
    ```yaml
    # OLD
    task:
      id: sqlite-backend-6-task-004
      sprint_id: sqlite-backend-6

    # NEW
    task:
      id: 01HXYZ123ABC456DEF789GHJ
      slug: sqlite-backend-6-task-004
      sequence: 4
      parent_ref: 01HXYZ987ZYX654CBA321MLK
    ```

    LOADER CHANGES:
    - Check .id file for ULID → slug mapping
    - Support loading by slug (lookup in .id file)
    - Populate sequence from file ordering or explicit field
    - Populate slug from filename or explicit field

    DUMPER CHANGES:
    - Write ULID as id field
    - Write slug field
    - Write sequence field
    - Update .id file on save
