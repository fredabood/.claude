  title: Create ULID migration script
  description: |
    Create a migration script to assign ULIDs to all existing entities.

    MIGRATION STEPS:
    1. Scan all existing entities
    2. Generate ULID for each entity
    3. Create .id files with slug → ULID mappings
    4. Update all YAML files with new id, slug, sequence fields
    5. Update database with ULIDs
    6. Update cross-references to use ULIDs

    IMPLEMENTATION:
    ```python
    def migrate_to_ulid(root_dir: Path, dry_run: bool = True) -> MigrationResult:
        # 1. Scan existing entities
        tracks = scan_tracks(root_dir)
        sprints = scan_sprints(root_dir)
        tasks = scan_tasks(root_dir)

        # 2. Generate ULIDs (preserve creation order for sortability)
        ulid_map = {}
        for entity in sorted_by_created_at(tracks + sprints + tasks):
            ulid_map[entity.id] = generate_ulid()

        # 3. Create .id files
        create_id_files(root_dir, ulid_map)

        # 4. Update YAML files
        for track in tracks:
            update_yaml_with_ulid(track.path, ulid_map)
        # ... sprints, tasks

        # 5. Update database
        update_db_with_ulids(ulid_map)

        # 6. Update cross-references
        update_references(root_dir, ulid_map)

        return MigrationResult(...)
    ```
