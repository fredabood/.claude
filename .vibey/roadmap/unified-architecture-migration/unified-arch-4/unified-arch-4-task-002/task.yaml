  task_type: development
  title: Create v1 to v2 YAML migration script
  description: |
    Create script to convert v1 YAML files to v2 format.

    CONVERSIONS:
    1. blocked_by → criteria
       ```python
       for blocker in v1_data.get('blocked_by', []):
           criteria.append({
               'id': f"blocker-{blocker['target_id']}",
               'description': blocker.get('description', f"Blocked by {blocker['target_id']}"),
               'blocks_transition_to': 'in_progress',
               'target': {
                   'type': 'completable',
                   'completable_id': ulid_map[blocker['target_id']],
                   'required_status': 'completed'
               }
           })
       ```

    2. depends_on → criteria (similar to blocked_by)

    3. deliverables → criteria
       ```python
       for deliverable in v1_data.get('deliverables', []):
           criteria.append({
               'id': f"deliverable-{hash(deliverable['path'])}",
               'description': deliverable.get('description', f"File must exist: {deliverable['path']}"),
               'blocks_transition_to': 'completed',
               'target': {
                   'type': 'file_exists',
                   'path': deliverable['path'],
                   'deliverable_type': deliverable.get('type', 'other')
               }
           })
       ```

    4. quality_gates → criteria with ThresholdTarget

    5. Remove computed fields (blocked, progress)
