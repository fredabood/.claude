  task_type: development
  title: Update yaml_loader for v2 format only
  description: |
    Simplify yaml_loader to only support v2 format after migration.

    CHANGES:
    1. Remove v1 format detection and handling
    2. Remove legacy field mapping
    3. Load criteria directly to Criterion objects
    4. Load CriterionTarget based on target.type
    5. Return new Pydantic models only

    IMPLEMENTATION:
    ```python
    def load_task(task_path: Path) -> TaskTicket:
        with open(task_path) as f:
            data = yaml.safe_load(f)['task']

        criteria = [
            Criterion(
                id=c['id'],
                description=c['description'],
                blocks_transition_to=TicketStatus(c['blocks_transition_to']),
                target=load_target(c['target']),
                required=c.get('required', True),
            )
            for c in data.get('criteria', [])
        ]

        return TaskTicket(
            id=data['id'],
            slug=data['slug'],
            sequence=data['sequence'],
            parent_ref=data['parent_ref'],
            name=data['name'],
            criteria=criteria,
            ...
        )
    ```
