  title: Migrate query operations to unified models
  description: |
    Update query.py to use new Pydantic models.

    CURRENT:
    - query_roadmap_summary() returns dict built from legacy models
    - query_track_details() returns dict
    - query_sprint_details() returns dict
    - query_task_details() returns dict

    TARGET:
    - query_roadmap() returns RoadmapTicket
    - query_track() returns TrackTicket
    - query_sprint() returns SprintTicket
    - query_task() returns TaskTicket
    - Summary functions derive from model properties

    IMPLEMENTATION:
    ```python
    def query_task(task_id: str, root_dir: Path) -> TaskTicket:
        backend = get_backend(root_dir)
        return backend.load_task(task_id)

    def query_task_details(task_id: str, root_dir: Path) -> Dict[str, Any]:
        task = query_task(task_id, root_dir)
        return {
            'id': task.id,
            'name': task.name,
            'status': task.status.value,
            'progress': task.progress.completion_percent,
            'blocking_reasons': task.blocking_reasons,
            'criteria': [c.model_dump() for c in task.criteria],
            ...
        }
    ```
