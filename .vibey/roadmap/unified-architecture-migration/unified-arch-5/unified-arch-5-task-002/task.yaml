  task_type: development
  title: Migrate update operations to unified models
  description: |
    Update update.py to use new Pydantic models.

    CURRENT:
    - update_task_status() modifies legacy Task and saves
    - update_sprint_status() modifies legacy Sprint
    - Blocking checks scattered

    TARGET:
    - update_task() accepts TaskTicket modifications
    - Uses model's start()/complete() methods
    - Blocking enforced via can_transition_to()

    IMPLEMENTATION:
    ```python
    def update_task_status(
        task_id: str,
        new_status: str,
        root_dir: Path
    ) -> TaskTicket:
        task = query_task(task_id, root_dir)
        target_status = TicketStatus(new_status)

        # Use model's transition check
        can, reasons = task.can_transition_to(target_status)
        if not can:
            raise TransitionBlockedError(task_id, target_status, reasons)

        # Use model's lifecycle methods
        if target_status == TicketStatus.IN_PROGRESS:
            task = task.start()
        elif target_status == TicketStatus.COMPLETED:
            task = task.complete()

        backend = get_backend(root_dir)
        backend.save_task(task)
        return task
    ```
