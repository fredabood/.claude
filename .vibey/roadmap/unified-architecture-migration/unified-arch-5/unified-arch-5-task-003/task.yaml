  task_type: development
  title: Migrate status transitions to use can_transition_to
  description: |
    Centralize all status transition logic to use Completable.can_transition_to().

    CURRENT STATE:
    - Blocking checks in multiple places
    - Some transitions bypass validation
    - Inconsistent error messages

    TARGET STATE:
    - ALL transitions go through can_transition_to()
    - Single source of truth for blocking
    - Consistent error messages with blocking reasons

    AFFECTED CODE:
    - status_manager.py - auto-progression
    - update.py - manual status updates
    - Any direct status modifications

    IMPLEMENTATION:
    ```python
    class TransitionBlockedError(Exception):
        def __init__(self, ticket_id: str, target: TicketStatus, reasons: List[str]):
            self.ticket_id = ticket_id
            self.target = target
            self.reasons = reasons
            super().__init__(
                f"Cannot transition {ticket_id} to {target.value}: "
                + ", ".join(reasons)
            )

    def transition_ticket(
        ticket: HierarchicalTicket,
        target: TicketStatus
    ) -> HierarchicalTicket:
        can, reasons = ticket.can_transition_to(target)
        if not can:
            raise TransitionBlockedError(ticket.id, target, reasons)

        if target == TicketStatus.IN_PROGRESS:
            return ticket.start()
        elif target == TicketStatus.COMPLETED:
            return ticket.complete()
        # ... etc
    ```
