  title: Implement artifact operations
  description: |
    Implement operations for managing artifacts as first-class entities.

    NEW OPERATIONS:
    1. list_artifacts() - List all registered artifacts
    2. show_artifact(id) - Show artifact details
    3. adopt_artifact(path) - Register existing file as artifact
    4. orphan_artifacts() - List artifacts not referenced by any ticket
    5. stale_artifacts() - List stale documentation artifacts
    6. impact_analysis(files) - Show tickets affected by file changes

    IMPLEMENTATION:
    ```python
    def list_artifacts(root_dir: Path) -> List[Artifact]:
        backend = get_backend(root_dir)
        return backend.load_all_artifacts()

    def adopt_artifact(
        path: str,
        artifact_type: ArtifactType,
        root_dir: Path
    ) -> Artifact:
        artifact = Artifact(
            id=generate_ulid(),
            name=Path(path).stem,
            paths=[path],
            artifact_type=artifact_type,
            provenance=ArtifactProvenance.pre_existing(),
        )
        artifact.refresh_content_hash(root_dir)

        backend = get_backend(root_dir)
        backend.save_artifact(artifact)
        return artifact

    def orphan_artifacts(root_dir: Path) -> List[Artifact]:
        artifacts = list_artifacts(root_dir)
        return [a for a in artifacts if a.is_orphan]
    ```
