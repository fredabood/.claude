  title: Update CLI commands for new models
  description: |
    Update CLI commands to use new operations and display criteria-based info.

    COMMAND UPDATES:
    1. vibey roadmap status - Show criteria-based progress
    2. vibey roadmap show - Display criteria, blocking reasons
    3. vibey roadmap update - Use can_transition_to() for validation
    4. vibey roadmap blocking - Show what's blocking transitions

    NEW COMMANDS:
    1. vibey artifact list - List all artifacts
    2. vibey artifact show <id> - Show artifact details
    3. vibey artifact adopt <path> - Register file as artifact
    4. vibey artifact orphans - Show unreferenced artifacts
    5. vibey artifact impact <files> - Show affected tickets

