    notes: |
      Comprehensive test coverage for all vibey Python library components.

      SUCCESS CRITERIA:
      - 100% code coverage (line and branch)
      - 95%+ test pass rate
      - All public APIs tested
      - Error paths tested
      - Edge cases covered

      LIBRARY COMPONENTS:
      1. vibey/cli/ - CLI commands and entry points
      2. vibey/operations/ - Core business logic
         - roadmap/ - Roadmap operations
         - docs/ - Documentation operations
      3. vibey/roadmap/ - Models and serialization
      4. vibey/config/ - Config loading and models
      5. vibey/common/ - Shared utilities and errors
      6. vibey/mcp/ - MCP server implementation
      7. vibey/adapters/ - Platform adapters

      COVERAGE ENFORCEMENT:
      - pytest-cov for coverage measurement
      - CI fails if coverage < 100%
      - CI fails if pass rate < 95%
      - Coverage badges in README
      - Per-module coverage reports
