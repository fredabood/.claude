    notes: |
      Comprehensive audit ensuring documentation, user journeys, and test
      coverage have 100% coverage of Vibey's functionality.

      PART 1: DOCUMENTATION & UX (Sprints 1-6)
      1. Audit existing docs and code
      2. Build CLI reference auto-generation (100% coverage)
      3. Map actual user journeys per persona (discover pain points)
      4. Generate user journey walkthroughs (100% CLI coverage)
      5. Analyze friction and gaps
      6. Create prioritized improvement roadmap

      KEY INSIGHT:
      Journey mapping (Sprint 3) happens BEFORE walkthrough generation
      (Sprint 4) so that the walkthroughs address discovered pain points.

      PART 2: TEST COVERAGE (Sprints 7-13)
      7. CLI test coverage (vibey/cli/)
      8. Operations library coverage (vibey/operations/)
      9. Roadmap models coverage (vibey/roadmap/)
      10. Config system coverage (vibey/config/)
      11. Common utilities coverage (vibey/common/)
      12. MCP & adapters coverage (vibey/mcp/, vibey/adapters/)
      13. Integration tests & final validation

      SUCCESS CRITERIA:
      - 100% documentation coverage
      - 100% user journey coverage
      - 100% code coverage (line and branch)
      - 95%+ test pass rate
      - CI enforcement to prevent regression
