    notes: |
      Comprehensive audit ensuring documentation, user journeys, and test
      coverage have 100% coverage of Vibey's functionality.

      PART 1: DOCUMENTATION & UX DISCOVERY (Sprints 1-6)
      1. Audit existing docs and code
      2. Build CLI reference auto-generation (100% coverage)
      3. Map actual user journeys per persona (discover pain points)
      4. Generate user journey walkthroughs (100% CLI coverage)
      5. Analyze friction and gaps
      6. Create prioritized improvement roadmap

      KEY INSIGHT:
      Journey mapping (Sprint 3) happens BEFORE walkthrough generation
      (Sprint 4) so that the walkthroughs address discovered pain points.

      PART 2: DOCUMENTATION QUALITY & BEST PRACTICES (Sprints 7-9)
      7. Documentation completeness audit (100% CLI coverage)
      8. Documentation correctness review (all examples work, links valid)
      9. Documentation organization & best practices (intuitive structure)

      DOCUMENTATION REQUIREMENTS:
      - 100% coverage over CLI reference guide
      - Expand on all scenarios in user journey flow
      - Follow technical writing best practices
      - Organized intuitively following conventions for similar projects
      - Benchmarked against Claude Code, Cursor, Aider documentation

      PART 3: TEST COVERAGE (Sprints 10-16)
      10. CLI test coverage (vibey/cli/)
      11. Operations library coverage (vibey/operations/)
      12. Roadmap models coverage (vibey/roadmap/)
      13. Config system coverage (vibey/config/)
      14. Common utilities coverage (vibey/common/)
      15. MCP & adapters coverage (vibey/mcp/, vibey/adapters/)
      16. Integration tests & final validation

      SUCCESS CRITERIA:
      - 100% documentation completeness
      - 100% documentation correctness
      - 100% user journey coverage
      - 100% code coverage (line and branch)
      - 95%+ test pass rate
      - CI enforcement to prevent regression
