    notes: 'Sprint 1 establishes the architecture for writing discovery

      outputs to context directories.


      Output file formats:

      - codebase-audit.md: Markdown with structured sections

      - git-analysis.md: Commit patterns, velocity, contributors

      - dependencies.yaml: Structured dependency data

      - architecture.md: Component diagrams, relationships


      Each writer will:

      1. Accept discovery results as input

      2. Format for the appropriate output type

      3. Write to track context directory

      4. Support incremental updates (append/merge)

      5. Include timestamps and discovery metadata

