      VS CODE NATIVE MCP PORT - HIGH PRIORITY (Nov 2025 Research)

      CRITICAL UPDATE: VS Code has FULL MCP SUPPORT (GA July 2025).
      No extension needed - just .vscode/mcp.json config file.

      MCP SUPPORT (CONFIRMED):
      - GA in VS Code 1.102 (July 14, 2025)
      - Full spec: Tools, Resources, Prompts, Sampling, Auth
      - Full spec: Roots, Elicitation, Server Instructions
      - Transports: stdio, HTTP, SSE, Unix sockets, pipes
      - 128 tools max per request

      CONFIG FORMAT (.vscode/mcp.json):
      {
        "servers": {
          "vibey": {
            "command": "python",
            "args": ["-m", "framework.mcp.server"],
            "env": {}
          }
        }
      }

      ARCHITECTURE (Zero-Drift):
      ┌──────────────────────────────────────────────────┐
      │         SINGLE SOURCE OF TRUTH                   │
      │  agents/*.md, workflows/*.md (frontmatter)       │
      └──────────────────────────────────────────────────┘
                        │
           ┌───────────┼───────────┐
           ▼           ▼           ▼
      ┌─────────┐ ┌─────────┐ ┌─────────┐
      │MCP Srv  │ │VSCODE.md│ │mcp.json │
      │(reuse)  │ │Generator│ │Generator│
      └─────────┘ └─────────┘ └─────────┘

      WHY SEPARATE FROM COPILOT-PORT:
      - Copilot is GitHub's AI assistant (separate track)
      - This track targets VS Code's native MCP capabilities
      - Works with Agent Mode (autonomous pair programmer)
      - Works with ANY AI assistant (not just Copilot)

      COMPATIBILITY: 90-95% (MCP-based, minimal adapter)
      ESTIMATED EFFORT: 2 weeks

      SOURCES:
      - https://code.visualstudio.com/docs/copilot/chat/mcp-servers
      - https://code.visualstudio.com/blogs/2025/06/12/full-mcp-spec-support
      - https://github.blog/changelog/2025-07-14-model-context-protocol-mcp-support-in-vs-code-is-generally-available/

      Timeline: Q4 2025 (2 weeks, high priority)
