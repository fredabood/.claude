  title: Design commit-to-task mapping algorithm
  description: "Design and implement algorithm for automatically mapping git commits\
    \ to\nspecific roadmap tasks based on commit messages, file changes, and patterns.\n\
    Critical for commit backfilling during forensic audits.\n\nQA Gap Addressed:\n\
    \"No commit-to-task mapping algorithm. Manual mapping of 100+ commits to\ntasks\
    \ is error-prone. Need automated matching with confidence scoring.\"\n\nAlgorithm\
    \ Requirements:\n\n1. Input Data Sources:\n   - Git commit history (SHA, message,\
    \ timestamp, author, files changed)\n   - Task definitions (ID, title, description,\
    \ track, sprint)\n   - File path patterns (which files belong to which tasks)\n\
    \   - Keyword patterns (words that indicate task relationship)\n\n2. Mapping Heuristics:\n\
    \n   High Confidence (Score 90-100):\n   - Commit message contains exact task\
    \ ID (e.g., \"roadmap-integrity-fixes-2-task-001\")\n   - Commit modifies files\
    \ in task-specific directory\n   - Commit message + files changed both match task\
    \ keywords\n\n   Medium Confidence (Score 60-89):\n   - Commit message contains\
    \ track ID and relevant keywords\n   - Commit modifies files in track-related\
    \ directories\n   - Timestamp aligns with task creation/completion dates\n   -\
    \ Author matches assigned_agent pattern\n\n   Low Confidence (Score 30-59):\n\
    \   - Commit message contains relevant keywords only\n   - File changes loosely\
    \ related to track area\n   - Timestamp during track active period\n\n   No Match\
    \ (Score 0-29):\n   - No keyword overlap\n   - Files unrelated to any task\n \
    \  - Timestamp outside track timeline\n\n3. Keyword Extraction:\n\n   From Task\
    \ Data:\n   - Task title words (weighted high)\n   - Track name components (weighted\
    \ medium)\n   - Sprint name components (weighted low)\n   - Description keywords\
    \ (extracted, weighted medium)\n\n   From Commit Data:\n   - Commit message subject\
    \ (weighted high)\n   - Commit message body (weighted medium)\n   - File paths\
    \ (extracted features, weighted high)\n   - Branch names if available (weighted\
    \ low)\n\n4. File Path Pattern Matching:\n\n   Examples:\n   - Commit modifies\
    \ `vibey/roadmap/models/` → maps to roadmap-system tasks\n   - Commit modifies\
    \ `docs/` → maps to documentation-system tasks\n   - Commit modifies `tests/`\
    \ → maps to testing-system tasks\n   - Commit modifies `.vibey/roadmap/track-id/`\
    \ → maps to that track\n\n5. Temporal Filtering:\n\n   - Commits before task creation\
    \ date: likely not related (unless backfilling old work)\n   - Commits after task\
    \ completion: likely not related\n   - Commits during task active period: higher\
    \ confidence\n   - Commits within ±7 days of task dates: medium confidence\n\n\
    6. Confidence Scoring Formula:\n\n   ```\n   confidence_score = (\n     keyword_match_score\
    \ * 0.40 +\n     file_path_score * 0.35 +\n     temporal_score * 0.15 +\n    \
    \ author_score * 0.10\n   )\n   ```\n\n   - keyword_match_score: % of task keywords\
    \ in commit (0-100)\n   - file_path_score: relevance of changed files to task\
    \ (0-100)\n   - temporal_score: alignment with task timeline (0-100)\n   - author_score:\
    \ author matches assigned agent (0-100)\n\n7. Multi-Task Commits:\n\n   - Some\
    \ commits may relate to multiple tasks\n   - Return top 3 matches with confidence\
    \ scores\n   - Flag commits with multiple high-confidence matches for review\n\
    \   - Allow manual override of automatic mapping\n\n8. Edge Cases to Handle:\n\
    \n   - Commits with no message (use file changes only)\n   - Merge commits (use\
    \ merge message + combined file changes)\n   - Commits modifying many files (weight\
    \ by lines changed per file)\n   - Commits for deleted/renamed tasks (match historical\
    \ names)\n   - Bulk commits (e.g., \"fix tests\") that touch many tasks\n\nAlgorithm\
    \ Implementation:\n\nFunction 1: extract_task_keywords(task_yaml)\n- Parse task\
    \ title, description, track_id\n- Extract meaningful keywords\n- Return weighted\
    \ keyword list\n\nFunction 2: extract_commit_keywords(commit)\n- Parse commit\
    \ message\n- Extract file paths and changes\n- Return keyword list with weights\n\
    \nFunction 3: calculate_keyword_match(task_keywords, commit_keywords)\n- Compare\
    \ keyword sets\n- Calculate overlap percentage\n- Return score 0-100\n\nFunction\
    \ 4: calculate_file_path_score(commit_files, task)\n- Determine task-related file\
    \ patterns\n- Check if commit modifies relevant files\n- Return score 0-100\n\n\
    Function 5: calculate_temporal_score(commit_date, task_dates)\n- Check if commit\
    \ within task timeline\n- Calculate proximity to task start/end\n- Return score\
    \ 0-100\n\nFunction 6: map_commit_to_tasks(commit, all_tasks)\n- Extract commit\
    \ features\n- Score against all tasks\n- Return top 3 matches with confidence\n\
    - Flag if no high-confidence match\n\nTesting Requirements:\n\nTest Dataset:\n\
    - Create sample commits with known task mappings\n- Include edge cases (no message,\
    \ merge, bulk)\n- Include multi-task commits\n- 50-100 sample commits covering\
    \ all scenarios\n\nAccuracy Targets:\n- 90%+ accuracy on high-confidence matches\n\
    - 70%+ accuracy on medium-confidence matches\n- <5% false positives (mapping to\
    \ wrong task)\n- 100% of commits get a score (even if 0)\n\nAcceptance Criteria:\n\
    - Algorithm implemented in Python\n- All 6 functions implemented and tested\n\
    - Confidence scoring formula validated\n- Test dataset created with 50+ samples\n\
    - Accuracy targets met (90%+ high-confidence)\n- Edge cases handled gracefully\n\
    - Multi-task commits flagged appropriately\n- Documentation with examples\n\n\
    Deliverables:\n- commit_mapper.py (Python module, 500+ lines)\n- Algorithm design\
    \ documentation\n- Test dataset (50+ commits with expected mappings)\n- Accuracy\
    \ validation results\n- Usage examples and API documentation\n"
