  title: Implement audit trail for status changes
  description: "Create audit trail system to track all roadmap status changes.\n\n\
    Implementation:\n\n1. Audit Trail Storage:\n   - File: .vibey/audit-trail.yaml\
    \ (or per-track)\n   - Structure:\n     ```yaml\n     audit_log:\n     - timestamp:\
    \ '2025-11-12T20:00:00+00:00'\n       object_type: track\n       object_id: standards-system\n\
    \       field: status\n       old_value: not_started\n       new_value: in_progress\n\
    \       changed_by: claude-code\n       reason: Started work on Sprint 1\n   \
    \    commit: abc123def\n     ```\n\n2. Change Tracking:\n   - Track status changes\
    \ (track, sprint, task)\n   - Track progress changes\n   - Track completion timestamp\
    \ changes\n   - Track blocking status changes\n   - Capture reason for change\
    \ (required)\n\n3. Integration Points:\n   - Intercept status changes in CLI commands\n\
    \   - Require --reason flag for manual status changes\n   - Auto-log changes made\
    \ by CLI operations\n   - Log git commit SHA if available\n\n4. Audit Commands:\n\
    \   ```bash\n   vibey roadmap audit log              # Show recent changes\n \
    \  vibey roadmap audit show <track-id>  # Show track history\n   vibey roadmap\
    \ audit revert <entry>   # Revert a change\n   ```\n\n5. Validation:\n   - Require\
    \ reason for manual overrides\n   - Flag suspicious changes (e.g., completed →\
    \ not_started)\n   - Detect unauthorized manual YAML edits\n   - Alert on progress\
    \ rollbacks\n\n6. Reporting:\n   - Generate audit reports\n   - Show timeline\
    \ of changes\n   - Identify manual vs automated changes\n   - Track who/when/why\
    \ for accountability\n\nDeliverables:\n- Audit trail storage implementation\n\
    - Change tracking integration\n- Audit commands\n- Documentation\n- Test suite\n"
