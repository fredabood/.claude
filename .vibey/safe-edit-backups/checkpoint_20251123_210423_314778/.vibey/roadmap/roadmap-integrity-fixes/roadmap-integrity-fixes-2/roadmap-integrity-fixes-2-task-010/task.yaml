  title: Forensic audit of directory-migration track
  description: "Perform comprehensive forensic audit of directory-migration track\
    \ to determine\nactual completion status vs YAML claims.\n\nYAML Claims:\n- Multiple\
    \ sprints with varying completion\n- Track status: needs investigation\n- Complex\
    \ migration history\n\nInvestigation Steps:\n\n1. Backup Archive Analysis (PRIORITY\
    \ 1)\n   - Check .vibey/hierarchical-migration-backups/backup_20251109_171311/\n\
    \   - Look for directory-migration files in old flat structure\n   - Check tracks/directory-migration.yaml\
    \ if exists\n   - Check sprints/directory-migration-*.yaml if exists\n   - Check\
    \ tasks/directory-migration-*-tasks.yaml if exists\n   - Extract task completion\
    \ records from old format\n   - Compare old backup data vs current YAML claims\n\
    \   - Verify migration preserved all completion data\n\n2. Git History Analysis\n\
    \   - Search for commits with keywords: \"directory\", \"migration\", \"move\"\
    \n   - Find commits reorganizing directory structure\n   - Find commits moving\
    \ files between directories\n   - Extract commit SHAs, messages, dates, file changes\n\
    \   - Count lines added/modified/moved for directory migration\n   - Cross-reference\
    \ commits with backup timestamps\n   - Map commits to specific tasks they implement\n\
    \n3. Codebase Audit\n   - Identify directory structure changes\n   - Verify migration\
    \ completeness\n   - Check for broken imports after migration\n   - Verify all\
    \ files in correct locations\n\n4. Documentation Audit\n   - Search for directory\
    \ migration documentation\n   - Check for migration plans\n   - Verify deliverable\
    \ documentation exists\n\n5. Test Suite Audit\n   - Verify tests still pass after\
    \ migration\n   - Check for broken import paths\n   - Ensure no test failures\
    \ from migration\n\n6. Migration Verification\n   - Compare backup data vs current\
    \ hierarchical structure\n   - Verify all completed tasks from old format were\
    \ preserved\n   - Check if any task completion records were lost during migration\n\
    \   - Verify progress counters accurately migrated\n   - Identify any data loss\
    \ or corruption during migration\n   - Check if directory migration itself caused\
    \ roadmap data issues\n\n7. Cross-Reference Analysis\n   - Compare git commits\
    \ to claimed tasks\n   - Map directory changes to claimed deliverables\n   - Calculate\
    \ real completion percentage based on ALL evidence\n   - Reconcile backup data\
    \ vs current data vs git history\n   - Determine if directory migration caused\
    \ other track issues\n\n8. Commit Backfilling (Git Tracking System Integration)\n\
    \   - For each identified commit related to directory-migration work:\n     *\
    \ Determine which task it implements\n     * Add commit SHA to that task's commits:\
    \ [] field in task.yaml\n     * Update task metadata with commit backfill timestamp\n\
    \   - Create audit trail of commit-to-task mappings\n   - Verify all commits accounted\
    \ for in task files\n   - Update task completion dates based on commit timestamps\
    \ if needed\n   - Document any commits that cannot be mapped to specific tasks\n\
    \nAcceptance Criteria:\n- All 8 investigation steps completed\n- Backup archive\
    \ evidence reviewed and documented\n- Git history documented (commits, dates,\
    \ changes)\n- All identified commits mapped to specific tasks\n- Commits backfilled\
    \ into task.yaml files (commits: [] field)\n- Codebase evidence cataloged (files,\
    \ lines, features)\n- Documentation evidence cataloged\n- Cross-reference analysis\
    \ shows claimed vs actual\n- Accurate completion percentage calculated\n- Recommended\
    \ status determined (completed/in_progress/not_started)\n- Evidence-based assessment\
    \ documented\n- Impact on other tracks assessed\n- Git tracking system populated\
    \ with commit evidence\n\nDeliverables:\n- Forensic audit report for directory-migration\
    \ (markdown, 1000+ lines)\n- Git history analysis section\n- Commit-to-task mapping\
    \ document\n- Updated task.yaml files with commits backfilled\n- Codebase evidence\
    \ section\n- Documentation evidence section\n- Cross-reference analysis\n- Accurate\
    \ status recommendation\n- Impact assessment on other tracks\n- Git tracking system\
    \ integration verification\n"
