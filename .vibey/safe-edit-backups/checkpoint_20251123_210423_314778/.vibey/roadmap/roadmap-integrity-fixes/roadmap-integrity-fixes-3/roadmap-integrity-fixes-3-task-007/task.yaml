    - Recalculates roadmap progress from tracks

    - Refreshes all dependency caches

    - Recomputes blocked status flags

    - Verifies consistency (with --verify flag)


    Expected Outcomes:

    - Zero status/progress mismatches

    - All progress based on actual task counts

    - All dependency caches current

    - Consistency verification passes


    Acceptance Criteria:

    - Command runs without errors

    - Verification reports 0 issues

    - All tracks have accurate progress

    - All sprints have accurate progress

    '
