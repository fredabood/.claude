  title: Add CI/CD validation pipeline
  description: "Add automated validation to CI/CD pipeline to catch integrity issues.\n\
    \nImplementation:\n\n1. Create GitHub Actions workflow:\n   - File: .github/workflows/roadmap-validation.yml\n\
    \   - Trigger: on push, on pull request\n   - Jobs: validate roadmap data\n\n\
    2. Workflow structure:\n   ```yaml\n   name: Roadmap Validation\n\n   on:\n  \
    \   push:\n       paths:\n         - '.vibey/roadmap/**'\n     pull_request:\n\
    \       paths:\n         - '.vibey/roadmap/**'\n\n   jobs:\n     validate:\n \
    \      runs-on: ubuntu-latest\n       steps:\n         - uses: actions/checkout@v3\n\
    \         - name: Set up Python\n           uses: actions/setup-python@v4\n  \
    \         with:\n             python-version: '3.10'\n         - name: Install\
    \ dependencies\n           run: pip install -e .\n         - name: Validate roadmap\n\
    \           run: vibey roadmap validate --verbose\n   ```\n\n3. Validation checks:\n\
    \   - Run full roadmap validation\n   - Check for data integrity issues\n   -\
    \ Verify all tracks loadable\n   - Generate validation report\n\n4. Failure handling:\n\
    \   - Fail pipeline if validation fails\n   - Comment on PR with validation results\n\
    \   - Block merge if issues found\n   - Provide clear error messages\n\n5. Success\
    \ handling:\n   - Pass pipeline if validation succeeds\n   - Add check mark to\
    \ PR\n   - Allow merge to proceed\n\n6. Integration:\n   - Add required check\
    \ for PR merges\n   - Configure branch protection rules\n   - Document CI/CD validation\
    \ process\n\nDeliverables:\n- GitHub Actions workflow file\n- Branch protection\
    \ configuration\n- CI/CD documentation\n- Integration with PR workflow\n"
