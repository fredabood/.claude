    ]}\n- Fails on: [\"Fixed aider-port/track.yaml\"]\n- Error: KeyError: 'type'\n\
    \nRequired fix:\nAdd backward-compatible parsing in yaml_loader.py:815-821\n\n\
    if isinstance(d, str):\n    # Legacy format: plain string\n    deliverables.append(Deliverable(\n\
    \        type=DeliverableType.OTHER,\n        paths=[d]\n    ))\nelif isinstance(d,\
    \ dict):\n    # New format: dict with type and paths\n    deliverables.append(Deliverable(\n\
    \        type=DeliverableType(d['type']),\n        paths=d['paths']\n    ))\n\n\
    Verification:\n- Load tasks with legacy string deliverables\n- Load tasks with\
    \ new dict deliverables\n- Both should work without errors\n"
