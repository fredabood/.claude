    description: |
      Implement system to generate table_of_contents.json files at each level
      of the hierarchy (roadmap, track, sprint).

      Implementation:
      - Design JSON schema for TOC files
      - Create TOC generator for roadmap level
      - Create TOC generator for track level
      - Create TOC generator for sprint level
      - Include parent links, current object, children list
      - Add status and progress metadata

      Acceptance Criteria:
      - TOC JSON matches specification
      - Generated at roadmap/track/sprint levels
      - Includes correct parent/child relationships
      - Metadata accurate (status, progress)
      - Fast generation (<100ms per TOC)
    status: not_started
    estimated_effort: 3 days
    assigned_agent: web-developer
    dependencies:
    - documentation-system-1-task-001

  - id: documentation-system-1-task-003
    name: Create markdown view generation from YAML
    description: |
      Build system to generate human-readable markdown files from YAML
      roadmap objects (roadmap.md, track.md, sprint.md, task.md).

      Implementation:
      - Design Jinja2 templates for each level
      - Create markdown generator for roadmap
      - Create markdown generator for tracks
      - Create markdown generator for sprints
      - Create markdown generator for tasks
      - Include status, progress, dependencies, context links

      Acceptance Criteria:
      - MD files generated from YAML source
      - GitHub-friendly markdown formatting
      - All relevant information included
      - Links to context files work
      - Templates easy to customize
    status: not_started
    estimated_effort: 4 days
    assigned_agent: web-developer
