sprint:
  id: documentation-system-3
  name: Migration & Project Documentation Tracking
  track_id: documentation-system
  roadmap_id: vibey-framework-v2
  status: not_started
  blocked: false
  priority: high
  created: '2025-11-09T00:00:00+00:00'
  started: null
  completed: null
  estimated_duration: 2 weeks
  actual_duration: null
  progress:
    tasks_total: 5
    tasks_completed: 0
    completion_percent: 0
  dependencies:
  - type: sprint
    target_id: documentation-system-2
    target_status: completed
    reason: Requires complete synchronization system before migration
    optional: false
  blocked_by: []
  deliverables:
  - Migration script for existing tracks
  - All existing tracks migrated to hierarchy
  - Project documentation tracking system
  - Documentation changelog generation
  - Complete system documentation
  - Final validation and testing
  tasks:
  - id: documentation-system-3-task-001
    name: Build migration script for existing tracks
    description: |
      Create comprehensive migration script to move existing roadmap files
      from flat structure to hierarchical structure.

      Implementation:
      - Create framework/scripts/migrate_to_hierarchy.py
      - Move .vibey/tracks/*.yaml → .vibey/roadmap/[track-id]/[track-id].yaml
      - Move .vibey/sprints/*.yaml → .vibey/roadmap/[track-id]/[sprint-id]/[sprint-id].yaml
      - Move .vibey/tasks/*.yaml → .vibey/roadmap/[track-id]/[sprint-id]/[task-id]/[task-id].yaml
      - Detect and move related docs from docs/development/ to context/
      - Generate TOC JSON files for migrated objects
      - Generate markdown views for migrated objects
      - Update roadmap.yaml with new structure
      - Support --dry-run mode (preview changes)
      - Create migration backup

      Acceptance Criteria:
      - Script successfully migrates all tracks
      - No data loss during migration
      - All relationships preserved
      - Context files moved to appropriate locations
      - Generated files (TOC, MD) created correctly
      - Dry-run shows accurate preview
      - Backup created before migration
    status: not_started
    estimated_effort: 5 days
    assigned_agent: web-developer
    dependencies: []

  - id: documentation-system-3-task-002
    name: Migrate all existing tracks to hierarchy
    description: |
      Execute migration script on all existing tracks, validate results,
      and clean up old structure.

      Implementation:
      - Run migration script with --dry-run first
      - Review dry-run output for correctness
      - Create full repository backup
      - Execute migration script
      - Validate all files migrated correctly
      - Verify all paths updated in scripts
      - Test roadmap CLI commands
      - Clean up old flat directories
      - Update .gitignore if needed

      Acceptance Criteria:
      - All 10 tracks migrated successfully
      - All sprints and tasks migrated
      - No data loss verified
      - All CLI commands work with new structure
      - Old directories cleaned up
      - Backup preserved
    status: not_started
    estimated_effort: 2 days
    assigned_agent: web-developer
    dependencies:
    - documentation-system-3-task-001

  - id: documentation-system-3-task-003
    name: Implement project documentation tracking system
    description: |
      Build system to track which roadmap objects impact which project
      documentation files using .meta.json sidecar files.

      Implementation:
      - Design .meta.json schema for doc metadata
      - Create vibey roadmap link-doc command
      - Support --change-type flag (added_section, updated, etc.)
      - Support --section flag
      - Auto-create .meta.json files
      - Update .meta.json on doc links
      - Create vibey roadmap list-docs command
      - Create vibey roadmap doc-changelog command

      Acceptance Criteria:
      - .meta.json files track doc impacts correctly
      - link-doc command works for all doc types
      - list-docs shows all impacted docs
      - doc-changelog generates readable changelog
      - Metadata schema extensible
    status: not_started
    estimated_effort: 4 days
    assigned_agent: web-developer
    dependencies: []

  - id: documentation-system-3-task-004
    name: Add documentation changelog generation
    description: |
      Implement system to generate documentation changelog from roadmap
      activity, showing which sprints/tasks modified which docs.

      Implementation:
      - Parse .meta.json files across all project docs
      - Group changes by roadmap object
      - Group changes by time period
      - Generate markdown changelog
      - Support filtering by track/sprint/task
      - Support date range filtering
      - Include change descriptions
      - Link to roadmap objects

      Acceptance Criteria:
      - Changelog generated from .meta.json files
      - Grouped logically (by object, by time)
      - Filtering works correctly
      - Markdown formatting clear
      - Links to roadmap objects work
    status: not_started
    estimated_effort: 3 days
    assigned_agent: web-developer
    dependencies:
    - documentation-system-3-task-003

  - id: documentation-system-3-task-005
    name: Complete system documentation and final validation
    description: |
      Create comprehensive documentation for the entire documentation
      management system and perform final validation testing.

      Implementation:
      - Update DOCUMENTATION_MANAGEMENT_STRATEGY.md with implementation details
      - Create user guide for hierarchical structure
      - Document all CLI commands with examples
      - Create migration retrospective
      - Document best practices
      - Run full system validation tests
      - Test with real usage scenarios
      - Gather feedback and iterate

      Acceptance Criteria:
      - Complete user guide available
      - All CLI commands documented
      - Migration retrospective complete
      - Best practices documented
      - All validation tests pass
      - Real usage scenarios tested
      - System ready for production use
    status: not_started
    estimated_effort: 3 days
    assigned_agent: docs-writer
    dependencies:
    - documentation-system-3-task-002
    - documentation-system-3-task-004

  metadata:
    sprint_goal: |
      Complete the documentation system implementation by migrating all
      existing tracks to the new hierarchy and adding project documentation
      tracking capabilities.
    success_criteria:
    - All existing tracks migrated successfully
    - No data loss during migration
    - Project documentation tracking functional
    - Documentation changelog generation working
    - Complete system documentation available
    - All quality gates passing
