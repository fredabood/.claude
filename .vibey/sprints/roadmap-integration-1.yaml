    notes: |
      First sprint of roadmap integration track.

      Goal: Establish foundation by integrating roadmap initialization into
      framework deployment and sprint planning workflows.

      Key Tasks:
      1. Update vibey.md deployment to call roadmap-init.py
      2. Update vibey-plan.md to create roadmap sprint entries
      3. Implement task extraction from sprint plans
      4. Create integration tests
      5. Update documentation

      Success Criteria:
      - New projects automatically get .vibey/ structure
      - Sprint planning creates roadmap entries
      - All existing workflows still function
      - Tests validate integration

      This sprint does NOT break existing functionality - it adds parallel
      roadmap tracking while legacy system continues to work.
