    notes: |
      Aider is the highest-priority new platform port due to:

      1. Excellent Compatibility (95%)
         - Configuration-driven (YAML)
         - Model abstraction
         - Custom prompts/templates
         - Similar agent concepts

      2. Low Effort (1 sprint = 2 weeks)
         - Simple adapter implementation
         - Terminal-based (no GUI complexity)
         - Well-documented API

      3. Strategic Value
         - 40k+ GitHub stars
         - Large terminal user base
         - Git-centric workflow alignment
         - Open source community

      Adapter Strategy:
      - Map Vibey agents → Aider model roles/prompts
      - Map Vibey workflows → Aider command sequences
      - Map Vibey handoffs → Git commits with metadata
      - Generate .aider/ directory with configs
      - Template: aider.conf.yml.j2

      Key Features to Support:
      - Auto-commit messages (from handoff templates)
      - Multi-file editing (workflow steps)
      - Model provider configuration
      - Custom prompt injection (agent instructions)

      Validation:
      - Test with real Aider installation
      - Verify git commits work as expected
      - Ensure multi-file workflows execute correctly
      - Documentation for terminal users

      Timeline: Q2 2025 (after Goose port complete)
