    notes: |
      Continue.dev is high-priority for multi-IDE reach:

      1. Compatibility (80%)
         - Custom slash commands (perfect for agents!)
         - Context provider API (workflow context)
         - Configuration-driven (config.json)
         - Model-agnostic

      2. Moderate Effort (2 sprints = 3.5 weeks)
         - IDE extension complexity
         - Context provider implementation
         - Multi-IDE testing (VS Code + JetBrains)

      3. Strategic Value
         - VS Code: 75% of developers
         - JetBrains: Professional developers
         - Open source community
         - Active development

      Adapter Strategy:
      - Map Vibey agents → Continue slash commands
      - Map Vibey workflows → Command sequences
      - Map Vibey context → Context providers
      - Generate .continue/ directory
      - Templates: config.json.j2, commands/*.j2

      Key Mappings:
      - Agent: web-developer → /web-developer slash command
      - Workflow steps → Prompt templates
      - Handoffs → Context provider data
      - Quality gates → Validation commands

      Continue Slash Command Example:
      {
        "name": "web-developer",
        "description": "Full-stack web development agent",
        "prompt": "{{ agent.instructions | from_template }}"
      }

      Context Provider Example:
      {
        "name": "vibey-workflow",
        "type": "custom",
        "config": {
          "workflow": "{{ workflow.id }}",
          "context": "{{ workflow.context }}"
        }
      }

      Validation:
      - Test in VS Code
      - Test in IntelliJ IDEA
      - Test in PyCharm
      - Verify context providers load
      - Ensure commands execute correctly

      Timeline: Q3 2025 (after Aider port)
