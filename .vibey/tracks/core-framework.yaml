  # Metadata
  metadata:
    created_by: "vibey-framework-team"
    last_updated: "2025-11-07T20:00:00Z"
    notes: |
      Core framework improvements that set foundation for multi-platform architecture.

      Key Insight: Keep .vibey/ as permanent platform-agnostic home with two systems:

      1. YAML (Roadmap System) - State tracking
         - Sprint status, progress, dependencies
         - Updated by roadmap CLI
         - Machine-readable
         - .vibey/roadmap/*.yaml

      2. Markdown (Sprint Docs) - Rich context
         - What to build, architecture decisions, learnings
         - Iterated during development (NEVER regenerated)
         - Human and AI readable
         - .vibey/sprint_docs/*/

      3. Platform Deployments - Generated artifacts
         - .claude/, .goose/, .cursor/ (gitignored)
         - Generated from .vibey/config/
         - Tool-specific

      Critical distinction:
      - YAML tracks deterministic state (status, dependencies)
      - Markdown provides accumulated context (never lost!)
      - YAML links to Markdown (documentation.files.plan)
      - Both committed to git, non-overlapping purposes

      Sprint 2 (Config-to-Docs Architecture) builds:
      - Permanent .vibey/ structure
      - Sprint docs linking system (YAML references Markdown via documentation field)
      - Context loading strategy (see CONTEXT_LOADING_STRATEGY.md)
        * Dependency summaries (auto-generated)
        * Task summaries (task-level context)
        * Context modes (minimal/summary/full)
        * Hierarchical loading (distance-based)
        * 80-90% reduction in context size for complex dependencies
      - Platform deployment generation
      - Foundation for adapter pattern (Track 3 & 4)

      Documentation:
      - PLATFORM_AGNOSTIC_ARCHITECTURE.md - Overall architecture
      - YAML_MARKDOWN_SEPARATION.md - Design principle
      - CONTEXT_LOADING_STRATEGY.md - Context explosion mitigation
