    design_doc: docs/development/PLATFORM_AGNOSTIC_ARCHITECTURE.md
    implementation_plan: docs/sprints/core-framework-2-plan.md
    notes: "Core framework improvements that set foundation for multi-platform architecture.\n\
      \n**SPRINT ORDERING CORRECTION (2025-11-09):**\n- Sprint 3 (Framework Polish)\
      \ - ✅ COMPLETED\n- Sprint 2 (Config-to-Docs) - NOW (foundation layer)\n- Sprint\
      \ 1 (Default CLAUDE.md) - LATER (depends on Sprint 2)\n\nRationale: Sprint\
      \ 1 requires config system and templates from Sprint 2.\n\nKey Insight: Keep\
      \ .vibey/ as permanent platform-agnostic home with two systems:\n\n1. YAML\
      \ (Roadmap System) - State tracking\n   - Sprint status, progress, dependencies\n\
      \   - Updated by roadmap CLI\n   - Machine-readable\n   - .vibey/roadmap/*.yaml\n\
      \n2. Markdown (Sprint Docs) - Rich context\n   - What to build, architecture\
      \ decisions, learnings\n   - Iterated during development (NEVER regenerated)\n\
      \   - Human and AI readable\n   - .vibey/sprint_docs/*/\n\n3. Platform Deployments\
      \ - Generated artifacts\n   - .claude/, .goose/, .cursor/ (gitignored)\n  \
      \ - Generated from .vibey/config/\n   - Tool-specific\n\nCritical distinction:\n\
      - YAML tracks deterministic state (status, dependencies)\n- Markdown provides\
      \ accumulated context (never lost!)\n- YAML links to Markdown (documentation.files.plan)\n\
      - Both committed to git, non-overlapping purposes\n\nSprint 2 (Config-to-Docs\
      \ Architecture) builds:\n- Permanent .vibey/ structure\n- Sprint docs linking\
      \ system (YAML references Markdown via documentation field)\n- Context loading\
      \ strategy (see CONTEXT_LOADING_STRATEGY.md)\n  * Dependency summaries (auto-generated)\n\
      \  * Task summaries (task-level context)\n  * Context modes (minimal/summary/full)\n\
      \  * Hierarchical loading (distance-based)\n  * 80-90% reduction in context\
      \ size for complex dependencies\n- Platform deployment generation\n- Foundation\
      \ for adapter pattern (Track 3 & 4)\n\nDocumentation:\n- PLATFORM_AGNOSTIC_ARCHITECTURE.md\
      \ - Overall architecture\n- YAML_MARKDOWN_SEPARATION.md - Design principle\n\
      - CONTEXT_LOADING_STRATEGY.md - Context explosion mitigation\n"
