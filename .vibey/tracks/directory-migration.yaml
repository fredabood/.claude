  metadata:
    created_by: vibey-framework-team
    last_updated: '2025-11-10T10:00:00+00:00'
    design_doc: docs/development/DIRECTORY_MIGRATION_PLAN.md
    implementation_plan: null
    notes: |
      CRITICAL INFRASTRUCTURE TRACK - BLOCKS ALL PLATFORM PORTS

      This track migrates Vibey from a .claude/-centric deployment to a
      platform-agnostic .vibey/ source-of-truth architecture. This is the
      HIGHEST PRIORITY foundation work for multi-platform support.

      CURRENT STATE (v1.2.0):
      - Framework deployed to .claude/ (platform-specific)
      - Only roadmap system in .vibey/
      - Scripts at .claude/scripts/ (50+ references)
      - Impossible to deploy to other platforms

      TARGET STATE (v2.5.0):
      - Single source of truth: .vibey/
      - Platform deployments: .claude/, .goose/, .cursor/ (generated)
      - Unified CLI: vibey command (no path dependencies)
      - Adapter pattern: platform-specific transformations

      IMPLEMENTATION STRATEGY:

      Sprint 1: Unified CLI Tool (2 weeks)
      -------------------------------------
      Goal: Build standalone vibey CLI that works independently of .claude/

      Tasks:
      1. Create Python package structure (pyproject.toml, setup.py)
      2. Move framework/scripts/ → vibey/cli/
      3. Create entry point: vibey/__main__.py
      4. Register CLI commands (Click/Typer)
      5. Update imports: from framework.roadmap → from vibey.roadmap
      6. Test: pip install -e . && vibey --version
      7. Verify all roadmap commands work without .claude/ prefix
      8. Create tests for CLI commands
      9. Document CLI usage
      10. Package for PyPI distribution
      11. Verify installation on clean system
      12. Update PATH dependencies

      Deliverables:
      - vibey command installed globally
      - All roadmap commands work via vibey roadmap ...
      - No dependencies on .claude/scripts/
      - Python package structure complete

      Sprint 2: Config Migration System (3 weeks)
      --------------------------------------------
      Goal: Move configuration from .claude/ to .vibey/config/

      Tasks:
      1. Design modular config schema
         - .vibey/config/project.yaml
         - .vibey/config/framework.yaml
         - .vibey/config/agents.yaml
         - .vibey/config/quality-gates.yaml
      2. Create config models (Pydantic/dataclasses)
      3. Implement config loader with fallback
      4. Create migration tool: vibey migrate config
      5. Parse old .claude/project-config.yaml
      6. Split into modular configs
      7. Validate migrated configs
      8. Create backup before migration
      9. Update all config references in codebase
      10. Add deprecation warnings for old location
      11. Test auto-migration on first command
      12. Document config structure
      13. Create config validation command
      14. Handle edge cases (custom configs, missing fields)
      15. Add rollback mechanism

      Deliverables:
      - Modular config system in .vibey/config/
      - Migration tool for existing projects
      - Backward compatibility during transition
      - Auto-migration on first vibey command

      Sprint 3: Platform Adapter Implementation (3 weeks)
      ----------------------------------------------------
      Goal: Generate .claude/, .goose/ deployments from .vibey/ source

      Tasks:
      1. Design adapter interface (PlatformAdapter base class)
      2. Define adapter methods:
         - get_platform_name()
         - get_deployment_dir()
         - deploy(source, config)
         - generate_context_file(config)
         - validate_deployment()
      3. Implement Claude Code adapter
      4. Test Claude adapter deployment
      5. Implement Goose adapter (basic)
      6. Test Goose adapter deployment
      7. Create vibey deploy command
      8. Add --platform flag (claude, goose, all)
      9. Add --clean flag (remove and redeploy)
      10. Add validation after deployment
      11. Update .gitignore rules
      12. Create platform detection logic
      13. Test multi-platform deployment
      14. Document adapter development guide
      15. Create adapter test suite
      16. Validate backward compatibility
      17. Test migration on real projects
      18. Create migration rollback tool

      Deliverables:
      - Adapter interface and base class
      - Claude Code adapter (full)
      - Goose adapter (basic)
      - vibey deploy command
      - Updated .gitignore rules

      MIGRATION PATH FOR USERS:

      Step 1: Install new CLI
      $ pip install --upgrade vibey-framework
      $ vibey --version  # v2.5.0

      Step 2: Run migration
      $ cd my-project
      $ vibey migrate

      Migration Process:
      1. Detect .claude/ installation
      2. Create .vibey/ directory structure
      3. Migrate config: .claude/project-config.yaml → .vibey/config/
      4. Migrate roadmap (already in .vibey/, no changes)
      5. Copy custom templates if any
      6. Regenerate .claude/ as deployment
      7. Update .gitignore

      Step 3: Verify
      $ vibey validate

      BACKWARD COMPATIBILITY:

      - Auto-migration on first vibey command
      - Legacy .claude/project-config.yaml supported (with warning)
      - 2-release deprecation period (v2.5, v2.6)
      - Full removal in v3.0.0

      RISKS AND MITIGATION:

      Risk 1: Breaking existing installations
      → Auto-migration, backward compatibility, rollback mechanism

      Risk 2: Script path dependencies (50+ references to .claude/scripts/)
      → Unified CLI eliminates path dependencies

      Risk 3: User confusion during transition
      → Clear migration guide, automated process, visual indicators

      Risk 4: Platform adapter bugs
      → Extensive testing, validation after deployment, easy rollback

      SUCCESS METRICS:

      Technical:
      - 100% backward compatibility
      - 0 breaking changes for existing users
      - <5 minutes for auto-migration
      - All 200+ tests passing after migration

      User Experience:
      - Clear migration path documented
      - Auto-migration succeeds >95%
      - Users understand new structure
      - No increase in support requests

      Platform Expansion:
      - Unblocks goose-port track
      - Enables multi-platform track
      - New platform adapter in <1 week
      - 90% code reuse across platforms

      DEPENDENCIES:

      Requires:
      - testing-system (need test coverage to validate migration)
      - roadmap-system (foundation already in .vibey/)

      Blocks:
      - goose-port (cannot proceed without adapter pattern)
      - aider-port (cannot proceed without adapter pattern)
      - continue-port (cannot proceed without adapter pattern)
      - windsurf-port (cannot proceed without adapter pattern)
      - jetbrains-port (cannot proceed without adapter pattern)
      - multi-platform (depends on this architecture)

      TIMELINE:

      Week 1-2: Sprint 1 (Unified CLI)
      Week 3-5: Sprint 2 (Config Migration)
      Week 6-8: Sprint 3 (Platform Adapters)
      Week 9+: Post-migration (docs, monitoring, bug fixes)

      This track is CRITICAL for the future of Vibey. Without it, we cannot
      expand to other platforms and remain locked to Claude Code's .claude/
      directory structure.

      Recommend: START IMMEDIATELY AFTER testing-system COMPLETION
