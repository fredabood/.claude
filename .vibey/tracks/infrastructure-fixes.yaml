    notes: |
      CRITICAL BLOCKER - MUST BE COMPLETED FIRST

      This track fixes the three most critical issues preventing users from
      accessing existing functionality:

      1. **Roadmap CLI Import Error** (CRITICAL)
         - Problem: ImportError in framework/scripts/roadmap-lib/cache.py:23
         - Impact: System exists but completely unusable
         - Fix: Convert relative imports to absolute imports
         - Effort: 18 hours (Phase 1)

      2. **Roadmap Integration Missing** (CRITICAL)
         - Problem: Roadmap system not integrated into /vibey commands
         - Impact: Users can't access roadmap features
         - Fix: Update vibey.md, vibey-plan.md, vibey-code.md, vibey-manager.md
         - Effort: 40 hours (Phase 2)

      3. **Status Mismatches** (HIGH)
         - Problem: Tracks marked "completed" or "production_ready" with 0% implementation
         - Examples:
           * roadmap-integration: claims 100%, actually 0%
           * core-framework-2: claims "production_gate_check", not started
         - Impact: Documentation lies, users confused
         - Fix: Audit all tracks, correct statuses
         - Effort: 10 hours (Phase 4)

      IMPLEMENTATION APPROACH:

      Phase 1: Fix Roadmap CLI (Days 1-3, 18 hours)
      - Task 001: Debug and fix import error (8h)
      - Task 002: Create wrapper script (4h)
      - Task 003: Add CLI tests (6h)

      Phase 2: Integrate Roadmap (Days 4-7, 40 hours)
      - Task 004: Update /vibey deployment (8h)
      - Task 005: Update /vibey plan (12h)
      - Task 006: Update /vibey code (12h)
      - Task 007: Add migration tool (8h)

      Phase 3: Update Vibey Manager (Days 8-9, 14 hours)
      - Task 008: Add roadmap status commands (10h)
      - Task 009: Create examples (4h)

      Phase 4: Correct Statuses (Day 10, 10 hours)
      - Task 010: Audit all track statuses (4h)
      - Task 011: Correct roadmap-integration (2h)
      - Task 012: Correct core-framework-2 (2h)
      - Task 013: Update roadmap-system (2h)

      SUCCESS CRITERIA:
      - ✅ Roadmap CLI runs without errors
      - ✅ All 15+ roadmap commands work
      - ✅ /vibey deployment initializes roadmap
      - ✅ /vibey plan creates roadmap sprint entries
      - ✅ /vibey code updates roadmap progress
      - ✅ Vibey Manager has roadmap commands
      - ✅ Track statuses match reality

      BLOCKS ALL OTHER WORK:
      This track must be completed before any other gap closure work can begin.
      The entire multi-platform expansion strategy depends on having a functional
      roadmap system integrated into user workflows.
