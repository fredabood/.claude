    notes: |
      JetBrains AI Assistant is strategic for enterprise/professional market:

      1. Compatibility (80%)
         - MCP protocol support (SAME as Claude Code!)
         - Agent2Agent (A2A) protocol
         - Multi-agent ecosystem vision
         - Plugin API extensibility

      2. Higher Effort (3 sprints = 5.5 weeks)
         - MCP server implementation
         - IDE settings XML complexity
         - Multi-IDE testing matrix
         - Enterprise features (security, compliance)

      3. Strategic Value
         - Professional developer market
         - Enterprise adoption potential
         - Multi-language support (all JetBrains IDEs)
         - MCP standardization alignment
         - Premium positioning

      MCP Integration Strategy:
      JetBrains AI Assistant supports MCP (Model Context Protocol),
      the SAME protocol used by Claude Code! This means we can:

      1. Create Vibey MCP Server
         - Expose agents as MCP tools
         - Expose workflows as MCP resources
         - Expose quality gates as MCP prompts

      2. Register with JetBrains AI
         - IDE discovers Vibey MCP server
         - Agents become available tools
         - Workflows become available operations

      3. Multi-Agent Coordination
         - Vibey agents + Junie + Claude Agent
         - Orchestrate between multiple agents
         - Quality gates across all agents

      Adapter Strategy:
      - Map Vibey agents → MCP tools
      - Map Vibey workflows → MCP resources
      - Map Vibey context → MCP prompts
      - Generate .idea/ai/ directory
      - Templates: mcp-server.json.j2, ai-settings.xml.j2

      MCP Server Example (Vibey Agent as Tool):
      {
        "tools": [
          {
            "name": "web-developer",
            "description": "Full-stack web development",
            "inputSchema": {
              "type": "object",
              "properties": {
                "feature_spec": {"type": "string"},
                "tech_stack": {"type": "string"}
              }
            }
          }
        ]
      }

      IDE Coverage (All JetBrains):
      - IntelliJ IDEA (Java, Kotlin, Scala)
      - PyCharm (Python)
      - WebStorm (JavaScript, TypeScript)
      - GoLand (Go)
      - PhpStorm (PHP)
      - RustRover (Rust)
      - RubyMine (Ruby)
      - CLion (C, C++)

      This single adapter reaches 8+ programming language communities!

      Enterprise Features:
      - Security: SSO, SAML integration
      - Compliance: Audit logs, data governance
      - Self-hosted: On-premise deployment option
      - Team management: Shared configurations

      Validation:
      - Test MCP server with JetBrains AI
      - Verify multi-agent coordination (Junie + Vibey)
      - Test across multiple IDEs (IntelliJ, PyCharm, WebStorm)
      - Enterprise security audit
      - Performance testing

      Marketing Angle:
      "Professional-Grade AI Orchestration for JetBrains"
      - Vibey: Enterprise orchestration & quality gates
      - JetBrains AI: Best-in-class IDE features
      - Together: Production-ready development at scale

      Timeline: Q4 2025 (after Windsurf port, MCP research complete)

      Note: MCP alignment is CRITICAL for future-proofing.
      As more platforms adopt MCP (GitHub Copilot already has),
      Vibey's MCP adapter becomes reusable across platforms.
