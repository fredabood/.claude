    notes: |
      MISSING AGENTS GAP CLOSURE

      This track implements the 8 missing agents that are referenced throughout
      the documentation but don't exist in the codebase.

      CURRENT STATE:
      - 21+ agents documented/referenced
      - 13 agents actually exist
      - 8 agents missing (38% gap)
      - Critical missing agents:
        * test-engineer (67 references)
        * docs-writer (55+ references)
        * security-auditor (24 references)

      TARGET STATE:
      - 21 agents implemented
      - 0 missing agents
      - Standardized naming conventions
      - All workflow references valid

      IMPLEMENTATION APPROACH:

      Phase 1: Critical Missing Agents (Days 1-10, 76 hours)
      - Task 001: Implement test-engineer (20h) - CRITICAL, 67 refs
      - Task 002: Implement docs-writer (16h) - Rename/alias existing agent
      - Task 003: Implement security-auditor (16h) - Rename/alias existing agent
      - Task 004: Implement architecture-agent (24h) - NEW, complex

      Phase 2: Additional Missing Agents (Days 11-15, 56 hours)
      - Task 005: Implement backend-engineer (16h)
      - Task 006: Implement frontend-engineer (16h)
      - Task 007: Implement database-specialist (12h)
      - Task 008: Implement infrastructure-engineer (12h)

      Phase 3: Documentation Updates (Days 16-21, 32 hours)
      - Task 009: Update all agent references (16h)
      - Task 010: Create agent directory README (4h)
      - Task 011: Add agent tests (12h)

      NAMING STANDARDIZATION DECISIONS:

      1. **test-engineer** - NEW agent (most critical)
         - Responsibilities: Write unit/integration/E2E tests
         - Trigger: "Write tests", "Increase coverage"
         - Template: Based on quality agents

      2. **docs-writer** - Alias/rename decision
         - Current: documentation-engineer (870 lines, exists)
         - References: docs-writer (55+ times)
         - Options:
           a) Rename documentation-engineer → docs-writer
           b) Add alias (both names work)
           c) Add trigger patterns to existing agent
         - Recommendation: Option C (least disruptive)

      3. **security-auditor** - Alias/rename decision
         - Current: security-reviewer (exists)
         - References: security-auditor (24 times)
         - Recommendation: Standardize on one name, create alias

      4. **architecture-agent** - NEW agent (complex)
         - Responsibilities: System design, ADRs, diagrams
         - New directory: framework/agents/architecture/
         - This is a substantial new agent, requires careful design

      5-8. **Specialized Engineers** - NEW agents
         - backend-engineer, frontend-engineer, database-specialist, infrastructure-engineer
         - Based on web-developer template but specialized
         - Clear trigger patterns and responsibilities

      SUCCESS CRITERIA:
      - ✅ All 8 missing agents implemented
      - ✅ Agent naming standardized (no more mismatches)
      - ✅ All workflows reference existing agents
      - ✅ Documentation updated
      - ✅ Agent directory README created
      - ✅ Agent tests passing

      INDEPENDENCE:
      This track can run in parallel with other tracks. It has no dependencies
      and is not a blocker for other work. However, completing infrastructure-fixes
      first is recommended to ensure a solid foundation.

      TOTAL EFFORT: 164 hours (~3 weeks with 2 devs, ~4 weeks with 1 dev)
