  metadata:
    created_by: "vibey-framework-team"
    last_updated: "2025-11-07T10:00:00Z"
    notes: |
      Critical integration track to connect the roadmap state management framework
      with the user-facing /vibey command workflow.

      Problem:
      - Two parallel sprint state systems exist
      - Legacy system (docs/sprints/*.yaml) used by /vibey commands
      - New roadmap system (.vibey/) built but not integrated
      - Users cannot leverage roadmap capabilities

      Solution:
      - Update /vibey deployment to initialize roadmap structure
      - Update /vibey plan to create roadmap entries
      - Update /vibey code to track progress in roadmap
      - Extend Vibey Manager agent with roadmap commands
      - Provide migration script for existing projects
      - Deprecate legacy scripts after transition

      Impact:
      - Eliminates ~1,657 lines of duplicated code
      - Enables multi-sprint planning, dependencies, blockers
      - Unlocks full roadmap system potential for users

      References:
      - docs/development/ROADMAP_INTEGRATION_GAP.md
      - framework/commands/vibey.md
      - framework/commands/vibey-plan.md
      - framework/agents/core/vibey-manager.md
