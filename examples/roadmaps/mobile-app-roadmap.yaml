    completion_gates_passed: 0
    production_gates_total: 1
    production_gates_passed: 0
    completion_percent: 0

# Tasks for core-app-1
---
tasks:
  - id: core-app-1-task-001
    sprint_id: core-app-1
    task_type: development
    status: not_started

    title: Initialize React Native project
    description: |
      Create new React Native project with latest version.
      Configure: iOS workspace, Android Gradle, Metro bundler.

    priority: critical
    complexity: low
    estimated_tokens: 5000

    metadata:
      tags: [setup, react-native]
      deliverables:
        - React Native project initialized
        - iOS build working
        - Android build working

  - id: core-app-1-task-002
    sprint_id: core-app-1
    task_type: development
    status: not_started

    title: Configure TypeScript with strict mode
    description: |
      Set up TypeScript configuration with strict type checking.
      Configure path aliases, type declarations, and build pipeline.

    priority: critical
    complexity: low
    estimated_tokens: 6000

    blocked_by:
      - dependency_id: core-app-1-task-001
        dependency_type: task
        required_status: completed
        blocks_transition_to: in_progress

    metadata:
      tags: [typescript, configuration]
      deliverables:
        - tsconfig.json
        - Type declarations
        - Build scripts

  - id: core-app-1-task-003
    sprint_id: core-app-1
    task_type: development
    status: not_started

    title: Setup React Navigation v6
    description: |
      Configure React Navigation with:
      - Tab navigator (Home, Workouts, Progress, Profile)
      - Stack navigator for detail screens
      - Deep linking configuration
      - Type-safe navigation

    priority: critical
    complexity: medium
    estimated_tokens: 12000

    blocked_by:
      - dependency_id: core-app-1-task-002
        dependency_type: task
        required_status: completed
        blocks_transition_to: in_progress

    metadata:
      tags: [navigation, react-navigation]
      deliverables:
        - Navigation structure
        - Tab navigator
        - Stack navigator
        - Type definitions

  - id: core-app-1-task-004
    sprint_id: core-app-1
    task_type: development
    status: not_started

    title: Configure project structure and architecture
    description: |
      Set up folder structure:
      - src/screens/ (screen components)
      - src/components/ (reusable components)
      - src/navigation/ (navigation config)
      - src/hooks/ (custom hooks)
      - src/utils/ (utilities)
      - src/types/ (TypeScript types)
      - src/constants/ (constants and config)

    priority: high
    complexity: low
    estimated_tokens: 8000

    blocked_by:
      - dependency_id: core-app-1-task-002
        dependency_type: task
        required_status: completed
        blocks_transition_to: in_progress

    metadata:
      tags: [architecture, project-structure]
      deliverables:
        - Folder structure
        - README with architecture docs
        - Import path aliases

  - id: core-app-1-task-005
    sprint_id: core-app-1
    task_type: development
    status: not_started

    title: Setup ESLint, Prettier, and pre-commit hooks
    description: |
      Configure code quality tools:
      - ESLint with TypeScript rules
      - Prettier for formatting
      - Husky for pre-commit hooks
      - lint-staged for staged files

    priority: high
    complexity: low
    estimated_tokens: 7000

    blocked_by:
      - dependency_id: core-app-1-task-004
        dependency_type: task
        required_status: completed
        blocks_transition_to: in_progress

    metadata:
      tags: [code-quality, linting]
      deliverables:
        - .eslintrc.js
        - .prettierrc
        - Husky configuration
        - lint-staged config

  - id: core-app-1-gate-c001
    sprint_id: core-app-1
    task_type: completion_gate
    status: not_started

    title: Development standards documentation
    description: |
      Document code standards, architecture decisions, and development workflow.
      Include: coding conventions, component patterns, state management approach.

    priority: high
    estimated_tokens: 10000

    gate_info:
      gate_type: completion
      validation_criteria:
        - Architecture documented
        - Coding standards defined
        - Contribution guide created
      blocking_scope: sprint_completion

  - id: core-app-1-gate-p001
    sprint_id: core-app-1
    task_type: production_gate
    status: not_started

    title: iOS and Android builds passing
    description: |
      Validate both platforms build successfully and run without crashes.
      Test on simulators and physical devices.

    priority: critical
    estimated_tokens: 8000

    gate_info:
      gate_type: production
      validation_command: npm run build:ios && npm run build:android
      validation_criteria:
        - iOS build succeeds
        - Android build succeeds
        - App launches on both platforms
        - No console errors or warnings
      blocking_scope: production_deployment

