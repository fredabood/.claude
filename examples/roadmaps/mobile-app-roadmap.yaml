  created_at: 2025-11-09T10:00:00Z
  updated_at: 2025-11-09T10:00:00Z

  metadata:
    description: Cross-platform fitness tracking app (iOS + Android)
    project_type: mobile-app
    tech_stack:
      - React Native
      - TypeScript
      - Redux Toolkit
      - Firebase
      - HealthKit (iOS)
      - Google Fit (Android)
      - Jest + Detox

  progress:
    tracks_total: 5
    tracks_completed: 0
    sprints_total: 0
    sprints_completed: 0
    tasks_total: 0
    tasks_completed: 0
    completion_percent: 0

  tracks:
    - core-app
    - ios-integration
    - android-integration
    - backend-services
    - testing-qa

