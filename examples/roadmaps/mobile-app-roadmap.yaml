# Example task details
---
tasks:
  - id: testing-qa-1-task-001
    sprint_id: testing-qa-1
    task_type: development
    status: not_started

    title: Configure Jest and React Native Testing Library
    description: |
      Set up testing infrastructure:
      - Configure Jest for React Native
      - Install @testing-library/react-native
      - Configure test utilities and mocks
      - Add test scripts to package.json

    priority: critical
    complexity: low
    estimated_tokens: 8000

    metadata:
      tags: [testing, jest, setup]
      deliverables:
        - jest.config.js
        - Test setup files
        - Mock configurations
        - npm test scripts

  - id: testing-qa-1-gate-p001
    sprint_id: testing-qa-1
    task_type: production_gate
    status: not_started

    title: Test coverage exceeds 80%
    description: |
      Validate test coverage meets quality standards:
      - Overall coverage >80%
      - Component coverage >85%
      - Hook coverage >90%
      - Utility coverage >95%

    priority: critical
    estimated_tokens: 5000

    gate_info:
      gate_type: production
      validation_command: npm run test:coverage -- --coverage-thresholds-branches=80 --coverage-thresholds-functions=80 --coverage-thresholds-lines=80
      validation_criteria:
        - Branch coverage >80%
        - Function coverage >80%
        - Line coverage >80%
        - No critical paths untested
      blocking_scope: production_deployment
