# Vibey Config Template: Microservices Architecture
# Use this template for distributed microservices applications

project:
  name: "my-microservices-app"
  description: "Microservices-based application"
  version: "0.1.0"
  repository: "https://github.com/org/my-microservices-app"

# =============================================================================
# TECHNOLOGY STACK
# =============================================================================

technology_stack:
  infrastructure:
    orchestration: kubernetes
    service_mesh: istio  # Options: istio, linkerd, consul
    api_gateway: kong  # Options: kong, nginx, ambassador, traefik
    iac: terraform
    ci_cd: github-actions
    containerization: docker

  database:
    # Each service may have its own database
    # Define in custom.services section below

  testing:
    backend:
      framework: pytest  # Per service
      coverage_tool: pytest-cov
      e2e_framework: pytest-bdd

# =============================================================================
# CODING STANDARDS
# =============================================================================

coding_standards:
  test_coverage:
    minimum: 85
    fail_under: 85

  # Service-specific standards defined in custom.services

# =============================================================================
# ARCHITECTURE
# =============================================================================

architecture:
  pattern: microservices

  design_patterns:
    - "API Gateway Pattern"
    - "Service Discovery"
    - "Circuit Breaker"
    - "Event-Driven Architecture"
    - "Saga Pattern (for distributed transactions)"
    - "CQRS (optional)"

# =============================================================================
# MICROSERVICES CONFIGURATION
# =============================================================================

custom:
  messaging:
    message_broker: kafka  # Options: kafka, rabbitmq, pubsub, sqs
    event_store: postgresql  # For event sourcing

  observability:
    logging: elasticsearch  # ELK stack
    metrics: prometheus
    tracing: jaeger
    visualization: grafana

  services:
    - name: user-service
      language: python
      framework: fastapi
      database: postgresql
      port: 8001

    - name: order-service
      language: typescript
      framework: express
      database: mongodb
      port: 8002

    - name: payment-service
      language: java
      framework: spring-boot
      database: postgresql
      port: 8003

    - name: notification-service
      language: python
      framework: fastapi
      database: redis  # For queue
      port: 8004

# =============================================================================
# QUALITY GATES
# =============================================================================

quality_gates:
  security_review:
    enabled: true
    checklist: "docs/microservices-security-checklist.md"

  unit_testing:
    enabled: true
    coverage_minimum: 85
    all_tests_passing: true

  integration_testing:
    enabled: true
    contract_testing: true  # Pact or similar

  documentation:
    enabled: true
    required_updates:
      - "README.md"
      - "Service architecture diagram"
      - "API contracts"

# =============================================================================
# AGENT FRAMEWORK
# =============================================================================

agent_framework:
  enabled: true
  location: ".claude/"

# =============================================================================
# ENVIRONMENTS
# =============================================================================

environments:
  - name: development
    config:
      cluster: dev-cluster
      namespace: dev

  - name: staging
    config:
      cluster: staging-cluster
      namespace: staging

  - name: production
    config:
      cluster: prod-cluster
      namespace: prod
