# Vibey Framework Configuration Schema
# This schema defines the structure for project-config.yaml files

version: "1.0"

# =============================================================================
# REQUIRED FIELDS
# =============================================================================

project:
  type: object
  required: true
  properties:
    name:
      type: string
      required: true
      description: "Project name (e.g., 'my-app', 'data-platform')"

    description:
      type: string
      required: true
      description: "One-line project description"

    version:
      type: string
      required: false
      default: "0.1.0"
      description: "Current project version"

    repository:
      type: string
      required: false
      description: "Git repository URL"

    type:
      type: string
      required: true
      enum: [web-app, api, data-platform, ml, infrastructure]
      description: "Project type determines available workflows and agent recommendations"

    team_size:
      type: integer
      required: false
      default: 1
      description: "Number of developers on the team"

# =============================================================================
# VIBEY FRAMEWORK CONFIGURATION
# =============================================================================

framework:
  type: object
  required: false
  properties:
    orchestration_mode:
      type: string
      required: true
      enum: [simple, balanced, tiered]
      default: balanced
      description: |
        How Claude orchestrates agents and workflows:
        - simple: Follow explicit rules in CLAUDE.md
        - balanced: High-level rules + agent trigger pattern matching (recommended)
        - tiered: Fast path for simple requests, coordinator for complex ones

    auto_agent_launch:
      type: boolean
      required: false
      default: true
      description: "Automatically launch agents based on user requests"

    require_quality_gates:
      type: boolean
      required: false
      default: true
      description: "Enforce quality gates before sprint completion"

    version:
      type: string
      required: false
      default: "1.0"
      description: "Vibey framework version"

    config_location:
      type: string
      required: false
      enum: [root, .claude]
      default: root
      description: "Where project-config.yaml is located (root or .claude/ directory)"

# =============================================================================
# TECHNOLOGY STACK
# =============================================================================

technology_stack:
  type: object
  required: true
  properties:
    backend:
      type: object
      required: false
      properties:
        language:
          type: string
          required: true
          enum: [python, typescript, javascript, java, go, rust, ruby, php]
          description: "Primary backend language"

        version:
          type: string
          required: false
          description: "Language version constraint (e.g., '>=3.9', '^18.0.0')"

        framework:
          type: string
          required: false
          enum: [fastapi, flask, django, express, nestjs, spring-boot, gin, actix, rails, laravel]
          description: "Backend framework"

        platform:
          type: string
          required: false
          enum: [databricks, aws-lambda, vercel, heroku, kubernetes, docker]
          description: "Deployment platform"

    frontend:
      type: object
      required: false
      properties:
        language:
          type: string
          required: true
          enum: [typescript, javascript]
          description: "Frontend language"

        framework:
          type: string
          required: true
          enum: [react, vue, angular, svelte, solid, nextjs, nuxt]
          description: "Frontend framework"

        ui_library:
          type: string
          required: false
          enum: [material-ui, tailwind, bootstrap, chakra-ui, ant-design, shadcn]
          description: "UI component library"

    database:
      type: object
      required: false
      properties:
        type:
          type: string
          required: true
          enum: [postgresql, mysql, mongodb, sqlite, redis, dynamodb, delta-lake]
          description: "Primary database"

        orm:
          type: string
          required: false
          enum: [sqlalchemy, prisma, typeorm, sequelize, mongoose, gorm]
          description: "ORM/ODM library"

    testing:
      type: object
      required: false
      properties:
        backend:
          type: object
          properties:
            framework:
              type: string
              enum: [pytest, unittest, jest, vitest, junit, go-test, rspec]

            coverage_tool:
              type: string
              enum: [pytest-cov, coverage, jest, istanbul, jacoco]

            mocking:
              type: string
              enum: [pytest-mock, unittest-mock, jest, mockito, gomock]

        frontend:
          type: object
          properties:
            framework:
              type: string
              enum: [jest, vitest, jasmine, mocha]

            testing_library:
              type: string
              enum: [react-testing-library, vue-testing-library, angular-testing-library]

            e2e:
              type: string
              enum: [playwright, cypress, selenium, puppeteer]

    infrastructure:
      type: object
      required: false
      properties:
        iac:
          type: string
          enum: [terraform, pulumi, cloudformation, cdk]
          description: "Infrastructure as Code tool"

        ci_cd:
          type: string
          enum: [github-actions, gitlab-ci, circleci, jenkins, azure-devops]
          description: "CI/CD platform"

        containerization:
          type: string
          enum: [docker, podman]
          description: "Container runtime"

# =============================================================================
# CODING STANDARDS
# =============================================================================

coding_standards:
  type: object
  required: false
  properties:
    # Language-specific standards
    python:
      type: object
      properties:
        formatter:
          type: string
          enum: [black, ruff, autopep8, yapf]
          default: black

        line_length:
          type: integer
          default: 88
          min: 80
          max: 120

        linter:
          type: string
          enum: [ruff, pylint, flake8, pycodestyle]
          default: ruff

        type_checker:
          type: string
          enum: [mypy, pyright, pyre]
          default: mypy

    javascript:
      type: object
      properties:
        formatter:
          type: string
          enum: [prettier, eslint]
          default: prettier

        linter:
          type: string
          enum: [eslint, tslint]
          default: eslint

    # Test coverage requirements
    test_coverage:
      type: object
      properties:
        minimum:
          type: integer
          default: 90
          min: 0
          max: 100
          description: "Minimum test coverage percentage"

        fail_under:
          type: integer
          default: 90
          min: 0
          max: 100
          description: "Build fails if coverage below this threshold"

# =============================================================================
# PROJECT STRUCTURE
# =============================================================================

project_structure:
  type: object
  required: false
  properties:
    source_root:
      type: string
      default: "src/"
      description: "Root directory for source code"

    directories:
      type: object
      description: "Project-specific directory structure"

    naming_conventions:
      type: object
      description: "File/module naming conventions"

# =============================================================================
# ARCHITECTURE PATTERNS (Project-Specific)
# =============================================================================

architecture:
  type: object
  required: false
  properties:
    pattern:
      type: string
      enum: [layered, clean, hexagonal, microservices, modular-monolith, event-driven]
      description: "Overall architecture pattern"

    layers:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          description:
            type: string

    design_patterns:
      type: array
      items:
        type: string
      description: "Key design patterns used (e.g., 'Repository', 'Factory', 'Strategy')"

# =============================================================================
# DOMAIN RULES (Project-Specific)
# =============================================================================

critical_rules:
  type: array
  required: false
  items:
    type: object
    properties:
      id:
        type: integer

      rule:
        type: string
        required: true

      rationale:
        type: string
        required: false

      exception:
        type: string
        required: false

      enforcement:
        type: array
        items:
          type: string

# =============================================================================
# QUALITY GATES
# =============================================================================

quality_gates:
  type: object
  required: false
  properties:
    # Simplified minimum scores
    test_coverage_minimum:
      type: integer
      required: false
      default: 90
      min: 0
      max: 100
      description: "Minimum test coverage percentage required to pass quality gates"

    security_score_minimum:
      type: integer
      required: false
      default: 85
      min: 0
      max: 100
      description: "Minimum security audit score required (0-100)"

    logging_audit_minimum:
      type: integer
      required: false
      default: 80
      min: 0
      max: 100
      description: "Minimum logging audit score required (0-100)"

    required_reviews:
      type: array
      required: false
      default: [security, testing, logging, documentation]
      items:
        type: string
        enum: [security, testing, logging, documentation, performance, architecture]
      description: "Reviews required before sprint completion"

    # Detailed configuration (backward compatible)
    security_review:
      type: object
      properties:
        enabled:
          type: boolean
          default: true

        checklist:
          type: string
          description: "Path to security review checklist"

    unit_testing:
      type: object
      properties:
        enabled:
          type: boolean
          default: true

        coverage_minimum:
          type: integer
          default: 90

        all_tests_passing:
          type: boolean
          default: true

    logging_audit:
      type: object
      properties:
        enabled:
          type: boolean
          default: true

        checklist:
          type: string
          description: "Path to logging audit checklist"

        minimum_score:
          type: integer
          default: 80

    documentation:
      type: object
      properties:
        enabled:
          type: boolean
          default: true

        required_updates:
          type: array
          items:
            type: string

# =============================================================================
# AGENT FRAMEWORK
# =============================================================================

agent_framework:
  type: object
  required: false
  properties:
    enabled:
      type: boolean
      default: true
      description: "Enable agent framework for this project"

    location:
      type: string
      default: ".claude/"
      description: "Directory containing agent definitions"

    agents:
      type: object
      description: "Agent counts and configuration"

    workflows:
      type: integer
      description: "Number of workflows defined"

    templates:
      type: integer
      description: "Number of handoff templates"

# =============================================================================
# ENVIRONMENTS
# =============================================================================

environments:
  type: array
  required: false
  items:
    type: object
    properties:
      name:
        type: string
        required: true

      description:
        type: string
        required: false

      config:
        type: object
        description: "Environment-specific configuration"

# =============================================================================
# CUSTOM FIELDS
# =============================================================================

custom:
  type: object
  required: false
  description: "Project-specific custom configuration fields"
