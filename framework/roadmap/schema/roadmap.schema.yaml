# Roadmap Object YAML Schema
# Version: 2.1 (Gate Model)
# Purpose: Defines the structure and validation rules for roadmap.yaml files

schema_version: "2.1"
object_type: "roadmap"

# Required fields
required:
  - id
  - name
  - version
  - version_strategy
  - status
  - blocked
  - created
  - progress
  - tracks
  - activity_log
  - metadata

# Field definitions
fields:
  # Identity
  id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Unique identifier for the roadmap (lowercase, hyphens allowed)"
    example: "vibey-framework-v2"

  name:
    type: string
    min_length: 1
    max_length: 200
    description: "Human-readable name for the roadmap"
    example: "Vibey Multi-Platform Agent Framework"

  # Version Management
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-z]+(\\.[0-9]+)?)?$"
    description: "Semantic version (MAJOR.MINOR.PATCH[-stage[.build]])"
    example: "1.2.0"

  version_strategy:
    type: object
    required:
      - major_on
      - minor_on
      - patch_on
    fields:
      major_on:
        type: string
        enum: ["roadmap_milestone", "manual"]
        description: "When to bump major version"
      minor_on:
        type: string
        enum: ["track_completion", "manual"]
        description: "When to bump minor version"
      patch_on:
        type: string
        enum: ["sprint_production_ready", "manual"]
        description: "When to bump patch version"

  # Status
  status:
    type: string
    enum:
      - "not_started"
      - "in_progress"
      - "paused"
      - "completion_gate_check"
      - "completed"
      - "production_gate_check"
      - "production_ready"
      - "deployed"
      - "won't_do"
    description: "Current status of the roadmap"

  blocked:
    type: boolean
    description: "Whether the roadmap is blocked by dependencies"

  # Timing
  created:
    type: datetime
    description: "ISO 8601 datetime when roadmap was created"
    example: "2025-01-15T10:00:00Z"

  started:
    type: datetime
    nullable: true
    description: "ISO 8601 datetime when work started"

  target_completion:
    type: datetime
    nullable: true
    description: "Target completion date"

  completed:
    type: datetime
    nullable: true
    description: "When roadmap was completed"

  deployed:
    type: datetime
    nullable: true
    description: "When roadmap was deployed"

  # Aggregate Progress
  progress:
    type: object
    required:
      - tracks_total
      - tracks_completed
      - sprints_total
      - sprints_completed
      - tasks_total
      - tasks_completed
      - completion_percent
    fields:
      tracks_total:
        type: integer
        min: 0
      tracks_completed:
        type: integer
        min: 0
      sprints_total:
        type: integer
        min: 0
      sprints_completed:
        type: integer
        min: 0
      tasks_total:
        type: integer
        min: 0
      tasks_completed:
        type: integer
        min: 0
      completion_percent:
        type: integer
        min: 0
        max: 100

  # Tracks
  tracks:
    type: array
    min_items: 1
    items:
      type: object
      required:
        - id
        - name
        - status
        - priority
      fields:
        id:
          type: string
          pattern: "^[a-z0-9-]+$"
        name:
          type: string
        status:
          type: string
          enum:
            - "not_started"
            - "in_progress"
            - "paused"
            - "completion_gate_check"
            - "completed"
            - "production_gate_check"
            - "production_ready"
            - "deployed"
            - "won't_do"
        priority:
          type: string
          enum: ["critical", "high", "medium", "low"]

  # Dependencies (external systems)
  dependencies:
    type: array
    items:
      type: object
      required:
        - type
        - name
        - status
      fields:
        type:
          type: string
          enum: ["external"]
        name:
          type: string
        status:
          type: string
        required_for:
          type: string
          nullable: true

  # Blockers
  blocked_by:
    type: array
    items:
      type: object
      required:
        - dependency_id
        - dependency_type
        - current_status
        - required_status
        - blocking_since
      fields:
        dependency_id:
          type: string
        dependency_type:
          type: string
        current_status:
          type: string
        required_status:
          type: string
        blocking_since:
          type: datetime
        estimated_resolution:
          type: datetime
          nullable: true

  # Version History
  version_history:
    type: array
    items:
      type: object
      required:
        - version
        - date
        - milestone
      fields:
        version:
          type: string
        date:
          type: datetime
        milestone:
          type: string
        git_tag:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

  # Activity Log
  activity_log:
    type: array
    items:
      type: object
      required:
        - timestamp
        - type
        - description
      fields:
        timestamp:
          type: datetime
        type:
          type: string
          enum:
            - "roadmap_started"
            - "roadmap_completed"
            - "roadmap_deployed"
            - "track_started"
            - "track_completed"
            - "sprint_started"
            - "sprint_completed"
            - "sprint_production_ready"
            - "task_started"
            - "task_completed"
            - "quality_gate"
            - "version_bump"
            - "blocker_added"
            - "blocker_resolved"
            - "design_completed"
            - "planning_completed"
            - "roadmap_initialized"
        description:
          type: string
        context:
          type: object
          nullable: true

  # Metadata
  metadata:
    type: object
    required:
      - created_by
      - framework_version
      - schema_version
      - last_updated
    fields:
      created_by:
        type: string
      framework_version:
        type: string
      schema_version:
        type: string
      last_updated:
        type: datetime
      purpose:
        type: string
        nullable: true
      description:
        type: string
        nullable: true

# Validation Rules
validation_rules:
  - rule: "tracks_completed <= tracks_total"
    message: "Completed tracks cannot exceed total tracks"

  - rule: "sprints_completed <= sprints_total"
    message: "Completed sprints cannot exceed total sprints"

  - rule: "tasks_completed <= tasks_total"
    message: "Completed tasks cannot exceed total tasks"

  - rule: "completion_percent == (tasks_completed / tasks_total * 100) if tasks_total > 0 else 0"
    message: "Completion percent must match calculated value"

  - rule: "if started is not null then started >= created"
    message: "Start date must be after or equal to creation date"

  - rule: "if completed is not null then completed >= started"
    message: "Completion date must be after or equal to start date"

  - rule: "if status == 'in_progress' then started is not null"
    message: "In-progress roadmaps must have a start date"

  - rule: "if status == 'completed' then completed is not null"
    message: "Completed roadmaps must have a completion date"

  - rule: "blocked == true if blocked_by is not empty else false"
    message: "Blocked flag must match blocker list"

  - rule: "all track ids in tracks must be unique"
    message: "Track IDs must be unique within roadmap"

# Documentation
documentation:
  description: |
    The Roadmap object is the top-level container for project management state.
    It contains:
    - Unified activity log (all events across tracks/sprints/tasks)
    - Version management (semantic versioning with automatic bumps)
    - Aggregate progress tracking
    - Track definitions and status
    - External dependencies

  usage: |
    Roadmaps are stored in .vibey/roadmap.yaml and serve as the single source
    of truth for project state. They are read and updated by:
    - vibey CLI commands
    - Python state management scripts
    - Agent workflows

  references:
    - "docs/development/ROADMAP_OBJECT_HIERARCHY.md"
    - "docs/development/ROADMAP_IMPLEMENTATION_PLAN.md"
