# Task Object YAML Schema
# Version: 2.1 (Gate Model)
# Purpose: Defines the structure and validation rules for task objects

schema_version: "2.1"
object_type: "task"

# Required fields
required:
  - id
  - sprint_id
  - track_id
  - roadmap_id
  - task_type
  - title
  - description
  - status
  - blocked
  - created
  - assigned_agent
  - priority
  - estimated_tokens
  - complexity
  - dependencies
  - blocks
  - blocked_by
  - metadata

# Field definitions
fields:
  # Identity
  id:
    type: string
    pattern: "^[a-z0-9-]+-\\d+-(task|gate-[cp])\\d+$"
    description: "Sprint-scoped task ID"
    examples:
      - "backend-1-task-001"  # Development task
      - "backend-1-gate-c001"  # Completion gate task
      - "backend-1-gate-p001"  # Production gate task

  sprint_id:
    type: string
    pattern: "^[a-z0-9-]+-\\d+$"
    description: "ID of the parent sprint"

  track_id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "ID of the parent track"

  roadmap_id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "ID of the parent roadmap"

  # Task Type
  task_type:
    type: string
    enum: ["development", "completion_gate", "production_gate"]
    description: |
      Type of task:
      - development: Build functionality, can serve as dev gates for external sprints
      - completion_gate: Hygiene checks, highly isolated
      - production_gate: Production readiness, highly isolated

  # Description
  title:
    type: string
    min_length: 1
    max_length: 200
    description: "Short, descriptive title for the task"

  description:
    type: string
    description: "Detailed description of the task, what needs to be done"

  # Status (restricted set for tasks - no production_ready or deployed)
  status:
    type: string
    enum:
      - "not_started"
      - "in_progress"
      - "paused"
      - "completion_gate_check"
      - "completed"
      - "won't_do"
    description: "Current status of the task (no production statuses)"

  blocked:
    type: boolean
    description: "Whether the task is blocked by dependencies"

  # Timing
  created:
    type: datetime
    description: "When task was created"

  started:
    type: datetime
    nullable: true
    description: "When work started"

  completed:
    type: datetime
    nullable: true
    description: "When task was completed"

  # Assignment
  assigned_agent:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Agent assigned to this task"
    examples:
      - "web-developer"
      - "security-auditor"
      - "test-engineer"

  priority:
    type: string
    enum: ["critical", "high", "medium", "low"]
    description: "Priority level for this task"

  # Optional: Phase label (organizational only)
  phase_label:
    type: string
    nullable: true
    description: "Optional phase label for organization (not structural)"

  # Complexity & Size
  estimated_tokens:
    type: integer
    min: 0
    description: "Estimated token count (context window sizing)"

  actual_tokens:
    type: integer
    min: 0
    nullable: true
    description: "Actual tokens used"

  complexity:
    type: string
    enum: ["simple", "medium", "complex"]
    description: "Complexity rating"

  # Gate Information (only for quality gate tasks)
  gate_info:
    type: object
    nullable: true
    description: "Required for completion_gate and production_gate tasks"
    required:
      - blocks_status
      - threshold
      - is_blocking
    fields:
      blocks_status:
        type: string
        enum: ["completed", "production_ready"]
        description: "What status this gate blocks"
      threshold:
        type: integer
        min: 0
        max: 100
        description: "Minimum score to pass"
      score:
        type: integer
        min: 0
        max: 100
        nullable: true
        description: "Actual score achieved"
      is_blocking:
        type: boolean
        description: "Is this a blocking gate?"

  # Audit Results (for quality gate tasks)
  audit_results:
    type: object
    nullable: true
    description: "Results from quality gate execution"
    fields:
      issues_found:
        type: integer
        min: 0
      issues_fixed:
        type: integer
        min: 0
      recommendations:
        type: array
        items:
          type: string

  # Dependencies
  dependencies:
    type: array
    items:
      type: object
      required:
        - type
        - target_id
        - target_status
        - reason
      fields:
        type:
          type: string
          enum: ["task", "sprint", "external"]
        target_id:
          type: string
        target_status:
          type: string
        reason:
          type: string

  # What this task blocks
  blocks:
    type: array
    items:
      type: object
      required:
        - type
        - target_id
        - at_status
        - reason
      fields:
        type:
          type: string
          enum: ["task"]
        target_id:
          type: string
        at_status:
          type: string
        reason:
          type: string

  # Current blockers (auto-computed)
  blocked_by:
    type: array
    items:
      type: object
      required:
        - dependency_id
        - dependency_type
        - current_status
        - required_status
        - blocking_since
      fields:
        dependency_id:
          type: string
        dependency_type:
          type: string
        current_status:
          type: string
        required_status:
          type: string
        blocking_since:
          type: datetime
        estimated_resolution:
          type: datetime
          nullable: true

  # Deliverables
  deliverables:
    type: array
    items:
      type: object
      required:
        - type
        - paths
      fields:
        type:
          type: string
          enum: ["code", "test", "documentation", "config", "other"]
        paths:
          type: array
          items:
            type: string

  # Git commits
  commits:
    type: array
    items:
      type: object
      required:
        - sha
        - message
        - date
        - author
      fields:
        sha:
          type: string
          pattern: "^[a-f0-9]{7,40}$"
        message:
          type: string
        date:
          type: datetime
        author:
          type: string

  # Metadata
  metadata:
    type: object
    required:
      - last_updated
    fields:
      token_efficiency:
        type: number
        min: 0
        nullable: true
        description: "actual_tokens / estimated_tokens"
      duration_hours:
        type: number
        min: 0
        nullable: true
      last_updated:
        type: datetime

# Validation Rules
validation_rules:
  - rule: "task id must start with sprint_id"
    message: "Task ID must be sprint-scoped"

  - rule: "if task_type == 'development' then gate_info must be null"
    message: "Development tasks cannot have gate_info"

  - rule: "if task_type in ['completion_gate', 'production_gate'] then gate_info must not be null"
    message: "Quality gate tasks must have gate_info"

  - rule: "if task_type == 'completion_gate' then gate_info.blocks_status must be 'completed'"
    message: "Completion gates must block 'completed' status"

  - rule: "if task_type == 'production_gate' then gate_info.blocks_status must be 'production_ready'"
    message: "Production gates must block 'production_ready' status"

  - rule: "if status == 'in_progress' then started is not null"
    message: "In-progress tasks must have a start date"

  - rule: "if status == 'completed' then completed is not null"
    message: "Completed tasks must have a completion date"

  - rule: "if completed is not null then completed >= started"
    message: "Completion date must be after or equal to start date"

  - rule: "blocked == true if blocked_by is not empty else false"
    message: "Blocked flag must match blocker list"

  - rule: "estimated_tokens > 0 and fits within context window"
    message: "Tasks must be sized to fit within model's context window"

  - rule: "if actual_tokens is not null then token_efficiency == actual_tokens / estimated_tokens"
    message: "Token efficiency must match calculated value"

  - rule: "quality gate tasks can only depend on sprint status, not external tasks"
    message: "Gate tasks are highly isolated - only depend on sprint gate_check status"

  - rule: "development tasks can be depended on by external sprints"
    message: "Dev tasks can serve as development gates"

  - rule: "quality gate tasks cannot be depended on by external sprints"
    message: "Gate tasks cannot be development gates"

# Documentation
documentation:
  description: |
    The Task object is a context-window sized work unit - the smallest unit
    of work in the framework.

    Key characteristics:
    - Sized to fit within model's context window
    - No production concerns (no production_ready or deployed statuses)
    - Can be a development task OR a quality gate task

  task_types_detail: |
    1. Development Task (task_type: development)
       - Builds functionality
       - CAN serve as development gates for external sprints
       - Can depend on external development tasks
       - No gate_info object

    2. Completion Gate Task (task_type: completion_gate)
       - Hygiene checks (docs, CI/CD)
       - CANNOT be depended on by external sprints
       - Highly isolated (only depends on sprint gate_check status)
       - Has gate_info with blocks_status: 'completed'

    3. Production Gate Task (task_type: production_gate)
       - Production readiness checks (security, testing)
       - CANNOT be depended on by external sprints
       - Highly isolated (only depends on sprint gate_check status)
       - Has gate_info with blocks_status: 'production_ready'

  id_convention: |
    Task IDs follow the pattern: {sprint-id}-(task|gate-[cp]){number}

    Examples:
    - backend-1-task-001  (development task)
    - backend-1-gate-c001 (completion gate)
    - backend-1-gate-p001 (production gate)

  usage: |
    Tasks are stored in .vibey/tasks/{sprint-id}-tasks.yaml as batches.
    All tasks for a sprint are in a single file for efficiency.

  references:
    - "docs/development/ROADMAP_OBJECT_HIERARCHY.md#task-object"
