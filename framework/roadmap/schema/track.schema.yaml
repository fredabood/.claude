# Track Object YAML Schema
# Version: 2.1 (Gate Model)
# Purpose: Defines the structure and validation rules for track YAML files

schema_version: "2.1"
object_type: "track"

# Required fields
required:
  - id
  - name
  - roadmap_id
  - status
  - blocked
  - priority
  - created
  - progress
  - sprints
  - dependencies
  - blocks
  - blocked_by
  - quality_gates
  - assigned_agents
  - metadata

# Field definitions
fields:
  # Identity
  id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "Unique identifier for the track (lowercase, hyphens allowed)"
    example: "backend"

  name:
    type: string
    min_length: 1
    max_length: 200
    description: "Human-readable name for the track"
    example: "Backend Services Development"

  roadmap_id:
    type: string
    pattern: "^[a-z0-9-]+$"
    description: "ID of the parent roadmap"

  # Status
  status:
    type: string
    enum:
      - "not_started"
      - "in_progress"
      - "paused"
      - "completion_gate_check"
      - "completed"
      - "production_gate_check"
      - "production_ready"
      - "deployed"
      - "won't_do"
    description: "Current status of the track"

  blocked:
    type: boolean
    description: "Whether the track is blocked by dependencies"

  priority:
    type: string
    enum: ["critical", "high", "medium", "low"]
    description: "Priority level for this track"

  # Timing
  created:
    type: datetime
    description: "ISO 8601 datetime when track was created"

  started:
    type: datetime
    nullable: true
    description: "When work started on this track"

  completed:
    type: datetime
    nullable: true
    description: "When track was completed"

  estimated_duration:
    type: string
    nullable: true
    description: "Estimated duration (e.g., '90 days', '12 weeks')"

  # Progress
  progress:
    type: object
    required:
      - sprints_total
      - sprints_completed
      - tasks_total
      - tasks_completed
      - completion_percent
    fields:
      sprints_total:
        type: integer
        min: 0
      sprints_completed:
        type: integer
        min: 0
      tasks_total:
        type: integer
        min: 0
      tasks_completed:
        type: integer
        min: 0
      completion_percent:
        type: integer
        min: 0
        max: 100

  # Sprints (track-scoped IDs)
  sprints:
    type: array
    min_items: 0
    items:
      type: object
      required:
        - id
        - name
        - status
      fields:
        id:
          type: string
          pattern: "^[a-z0-9-]+-\\d+$"
          description: "Track-scoped ID (e.g., backend-1)"
        name:
          type: string
        status:
          type: string
          enum:
            - "not_started"
            - "in_progress"
            - "paused"
            - "completion_gate_check"
            - "completed"
            - "production_gate_check"
            - "production_ready"
            - "deployed"
            - "won't_do"
        estimated_duration:
          type: string
          nullable: true
        tasks_count:
          type: integer
          min: 0
          nullable: true
        started:
          type: datetime
          nullable: true

  # Dependencies
  dependencies:
    type: array
    items:
      type: object
      required:
        - type
        - target_id
        - target_status
        - reason
      fields:
        type:
          type: string
          enum: ["track", "sprint", "external"]
        target_id:
          type: string
        target_status:
          type: string
        reason:
          type: string
        optional:
          type: boolean
          default: false

  # What this track blocks
  blocks:
    type: array
    items:
      type: object
      required:
        - type
        - target_id
        - at_status
        - reason
      fields:
        type:
          type: string
          enum: ["track", "sprint"]
        target_id:
          type: string
        at_status:
          type: string
        reason:
          type: string

  # Current blockers (auto-computed)
  blocked_by:
    type: array
    items:
      type: object
      required:
        - dependency_id
        - dependency_type
        - current_status
        - required_status
        - blocking_since
      fields:
        dependency_id:
          type: string
        dependency_type:
          type: string
        current_status:
          type: string
        required_status:
          type: string
        blocking_since:
          type: datetime
        estimated_resolution:
          type: datetime
          nullable: true

  # Track-level quality gates
  quality_gates:
    type: array
    items:
      type: object
      required:
        - name
        - threshold
        - blocking
        - status
      fields:
        name:
          type: string
        threshold:
          type: integer
          min: 0
          max: 100
        blocking:
          type: boolean
        status:
          type: string
          enum: ["not_run", "running", "passed", "failed"]
        description:
          type: string
          nullable: true
        score:
          type: integer
          min: 0
          max: 100
          nullable: true

  # Recommended agents
  assigned_agents:
    type: array
    items:
      type: string
      pattern: "^[a-z0-9-]+$"

  # Deliverables
  deliverables:
    type: array
    items:
      type: string

  # Strategic context
  strategic_value:
    type: array
    items:
      type: string
    nullable: true

  # Metadata
  metadata:
    type: object
    required:
      - created_by
      - last_updated
    fields:
      created_by:
        type: string
      last_updated:
        type: datetime
      design_doc:
        type: string
        nullable: true
      implementation_plan:
        type: string
        nullable: true
      notes:
        type: string
        nullable: true

# Validation Rules
validation_rules:
  - rule: "sprints_completed <= sprints_total"
    message: "Completed sprints cannot exceed total sprints"

  - rule: "tasks_completed <= tasks_total"
    message: "Completed tasks cannot exceed total tasks"

  - rule: "completion_percent == (tasks_completed / tasks_total * 100) if tasks_total > 0 else 0"
    message: "Completion percent must match calculated value"

  - rule: "if started is not null then started >= created"
    message: "Start date must be after or equal to creation date"

  - rule: "if completed is not null then completed >= started"
    message: "Completion date must be after or equal to start date"

  - rule: "if status == 'in_progress' then started is not null"
    message: "In-progress tracks must have a start date"

  - rule: "if status == 'completed' then completed is not null"
    message: "Completed tracks must have a completion date"

  - rule: "blocked == true if blocked_by is not empty else false"
    message: "Blocked flag must match blocker list"

  - rule: "all sprint ids must start with track id"
    message: "Sprint IDs must be track-scoped (e.g., backend-1)"

  - rule: "all sprint ids must be unique"
    message: "Sprint IDs must be unique within track"

  - rule: "sprints_total == count of sprints array"
    message: "Sprints total must match count of sprints"

# Documentation
documentation:
  description: |
    The Track object represents a parallelization boundary containing related sprints.
    Tracks enable:
    - Parallel execution (tracks with no dependencies can run simultaneously)
    - Natural team/feature alignment
    - Clear separation of concerns

  naming_convention: |
    Track IDs should describe the work area (e.g., backend, frontend, mobile, infra).
    Sprint IDs within the track are prefixed with track ID (e.g., backend-1, backend-2).

  usage: |
    Tracks are stored in .vibey/tracks/{track-id}.yaml files.
    Each track file contains complete state for that track including all sprints.

  references:
    - "docs/development/ROADMAP_OBJECT_HIERARCHY.md#track-object"
