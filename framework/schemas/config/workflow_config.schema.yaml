# Workflow Configuration Schema
# Version: 1.0
# Created: 2025-11-09

$schema: http://json-schema.org/draft-07/schema#
title: Vibey Workflow Configuration
description: Workflow definition schema (metadata - templates generate full instructions)
type: object

required:
  - workflow
  - steps

properties:
  workflow:
    type: object
    required:
      - id
      - name
      - category
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
      name:
        type: string
      category:
        type: string
        enum: [planning, development, quality, infrastructure, documentation]
      description:
        type: string
      estimated_duration:
        type: string
      complexity:
        type: string
        enum: [low, medium, high, very-high]

  steps:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
        - recommended_agents
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        recommended_agents:
          type: array
          items:
            type: string
        duration:
          type: string
        dependencies:
          type: array
          items:
            type: string

  project_types:
    type: array
    description: Applicable project types
    items:
      type: string
      enum: [web-app, api, ml-model, data-platform, infrastructure, library, cli-tool, mobile-app]

  metadata:
    type: object
    properties:
      created:
        type: string
        format: date-time
      last_updated:
        type: string
        format: date-time
      author:
        type: string
      tags:
        type: array
        items:
          type: string

additionalProperties: false
