id: architecture-review
name: Architecture Review
description: Systematic architecture review for sprints, code, infrastructure, and
  system design
version: 1.0.0
estimated_duration: 2-3 days
complexity: medium
steps:
- order: 1
  name: Request Architecture Review (Day 1, Morning)
  tool: vibey_sprint_planning_agent
  estimated_duration: 0.5 days
- order: 2
  name: Review Sprint Plan / Design (Day 1, Afternoon)
  tool: vibey_{%_if_config.architecture_%}{{_config.architecture.specialist_}}{%_else_%}architecture_specialist{%_endif_%}
  estimated_duration: 0.5 days
- order: 3
  name: Review Code & Infrastructure (Day 2)
  tool: vibey_{%_if_config.architecture_%}{{_config.architecture.specialist_}}{%_else_%}architecture_specialist{%_endif_%}
  estimated_duration: 1 day
- order: 4
  name: Create Architecture Review Report (Day 2-3)
  tool: vibey_{%_if_config.architecture_%}{{_config.architecture.specialist_}}{%_else_%}architecture_specialist{%_endif_%}
  estimated_duration: 0.5 days
- order: 5
  name: Implement Recommendations (Day 3)
  tool: vibey_relevant_development_agents_({%_if_config.project.type_==_'web_app'_%}web_developer{%_elif_config.project.type_==_'api'_%}api_developer{%_elif_config.project.type_==_'ml'_%}ml_engineer{%_else_%}developers{%_endif_%},_devops_engineer,_etc.)
  estimated_duration: Variable (0.5-2 days for critical items)
- order: 6
  name: Update Architecture Documentation (Day 3)
  tool: vibey_documentation_engineer
  estimated_duration: 0.5 days
- order: 7
  name: Commit Changes (Day 3)
  tool: vibey_git_committer
  estimated_duration: 0.25 days
