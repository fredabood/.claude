id: frontend-security-hardening
name: Frontend Security Hardening Workflow
description: Comprehensive security implementation and audit for frontend applications
version: 1.0.0
estimated_duration: 3-5 days
complexity: high
steps:
- order: 1
  name: Implement Authentication{% if config.security and config.security.authentication
    %} ({{ config.security.authentication.method }}){% endif %} (1-2 days)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.security_engineer_or_'security_engineer'_}}{%_else_%}security_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 2
  name: Implement Input Validation (1-2 days)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.security_engineer_or_'security_engineer'_}}{%_else_%}security_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 3
  name: XSS Prevention (1 day)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.security_engineer_or_'security_engineer'_%}{%_else_%}security_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 4
  name: Security Headers (0.5 days)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.security_engineer_or_'security_engineer'_%}{%_else_%}security_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 5
  name: Rate Limiting (0.5 days)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.security_engineer_or_'security_engineer'_}}{%_else_%}security_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 6
  name: Security Audit (1 day)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.security_engineer_or_'security_engineer'_}}_+_{{_config.agents.test_engineer_or_'test_engineer'_}}{%_else_%}security_engineer_+_test_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 7
  name: Documentation (0.5 days)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.documentation_engineer_or_'documentation_engineer'_}}{%_else_%}documentation_engineer{%_endif_%}
  estimated_duration: 0.5 days
- order: 8
  name: Commit Security Changes (0.5 days)
  tool: vibey_{%_if_config.agents_%}{{_config.agents.git_committer_or_'git_committer'_}}{%_else_%}git_committer{%_endif_%}
  estimated_duration: 0.5 days
