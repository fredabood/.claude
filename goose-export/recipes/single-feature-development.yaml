id: single-feature-development
name: Single Feature Development
description: Complete development of a single feature from specification to deployment
version: 1.0.0
estimated_duration: 1-3 days (depending on complexity)
complexity: medium
steps:
- order: 1
  name: Architecture & Design
  tool: vibey_{%_if_config.architecture_%}{{_config.architecture.specialist_}}{%_else_%}architecture_specialist{%_endif_%}
  estimated_duration: 0.5-1 day
- order: 2
  name: Implementation
  tool: vibey_{%_if_config.project.type_==_'web_app'_%}web_developer{%_elif_config.project.type_==_'api'_%}api_developer{%_elif_config.project.type_==_'ml'_%}ml_engineer{%_else_%}developer{%_endif_%}
  estimated_duration: 0.5-1.5 days
- order: 3
  name: Comprehensive Testing
  tool: vibey_test_engineer
  estimated_duration: 0.25-0.75 days
- order: 4
  name: Security Review
  tool: vibey_security_reviewer
  estimated_duration: 0.25-0.5 days
- order: 5
  name: Integration
  tool: vibey_integration_engineer
  estimated_duration: 0.25-0.5 days
- order: 6
  name: Documentation
  tool: vibey_documentation_engineer
  estimated_duration: 0.25-0.5 days
- order: 7
  name: Commit & Push
  tool: vibey_git_committer
  estimated_duration: 0.25 days
