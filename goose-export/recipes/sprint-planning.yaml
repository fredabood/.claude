id: sprint-planning
name: Sprint Planning & Roadmap Management
description: Orchestrate sprint planning, prioritization, dependency analysis, and
  roadmap updates
version: 1.0.0
estimated_duration: 3-5 days (ongoing sprints) | 20-40 minutes (first sprint with
  framework initialization)
complexity: medium
steps:
- order: 1
  name: Analyze Current State (Day 1)
  tool: vibey_sprint_planning_agent
  estimated_duration: 0.5 days
- order: 2
  name: Collect Sprint Requirements (Day 1)
  tool: vibey_sprint_planning_agent
  estimated_duration: 0.5 days
- order: 3
  name: Research New Technologies/APIs (Day 2) [OPTIONAL]
  tool: vibey_researcher
  estimated_duration: 1 day (skip if no new tech)
- order: 4
  name: Review Technical Feasibility & Architecture (Day 2-3)
  tool: vibey_{%_if_config.architecture_%}{{_config.architecture.specialist_}}{%_else_%}architecture_specialist{%_endif_%}
  estimated_duration: 1 day
- order: 5
  name: Create Dependency Graph & Prioritization (Day 3-4)
  tool: vibey_sprint_planning_agent
  estimated_duration: 1 day
- order: 6
  name: Sequence Sprints & Create Sprint Plan (Day 4)
  tool: vibey_sprint_planning_agent
  estimated_duration: 1 day
- order: 7
  name: Update ROADMAP.md (Day 5)
  tool: vibey_sprint_planning_agent
  estimated_duration: 0.5 days
- order: 8
  name: Update .claude/CLAUDE.md (Day 5)
  tool: vibey_documentation_engineer
  estimated_duration: 0.5 days
- order: 9
  name: Commit Roadmap & Sprint Plan (Day 5)
  tool: vibey_git_committer
  estimated_duration: 0.5 days
