[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=vibey
    --cov=scripts
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90

# Markers for test categorization
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for workflows
    e2e: End-to-end tests for complete user journeys
    platform: Platform-specific tests
    slow: Tests that take significant time to run
    requires_git: Tests that require git to be installed
    priority_1: Priority 1 (critical path) tests
    priority_2: Priority 2 (important) tests
    priority_3: Priority 3 (nice to have) tests

# Coverage options
[coverage:run]
source = vibey,scripts
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
