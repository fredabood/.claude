# Expected repository state after Vibey framework deployment

description: |
  This file defines the expected state of a repository immediately after
  Vibey framework has been deployed (after /vibey initialization).

directory_structure:
  directories:
    - .vibey
    - .vibey/config
    - .vibey/roadmap

  files:
    - CLAUDE.md
    - .vibey/config/project.yaml
    - .vibey/config/framework.yaml
    - .vibey/config/agents.yaml
    - .vibey/config/quality-gates.yaml

file_content_checks:
  - file: CLAUDE.md
    contains:
      - "VIBEY_FRAMEWORK_MANAGED"
      - "Project Type:"
      - "Project Context"

  - file: .vibey/config/project.yaml
    contains:
      - "project:"
      - "name:"
      - "type:"
      - "tech_stack:"

  - file: .vibey/config/framework.yaml
    contains:
      - "framework:"
      - "orchestration_mode:"
      - "platform:"

  - file: .vibey/config/agents.yaml
    contains:
      - "agents:"
      - "enabled:"

  - file: .vibey/config/quality-gates.yaml
    contains:
      - "quality_gates:"
      - "gates:"

git_state:
  has_git: true
  branch: main
  clean: false  # After deployment, files are staged but not committed

yaml_validations:
  - file: .vibey/config/project.yaml
    required_keys:
      - project
    key_types:
      project: dict

  - file: .vibey/config/framework.yaml
    required_keys:
      - framework
    key_types:
      framework: dict

  - file: .vibey/config/agents.yaml
    required_keys:
      - agents
    key_types:
      agents: dict

  - file: .vibey/config/quality-gates.yaml
    required_keys:
      - quality_gates
    key_types:
      quality_gates: dict

success_metrics:
  deployment_success_rate:
    threshold: 100
    unit: percentage

  agent_count:
    threshold: 19
    unit: count

  workflow_count:
    threshold: 16
    unit: count
