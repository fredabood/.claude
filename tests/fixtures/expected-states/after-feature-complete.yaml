# Expected repository state after feature completion

description: |
  This file defines the expected state of a repository after completing
  a feature development cycle with all quality gates passed.

directory_structure:
  directories:
    - .vibey
    - .vibey/config
    - .vibey/roadmap
    - tests

  files:
    - CLAUDE.md
    - .vibey/config/project.yaml
    - .vibey/config/framework.yaml
    - .vibey/config/agents.yaml
    - .vibey/config/quality-gates.yaml

file_content_checks:
  - file: CLAUDE.md
    contains:
      - "VIBEY_FRAMEWORK_MANAGED"
      - "Current Sprint:"

git_state:
  has_git: true
  branch: main
  clean: true  # Feature complete means all changes committed

commit_validations:
  - pattern: "^(feat|fix):"
    description: Feature or fix commits present

  - pattern: "test:"
    description: Test commits present

success_metrics:
  quality_gate_pass_rate:
    threshold: 100
    unit: percentage

  test_coverage:
    threshold: 80
    unit: percentage

  security_audit_pass:
    threshold: 100
    unit: percentage

  feature_completion_time:
    threshold: 28800  # 8 hours max
    unit: seconds

  commit_count:
    threshold: 3
    unit: count
