# Expected repository state after sprint planning

description: |
  This file defines the expected state of a repository after completing
  sprint planning (creating a sprint plan and initializing sprint state).

directory_structure:
  directories:
    - .vibey
    - .vibey/config
    - .vibey/roadmap

  files:
    - CLAUDE.md
    - .vibey/config/project.yaml
    - .vibey/config/framework.yaml
    - .vibey/config/agents.yaml
    - .vibey/config/quality-gates.yaml
    - .vibey/roadmap.yaml

file_content_checks:
  - file: .vibey/roadmap.yaml
    contains:
      - "roadmap:"
      - "tracks:"
      - "progress:"
      - "status:"

  - file: CLAUDE.md
    contains:
      - "Current Sprint:"
      - "Sprint Goal:"
      - "VIBEY_FRAMEWORK_MANAGED"

git_state:
  has_git: true
  branch: main
  clean: false

yaml_validations:
  - file: .vibey/config/project.yaml
    required_keys:
      - project

  - file: .vibey/config/framework.yaml
    required_keys:
      - framework

  - file: .vibey/config/agents.yaml
    required_keys:
      - agents

  - file: .vibey/roadmap.yaml
    required_keys:
      - roadmap

success_metrics:
  sprint_creation_time:
    threshold: 600  # 10 minutes max
    unit: seconds

  task_count:
    threshold: 3
    unit: count

  sprint_plan_accuracy:
    threshold: 95
    unit: percentage
