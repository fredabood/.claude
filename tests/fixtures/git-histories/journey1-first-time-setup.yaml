# Git History Pattern for Journey 1: First-Time Setup
#
# Expected commit sequence when initializing Vibey in a new project

expected_commits:
  - pattern: "^(feat|chore): (initialize|add|deploy) (vibey|framework)"
    description: "Initial Vibey framework deployment"
    example: "feat: deploy Vibey framework to project"

  - pattern: "^chore: (configure|add) project configuration"
    description: "Project configuration created"
    example: "chore: configure project settings and tech stack"

  - pattern: "^docs: (add|update) CLAUDE.md"
    description: "Project context file generation"
    example: "docs: add CLAUDE.md project context"

commit_count:
  min: 1
  max: 3
  typical: 2

file_changes:
  required:
    - ".claude/CLAUDE.md"
    - ".claude/project-config.yaml"
  optional:
    - ".gitignore"
    - ".vibey/roadmap.yaml"

success_criteria:
  - "All commits follow conventional commit format"
  - "CLAUDE.md contains VIBEY_FRAMEWORK_MANAGED marker"
  - "project-config.yaml is valid YAML"
  - "No secrets or sensitive data committed"
