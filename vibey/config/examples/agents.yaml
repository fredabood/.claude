agents:
  enabled:
    - "coordinator"
    - "web-developer"
    - "test-engineer"
    - "docs-writer"
    - "security-engineer"
    - "performance-engineer"
    - "sprint-planner"

  disabled:
    - "ml-engineer"  # Not needed for this project

agent_preferences:
