quality_gates:
  enabled: true
  mode: "balanced"

gates:
  security:
    enabled: true
    threshold: 95
    blocking: true
    checks:
      - "dependency-scan"
      - "code-scan"
      - "secrets-scan"

  testing:
    enabled: true
    coverage_threshold: 80
    threshold: 100
    blocking: true

  logging:
    enabled: true
    threshold: 90
    blocking: false

  documentation:
    enabled: true
    threshold: 85
    blocking: false

  performance:
    enabled: false
    threshold: 90
    blocking: false
