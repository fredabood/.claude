# Agents Configuration Schema
# Location: .vibey/config/agents.yaml
# Purpose: Agent selection and configuration

schema_version: "1.0.0"

fields:
  agents:
    type: object
    required: true
    description: Agent configuration
    properties:
      enabled:
        type: array
        items: string
        required: true
        description: List of enabled agents
        example: ["web-developer", "test-engineer", "docs-writer"]

      disabled:
        type: array
        items: string
        required: false
        description: List of explicitly disabled agents
        example: ["ml-engineer"]

  agent_preferences:
    type: object
    required: false
    description: Per-agent configuration
    additionalProperties:
      type: object
      properties:
        priority:
          type: integer
          min: 1
          max: 10
          description: Agent priority (1=lowest, 10=highest)

        auto_trigger:
          type: boolean
          description: Allow automatic triggering

        custom_prompts:
          type: object
          description: Custom prompt overrides

example:
  agents:
    enabled:
      - "coordinator"
      - "web-developer"
      - "test-engineer"
      - "docs-writer"
      - "security-engineer"
      - "performance-engineer"
      - "sprint-planner"

    disabled:
      - "ml-engineer"  # Not needed for this project

  agent_preferences:
    web-developer:
      priority: 9
      auto_trigger: true

    test-engineer:
      priority: 8
      auto_trigger: true

    security-engineer:
      priority: 10
      auto_trigger: false  # Manual review only

    docs-writer:
      priority: 6
      auto_trigger: true
