# Quality Gates Configuration Schema
# Location: .vibey/config/quality-gates.yaml
# Purpose: Quality gate definitions and thresholds

schema_version: "1.0.0"

fields:
  quality_gates:
    type: object
    required: true
    description: Quality gate configuration
    properties:
      enabled:
        type: boolean
        required: true
        default: true
        description: Enable quality gates

      mode:
        type: string
        required: false
        enum: ["strict", "balanced", "permissive"]
        default: "balanced"
        description: Quality gate enforcement mode

  gates:
    type: object
    required: false
    description: Individual gate configurations
    properties:
      security:
        type: object
        properties:
          enabled:
            type: boolean
            default: true

          threshold:
            type: integer
            min: 0
            max: 100
            default: 95
            description: Minimum score to pass (percentage)

          blocking:
            type: boolean
            default: true
            description: Block deployment if failed

          checks:
            type: array
            items: string
            description: Security checks to run
            example: ["dependency-scan", "code-scan", "secrets-scan"]

      testing:
        type: object
        properties:
          enabled:
            type: boolean
            default: true

          coverage_threshold:
            type: integer
            min: 0
            max: 100
            default: 80
            description: Minimum test coverage percentage

          blocking:
            type: boolean
            default: true

      logging:
        type: object
        properties:
          enabled:
            type: boolean
            default: true

          threshold:
            type: integer
            default: 90

          blocking:
            type: boolean
            default: false

      documentation:
        type: object
        properties:
          enabled:
            type: boolean
            default: true

          threshold:
            type: integer
            default: 85

          blocking:
            type: boolean
            default: false

      performance:
        type: object
        properties:
          enabled:
            type: boolean
            default: false

          threshold:
            type: integer
            default: 90

          blocking:
            type: boolean
            default: false

example:
  quality_gates:
    enabled: true
    mode: "balanced"

  gates:
    security:
      enabled: true
      threshold: 95
      blocking: true
      checks:
        - "dependency-scan"
        - "code-scan"
        - "secrets-scan"

    testing:
      enabled: true
      coverage_threshold: 80
      blocking: true

    logging:
      enabled: true
      threshold: 90
      blocking: false

    documentation:
      enabled: true
      threshold: 85
      blocking: false

    performance:
      enabled: false
      threshold: 90
      blocking: false
