# Sprint State Schema Definition
# Version: 1.0
# This file documents the complete schema for sprint state tracking

# ==============================================================================
# SPRINT TOP-LEVEL
# ==============================================================================
sprint:
  number:
    type: integer
    required: true
    description: "Sprint number (sequential, starts at 1)"
    example: 1

  name:
    type: string
    required: true
    description: "Human-readable sprint name"
    example: "User Authentication System"

  status:
    type: enum
    required: true
    values: ["not_started", "in_progress", "paused", "completed"]
    description: "Current sprint status"

  started:
    type: datetime
    required: false
    description: "ISO 8601 timestamp when sprint was started"
    example: "2025-11-05T14:30:00"

  paused:
    type: datetime
    required: false
    description: "ISO 8601 timestamp when sprint was paused (null if not paused)"
    example: "2025-11-06T18:00:00"

  completed:
    type: datetime
    required: false
    description: "ISO 8601 timestamp when sprint was completed"
    example: "2025-11-12T16:45:00"

  plan_file:
    type: string
    required: true
    description: "Path to sprint plan markdown file"
    example: "docs/sprints/sprint-1-plan.md"

# ==============================================================================
# CURRENT PHASE
# ==============================================================================
current_phase:
  number:
    type: integer
    required: false
    description: "Current phase number (null if sprint not started)"
    example: 1

  name:
    type: string
    required: false
    description: "Current phase name"
    example: "API Development"

  status:
    type: enum
    required: false
    values: ["not_started", "in_progress", "completed"]
    description: "Current phase status"

  started:
    type: datetime
    required: false
    description: "When current phase was started"
    example: "2025-11-05T14:30:00"

  completed:
    type: datetime
    required: false
    description: "When current phase was completed"
    example: "2025-11-08T10:15:00"

# ==============================================================================
# PHASES (Array)
# ==============================================================================
phases:
  type: array
  description: "Array of all phases in the sprint with their state"
  items:
    number:
      type: integer
      required: true
      description: "Phase number"
      example: 1

    name:
      type: string
      required: true
      description: "Phase name"
      example: "API Development"

    status:
      type: enum
      required: true
      values: ["not_started", "in_progress", "completed"]
      description: "Phase status"

    progress_percent:
      type: integer
      required: true
      description: "Estimated progress percentage (0-100)"
      example: 40

    started:
      type: datetime
      required: false
      description: "When phase was started"
      example: "2025-11-05T14:30:00"

    completed:
      type: datetime
      required: false
      description: "When phase was completed"
      example: "2025-11-08T10:15:00"

    agents_run:
      type: array
      description: "List of agents that have been executed in this phase"
      items:
        name:
          type: string
          required: true
          description: "Agent identifier (filename without .md)"
          example: "web-developer"

        timestamp:
          type: datetime
          required: true
          description: "When agent was executed"
          example: "2025-11-05T15:00:00"

        status:
          type: enum
          required: true
          values: ["started", "completed", "failed"]
          description: "Agent execution status"

        notes:
          type: string
          required: false
          description: "Optional notes about agent execution"
          example: "Created 3 API endpoints successfully"

    tasks:
      type: array
      description: "Tasks defined for this phase"
      items:
        description:
          type: string
          required: true
          description: "Task description"
          example: "Implement user registration endpoint"

        completed:
          type: boolean
          required: true
          description: "Whether task is completed"
          example: true

        completed_at:
          type: datetime
          required: false
          description: "When task was completed"
          example: "2025-11-05T16:30:00"

    quality_gates:
      type: array
      description: "Quality gates for this phase"
      items:
        name:
          type: string
          required: true
          description: "Quality gate name"
          example: "Security Audit"

        status:
          type: enum
          required: true
          values: ["not_run", "running", "passed", "failed"]
          description: "Quality gate execution status"

        score:
          type: integer
          required: false
          description: "Quality gate score (0-100, null if not run)"
          example: 92

        threshold:
          type: integer
          required: true
          description: "Minimum passing score"
          example: 85

        blocking:
          type: boolean
          required: true
          description: "Whether this gate blocks phase completion"
          example: true

        checked_at:
          type: datetime
          required: false
          description: "When gate was last checked"
          example: "2025-11-07T11:00:00"

        issues:
          type: array
          required: false
          description: "List of issues found (if gate failed)"
          items:
            type: string
            example: "Missing input validation on /api/users endpoint"

# ==============================================================================
# ACTIVITY LOG (Array)
# ==============================================================================
activity_log:
  type: array
  description: "Chronological log of all sprint activities"
  items:
    timestamp:
      type: datetime
      required: true
      description: "When activity occurred"
      example: "2025-11-05T14:30:00"

    type:
      type: enum
      required: true
      values:
        - "sprint_started"
        - "sprint_paused"
        - "sprint_resumed"
        - "sprint_completed"
        - "phase_started"
        - "phase_completed"
        - "agent_execution"
        - "quality_gate"
        - "task_completed"
        - "note"
      description: "Type of activity"

    description:
      type: string
      required: true
      description: "Human-readable description of activity"
      example: "Security Audit quality gate passed (92/85)"

    metadata:
      type: object
      required: false
      description: "Additional structured data about the activity"
      example:
        phase: 1
        agent: "security-auditor"
        gate_name: "Security Audit"
        score: 92

# ==============================================================================
# METADATA
# ==============================================================================
metadata:
  created_at:
    type: datetime
    required: true
    description: "When this state file was created"
    example: "2025-11-05T14:30:00"

  last_updated:
    type: datetime
    required: true
    description: "When this state file was last modified"
    example: "2025-11-07T11:00:00"

  framework_version:
    type: string
    required: true
    description: "Vibey framework version"
    example: "2.0"

  state_schema_version:
    type: string
    required: true
    description: "Schema version for this state file"
    example: "1.0"
