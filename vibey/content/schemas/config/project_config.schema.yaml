# Project Configuration Schema
# Version: 1.0
# Created: 2025-11-09
# Sprint: core-framework-2, Task 2

$schema: http://json-schema.org/draft-07/schema#
title: Vibey Project Configuration
description: Project-level configuration for Vibey framework deployment
type: object

required:
  - project
  - tech_stack

properties:
  project:
    type: object
    description: Project metadata and identification
    required:
      - name
      - type
    properties:
      name:
        type: string
        description: Project name
        minLength: 1
        maxLength: 100
        examples:
          - "My Web Application"
          - "ML Model Training Pipeline"
          - "REST API Service"

      type:
        type: string
        description: Project type (determines default agents and workflows)
        enum:
          - web-app
          - api
          - ml-model
          - data-platform
          - infrastructure
          - library
          - cli-tool
          - mobile-app
        examples:
          - web-app
          - api

      description:
        type: string
        description: Brief project description
        maxLength: 500
        examples:
          - "Full-stack web application for task management"

      repository:
        type: string
        description: Git repository URL
        format: uri
        examples:
          - "https://github.com/user/repo"
          - "git@github.com:user/repo.git"

      version:
        type: string
        description: Current project version (semver recommended)
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+.*$'
        examples:
          - "1.0.0"
          - "2.1.3-beta"

  tech_stack:
    type: object
    description: Technologies used in the project
    properties:
      languages:
        type: array
        description: Programming languages used
        items:
          type: string
          enum:
            - python
            - javascript
            - typescript
            - java
            - go
            - rust
            - ruby
            - php
            - csharp
            - cpp
            - swift
            - kotlin
            - scala
            - elixir
            - clojure
        minItems: 1
        uniqueItems: true
        examples:
          - ["python", "typescript"]
          - ["go"]

      frameworks:
        type: array
        description: Frameworks and major libraries
        items:
          type: string
        uniqueItems: true
        examples:
          - ["react", "fastapi", "postgresql"]
          - ["django", "celery", "redis"]

      tools:
        type: array
        description: Development and deployment tools
        items:
          type: string
        uniqueItems: true
        examples:
          - ["docker", "kubernetes", "terraform"]
          - ["pytest", "jest", "webpack"]

      databases:
        type: array
        description: Database systems used
        items:
          type: string
          enum:
            - postgresql
            - mysql
            - mongodb
            - redis
            - elasticsearch
            - dynamodb
            - cassandra
            - sqlite
            - neo4j
        uniqueItems: true
        examples:
          - ["postgresql", "redis"]

      cloud_providers:
        type: array
        description: Cloud platforms used
        items:
          type: string
          enum:
            - aws
            - gcp
            - azure
            - digitalocean
            - heroku
            - vercel
            - netlify
        uniqueItems: true
        examples:
          - ["aws"]
          - ["gcp", "vercel"]

  team:
    type: object
    description: Team composition and experience level
    properties:
      size:
        type: string
        description: Team size category
        enum:
          - solo
          - small      # 2-5 people
          - medium     # 6-15 people
          - large      # 16+ people
        default: solo
        examples:
          - solo
          - small

      experience:
        type: string
        description: Overall team experience level
        enum:
          - beginner
          - intermediate
          - advanced
          - expert
        default: intermediate
        examples:
          - intermediate
          - advanced

      roles:
        type: array
        description: Team roles (optional)
        items:
          type: string
          enum:
            - frontend-developer
            - backend-developer
            - full-stack-developer
            - ml-engineer
            - data-engineer
            - devops-engineer
            - security-engineer
            - qa-engineer
            - product-manager
            - designer
        uniqueItems: true
        examples:
          - ["full-stack-developer", "devops-engineer"]

  preferences:
    type: object
    description: User preferences for framework behavior
    properties:
      orchestration_mode:
        type: string
        description: Agent orchestration mode
        enum:
          - simple    # Keyword-based routing
          - balanced  # Pattern-based routing
          - tiered    # Coordinator-based routing
        default: balanced
        examples:
          - balanced

      context_mode:
        type: string
        description: Default context loading mode
        enum:
          - minimal   # ~5KB per dependency
          - summary   # ~20KB per dependency
          - full      # Complete context
        default: summary
        examples:
          - summary

      quality_gates_enabled:
        type: boolean
        description: Enable quality gate enforcement
        default: true
        examples:
          - true

      auto_deploy:
        type: boolean
        description: Automatically deploy framework updates
        default: false
        examples:
          - false

      verbose_logging:
        type: boolean
        description: Enable verbose logging
        default: false
        examples:
          - false

  documentation:
    type: object
    description: Documentation management configuration
    properties:
      sync:
        type: object
        description: Documentation synchronization settings
        properties:
          enabled:
            type: boolean
            description: Enable documentation synchronization
            default: true
            examples:
              - true

          source_dir:
            type: string
            description: Source directory for documentation (relative to project root)
            default: ".vibey/roadmap"
            examples:
              - ".vibey/roadmap"

          target_dir:
            type: string
            description: Target directory for synchronized docs (relative to project root)
            default: "docs/roadmap"
            examples:
              - "docs/roadmap"

          include_patterns:
            type: array
            description: Glob patterns for files to include
            items:
              type: string
            default: ["**/*.md"]
            examples:
              - ["**/*.md"]
              - ["**/*.md", "**/README*"]

          exclude_patterns:
            type: array
            description: Glob patterns for files to exclude
            items:
              type: string
            default: ["**/*.yaml", "**/*.json", "**/context/**"]
            examples:
              - ["**/*.yaml", "**/*.json"]

          delete_orphaned:
            type: boolean
            description: Delete files in target not present in source
            default: false
            examples:
              - false

          auto_sync_on:
            type: array
            description: Events that trigger automatic sync
            items:
              type: string
              enum:
                - task_complete
                - sprint_complete
                - track_complete
                - context_add
            default: ["sprint_complete", "track_complete"]
            examples:
              - ["sprint_complete", "track_complete"]
              - ["task_complete", "sprint_complete", "track_complete", "context_add"]

  metadata:
    type: object
    description: Additional project metadata (optional)
    properties:
      created:
        type: string
        description: Project creation date (ISO 8601)
        format: date-time
        examples:
          - "2025-01-15T00:00:00Z"

      last_updated:
        type: string
        description: Last configuration update (ISO 8601)
        format: date-time
        examples:
          - "2025-11-09T00:00:00Z"

      owner:
        type: string
        description: Project owner or team lead
        examples:
          - "Jane Doe"
          - "Platform Team"

      tags:
        type: array
        description: Project tags for organization
        items:
          type: string
        uniqueItems: true
        examples:
          - ["production", "microservice", "high-priority"]

      documentation_url:
        type: string
        description: Link to project documentation
        format: uri
        examples:
          - "https://docs.example.com"

      slack_channel:
        type: string
        description: Team Slack channel
        examples:
          - "#project-team"

      oncall_rotation:
        type: string
        description: PagerDuty or oncall rotation name
        examples:
          - "platform-team-oncall"

additionalProperties: false

examples:
  - # Web Application Example
    project:
      name: "TaskFlow Web App"
      type: web-app
      description: "Real-time task management application"
      repository: "https://github.com/company/taskflow"
      version: "2.1.0"

    tech_stack:
      languages:
        - typescript
        - python
      frameworks:
        - react
        - nextjs
        - fastapi
        - tailwindcss
      tools:
        - docker
        - webpack
        - pytest
        - jest
      databases:
        - postgresql
        - redis
      cloud_providers:
        - aws

    team:
      size: small
      experience: intermediate
      roles:
        - full-stack-developer
        - devops-engineer

    preferences:
      orchestration_mode: balanced
      context_mode: summary
      quality_gates_enabled: true
      auto_deploy: false
      verbose_logging: false

    metadata:
      created: "2024-06-01T00:00:00Z"
      owner: "Engineering Team"
      tags:
        - production
        - saas
      slack_channel: "#taskflow-dev"

  - # ML Model Example
    project:
      name: "Fraud Detection Model"
      type: ml-model
      description: "Real-time fraud detection using XGBoost"
      repository: "https://github.com/company/fraud-detection"

    tech_stack:
      languages:
        - python
      frameworks:
        - scikit-learn
        - xgboost
        - mlflow
        - fastapi
      tools:
        - docker
        - dvc
        - pytest
      databases:
        - postgresql
        - redis
      cloud_providers:
        - aws

    team:
      size: solo
      experience: advanced

    preferences:
      orchestration_mode: balanced
      context_mode: full
      quality_gates_enabled: true

  - # API Service Example
    project:
      name: "Payment Processing API"
      type: api
      description: "RESTful API for payment processing"
      repository: "https://github.com/company/payment-api"

    tech_stack:
      languages:
        - go
      frameworks:
        - gin
        - gorm
      tools:
        - docker
        - kubernetes
        - terraform
      databases:
        - postgresql
      cloud_providers:
        - gcp

    team:
      size: medium
      experience: expert
      roles:
        - backend-developer
        - devops-engineer
        - security-engineer

    preferences:
      orchestration_mode: tiered
      context_mode: summary
      quality_gates_enabled: true
      auto_deploy: true
