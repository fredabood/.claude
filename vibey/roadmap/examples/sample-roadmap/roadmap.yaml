roadmap:
  # Identity
  id: "example-project"
  name: "Example E-commerce Platform"

  # Version Management
  version: "0.1.0"
  version_strategy:
    major_on: "roadmap_milestone"
    minor_on: "track_completion"
    patch_on: "sprint_production_ready"

  # Status
  status: "in_progress"
  blocked: false

  # Timing
  created: "2025-01-15T10:00:00Z"
  started: "2025-01-16T09:00:00Z"
  target_completion: "2025-06-30T23:59:59Z"
  completed: null
  deployed: null

  # Aggregate Progress
  progress:
    tracks_total: 2
    tracks_completed: 0
    sprints_total: 3
    sprints_completed: 0
    tasks_total: 6
    tasks_completed: 2
    completion_percent: 33

  # Tracks
  tracks:
    - id: "backend"
      name: "Backend API Development"
      status: "in_progress"
      priority: "critical"

    - id: "frontend"
      name: "Frontend UI Development"
      status: "not_started"
      priority: "high"

  # Roadmap-level dependencies (external systems)
  dependencies: []

  # What's blocking the roadmap
  blocked_by: []

  # Version History
  version_history:
    - version: "0.1.0"
      date: "2025-01-15T10:00:00Z"
      milestone: "Project Initialization"
      git_tag: "v0.1.0"
      description: "Initial project setup and planning"

  # UNIFIED ACTIVITY LOG (All roadmap events)
  activity_log:
    - timestamp: "2025-01-15T10:00:00Z"
      type: "roadmap_started"
      description: "Started Example E-commerce Platform roadmap"

    - timestamp: "2025-01-16T09:00:00Z"
      type: "track_started"
      description: "Started backend track"
      context:
        track_id: "backend"

    - timestamp: "2025-01-16T10:00:00Z"
      type: "sprint_started"
      description: "Started sprint backend-1: User Authentication"
      context:
        track_id: "backend"
        sprint_id: "backend-1"

    - timestamp: "2025-01-17T15:00:00Z"
      type: "task_completed"
      description: "Completed task: Create User database schema"
      context:
        track_id: "backend"
        sprint_id: "backend-1"
        task_id: "backend-1-task-001"
        agent: "web-developer"

    - timestamp: "2025-01-18T16:30:00Z"
      type: "task_completed"
      description: "Completed task: Implement registration endpoint"
      context:
        track_id: "backend"
        sprint_id: "backend-1"
        task_id: "backend-1-task-002"
        agent: "web-developer"

  # Metadata
  metadata:
    created_by: "example-team"
    framework_version: "2.1"
    schema_version: "2.1"
    last_updated: "2025-01-18T16:30:00Z"
    purpose: "Example roadmap demonstrating all features"
    description: |
      This is a sample e-commerce platform roadmap showing:
      - Multi-track structure (backend, frontend)
      - Sprint planning with tasks
      - Quality gates
      - Dependency tracking
      - Activity logging
