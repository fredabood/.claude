# Standard Template: Documentation Review Required
#
# Ensures all tasks update documentation when appropriate.
# Uses warning enforcement by default to encourage but not block completion.

template:
  id: doc-review-required
  name: Documentation Review Required
  description: Tasks should update documentation when making significant changes
  type: file_check
  enforcement: warning

  validation:
    pattern: "**/*.md"
    min_files: 1
    exclude_patterns:
      - "**/node_modules/**"
      - "**/vendor/**"
      - "**/.git/**"

  use_case: |
    Use this standard to encourage documentation updates alongside code changes.
    Set to 'warning' enforcement to remind developers without blocking, or
    'blocking' for critical documentation requirements.

  typical_level: track

  examples:
    - level: track
      scenario: Core framework track
      description: All core framework changes should update docs
      enforcement: warning

    - level: track
      scenario: Public API track
      description: All public API changes must update docs (blocking)
      enforcement: blocking

  override_scenarios:
    - reason: Internal refactoring with no API changes
      justification: Code restructuring with no user-facing changes

    - reason: Bug fix with existing documentation
      justification: Fix is already documented, no doc updates needed

  configuration:
    pattern:
      description: Glob pattern for documentation files
      type: string
      default: "**/*.md"
      examples:
        - "docs/**/*.md"
        - "**/*.{md,rst}"
        - "README*.md"

    min_files:
      description: Minimum number of documentation files that must be modified
      type: integer
      default: 1
      range: [1, 999]

    exclude_patterns:
      description: Patterns to exclude from check
      type: list
      default:
        - "**/node_modules/**"
        - "**/vendor/**"
        - "**/.git/**"

  validation_behavior:
    passes_when: At least min_files matching pattern are modified in task commits
    fails_when: Fewer than min_files matching pattern are modified
    error_message: "Task should update documentation. Consider updating relevant *.md files."

  notes: |
    BEST PRACTICES:
    - Use 'warning' enforcement for general encouragement
    - Use 'blocking' enforcement for public APIs and critical features
    - Apply at track level for specific areas (API, core, public features)

    TYPICAL CONFIGURATIONS:
    - Core framework: warning, **/*.md, min 1 file
    - Public API: blocking, docs/api/**/*.md, min 1 file
    - Internal tools: audit, **/*.md, min 1 file

    COMMON OVERRIDES:
    - Internal refactoring
    - Bug fixes with existing docs
    - Test-only changes

    RELATED STANDARDS:
    - commit-required: Ensures work is version controlled
    - test-coverage-required: Ensures tests are included
