# Standard Template: Test Coverage Required
#
# Ensures code changes include tests and meet minimum coverage thresholds.
# Critical for maintaining code quality and preventing regressions.

template:
  id: test-coverage-required
  name: Test Coverage Required
  description: Code changes must include tests and meet coverage thresholds
  type: test_run
  enforcement: blocking

  validation:
    command: pytest --cov --cov-report=term-missing
    threshold: 80
    require_test_files: true

  use_case: |
    Use this standard to enforce test coverage requirements. Ensures all code
    changes include tests and maintain a minimum coverage percentage. Blocks
    completion if tests fail or coverage drops below threshold.

  typical_level: roadmap

  examples:
    - level: roadmap
      scenario: Organization-wide requirement
      description: All code must have 80% test coverage
      threshold: 80

    - level: track
      scenario: Critical infrastructure track
      description: Infrastructure code requires 95% coverage
      threshold: 95

    - level: sprint
      scenario: High-risk feature sprint
      description: Security-sensitive feature requires 100% coverage
      threshold: 100

  override_scenarios:
    - reason: Legacy code refactoring
      justification: Refactoring untested legacy code, tests being added incrementally

    - reason: Prototype or spike work
      justification: Exploratory work to validate approach, will add tests in next sprint

    - reason: UI-only changes
      justification: Visual changes with no business logic, manual testing performed

  configuration:
    command:
      description: Test command to run
      type: string
      default: pytest --cov --cov-report=term-missing
      examples:
        - "pytest --cov --cov-report=term"
        - "npm test -- --coverage"
        - "go test -cover ./..."

    threshold:
      description: Minimum test coverage percentage required
      type: integer
      default: 80
      range: [0, 100]

    require_test_files:
      description: Whether task commits must include test file modifications
      type: boolean
      default: true

  validation_behavior:
    passes_when: Tests pass AND coverage >= threshold AND (test files modified OR !require_test_files)
    fails_when: Tests fail OR coverage < threshold OR (no test files modified AND require_test_files)
    error_message: "Tests failed or coverage below {threshold}%. Add tests and re-run: {command}"

  notes: |
    BEST PRACTICES:
    - Apply at roadmap level for baseline (80%)
    - Increase threshold at track level for critical code (90-95%)
    - Set to 100% at sprint level for high-risk features
    - Use blocking enforcement for production code
    - Use warning enforcement for prototypes/spikes

    THRESHOLD RECOMMENDATIONS:
    - General code: 80%
    - Core framework: 90%
    - Security/financial: 95-100%
    - Infrastructure: 90-95%
    - Prototypes: 60-70% (warning mode)

    COMMON OVERRIDES:
    - Legacy code refactoring (temporary)
    - Exploratory prototypes
    - UI-only changes with manual testing
    - External library integrations (tested upstream)

    RELATED STANDARDS:
    - commit-required: Ensures code is version controlled
    - multi-platform-testing: Tests across platforms
    - security-review: Security-specific testing
